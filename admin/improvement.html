<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>উন্নতি ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 850px; padding-bottom: 40px; margin: 0 auto; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: 16px 20px;
    background: var(--surface);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(128,128,128,0.1);
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .btn-glass {
    background: rgba(128, 128, 128, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(128, 128, 128, 0.15);
    border-radius: 12px; color: var(--text-primary); padding: 10px 16px; font-weight: 800; font-size: 0.9rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-glass:hover { background: rgba(128, 128, 128, 0.1); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";

initTheme();
const shell = document.getElementById("shell");

requireAdmin(async () => {
  shell.innerHTML = `
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="../admin/dashboard.html" class="btn-glass" style="width:42px; height:42px; padding:0; border-radius:12px; border:none; background:rgba(128,128,128,0.1);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <h2 style="font-size:1.15rem; font-weight:900; color:var(--text-primary); margin:0;">উন্নতি ব্যবস্থাপনা</h2>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="theme-toggle" id="themeToggle" style="margin:0;"><span class="theme-toggle-thumb"></span></button>
        <button class="btn-glass" id="logoutBtn" style="width:42px;height:42px;padding:0;border-color:rgba(239,68,68,0.3);color:var(--danger);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  `;

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);

  // The Improvement Control Center is self-contained: it renders its own
  // queue / review / publish / assign UI straight into this shell (it looks
  // for the first ".app-shell" element on the page). This is the same
  // module the old, unused admin.html CMS page used to import — it was
  // simply never linked into the real admin flow (dashboard -> pages).
  await import("../js/utils/improvement-admin-control-center.js");
});
</script>
</body>
</html>
