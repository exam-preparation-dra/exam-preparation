<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9973f">
<title>উন্নতি — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; }
  .app-shell { max-width: 900px; padding-bottom: 40px; margin: 0 auto; }

  /* Same topbar as the other admin pages */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: 16px 20px;
    background: var(--surface);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--surface-border);
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .btn-glass {
    background: rgba(128,128,128,0.05); border: 1px solid rgba(128,128,128,0.15);
    border-radius: 12px; color: var(--text-primary); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
    transition: all .2s ease;
  }
  .btn-glass:hover { background: rgba(128,128,128,0.1); transform: translateY(-2px); }
  .btn-glass:active { transform: scale(.96); }

  .page-sub { margin: 0 2px 16px; font-size: .8rem; font-weight: 700; line-height: 1.6; color: var(--text-muted); }
  .footer-note { margin: 18px 4px 0; text-align: center; color: var(--text-muted); font-size: .68rem; font-weight: 600; line-height: 1.6; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="../admin/dashboard.html" class="btn-glass" style="width:42px; height:42px; padding:0;" aria-label="ড্যাশবোর্ড">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 style="font-size:1.2rem; font-weight:900; color:var(--text-primary); margin:0;">উন্নতি ব্যবস্থাপনা</h2>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="ডে নাইট মোড" style="margin:0;"><span class="theme-toggle-thumb"></span></button>
      <button class="btn-glass" id="logoutBtn" type="button" aria-label="লগআউট" style="width:42px;height:42px;padding:0;border-color:rgba(239,68,68,0.3);color:#ef4444;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <p class="page-sub">শিক্ষার্থীদের দুর্বল অংশ দেখো, Improvement Exam তৈরি ও Publish করো, দরকার হলে মুছে দাও।</p>

  <div id="controlCenterMount" aria-live="polite">
    <div class="state-block"><div class="spinner"></div></div>
  </div>

  <p class="footer-note">Exam মুছলে শিক্ষার্থীর আগে অর্জন করা XP ঠিক থাকে।</p>
</div>

<script type="module">
import { initTheme, toggleTheme } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";

initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);
document.getElementById("logoutBtn")?.addEventListener("click", adminLogout);

const shell = document.getElementById("shell");
const mount = document.getElementById("controlCenterMount");

requireAdmin(async () => {
  try {
    await import("../js/utils/improvement-admin-control-center.js");

    const moveControlCenter = () => {
      const center = document.getElementById("improvementAdminControlCenter");
      if (!center || !mount) return false;
      mount.replaceWith(center);
      return true;
    };

    if (!moveControlCenter()) {
      const observer = new MutationObserver(() => {
        if (moveControlCenter()) observer.disconnect();
      });
      observer.observe(shell, { childList: true, subtree: true });
      setTimeout(() => observer.disconnect(), 15000);
    }
  } catch (error) {
    console.error("Improvement Admin load failed:", error);
    if (mount) {
      mount.innerHTML = `<div style="padding:16px;border:1px solid rgba(239,68,68,.22);border-radius:16px;background:rgba(239,68,68,.06);color:var(--text-primary);font-size:12px"><strong>Improvement Center লোড করা যায়নি</strong><br><span style="color:var(--text-muted)">${String(error?.message || "Admin module বা Firestore connection পরীক্ষা করুন।")}</span></div>`;
    }
  }
});
</script>
</body>
</html>
