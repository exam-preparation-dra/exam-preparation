<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষা সম্পাদনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  
  body { 
    overflow: hidden; 
    background: var(--bg); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0; 
  }
  
  /* ===== Premium Glass Loading Card ===== */
  .glass-card {
    background: rgba(128, 128, 128, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 24px; padding: 40px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02); text-align: center; max-width: 360px; width: 90%;
    animation: cardRise 500ms cubic-bezier(0.22, 0.9, 0.3, 1) both;
  }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .spinner-box { margin-bottom: 24px; display: flex; justify-content: center; position: relative; }
  .spinner { 
    width: 44px; height: 44px; border-width: 3.5px; 
    border-color: rgba(var(--color-accent-rgb), 0.2); 
    border-top-color: var(--color-accent); 
  }
  
  .icon-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--color-accent); opacity: 0.8;
  }
  
  .loading-title { font-size: 1.25rem; font-weight: 900; color: var(--text-primary); margin-bottom: 10px; }
  .loading-sub { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; line-height: 1.6; }
</style>
</head>
<body>

<div class="glass-card">
  <div class="spinner-box">
    <div class="spinner"></div>
    <svg class="icon-center" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </div>
  <p class="loading-title">প্রস্তুত করা হচ্ছে...</p>
  <p class="loading-sub">পরীক্ষা সম্পাদনার মূল পাতায় নিয়ে যাওয়া হচ্ছে, অনুগ্রহ করে একটু অপেক্ষা করুন।</p>
</div>

<script type="module">
  import { initTheme } from "../js/utils/ui-utils.js";
  initTheme();
  
  // Draft editing uses the exact same form/logic as creation (admin/exam-create.html),
  // just pre-filled from an existing exam ID. This avoids maintaining two copies of the same builder.
  setTimeout(() => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (!id) {
      window.location.href = "../admin/exams.html";
    } else {
      window.location.href = `../admin/exam-create.html?id=${encodeURIComponent(id)}`;
    }
  }, 600); // 0.6s delay added just to smoothly show the premium animation before redirecting
</script>
</body>
</html>
