<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সিলেবাস ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import {
  getFullSyllabusTree, addSubject, updateSubject, setSubjectActive,
  addChapter, updateChapter, setChapterActive,
  addTopic, updateTopic, setTopicActive
} from "../js/utils/syllabus-utils.js";
import { translateSyllabusTerm, promptForApiKey } from "../js/utils/ai-import-utils.js";

initTheme();
const shell = document.getElementById("shell");
let tree = [];
let openSubjectId = null;
let openChapterId = null;

requireAdmin(() => {
  shell.innerHTML = `
    <div class="topbar">
      <a href="../admin/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">সিলেবাস ব্যবস্থাপনা</h2>
      <div class="flex gap-2">
        <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
        <button class="icon-btn" id="logoutBtn">${icons.arrowRight}</button>
      </div>
    </div>

    <button type="button" class="btn btn-primary" id="openWizardBtn" style="width:100%;">✨ নতুন অধ্যায় বানান (সহজ, ধাপে ধাপে)</button>

    <form id="addSubjectForm" class="glass card mt-4">
      <p class="eyebrow mb-2">নতুন বিষয় যোগ করুন</p>
      <p class="text-xs text-muted mb-2">এটা শুধু একদম নতুন কোনো বিষয় (যেমন: পদার্থবিজ্ঞান) যোগ করার জন্য — সাধারণত খুব কম দরকার হয়। অধ্যায়/টপিক বানাতে ওপরের বাটন ব্যবহার করুন।</p>
      <div class="flex gap-2 mt-2">
        <input class="input" id="newSubjectBn" placeholder="বাংলা নাম (যেমন: পদার্থবিজ্ঞান)" required>
        <button type="submit" class="btn btn-primary btn-sm">${icons.plus}</button>
      </div>
      <input class="input mt-2" id="newSubjectEn" placeholder="English name (e.g. Physics)" required>
    </form>

    <div id="tree" class="mt-4"></div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  document.getElementById("addSubjectForm").addEventListener("submit", handleAddSubject);
  document.getElementById("openWizardBtn").addEventListener("click", openWizard);
  loadTree();
});

async function loadTree() {
  const el = document.getElementById("tree");
  try {
    tree = await getFullSyllabusTree();
    renderTree();
  } catch (err) {
    console.error(err);
    renderState(el, "error", "সিলেবাস লোড করা যায়নি।");
  }
}

function renderTree() {
  const el = document.getElementById("tree");
  if (tree.length === 0) {
    renderState(el, "empty", "এখনো কোনো বিষয় যোগ করা হয়নি।");
    return;
  }

  el.innerHTML = tree.map(subject => `
    <div class="glass card mt-2">
      <div class="flex justify-between items-center subject-header" data-id="${subject.id}" style="cursor:pointer;">
        <div class="flex items-center gap-2">
          <span class="icon-btn" style="width:32px;height:32px;">${icons.layers}</span>
          <div>
            <p style="font-weight:700;">${subject.name_bn}${subject.isActive ? "" : " (নিষ্ক্রিয়)"}</p>
            <p class="text-xs text-muted">${subject.chapters.length} টি অধ্যায়</p>
          </div>
        </div>
        <div class="flex gap-1 items-center">
          <button class="icon-btn edit-subject" data-id="${subject.id}" title="সম্পাদনা">${icons.edit}</button>
          <button class="icon-btn toggle-subject" data-id="${subject.id}" title="সক্রিয়/নিষ্ক্রিয়">${icons.toggle}</button>
          <span style="width:18px;height:18px;">${openSubjectId === subject.id ? icons.chevronDown : icons.arrowRight}</span>
        </div>
      </div>

      ${openSubjectId === subject.id ? `
        <div class="mt-3" style="border-top:1px solid var(--surface-border);padding-top:12px;">
          <form class="add-chapter-form flex gap-2" data-subject="${subject.id}">
            <input class="input" name="bn" placeholder="অধ্যায়ের বাংলা নাম" required>
            <input class="input" name="en" placeholder="English name" required style="max-width:140px;">
            <button type="submit" class="btn btn-primary btn-sm">${icons.plus}</button>
          </form>

          ${subject.chapters.map(chapter => `
            <div class="mt-3" style="background:var(--surface-solid);border-radius:var(--radius-sm);padding:12px;">
              <div class="flex justify-between items-center chapter-header" data-id="${chapter.id}" style="cursor:pointer;">
                <div>
                  <p style="font-weight:600;font-size:0.9rem;">${chapter.name_bn}${chapter.isActive ? "" : " (নিষ্ক্রিয়)"}</p>
                  <p class="text-xs text-muted">${chapter.topics.length} টি টপিক</p>
                </div>
                <div class="flex gap-1 items-center">
                  <button class="icon-btn btn-sm edit-chapter" data-id="${chapter.id}" title="সম্পাদনা" style="width:34px;height:34px;">${icons.edit}</button>
                  <button class="icon-btn btn-sm toggle-chapter" data-id="${chapter.id}" title="সক্রিয়/নিষ্ক্রিয়" style="width:34px;height:34px;">${icons.toggle}</button>
                  <span style="width:16px;height:16px;">${openChapterId === chapter.id ? icons.chevronDown : icons.arrowRight}</span>
                </div>
              </div>

              ${openChapterId === chapter.id ? `
                <div class="mt-2" style="border-top:1px solid var(--surface-border);padding-top:10px;">
                  <form class="add-topic-form flex gap-2" data-chapter="${chapter.id}" data-subject="${subject.id}">
                    <input class="input" name="bn" placeholder="টপিকের বাংলা নাম" required>
                    <input class="input" name="en" placeholder="English name" required style="max-width:130px;">
                    <button type="submit" class="btn btn-primary btn-sm">${icons.plus}</button>
                  </form>
                  ${chapter.topics.map(topic => `
                    <div class="flex justify-between items-center mt-2" data-id="${topic.id}">
                      <p class="text-sm">${topic.name_bn}${topic.isActive ? "" : " (নিষ্ক্রিয়)"}</p>
                      <div class="flex gap-1">
                        <button class="icon-btn edit-topic" data-id="${topic.id}" style="width:30px;height:30px;">${icons.edit}</button>
                        <button class="icon-btn toggle-topic" data-id="${topic.id}" style="width:30px;height:30px;">${icons.toggle}</button>
                      </div>
                    </div>
                  `).join("") || `<p class="text-xs text-muted mt-2">কোনো টপিক নেই।</p>`}
                </div>
              ` : ""}
            </div>
          `).join("") || `<p class="text-xs text-muted mt-2">কোনো অধ্যায় নেই।</p>`}
        </div>
      ` : ""}
    </div>
  `).join("");

  attachTreeEvents();
}

function attachTreeEvents() {
  document.querySelectorAll(".subject-header").forEach(h => h.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    const id = h.dataset.id;
    openSubjectId = openSubjectId === id ? null : id;
    openChapterId = null;
    renderTree();
  }));
  document.querySelectorAll(".chapter-header").forEach(h => h.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    const id = h.dataset.id;
    openChapterId = openChapterId === id ? null : id;
    renderTree();
  }));

  document.querySelectorAll(".edit-subject").forEach(b => b.addEventListener("click", async () => {
    const s = findSubject(b.dataset.id);
    const name = prompt("বাংলা নাম:", s.name_bn);
    if (name === null || !name.trim()) return;
    try { await updateSubject(s.id, { name_bn: name.trim() }); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));
  document.querySelectorAll(".toggle-subject").forEach(b => b.addEventListener("click", async () => {
    const s = findSubject(b.dataset.id);
    if (!confirm(`${s.name_bn} ${s.isActive ? "নিষ্ক্রিয়" : "সক্রিয়"} করবেন?`)) return;
    try { await setSubjectActive(s.id, !s.isActive); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));

  document.querySelectorAll(".edit-chapter").forEach(b => b.addEventListener("click", async () => {
    const c = findChapter(b.dataset.id);
    const name = prompt("বাংলা নাম:", c.name_bn);
    if (name === null || !name.trim()) return;
    try { await updateChapter(c.id, { name_bn: name.trim() }); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));
  document.querySelectorAll(".toggle-chapter").forEach(b => b.addEventListener("click", async () => {
    const c = findChapter(b.dataset.id);
    if (!confirm(`${c.name_bn} ${c.isActive ? "নিষ্ক্রিয়" : "সক্রিয়"} করবেন?`)) return;
    try { await setChapterActive(c.id, !c.isActive); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));

  document.querySelectorAll(".edit-topic").forEach(b => b.addEventListener("click", async () => {
    const t = findTopic(b.dataset.id);
    const name = prompt("বাংলা নাম:", t.name_bn);
    if (name === null || !name.trim()) return;
    try { await updateTopic(t.id, { name_bn: name.trim() }); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));
  document.querySelectorAll(".toggle-topic").forEach(b => b.addEventListener("click", async () => {
    const t = findTopic(b.dataset.id);
    if (!confirm(`${t.name_bn} ${t.isActive ? "নিষ্ক্রিয়" : "সক্রিয়"} করবেন?`)) return;
    try { await setTopicActive(t.id, !t.isActive); showToast("আপডেট হয়েছে।", "success"); loadTree(); }
    catch (err) { showToast(friendlyError(err), "error"); }
  }));

  document.querySelectorAll(".add-chapter-form").forEach(f => f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const subjectId = f.dataset.subject;
    const bn = f.bn.value.trim(), en = f.en.value.trim();
    if (!bn || !en) return;
    try {
      await addChapter({ subjectId, name_bn: bn, name_en: en });
      showToast("অধ্যায় যোগ হয়েছে।", "success");
      openSubjectId = subjectId;
      loadTree();
    } catch (err) { showToast(friendlyError(err), "error"); }
  }));

  document.querySelectorAll(".add-topic-form").forEach(f => f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const chapterId = f.dataset.chapter, subjectId = f.dataset.subject;
    const bn = f.bn.value.trim(), en = f.en.value.trim();
    if (!bn || !en) return;
    try {
      await addTopic({ chapterId, subjectId, name_bn: bn, name_en: en });
      showToast("টপিক যোগ হয়েছে।", "success");
      openSubjectId = subjectId; openChapterId = chapterId;
      loadTree();
    } catch (err) { showToast(friendlyError(err), "error"); }
  }));
}

// =========================================================
// GUIDED WIZARD — replaces the old "type Bengali AND English into two
// boxes for subject/chapter/topic all at once" flow, which was confusing.
// Now: type a chapter name in EITHER language, AI fills in the other one
// for you to confirm before moving on. Topics are fully optional and
// repeatable — skip straight to "তৈরি করুন" with zero topics if you just
// want the chapter for now, or add as many as you like first.
// =========================================================
let wizardState = null; // { subjectId, chapterBn, chapterEn, topics: [{bn,en}] }
let wizardStep = "subject"; // "subject" -> "chapter" -> "topics" -> "review"
let wizardNewSubjectMode = false;

function openWizard() {
  wizardState = { subjectId: "", chapterBn: "", chapterEn: "", topics: [] };
  wizardStep = "subject";
  wizardNewSubjectMode = false;
  renderWizard();
}

function closeWizard() {
  document.getElementById("wizardOverlay")?.remove();
}

function renderWizard() {
  let overlay = document.getElementById("wizardOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "wizardOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <div class="glass card" style="max-width:460px;width:100%;max-height:85vh;overflow-y:auto;">
      <div class="flex justify-between items-center">
        <p class="eyebrow">নতুন অধ্যায় বানান</p>
        <button class="icon-btn" id="wizardCloseBtn" style="width:30px;height:30px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="wizardBody" class="mt-3"></div>
    </div>
  `;
  overlay.querySelector("#wizardCloseBtn").addEventListener("click", closeWizard);
  renderWizardStep();
}

function renderWizardStep() {
  const body = document.getElementById("wizardBody");

  if (wizardStep === "subject") {
    if (wizardNewSubjectMode) {
      const translated = wizardState.newSubjectBn && wizardState.newSubjectEn;
      body.innerHTML = `
        <p class="text-xs text-muted mb-2">নতুন বিষয়ের নাম লেখো — বাংলা বা ইংরেজি, যেকোনো একটাতেই হবে।</p>
        ${translated ? `
          <div class="field"><label>বাংলা নাম</label><input class="input" id="wzNewSubjectBn" value="${wizardState.newSubjectBn}"></div>
          <div class="field mt-2"><label>English name</label><input class="input" id="wzNewSubjectEn" value="${wizardState.newSubjectEn}"></div>
        ` : `
          <input class="input" id="wzNewSubjectRaw" placeholder="যেমন: রসায়ন, অথবা Chemistry">
        `}
        <div class="flex gap-2 mt-3">
          <button type="button" class="btn btn-secondary" id="wzBackToSelectBtn" style="flex:1;">বিষয় বাছাই করবো</button>
          <button type="button" class="btn btn-primary" id="wzNextBtn" style="flex:1;">${translated ? "তৈরি করে এগিয়ে যাও" : "রূপান্তর করো"}</button>
        </div>
      `;
      document.getElementById("wzBackToSelectBtn").addEventListener("click", () => { wizardNewSubjectMode = false; renderWizardStep(); });
      document.getElementById("wzNextBtn").addEventListener("click", async () => {
        if (translated) {
          const bn = document.getElementById("wzNewSubjectBn").value.trim();
          const en = document.getElementById("wzNewSubjectEn").value.trim();
          if (!bn || !en) { showToast("দুটো নামই লাগবে।", "error"); return; }
          const btn = document.getElementById("wzNextBtn");
          btn.disabled = true; btn.textContent = "তৈরি হচ্ছে...";
          try {
            const ref = await addSubject({ name_bn: bn, name_en: en });
            tree = await getFullSyllabusTree(); // refresh so the new subject is selectable everywhere else too
            wizardState.subjectId = ref.id;
            wizardNewSubjectMode = false;
            wizardStep = "chapter";
            renderWizardStep();
          } catch (err) {
            showToast(friendlyError(err), "error");
            btn.disabled = false; btn.textContent = "তৈরি করে এগিয়ে যাও";
          }
        } else {
          const raw = document.getElementById("wzNewSubjectRaw").value.trim();
          if (!raw) { showToast("বিষয়ের নাম লেখো।", "error"); return; }
          await runTranslateStep(raw, (result) => {
            wizardState.newSubjectBn = result.bn;
            wizardState.newSubjectEn = result.en;
            renderWizardStep();
          });
        }
      });
      return;
    }

    body.innerHTML = `
      <p class="text-xs text-muted mb-2">কোন বিষয়ের নিচে এই অধ্যায়টা যোগ হবে?</p>
      <select class="select" id="wzSubject">
        <option value="">বিষয় বাছাই করো</option>
        ${tree.map(s => `<option value="${s.id}" ${wizardState.subjectId === s.id ? "selected" : ""}>${s.name_bn}</option>`).join("")}
      </select>
      <button type="button" class="btn btn-secondary mt-2" id="wzNewSubjectToggleBtn" style="width:100%;">+ এটা নতুন একটা বিষয়, আগে বানাতে হবে</button>
      <button type="button" class="btn btn-primary mt-3" id="wzNextBtn" style="width:100%;">পরবর্তী</button>
    `;
    document.getElementById("wzNewSubjectToggleBtn").addEventListener("click", () => { wizardNewSubjectMode = true; renderWizardStep(); });
    document.getElementById("wzNextBtn").addEventListener("click", () => {
      const val = document.getElementById("wzSubject").value;
      if (!val) { showToast("একটা বিষয় বাছাই করো, অথবা ওপরের বাটন দিয়ে নতুন বিষয় বানাও।", "error"); return; }
      wizardState.subjectId = val;
      wizardStep = "chapter";
      renderWizardStep();
    });
    return;
  }

  if (wizardStep === "chapter") {
    const translated = wizardState.chapterBn && wizardState.chapterEn;
    body.innerHTML = `
      <p class="text-xs text-muted mb-2">অধ্যায়ের নাম লেখো — বাংলা বা ইংরেজি, যেকোনো একটাতেই হবে।</p>
      ${translated ? `
        <div class="field"><label>বাংলা নাম</label><input class="input" id="wzChapterBn" value="${wizardState.chapterBn}"></div>
        <div class="field mt-2"><label>English name</label><input class="input" id="wzChapterEn" value="${wizardState.chapterEn}"></div>
      ` : `
        <input class="input" id="wzChapterRaw" placeholder="যেমন: আলো, অথবা Light">
      `}
      <div class="flex gap-2 mt-3">
        <button type="button" class="btn btn-secondary" id="wzPrevBtn" style="flex:1;">পূর্ববর্তী</button>
        <button type="button" class="btn btn-primary" id="wzNextBtn" style="flex:1;">${translated ? "পরবর্তী" : "রূপান্তর করো"}</button>
      </div>
    `;
    document.getElementById("wzPrevBtn").addEventListener("click", () => { wizardStep = "subject"; renderWizardStep(); });
    document.getElementById("wzNextBtn").addEventListener("click", async () => {
      if (translated) {
        wizardState.chapterBn = document.getElementById("wzChapterBn").value.trim();
        wizardState.chapterEn = document.getElementById("wzChapterEn").value.trim();
        if (!wizardState.chapterBn || !wizardState.chapterEn) { showToast("দুটো নামই লাগবে।", "error"); return; }
        wizardStep = "topics";
        renderWizardStep();
      } else {
        const raw = document.getElementById("wzChapterRaw").value.trim();
        if (!raw) { showToast("অধ্যায়ের নাম লেখো।", "error"); return; }
        await runTranslateStep(raw, (result) => {
          wizardState.chapterBn = result.bn;
          wizardState.chapterEn = result.en;
          renderWizardStep();
        });
      }
    });
    return;
  }

  if (wizardStep === "topics") {
    body.innerHTML = `
      <p class="text-xs text-muted mb-2">চাইলে এই অধ্যায়ের টপিক যোগ করো (একদম ঐচ্ছিক — কিছু না দিয়েও এগিয়ে যেতে পারো)।</p>
      <div id="wzTopicsList">
        ${wizardState.topics.map((t, i) => `
          <div class="flex justify-between items-center mt-2" style="background:var(--surface-solid);border-radius:var(--radius-sm);padding:8px 10px;">
            <p class="text-sm">${t.bn} <span class="text-xs text-muted">(${t.en})</span></p>
            <button type="button" class="icon-btn wz-remove-topic" data-idx="${i}" style="width:26px;height:26px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        `).join("")}
      </div>
      <input class="input mt-3" id="wzTopicRaw" placeholder="টপিকের নাম (বাংলা/ইংরেজি) — খালি রেখে এড়িয়ে যাও">
      <button type="button" class="btn btn-secondary mt-2" id="wzAddTopicBtn" style="width:100%;">+ এই টপিকটা যোগ করো</button>
      <div class="flex gap-2 mt-3">
        <button type="button" class="btn btn-secondary" id="wzPrevBtn" style="flex:1;">পূর্ববর্তী</button>
        <button type="button" class="btn btn-primary" id="wzNextBtn" style="flex:1;">পরবর্তী</button>
      </div>
    `;
    document.querySelectorAll(".wz-remove-topic").forEach(b => b.addEventListener("click", () => {
      wizardState.topics.splice(Number(b.dataset.idx), 1);
      renderWizardStep();
    }));
    document.getElementById("wzAddTopicBtn").addEventListener("click", async () => {
      const raw = document.getElementById("wzTopicRaw").value.trim();
      if (!raw) { showToast("টপিকের নাম লেখো, নাহলে সরাসরি \"পরবর্তী\"-তে যাও।", "error"); return; }
      await runTranslateStep(raw, (result) => {
        wizardState.topics.push(result);
        renderWizardStep();
      });
    });
    document.getElementById("wzPrevBtn").addEventListener("click", () => { wizardStep = "chapter"; renderWizardStep(); });
    document.getElementById("wzNextBtn").addEventListener("click", () => { wizardStep = "review"; renderWizardStep(); });
    return;
  }

  if (wizardStep === "review") {
    const subject = findSubject(wizardState.subjectId);
    body.innerHTML = `
      <p class="text-xs text-muted">বিষয়</p>
      <p style="font-weight:700;">${subject?.name_bn || "—"}</p>
      <p class="text-xs text-muted mt-3">অধ্যায়</p>
      <p style="font-weight:700;">${wizardState.chapterBn} <span class="text-xs text-muted">(${wizardState.chapterEn})</span></p>
      <p class="text-xs text-muted mt-3">টপিক (${wizardState.topics.length})</p>
      ${wizardState.topics.length
        ? wizardState.topics.map(t => `<p class="text-sm mt-1">• ${t.bn} <span class="text-xs text-muted">(${t.en})</span></p>`).join("")
        : `<p class="text-sm text-muted mt-1">কোনো টপিক দেওয়া হয়নি — পরে যোগ করা যাবে।</p>`}
      <div class="flex gap-2 mt-4">
        <button type="button" class="btn btn-secondary" id="wzPrevBtn" style="flex:1;">পূর্ববর্তী</button>
        <button type="button" class="btn btn-primary" id="wzCreateBtn" style="flex:1;">তৈরি করুন</button>
      </div>
    `;
    document.getElementById("wzPrevBtn").addEventListener("click", () => { wizardStep = "topics"; renderWizardStep(); });
    document.getElementById("wzCreateBtn").addEventListener("click", handleWizardCreate);
    return;
  }
}

async function runTranslateStep(raw, onDone) {
  const btn = document.getElementById("wzNextBtn") || document.getElementById("wzAddTopicBtn");
  const apiKey = promptForApiKey(false);
  if (!apiKey) { showToast("AI রূপান্তরের জন্য একটা Gemini API key লাগবে।", "error"); return; }
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "রূপান্তর হচ্ছে...";
  try {
    const result = await translateSyllabusTerm(apiKey, raw);
    onDone(result);
  } catch (err) {
    console.error(err);
    showToast(err.message || friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function handleWizardCreate() {
  const btn = document.getElementById("wzCreateBtn");
  btn.disabled = true;
  btn.textContent = "তৈরি হচ্ছে...";
  try {
    const chapterRef = await addChapter({
      subjectId: wizardState.subjectId,
      name_bn: wizardState.chapterBn,
      name_en: wizardState.chapterEn
    });
    const chapterId = chapterRef.id || chapterRef; // tolerate either a DocumentReference or a bare id string
    for (const topic of wizardState.topics) {
      await addTopic({ chapterId, subjectId: wizardState.subjectId, name_bn: topic.bn, name_en: topic.en });
    }
    showToast(`অধ্যায় তৈরি হয়েছে${wizardState.topics.length ? ` (${wizardState.topics.length} টি টপিকসহ)` : ""}।`, "success");
    closeWizard();
    openSubjectId = wizardState.subjectId;
    loadTree();
  } catch (err) {
    console.error(err);
    showToast(friendlyError(err), "error");
    btn.disabled = false;
    btn.textContent = "তৈরি করুন";
  }
}

function findSubject(id) { return tree.find(s => s.id === id); }
function findChapter(id) { for (const s of tree) { const c = s.chapters.find(c => c.id === id); if (c) return c; } }
function findTopic(id) { for (const s of tree) for (const c of s.chapters) { const t = c.topics.find(t => t.id === id); if (t) return t; } }

async function handleAddSubject(e) {
  e.preventDefault();
  const bnInput = document.getElementById("newSubjectBn");
  const enInput = document.getElementById("newSubjectEn");
  const bn = bnInput.value.trim(), en = enInput.value.trim();
  if (!bn || !en) return;
  try {
    await addSubject({ name_bn: bn, name_en: en, order: tree.length });
    bnInput.value = ""; enInput.value = "";
    showToast("বিষয় যোগ হয়েছে।", "success");
    loadTree();
  } catch (err) {
    showToast(friendlyError(err), "error");
  }
}
</script>
</body>
</html>
