<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন লগইন — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-bn); }
  .box { width: 100%; max-width: 380px; }
  .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 28px 22px; box-shadow: var(--shadow-soft); }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--color-accent); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; }
  .sub { font-size: .85rem; color: var(--text-muted); margin: 0 0 22px; }
  label { display: block; font-size: .8rem; font-weight: 700; color: var(--text-secondary); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .wrap { position: relative; }
  input { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--surface-border); background: var(--surface-solid); color: inherit; font: inherit; font-size: .95rem; outline: none; transition: border-color var(--transition); }
  input:focus { border-color: var(--color-accent); }
  .wrap input { padding-right: 46px; }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .eye:hover { color: var(--text-primary); }
  .eye svg { width: 19px; height: 19px; }
  .err { display: none; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: rgba(166,64,47,.10); color: var(--color-danger); font-size: .8rem; font-weight: 700; line-height: 1.45; }
  .err.show { display: block; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--color-accent); color: #fff; font: inherit; font-size: .95rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.99); }
  .btn:disabled { opacity: .65; cursor: default; }
  .back { display: block; text-align: center; margin-top: 18px; font-size: .82rem; font-weight: 700; color: var(--text-muted); text-decoration: none; }
  .back:hover { color: var(--color-accent); }
</style>
</head>
<body>
<div class="box">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>অ্যাডমিন লগইন</h1>
    <p class="sub">চালিয়ে যেতে পাসওয়ার্ড দাও</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="password">পাসওয়ার্ড</label>
        <div class="wrap">
          <input type="password" id="password" required autocomplete="current-password" placeholder="পাসওয়ার্ড" autofocus>
          <button type="button" class="eye" id="eyeBtn" aria-label="পাসওয়ার্ড দেখাও">
            <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <svg id="eyeOn" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div id="err" class="err" role="alert"></div>

      <button type="submit" class="btn" id="loginBtn">প্রবেশ করো</button>
    </form>
  </div>
  <a href="../index.html" class="back">← শিক্ষার্থী পেজে ফিরে যাও</a>
</div>

<script type="module">
import { initTheme, friendlyError } from "../js/utils/ui-utils.js";
import { adminLogin, redirectIfLoggedIn } from "../js/utils/auth.js";

initTheme();
redirectIfLoggedIn();

const $ = id => document.getElementById(id);
const form = $("loginForm"), btn = $("loginBtn"), err = $("err"), pw = $("password");

$("eyeBtn").addEventListener("click", () => {
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  $("eyeOff").style.display = show ? "none" : "";
  $("eyeOn").style.display = show ? "" : "none";
});

const showErr = (m) => { err.textContent = m; err.classList.add("show"); };

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.remove("show");
  if (!pw.value) { showErr("পাসওয়ার্ড লেখো।"); return; }
  btn.disabled = true; btn.textContent = "যাচাই হচ্ছে…";
  try {
    await adminLogin(pw.value);
    window.location.href = "../admin/dashboard.html";
  } catch (e2) {
    showErr(e2?.code === "auth/not-admin" ? e2.message : friendlyError(e2));
    btn.disabled = false; btn.textContent = "প্রবেশ করো";
  }
});
</script>
</body>
</html>
