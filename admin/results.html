<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল অনুমোদন — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Hidden render target for the result-card image export (html2canvas). -->
<div id="cardArea" style="position:fixed;left:-9999px;top:0;"></div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { db } from "../js/firebase/firebase-config.js";
import { collection, doc, getDocs, getDoc, query, where, orderBy, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import { getExamSnapshot, getExamById, getApprovedResults, getAllApprovedResults } from "../js/utils/results-utils.js";
import { getActiveStudents } from "../js/utils/student-utils.js";
import { buildQuestionReview, formatSeconds } from "../js/utils/grading-utils.js";

initTheme();
const shell = document.getElementById("shell");
let activeTab = "pending";
let subjectMap = {}, chapterMap = {};

requireAdmin(async () => {
  shell.innerHTML = `
    <div class="topbar">
      <a href="../admin/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">ফলাফল অনুমোদন</h2>
      <div class="flex gap-2">
        <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
        <button class="icon-btn hidden" id="installBtn" title="অ্যাপ ইনস্টল করুন"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>
        <button class="icon-btn" id="logoutBtn">${icons.arrowRight}</button>
      </div>
    </div>

    <div class="flex gap-2">
      <button class="btn btn-primary btn-sm" id="tabPending">অনুমোদনের অপেক্ষায়</button>
      <button class="btn btn-secondary btn-sm" id="tabApproved">অনুমোদিত</button>
    </div>

    <div id="listBody" class="mt-4"></div>
    <div id="detailOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(10,14,26,0.6);z-index:300;overflow-y:auto;padding:20px;"></div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  document.getElementById("tabPending").addEventListener("click", () => { activeTab = "pending"; refreshTabs(); load(); });
  document.getElementById("tabApproved").addEventListener("click", () => { activeTab = "approved"; refreshTabs(); load(); });

  const [subjects, chapters] = await Promise.all([getSubjects(), getChapters()]);
  subjectMap = buildNameMap(subjects); chapterMap = buildNameMap(chapters);
  load();
});

function refreshTabs() {
  document.getElementById("tabPending").className = `btn ${activeTab === "pending" ? "btn-primary" : "btn-secondary"} btn-sm`;
  document.getElementById("tabApproved").className = `btn ${activeTab === "approved" ? "btn-primary" : "btn-secondary"} btn-sm`;
}

function fmtDate(ts) { return ts?.toDate ? ts.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—"; }
function fmtTime(ts) { return ts?.toDate ? ts.toDate().toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) : "—"; }

async function load() {
  const el = document.getElementById("listBody");
  el.innerHTML = `<div class="glass card skeleton" style="height:90px;"></div>`;
  try {
    // NOTE: no Firestore orderBy() here — an equality filter (status) combined
    // with orderBy() on a different field (submittedAt) needs a manually-
    // created composite index. Missing index = query fails = "লোড করা যায়নি",
    // exactly this page's bug. Sort client-side instead, same fix as
    // results-utils.js / syllabus-utils.js / exam-utils.js.
    const q = query(collection(db, "results"), where("status", "==", activeTab));
    const snap = await getDocs(q);
    const results = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.submittedAt?.toMillis?.() ?? 0) - (a.submittedAt?.toMillis?.() ?? 0));
    if (results.length === 0) {
      renderState(el, "empty", activeTab === "pending" ? "অনুমোদনের অপেক্ষায় কোনো ফলাফল নেই।" : "এখনো কোনো ফলাফল অনুমোদিত হয়নি।");
      return;
    }
    el.innerHTML = results.map(r => `
      <div class="glass card mt-2">
        <div class="flex justify-between items-center">
          <div>
            <p style="font-weight:700;">${r.examName || "পরীক্ষা"}</p>
            <p class="text-xs text-muted">শিক্ষার্থী: ${r.studentId} • ${fmtDate(r.submittedAt)} ${fmtTime(r.submittedAt)}</p>
          </div>
          <p style="font-weight:800;color:var(--color-accent);">${r.percentage ?? "—"}%</p>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-secondary btn-sm view-btn" data-id="${r.id}">বিস্তারিত দেখুন</button>
          ${activeTab === "pending" ? `<button class="btn btn-primary btn-sm approve-btn" data-id="${r.id}">ফলাফল অনুমোদন করুন</button>` : ""}
        </div>
      </div>
    `).join("");

    el.querySelectorAll(".view-btn").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.id)));
    el.querySelectorAll(".approve-btn").forEach(b => b.addEventListener("click", () => handleApprove(b.dataset.id)));
  } catch (err) {
    console.error(err);
    renderState(el, "error", "ফলাফল লোড করা যায়নি।");
  }
}

async function handleApprove(id) {
  if (!confirm("এই ফলাফলটি অনুমোদন করবেন? অনুমোদনের পর এটি শিক্ষার্থীর স্থায়ী ইতিহাসে যুক্ত হবে।")) return;
  try {
    await updateDoc(doc(db, "results", id), { status: "approved", approvedAt: serverTimestamp() });
    showToast("ফলাফল অনুমোদন করা হয়েছে।", "success");
    load();
  } catch (err) {
    showToast(friendlyError(err), "error");
  }
}

async function openDetail(id) {
  const overlay = document.getElementById("detailOverlay");
  overlay.classList.remove("hidden");
  overlay.innerHTML = `<div class="state-block"><div class="spinner"></div></div>`;
  try {
    const snap = await getDoc(doc(db, "results", id));
    if (!snap.exists()) { overlay.innerHTML = `<div class="glass card">ফলাফল পাওয়া যায়নি।</div>`; return; }
    const r = { id: snap.id, ...snap.data() };
    const examSnapshot = await getExamSnapshot(r.examId);
    const review = examSnapshot ? buildQuestionReview(examSnapshot.questions, r.answers || {}, r.questionTimes || {}) : [];

    overlay.innerHTML = `
      <div class="app-shell" style="max-width:600px;">
        <div class="flex justify-between items-center">
          <h3>${r.examName || "পরীক্ষা"}</h3>
          <button class="icon-btn" id="closeDetailBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="glass card mt-3">
          <p class="text-sm">শিক্ষার্থী: <span style="font-weight:700;">${r.studentId}</span></p>
          <div class="grid-2 mt-3">
            <div><p class="text-xs text-muted">নম্বর</p><p style="font-weight:700;">${r.obtainedMarks}/${r.totalMarks}</p></div>
            <div><p class="text-xs text-muted">শতাংশ</p><p style="font-weight:700;">${r.percentage}%</p></div>
            <div><p class="text-xs text-muted">সঠিকতা</p><p style="font-weight:700;">${r.accuracy ?? "—"}%</p></div>
            <div><p class="text-xs text-muted">সময়</p><p style="font-weight:700;">${formatSeconds(r.timeTakenSeconds)}</p></div>
          </div>
          <p class="text-xs text-muted mt-3">সঠিক ${r.correctCount} • ভুল ${r.wrongCount} • অনুত্তরিত ${r.unansweredCount}</p>
          <button class="btn btn-primary mt-3" id="resultCardBtn" style="width:100%;">🏆 সুন্দর রেজাল্ট কার্ড বানান</button>
          <div id="resultCardOutput" class="mt-3"></div>
        </div>
        <p class="eyebrow mt-4">প্রশ্নভিত্তিক বিস্তারিত</p>
        ${review.map((q, i) => `
          <div class="glass card mt-2">
            <p class="text-xs text-muted">প্রশ্ন ${i + 1} • ${subjectMap[q.subjectId] || ""} / ${chapterMap[q.chapterId] || ""}</p>
            <p class="mt-1" style="font-weight:600;">${q.question_bn}</p>
            <p class="text-xs mt-2">উত্তর: ${q.studentAnswer || "দেননি"} • সঠিক: ${q.correctAnswer} • <span style="font-weight:700;color:${q.status === "correct" ? "var(--color-success)" : q.status === "wrong" ? "var(--color-danger)" : "var(--text-muted)"};">${q.status === "correct" ? "সঠিক" : q.status === "wrong" ? "ভুল" : "অনুত্তরিত"}</span>${q.timeSeconds !== null ? ` • সময়: ${q.timeSeconds} সে.` : ""}</p>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("closeDetailBtn").addEventListener("click", () => overlay.classList.add("hidden"));
    document.getElementById("resultCardBtn").addEventListener("click", () => handleResultCard(r));
  } catch (err) {
    console.error(err);
    overlay.innerHTML = `<div class="glass card">বিস্তারিত লোড করা যায়নি।</div>`;
  }
}

function fmtCardDate(ts) {
  return ts?.toDate ? ts.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "";
}

// ---------- Builds the modern gradient result-card HTML (rendered off-
// screen, then captured to PNG by html2canvas). No photo — this card gets
// shared outside the app, so only the student's name/scores go on it, never
// their picture. Pulls together: name, this exam's %, correct/wrong/accuracy
// for this exam, the student's overall exam count + average % across all
// their approved results, their class rank for this exam, and how this
// exam's % compares to the class average ("competitor" gap). ----------
async function buildResultCardHtml(r) {
  const [allStudents, myResults, allApproved, exam] = await Promise.all([
    getActiveStudents(),
    getApprovedResults(r.studentId),
    getAllApprovedResults(),
    getExamById(r.examId)
  ]);

  const student = allStudents.find(s => s.studentId === r.studentId);
  const studentName = student?.name || r.studentId;

  const overallAvg = myResults.length
    ? Math.round((myResults.reduce((sum, x) => sum + (Number(x.percentage) || 0), 0) / myResults.length) * 10) / 10
    : Number(r.percentage) || 0;

  // Everyone (including this student) who has an approved result for this
  // exact exam — used for both the rank and the class-average comparison.
  // r itself might not be in allApproved yet if it's still pending, so make
  // sure it's included either way.
  let sameExam = allApproved.filter(x => x.examId === r.examId);
  if (!sameExam.some(x => x.id === r.id)) sameExam = [...sameExam, r];

  const classAvg = sameExam.length
    ? sameExam.reduce((sum, x) => sum + (Number(x.percentage) || 0), 0) / sameExam.length
    : null;
  const diff = classAvg !== null ? (Number(r.percentage) || 0) - classAvg : null;

  const ranked = [...sameExam].sort((a, b) => (Number(b.percentage) || 0) - (Number(a.percentage) || 0));
  const rank = ranked.findIndex(x => x.id === r.id) + 1;

  const examDate = fmtCardDate(exam?.examDate) || fmtCardDate(r.submittedAt);

  // Performance badge — a quick, friendly read on the number before anyone
  // even looks at the breakdown below.
  const pct = Number(r.percentage) || 0;
  let badgeEmoji = "💪", badgeText = "আরও চেষ্টা দরকার", badgeColor = "#f87171";
  if (pct >= 80) { badgeEmoji = "🏆"; badgeText = "অসাধারণ ফলাফল"; badgeColor = "#4ade80"; }
  else if (pct >= 60) { badgeEmoji = "👍"; badgeText = "ভালো ফলাফল"; badgeColor = "#60a5fa"; }
  else if (pct >= 40) { badgeEmoji = "🙂"; badgeText = "মোটামুটি ফলাফল"; badgeColor = "#fbbf24"; }

  return `
    <div id="cardInner" style="width:400px;font-family:'Noto Sans Bengali',sans-serif;background:linear-gradient(160deg,#0b0f1a 0%,#1a1024 55%,#2b1608 100%);color:#ffffff;border-radius:26px;overflow:hidden;">
      <div style="padding:34px 28px 22px;text-align:center;">
        <p style="margin:0;font-size:12px;text-transform:uppercase;color:#ffb38a;font-weight:700;">পরীক্ষা প্রস্তুতি</p>
        <div style="width:80px;height:80px;border-radius:50%;margin:18px auto 16px;background:rgba(255,106,43,0.15);border:2px solid #ff6a2b;display:flex;align-items:center;justify-content:center;font-size:38px;">${badgeEmoji}</div>
        <h1 style="margin:0;font-size:34px;font-weight:800;color:#ffffff;line-height:1.25;">${studentName}</h1>
        <span style="display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,0.1);color:#94a3b8;font-size:11px;font-weight:600;">${r.studentId}</span>
        <div style="margin-top:12px;">
          <span style="display:inline-block;padding:5px 14px;border-radius:999px;background:${badgeColor}26;border:1px solid ${badgeColor};color:${badgeColor};font-size:12px;font-weight:700;">${badgeText}</span>
        </div>
      </div>

      <div style="margin:0 20px;background:rgba(255,255,255,0.07);border-radius:18px;padding:24px;text-align:center;border:1px solid rgba(255,255,255,0.12);">
        <p style="margin:0;font-size:14px;color:#e2e8f0;font-weight:700;">${r.examName || "পরীক্ষা"}</p>
        ${examDate ? `<p style="margin:3px 0 16px;font-size:11px;color:#94a3b8;">${examDate}</p>` : `<div style="margin-bottom:16px;"></div>`}
        <p style="margin:0;font-size:60px;font-weight:800;line-height:1;color:#ff8a3d;">${r.percentage ?? "—"}%</p>
        <p style="margin:10px 0 0;font-size:13px;color:#cbd5e1;">${r.obtainedMarks}/${r.totalMarks} নম্বর</p>
      </div>

      <div style="display:flex;gap:10px;margin:16px 20px 0;">
        <div style="flex:1;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:16px;padding:14px;text-align:center;">
          <p style="margin:0;font-size:20px;font-weight:800;color:#4ade80;">${r.correctCount ?? "—"}</p>
          <p style="margin:3px 0 0;font-size:10px;color:#94a3b8;">সঠিক</p>
        </div>
        <div style="flex:1;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:16px;padding:14px;text-align:center;">
          <p style="margin:0;font-size:20px;font-weight:800;color:#f87171;">${r.wrongCount ?? "—"}</p>
          <p style="margin:3px 0 0;font-size:10px;color:#94a3b8;">ভুল</p>
        </div>
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;text-align:center;">
          <p style="margin:0;font-size:20px;font-weight:800;color:#ffffff;">${r.accuracy ?? "—"}%</p>
          <p style="margin:3px 0 0;font-size:10px;color:#94a3b8;">সঠিকতা</p>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin:10px 20px 0;">
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:16px;padding:16px;text-align:center;">
          <p style="margin:0;font-size:22px;font-weight:800;color:#ffffff;">${myResults.length}</p>
          <p style="margin:3px 0 0;font-size:11px;color:#94a3b8;">মোট পরীক্ষা</p>
        </div>
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:16px;padding:16px;text-align:center;">
          <p style="margin:0;font-size:22px;font-weight:800;color:#ffffff;">${overallAvg}%</p>
          <p style="margin:3px 0 0;font-size:11px;color:#94a3b8;">ওভারঅল গড়</p>
        </div>
      </div>

      ${sameExam.length > 1 ? `
      <div style="margin:14px 20px 0;background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;text-align:center;">
        <p style="margin:0;font-size:14px;font-weight:700;color:#ffd08a;">
          এই পরীক্ষায় ${sameExam.length} জনের মধ্যে অবস্থান: <span style="font-size:16px;">${rank}${rank === 1 ? "ম" : "য়"}</span>
        </p>
      </div>` : ""}

      ${diff !== null && sameExam.length > 1 ? `
      <div style="margin:12px 20px 0;background:${diff >= 0 ? "rgba(34,197,94,0.16)" : "rgba(239,68,68,0.16)"};border:1px solid ${diff >= 0 ? "#22c55e" : "#ef4444"};border-radius:16px;padding:14px;text-align:center;">
        <p style="margin:0;font-size:14px;font-weight:700;color:${diff >= 0 ? "#4ade80" : "#f87171"};">
          ক্লাসের গড় থেকে ${diff >= 0 ? "↑" : "↓"} ${Math.abs(Math.round(diff * 10) / 10)}% ${diff >= 0 ? "এগিয়ে" : "পিছিয়ে"}
        </p>
      </div>` : ""}

      <p style="text-align:center;margin:22px 0 22px;font-size:10px;color:#64748b;">${fmtCardDate(r.submittedAt)}</p>
    </div>
  `;
}

async function handleResultCard(r) {
  const btn = document.getElementById("resultCardBtn");
  const out = document.getElementById("resultCardOutput");
  btn.disabled = true;
  btn.textContent = "কার্ড তৈরি হচ্ছে...";
  try {
    const area = document.getElementById("cardArea");
    area.innerHTML = await buildResultCardHtml(r);

    const canvas = await html2canvas(document.getElementById("cardInner"), { scale: 2, backgroundColor: null, useCORS: true });
    const dataUrl = canvas.toDataURL("image/png");
    const fileName = `${(r.examName || "result").replace(/\s+/g, "_")}_${r.studentId}.png`;

    out.innerHTML = `
      <img src="${dataUrl}" style="width:100%;border-radius:16px;margin-top:4px;">
      <div class="flex gap-2 mt-3">
        <button class="btn btn-secondary btn-sm" id="cardDownloadBtn" style="flex:1;">ডাউনলোড</button>
        <button class="btn btn-primary btn-sm" id="cardShareBtn" style="flex:1;">শেয়ার করুন</button>
      </div>
    `;
    document.getElementById("cardDownloadBtn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = fileName;
      a.click();
    });
    document.getElementById("cardShareBtn").addEventListener("click", async () => {
      try {
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], fileName, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fileName });
        } else {
          showToast("এই ব্রাউজারে সরাসরি শেয়ার সাপোর্ট নেই — ডাউনলোড করে শেয়ার করো।", "error");
        }
      } catch { /* user cancelled the share sheet — not an error */ }
    });
  } catch (err) {
    console.error(err);
    showToast("রেজাল্ট কার্ড তৈরি করা যায়নি।", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "🏆 সুন্দর রেজাল্ট কার্ড বানান";
  }
}
</script>
</body>
</html>
