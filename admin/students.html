const BATCH_OPTIONS = ["Batch 7","Batch 8","Batch 9","Batch 10","Batch 11","Batch 12","Other"];

function setupBatchDropdowns(){
  document.querySelectorAll(".batch-search-input").forEach(input=>{
    input.addEventListener("focus",()=>openBatchDropdown(input));
    input.addEventListener("input",()=>openBatchDropdown(input));
  });
  document.querySelectorAll(".batch-select-arrow").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation();
      const input=document.getElementById(btn.dataset.batchTarget);
      if(!input)return;
      if(activeBatchDropdown?.input===input) closeBatchDropdown();
      else { input.focus(); openBatchDropdown(input); }
    });
  });
  document.addEventListener("mousedown",e=>{
    if(activeBatchDropdown&&!activeBatchDropdown.menu.contains(e.target)&&!activeBatchDropdown.input.contains(e.target)&&!e.target.closest(".batch-select-arrow")) closeBatchDropdown();
  });
  window.addEventListener("resize",repositionBatchDropdown,{passive:true});
  window.addEventListener("scroll",repositionBatchDropdown,{passive:true});
}

function openBatchDropdown(input){
  const portal=document.getElementById("batchDropdownPortal"); if(!portal)return;
  closeBatchDropdown();
  const menu=document.createElement("div");
  menu.className="batch-menu"; menu.setAttribute("role","listbox");
  const q=input.value.trim().toLowerCase();
  const options=BATCH_OPTIONS.filter(v=>v.toLowerCase().includes(q));
  menu.innerHTML=options.length?options.map(v=>`<button type="button" class="batch-option" role="option" data-value="${v}">${v}</button>`).join(""):`<div class="batch-empty">কোনো ব্যাচ পাওয়া যায়নি</div>`;
  portal.appendChild(menu);
  menu.querySelectorAll(".batch-option").forEach(option=>{
    option.addEventListener("mousedown",e=>e.preventDefault());
    option.addEventListener("click",()=>{
      input.value=option.dataset.value;
      closeBatchDropdown(); input.focus();
    });
  });
  activeBatchDropdown={input,menu}; input.setAttribute("aria-expanded","true"); repositionBatchDropdown();
}

function repositionBatchDropdown(){
  if(!activeBatchDropdown)return;
  const {input,menu}=activeBatchDropdown, r=input.getBoundingClientRect(), pad=10, gap=6;
  const width=Math.max(r.width,180); menu.style.width=`${width}px`;
  const h=Math.min(310,Math.max(90,window.innerHeight*.42)), below=window.innerHeight-r.bottom-gap, above=r.top-gap;
  menu.style.top=(below>=150||below>=above)?`${Math.min(window.innerHeight-h-pad,r.bottom+gap)}px`:`${Math.max(pad,r.top-Math.min(h,above))}px`;
  menu.style.left=`${Math.max(pad,Math.min(r.left,window.innerWidth-width-pad))}px`;
}

function closeBatchDropdown(){
  if(!activeBatchDropdown)return;
  activeBatchDropdown.input.setAttribute("aria-expanded","false");
  activeBatchDropdown.menu.remove(); activeBatchDropdown=null;
}

  document.getElementById("searchStudent").addEventListener("input", renderFilteredList);
  document.getElementById("filterBatch").addEventListener("change", renderFilteredList);
  
  document.getElementById("closeEditModal").addEventListener("click", () => {
    document.getElementById("editStudentModal").style.display = "none";
  });

  document.getElementById("saveEditModal").addEventListener("click", async () => {
    const newName = document.getElementById("editNameInput").value.trim();
    const newClass = document.getElementById("editClassInput").value.trim();
    const saveBtn = document.getElementById("saveEditModal");
    
    if(!newName) return showToast("নাম দেওয়া আবশ্যক।", "error");
    
    saveBtn.disabled = true; saveBtn.textContent = "সেভ হচ্ছে...";
    try {
      await updateDoc(doc(db, "students", currentEditDocId), { name: newName, className: newClass });
      showToast("তথ্য সফলভাবে আপডেট করা হয়েছে।", "success");
      document.getElementById("editStudentModal").style.display = "none";
      await loadStudents();
    } catch(err) {
      showToast(friendlyError(err), "error");
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = "সেভ পরিবর্তন";
    }
  });
  
  loadStudents();
  loadPendingRequests();
});

async function loadAuthStates() {
  window.__authStateMap = {};
  try {
    const snap = await getDocs(collection(db, "studentAuthState"));
    snap.forEach(d => window.__authStateMap[d.id] = d.data());
  } catch (e) { console.warn("authState load failed", e); }
}

function showCodesModal(title, lines) {
  const text = lines.join("\n");
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;";
  ov.innerHTML = `<div style="background:var(--surface-solid,#fff);color:var(--text-main,#222);border-radius:16px;padding:20px;width:100%;max-width:460px">
    <h3 style="margin:0 0 6px">${title}</h3>
    <p style="margin:0 0 10px;font-size:.8rem;opacity:.7">কোডগুলো এখনই কপি করে নাও — পরে আর দেখা যাবে না। ছাত্র প্রথমবার লগইন করলে নিজের পাসওয়ার্ড বানাবে।</p>
    <textarea readonly style="width:100%;height:200px;font-family:monospace;font-size:.85rem;padding:10px;border-radius:10px">${text}</textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="cp" type="button" style="padding:8px 14px">কপি</button>
      <button class="cl" type="button" style="padding:8px 14px;font-weight:800">বন্ধ</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector(".cp").addEventListener("click", () => navigator.clipboard?.writeText(text).then(() => showToast("কপি হয়েছে", "success")));
  ov.querySelector(".cl").addEventListener("click", () => ov.remove());
}

async function createCodeFor(s) {
  const code = await adminCreateStudentAccount(s.studentId);
  window.__authStateMap[s.studentId] = { passwordSet: false };
  try { await deleteDoc(doc(db, "setupRequests", s.studentId)); } catch (e) {}
  return code;
}

async function loadSetupRequests() {
  const box = document.getElementById("setupReqBox");
  if (!box) return;
  let reqs = [];
  try {
    const snap = await getDocs(collection(db, "setupRequests"));
    reqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.warn("setupRequests load failed", e); }
  if (!reqs.length) { box.innerHTML = ""; return; }
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  box.innerHTML = `<div style="background:rgba(234,179,8,.10);border:1px solid rgba(234,179,8,.35);border-radius:14px;padding:14px;margin-bottom:16px">
    <div style="font-weight:800;margin-bottom:8px">🔑 সেটআপ কোডের আবেদন (${reqs.length})</div>
    ${reqs.map(r => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(128,128,128,.15);flex-wrap:wrap" data-rid="${esc(r.id)}">
      <div style="flex:1;min-width:150px"><b>${esc(r.name)}</b> <small style="opacity:.7">${esc(r.className)} · ${esc(r.studentId)}</small>
        <div style="font-size:.75rem;opacity:.75">${r.type === "reset" ? "🔄 পাসওয়ার্ড রিসেট চাইছে (আগে Firebase Console → Authentication থেকে ওর ইউজার ডিলিট করো)" : "🆕 প্রথমবার — পাসওয়ার্ড বানাতে চাইছে"}</div></div>
      <button class="req-code" type="button" style="padding:8px 14px;font-weight:800;cursor:pointer">কোড তৈরি করো</button>
      <button class="req-dismiss" type="button" style="padding:8px 12px;cursor:pointer">বাদ দাও</button>
    </div>`).join("")}
  </div>`;
  box.querySelectorAll("[data-rid]").forEach(row => {
    const r = reqs.find(x => x.id === row.dataset.rid);
    row.querySelector(".req-code").addEventListener("click", async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      try {
        const code = await createCodeFor({ studentId: r.studentId });
        showCodesModal("সেটআপ কোড", [`${r.name} (${r.studentId}) — ${code}`]);
        loadSetupRequests(); renderFilteredList();
      } catch (err) {
        if (err?.code === "auth/email-already-in-use")
          showToast("ওর অ্যাকাউন্ট আগে থেকেই আছে। Firebase Console → Authentication থেকে ইউজারটা ডিলিট করে আবার চাপো।", "error");
        else showToast(friendlyStudentAuthError(err), "error");
        btn.disabled = false;
      }
    });
    row.querySelector(".req-dismiss").addEventListener("click", async () => {
      try { await deleteDoc(doc(db, "setupRequests", r.id)); loadSetupRequests(); } catch (e) { showToast("বাদ দেওয়া যায়নি", "error"); }
    });
  });
}

async function loadAllStudents() {
  const snap = await getDocs(query(collection(db, "students"), orderBy("sequenceNumber")));
  return snap.docs.map(d => ({ docId: d.id, ...d.data() }));
}

function safeText(str, fallback = "") {
  if (str === undefined || str === null || str === "undefined") return fallback;
  return String(str).trim() || fallback;
}

async function loadStudents() {
  const listEl = document.getElementById("studentList");
  try {
    allAdminStudentsList = await loadAllStudents();
    
    // Fetch XP Data
    try { 
      const lb = await getLeaderboardData(allAdminStudentsList);
      window.__studentXPMap = {};
      lb.forEach(r => window.__studentXPMap[r.studentId] = r.totalPoints);
    } catch (err) { console.error("XP Load Failed:", err); }
    
    await loadAuthStates();
    loadSetupRequests();
    updateBatchFilterDropdown();
    renderFilteredList();
  } catch (err) {
    console.error(err);
    renderState(listEl, "error", "তালিকা লোড করা যায়নি।");
  }
}

function updateBatchFilterDropdown() {
  const filterSelect = document.getElementById("filterBatch");
  const currentVal = filterSelect.value;
  const batches = [...new Set(allAdminStudentsList.map(s => safeText(s.className, "ব্যাচ নেই")))].filter(b => b !== "ব্যাচ নেই").sort();
  
  filterSelect.innerHTML = `<option value="all">সব ব্যাচ</option>` + 
    batches.map(b => `<option value="${b}">${b}</option>`).join("") + 
    `<option value="ব্যাচ নেই">ব্যাচ নেই</option>`;
    
  if (batches.includes(currentVal) || currentVal === "all" || currentVal === "ব্যাচ নেই") {
    filterSelect.value = currentVal;
  } else {
    filterSelect.value = "all";
  }
}

    const sId = safeText(s.studentId).toLowerCase();

    const matchSearch = sName.includes(searchTerm) || sId.includes(searchTerm);
    const matchBatch = filterBatch === "all" || sClass === filterBatch;
    return matchSearch && matchBatch;
  });

  if (filteredStudents.length === 0) {
    renderState(listEl, "empty", "কোনো শিক্ষার্থী পাওয়া যায়নি।");

        <div class="st-main">
          <div class="st-name-wrapper">
            <span class="st-name">${displayName}</span>
            <span class="st-batch-highlight">${stClass || 'ব্যাচ দেওয়া নেই'}</span>
          </div>
          <div class="st-sub">
            <!-- 1-Click Copy ID Button -->
            <span class="st-badge copy-id-btn" data-id="${stId}" style="cursor:pointer; background:rgba(var(--color-accent-rgb),0.05); color:var(--color-accent); border:1px solid rgba(var(--color-accent-rgb),0.3);" title="ক্লিক করে আইডি কপি করুন">
              ${stId}
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </span>
            <!-- Live XP Display -->
            <span class="st-badge" style="background:rgba(234, 179, 8, 0.15); color:#a16207; border:1px solid rgba(234, 179, 8, 0.3);">⭐ ${xp} XP</span>
            ${(() => { const a = (window.__authStateMap || {})[stId]; return a ? (a.passwordSet ? `<span class="st-badge" style="background:rgba(22,163,74,.12);color:#15803d">🔒 পাসওয়ার্ড সেট</span>` : `<span class="st-badge" style="background:rgba(234,179,8,.15);color:#a16207">⏳ কোড অপেক্ষমাণ</span>`) : `<span class="st-badge" style="background:rgba(239,68,68,.1);color:#b91c1c">অ্যাকাউন্ট নেই</span>`; })()}
            ${s.isActive === false ? `<span class="st-inactive">নিষ্ক্রিয়</span>` : ""}
          </div>
        </div>
        <div class="st-actions">
          <button class="action-icon code-btn" title="সেটআপ কোড তৈরি">🔑</button>

          <button class="action-icon edit-btn" title="সম্পাদনা"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>

          <button class="action-icon delete-btn" title="শিক্ষার্থী মুছে ফেলুন"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>

function bindStudentActions(students) {
  document.querySelectorAll(".student-row").forEach(row => {
    const docId = row.dataset.id;
    const student = students.find(s => s.docId === docId);

    row.querySelector(".code-btn").addEventListener("click", async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      try {
        const code = await createCodeFor(student);
        showCodesModal("সেটআপ কোড", [`${student.name} (${student.studentId}) — ${code}`]);
        renderFilteredList();
      } catch (err) {
        if (err?.code === "auth/email-already-in-use")
          showToast("অ্যাকাউন্ট আগে থেকেই আছে। রিসেট করতে Firebase Console → Authentication থেকে ওই ইউজার ডিলিট করো, তারপর আবার চাপো।", "error");
        else showToast(friendlyStudentAuthError(err), "error");
      }
      btn.disabled = false;
    });

    // ID Copy Feature
    row.querySelector(".copy-id-btn").addEventListener("click", (e) => {
      const id = e.currentTarget.dataset.id;
      navigator.clipboard.writeText(id).then(() => {
        showToast("স্টুডেন্ট আইডি কপি করা হয়েছে!", "success");
      });
    });

    row.querySelector(".photo-btn").addEventListener("click", async () => {
      const currentUrl = student.photoURL || "";
      const input = await askForPhotoLink(currentUrl, docId);
      if (input === null) return; 
      const trimmed = input.trim();
      try {
        const finalUrl = trimmed ? (isFaceUri(trimmed) ? trimmed : toDirectImageUrl(trimmed)) : null;
        await updateStudentPhoto(docId, finalUrl);
        if (currentUrl && currentUrl !== finalUrl && !isFaceUri(currentUrl)) deleteStudentPhoto(currentUrl);
        showToast(finalUrl ? "ছবি আপডেট হয়েছে।" : "ছবি মুছে ফেলা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    row.querySelector(".edit-btn").addEventListener("click", () => {
      currentEditDocId = docId;
      document.getElementById("editNameInput").value = safeText(student.name);
      document.getElementById("editClassInput").value = safeText(student.className);
      document.getElementById("editStudentModal").style.display = "flex";
    });

    row.querySelector(".toggle-btn").addEventListener("click", async () => {
      const willActivate = student.isActive === false ? true : false;
      const msg = willActivate ? `${student.name || 'শিক্ষার্থী'} কে সক্রিয় করবেন?` : `${student.name || 'শিক্ষার্থী'} কে নিষ্ক্রিয় করবেন?`;
      if (!confirm(msg)) return;
      try {
        await updateDoc(doc(db, "students", docId), { isActive: willActivate });
        showToast(willActivate ? "সক্রিয় করা হয়েছে।" : "নিষ্ক্রিয় করা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    row.querySelector(".delete-btn").addEventListener("click", async () => {
      const msg = `সতর্কতা: আপনি কি "${student.name || 'এই শিক্ষার্থী'}" কে স্থায়ীভাবে মুছে ফেলতে চান?\n\nএই কাজটি আর বাতিল (Undo) করা যাবে না এবং এই শিক্ষার্থীর সমস্ত তথ্য মুছে যাবে।`;
      if (!confirm(msg)) return;
      try {
        if (student.photoURL) { deleteStudentPhoto(student.photoURL).catch(e => console.warn(e)); }
        await deleteDoc(doc(db, "students", docId));
        showToast("শিক্ষার্থীকে স্থায়ীভাবে মুছে ফেলা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });
  });
}

async function handleAdd(e) {
  e.preventDefault();
  const nameInput = document.getElementById("newName");

}

function askForPhotoLink(currentUrl, studentIdHint) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="custom-modal">
        <p style="font-weight:900; font-size:1.15rem; margin-bottom:16px; color:var(--text-primary);">শিক্ষার্থীর ছবি</p>
        <p class="text-xs text-muted mb-2 font-bold">ফোন থেকে ছবি আপলোড করুন:</p>
        <input type="file" id="photoFileInput" accept="image/*" style="width:100%; font-size:0.85rem; margin-bottom:12px; padding:12px; background:rgba(128,128,128,0.05); border-radius:12px; border:1px dashed var(--surface-border);">
        <p id="photoUploadStatus" class="text-xs mb-3" style="font-weight:700; min-height:16px;"></p>
        
        <p class="text-xs text-muted mb-2 font-bold">অ্যানিমেটেড ফেস বেছে নিন:</p>
        <div id="faceRow" style="display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px;">${FACE_URIS.map(f => `<button type="button" class="face-pick" data-uri="${f.id}" title="${f.label}" style="padding:0; border:3px solid transparent; border-radius:14px; overflow:hidden; aspect-ratio:1; background:none; cursor:pointer;"><img src="${f.uri}" alt="" style="width:100%;height:100%;display:block;pointer-events:none;"></button>`).join("")}</div>
        <p class="text-xs text-muted mb-2 font-bold">— অথবা — লিংক পেস্ট করুন:</p>
        <textarea id="photoLinkInput" rows="3" class="input-glass" style="width:100%; resize:vertical; padding:12px; font-size:0.9rem;"></textarea>
        
        <p class="text-xs text-muted mt-3" style="font-weight:600;">খালি রেখে সেভ করলে বর্তমান ছবি মুছে যাবে।</p>
        <div class="flex gap-2 mt-4">
          <button type="button" class="btn-glass" id="photoLinkCancel" style="flex:1; padding:12px;">বাতিল</button>
          <button type="button" class="btn-glass btn-primary" id="photoLinkSave" style="flex:1; padding:12px;">সেভ করুন</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const textarea = overlay.querySelector("#photoLinkInput");
    const fileInput = overlay.querySelector("#photoFileInput");
    const statusEl = overlay.querySelector("#photoUploadStatus");
    textarea.value = currentUrl || "";
    textarea.style.fontSize = "0.7rem";
    const markFace = () => overlay.querySelectorAll(".face-pick").forEach(b => {
      const f = FACE_URIS.find(x => x.id === b.dataset.uri);
      b.style.borderColor = f && f.uri === textarea.value.trim() ? "var(--color-accent)" : "transparent";
    });
    overlay.querySelector("#faceRow").addEventListener("click", (e) => {
      const b = e.target.closest(".face-pick");
      if (!b) return;
      textarea.value = FACE_URIS.find(x => x.id === b.dataset.uri).uri;
      markFace();
    });
    textarea.addEventListener("input", markFace);
    markFace();

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      statusEl.textContent = "আপলোড হচ্ছে, অপেক্ষা করুন...";
      statusEl.style.color = "var(--text-muted)";
      try {
        const url = await uploadStudentPhoto(file, studentIdHint);
        statusEl.textContent = "আপলোড সম্পন্ন! সেভ করুন।";
        statusEl.style.color = "#10b981";
        textarea.value = url;
      } catch (err) {
        statusEl.textContent = "আপলোড ব্যর্থ। লিংক পেস্ট করুন।";
        statusEl.style.color = "#ef4444";
      }
    });

    function cleanup(result) { overlay.remove(); resolve(result); }
    overlay.querySelector("#photoLinkCancel").addEventListener("click", () => cleanup(null));
    overlay.querySelector("#photoLinkSave").addEventListener("click", () => cleanup(textarea.value));
  });
}

function rqTimeAgo(ts) {
  const d = ts && ts.toDate ? ts.toDate() : null;
  if (!d) return "";
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return "এইমাত্র";
  if (m < 60) return m + " মিনিট আগে";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " ঘণ্টা আগে";
  return Math.floor(h / 24) + " দিন আগে";
}

async function loadPendingRequests() {
  const reqSection = document.getElementById("requestsSection");
  const el = document.getElementById("requestsList");
  try {
    const requests = await getPendingRequests();
    if (requests.length === 0) { reqSection.style.display = "none"; el.innerHTML = ""; return; }
    requests.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    reqSection.style.display = "block";
    document.getElementById("rqCount").textContent = requests.length;
    el.innerHTML = requests.map(r => `
      <div class="rq-card" data-req-id="${r.id}">
        <div class="rq-top">
          <div class="rq-avatar">${safeText((r.rawName || "?").trim().charAt(0).toUpperCase())}</div>
          <div class="rq-who"><b>${safeText(r.rawName)}</b><span>${rqTimeAgo(r.createdAt)}</span></div>
        </div>
        <div class="rq-chips">
          <span class="rq-chip">🎓 ${safeText(r.className)}</span>
          ${r.referredBy ? `<span class="rq-chip ref">🤝 রেফার: ${safeText(r.referredBy)}</span>` : ""}
        </div>
        <label class="rq-label">চূড়ান্ত নাম (বাংলা/ইংরেজি ঠিক করে নিন)</label>
        <input class="input-glass req-name-input" value="${safeText(r.rawName)}" placeholder="শিক্ষার্থীর নাম">
        <div class="rq-actions">
          <button class="btn-glass rq-reject req-reject-btn" type="button">✕ বাতিল</button>
          <button class="btn-glass btn-primary req-approve-btn" type="button">✓ অনুমোদন দিন</button>
        </div>
      </div>
    `).join("");
    requests.forEach(r => wireRequestCard(r));
  } catch (err) {
    console.error(err);
    showToast(friendlyError(err), "error");
  }
}

function rqRemoveCard(card) {
  card.classList.add("rq-leaving");
  setTimeout(() => { card.remove(); loadPendingRequests(); }, 260);
}

function wireRequestCard(request) {
  const card = document.querySelector(`[data-req-id="${request.id}"]`);
  if (!card) return;
  const nameInput = card.querySelector(".req-name-input");
  const approveBtn = card.querySelector(".req-approve-btn");
  const rejectBtn = card.querySelector(".req-reject-btn");
  const setBusy = (b, label) => {
    approveBtn.disabled = b; rejectBtn.disabled = b; nameInput.disabled = b;
    if (label) approveBtn.textContent = label;
  };

  approveBtn.addEventListener("click", async () => {
    const finalName = nameInput.value.trim();
    if (!finalName) { showToast("নাম খালি রাখা যাবে না।", "error"); nameInput.focus(); return; }
    if (!confirm(`"${finalName}" কে অনুমোদন দেবেন?`)) return;
    setBusy(true, "অপেক্ষা করুন…");
    try {
      const created = await createStudent(finalName, request.className, request.referredBy || null);
      await deleteStudentRequest(request.id);
      let friendSent = false;
      if (request.referredBy) {
        try { friendSent = await sendReferralFriendRequest(created.studentId, request.referredBy); }
        catch (e) { console.warn("Referral friend request skipped", e); }
      }
      showToast(friendSent ? "শিক্ষার্থী যোগ হয়েছে — বন্ধুকে ফ্রেন্ড রিকোয়েস্টও চলে গেছে।" : "শিক্ষার্থী যোগ করা হয়েছে।", "success");
      loadStudents();
      rqRemoveCard(card);
    } catch (err) {
      console.error(err);
      setBusy(false, "✓ অনুমোদন দিন");
      showToast(friendlyError(err), "error");
    }
  });

  rejectBtn.addEventListener("click", async () => {
    if (!confirm("আবেদন বাতিল করবেন?")) return;
    setBusy(true);
    try {
      await deleteStudentRequest(request.id);
      showToast("আবেদন বাতিল করা হয়েছে।", "success");
      rqRemoveCard(card);
    } catch (err) {
      setBusy(false);
      showToast(friendlyError(err), "error");
    }
  });
}
</script>
