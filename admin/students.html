<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষার্থী ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  
  /* ===== Premium Glassmorphism Theme ===== */
  .glass-float-card {
    background: rgba(128, 128, 128, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-glass {
    background: rgba(128, 128, 128, 0.08); backdrop-filter: blur(10px);
    border: 1px solid rgba(128, 128, 128, 0.2); border-radius: 12px; color: var(--text-primary);
    padding: 10px 14px; font-weight: 800; font-size: 0.85rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-glass:active { transform: scale(0.96); }
  .btn-primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.2); }

  /* ===== Form Styles ===== */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 6px; }
  .input-glass {
    width: 100%; box-sizing: border-box; padding: 12px 14px;
    background: rgba(128, 128, 128, 0.05); border: 1px solid var(--surface-border);
    border-radius: 12px; color: var(--text-primary);
    font-family: inherit; font-size: 0.9rem; font-weight: 600; outline: none; transition: 0.2s;
  }
  .input-glass:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), 0.15); background: var(--surface); }

  /* ===== Search & Filter Section ===== */
  .search-filter-container { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .search-box { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; background: rgba(128,128,128,0.05); border: 1px solid var(--surface-border); border-radius: 12px; padding: 0 14px; }
  .search-box input { flex: 1; border: none; background: transparent; outline: none; font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); padding: 12px 0; }
  .filter-box { min-width: 150px; flex-shrink: 0; }

  /* ===== Student Card Layout ===== */
  .student-row { display: flex; align-items: center; gap: 14px; padding: 16px 12px; border-bottom: 1px dashed rgba(128,128,128,0.15); flex-wrap: wrap; }
  .student-row:last-child { border-bottom: none; }
  .st-avatar {
    width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-soft); color: var(--color-accent); font-weight: 900; font-size: 1.2rem;
  }
  .st-avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .st-main { flex: 1; min-width: 200px; }
  .st-name-wrapper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .st-name { font-size: 1.05rem; font-weight: 900; color: var(--text-primary); }
  
  /* Highlighted Batch Badge */
  .st-batch-highlight { background: rgba(var(--color-accent-rgb), 0.15); color: var(--color-accent); font-size: 0.75rem; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(var(--color-accent-rgb), 0.3); font-weight: 900; white-space: nowrap; }
  
  .st-sub { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .st-badge { background: rgba(128,128,128,0.08); padding: 3px 8px; border-radius: 6px; font-weight: 700; color: var(--text-secondary); }
  .st-inactive { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 3px 8px; border-radius: 6px; font-weight: 800; border: 1px solid rgba(239, 68, 68, 0.2); }
  
  .st-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .action-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.08); color: var(--text-secondary); cursor: pointer; border: 1px solid rgba(128,128,128,0.1); transition: all 0.2s ease; }
  .action-icon:hover { background: var(--surface); color: var(--color-accent); border-color: var(--color-accent); box-shadow: 0 4px 12px rgba(var(--color-accent-rgb), 0.15); transform: translateY(-2px); }
  .action-icon.delete-btn:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15); }

  /* ===== Modal Styles ===== */
  .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn 0.2s ease; }
  .custom-modal { width: 100%; max-width: 420px; padding: 24px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .batch-select-wrap{position:relative;width:100%}
  .batch-select-wrap .batch-search-input{padding-right:46px}
  .batch-select-arrow{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:9px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--text-muted);cursor:pointer;transition:.18s}
  .batch-select-arrow svg{width:18px;height:18px;pointer-events:none}
  .batch-select-arrow:hover{background:rgba(128,128,128,.1);color:var(--color-accent)}
  .batch-dropdown-portal{position:fixed;inset:0;z-index:10000;pointer-events:none}
  .batch-menu{position:fixed;pointer-events:auto;overflow:auto;max-height:min(310px,42vh);min-width:180px;padding:7px;background:var(--surface);border:1px solid var(--surface-border);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .batch-option{width:100%;border:0;background:transparent;color:var(--text-primary);text-align:left;padding:11px 12px;border-radius:9px;font:800 .88rem/1.2 inherit;cursor:pointer}
  .batch-option:hover,.batch-option:focus-visible{outline:none;background:rgba(var(--color-accent-rgb),.12);color:var(--color-accent)}
  .batch-empty{padding:12px;text-align:center;color:var(--text-muted);font-size:.82rem;font-weight:700}
  @media(max-width:600px){.search-filter-container{gap:9px}.search-box{min-width:100%}.filter-box{width:100%}.filter-box .input-glass{width:100%}.batch-menu{max-height:42vh;border-radius:13px}.batch-option{padding:12px}}
</style>
</head>

<!-- Searchable Batch Dropdown Portal -->
<div id="batchDropdownPortal" class="batch-dropdown-portal" aria-hidden="true"></div>

<script type="module">

initTheme();

let gamificationData = null;

let activeBatchDropdown = null;
const BATCH_OPTIONS = ["Batch 7","Batch 8","Batch 9","Batch 10","Batch 11","Batch 12","Other"];

function setupBatchDropdowns(){
  document.querySelectorAll(".batch-search-input").forEach(input=>{
    input.addEventListener("focus",()=>openBatchDropdown(input));
    input.addEventListener("input",()=>openBatchDropdown(input));
  });
  document.querySelectorAll(".batch-select-arrow").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation();
      const input=document.getElementById(btn.dataset.batchTarget);
      if(!input)return;
      if(activeBatchDropdown?.input===input) closeBatchDropdown();
      else { input.focus(); openBatchDropdown(input); }
    });
  });
  document.addEventListener("mousedown",e=>{
    if(activeBatchDropdown&&!activeBatchDropdown.menu.contains(e.target)&&!activeBatchDropdown.input.contains(e.target)&&!e.target.closest(".batch-select-arrow")) closeBatchDropdown();
  });
  window.addEventListener("resize",repositionBatchDropdown,{passive:true});
  window.addEventListener("scroll",repositionBatchDropdown,{passive:true});
}
function openBatchDropdown(input){
  const portal=document.getElementById("batchDropdownPortal"); if(!portal)return;
  closeBatchDropdown();
  const menu=document.createElement("div");
  menu.className="batch-menu"; menu.setAttribute("role","listbox");
  const q=input.value.trim().toLowerCase();
  const options=BATCH_OPTIONS.filter(v=>v.toLowerCase().includes(q));
  menu.innerHTML=options.length?options.map(v=>`<button type="button" class="batch-option" role="option" data-value="${v}">${v}</button>`).join(""):`<div class="batch-empty">কোনো ব্যাচ পাওয়া যায়নি</div>`;
  portal.appendChild(menu);
  menu.querySelectorAll(".batch-option").forEach(option=>{
    option.addEventListener("mousedown",e=>e.preventDefault());
    option.addEventListener("click",()=>{
      input.value=option.dataset.value;
      closeBatchDropdown(); input.focus();
    });
  });
  activeBatchDropdown={input,menu}; input.setAttribute("aria-expanded","true"); repositionBatchDropdown();
}
function repositionBatchDropdown(){
  if(!activeBatchDropdown)return;
  const {input,menu}=activeBatchDropdown, r=input.getBoundingClientRect(), pad=10, gap=6;
  const width=Math.max(r.width,180); menu.style.width=`${width}px`;
  const h=Math.min(310,Math.max(90,window.innerHeight*.42)), below=window.innerHeight-r.bottom-gap, above=r.top-gap;
  menu.style.top=(below>=150||below>=above)?`${Math.min(window.innerHeight-h-pad,r.bottom+gap)}px`:`${Math.max(pad,r.top-Math.min(h,above))}px`;
  menu.style.left=`${Math.max(pad,Math.min(r.left,window.innerWidth-width-pad))}px`;
}
function closeBatchDropdown(){
  if(!activeBatchDropdown)return;
  activeBatchDropdown.input.setAttribute("aria-expanded","false");
  activeBatchDropdown.menu.remove(); activeBatchDropdown=null;
}


requireAdmin(() => {
  shell.innerHTML = `
    <div class="topbar" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="../admin/dashboard.html" class="action-icon" style="text-decoration:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <h2 style="font-size:1.2rem; font-weight:900; color:var(--text-primary);">শিক্ষার্থী ব্যবস্থাপনা</h2>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="theme-toggle" id="themeToggle" style="margin:0;"><span class="theme-toggle-thumb"></span></button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>

    </div>

    <!-- Add Student Form -->
    <form id="addForm" class="glass-float-card mb-5">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <p style="font-weight:900; font-size:1.05rem; color:var(--text-primary);">নতুন শিক্ষার্থী যোগ করুন</p>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
        <div class="field" style="margin:0;">
          <label for="newName">শিক্ষার্থীর নাম</label>
          <input class="input-glass" id="newName" required placeholder="যেমন: রহিম উদ্দিন">
        </div>
        <div class="field" style="margin:0;">
          <label for="newClass">ব্যাচ</label>
          <div class="batch-select-wrap">
            <input class="input-glass batch-search-input" id="newClass" required autocomplete="off"
                   placeholder="ব্যাচ নির্বাচন করুন..." role="combobox" aria-expanded="false" aria-controls="newBatchOptions">
            <button type="button" class="batch-select-arrow" data-batch-target="newClass" aria-label="ব্যাচ তালিকা খুলুন">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-glass btn-primary" id="addBtn" style="width:100%; padding:14px; margin-top:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        তালিকায় যোগ করুন
      </button>
    </form>

    <!-- Pending Requests -->
    <div id="requestsSection" style="display:none; margin-bottom:24px;">
      <p style="font-size:1rem; font-weight:900; color:var(--text-primary); margin-bottom:12px; display:flex; align-items:center; gap:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        যুক্ত হওয়ার অনুরোধ (Pending)
      </p>
      <div id="requestsList"></div>
    </div>

    <!-- Search & Filter Section -->
    <div class="search-filter-container">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchStudent" placeholder="নাম বা আইডি দিয়ে খুঁজুন...">
      </div>
      <div class="filter-box">
        <select id="filterBatch" class="input-glass" style="padding:12px;">
          <option value="all">সব ব্যাচ</option>
        </select>
      </div>
    </div>

    <!-- Student List -->
    <div class="glass-float-card" style="padding:4px;">
      <div id="studentList"><div class="spinner" style="margin:40px auto;"></div></div>
    </div>

    <!-- Edit Student Modal -->
    <div id="editStudentModal" class="modal-overlay" style="display:none;">
      <div class="custom-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <p style="font-weight:900; font-size:1.15rem; color:var(--text-primary);">শিক্ষার্থীর তথ্য সম্পাদনা</p>
          <button class="action-icon" id="closeEditModal" style="border:none; width:32px; height:32px; color:#ef4444; background:rgba(239, 68, 68, 0.1);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>

async function loadAllStudents() {
  const snap = await getDocs(query(collection(db, "students"), orderBy("sequenceNumber")));
  return snap.docs.map(d => ({ docId: d.id, ...d.data() }));
}

function safeText(str, fallback = "") {
  if (str === undefined || str === null || str === "undefined") return fallback;
  return String(str).trim() || fallback;
}

async function loadStudents() {
  const listEl = document.getElementById("studentList");
  try {
    allAdminStudentsList = await loadAllStudents();
    try { gamificationData = await computeGamificationData(); } catch (err) {}
    
    updateBatchFilterDropdown();
    renderFilteredList();
  } catch (err) {
    console.error(err);
    renderState(listEl, "error", "তালিকা লোড করা যায়নি।");
  }
}

function updateBatchFilterDropdown() {
  const filterSelect = document.getElementById("filterBatch");
  const currentVal = filterSelect.value;
  
  // Get unique batches
  const batches = [...new Set(allAdminStudentsList.map(s => safeText(s.className, "ব্যাচ নেই")))].filter(b => b !== "ব্যাচ নেই").sort();
  
  filterSelect.innerHTML = `<option value="all">সব ব্যাচ</option>` + 
    batches.map(b => `<option value="${b}">${b}</option>`).join("") + 
    `<option value="ব্যাচ নেই">ব্যাচ নেই</option>`;
    
  if (batches.includes(currentVal) || currentVal === "all" || currentVal === "ব্যাচ নেই") {
    filterSelect.value = currentVal;
  } else {
    filterSelect.value = "all";
  }
}

function renderFilteredList() {
  const listEl = document.getElementById("studentList");
  const searchTerm = document.getElementById("searchStudent").value.trim().toLowerCase();
  const filterBatch = document.getElementById("filterBatch").value;

  const filteredStudents = allAdminStudentsList.filter(s => {
    const sName = safeText(s.name).toLowerCase();
    const sId = safeText(s.studentId).toLowerCase();
    const sClass = safeText(s.className, "ব্যাচ নেই");
    
    const matchSearch = sName.includes(searchTerm) || sId.includes(searchTerm);
    const matchBatch = filterBatch === "all" || sClass === filterBatch;
    
    return matchSearch && matchBatch;
  });

  if (filteredStudents.length === 0) {
    renderState(listEl, "empty", "কোনো শিক্ষার্থী পাওয়া যায়নি।");
    return;
  }

  listEl.innerHTML = filteredStudents.map(s => {
    const docId = s.docId;
    const rawName = safeText(s.name, "নাম নেই");
    const displayName = rawName.length > 25 ? rawName.substring(0, 20) + "..." : rawName;
    const initial = displayName !== "নাম নেই" ? displayName.charAt(0) : "S";
    
    const stId = safeText(s.studentId, docId);
    const stClass = safeText(s.className, "");
    
    const counts = gamificationData?.badgeCounts?.[s.studentId];
    const topperTotal = counts ? (counts.monthlyOverall + counts.monthlyClass + counts.weeklyOverall + counts.weeklyClass) : 0;
    
    const avatar = s.photoURL ? `<img src="${s.photoURL}" alt="" onerror="this.style.display='none'">` : initial;

    return `
      <div class="student-row" data-id="${docId}">
        <div class="st-avatar">${avatar}</div>
        <div class="st-main">
          <div class="st-name-wrapper">
            <span class="st-name">${displayName}</span>
            <span class="st-batch-highlight">${stClass || 'ব্যাচ দেওয়া নেই'}</span>
          </div>
          <div class="st-sub">
            <span class="st-badge">${stId}</span>
            ${s.isActive === false ? `<span class="st-inactive">নিষ্ক্রিয়</span>` : ""}
          </div>
          ${topperTotal > 0 ? `<div style="margin-top:6px; font-size:0.75rem; color:#f59e0b; font-weight:800; display:flex; align-items:center; gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 5.4L20 8l-4.2 3.9L17 18l-5-3-5 3 1.2-6.1L4 8l5.6-.6z"/></svg> ${topperTotal} বার টপার</div>` : ""}
        </div>
        <div class="st-actions">
          <button class="action-icon photo-btn" title="ছবি পরিবর্তন"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
          <button class="action-icon edit-btn" title="সম্পাদনা"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="action-icon toggle-btn" title="সক্রিয়/নিষ্ক্রিয়" style="${s.isActive === false ? 'color:#ef4444; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.05);' : ''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="22" height="14" rx="7" ry="7"/><circle cx="${s.isActive !== false ? '16' : '8'}" cy="12" r="3"/></svg></button>
          <button class="action-icon delete-btn" title="শিক্ষার্থী মুছে ফেলুন"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        </div>
      </div>
    `;
  }).join("");

  bindStudentActions(filteredStudents);
}

function bindStudentActions(students) {
  document.querySelectorAll(".student-row").forEach(row => {
    const docId = row.dataset.id;
    const student = students.find(s => s.docId === docId);

    // Photo Update
    row.querySelector(".photo-btn").addEventListener("click", async () => {
      const currentUrl = student.photoURL || "";
      const input = await askForPhotoLink(currentUrl, docId);
      if (input === null) return; 
      const trimmed = input.trim();
      try {
        const finalUrl = trimmed ? toDirectImageUrl(trimmed) : null;
        await updateStudentPhoto(docId, finalUrl);
        if (currentUrl && currentUrl !== finalUrl) deleteStudentPhoto(currentUrl);
        showToast(finalUrl ? "ছবি আপডেট হয়েছে।" : "ছবি মুছে ফেলা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    // Edit Name & Class (Now opens the Modal)
    row.querySelector(".edit-btn").addEventListener("click", () => {
      currentEditDocId = docId;
      document.getElementById("editNameInput").value = safeText(student.name);
      document.getElementById("editClassInput").value = safeText(student.className);
      document.getElementById("editStudentModal").style.display = "flex";
    });

    // Toggle Active Status
    row.querySelector(".toggle-btn").addEventListener("click", async () => {
      const willActivate = student.isActive === false ? true : false;
      const msg = willActivate ? `${student.name || 'শিক্ষার্থী'} কে সক্রিয় করবেন?` : `${student.name || 'শিক্ষার্থী'} কে নিষ্ক্রিয় করবেন?`;
      if (!confirm(msg)) return;
      try {
        await updateDoc(doc(db, "students", docId), { isActive: willActivate });
        showToast(willActivate ? "সক্রিয় করা হয়েছে।" : "নিষ্ক্রিয় করা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    // Delete Student
    row.querySelector(".delete-btn").addEventListener("click", async () => {
      const msg = `সতর্কতা: আপনি কি "${student.name || 'এই শিক্ষার্থী'}" কে স্থায়ীভাবে মুছে ফেলতে চান?\n\nএই কাজটি আর বাতিল (Undo) করা যাবে না এবং এই শিক্ষার্থীর সমস্ত তথ্য মুছে যাবে।`;
      if (!confirm(msg)) return;
      try {
        if (student.photoURL) { deleteStudentPhoto(student.photoURL).catch(e => console.warn(e)); }
        await deleteDoc(doc(db, "students", docId));
        showToast("শিক্ষার্থীকে স্থায়ীভাবে মুছে ফেলা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });
  });
}

async function handleAdd(e) {
  e.preventDefault();
  const nameInput = document.getElementById("newName");
  const classInput = document.getElementById("newClass");
  const btn = document.getElementById("addBtn");
  const name = nameInput.value.trim();
  const className = classInput.value.trim();
  if (!name || !className) return;

  btn.disabled = true; btn.textContent = "যোগ করা হচ্ছে...";
  try {
    await createStudent(name, className);
    nameInput.value = ""; classInput.value = "";
    showToast("শিক্ষার্থী সফলভাবে যোগ করা হয়েছে।", "success");
    loadStudents();
  } catch (err) {
    console.error(err); showToast(friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> তালিকায় যোগ করুন`;
  }
}

// Photo Link Modal (Remains Unchanged)
function askForPhotoLink(currentUrl, studentIdHint) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="custom-modal">
        <p style="font-weight:900; font-size:1.15rem; margin-bottom:16px; color:var(--text-primary);">শিক্ষার্থীর ছবি</p>
        <p class="text-xs text-muted mb-2 font-bold">ফোন থেকে ছবি আপলোড করুন:</p>
        <input type="file" id="photoFileInput" accept="image/*" style="width:100%; font-size:0.85rem; margin-bottom:12px; padding:12px; background:rgba(128,128,128,0.05); border-radius:12px; border:1px dashed var(--surface-border);">
        <p id="photoUploadStatus" class="text-xs mb-3" style="font-weight:700; min-height:16px;"></p>
        
        <p class="text-xs text-muted mb-2 font-bold">— অথবা — লিংক পেস্ট করুন:</p>
        <textarea id="photoLinkInput" rows="3" class="input-glass" style="width:100%; resize:vertical; padding:12px; font-size:0.9rem;"></textarea>
        
        <p class="text-xs text-muted mt-3" style="font-weight:600;">খালি রেখে সেভ করলে বর্তমান ছবি মুছে যাবে।</p>
        <div class="flex gap-2 mt-4">
          <button type="button" class="btn-glass" id="photoLinkCancel" style="flex:1; padding:12px;">বাতিল</button>
          <button type="button" class="btn-glass btn-primary" id="photoLinkSave" style="flex:1; padding:12px;">সেভ করুন</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const textarea = overlay.querySelector("#photoLinkInput");
    const fileInput = overlay.querySelector("#photoFileInput");
    const statusEl = overlay.querySelector("#photoUploadStatus");
    textarea.value = currentUrl || "";

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      statusEl.textContent = "আপলোড হচ্ছে, অপেক্ষা করুন...";
      statusEl.style.color = "var(--text-muted)";
      try {
        const url = await uploadStudentPhoto(file, studentIdHint);
        statusEl.textContent = "আপলোড সম্পন্ন! সেভ করুন।";
        statusEl.style.color = "#10b981";
        textarea.value = url;
      } catch (err) {
        statusEl.textContent = "আপলোড ব্যর্থ। লিংক পেস্ট করুন।";
        statusEl.style.color = "#ef4444";
      }
    });

    function cleanup(result) { overlay.remove(); resolve(result); }
    overlay.querySelector("#photoLinkCancel").addEventListener("click", () => cleanup(null));
    overlay.querySelector("#photoLinkSave").addEventListener("click", () => cleanup(textarea.value));
  });
}

// Pending Requests Logic
async function loadPendingRequests() {
  const reqSection = document.getElementById("requestsSection");
  const el = document.getElementById("requestsList");
  try {
    const requests = await getPendingRequests();
    if (requests.length === 0) { reqSection.style.display = "none"; return; }
    
    reqSection.style.display = "block";
    el.innerHTML = requests.map(r => `
      <div class="glass-float-card mb-3" data-req-id="${r.id}" style="border-left:4px solid #f59e0b;">
        <p class="text-xs text-muted mb-3" style="font-weight:700;">আবেদনকারী: <span style="font-weight:900; color:var(--text-primary); font-size:0.95rem;">${safeText(r.rawName)}</span> <span style="background:rgba(128,128,128,0.1); padding:2px 8px; border-radius:6px; margin-left:6px;">${safeText(r.className)}</span></p>
        <div class="field" style="margin-bottom:12px;">
          <input class="input-glass req-name-input" value="${safeText(r.rawName)}" placeholder="অপ্রয়োজনে এডিট করুন">
        </div>
        <div class="flex gap-2">
          <button class="btn-glass req-reject-btn" style="flex:1; color:#ef4444; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.05); padding:12px;">বাতিল</button>
          <button class="btn-glass btn-primary req-approve-btn" style="flex:1; padding:12px;">অনুমোদন দিন</button>
        </div>
      </div>
    `).join("");

    requests.forEach(r => wireRequestCard(r));
  } catch (err) { console.error(err); }
}

function wireRequestCard(request) {
  const card = document.querySelector(`[data-req-id="${request.id}"]`);
  if (!card) return;
  const nameInput = card.querySelector(".req-name-input");

  card.querySelector(".req-approve-btn").addEventListener("click", async () => {
    const finalName = nameInput.value.trim();
    if (!finalName) { showToast("নাম খালি রাখা যাবে না।", "error"); return; }
    if (!confirm(`"${finalName}" কে অনুমোদন দেবেন?`)) return;
    try {
      await createStudent(finalName, request.className);
      await deleteStudentRequest(request.id);
      showToast("শিক্ষার্থী যোগ করা হয়েছে।", "success");
      loadPendingRequests(); loadStudents();
    } catch (err) { showToast(friendlyError(err), "error"); }
  });

  card.querySelector(".req-reject-btn").addEventListener("click", async () => {
    if (!confirm("আবেদন বাতিল করবেন?")) return;
    try {
      await deleteStudentRequest(request.id);
      showToast("আবেদন বাতিল করা হয়েছে।", "success");
      loadPendingRequests();
    } catch (err) { showToast(friendlyError(err), "error"); }
  });
}
</script>
