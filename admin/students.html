<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষার্থী ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getActiveStudents, createStudent, updateStudentPhoto } from "../js/utils/student-utils.js";
import { toDirectImageUrl } from "../js/utils/image-utils.js";
import { uploadStudentPhoto, deleteStudentPhoto } from "../js/utils/storage-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { collection, getDocs, orderBy, query, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

initTheme();
const shell = document.getElementById("shell");

requireAdmin(() => {
  shell.innerHTML = `
    <div class="topbar">
      <a href="../admin/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">শিক্ষার্থী ব্যবস্থাপনা</h2>
      <div class="flex gap-2">
        <a href="../admin/analytics.html" class="btn btn-secondary btn-sm">ক্লাস বিশ্লেষণ</a>
        <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
        <button class="icon-btn hidden" id="installBtn" title="অ্যাপ ইনস্টল করুন"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>
        <button class="icon-btn" id="logoutBtn">${icons.arrowRight}</button>
      </div>
    </div>

    <form id="addForm" class="glass card">
      <p class="eyebrow mb-2">নতুন শিক্ষার্থী যোগ করুন</p>
      <div class="field mt-3">
        <label for="newName">শিক্ষার্থীর নাম</label>
        <input class="input" id="newName" required placeholder="যেমন: রহিম উদ্দিন">
      </div>
      <div class="field mt-3">
        <label for="newClass">ক্লাস</label>
        <input class="input" id="newClass" required placeholder="যেমন: ৮ম শ্রেণি">
      </div>
      <button type="submit" class="btn btn-primary" id="addBtn">
        <span style="width:18px;height:18px;">${icons.plus}</span> যোগ করুন
      </button>
    </form>

    <p class="eyebrow mt-5 mb-2">সব শিক্ষার্থী</p>
    <div id="studentList"><div class="glass card skeleton" style="height:70px;"></div></div>
  `;

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  document.getElementById("addForm").addEventListener("submit", handleAdd);
  loadStudents();
});

async function loadAllStudents() {
  const snap = await getDocs(query(collection(db, "students"), orderBy("sequenceNumber")));
  return snap.docs.map(d => ({ docId: d.id, ...d.data() }));
}

// Custom modal (replaces prompt()) — some mobile browsers truncate or
// mishandle long pasted text inside a native prompt() box. A plain
// <textarea> has no such limit, so long Google Drive links are never cut off.
function askForPhotoLink(currentUrl, studentIdHint) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";
    overlay.innerHTML = `
      <div class="glass card" style="max-width:480px;width:100%;">
        <p style="font-weight:700;margin-bottom:8px;">ছবি দিন</p>

        <p class="text-xs text-muted mb-2">ফোন থেকে সরাসরি ছবি আপলোড করুন:</p>
        <input type="file" id="photoFileInput" accept="image/*" style="width:100%;font-size:13px;">
        <p id="photoUploadStatus" class="text-xs mt-2" style="min-height:16px;"></p>

        <div class="mt-3" style="border-top:1px solid var(--border-color,#e5ddc8);padding-top:12px;">
          <p class="text-xs text-muted mb-2">— অথবা — লিংক পেস্ট করুন (Google Drive শেয়ার লিংক, "Anyone with the link" করা থাকতে হবে, বা সরাসরি ছবির URL):</p>
          <textarea id="photoLinkInput" rows="3" style="width:100%;resize:vertical;padding:10px;border-radius:8px;font-family:inherit;font-size:14px;box-sizing:border-box;"></textarea>
        </div>

        <p class="text-xs text-muted mt-2">খালি রেখে সেভ করলে ছবি মুছে যাবে।</p>
        <div class="flex gap-2 mt-3" style="justify-content:flex-end;">
          <button type="button" class="btn btn-secondary" id="photoLinkCancel">বাতিল</button>
          <button type="button" class="btn btn-primary" id="photoLinkSave">সেভ করুন</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const textarea = overlay.querySelector("#photoLinkInput");
    const fileInput = overlay.querySelector("#photoFileInput");
    const statusEl = overlay.querySelector("#photoUploadStatus");
    textarea.value = currentUrl || "";
    textarea.focus();

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      statusEl.textContent = "আপলোড হচ্ছে...";
      statusEl.style.color = "var(--text-muted)";
      try {
        const url = await uploadStudentPhoto(file, studentIdHint);
        textarea.value = url;
        statusEl.textContent = "আপলোড সম্পন্ন — নিচে \"সেভ করুন\" চাপুন।";
        statusEl.style.color = "var(--color-success, green)";
      } catch (err) {
        statusEl.textContent = friendlyError(err);
        statusEl.style.color = "var(--color-error, crimson)";
      }
    });

    function cleanup(result) { overlay.remove(); resolve(result); }
    overlay.querySelector("#photoLinkCancel").addEventListener("click", () => cleanup(null));
    overlay.querySelector("#photoLinkSave").addEventListener("click", () => cleanup(textarea.value));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) cleanup(null); });
  });
}

async function loadStudents() {
  const listEl = document.getElementById("studentList");
  try {
    const students = await loadAllStudents();
    if (students.length === 0) {
      renderState(listEl, "empty", "এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।");
      return;
    }
    listEl.innerHTML = students.map(s => `
      <div class="glass card mt-2" data-id="${s.docId}">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            ${s.photoURL
              ? `<img src="${s.photoURL}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand-mark',textContent:'${s.name.charAt(0)}'}))">`
              : `<div class="brand-mark" style="flex-shrink:0;">${s.name.charAt(0)}</div>`}
            <div>
              <p style="font-weight:700;">
                <span class="student-name">${s.name}</span>
              </p>
              <p class="text-xs text-muted">${s.studentId}${s.className ? ` • ${s.className}` : ""}${s.isActive ? "" : " • নিষ্ক্রিয়"}</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button class="icon-btn photo-btn" title="ছবি পরিবর্তন">${icons.camera}</button>
            <button class="icon-btn edit-btn" title="নাম/ক্লাস সম্পাদনা">${icons.edit}</button>
            <button class="icon-btn toggle-btn" title="সক্রিয়/নিষ্ক্রিয়">${icons.toggle}</button>
          </div>
        </div>
      </div>
    `).join("");

    listEl.querySelectorAll("[data-id]").forEach(card => {
      const docId = card.dataset.id;
      const student = students.find(s => s.docId === docId);

      card.querySelector(".photo-btn").addEventListener("click", async () => {
        const currentUrl = student.photoURL || "";
        const input = await askForPhotoLink(currentUrl, docId);
        if (input === null) return; // cancelled
        const trimmed = input.trim();
        try {
          const finalUrl = trimmed ? toDirectImageUrl(trimmed) : null;
          await updateStudentPhoto(docId, finalUrl);
          // Old photo is being replaced/removed — clean up the old Storage
          // file so it doesn't sit around unused (best-effort, won't block).
          if (currentUrl && currentUrl !== finalUrl) deleteStudentPhoto(currentUrl);
          showToast(finalUrl ? "ছবি আপডেট করা হয়েছে।" : "ছবি মুছে ফেলা হয়েছে।", "success");
          loadStudents();
        } catch (err) {
          showToast(friendlyError(err), "error");
        }
      });

      card.querySelector(".edit-btn").addEventListener("click", async () => {
        const nameEl = card.querySelector(".student-name");
        const newName = prompt("নতুন নাম লিখুন:", student.name);
        if (newName === null) return;
        const trimmedName = newName.trim();
        if (!trimmedName) return;

        const newClass = prompt("ক্লাস লিখুন:", student.className || "");
        if (newClass === null) return;
        const trimmedClass = newClass.trim();
        if (!trimmedClass) { showToast("ক্লাস খালি রাখা যাবে না।", "error"); return; }

        try {
          await updateDoc(doc(db, "students", docId), { name: trimmedName, className: trimmedClass });
          nameEl.textContent = trimmedName;
          student.name = trimmedName;
          student.className = trimmedClass;
          showToast("তথ্য আপডেট করা হয়েছে।", "success");
          loadStudents();
        } catch (err) {
          showToast(friendlyError(err), "error");
        }
      });

      card.querySelector(".toggle-btn").addEventListener("click", async () => {
        const willActivate = !student.isActive;
        const confirmMsg = willActivate
          ? `${student.name} কে আবার সক্রিয় করবেন?`
          : `${student.name} কে নিষ্ক্রিয় করবেন? সে আর হোমপেজে দেখা যাবে না।`;
        if (!confirm(confirmMsg)) return;
        try {
          await updateDoc(doc(db, "students", docId), { isActive: willActivate });
          showToast(willActivate ? "সক্রিয় করা হয়েছে।" : "নিষ্ক্রিয় করা হয়েছে।", "success");
          loadStudents();
        } catch (err) {
          showToast(friendlyError(err), "error");
        }
      });
    });

  } catch (err) {
    console.error(err);
    renderState(listEl, "error", "শিক্ষার্থীদের তালিকা লোড করা যায়নি।");
  }
}

async function handleAdd(e) {
  e.preventDefault();
  const nameInput = document.getElementById("newName");
  const classInput = document.getElementById("newClass");
  const btn = document.getElementById("addBtn");
  const name = nameInput.value.trim();
  const className = classInput.value.trim();
  if (!name || !className) return;

  btn.disabled = true;
  btn.textContent = "যোগ করা হচ্ছে...";
  try {
    await createStudent(name, className);
    nameInput.value = "";
    classInput.value = "";
    showToast("শিক্ষার্থী সফলভাবে যোগ করা হয়েছে।", "success");
    loadStudents();
  } catch (err) {
    console.error(err);
    showToast(friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span style="width:18px;height:18px;">${icons.plus}</span> যোগ করুন`;
  }
}
</script>
</body>
</html>
