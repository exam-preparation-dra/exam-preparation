<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষার্থী ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  
  /* ===== Premium Glassmorphism Theme ===== */
  .glass-float-card {
    background: rgba(128, 128, 128, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.12);
    border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-glass {
    background: rgba(128, 128, 128, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 12px; color: var(--text-primary);
    padding: 8px 12px; font-weight: 700; font-size: 0.8rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-glass:active { transform: scale(0.96); }
  .btn-primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }

  /* ===== Form Styles ===== */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
  .input-glass {
    width: 100%; box-sizing: border-box; padding: 12px 14px;
    background: rgba(128, 128, 128, 0.05); border: 1px solid var(--surface-border);
    border-radius: 10px; color: var(--text-primary);
    font-family: inherit; font-size: 0.9rem; font-weight: 600; outline: none;
  }
  .input-glass:focus { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(var(--color-accent-rgb), 0.15); background: var(--surface); }

  /* ===== Student Card Layout ===== */
  .student-row { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-bottom: 1px dashed rgba(128,128,128,0.15); }
  .student-row:last-child { border-bottom: none; }
  .st-avatar {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-soft); color: var(--color-accent); font-weight: 800; font-size: 1.1rem;
  }
  .st-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .st-main { flex: 1; min-width: 0; }
  .st-name { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-sub { font-size: 0.75rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .st-badge { background: rgba(128,128,128,0.08); padding: 2px 8px; border-radius: 6px; font-weight: 700; color: var(--text-secondary); }
  .st-inactive { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 6px; font-weight: 700; }
  
  .st-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .action-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.08); color: var(--text-secondary); cursor: pointer; border: none; }
  .action-icon:hover { background: rgba(128,128,128,0.15); color: var(--text-primary); }

  /* ===== Modal Styles ===== */
  .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .custom-modal { width: 100%; max-width: 400px; padding: 20px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; }
</style>
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getActiveStudents, createStudent, updateStudentPhoto } from "../js/utils/student-utils.js";
import { getPendingRequests, deleteStudentRequest } from "../js/utils/student-requests-utils.js";
import { transliterateToBengali, promptForApiKey } from "../js/utils/ai-import-utils.js";
import { toDirectImageUrl, uploadImageWithGuidedFallback } from "../js/utils/image-utils.js";
import { uploadStudentPhoto, deleteStudentPhoto } from "../js/utils/storage-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { collection, getDocs, orderBy, query, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { computeGamificationData } from "../js/utils/gamification-utils.js";

initTheme();
const shell = document.getElementById("shell");

requireAdmin(() => {
  shell.innerHTML = `
    <div class="topbar" style="margin-bottom:16px;">
      <a href="../admin/dashboard.html" class="icon-btn" style="width:36px;height:36px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 style="font-size:1.1rem; font-weight:800;">শিক্ষার্থী ব্যবস্থাপনা</h2>
      <div class="flex gap-2">
        <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
        <button class="icon-btn" id="logoutBtn" style="width:36px;height:36px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Add Student Form -->
    <form id="addForm" class="glass-float-card mb-5">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <p style="font-weight:800; font-size:1rem; color:var(--text-primary);">নতুন শিক্ষার্থী যোগ করুন</p>
      </div>
      <div class="field">
        <label for="newName">শিক্ষার্থীর নাম</label>
        <input class="input-glass" id="newName" required placeholder="যেমন: রহিম উদ্দিন">
      </div>
      <div class="field">
        <label for="newClass">ব্যাচ বা ক্লাস</label>
        <input class="input-glass" id="newClass" required placeholder="যেমন: Batch 8">
      </div>
      <button type="submit" class="btn-glass btn-primary" id="addBtn" style="width:100%; padding:12px; margin-top:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        যোগ করুন
      </button>
    </form>

    <!-- Pending Requests -->
    <div id="requestsSection" style="display:none; margin-bottom:20px;">
      <p style="font-size:0.9rem; font-weight:800; color:var(--text-secondary); margin-bottom:10px;">যুক্ত হওয়ার অনুরোধ (Pending)</p>
      <div id="requestsList"></div>
    </div>

    <!-- Student List -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <p style="font-size:0.9rem; font-weight:800; color:var(--text-secondary);">সব শিক্ষার্থী</p>
      <a href="../admin/analytics.html" class="btn-glass" style="padding:6px 12px; font-size:0.75rem;">বিশ্লেষণ</a>
    </div>
    <div class="glass-float-card" style="padding:4px;">
      <div id="studentList"><div class="spinner" style="margin:20px auto;"></div></div>
    </div>
  `;

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  document.getElementById("addForm").addEventListener("submit", handleAdd);
  
  loadStudents();
  loadPendingRequests();
});

async function loadAllStudents() {
  const snap = await getDocs(query(collection(db, "students"), orderBy("sequenceNumber")));
  return snap.docs.map(d => ({ docId: d.id, ...d.data() }));
}

// Fixed undefined data handling
function safeText(str, fallback = "") {
  if (str === undefined || str === null || str === "undefined") return fallback;
  return String(str).trim() || fallback;
}

async function loadStudents() {
  const listEl = document.getElementById("studentList");
  try {
    const students = await loadAllStudents();
    if (students.length === 0) {
      renderState(listEl, "empty", "এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।");
      return;
    }

    let gamification = null;
    try { gamification = await computeGamificationData(); } catch (err) {}

    listEl.innerHTML = students.map(s => {
      // Clean up undefined errors
      const docId = s.docId;
      const rawName = safeText(s.name, "নাম নেই");
      // If name is huge/firebase ID, truncate it
      const displayName = rawName.length > 25 ? rawName.substring(0, 20) + "..." : rawName;
      const initial = displayName !== "নাম নেই" ? displayName.charAt(0) : "S";
      
      const stId = safeText(s.studentId, docId);
      const stClass = safeText(s.className, "");
      
      const counts = gamification?.badgeCounts?.[s.studentId];
      const topperTotal = counts ? (counts.monthlyOverall + counts.monthlyClass + counts.weeklyOverall + counts.weeklyClass) : 0;
      
      const avatar = s.photoURL 
        ? `<img src="${s.photoURL}" alt="" onerror="this.style.display='none'">` 
        : initial;

      return `
        <div class="student-row" data-id="${docId}">
          <div class="st-avatar">${avatar}</div>
          <div class="st-main">
            <div class="st-name">${displayName}</div>
            <div class="st-sub">
              <span class="st-badge">${stId}</span>
              ${stClass ? `<span class="st-badge">${stClass}</span>` : ""}
              ${s.isActive === false ? `<span class="st-inactive">নিষ্ক্রিয়</span>` : ""}
            </div>
            ${topperTotal > 0 ? `<div style="margin-top:4px; font-size:0.7rem; color:#f59e0b; font-weight:700;">🏆 ${topperTotal} বার টপার</div>` : ""}
          </div>
          <div class="st-actions">
            <button class="action-icon photo-btn" title="ছবি পরিবর্তন"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
            <button class="action-icon edit-btn" title="সম্পাদনা"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="action-icon toggle-btn" title="সক্রিয়/নিষ্ক্রিয়" style="${s.isActive === false ? 'color:#ef4444;' : ''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="22" height="14" rx="7" ry="7"/><circle cx="${s.isActive !== false ? '16' : '8'}" cy="12" r="3"/></svg></button>
          </div>
        </div>
      `;
    }).join("");

    bindStudentActions(students);
  } catch (err) {
    console.error(err);
    renderState(listEl, "error", "তালিকা লোড করা যায়নি।");
  }
}

function bindStudentActions(students) {
  document.querySelectorAll(".student-row").forEach(row => {
    const docId = row.dataset.id;
    const student = students.find(s => s.docId === docId);

    // Photo Update
    row.querySelector(".photo-btn").addEventListener("click", async () => {
      const currentUrl = student.photoURL || "";
      const input = await askForPhotoLink(currentUrl, docId);
      if (input === null) return; 
      const trimmed = input.trim();
      try {
        const finalUrl = trimmed ? toDirectImageUrl(trimmed) : null;
        await updateStudentPhoto(docId, finalUrl);
        if (currentUrl && currentUrl !== finalUrl) deleteStudentPhoto(currentUrl);
        showToast(finalUrl ? "ছবি আপডেট হয়েছে।" : "ছবি মুছে ফেলা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    // Edit Name & Class
    row.querySelector(".edit-btn").addEventListener("click", async () => {
      const newName = prompt("নতুন নাম লিখুন:", safeText(student.name));
      if (newName === null) return;
      const trimmedName = newName.trim();
      if (!trimmedName) return;

      const newClass = prompt("ক্লাস বা ব্যাচ লিখুন:", safeText(student.className));
      if (newClass === null) return;
      const trimmedClass = newClass.trim();

      try {
        await updateDoc(doc(db, "students", docId), { name: trimmedName, className: trimmedClass });
        showToast("তথ্য আপডেট করা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });

    // Toggle Active Status
    row.querySelector(".toggle-btn").addEventListener("click", async () => {
      const willActivate = student.isActive === false ? true : false;
      const msg = willActivate ? `${student.name || 'শিক্ষার্থী'} কে সক্রিয় করবেন?` : `${student.name || 'শিক্ষার্থী'} কে নিষ্ক্রিয় করবেন?`;
      if (!confirm(msg)) return;
      try {
        await updateDoc(doc(db, "students", docId), { isActive: willActivate });
        showToast(willActivate ? "সক্রিয় করা হয়েছে।" : "নিষ্ক্রিয় করা হয়েছে।", "success");
        loadStudents();
      } catch (err) { showToast(friendlyError(err), "error"); }
    });
  });
}

async function handleAdd(e) {
  e.preventDefault();
  const nameInput = document.getElementById("newName");
  const classInput = document.getElementById("newClass");
  const btn = document.getElementById("addBtn");
  const name = nameInput.value.trim();
  const className = classInput.value.trim();
  if (!name || !className) return;

  btn.disabled = true;
  btn.textContent = "যোগ করা হচ্ছে...";
  try {
    await createStudent(name, className);
    nameInput.value = ""; classInput.value = "";
    showToast("শিক্ষার্থী যোগ করা হয়েছে।", "success");
    loadStudents();
  } catch (err) {
    console.error(err); showToast(friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> যোগ করুন`;
  }
}

// Photo Link Modal (Replaced prompt)
function askForPhotoLink(currentUrl, studentIdHint) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="custom-modal">
        <p style="font-weight:800; font-size:1.1rem; margin-bottom:16px;">শিক্ষার্থীর ছবি</p>
        <p class="text-xs text-muted mb-2">ফোন থেকে ছবি আপলোড করুন:</p>
        <input type="file" id="photoFileInput" accept="image/*" style="width:100%; font-size:0.8rem; margin-bottom:12px; padding:10px; background:rgba(128,128,128,0.05); border-radius:8px;">
        <p id="photoUploadStatus" class="text-xs mb-3" style="font-weight:600; min-height:16px;"></p>
        
        <p class="text-xs text-muted mb-2">— অথবা — গুগল ড্রাইভ লিংক পেস্ট করুন:</p>
        <textarea id="photoLinkInput" rows="3" class="input-glass" style="width:100%; resize:vertical; padding:10px; font-size:0.85rem;"></textarea>
        
        <p class="text-xs text-muted mt-2" style="font-size:0.7rem;">খালি রেখে সেভ করলে ছবি মুছে যাবে।</p>
        <div class="flex gap-2 mt-4">
          <button type="button" class="btn-glass" id="photoLinkCancel" style="flex:1;">বাতিল</button>
          <button type="button" class="btn-glass btn-primary" id="photoLinkSave" style="flex:1;">সেভ করুন</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const textarea = overlay.querySelector("#photoLinkInput");
    const fileInput = overlay.querySelector("#photoFileInput");
    const statusEl = overlay.querySelector("#photoUploadStatus");
    textarea.value = currentUrl || "";

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      statusEl.textContent = "আপলোড হচ্ছে...";
      statusEl.style.color = "var(--text-muted)";
      try {
        const url = await uploadStudentPhoto(file, studentIdHint);
        statusEl.textContent = "আপলোড সম্পন্ন! সেভ করুন।";
        statusEl.style.color = "#10b981";
        textarea.value = url;
      } catch (err) {
        statusEl.textContent = "আপলোড ব্যর্থ। লিংক পেস্ট করুন।";
        statusEl.style.color = "#ef4444";
      }
    });

    function cleanup(result) { overlay.remove(); resolve(result); }
    overlay.querySelector("#photoLinkCancel").addEventListener("click", () => cleanup(null));
    overlay.querySelector("#photoLinkSave").addEventListener("click", () => cleanup(textarea.value));
  });
}

// Pending Requests Logic
async function loadPendingRequests() {
  const reqSection = document.getElementById("requestsSection");
  const el = document.getElementById("requestsList");
  try {
    const requests = await getPendingRequests();
    if (requests.length === 0) { reqSection.style.display = "none"; return; }
    
    reqSection.style.display = "block";
    el.innerHTML = requests.map(r => `
      <div class="glass-float-card mb-3" data-req-id="${r.id}" style="border-left:4px solid var(--color-accent);">
        <p class="text-xs text-muted mb-2">আবেদনকারী: <span style="font-weight:700; color:var(--text-primary); font-size:0.85rem;">${safeText(r.rawName)}</span> <span style="opacity:0.7;">• ${safeText(r.className)}</span></p>
        <div class="field">
          <input class="input-glass req-name-input" value="${safeText(r.rawName)}" placeholder="বাংলা নাম লিখুন">
        </div>
        <div class="flex gap-2 mt-2">
          <button class="btn-glass req-reject-btn" style="flex:1; color:#ef4444; border-color:rgba(239,68,68,0.2);">বাতিল</button>
          <button class="btn-glass btn-primary req-approve-btn" style="flex:1;">অনুমোদন</button>
        </div>
      </div>
    `).join("");

    requests.forEach(r => wireRequestCard(r));
  } catch (err) { console.error(err); }
}

function wireRequestCard(request) {
  const card = document.querySelector(`[data-req-id="${request.id}"]`);
  if (!card) return;
  const nameInput = card.querySelector(".req-name-input");

  card.querySelector(".req-approve-btn").addEventListener("click", async () => {
    const finalName = nameInput.value.trim();
    if (!finalName) { showToast("নাম খালি রাখা যাবে না।", "error"); return; }
    if (!confirm(`"${finalName}" কে অনুমোদন দেবেন?`)) return;
    try {
      await createStudent(finalName, request.className);
      await deleteStudentRequest(request.id);
      showToast("শিক্ষার্থী যোগ করা হয়েছে।", "success");
      loadPendingRequests(); loadStudents();
    } catch (err) { showToast(friendlyError(err), "error"); }
  });

  card.querySelector(".req-reject-btn").addEventListener("click", async () => {
    if (!confirm("আবেদন বাতিল করবেন?")) return;
    try {
      await deleteStudentRequest(request.id);
      showToast("আবেদন বাতিল করা হয়েছে।", "success");
      loadPendingRequests();
    } catch (err) { showToast(friendlyError(err), "error"); }
  });
}
</script>
</body>
</html>
