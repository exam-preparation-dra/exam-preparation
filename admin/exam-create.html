<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষা তৈরি — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 800px; padding-bottom: 40px; margin: 0 auto; }

  /* ===== Premium Glass Cards ===== */
  .glass-card {
    background: rgba(128, 128, 128, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 20px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02); transition: all 0.3s ease;
  }
  .section-title { font-size: 1.15rem; font-weight: 900; color: var(--text-primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed var(--surface-border); padding-bottom: 12px; }

  /* ===== Form & Input Styles ===== */
  .field { margin-bottom: 16px; }
  .field label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 8px; }
  .input-glass {
    width: 100%; box-sizing: border-box; padding: 14px 16px;
    background: rgba(128, 128, 128, 0.04); border: 1px solid var(--surface-border);
    border-radius: 14px; color: var(--text-primary);
    font-family: inherit; font-size: 0.95rem; font-weight: 600; outline: none; transition: 0.2s;
  }
  .input-glass:focus { border-color: var(--color-accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), 0.15); }
  textarea.input-glass { resize: vertical; min-height: 100px; }
  select.input-glass { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em; }

  /* ===== Responsive Grids ===== */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

  /* ===== Premium Buttons ===== */
  .btn-glass {
    background: rgba(128, 128, 128, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(128, 128, 128, 0.15);
    border-radius: 14px; color: var(--text-primary); padding: 12px 20px; font-weight: 800; font-size: 0.95rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-glass:hover { background: rgba(128, 128, 128, 0.1); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
  .btn-glass:active { transform: translateY(0) scale(0.96); }
  
  .btn-primary { background: linear-gradient(135deg, var(--color-accent), #f59e0b); color: #fff; border: none; box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.3); }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(var(--color-accent-rgb), 0.4); transform: translateY(-2px); }

  /* ===== AI Rows ===== */
  .ai-row { background: rgba(128,128,128,0.02); border: 1px solid rgba(128,128,128,0.1); border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; }
  .remove-ai-btn { position: absolute; top: 16px; right: 16px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: none; border-radius: 10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
  .remove-ai-btn:hover { background: #ef4444; color: #fff; }

  /* ===== Selected Questions List ===== */
  .sel-question-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; transition: 0.2s; }
  .sel-question-card:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
  .action-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.05); color: var(--text-secondary); border: 1px solid rgba(128,128,128,0.1); cursor: pointer; transition: 0.2s; flex-shrink: 0; }
  .action-icon:hover { background: var(--surface); color: var(--color-accent); border-color: var(--color-accent); }
  .action-icon.delete:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: #ef4444; }

  /* ===== Topbar ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: 16px; background: rgba(var(--bg-rgb, 10,14,26), 0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(128,128,128,0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
</style>
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, showToast, friendlyError, aiBadge } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getFullSyllabusTree, buildNameMap } from "../js/utils/syllabus-utils.js";
import { getQuestionsByIds, addQuestion } from "../js/utils/question-utils.js";
import { createExam, updateExam, getExamById, calculateTotalMarks } from "../js/utils/exam-utils.js";
import { generateQuestionsFromImage, parseAiImportText, promptForApiKey, fileToImagePart } from "../js/utils/ai-import-utils.js";

initTheme();
const shell = document.getElementById("shell");
const params = new URLSearchParams(window.location.search);
const editId = params.get("id");

let tree = [];
let selectedQuestions = []; 
let existingExam = null;

requireAdmin(async () => {
  shell.innerHTML = template();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  
  document.getElementById("examForm").addEventListener("submit", handleSubmit);
  document.getElementById("marksPerQuestion").addEventListener("input", updateTotalMarks);
  
  document.getElementById("goToBank").addEventListener("click", () => {
    persistCart();
    const returnUrl = editId ? `../admin/exam-create.html?id=${encodeURIComponent(editId)}` : "../admin/exam-create.html";
    window.location.href = `../admin/questions.html?returnTo=${encodeURIComponent(returnUrl)}`;
  });
  
  document.getElementById("quickAddForm").addEventListener("submit", handleQuickAdd);
  document.getElementById("addAiRowBtn").addEventListener("click", addAiRow);
  document.getElementById("aiGenerateBtn").addEventListener("click", handleAiGenerate);

  tree = await getFullSyllabusTree();
  populateTargetBatch();
  populateQuickAddSyllabus();
  addAiRow();

  const cartContext = localStorage.getItem("examBuilderContext");
  const cartIds = JSON.parse(localStorage.getItem("examBuilderSelection") || "[]");

  if (editId) {
    existingExam = await getExamById(editId);
    if (!existingExam) { showToast("পরীক্ষা পাওয়া যায়নি।", "error"); return; }
    if (existingExam.status !== "draft") { showToast("শুধুমাত্র খসড়া পরীক্ষা সম্পাদনা করা যায়।", "error"); }
    fillFormFromExisting();
    
    if (cartContext === editId) {
      selectedQuestions = await getQuestionsByIds(cartIds);
    } else {
      selectedQuestions = await getQuestionsByIds(existingExam.questionIds || []);
      persistCart();
    }
  } else {
    if (cartContext === "new") {
      selectedQuestions = await getQuestionsByIds(cartIds);
    } else {
      selectedQuestions = [];
      persistCart();
    }
  }
  renderSelectedList();
  updateTotalMarks();
});

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

      </div>
      
      <div class="grid-2 mt-2">

      </div>
      
      <button type="button" class="btn-glass" id="aiGenerateBtn" style="width:100%; background:rgba(139,92,246,0.1); color:#8b5cf6; border-color:rgba(139,92,246,0.3); padding:16px; margin-top:16px; font-size:1rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>

function populateTargetBatch() {
  const targetBatchSel = document.getElementById("examTargetBatch");
  const batches = [...new Set(tree.map(b => b.name_bn))].sort();
  batches.forEach(b => {
    targetBatchSel.innerHTML += `<option value="${b}">${b}</option>`;
  });
}

function fillFormFromExisting() {
  document.getElementById("examName").value = existingExam.name || "";
  document.getElementById("examDesc").value = existingExam.description || "";
  if (existingExam.examDate?.toDate) {
    document.getElementById("examDate").value = existingExam.examDate.toDate().toISOString().slice(0, 10);
  }
  document.getElementById("examTime").value = existingExam.informationalTime || "";
  document.getElementById("examDuration").value = existingExam.durationMinutes || "";
  document.getElementById("marksPerQuestion").value = existingExam.marksPerQuestion || 1;
  document.getElementById("examTargetBatch").value = existingExam.targetBatch || "all";
}

function populateQuickAddSyllabus() {
  const subjSel = document.getElementById("qaSubject");
  subjSel.innerHTML = tree.map(s => `<option value="${s.id}">${s.name_bn}</option>`).join("");
  subjSel.addEventListener("change", updateQaChapters);
  document.getElementById("qaChapter").addEventListener("change", updateQaTopics);
  if (tree[0]) updateQaChapters();
}
function updateQaChapters() {
  const subject = tree.find(s => s.id === document.getElementById("qaSubject").value);
  document.getElementById("qaChapter").innerHTML = (subject?.chapters || []).map(c => `<option value="${c.id}">${c.name_bn}</option>`).join("");
  updateQaTopics();
}
function updateQaTopics() {
  const subject = tree.find(s => s.id === document.getElementById("qaSubject").value);
  const chapter = subject?.chapters.find(c => c.id === document.getElementById("qaChapter").value);
  document.getElementById("qaTopic").innerHTML = (chapter?.topics || []).map(t => `<option value="${t.id}">${t.name_bn}</option>`).join("");
}

// AI QUESTION PAPER MAKER 
let aiRowCounter = 0;

function addAiRow() {
  aiRowCounter++;
  const rowId = aiRowCounter;
  document.getElementById("aiRowsContainer").insertAdjacentHTML("beforeend", aiRowHtml(rowId));
  populateAiRowSyllabus(rowId);
  const rowEl = document.getElementById(`aiRow-${rowId}`);
  rowEl.querySelector(".remove-ai-row-btn").addEventListener("click", () => rowEl.remove());
}

function aiRowHtml(rowId) {
  return `
    <div class="ai-row" id="aiRow-${rowId}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <p style="font-size:0.85rem; font-weight:800; color:var(--text-secondary);">সিলেকশন #${rowId}</p>
        <button type="button" class="remove-ai-btn remove-ai-row-btn" title="মুছে ফেলুন">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      
      <div class="grid-3">
        <div class="field" style="margin:0;"><label>ব্যাচ</label><select class="input-glass ai-row-subject"></select></div>
        <div class="field" style="margin:0;"><label>বিষয়</label><select class="input-glass ai-row-chapter"></select></div>
        <div class="field" style="margin:0;"><label>কতগুলো প্রশ্ন</label><input class="input-glass ai-row-count" type="number" min="1" value="5"></div>
      </div>
      
      <div class="field mt-3">
        <label>টপিক / নির্দেশনা (ঐচ্ছিক)</label>
        <textarea class="input-glass ai-row-instructions" style="min-height:60px;" placeholder="যেমন: শুধু নিউটনের ৩টা সূত্র থেকে, মাঝারি মানের প্রশ্ন"></textarea>
      </div>
      
      <div class="field mt-3">
        <label>বইয়ের পাতার ছবি (ঐচ্ছিক)</label>
        <input class="input-glass ai-row-images" type="file" accept="image/*" multiple style="padding:10px;">
      </div>
      
      <p class="text-sm mt-3 font-bold" id="aiRowStatus-${rowId}"></p>
    </div>
  `;
}

function populateAiRowSyllabus(rowId) {
  const rowEl = document.getElementById(`aiRow-${rowId}`);
  const subjSel = rowEl.querySelector(".ai-row-subject");
  const chapSel = rowEl.querySelector(".ai-row-chapter");
  subjSel.innerHTML = tree.map(s => `<option value="${s.id}">${s.name_bn}</option>`).join("");
  function refreshChapters() {
    const subject = tree.find(s => s.id === subjSel.value);
    chapSel.innerHTML = (subject?.chapters || []).map(c => `<option value="${c.id}">${c.name_bn}</option>`).join("");
  }
  subjSel.addEventListener("change", refreshChapters);
  refreshChapters();
}

function splitCount(total, n) {
  const base = Math.floor(total / n);
  const extra = total % n;
  return Array.from({ length: n }, (_, i) => base + (i < extra ? 1 : 0));
}

async function handleAiGenerate() {
  const rows = Array.from(document.querySelectorAll("#aiRowsContainer > .ai-row"));
  if (rows.length === 0) { showToast("অন্তত একটা সিলেকশন যোগ করুন।", "error"); return; }

  const apiKey = promptForApiKey(false);
  if (!apiKey) { showToast("API key ছাড়া তৈরি করা যাবে না।", "error"); return; }

  const marksPerQ = Number(document.getElementById("marksPerQuestion").value) || 1;
  const genBtn = document.getElementById("aiGenerateBtn");
  const progress = document.getElementById("aiGenerateProgress");
  const progressText = document.getElementById("aiGenerateProgressText");
  
  genBtn.disabled = true; progress.classList.remove("hidden");

  let totalAdded = 0, totalFailed = 0;

  for (const rowEl of rows) {
    const rowId = rowEl.id.replace("aiRow-", "");
    const statusEl = document.getElementById(`aiRowStatus-${rowId}`);
    const subjectId = rowEl.querySelector(".ai-row-subject").value;
    const chapterId = rowEl.querySelector(".ai-row-chapter").value;
    const count = Number(rowEl.querySelector(".ai-row-count").value) || 0;
    const instructions = rowEl.querySelector(".ai-row-instructions").value.trim();
    const files = rowEl.querySelector(".ai-row-images").files;

    const subject = tree.find(s => s.id === subjectId);
    const chapter = subject?.chapters.find(c => c.id === chapterId);
    if (!subject || !chapter || count <= 0) {
      statusEl.innerHTML = `<span style="color:#ef4444;">⚠ ব্যাচ/বিষয় বা প্রশ্ন সংখ্যা ঠিক নেই — স্কিপ করা হয়েছে।</span>`;
      continue;
    }
    const topics = chapter.topics || [];
    if (topics.length === 0) {
      statusEl.innerHTML = `<span style="color:#ef4444;">⚠ এই বিষয়ে কোনো টপিক নেই — সিলেবাসে টপিক যোগ করুন।</span>`;
      continue;
    }

    let imageParts = [];
    try { imageParts = files && files.length > 0 ? await Promise.all(Array.from(files).map(fileToImagePart)) : []; } 
    catch { statusEl.innerHTML = `<span style="color:#f59e0b;">⚠ ছবি পড়া যায়নি — ছবি ছাড়াই এগোনো হচ্ছে।</span>`; }

    const counts = splitCount(count, topics.length);

    for (let i = 0; i < topics.length; i++) {
      const topic = topics[i];
      const topicCount = counts[i];
      if (topicCount <= 0) continue;

      progressText.textContent = `${chapter.name_bn} — ${topic.name_bn} (${topicCount} টি) তৈরি হচ্ছে...`;
      statusEl.innerHTML = `<span style="color:var(--color-accent);">⏳ ${topic.name_bn}: তৈরি হচ্ছে...</span>`;

      try {
        const text = await generateQuestionsFromImage({
          apiKey, imageParts,
          subjectName: subject.name_en, chapterName: chapter.name_en, topicName: topic.name_en,
          count: topicCount, extraInstructions: instructions
        });
        const parsed = parseAiImportText(text, { subjectId, chapterId, topicId: topic.id });
        const validOnes = parsed.filter(p => p.valid);
        for (const p of validOnes) {
          const payload = { ...p.question, marks: marksPerQ, createdByAI: true };
          const ref = await addQuestion(payload);
          selectedQuestions.push({ id: ref.id, ...payload });
          totalAdded++;
        }
        totalFailed += (parsed.length - validOnes.length);
        statusEl.innerHTML = `<span style="color:#10b981;">✓ ${topic.name_bn}: ${validOnes.length} টি প্রশ্ন যুক্ত হয়েছে।</span>`;
      } catch (err) {
        statusEl.innerHTML = `<span style="color:#ef4444;">✗ ${topic.name_bn}: ${err.message || "ব্যর্থ হয়েছে"}</span>`;
        totalFailed++;
      }
    }
  }

  persistCart(); renderSelectedList(); updateTotalMarks();
  progress.classList.add("hidden"); genBtn.disabled = false;

  if (totalAdded > 0) {
    showToast(`${totalAdded} টি প্রশ্ন তৈরি হয়েছে${totalFailed > 0 ? ` (${totalFailed} টি ব্যর্থ)` : ""} — নিচে রিভিউ করুন।`, "success");
  } else { showToast("কোনো প্রশ্ন তৈরি করা যায়নি।", "error"); }
}

function nameFor(id, kind) {
  for (const s of tree) {
    if (kind === "subject" && s.id === id) return s.name_bn;
    for (const c of s.chapters) {
      if (kind === "chapter" && c.id === id) return c.name_bn;
      for (const t of c.topics) if (kind === "topic" && t.id === id) return t.name_bn;
    }
  }
  return "—";
}

function renderSelectedList() {
  const el = document.getElementById("selectedList");
  document.getElementById("selCount").textContent = selectedQuestions.length;
  if (selectedQuestions.length === 0) {
    el.innerHTML = `<div style="text-align:center; padding:30px; background:rgba(128,128,128,0.02); border-radius:14px; border:1px dashed rgba(128,128,128,0.2);"><p class="text-sm font-bold" style="color:var(--text-muted);">এখনো কোনো প্রশ্ন নির্বাচিত হয়নি।</p></div>`;
    return;
  }
  
  el.innerHTML = selectedQuestions.map((q, idx) => `
    <div class="sel-question-card">
      <div style="flex:1;">
        <p style="font-size:0.75rem; font-weight:800; color:var(--text-muted); margin-bottom:6px;">#${idx + 1} • ${nameFor(q.subjectId, "subject")} / ${nameFor(q.chapterId, "chapter")} ${q.createdByAI ? `<span style="background:rgba(139,92,246,0.1); color:#8b5cf6; padding:2px 6px; border-radius:6px; margin-left:6px;">AI</span>` : ""}</p>
        <p style="font-size:0.95rem; font-weight:800; color:var(--text-primary); line-height:1.4;">${q.question_bn}</p>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="action-icon up-btn" data-idx="${idx}" ${idx === 0 ? "disabled style='opacity:0.3; cursor:not-allowed;'" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <button class="action-icon down-btn" data-idx="${idx}" ${idx === selectedQuestions.length - 1 ? "disabled style='opacity:0.3; cursor:not-allowed;'" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
        <button class="action-icon delete remove-btn" data-idx="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  `).join("");

  el.querySelectorAll(".up-btn").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.idx);
    [selectedQuestions[i - 1], selectedQuestions[i]] = [selectedQuestions[i], selectedQuestions[i - 1]];
    persistCart(); renderSelectedList(); updateTotalMarks();
  }));
  el.querySelectorAll(".down-btn").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.idx);
    [selectedQuestions[i + 1], selectedQuestions[i]] = [selectedQuestions[i], selectedQuestions[i + 1]];
    persistCart(); renderSelectedList(); updateTotalMarks();
  }));
  el.querySelectorAll(".remove-btn").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.idx);
    selectedQuestions.splice(i, 1);
    persistCart(); renderSelectedList(); updateTotalMarks();
  }));
}

function persistCart() {
  localStorage.setItem("examBuilderSelection", JSON.stringify(selectedQuestions.map(q => q.id)));
  localStorage.setItem("examBuilderContext", editId || "new");
}

function updateTotalMarks() {
  const marksPerQ = Number(document.getElementById("marksPerQuestion").value) || 0;
  document.getElementById("totalMarksDisplay").textContent = calculateTotalMarks(selectedQuestions.length, marksPerQ);
}

async function handleQuickAdd(e) {
  e.preventDefault();
  const payload = {
    question_en: document.getElementById("qaEn").value.trim(),
    question_bn: document.getElementById("qaBn").value.trim(),
    options_bn: {
      A: document.getElementById("qaA").value.trim(),
      B: document.getElementById("qaB").value.trim(),
      C: document.getElementById("qaC").value.trim(),
      D: document.getElementById("qaD").value.trim(),
    },
    correctAnswer: document.getElementById("qaCorrect").value,
    marks: Number(document.getElementById("marksPerQuestion").value) || 1,
    subjectId: document.getElementById("qaSubject").value,
    chapterId: document.getElementById("qaChapter").value,
    topicId: document.getElementById("qaTopic").value,
  };
  if (!payload.subjectId || !payload.chapterId || !payload.topicId) {
    showToast("ব্যাচ/বিষয়/টপিক নির্বাচন করুন।", "error"); return;
  }
  try {
    const ref = await addQuestion(payload);
    selectedQuestions.push({ id: ref.id, ...payload });
    persistCart(); renderSelectedList(); updateTotalMarks();
    e.target.reset();
    showToast("প্রশ্ন তৈরি হয়ে তালিকায় যুক্ত হয়েছে।", "success");
  } catch (err) { showToast(friendlyError(err), "error"); }
}

async function handleSubmit(e) {
  e.preventDefault();
  const errorEl = document.getElementById("formError");
  errorEl.classList.add("hidden");
  const submitBtn = document.getElementById("submitBtn");

  if (selectedQuestions.length === 0) {
    errorEl.textContent = "অন্তত একটি প্রশ্ন নির্বাচন করুন।";
    errorEl.classList.remove("hidden");
    return;
  }

  const subjectIds = [...new Set(selectedQuestions.map(q => q.subjectId))];
  const chapterIds = [...new Set(selectedQuestions.map(q => q.chapterId))];

  const data = {
    name: document.getElementById("examName").value.trim(),
    description: document.getElementById("examDesc").value.trim(),
    examDate: document.getElementById("examDate").value,
    informationalTime: document.getElementById("examTime").value.trim(),
    durationMinutes: Number(document.getElementById("examDuration").value),
    marksPerQuestion: Number(document.getElementById("marksPerQuestion").value),
    targetBatch: document.getElementById("examTargetBatch").value, // TARGET BATCH ADDED
    subjectIds, chapterIds,
    questionIds: selectedQuestions.map(q => q.id)
  };

  submitBtn.disabled = true; submitBtn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;border-color:#fff;border-top-color:transparent;display:inline-block;vertical-align:middle;margin-right:8px;"></span> সংরক্ষণ হচ্ছে...`;
  
  try {
    if (editId) {
      await updateExam(editId, data);
      showToast("পরীক্ষা আপডেট করা হয়েছে।", "success");
    } else {
      await createExam(data);
      showToast("খসড়া পরীক্ষা তৈরি করা হয়েছে।", "success");
    }
    localStorage.removeItem("examBuilderSelection");
    localStorage.removeItem("examBuilderContext");
    window.location.href = "../admin/exams.html";
  } catch (err) {
    errorEl.textContent = err.message || friendlyError(err);
    errorEl.classList.remove("hidden");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> খসড়া হিসেবে সংরক্ষণ করুন`;
  }
}
</script>
