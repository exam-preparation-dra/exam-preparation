<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষা ব্যবস্থাপনা — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 900px; padding-bottom: 40px; margin: 0 auto; }

  /* ===== Premium Glass Cards ===== */
  .glass-card {
    background: rgba(128, 128, 128, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 20px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02); transition: all 0.3s ease;
  }
  .glass-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.04); border-color:rgba(128,128,128,0.2); }

  /* ===== Topbar (FIXED BACKGROUND COLOR) ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: 16px 20px; 
    background: var(--surface); /* Fixed to respect Light/Dark theme naturally */
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--surface-border);
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  /* ===== Form Elements ===== */
  .input-glass {
    padding: 12px 16px; background: rgba(128, 128, 128, 0.04); border: 1px solid var(--surface-border);
    border-radius: 14px; color: var(--text-primary); font-family: inherit; font-size: 0.95rem; font-weight: 700;
    outline: none; transition: 0.2s; cursor: pointer; width: 100%;
  }
  .input-glass:focus { border-color: var(--color-accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), 0.15); }
  select.input-glass { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em; padding-right: 40px; }

  /* ===== Premium Buttons ===== */
  .btn-glass {
    background: rgba(128, 128, 128, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(128, 128, 128, 0.15);
    border-radius: 12px; color: var(--text-primary); padding: 10px 16px; font-weight: 800; font-size: 0.9rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s ease; text-decoration: none;
  }
  .btn-glass:hover { background: rgba(128, 128, 128, 0.1); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .btn-glass:active { transform: translateY(0) scale(0.96); }
  
  .btn-primary { background: linear-gradient(135deg, var(--color-accent), #f59e0b); color: #fff; border: none; box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.3); }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(var(--color-accent-rgb), 0.4); transform: translateY(-2px); }
  
  .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.2); }
  .btn-danger:hover { background: #ef4444; color: #fff; box-shadow: 0 4px 15px rgba(239,68,68,0.3); }

  /* ===== Exam Card Specifics ===== */
  .exam-title { font-size: 1.25rem; font-weight: 900; color: var(--text-primary); margin-bottom: 6px; line-height: 1.4; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exam-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 16px; }
  .meta-item { display: flex; align-items: center; gap: 6px; background: rgba(128,128,128,0.04); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,0.1); }
  
  .target-batch-badge { background: rgba(var(--color-accent-rgb), 0.1); color: var(--color-accent); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 900; border: 1px solid rgba(var(--color-accent-rgb), 0.25); }

  /* Status Badges */
  .st-badge { padding: 6px 14px; border-radius: 99px; font-size: 0.75rem; font-weight: 900; letter-spacing: 0.5px; border: 1px solid transparent; display: inline-block; white-space: nowrap; }
  .st-draft { background: rgba(128,128,128,0.1); color: var(--text-secondary); border-color: rgba(128,128,128,0.2); }
  .st-upcoming { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-color: rgba(59, 130, 246, 0.2); }
  .st-published { background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.2); }
  .st-active { background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
  .st-completed { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border-color: rgba(139, 92, 246, 0.2); }
  .st-archived { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border-color: rgba(245, 158, 11, 0.2); }

  .action-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--surface-border); }
  .controls-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; margin-top: 16px; }
  .filter-group { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; }
</style>
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getAllExams, publishExam, duplicateExam, archiveExam, deleteDraftExam, deleteExamPermanently } from "../js/utils/exam-utils.js";
import { getFullSyllabusTree } from "../js/utils/syllabus-utils.js";

initTheme();
const shell = document.getElementById("shell");
let exams = [];
let tree = [];
let statusFilter = "";
let batchFilter = "all";

const STATUS_LABEL = {
  draft: "খসড়া", upcoming: "আসন্ন", published: "প্রকাশিত",
  active: "চলমান", completed: "সম্পন্ন", archived: "সংরক্ষণাগারে"
};

const STATUS_CLASS = {
  draft: "st-draft", upcoming: "st-upcoming", published: "st-published",
  active: "st-active", completed: "st-completed", archived: "st-archived"
};

requireAdmin(async () => {
  try { tree = await getFullSyllabusTree(); } catch(err) { console.error(err); }

  shell.innerHTML = `
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="../admin/dashboard.html" class="btn-glass" style="width:42px; height:42px; padding:0; border-radius:12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <h2 style="font-size:1.2rem; font-weight:900; color:var(--text-primary); margin:0;">পরীক্ষা ব্যবস্থাপনা</h2>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="theme-toggle" id="themeToggle" style="margin:0;"><span class="theme-toggle-thumb"></span></button>
        <button class="btn-glass hidden" id="installBtn" style="width:42px;height:42px;padding:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>
        <button class="btn-glass" id="logoutBtn" style="width:42px;height:42px;padding:0;border-color:rgba(239,68,68,0.3);color:#ef4444;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>

    <div class="controls-header">
      <div class="filter-group">
        <div style="flex:1; min-width:140px; max-width:200px;">
          <select class="input-glass" id="statusFilter">
            <option value="">সব স্ট্যাটাস (All)</option>
            ${Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
          </select>
        </div>
        <div style="flex:1; min-width:140px; max-width:200px;">
          <select class="input-glass" id="batchFilter">
            <option value="all">সব ব্যাচ (All Batches)</option>
          </select>
        </div>
      </div>
      <a href="../admin/exam-create.html" class="btn-glass btn-primary" style="padding:12px 20px; white-space:nowrap;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        নতুন পরীক্ষা তৈরি
      </a>
    </div>

    <div id="examList"></div>
  `;
  
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  
  // Populate Batch Filter
  const batchSel = document.getElementById("batchFilter");
  const batches = [...new Set(tree.map(b => b.name_bn))].sort();
  batches.forEach(b => {
    batchSel.innerHTML += `<option value="${b}">${b}</option>`;
  });

  document.getElementById("statusFilter").addEventListener("change", (e) => { statusFilter = e.target.value; load(); });
  document.getElementById("batchFilter").addEventListener("change", (e) => { batchFilter = e.target.value; render(); }); // Client-side filtering
  
  load();
});

async function load() {
  const el = document.getElementById("examList");
  el.innerHTML = `<div class="glass-card" style="padding:40px; text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>`;
  try {
    exams = await getAllExams({ status: statusFilter || null });
    render();
  } catch (err) {
    console.error(err);
    renderState(el, "error", "পরীক্ষার তালিকা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
  }
}

function render() {
  const el = document.getElementById("examList");
  
  // Apply Batch Filter
  let filteredExams = exams;
  if (batchFilter && batchFilter !== "all") {
    filteredExams = filteredExams.filter(e => e.targetBatch === batchFilter);
  }

  if (filteredExams.length === 0) {
    el.innerHTML = `<div class="glass-card" style="text-align:center; padding:40px 20px;"><p style="font-size:1rem; font-weight:800; color:var(--text-muted);">এখনো কোনো পরীক্ষা তৈরি হয়নি বা এই স্ট্যাটাসে/ব্যাচে নেই।</p></div>`;
    return;
  }
  
  el.innerHTML = filteredExams.map(exam => {
    const dateStr = exam.examDate?.toDate ? exam.examDate.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "short", year: "numeric" }) : "—";
    
    // Batch Display Logic
    let targetBatchDisplay = "সকল ব্যাচ";
    if (exam.targetBatch && exam.targetBatch !== "all") {
      targetBatchDisplay = exam.targetBatch;
    }

    return `
    <div class="glass-card" data-id="${exam.id}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:12px;">
        <div class="exam-title">
          ${exam.name}
          <span class="target-batch-badge">${targetBatchDisplay}</span>
        </div>
        <span class="st-badge ${STATUS_CLASS[exam.status] || "st-draft"}">${STATUS_LABEL[exam.status] || exam.status}</span>
      </div>

      <div class="exam-meta">
        <div class="meta-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${dateStr}</div>
        <div class="meta-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${exam.durationMinutes || "—"} মি</div>
        <div class="meta-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${exam.totalMarks ?? 0} নম্বর</div>
        <div class="meta-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${(exam.questionIds || []).length} টি প্রশ্ন</div>
      </div>
      
      <div class="action-bar">
        ${exam.status === "draft" ? `
          <a href="../admin/exam-create.html?id=${exam.id}" class="btn-glass"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> সম্পাদনা</a>
          <button class="btn-glass btn-primary publish-btn" data-id="${exam.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> প্রকাশ করুন</button>
          <button class="btn-glass btn-danger delete-btn" data-id="${exam.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> মুছুন</button>
        ` : ""}
        
        <button class="btn-glass dup-btn" data-id="${exam.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> ডুপ্লিকেট</button>
        
        ${["published", "completed"].includes(exam.status) ? `<button class="btn-glass archive-btn" data-id="${exam.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg> আর্কাইভ করুন</button>` : ""}
        
        ${exam.status !== "draft" ? `<button class="btn-glass btn-danger perm-delete-btn" data-id="${exam.id}" data-name="${exam.name}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> স্থায়ীভাবে মুছুন</button>` : ""}
      </div>
    </div>
  `;
  }).join("");

  el.querySelectorAll(".publish-btn").forEach(b => b.addEventListener("click", () => handlePublish(b.dataset.id)));
  el.querySelectorAll(".dup-btn").forEach(b => b.addEventListener("click", () => handleDuplicate(b.dataset.id)));
  el.querySelectorAll(".archive-btn").forEach(b => b.addEventListener("click", () => handleArchive(b.dataset.id)));
  el.querySelectorAll(".delete-btn").forEach(b => b.addEventListener("click", () => handleDelete(b.dataset.id)));
  el.querySelectorAll(".perm-delete-btn").forEach(b => b.addEventListener("click", () => handlePermanentDelete(b.dataset.id, b.dataset.name)));
}

async function handlePublish(id) {
  if (!confirm("পরীক্ষা প্রকাশ করলে প্রশ্নগুলো স্থায়ীভাবে লক হয়ে যাবে। এগিয়ে যাবেন?")) return;
  try {
    await publishExam(id);
    showToast("পরীক্ষা প্রকাশ করা হয়েছে।", "success");
    load();
  } catch (err) {
    showToast(err.message || friendlyError(err), "error");
  }
}

async function handleDuplicate(id) {
  if (!confirm("এই পরীক্ষাটি ডুপ্লিকেট করবেন?")) return;
  try {
    await duplicateExam(id);
    showToast("পরীক্ষা ডুপ্লিকেট করা হয়েছে (খসড়া হিসেবে)।", "success");
    load();
  } catch (err) { showToast(err.message || friendlyError(err), "error"); }
}

async function handleArchive(id) {
  if (!confirm("এই পরীক্ষাটি সংরক্ষণাগারে পাঠাবেন?")) return;
  try {
    await archiveExam(id);
    showToast("সংরক্ষণাগারে পাঠানো হয়েছে।", "success");
    load();
  } catch (err) { showToast(friendlyError(err), "error"); }
}

async function handleDelete(id) {
  if (!confirm("এই খসড়া পরীক্ষাটি স্থায়ীভাবে মুছে ফেলবেন?")) return;
  try {
    await deleteDraftExam(id);
    showToast("মুছে ফেলা হয়েছে।", "success");
    load();
  } catch (err) { showToast(err.message || friendlyError(err), "error"); }
}

async function handlePermanentDelete(id, name) {
  if (!confirm(`"${name}" পরীক্ষাটি এবং এর সাথে জড়িত সব শিক্ষার্থীর attempt ও ফলাফল স্থায়ীভাবে মুছে ফেলবেন? এটি আর ফেরত আনা যাবে না।`)) return;
  if (!confirm("নিশ্চিত? এই পরীক্ষার সব রেকর্ড চিরতরে হারিয়ে যাবে।")) return;
  try {
    await deleteExamPermanently(id);
    showToast("পরীক্ষা ও এর সব রেকর্ড মুছে ফেলা হয়েছে।", "success");
    load();
  } catch (err) { showToast(err.message || friendlyError(err), "error"); }
}
</script>
</body>
</html>
