<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ড্যাশবোর্ড — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
  .glass.card { animation: cardRise 420ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes cardRise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (hover: hover) {
    #statsGrid .glass.card:hover, .card--tap:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); }
  }
  #statsGrid .glass.card:nth-child(1) { animation-delay: 20ms; }
  #statsGrid .glass.card:nth-child(2) { animation-delay: 50ms; }
  #statsGrid .glass.card:nth-child(3) { animation-delay: 80ms; }
  #statsGrid .glass.card:nth-child(4) { animation-delay: 110ms; }
  #statsGrid .glass.card:nth-child(5) { animation-delay: 140ms; }
  #statsGrid .glass.card:nth-child(6) { animation-delay: 170ms; }
  #statsGrid .glass.card:nth-child(7) { animation-delay: 200ms; }
  #statsGrid .glass.card:nth-child(8) { animation-delay: 230ms; }
  #statsGrid .glass.card:nth-child(9) { animation-delay: 260ms; }
  #statsGrid .glass.card:nth-child(10) { animation-delay: 290ms; }
  .card--tap { transition: transform 150ms ease, box-shadow 180ms ease; }
  .card--tap:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="app-shell app-shell--wide">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">প</div>
      <div>
        <h1 style="font-size:1.05rem;" id="platformTitleDisplay">অ্যাডমিন ড্যাশবোর্ড</h1>
        <p class="text-xs text-muted" style="margin:0;" id="adminEmail"></p>
      </div>
    </div>
    <div class="flex gap-2 items-center">
      <button class="icon-btn" id="editTitleBtn" title="প্ল্যাটফর্মের নাম পরিবর্তন করুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
      <button class="icon-btn" id="logoutBtn" title="লগআউট">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </div>

  <div id="statsGrid" class="grid-2 mt-4" style="grid-template-columns:repeat(2,1fr);">
    <!-- filled by JS -->
  </div>

  <h3 class="mt-5" style="margin-bottom:var(--space-3);">ব্যবস্থাপনা</h3>
  <div class="grid-2">
    <a href="../admin/students.html" class="glass card card--tap">শিক্ষার্থী ব্যবস্থাপনা</a>
    <a href="../admin/syllabus.html" class="glass card card--tap">সিলেবাস ব্যবস্থাপনা</a>
    <a href="../admin/questions.html" class="glass card card--tap">প্রশ্ন ব্যাংক</a>
    <a href="../admin/question-import.html" class="glass card card--tap">AI প্রশ্ন ইম্পোর্ট</a>
    <a href="../admin/exams.html" class="glass card card--tap">পরীক্ষা ব্যবস্থাপনা</a>
    <a href="../admin/results.html" class="glass card card--tap">ফলাফল অনুমোদন</a>
    <a href="../admin/comparison.html" class="glass card card--tap">শিক্ষার্থী তুলনা</a>
  </div>

</div>

<script type="module">
import { initTheme, toggleTheme, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { getPlatformSettings, canChangeTitle, setPlatformTitle } from "../js/utils/settings-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { collection, getCountFromServer, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

initTheme();
document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("logoutBtn").addEventListener("click", adminLogout);

requireAdmin(async (user) => {
  document.getElementById("adminEmail").textContent = user.email;
  await loadStats();
  await loadPlatformTitle();
});

document.getElementById("editTitleBtn").addEventListener("click", () => openTitleModal(false));

let currentTitleSettings = { platformTitle: null, titleUpdatedAt: null };

async function loadPlatformTitle() {
  currentTitleSettings = await getPlatformSettings();
  if (currentTitleSettings.platformTitle) {
    document.getElementById("platformTitleDisplay").textContent = currentTitleSettings.platformTitle;
  } else {
    // No title set yet — this is mandatory, so the popup can't be dismissed
    // without saving one (no cancel button in this specific case).
    openTitleModal(true);
  }
}

// mandatory: true on first-ever setup (no cancel option); false when the
// admin deliberately opens it later to change an existing title (cancel
// allowed, and the once-a-month limit is enforced).
function openTitleModal(mandatory) {
  if (!mandatory) {
    const check = canChangeTitle(currentTitleSettings.titleUpdatedAt);
    if (!check.allowed) {
      showToast(`পরবর্তী পরিবর্তনের জন্য আরও ${check.daysRemaining} দিন অপেক্ষা করতে হবে (মাসে ১ বার বদলানো যায়)।`, "error");
      return;
    }
  }

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";
  overlay.innerHTML = `
    <div class="glass card" style="max-width:420px;width:100%;">
      <p style="font-weight:700;margin-bottom:4px;">${mandatory ? "প্ল্যাটফর্মের নাম দিন" : "প্ল্যাটফর্মের নাম পরিবর্তন করুন"}</p>
      <p class="text-xs text-muted mb-2">${mandatory ? "এটাই স্টুডেন্টদের হোম পেজে বড় করে হেডিং হিসেবে দেখাবে। এটা যেকোনো সময় দেওয়া যাবে, তবে একবার সেট করার পর মাসে মাত্র একবার বদলানো যাবে — তাই ভেবে দিন।" : "মাসে একবারই বদলানো যায়, তাই ভেবে দিন।"}</p>
      <input type="text" id="platformTitleInput" class="input" placeholder="যেমন: NMMS PREPARATION EXAMS" value="${(currentTitleSettings.platformTitle || "").replace(/"/g, "&quot;")}" style="width:100%;">
      <div class="flex gap-2 mt-3" style="justify-content:flex-end;">
        ${mandatory ? "" : `<button type="button" class="btn btn-secondary" id="titleCancelBtn">বাতিল</button>`}
        <button type="button" class="btn btn-primary" id="titleSaveBtn">সেভ করুন</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector("#platformTitleInput");
  input.focus();

  if (!mandatory) {
    overlay.querySelector("#titleCancelBtn").addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  }

  overlay.querySelector("#titleSaveBtn").addEventListener("click", async () => {
    const value = input.value.trim();
    if (!value) { showToast("নাম খালি রাখা যাবে না।", "error"); return; }
    try {
      await setPlatformTitle(value);
      currentTitleSettings = { platformTitle: value, titleUpdatedAt: new Date() };
      document.getElementById("platformTitleDisplay").textContent = value;
      overlay.remove();
      showToast("প্ল্যাটফর্মের নাম সংরক্ষণ করা হয়েছে।", "success");
    } catch (err) {
      showToast(friendlyError(err), "error");
    }
  });
}

async function safeCount(colName, ...whereClauses) {
  try {
    const base = collection(db, colName);
    const q = whereClauses.length ? query(base, ...whereClauses) : base;
    const snap = await getCountFromServer(q);
    return snap.data().count;
  } catch {
    return "—"; // collection may not exist yet — first-run state, not an error
  }
}

async function loadStats() {
  const grid = document.getElementById("statsGrid");
  const [
    activeStudents, subjects, chapters, topics, questions,
    upcomingExams, completedExams, activeAttempts, pendingResults, approvedResults
  ] = await Promise.all([
    safeCount("students", where("isActive", "==", true)),
    safeCount("subjects"),
    safeCount("chapters"),
    safeCount("topics"),
    safeCount("questions"),
    safeCount("exams", where("status", "in", ["upcoming", "published"])),
    safeCount("exams", where("status", "in", ["completed", "archived"])),
    safeCount("attempts", where("status", "==", "in-progress")),
    safeCount("results", where("status", "==", "pending")),
    safeCount("results", where("status", "==", "approved")),
  ]);

  const cards = [
    ["সক্রিয় শিক্ষার্থী", activeStudents],
    ["মোট বিষয়", subjects],
    ["মোট অধ্যায়", chapters],
    ["মোট টপিক", topics],
    ["মোট প্রশ্ন", questions],
    ["আসন্ন পরীক্ষা", upcomingExams],
    ["সম্পন্ন পরীক্ষা", completedExams],
    ["সক্রিয় পরীক্ষা (চলমান)", activeAttempts],
    ["অনুমোদনের অপেক্ষায়", pendingResults],
    ["অনুমোদিত ফলাফল", approvedResults],
  ];

  grid.innerHTML = cards.map(([label, value]) => `
    <div class="glass card">
      <p class="eyebrow">${label}</p>
      <p class="stat-pct stat-pct--lg num" style="margin-top:6px;">${value}</p>
    </div>
  `).join("");
}
</script>
</body>
</html>
