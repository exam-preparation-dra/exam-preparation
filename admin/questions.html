<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রশ্ন ব্যাংক — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 700px; padding-bottom: 40px; margin: 0 auto; }

  /* ===== Premium Glass Cards ===== */
  .glass-card {
    background: rgba(128, 128, 128, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02); transition: all 0.3s ease;
  }

  /* ===== Form & Input Styles ===== */
  .field { margin-bottom: 16px; }
  .field label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 8px; }
  .input-glass {
    width: 100%; box-sizing: border-box; padding: 12px 16px;
    background: rgba(128, 128, 128, 0.04); border: 1px solid var(--surface-border);
    border-radius: 12px; color: var(--text-primary);
    font-family: inherit; font-size: 0.95rem; font-weight: 600; outline: none; transition: 0.2s;
  }
  .input-glass:focus { border-color: var(--color-accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), 0.15); }
  textarea.input-glass { resize: vertical; min-height: 80px; }
  
  select.input-glass { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em; }

  /* ===== Search & Filter ===== */
  .search-box {
    display: flex; align-items: center; gap: 10px; background: rgba(128,128,128,0.03);
    border: 1px solid var(--surface-border); border-radius: 14px; padding: 10px 16px; margin-bottom: 16px; transition: 0.3s;
  }
  .search-box:focus-within { border-color: var(--color-accent); box-shadow: 0 4px 16px rgba(var(--color-accent-rgb),0.15); background: var(--surface); }
  .search-box input { flex: 1; border: none; background: transparent; outline: none; font-family: inherit; font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }

  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

  /* ===== Premium Buttons ===== */
  .btn-glass {
    background: rgba(128, 128, 128, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(128, 128, 128, 0.15);
    border-radius: 12px; color: var(--text-primary); padding: 10px 16px; font-weight: 800; font-size: 0.9rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-glass:hover { background: rgba(128, 128, 128, 0.1); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
  .btn-glass:active { transform: translateY(0) scale(0.96); }
  
  .btn-primary { background: linear-gradient(135deg, var(--color-accent), #f59e0b); color: #fff; border: none; box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.3); }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(var(--color-accent-rgb), 0.4); transform: translateY(-2px); }

  /* ===== Question List Card ===== */
  .question-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; transition: 0.2s; position: relative; overflow: hidden; }
  .question-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
  .question-meta { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .q-badge { background: rgba(128,128,128,0.1); padding: 3px 8px; border-radius: 6px; color: var(--text-secondary); }
  
  /* Selection Checkbox */
  .select-cb-wrapper { position: absolute; top: 16px; right: 16px; z-index: 5; }
  .select-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: var(--color-accent); }

  .q-text-bn { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); line-height: 1.5; margin-bottom: 6px; padding-right: 30px; }
  .q-text-en { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }
  
  .q-details { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px; background: rgba(128,128,128,0.03); border-radius: 8px; }
  .q-ans-highlight { color: #10b981; background: rgba(16,185,129,0.1); padding: 2px 8px; border-radius: 6px; }

  /* Action Icons */
  .action-bar { display: flex; gap: 8px; border-top: 1px dashed var(--surface-border); padding-top: 12px; flex-wrap: wrap; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.05); color: var(--text-secondary); border: 1px solid rgba(128,128,128,0.1); cursor: pointer; transition: 0.2s; }
  .icon-btn:hover { background: var(--surface); color: var(--color-accent); border-color: var(--color-accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(var(--color-accent-rgb), 0.15); }
  .icon-btn.delete-btn:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15); }

  .img-broken { border: 1.5px dashed var(--color-danger); opacity: 0.6; }
  .img-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; background: rgba(var(--color-accent-rgb),0.1); color: var(--color-accent); font-weight: 800; border: 1px solid rgba(var(--color-accent-rgb),0.2); }

  /* ===== Modal Styles ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 400; padding: 20px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .custom-modal { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, renderState, showToast, friendlyError, aiBadge } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getFullSyllabusTree } from "../js/utils/syllabus-utils.js";
import {
  addQuestion, updateQuestion, setQuestionActive, deleteQuestion, duplicateQuestion,
  getQuestionsPage, filterByText
} from "../js/utils/question-utils.js";
import { toDirectImageUrl, uploadImageWithGuidedFallback } from "../js/utils/image-utils.js";
import { attachVoiceInput, isVoiceInputSupported } from "../js/utils/voice-input.js";
import { generateExplanationForQuestion, promptForApiKey } from "../js/utils/ai-import-utils.js";

initTheme();
const shell = document.getElementById("shell");
let tree = [];
let allQuestions = [];
let nextCursor = null;
let editingId = null;
let quickImgTargetId = null;
let selectedIds = new Set(JSON.parse(localStorage.getItem("examBuilderSelection") || "[]"));

const filterState = { subjectId: "", chapterId: "", topicId: "", text: "" };

requireAdmin(() => {
  shell.innerHTML = shellTemplate();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  
  document.getElementById("showAddForm").addEventListener("click", () => openForm(null));
  document.getElementById("cancelForm").addEventListener("click", closeForm);
  document.getElementById("questionForm").addEventListener("submit", handleSubmit);
  
  document.getElementById("searchInput").addEventListener("input", debounce(handleSearchInput, 250));
  document.getElementById("subjectFilter").addEventListener("change", handleSubjectFilterChange);
  document.getElementById("chapterFilter").addEventListener("change", handleChapterFilterChange);
  document.getElementById("topicFilter").addEventListener("change", () => { filterState.topicId = document.getElementById("topicFilter").value; reloadList(); });
  document.getElementById("loadMoreBtn").addEventListener("click", () => loadMore());
  
  document.getElementById("goToExamBuilder").addEventListener("click", () => {
    localStorage.setItem("examBuilderSelection", JSON.stringify([...selectedIds]));
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get("returnTo");
    window.location.href = returnTo ? decodeURIComponent(returnTo) : "../admin/exam-create.html";
  });

  setupImagePreview();
  setupVoiceButton();
  
  document.getElementById("imagePreviewModal").addEventListener("click", closeImagePreview);
  document.getElementById("quickImgCancelBtn").addEventListener("click", closeQuickImageModal);
  document.getElementById("quickImgSaveBtn").addEventListener("click", saveQuickImage);
  document.getElementById("quickImageModal").addEventListener("click", (e) => {
    if (e.target.id === "quickImageModal") closeQuickImageModal();
  });
  
  document.getElementById("quickImgInput").addEventListener("input", debounce((e) => {
    const preview = document.getElementById("quickImgPreview");
    const url = toDirectImageUrl(e.target.value);
    if (!url) { preview.classList.add("hidden"); return; }
    preview.src = url; preview.classList.remove("hidden");
  }, 400));
  
  document.getElementById("quickImgFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById("quickImgUploadStatus");
    status.textContent = "আপলোড হচ্ছে...";
    try {
      const url = await uploadImageWithGuidedFallback(file);
      document.getElementById("quickImgInput").value = url;
      const preview = document.getElementById("quickImgPreview");
      preview.src = url; preview.classList.remove("hidden");
      status.textContent = "✓ আপলোড সম্পন্ন — এবার সেভ করুন।";
      status.style.color = "#10b981";
    } catch (err) {
      status.textContent = "আপলোড ব্যর্থ হয়েছে।";
      status.style.color = "#ef4444";
      showToast("ছবি আপলোড করা যায়নি।", "error");
    } finally { e.target.value = ""; }
  });
  init();
});

function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

async function init() {
  tree = await getFullSyllabusTree();
  populateSubjectSelects();
  await reloadList();
}

function populateSubjectSelects() {
  const subjectFilter = document.getElementById("subjectFilter");
  const formSubject = document.getElementById("formSubject");
  tree.forEach(s => {
    subjectFilter.innerHTML += `<option value="${s.id}">${s.name_bn}</option>`;
    formSubject.innerHTML += `<option value="${s.id}">${s.name_bn}</option>`;
  });
  formSubject.addEventListener("change", () => populateFormChapters(formSubject.value));
  if (tree[0]) populateFormChapters(tree[0].id);
}

function populateFormChapters(subjectId) {
  const subject = tree.find(s => s.id === subjectId);
  const formChapter = document.getElementById("formChapter");
  formChapter.innerHTML = (subject?.chapters || []).map(c => `<option value="${c.id}">${c.name_bn}</option>`).join("");
  if (subject?.chapters?.[0]) populateFormTopics(subject.chapters[0].id, subjectId);
  formChapter.onchange = () => populateFormTopics(formChapter.value, subjectId);
}

function populateFormTopics(chapterId, subjectId) {
  const subject = tree.find(s => s.id === subjectId);
  const chapter = subject?.chapters.find(c => c.id === chapterId);
  const formTopic = document.getElementById("formTopic");
  formTopic.innerHTML = (chapter?.topics || []).map(t => `<option value="${t.id}">${t.name_bn}</option>`).join("");
}

function handleSubjectFilterChange() {
  const subjectId = document.getElementById("subjectFilter").value;
  filterState.subjectId = subjectId;
  filterState.chapterId = ""; filterState.topicId = "";
  const chapterFilter = document.getElementById("chapterFilter");
  const topicFilter = document.getElementById("topicFilter");
  const subject = tree.find(s => s.id === subjectId);
  chapterFilter.innerHTML = `<option value="">সব বিষয়</option>` + (subject?.chapters || []).map(c => `<option value="${c.id}">${c.name_bn}</option>`).join("");
  topicFilter.innerHTML = `<option value="">সব টপিক</option>`;
  reloadList();
}

function handleChapterFilterChange() {
  const chapterId = document.getElementById("chapterFilter").value;
  filterState.chapterId = chapterId;
  filterState.topicId = "";
  const topicFilter = document.getElementById("topicFilter");
  const subject = tree.find(s => s.id === filterState.subjectId);
  const chapter = subject?.chapters.find(c => c.id === chapterId);
  topicFilter.innerHTML = `<option value="">সব টপিক</option>` + (chapter?.topics || []).map(t => `<option value="${t.id}">${t.name_bn}</option>`).join("");
  reloadList();
}

function handleSearchInput() {
  filterState.text = document.getElementById("searchInput").value;
  renderQuestionList(); 
}

async function reloadList() {
  allQuestions = [];
  nextCursor = null;
  await loadMore(true);
}

async function loadMore(isReload = false) {
  const listEl = document.getElementById("questionList");
  if (isReload) listEl.innerHTML = `<div class="glass-card text-center" style="padding:40px;"><div class="spinner"></div></div>`;
  try {
    const { items, nextCursor: cursor } = await getQuestionsPage({
      subjectId: filterState.subjectId || null,
      chapterId: filterState.chapterId || null,
      topicId: filterState.topicId || null,
      cursor: isReload ? null : nextCursor
    });
    allQuestions = isReload ? items : [...allQuestions, ...items];
    nextCursor = cursor;
    document.getElementById("loadMoreBtn").classList.toggle("hidden", !nextCursor);
    renderQuestionList();
  } catch (err) {
    console.error(err);
    renderState(listEl, "error", "প্রশ্ন তালিকা লোড করা যায়নি।");
  }
}

function nameFor(id, kind) {
  for (const s of tree) {
    if (kind === "subject" && s.id === id) return s.name_bn;
    for (const c of s.chapters) {
      if (kind === "chapter" && c.id === id) return c.name_bn;
      for (const t of c.topics) if (kind === "topic" && t.id === id) return t.name_bn;
    }
  }
  return "—";
}

function renderQuestionList() {
  const listEl = document.getElementById("questionList");
  const filtered = filterByText(allQuestions, filterState.text);
  
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="glass-card text-center" style="padding:40px; font-weight:800; color:var(--text-muted);">কোনো প্রশ্ন পাওয়া যায়নি।</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(q => `
    <div class="question-card" data-id="${q.id}">
      <div class="select-cb-wrapper">
        <input type="checkbox" class="select-checkbox" data-id="${q.id}" ${selectedIds.has(q.id) ? "checked" : ""}>
      </div>

      <div class="question-meta">
        <span class="q-badge">${q.isActive ? "" : "<span style='color:#ef4444;'>নিষ্ক্রিয় • </span>"}${nameFor(q.subjectId, "subject")} • ${nameFor(q.chapterId, "chapter")} • ${nameFor(q.topicId, "topic")}</span>
        ${q.createdByAI ? `<span class="q-badge" style="background:rgba(139,92,246,0.1); color:#8b5cf6;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:2px;"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> AI</span>` : ""}
        ${q.imageUrl ? `<span class="img-badge"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> ছবি</span>` : ""}
      </div>

      <p class="q-text-bn">${q.question_bn}</p>
      ${q.question_en ? `<p class="q-text-en">${q.question_en}</p>` : ""}
      
      ${q.imageUrl ? `<img src="${q.imageUrl}" class="thumb-preview" data-full="${q.imageUrl}" style="max-height:120px; border-radius:12px; margin-bottom:12px; border:1px solid rgba(128,128,128,0.2); cursor:zoom-in;" onerror="this.classList.add('img-broken');">` : ""}
      
      <div class="q-details">
        <span>সঠিক উত্তর: <span class="q-ans-highlight">${q.correctAnswer}</span></span>
        <span>•</span>
        <span>নম্বর: ${q.marks}</span>
      </div>

      ${q.explanation_bn
        ? `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ব্যাখ্যা যুক্ত আছে</div>`
        : `<button class="btn-glass ai-explain-btn" data-id="${q.id}" style="width:100%; margin-bottom:12px; padding:10px; font-size:0.8rem; background:rgba(139,92,246,0.05); color:#8b5cf6; border-color:rgba(139,92,246,0.2);">
             AI দিয়ে ব্যাখ্যা তৈরি করুন
           </button>`}

      <div class="action-bar">
        <button class="icon-btn edit-btn" data-id="${q.id}" title="সম্পাদনা"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="icon-btn quick-img-btn" data-id="${q.id}" title="${q.imageUrl ? "ছবি পরিবর্তন" : "ছবি যোগ"}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
        <button class="icon-btn dup-btn" data-id="${q.id}" title="ডুপ্লিকেট"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button class="icon-btn toggle-btn" data-id="${q.id}" title="সক্রিয়/নিষ্ক্রিয়" style="${!q.isActive ? 'color:#ef4444; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.05);' : ''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="5" width="22" height="14" rx="7" ry="7"/><circle cx="${q.isActive ? '16' : '8'}" cy="12" r="3"/></svg></button>
        <button class="icon-btn delete-btn" data-id="${q.id}" title="মুছে ফেলুন"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
      </div>
    </div>
  `).join("");

  listEl.querySelectorAll(".select-checkbox").forEach(cb => cb.addEventListener("change", () => {
    if (cb.checked) selectedIds.add(cb.dataset.id); else selectedIds.delete(cb.dataset.id);
    localStorage.setItem("examBuilderSelection", JSON.stringify([...selectedIds]));
    document.getElementById("selectionCount").textContent = `${selectedIds.size} টি নির্বাচিত`;
  }));
  listEl.querySelectorAll(".edit-btn").forEach(b => b.addEventListener("click", () => openForm(b.dataset.id)));
  listEl.querySelectorAll(".dup-btn").forEach(b => b.addEventListener("click", () => handleDuplicate(b.dataset.id)));
  listEl.querySelectorAll(".toggle-btn").forEach(b => b.addEventListener("click", () => handleToggleActive(b.dataset.id)));
  listEl.querySelectorAll(".delete-btn").forEach(b => b.addEventListener("click", () => handleDelete(b.dataset.id)));
  listEl.querySelectorAll(".thumb-preview").forEach(img => img.addEventListener("click", () => openImagePreview(img.dataset.full)));
  listEl.querySelectorAll(".quick-img-btn").forEach(b => b.addEventListener("click", () => openQuickImageModal(b.dataset.id)));
  listEl.querySelectorAll(".ai-explain-btn").forEach(b => b.addEventListener("click", () => handleGenerateExplanation(b.dataset.id, b)));
}

function openQuickImageModal(id) {
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  quickImgTargetId = id;
  const input = document.getElementById("quickImgInput");
  const preview = document.getElementById("quickImgPreview");
  input.value = q.imageUrl || "";
  if (q.imageUrl) { preview.src = q.imageUrl; preview.classList.remove("hidden"); }
  else preview.classList.add("hidden");
  document.getElementById("quickImgError").classList.add("hidden");
  document.getElementById("quickImgUploadStatus").textContent = "";
  const modal = document.getElementById("quickImageModal");
  modal.style.display = "flex";
  modal.classList.remove("hidden");
  input.focus();
}

function closeQuickImageModal() {
  const modal = document.getElementById("quickImageModal");
  modal.classList.add("hidden");
  modal.style.display = "none";
  quickImgTargetId = null;
}

async function saveQuickImage() {
  if (!quickImgTargetId) return;
  const raw = document.getElementById("quickImgInput").value.trim();
  const errEl = document.getElementById("quickImgError");
  const btn = document.getElementById("quickImgSaveBtn");
  errEl.classList.add("hidden");
  btn.disabled = true; btn.textContent = "সংরক্ষণ হচ্ছে...";
  try {
    const finalUrl = raw ? toDirectImageUrl(raw) : null;
    await updateQuestion(quickImgTargetId, { imageUrl: finalUrl });
    const idx = allQuestions.findIndex(x => x.id === quickImgTargetId);
    if (idx !== -1) allQuestions[idx].imageUrl = finalUrl;
    showToast(finalUrl ? "ছবি যুক্ত হয়েছে।" : "ছবি সরানো হয়েছে।", "success");
    closeQuickImageModal(); renderQuestionList();
  } catch (err) {
    errEl.textContent = friendlyError ? friendlyError(err) : "সংরক্ষণ করা যায়নি।";
    errEl.classList.remove("hidden");
  } finally { btn.disabled = false; btn.textContent = "সংরক্ষণ করুন"; }
}

function openImagePreview(url) {
  const modal = document.getElementById("imagePreviewModal");
  const modalImg = document.getElementById("imagePreviewModalImg");
  modalImg.src = url; modal.style.display = "flex"; modal.classList.remove("hidden");
}
function closeImagePreview() {
  const modal = document.getElementById("imagePreviewModal");
  modal.classList.add("hidden"); modal.style.display = "none"; document.getElementById("imagePreviewModalImg").src = "";
}

function openForm(id) {
  editingId = id;
  const form = document.getElementById("questionForm");
  form.classList.remove("hidden");
  document.getElementById("formError").classList.add("hidden");
  if (!id) {
    document.getElementById("formTitle").textContent = "নতুন প্রশ্ন যোগ করুন";
    form.reset();
    document.getElementById("imageUrlInput").value = "";
    document.getElementById("imagePreview").classList.add("hidden");
    document.getElementById("imageUploadStatus").classList.add("hidden");
    document.getElementById("marksInput").value = 1;
  } else {
    const q = allQuestions.find(x => x.id === id);
    if (!q) return;
    document.getElementById("formTitle").textContent = "প্রশ্ন সম্পাদনা করুন";
    document.getElementById("qEn").value = q.question_en || "";
    document.getElementById("qBn").value = q.question_bn;
    document.getElementById("optA").value = q.options_bn.A;
    document.getElementById("optB").value = q.options_bn.B;
    document.getElementById("optC").value = q.options_bn.C;
    document.getElementById("optD").value = q.options_bn.D;
    document.getElementById("correctAnswer").value = q.correctAnswer;
    document.getElementById("marksInput").value = q.marks;
    document.getElementById("explanationInput").value = q.explanation_bn || "";
    document.getElementById("formSubject").value = q.subjectId;
    populateFormChapters(q.subjectId);
    document.getElementById("formChapter").value = q.chapterId;
    populateFormTopics(q.chapterId, q.subjectId);
    document.getElementById("formTopic").value = q.topicId;
    document.getElementById("imageUrlInput").value = q.imageUrl || "";
    const preview = document.getElementById("imagePreview");
    if (q.imageUrl) { preview.src = q.imageUrl; preview.classList.remove("hidden"); }
    else preview.classList.add("hidden");
  }
  form.scrollIntoView({ behavior: "smooth" });
}

function closeForm() { editingId = null; document.getElementById("questionForm").classList.add("hidden"); }

function setupImagePreview() {
  document.getElementById("imageUrlInput").addEventListener("input", debounce((e) => {
    const preview = document.getElementById("imagePreview");
    const url = toDirectImageUrl(e.target.value);
    if (!url) { preview.classList.add("hidden"); return; }
    preview.src = url; preview.classList.remove("hidden");
  }, 400));

  document.getElementById("imageFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById("imageUploadStatus");
    status.textContent = "আপলোড হচ্ছে..."; status.classList.remove("hidden");
    try {
      const url = await uploadImageWithGuidedFallback(file);
      document.getElementById("imageUrlInput").value = url;
      const preview = document.getElementById("imagePreview");
      preview.src = url; preview.classList.remove("hidden");
      status.textContent = "✓ আপলোড সম্পন্ন হয়েছে।";
      status.style.color = "#10b981";
      setTimeout(() => status.classList.add("hidden"), 2500);
    } catch (err) {
      status.textContent = "আপলোড ব্যর্থ হয়েছে।";
      status.style.color = "#ef4444";
      showToast("ছবি আপলোড করা যায়নি।", "error");
    } finally { e.target.value = ""; }
  });
}

function setupVoiceButton() {
  const btn = document.getElementById("voiceBtn");
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>`;
  const target = document.getElementById("qBn");
  attachVoiceInput(btn, target, {
    onStart: () => btn.style.color = "#ef4444",
    onEnd: () => btn.style.color = "",
    onError: () => showToast("ভয়েস ইনপুট ব্যর্থ হয়েছে।", "error")
  });
  if (!isVoiceInputSupported()) btn.title = "এই ব্রাউজার ভয়েস ইনপুট সমর্থন করে না।";
  }

  async function handleSubmit(e) {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("formError");
  errorEl.classList.add("hidden");
  submitBtn.disabled = true; submitBtn.textContent = "সংরক্ষণ করা হচ্ছে...";

  try {
    const payload = {
      question_en: document.getElementById("qEn").value.trim(),
      question_bn: document.getElementById("qBn").value.trim(),
      options_bn: {
        A: document.getElementById("optA").value.trim(),
        B: document.getElementById("optB").value.trim(),
        C: document.getElementById("optC").value.trim(),
        D: document.getElementById("optD").value.trim(),
      },
      correctAnswer: document.getElementById("correctAnswer").value,
      marks: Number(document.getElementById("marksInput").value),
      subjectId: document.getElementById("formSubject").value,
      chapterId: document.getElementById("formChapter").value,
      topicId: document.getElementById("formTopic").value,
      explanation_bn: document.getElementById("explanationInput").value.trim() || null,
    };

    if (!payload.subjectId || !payload.chapterId || !payload.topicId) {
      throw new Error("ব্যাচ, বিষয় ও টপিক অবশ্যই নির্বাচন করতে হবে।");
    }

    const imageUrlRaw = document.getElementById("imageUrlInput").value.trim();
    payload.imageUrl = imageUrlRaw ? toDirectImageUrl(imageUrlRaw) : null;

    if (editingId) { await updateQuestion(editingId, payload); showToast("প্রশ্ন আপডেট করা হয়েছে।", "success"); }
    else { await addQuestion(payload); showToast("প্রশ্ন যোগ করা হয়েছে।", "success"); }
    closeForm(); reloadList();
  } catch (err) {
    errorEl.textContent = err.message || friendlyError(err);
    errorEl.classList.remove("hidden");
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = "সংরক্ষণ করুন";
  }
}

async function handleGenerateExplanation(id, btn) {
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  const apiKey = promptForApiKey(false);
  if (!apiKey) { showToast("API key ছাড়া ব্যাখ্যা তৈরি করা যাবে না।", "error"); return; }

  btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> তৈরি হচ্ছে...`;
  try {
    const explanation = await generateExplanationForQuestion({ apiKey, question_bn: q.question_bn, options_bn: q.options_bn, correctAnswer: q.correctAnswer });
    await updateQuestion(id, { explanation_bn: explanation });
    q.explanation_bn = explanation; 
    showToast("ব্যাখ্যা তৈরি ও সংরক্ষণ করা হয়েছে।", "success");
    renderQuestionList(); 
  } catch (err) {
    showToast(err.message || friendlyError(err), "error");
    btn.disabled = false; btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> AI দিয়ে ব্যাখ্যা তৈরি করুন`;
  }
}

async function handleDuplicate(id) {
  const q = allQuestions.find(x => x.id === id);
  if (!q || !confirm("এই প্রশ্নটি ডুপ্লিকেট করবেন?")) return;
  try { await duplicateQuestion(q); showToast("প্রশ্ন ডুপ্লিকেট করা হয়েছে।", "success"); reloadList(); } catch (err) { showToast(friendlyError(err), "error"); }
}

async function handleToggleActive(id) {
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  if (!confirm(!q.isActive ? "এই প্রশ্নটি আবার সক্রিয় করবেন?" : "এই প্রশ্নটি নিষ্ক্রিয় করবেন? এটি নতুন পরীক্ষায় দেখা যাবে না, তবে পুরনো ফলাফলে অপরিবর্তিত থাকবে।")) return;
  try { await setQuestionActive(id, !q.isActive); showToast("আপডেট করা হয়েছে।", "success"); reloadList(); } catch (err) { showToast(friendlyError(err), "error"); }
}

async function handleDelete(id) {
  if (!confirm("এই প্রশ্নটি স্থায়ীভাবে মুছে ফেলবেন? যেসব পরীক্ষা ইতিমধ্যে প্রকাশিত হয়ে গেছে সেখানে এই প্রশ্নের একটি কপি থেকে যাবে, কিন্তু এটি আর নতুন পরীক্ষায় যোগ করা যাবে না।")) return;
  try { await deleteQuestion(id); showToast("প্রশ্ন মুছে ফেলা হয়েছে।", "success"); reloadList(); } catch (err) { showToast(friendlyError(err), "error"); }
}
</script>
