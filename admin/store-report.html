<!DOCTYPE html>
<html lang="bn">
<head>
<script src="../js/utils/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a2b">
<title>XP স্টোর রিপোর্ট — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; }
  .app-shell { max-width: 900px; padding-bottom: 40px; margin: 0 auto; }

  /* Same topbar as the other admin pages */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: 16px 20px;
    background: var(--surface);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--surface-border);
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .btn-glass {
    background: rgba(128,128,128,0.05); border: 1px solid rgba(128,128,128,0.15);
    border-radius: 12px; color: var(--text-primary); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
    transition: all .2s ease;
  }
  .btn-glass:hover { background: rgba(128,128,128,0.1); transform: translateY(-2px); }
  .btn-glass:active { transform: scale(.96); }

  .page-sub { margin: 0 2px 16px; font-size: .8rem; font-weight: 700; line-height: 1.6; color: var(--text-muted); }

  .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }

  .stat-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (min-width: 560px) { .stat-strip { grid-template-columns: repeat(4, 1fr); } }
  .stat-box { background: var(--surface-highlight); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 12px; text-align: center; }
  .stat-box b { display: block; font-size: 1.25rem; font-weight: 900; color: var(--color-accent); font-family: var(--font-num); }
  .stat-box span { font-size: .68rem; font-weight: 700; color: var(--text-muted); }

  .search-box { display: flex; align-items: center; gap: 8px; background: rgba(128,128,128,0.05); border: 1px solid var(--surface-border); border-radius: 12px; padding: 0 12px; margin-bottom: 14px; }
  .search-box input { flex: 1; border: none; background: transparent; outline: none; font-family: inherit; font-size: .88rem; font-weight: 600; color: var(--text-primary); padding: 10px 0; }

  .st-table-row { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px dashed var(--surface-border); font-size: .82rem; }
  .st-table-row:last-child { border-bottom: none; }
  .st-name { flex: 1; min-width: 0; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-col { width: 66px; text-align: center; font-weight: 700; font-family: var(--font-num); flex-shrink: 0; }
  .st-col-head { width: 66px; text-align: center; flex-shrink: 0; }
  .th-row { display: flex; gap: 10px; padding: 0 6px 8px; font-size: .68rem; font-weight: 800; color: var(--text-muted); }
  .th-name { flex: 1; }

  .usage-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px dashed var(--surface-border); font-size: .8rem; }
  .usage-row:last-child { border-bottom: none; }
  .usage-name { font-weight: 700; color: var(--text-primary); }
  .usage-sub { font-size: .72rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
  .usage-qty { font-weight: 800; color: var(--color-accent); font-family: var(--font-num); white-space: nowrap; flex-shrink: 0; }

  .footer-note { margin: 18px 4px 0; text-align: center; color: var(--text-muted); font-size: .68rem; font-weight: 600; line-height: 1.6; }
</style>
<script src="../js/popup.js"></script>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="../admin/dashboard.html" class="btn-glass" style="width:42px; height:42px; padding:0;" aria-label="ড্যাশবোর্ড">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 style="font-size:1.15rem; font-weight:900; color:var(--text-primary); margin:0;">XP স্টোর রিপোর্ট</h2>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="ডে নাইট মোড" style="margin:0;"><span class="theme-toggle-thumb"></span></button>
      <button class="btn-glass" id="logoutBtn" type="button" aria-label="লগআউট" style="width:42px;height:42px;padding:0;border-color:rgba(239,68,68,0.3);color:#ef4444;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <p class="page-sub">কে কয়টা কার্ড কিনেছে, কয়টা ব্যবহার হয়েছে, আর মোট কত XP খরচ হয়েছে — সব একসাথে।</p>

  <div id="body">
    <div class="state-block"><div class="spinner"></div></div>
  </div>

  <p class="footer-note">এই তালিকা storeInventory ও storeCardUsage থেকে সরাসরি পড়া হয় — লাইভ ডেটা, ক্যাশ করা নয়।</p>
</div>

<script type="module">
import { initTheme, toggleTheme, renderState, formatDate, formatTime } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { getActiveStudents } from "../js/utils/student-utils.js";
import { STORE_ITEMS, getAllInventoriesForAdmin, getRecentUsageForAdmin } from "../js/utils/store-utils.js?v=roomcard1";

initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);
document.getElementById("logoutBtn")?.addEventListener("click", adminLogout);

const body = document.getElementById("body");
const fmt = (n) => Number(n || 0).toLocaleString("bn-BD");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

requireAdmin(async () => {
  try {
    const [students, inventories, usage] = await Promise.all([
      getActiveStudents(),
      getAllInventoriesForAdmin(),
      getRecentUsageForAdmin(100)
    ]);
    render(students, inventories, usage);
  } catch (err) {
    console.error(err);
    renderState(body, "error", "রিপোর্ট লোড করা যায়নি।");
  }
});

function nameFor(studentsById, studentId) {
  return studentsById.get(studentId)?.name || studentId;
}

function render(students, inventories, usage) {
  const studentsById = new Map(students.map(s => [s.studentId, s]));

  // প্রতি student-এর সব item মিলিয়ে মোট purchased/used/available
  const rows = inventories.map(inv => {
    let purchased = 0, used = 0;
    for (const item of STORE_ITEMS) {
      const row = inv.items?.[item.id] || { purchased: 0, used: 0 };
      purchased += Number(row.purchased || 0);
      used += Number(row.used || 0);
    }
    return {
      studentId: inv.studentId,
      name: nameFor(studentsById, inv.studentId),
      purchased, used, available: Math.max(0, purchased - used),
      spentXP: Number(inv.totalSpentXP || 0)
    };
  }).filter(r => r.purchased > 0).sort((a, b) => b.spentXP - a.spentXP);

  const totals = rows.reduce((t, r) => ({
    purchased: t.purchased + r.purchased, used: t.used + r.used, spentXP: t.spentXP + r.spentXP
  }), { purchased: 0, used: 0, spentXP: 0 });

  body.innerHTML = `
    <div class="stat-strip">
      <div class="stat-box"><b class="num">${fmt(rows.length)}</b><span>কিনেছে এমন শিক্ষার্থী</span></div>
      <div class="stat-box"><b class="num">${fmt(totals.purchased)}</b><span>মোট কার্ড কেনা</span></div>
      <div class="stat-box"><b class="num">${fmt(totals.used)}</b><span>মোট কার্ড ব্যবহার</span></div>
      <div class="stat-box"><b class="num">${fmt(totals.spentXP)}</b><span>মোট XP খরচ</span></div>
    </div>

    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="নাম বা আইডি দিয়ে খুঁজো...">
    </div>

    <div class="card">
      <p style="font-weight:800; margin-bottom:8px;">শিক্ষার্থী অনুযায়ী</p>
      <div class="th-row">
        <span class="th-name">নাম</span>
        <span class="st-col-head">কেনা</span>
        <span class="st-col-head">ব্যবহার</span>
        <span class="st-col-head">বাকি</span>
        <span class="st-col-head">XP</span>
      </div>
      <div id="studentTable"></div>
    </div>

    <div class="card">
      <p style="font-weight:800; margin-bottom:8px;">সাম্প্রতিক ব্যবহার (শেষ ${fmt(usage.length)}টি)</p>
      <div id="usageList">
        ${usage.length === 0 ? `<p class="text-sm text-muted">এখনো কোনো কার্ড ব্যবহার হয়নি।</p>` : usage.map(u => `
          <div class="usage-row">
            <div>
              <div class="usage-name">${esc(nameFor(studentsById, u.studentId))}</div>
              <div class="usage-sub">${esc(u.examTitle || "—")} · ${formatDate(u.createdAtMs)} ${formatTime(u.createdAtMs)}</div>
            </div>
            <div class="usage-qty">${fmt(u.qty)}টি</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  function renderTable(list) {
    const table = document.getElementById("studentTable");
    if (!list.length) { table.innerHTML = `<p class="text-sm text-muted">কেউ এখনো কিছু কেনেনি।</p>`; return; }
    table.innerHTML = list.map(r => `
      <div class="st-table-row">
        <span class="st-name">${esc(r.name)}</span>
        <span class="st-col">${fmt(r.purchased)}</span>
        <span class="st-col">${fmt(r.used)}</span>
        <span class="st-col">${fmt(r.available)}</span>
        <span class="st-col">${fmt(r.spentXP)}</span>
      </div>
    `).join("");
  }
  renderTable(rows);

  document.getElementById("searchInput").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { renderTable(rows); return; }
    renderTable(rows.filter(r => r.name.toLowerCase().includes(q) || r.studentId.toLowerCase().includes(q)));
  });
}
</script>
</body>
</html>
