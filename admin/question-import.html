<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI প্রশ্ন ইম্পোর্ট — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff6a2b">
</head>
<body>
<div class="app-shell app-shell--wide" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { requireAdmin, adminLogout } from "../js/utils/auth.js";
import { initAdminPwaInstall } from "../pwa-install.js";
import { getFullSyllabusTree } from "../js/utils/syllabus-utils.js";
import { parseAiImportText, buildAiPromptTemplate, generateQuestionsFromImage, fileToImagePart } from "../js/utils/ai-import-utils.js";
import { addQuestion } from "../js/utils/question-utils.js";

const GEMINI_KEY_STORAGE = "gemini_api_key";

initTheme();
const shell = document.getElementById("shell");
let tree = [];
let parsedResults = [];

requireAdmin(() => {
  shell.innerHTML = template();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("logoutBtn").addEventListener("click", adminLogout);
  initAdminPwaInstall("installBtn");
  document.getElementById("parseBtn").addEventListener("click", handleParse);
  document.getElementById("copyPromptBtn").addEventListener("click", handleCopyPrompt);
  document.getElementById("generateBtn").addEventListener("click", handleGenerateFromImage);
  document.getElementById("apiKeyBtn").addEventListener("click", () => promptForApiKey(true));
  document.getElementById("imageInput").addEventListener("change", renderImagePreview);
  setupDropzone();
  init();
});

function template() {
  return `
    <div class="topbar">
      <a href="../admin/questions.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">AI প্রশ্ন ইম্পোর্ট</h2>
      <div class="flex gap-2">
        <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
        <button class="icon-btn hidden" id="installBtn" title="অ্যাপ ইনস্টল করুন"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>
        <button class="icon-btn" id="logoutBtn">${icons.arrowRight}</button>
      </div>
    </div>

    <div class="glass card">
      <div class="flex justify-between items-center">
        <p class="eyebrow">বিষয় / অধ্যায় / টপিক নির্বাচন করুন</p>
      </div>
      <p class="text-xs text-muted mt-1">নিচে যা কিছু পেস্ট বা জেনারেট করবে, সব প্রশ্ন এই selected চ্যাপ্টার-টপিকেই যোগ হবে।</p>
      <div class="grid-2 mt-2" style="grid-template-columns:1fr 1fr 1fr;">
        <select class="select" id="promptSubject"></select>
        <select class="select" id="promptChapter"></select>
        <select class="select" id="promptTopic"></select>
      </div>
      <div class="field mt-2">
        <input class="input" type="number" min="1" id="promptCount" value="10" placeholder="কতটি প্রশ্ন">
      </div>
      <button class="btn btn-secondary mt-2" id="copyPromptBtn">প্রম্পট কপি করুন</button>
    </div>

    <div class="glass card mt-4">
      <div class="flex justify-between items-center">
        <p class="eyebrow">AI দিয়ে অটো জেনারেট</p>
        <button class="icon-btn" id="apiKeyBtn" title="Gemini API Key সেট/পরিবর্তন করুন">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 7a4 4 0 100 8 4 4 0 000-8zM3 21l6-6m-2-2l2 2"/></svg>
        </button>
      </div>
      <p class="text-xs text-muted mt-1">চ্যাপ্টারের বই/নোটের পাতার ছবি দাও অথবা নিচে সরাসরি টপিক লিখে দাও — Gemini প্রশ্ন বানিয়ে নিচে পেস্ট-বক্সে ভরে দেবে। প্রথমবার ব্যবহারে একটা ফ্রি Gemini API key চাইবে (শুধু এই ব্রাউজারে সেভ থাকবে)।</p>

      <p class="text-xs mt-4" style="font-weight:700;color:var(--text-secondary);">ছবি (ঐচ্ছিক)</p>
      <label for="imageInput" id="imageDropzone" style="display:flex;align-items:center;gap:10px;margin-top:8px;padding:14px 16px;border:1.5px dashed var(--surface-border);border-radius:var(--radius-sm);cursor:pointer;background:var(--color-surface-2,transparent);transition:border-color 150ms ease,background 150ms ease;">
        <span class="icon-btn" style="pointer-events:none;flex-shrink:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
        </span>
        <span class="text-sm" style="font-weight:600;">ছবি বাছাই করো (একাধিক নেওয়া যাবে)</span>
      </label>
      <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
      <div id="imagePreview" class="flex gap-2 mt-2" style="flex-wrap:wrap;"></div>

      <div class="flex items-center gap-2 mt-4" style="color:var(--text-muted);">
        <span style="flex:1;height:1px;background:var(--surface-border);"></span>
        <span class="text-xs">অথবা শুধু টপিক লেখো</span>
        <span style="flex:1;height:1px;background:var(--surface-border);"></span>
      </div>
      <textarea class="textarea mt-3" id="extraInstructions" style="min-height:70px;" placeholder="যেমন: নিউটনের গতিসূত্র নিয়ে মাঝারি মানের প্রশ্ন, প্রতিটির মার্কস ২ রাখো — ছবি না দিলেও এটা লিখলেই যথেষ্ট"></textarea>

      <button class="btn btn-primary mt-3" id="generateBtn">AI দিয়ে জেনারেট করুন</button>
      <div class="mt-3 hidden" id="generateProgress">
        <div class="flex items-center gap-2">
          <div class="spinner" style="width:18px;height:18px;"></div>
          <span class="text-xs" id="generateProgressText">শুরু হচ্ছে...</span>
        </div>
        <div style="height:6px;border-radius:99px;background:var(--color-surface-2,#0003);overflow:hidden;margin-top:8px;">
          <div id="generateProgressBar" style="height:100%;width:6%;border-radius:99px;background:linear-gradient(90deg,#ff6a2b,#ff8a4c);transition:width .4s linear;"></div>
        </div>
      </div>
    </div>

    <div class="glass card mt-4">
      <p class="eyebrow">প্রশ্ন পেস্ট করুন</p>
      <p class="text-xs text-muted mt-1">Claude/Gemini থেকে পাওয়া নির্দিষ্ট ফরম্যাটের টেক্সট এখানে পেস্ট করুন (অথবা উপরের বাটনে অটো জেনারেট করুন) — একাধিক প্রশ্ন একসাথে পেস্ট করা যাবে।</p>
      <textarea class="textarea mt-3" id="pasteArea" style="min-height:220px;" placeholder="Question:
...

বাংলা প্রশ্ন:
...

A:
...
B:
...
C:
...
D:
...

Correct Answer:
B

Subject:
Physics

Chapter:
Motion

Topic:
Velocity

Marks:
1"></textarea>
      <button class="btn btn-primary mt-3" id="parseBtn">প্রিভিউ দেখুন</button>
    </div>

    <div id="previewSection" class="mt-5"></div>
  `;
}

async function init() {
  tree = await getFullSyllabusTree();
  const subjSel = document.getElementById("promptSubject");
  subjSel.innerHTML = tree.map(s => `<option value="${s.id}">${s.name_bn}</option>`).join("");
  subjSel.addEventListener("change", () => { updatePromptChapters(); reparseIfNeeded(); });
  document.getElementById("promptChapter").addEventListener("change", () => { updatePromptTopics(); reparseIfNeeded(); });
  document.getElementById("promptTopic").addEventListener("change", reparseIfNeeded);
  if (tree[0]) updatePromptChapters();
}

function reparseIfNeeded() {
  if (parsedResults.length > 0) handleParse();
}

function updatePromptChapters() {
  const subject = tree.find(s => s.id === document.getElementById("promptSubject").value);
  const chapSel = document.getElementById("promptChapter");
  chapSel.innerHTML = (subject?.chapters || []).map(c => `<option value="${c.id}">${c.name_bn}</option>`).join("");
  updatePromptTopics();
}

function updatePromptTopics() {
  const subject = tree.find(s => s.id === document.getElementById("promptSubject").value);
  const chapter = subject?.chapters.find(c => c.id === document.getElementById("promptChapter").value);
  document.getElementById("promptTopic").innerHTML = (chapter?.topics || []).map(t => `<option value="${t.id}">${t.name_bn}</option>`).join("");
}

function handleCopyPrompt() {
  const { subject, chapter, topic } = currentSelection();
  const count = document.getElementById("promptCount").value;

  const text = buildAiPromptTemplate({
    subjectName: subject?.name_en, chapterName: chapter?.name_en, topicName: topic?.name_en, count
  });
  navigator.clipboard.writeText(text)
    .then(() => showToast("প্রম্পট কপি করা হয়েছে।", "success"))
    .catch(() => showToast("কপি করা যায়নি। ম্যানুয়ালি সিলেক্ট করে কপি করুন।", "error"));
}

function currentSelection() {
  const subject = tree.find(s => s.id === document.getElementById("promptSubject").value);
  const chapter = subject?.chapters.find(c => c.id === document.getElementById("promptChapter").value);
  const topic = chapter?.topics.find(t => t.id === document.getElementById("promptTopic").value);
  return { subject, chapter, topic };
}

function currentTarget() {
  return {
    subjectId: document.getElementById("promptSubject").value || null,
    chapterId: document.getElementById("promptChapter").value || null,
    topicId: document.getElementById("promptTopic").value || null
  };
}

function targetLabel() {
  const { subject, chapter, topic } = currentSelection();
  return [subject?.name_bn, chapter?.name_bn, topic?.name_bn].filter(Boolean).join(" / ") || "—";
}

// ---------- Gemini API key (browser-local only, never sent anywhere but Google) ----------
function getStoredApiKey() {
  return localStorage.getItem(GEMINI_KEY_STORAGE) || "";
}

function promptForApiKey(forceAsk = false) {
  const existing = getStoredApiKey();
  if (existing && !forceAsk) return existing;
  const key = window.prompt(
    "তোমার Gemini API key দাও (Google AI Studio থেকে ফ্রি নেওয়া যায়) — এটা শুধু এই ব্রাউজারে সেভ থাকবে, সার্ভার/রিপোতে যাবে না:",
    existing || ""
  );
  if (key && key.trim()) {
    localStorage.setItem(GEMINI_KEY_STORAGE, key.trim());
    showToast("API key সেভ হয়েছে।", "success");
    return key.trim();
  }
  return existing || null;
}

// ---------- AI image → questions ----------
// ---------- Image preview (confirms the right pages were picked before sending) ----------
function renderImagePreview() {
  const input = document.getElementById("imageInput");
  const files = Array.from(input.files || []);
  const box = document.getElementById("imagePreview");
  box.innerHTML = "";
  files.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;width:64px;height:64px;flex-shrink:0;";
    const img = document.createElement("img");
    img.src = url;
    img.style.cssText = "width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--color-border,#ffffff22);";
    img.onload = () => URL.revokeObjectURL(url);
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.title = "সরিয়ে দাও";
    rm.style.cssText = "position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--color-danger,#e5484d);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;";
    rm.addEventListener("click", () => {
      const dt = new DataTransfer();
      files.filter((_, j) => j !== i).forEach(f => dt.items.add(f));
      input.files = dt.files;
      renderImagePreview();
    });
    wrap.appendChild(img);
    wrap.appendChild(rm);
    box.appendChild(wrap);
  });
}

// Dropzone visual feedback + drag-and-drop support
function setupDropzone() {
  const dropzone = document.getElementById("imageDropzone");
  if (!dropzone) return;
  ["dragover", "dragenter"].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = "var(--color-primary, #ff6a2b)";
    dropzone.style.background = "var(--color-surface-2, rgba(255,106,43,0.06))";
  }));
  ["dragleave", "drop"].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = "var(--surface-border)";
    dropzone.style.background = "transparent";
  }));
  dropzone.addEventListener("drop", (e) => {
    const dropped = e.dataTransfer?.files;
    if (dropped && dropped.length > 0) {
      document.getElementById("imageInput").files = dropped;
      renderImagePreview();
    }
  });
}

// ---------- Generation progress (real elapsed time — Gemini takes ~8-30s depending on image count) ----------
let progressTimer = null;
let progressStartedAt = null;

function startProgress(imageCount) {
  const box = document.getElementById("generateProgress");
  const bar = document.getElementById("generateProgressBar");
  box.classList.remove("hidden");
  bar.style.width = "6%";
  progressStartedAt = Date.now();
  updateProgressText(imageCount);
  progressTimer = setInterval(() => updateProgressText(imageCount), 1000);
}

function updateProgressText(imageCount) {
  const secs = Math.floor((Date.now() - progressStartedAt) / 1000);
  let stage;
  if (secs < 2) stage = imageCount > 0 ? `${imageCount} টি ছবি পড়া হচ্ছে...` : "টপিক প্রস্তুত করা হচ্ছে...";
  else if (secs < 5) stage = "Gemini-কে পাঠানো হয়েছে...";
  else if (secs < 20) stage = "Gemini প্রশ্ন তৈরি করছে...";
  else stage = "প্রায় শেষ — একটু ধৈর্য ধরো...";
  document.getElementById("generateProgressText").textContent = `${stage} (${secs}s)`;
  // Not a real countdown (Gemini's response time varies) — this fills toward
  // ~95% over ~25s as a visual cue, then holds until the actual response lands.
  const pct = Math.min(95, 6 + secs * 4);
  document.getElementById("generateProgressBar").style.width = pct + "%";
}

function stopProgress(success) {
  clearInterval(progressTimer);
  progressTimer = null;
  if (success) document.getElementById("generateProgressBar").style.width = "100%";
  setTimeout(() => document.getElementById("generateProgress").classList.add("hidden"), success ? 400 : 0);
}

async function handleGenerateFromImage() {
  const files = document.getElementById("imageInput").files;
  const extraInstructions = document.getElementById("extraInstructions").value;
  if ((!files || files.length === 0) && !extraInstructions.trim()) {
    showToast("অন্তত একটি ছবি দাও, অথবা নিচে টপিক লিখে দাও।", "error");
    return;
  }

  const target = currentTarget();
  if (!target.subjectId || !target.chapterId || !target.topicId) {
    showToast("প্রথমে উপরে থেকে বিষয়/অধ্যায়/টপিক নির্বাচন করো।", "error");
    return;
  }

  const apiKey = promptForApiKey(false);
  if (!apiKey) { showToast("API key ছাড়া জেনারেট করা যাবে না।", "error"); return; }

  const { subject, chapter, topic } = currentSelection();
  const count = document.getElementById("promptCount").value;
  const btn = document.getElementById("generateBtn");
  btn.disabled = true;
  btn.textContent = "জেনারেট করা হচ্ছে...";
  startProgress(files ? files.length : 0);

  try {
    const imageParts = files && files.length > 0 ? await Promise.all(Array.from(files).map(fileToImagePart)) : [];
    // Sanity check: confirm every selected file actually produced image data
    // before spending an API call on it.
    const emptyCount = imageParts.filter(p => !p.base64).length;
    if (emptyCount > 0) throw new Error(`${emptyCount} টি ছবি ঠিকমতো পড়া যায়নি — আবার সিলেক্ট করে দেখো।`);

    const text = await generateQuestionsFromImage({
      apiKey,
      imageParts,
      subjectName: subject?.name_en,
      chapterName: chapter?.name_en,
      topicName: topic?.name_en,
      count,
      extraInstructions
    });
    document.getElementById("pasteArea").value = text;
    handleParse();
    stopProgress(true);
    showToast(imageParts.length > 0 ? `${imageParts.length} টি ছবি বিশ্লেষণ করে প্রশ্ন তৈরি হয়েছে — নিচে প্রিভিউ দেখে ইম্পোর্ট করো।` : "টপিক থেকে প্রশ্ন তৈরি হয়েছে — নিচে প্রিভিউ দেখে ইম্পোর্ট করো।", "success");
  } catch (err) {
    console.error(err);
    stopProgress(false);
    showToast(err.message || friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "AI দিয়ে জেনারেট করুন";
  }
}

function handleParse() {
  const raw = document.getElementById("pasteArea").value;
  if (!raw.trim()) { showToast("প্রথমে টেক্সট পেস্ট করুন।", "error"); return; }
  parsedResults = parseAiImportText(raw, currentTarget());
  renderPreview();
}

function renderPreview() {
  const section = document.getElementById("previewSection");
  if (parsedResults.length === 0) {
    section.innerHTML = `<p class="text-sm text-muted">কোনো প্রশ্ন শনাক্ত করা যায়নি। ফরম্যাট যাচাই করুন।</p>`;
    return;
  }
  const validCount = parsedResults.filter(r => r.valid).length;

  section.innerHTML = `
    <div class="flex justify-between items-center">
      <p class="eyebrow">প্রিভিউ (${parsedResults.length} টি শনাক্ত, ${validCount} টি বৈধ)</p>
      <button class="btn btn-primary btn-sm" id="importAllBtn">বৈধ প্রশ্নগুলো ইম্পোর্ট করুন</button>
    </div>
    ${parsedResults.map(r => `
      <div class="glass card mt-3" style="${r.valid ? "" : "border-color:var(--color-danger)66;"}" data-index="${r.index}">
        <div class="flex justify-between items-center">
          <span class="badge ${r.valid ? "badge-completed" : "badge-pending"}">${r.valid ? "বৈধ" : "সমস্যা আছে"}</span>
          <button class="icon-btn remove-btn" data-index="${r.index}" title="বাদ দিন">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        ${!r.valid ? `<ul class="text-xs mt-2" style="color:var(--color-danger);padding-right:16px;">${r.errors.map(e => `<li>${e}</li>`).join("")}</ul>` : ""}
        <p class="mt-2" style="font-weight:600;">${r.question.question_bn || "(বাংলা প্রশ্ন অনুপস্থিত)"}</p>
        <p class="text-xs text-muted lang-en">${r.question.question_en || "(English question missing)"}</p>
        <div class="grid-2 mt-2">
          <p class="text-xs">A: ${r.question.options_bn.A || "—"}</p>
          <p class="text-xs">B: ${r.question.options_bn.B || "—"}</p>
          <p class="text-xs">C: ${r.question.options_bn.C || "—"}</p>
          <p class="text-xs">D: ${r.question.options_bn.D || "—"}</p>
        </div>
        <p class="text-xs mt-2">সঠিক: ${r.question.correctAnswer || "—"} • নম্বর: ${r.question.marks} • ${targetLabel()}</p>
        ${r.question.explanation_bn ? `<p class="text-xs text-muted mt-2" style="border-top:1px dashed var(--surface-border);padding-top:8px;">ব্যাখ্যা: ${r.question.explanation_bn}</p>` : `<p class="text-xs mt-2" style="color:var(--color-danger);">⚠ ব্যাখ্যা নেই — এই প্রশ্নে ভুল করলে স্টুডেন্ট ব্যাখ্যা দেখতে পাবে না</p>`}
      </div>
    `).join("")}
  `;

  document.getElementById("importAllBtn").addEventListener("click", handleImportAll);
  section.querySelectorAll(".remove-btn").forEach(b => b.addEventListener("click", () => {
    const idx = Number(b.dataset.index);
    parsedResults = parsedResults.filter(r => r.index !== idx);
    renderPreview();
  }));
}

async function handleImportAll() {
  const validOnes = parsedResults.filter(r => r.valid);
  if (validOnes.length === 0) { showToast("ইম্পোর্ট করার মতো কোনো বৈধ প্রশ্ন নেই।", "error"); return; }
  const btn = document.getElementById("importAllBtn");
  btn.disabled = true;
  btn.textContent = "ইম্পোর্ট করা হচ্ছে...";
  try {
    for (const r of validOnes) {
      await addQuestion({
        question_en: r.question.question_en,
        question_bn: r.question.question_bn,
        options_bn: r.question.options_bn,
        correctAnswer: r.question.correctAnswer,
        explanation_bn: r.question.explanation_bn,
        marks: r.question.marks,
        subjectId: r.question.subjectId,
        chapterId: r.question.chapterId,
        topicId: r.question.topicId,
        createdByAI: true
      });
    }
    showToast(`${validOnes.length} টি প্রশ্ন প্রশ্ন ব্যাংকে যোগ করা হয়েছে।`, "success");
    parsedResults = [];
    document.getElementById("pasteArea").value = "";
    document.getElementById("previewSection").innerHTML = "";
  } catch (err) {
    console.error(err);
    showToast(friendlyError(err), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "বৈধ প্রশ্নগুলো ইম্পোর্ট করুন";
  }
}
</script>
</body>
</html>
