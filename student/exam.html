<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>পরীক্ষা — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* This page rides on the app-wide "Instrument Panel" design system
     (style.css): amber/ember accent, teal success, rose danger, glass
     grain texture, Space Grotesk for numerals. No extra background
     layer added here — just motion + structure on top of the existing
     mesh so nothing doubles up. */

  /* ===== Card entrance ===== */
  .glass.card { animation: cardRise 420ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glass.card, #questionBody.q-enter, .option-card, .palette-cell { animation: none !important; }
  }

  /* ===== Question transition wrapper ===== */
  #questionBody { will-change: transform, opacity; }
  #questionBody.q-enter { animation: qSlideIn 320ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes qSlideIn {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ===== Option cards ===== */
  .option-card {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 12px;
    width: 100%; min-height: 56px; padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--surface-border);
    background: var(--surface-solid);
    backdrop-filter: blur(6px);
    color: var(--text-primary);
    font-family: var(--font-bn);
    font-size: 0.95rem;
    text-align: right;
    transition: border-color 180ms ease, background 180ms ease, transform 150ms ease, box-shadow 180ms ease;
    margin-bottom: 10px;
    animation: optRise 320ms cubic-bezier(.22,.9,.3,1) both;
  }
  .option-card:nth-of-type(1) { animation-delay: 20ms; }
  .option-card:nth-of-type(2) { animation-delay: 60ms; }
  .option-card:nth-of-type(3) { animation-delay: 100ms; }
  .option-card:nth-of-type(4) { animation-delay: 140ms; }
  @keyframes optRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .option-card:active { transform: scale(0.98); }
  .option-card.selected {
    border-color: var(--color-accent);
    background: var(--color-accent-soft);
    box-shadow: 0 0 0 1px var(--color-accent), 0 6px 18px -8px var(--color-accent);
    animation: optRise 320ms cubic-bezier(.22,.9,.3,1) both, optPop 260ms cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes optPop { 0% { transform: scale(1); } 40% { transform: scale(1.015); } 100% { transform: scale(1); } }
  .option-letter {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface-border); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem;
    transition: background 180ms ease, transform 220ms cubic-bezier(.34,1.56,.64,1);
  }
  .option-card.selected .option-letter { background: var(--color-accent); color: #1a1204; transform: scale(1.08); }

  /* ===== Palette grid ===== */
  .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .palette-cell {
    aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; border: 1.5px solid var(--surface-border);
    background: var(--surface-solid); color: var(--text-secondary);
    transition: transform 140ms ease, box-shadow 180ms ease, background 180ms ease, border-color 180ms ease;
    animation: cellPop 260ms cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cellPop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  .palette-cell:active { transform: scale(0.92); }
  .palette-cell.answered { background: var(--color-success); color: #072925; border-color: var(--color-success); }
  .palette-cell.marked { border-color: #f2a93b; box-shadow: inset 0 0 0 1.5px #f2a93b; }
  .palette-cell.marked.answered { background: var(--color-success); box-shadow: inset 0 0 0 2px #f2a93b; }
  .palette-cell.current {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-soft);
    animation: cellPop 260ms cubic-bezier(.34,1.56,.64,1) both, currentPulse 1.6s ease-in-out infinite;
  }
  @keyframes currentPulse { 0%,100% { box-shadow: 0 0 0 3px var(--color-accent-soft); } 50% { box-shadow: 0 0 0 6px transparent; } }

  /* ===== Timer — plain compact text, no ring/circle, minimal footprint ===== */
  #timerDisplay {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 0.95rem; letter-spacing: -0.02em; white-space: nowrap;
    padding: 5px 12px; border-radius: 999px;
    background: var(--surface-solid); border: 1px solid var(--surface-border);
    color: var(--color-accent); transition: color 250ms ease, border-color 250ms ease;
  }
  #timerDisplay.timer-warning { color: #f2a93b; border-color: #f2a93b66; }
  #timerDisplay.timer-critical { color: var(--color-danger); border-color: var(--color-danger); animation: timerPulse 1s infinite; }
  @keyframes timerPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { #timerDisplay { animation: none !important; } }

  /* ===== Animated progress bar — moving stripe so it reads as "live" while answering ===== */
  .exam-progress-track { height: 8px; border-radius: 999px; background: var(--surface-border); box-shadow: inset 0 1px 3px rgba(0,0,0,0.12); overflow: hidden; }
  .exam-progress-fill {
    position: relative; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--color-accent), var(--color-accent-2));
    box-shadow: 0 0 12px rgba(201,151,63,0.5);
    transition: width 420ms cubic-bezier(.22,.9,.3,1);
    overflow: hidden;
  }
  .exam-progress-fill::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0.32) 0px, rgba(255,255,255,0.32) 8px, transparent 8px, transparent 18px);
    background-size: 200% 100%;
    animation: fillShimmer 1.4s linear infinite;
  }
  @keyframes fillShimmer { from { background-position: 0 0; } to { background-position: -36px 0; } }
  @media (prefers-reduced-motion: reduce) { .exam-progress-fill::after { animation: none; } }
  #progressLabel { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.82rem; color: var(--text-secondary); }
  #qCounter .num-part { font-family: var(--font-num); }

  .review-toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem;
    padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--surface-border);
    background: var(--surface-solid); color: var(--text-secondary); margin-top: 12px;
    transition: transform 150ms ease, border-color 180ms ease, color 180ms ease, background 180ms ease;
  }
  .review-toggle:active { transform: scale(0.96); }
  .review-toggle.active { border-color: #f2a93b; color: #f2a93b; background: #f2a93b22; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,14,26,0.55);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px;
    animation: overlayFade 200ms ease both;
  }
  .modal-overlay .glass.card { animation: modalRise 260ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes overlayFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalRise { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .img-broken { border: 1.5px dashed var(--color-danger); min-height: 60px; opacity: 0.6; }

  .q-figure { transition: transform 200ms ease; }
  .q-figure:hover { transform: scale(1.015); }

  .btn { transition: transform 140ms ease, box-shadow 180ms ease, filter 180ms ease; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn-primary:not(:disabled):hover { filter: brightness(1.06); }

  /* ===== Sticky topbar — the timer must always stay visible while a
     student scrolls through a long question, never require scrolling
     back up to check remaining time. Scoped to this page only. ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) var(--space-4);
    padding: var(--space-4) var(--space-4) var(--space-3);
    background: var(--surface-solid);
    backdrop-filter: blur(var(--blur-sm)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--blur-sm)) saturate(var(--glass-sat));
    border-bottom: 1px solid var(--surface-border);
  }
  @media (min-width: 900px) {
    .topbar { margin: calc(var(--space-7) * -1) calc(var(--space-6) * -1) var(--space-4); padding: var(--space-4) var(--space-6) var(--space-3); }
  }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, icons, renderState, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getExamById, getExamSnapshot } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import {
  peekInProgressAttempt, getOrStartAttempt, saveLocalAttempt,
  syncToFirestoreDebounced, submitAttempt, getExistingResult
} from "../js/utils/attempt-utils.js";
import { formatHms } from "../js/utils/grading-utils.js";

initTheme();
const shell = document.getElementById("shell");
const params = new URLSearchParams(window.location.search);
const examId = params.get("examId");
const student = getActiveStudent();

let exam = null;
let snapshot = null;
let attemptState = null;
let timerHandle = null;
let questionStartMillis = null;
let warned5min = false, warned1min = false;
let lastWarnedInterval = 0; // tracks which 30-min mark we've already toasted
let examInProgress = false;

if (!student) {
  window.location.href = "../index.html";
} else if (!examId) {
  shell.innerHTML = `<div class="state-block"><p class="text-sm">পরীক্ষা শনাক্ত করা যায়নি।</p></div>`;
} else {
  boot();
}

async function boot() {
  shell.innerHTML = `<div class="state-block"><div class="spinner"></div><p class="text-sm text-muted">পরীক্ষা লোড করা হচ্ছে...</p></div>`;
  try {
    const existingResult = await getExistingResult(examId, student.studentId);
    if (existingResult) {
      window.location.href = `../student/result.html?resultId=${examId}_${student.studentId}`;
      return;
    }

    exam = await getExamById(examId);
    if (!exam) {
      renderState(shell, "error", "এই পরীক্ষাটি এখন উপলব্ধ নয়।");
      return;
    }
    snapshot = await getExamSnapshot(examId);
    if (!snapshot || !snapshot.questions || snapshot.questions.length === 0) {
      renderState(shell, "error", "পরীক্ষার প্রশ্ন এখনো প্রস্তুত হয়নি।");
      return;
    }

    // Check for an already-in-progress attempt FIRST, before gating on exam
    // status — a student partway through an exam must always be able to
    // resume and submit their own answers, even if an admin changes the
    // exam's status in the meantime (e.g. archives it). Status only gates
    // whether a NEW attempt may be started.
    const resumable = await peekInProgressAttempt(examId, student.studentId);
    if (resumable) {
      attemptState = resumable;
      attemptState.questionTimes = attemptState.questionTimes || {};
      attemptState.markedForReview = attemptState.markedForReview || {};
      renderExamShell();
      startTimer();
      return;
    }

    if (!["upcoming", "published", "active"].includes(exam.status)) {
      renderState(shell, "error", "এই পরীক্ষাটি এখন উপলব্ধ নয়।");
      return;
    }
    renderIntro();
  } catch (err) {
    console.error(err);
    renderState(shell, "error", "পরীক্ষা লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।");
  }
}

async function renderIntro() {
  const [subjects, chapters] = await Promise.all([getSubjects(), getChapters()]);
  const subjectMap = buildNameMap(subjects);
  const chapterMap = buildNameMap(chapters);
  const subjNames = (exam.subjectIds || []).map(id => subjectMap[id]).filter(Boolean).join(", ");
  const chapNames = (exam.chapterIds || []).map(id => chapterMap[id]).filter(Boolean).join(", ");
  const dateStr = exam.examDate?.toDate ? exam.examDate.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—";

  shell.innerHTML = `
    <div class="topbar">
      <a href="../student/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">পরীক্ষা শুরুর আগে</h2>
      <span></span>
    </div>

    <div class="glass card">
      <p class="eyebrow">${exam.name}</p>
      ${exam.description ? `<p class="text-sm mt-2">${exam.description}</p>` : ""}
      <div class="grid-2 mt-4">
        <div><p class="text-xs text-muted">মোট প্রশ্ন</p><p style="font-weight:700;">${snapshot.questions.length}</p></div>
        <div><p class="text-xs text-muted">মোট নম্বর</p><p style="font-weight:700;">${exam.totalMarks ?? "—"}</p></div>
        <div><p class="text-xs text-muted">সময়কাল</p><p style="font-weight:700;">${exam.durationMinutes} মিনিট</p></div>
        <div><p class="text-xs text-muted">তারিখ / সময়</p><p style="font-weight:700;">${dateStr} • ${exam.informationalTime || "—"}</p></div>
      </div>
      ${subjNames ? `<p class="text-xs text-muted mt-3">বিষয়: <span style="color:var(--text-secondary);">${subjNames}</span></p>` : ""}
      ${chapNames ? `<p class="text-xs text-muted mt-2">অধ্যায়: <span style="color:var(--text-secondary);">${chapNames}</span></p>` : ""}
    </div>

    <div class="glass card mt-4">
      <p class="text-sm" style="font-weight:600;">মনে রাখুন:</p>
      <ul class="text-xs text-muted mt-2" style="padding-right:16px;line-height:1.9;">
        <li>শুরু করার মুহূর্ত থেকেই সময় গণনা শুরু হবে — নির্ধারিত সময়ের সাথে এর সম্পর্ক নেই।</li>
        <li>সময় শেষ হলে পরীক্ষাটি স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।</li>
        <li>জমা দেওয়ার পর কোনো উত্তর পরিবর্তন করা যাবে না।</li>
      </ul>
    </div>

    <button class="btn btn-primary mt-4" id="startBtn">পরীক্ষা শুরু করুন</button>
  `;

  document.getElementById("startBtn").addEventListener("click", async () => {
    const btn = document.getElementById("startBtn");
    btn.disabled = true;
    btn.textContent = "শুরু করা হচ্ছে...";
    attemptState = await getOrStartAttempt(examId, student.studentId, exam.durationMinutes);
    attemptState.questionTimes = attemptState.questionTimes || {};
    attemptState.markedForReview = attemptState.markedForReview || {};
    renderExamShell();
    startTimer();
  });
}

function renderExamShell() {
  shell.innerHTML = `
    <div class="topbar" style="justify-content:flex-end;">
      <span id="timerDisplay">--:--</span>
    </div>

    <div class="glass card">
      <div class="flex justify-between items-center">
        <p class="eyebrow" id="qCounter">প্রশ্ন ১ / ${snapshot.questions.length}</p>
        <button class="icon-btn" id="paletteBtn">${icons.layers}</button>
      </div>
      <div class="exam-progress-track mt-2"><div class="exam-progress-fill" id="progressFill" style="width:0%;"></div></div>
      <p class="text-xs text-muted mt-1" id="progressLabel"></p>
      <div id="questionBody" class="mt-3"></div>
    </div>

    <div class="flex gap-2 mt-4">
      <button class="btn btn-secondary" id="prevBtn">${icons.arrowLeft} পূর্ববর্তী</button>
      <button class="btn btn-primary" id="nextBtn">পরবর্তী ${icons.arrowRight}</button>
    </div>

    <button class="btn btn-danger mt-4" id="submitBtn">পরীক্ষা জমা দিন</button>

    <div id="paletteOverlay" class="modal-overlay hidden">
      <div class="glass card" style="max-width:360px;width:100%;max-height:80vh;overflow-y:auto;">
        <div class="flex justify-between items-center">
          <p class="eyebrow">প্রশ্ন তালিকা</p>
          <button class="icon-btn" id="closePaletteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="palette-grid mt-3" id="paletteGrid"></div>
        <div class="flex gap-3 mt-3 text-xs text-muted" style="flex-wrap:wrap;">
          <span><span class="palette-cell answered" style="display:inline-flex;width:16px;height:16px;vertical-align:middle;"></span> উত্তরিত</span>
          <span><span class="palette-cell" style="display:inline-flex;width:16px;height:16px;vertical-align:middle;"></span> অনুত্তরিত</span>
          <span><span class="palette-cell marked" style="display:inline-flex;width:16px;height:16px;vertical-align:middle;"></span> চিহ্নিত</span>
        </div>
      </div>
    </div>

    <div id="submitModal" class="modal-overlay hidden">
      <div class="glass card" style="max-width:360px;">
        <p style="font-weight:700;">পরীক্ষা জমা দেওয়ার পরে কোনো উত্তর পরিবর্তন করা যাবে না। আপনি কি নিশ্চিত?</p>
        <div class="flex gap-2 mt-4">
          <button class="btn btn-secondary" id="cancelSubmitBtn">ফিরে যান</button>
          <button class="btn btn-danger" id="confirmSubmitBtn">চূড়ান্তভাবে জমা দিন</button>
        </div>
      </div>
    </div>

    <div id="figurePreviewModal" class="hidden" style="position:fixed;inset:0;background:rgba(10,14,26,0.9);align-items:center;justify-content:center;z-index:400;padding:20px;cursor:zoom-out;">
      <img id="figurePreviewImg" style="max-width:100%;max-height:100%;border-radius:var(--radius-sm);">
    </div>
  `;

  document.getElementById("prevBtn").addEventListener("click", () => navigate(-1));
  document.getElementById("nextBtn").addEventListener("click", () => navigate(1));
  document.getElementById("paletteBtn").addEventListener("click", openPalette);
  document.getElementById("closePaletteBtn").addEventListener("click", closePalette);
  document.getElementById("submitBtn").addEventListener("click", () => document.getElementById("submitModal").classList.remove("hidden"));
  document.getElementById("cancelSubmitBtn").addEventListener("click", () => document.getElementById("submitModal").classList.add("hidden"));
  document.getElementById("confirmSubmitBtn").addEventListener("click", () => doSubmit(false));
  document.getElementById("figurePreviewModal").addEventListener("click", closeFigurePreview);

  window.addEventListener("online", handleConnChange);
  window.addEventListener("offline", handleConnChange);
  if (!examInProgress) {
    examInProgress = true;
    window.addEventListener("beforeunload", leaveGuard);
  }
  questionStartMillis = Date.now();

  renderQuestion();
}

function leaveGuard(e) {
  if (!examInProgress) return;
  e.preventDefault();
  e.returnValue = "";
}

// No persistent badge anymore (it was eating topbar space) — just a
// quick toast so the student still knows their answers are being saved
// on-device when the connection drops.
function handleConnChange() {
  if (navigator.onLine) {
    showToast("অনলাইনে সংযুক্ত হয়েছে।", "error");
  } else {
    showToast("অফলাইন — উত্তর ডিভাইসে সংরক্ষিত হচ্ছে।", "error");
  }
}
function renderQuestion() {
  const idx = attemptState.currentIndex;
  const q = snapshot.questions[idx];
  document.getElementById("qCounter").textContent = `প্রশ্ন ${idx + 1} / ${snapshot.questions.length}`;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === snapshot.questions.length - 1;

  const answeredCount = Object.keys(attemptState.answers).length;
  document.getElementById("progressFill").style.width = `${Math.round((answeredCount / snapshot.questions.length) * 100)}%`;
  document.getElementById("progressLabel").textContent = `${answeredCount} / ${snapshot.questions.length} টি প্রশ্নের উত্তর দেওয়া হয়েছে`;

  const selected = attemptState.answers[q.questionId];
  const isMarked = !!attemptState.markedForReview[q.questionId];
  const body = document.getElementById("questionBody");
  body.classList.remove("q-enter");
  void body.offsetWidth; // restart animation
  body.classList.add("q-enter");
  body.innerHTML = `
    <p class="lang-en" style="font-weight:600;">${q.question_en}</p>
    <p class="mt-2" style="font-weight:700;font-size:1.02rem;">${q.question_bn}</p>
    ${q.imageUrl ? `<img src="${q.imageUrl}" class="q-figure" style="max-width:100%;max-height:220px;display:block;margin:12px auto 0;border-radius:var(--radius-sm);cursor:zoom-in;" onerror="this.classList.add('img-broken');this.alt='ছবি লোড করা যায়নি';">` : ""}
    <div class="mt-4">
      ${["A", "B", "C", "D"].map(letter => `
        <button class="option-card ${selected === letter ? "selected" : ""}" data-letter="${letter}">
          <span class="option-letter">${letter}</span>
          <span style="flex:1;">${q.options_bn[letter]}</span>
        </button>
      `).join("")}
    </div>
    <button type="button" class="review-toggle ${isMarked ? "active" : ""}" id="markReviewBtn">
      ${isMarked ? "★ পর্যালোচনার জন্য চিহ্নিত" : "☆ পর্যালোচনার জন্য চিহ্নিত করুন"}
    </button>
  `;

  body.querySelectorAll(".option-card").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(q.questionId, btn.dataset.letter));
  });
  document.getElementById("markReviewBtn").addEventListener("click", () => toggleMarkForReview(q.questionId));

  const figure = body.querySelector(".q-figure");
  if (figure) figure.addEventListener("click", () => openFigurePreview(q.imageUrl));
}

function openFigurePreview(url) {
  const modal = document.getElementById("figurePreviewModal");
  const modalImg = document.getElementById("figurePreviewImg");
  modalImg.src = url;
  modal.style.display = "flex";
  modal.classList.remove("hidden");
}
function closeFigurePreview() {
  const modal = document.getElementById("figurePreviewModal");
  modal.classList.add("hidden");
  modal.style.display = "none";
  document.getElementById("figurePreviewImg").src = "";
}

function toggleMarkForReview(questionId) {
  attemptState.markedForReview[questionId] = !attemptState.markedForReview[questionId];
  persistState();
  renderQuestion();
}

function selectAnswer(questionId, letter) {
  attemptState.answers[questionId] = letter;
  persistState();
  renderQuestion();
}

function navigate(delta) {
  const next = attemptState.currentIndex + delta;
  if (next < 0 || next >= snapshot.questions.length) return;
  recordElapsed();
  attemptState.currentIndex = next;
  persistState();
  renderQuestion();
}

function recordElapsed() {
  if (questionStartMillis == null) return;
  const q = snapshot.questions[attemptState.currentIndex];
  const elapsed = Math.round((Date.now() - questionStartMillis) / 1000);
  if (elapsed > 0 && q) {
    attemptState.questionTimes[q.questionId] = (attemptState.questionTimes[q.questionId] || 0) + elapsed;
  }
  questionStartMillis = Date.now();
}

function persistState() {
  saveLocalAttempt(examId, student.studentId, attemptState);
  syncToFirestoreDebounced(examId, student.studentId, {
    answers: attemptState.answers,
    currentIndex: attemptState.currentIndex,
    questionTimes: attemptState.questionTimes,
    markedForReview: attemptState.markedForReview
  });
}

function openPalette() {
  const grid = document.getElementById("paletteGrid");
  grid.innerHTML = snapshot.questions.map((q, i) => {
    const answered = !!attemptState.answers[q.questionId];
    const marked = !!attemptState.markedForReview[q.questionId];
    const isCurrent = i === attemptState.currentIndex;
    return `<button class="palette-cell ${answered ? "answered" : ""} ${marked ? "marked" : ""} ${isCurrent ? "current" : ""}" data-idx="${i}">${i + 1}</button>`;
  }).join("");
  grid.querySelectorAll("[data-idx]").forEach(btn => btn.addEventListener("click", () => {
    recordElapsed();
    attemptState.currentIndex = Number(btn.dataset.idx);
    persistState();
    renderQuestion();
    closePalette();
  }));
  document.getElementById("paletteOverlay").classList.remove("hidden");
}
function closePalette() {
  document.getElementById("paletteOverlay").classList.add("hidden");
}

function startTimer() {
  clearInterval(timerHandle);
  tick();
  timerHandle = setInterval(tick, 1000);
}
function tick() {
  const remaining = attemptState.endAtMillis - Date.now();
  const display = document.getElementById("timerDisplay");
  if (display) {
    display.textContent = formatHms(remaining);
    display.classList.toggle("timer-critical", remaining <= 60 * 1000 && remaining > 0);
    display.classList.toggle("timer-warning", remaining <= 5 * 60 * 1000 && remaining > 60 * 1000);
  }
  if (remaining <= 5 * 60 * 1000 && remaining > 4 * 60 * 1000 && !warned5min) {
    warned5min = true;
    showToast("আর মাত্র ৫ মিনিট বাকি আছে।", "error");
  }
  if (remaining <= 60 * 1000 && remaining > 0 && !warned1min) {
    warned1min = true;
    showToast("আর মাত্র ১ মিনিট বাকি — পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হবে।", "error");
  }
  // Every 30 minutes elapsed, remind the student how much time is left.
  // Skipped once we're inside the final-5-minute stretch — the dedicated
  // 5-min/1-min warnings above already cover that window.
  if (attemptState.startedAtMillis && remaining > 5 * 60 * 1000) {
    const elapsedMinutes = (Date.now() - attemptState.startedAtMillis) / 60000;
    const currentInterval = Math.floor(elapsedMinutes / 30);
    if (currentInterval > lastWarnedInterval && currentInterval >= 1) {
      lastWarnedInterval = currentInterval;
      showToast(`৩০ মিনিট পার হয়ে গেছে — বাকি সময়: ${formatHms(remaining)}`, "error");
    }
  }
  if (remaining <= 0) {
    clearInterval(timerHandle);
    doSubmit(true);
  }
}

let submitting = false;
async function doSubmit(isAutoSubmit) {
  if (submitting) return;
  submitting = true;
  clearInterval(timerHandle);
  recordElapsed();

  const modal = document.getElementById("submitModal");
  if (modal) modal.classList.add("hidden");
  shell.innerHTML = `<div class="state-block"><div class="spinner"></div><p class="text-sm text-muted">${isAutoSubmit ? "সময় শেষ — পরীক্ষা জমা দেওয়া হচ্ছে..." : "জমা দেওয়া হচ্ছে..."}</p></div>`;

  try {
    const result = await submitAttempt({
      examId, studentId: student.studentId, examName: exam.name,
      snapshotQuestions: snapshot.questions,
      answers: attemptState.answers,
      questionTimes: attemptState.questionTimes,
      markedForReview: attemptState.markedForReview,
      startedAtMillis: attemptState.startedAtMillis
    });
    examInProgress = false;
    window.removeEventListener("beforeunload", leaveGuard);
    window.location.href = `../student/result.html?resultId=${result.resultId}&justSubmitted=1`;
  } catch (err) {
    console.error(err);
    submitting = false;
    showToast("জমা দেওয়া যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।", "error");
    renderExamShell();
    startTimer();
  }
}
</script>
</body>
