<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>পরীক্ষা — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/exam-ui.css">
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
</head>
<body class="exam-page" oncontextmenu="return false;">
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, icons, renderState, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { isExamForStudent, examMatchesBatch, examTargetBatch } from "../js/utils/batch-utils.js";
import { getExamById, getExamSnapshot, isExamAvailableNow } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import {
  peekInProgressAttempt, getOrStartAttempt, saveLocalAttempt,
  syncToFirestoreDebounced, extendAttemptTime, useHintOnAttempt, submitAttempt, getExistingResult
} from "../js/utils/attempt-utils.js";
import { formatHms } from "../js/utils/grading-utils.js";
import {
  initExamPage, bindThemeButtons, setEligibleData, introHtml, runShellHtml, questionHtml, hintZoneHtml,
  setQuestionCounter, setProgress, fillPalette, submitMessage
} from "../js/utils/exam-ui.js";
import { STORE_ITEMS, MAX_CARDS_PER_ATTEMPT, MAX_HINT_CARDS_PER_ATTEMPT, getStoreInventory, useStoreItem } from "../js/utils/store-utils.js?v=roomcard1";
import { DIALOGUE_BANK, MINUTE_WARN_LINES } from "../js/utils/voice-dialogue.js";

initTheme();
initExamPage();
const shell = document.getElementById("shell");
const params = new URLSearchParams(window.location.search);
const examId = params.get("examId");
const student = getActiveStudent();

let exam = null;
let snapshot = null;
let attemptState = null;
let timerHandle = null;
let questionStartMillis = null;
let slowQ1Warned = false, slowQ2Warned = false; 
const firedMinuteCheckpoints = new Set(); 
let motivationGiven = false; 
let lastWarnedInterval = 0; 
let examInProgress = false;
const TIME_CARD = STORE_ITEMS.find(i => i.id === "time_extend_card") || STORE_ITEMS[0];
let cardAvailable = 0;
let cardQty = 1;
const HINT_CARD = STORE_ITEMS.find(i => i.id === "hint_card") || null;
let hintCardAvailable = 0;

if (!student) {
  window.location.href = "../index.html";
} else if (!examId) {
  shell.innerHTML = `<div class="state-block"><p class="text-sm">পরীক্ষা শনাক্ত করা যায়নি।</p></div>`;
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) Object.assign(student, fresh); 
    boot();
  });
}

async function boot() {
  shell.innerHTML = `<div class="state-block"><div class="spinner"></div><p class="text-sm text-muted mt-3">পরীক্ষা লোড করা হচ্ছে...</p></div>`;
  try {
    const existingResult = await getExistingResult(examId, student.studentId);
    if (existingResult) {
      window.location.href = `../student/result.html?resultId=${examId}_${student.studentId}`;
      return;
    }

    exam = await getExamById(examId);
    if (!exam) {
      renderState(shell, "error", "এই পরীক্ষাটি এখন উপলব্ধ নয়।"); return;
    }
    // Batch guard: an exam made for another batch can never be opened,
    // not even by typing/pasting its link.
    if (!isExamForStudent(exam, student)) {
      renderState(shell, "error", "এই পরীক্ষাটি আপনার ব্যাচের জন্য নয়।"); return;
    }
    snapshot = await getExamSnapshot(examId);
    if (!snapshot || !snapshot.questions || snapshot.questions.length === 0) {
      renderState(shell, "error", "পরীক্ষার প্রশ্ন এখনো প্রস্তুত হয়নি।"); return;
    }

    // Do not allow a published exam to be opened before its scheduled date
    // or after its 7-day availability window.
    if (!isExamAvailableNow(exam)) {
      renderState(shell, "error", "এই পরীক্ষা এখনো শুরু হয়নি অথবা এর সময়সীমা শেষ হয়ে গেছে।"); return;
    }

    loadEligible(); // fills the "who is eligible" lists in the background

    const resumable = await peekInProgressAttempt(examId, student.studentId);
    if (resumable) {
      attemptState = resumable;
      attemptState.questionTimes = attemptState.questionTimes || {};
      attemptState.markedForReview = attemptState.markedForReview || {};
      attemptState.hintsUsed = attemptState.hintsUsed || {};
      renderExamShell();
      startTimer();
      return;
    }

    if (!["upcoming", "published", "active"].includes(exam.status)) {
      renderState(shell, "error", "এই পরীক্ষাটি এখন উপলব্ধ নয়।"); return;
    }
    renderIntro();
  } catch (err) {
    console.error(err);
    renderState(shell, "error", "পরীক্ষা লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।");
  }
}

// Who can take this exam? Specific student IDs if the admin listed any,
// otherwise everyone in the exam's target batch (same rule as the dashboard).
async function loadEligible() {
  try {
    const all = await getActiveStudents();
    const allowed = exam.allowedStudents || [];
    const target = exam.targetBatch || "all";
    let list, scope;
    if (allowed.length > 0) {
      list = all.filter(s => allowed.includes(s.studentId));
      scope = "নির্বাচিত শিক্ষার্থী";
    } else {
      list = all.filter(s => examMatchesBatch(exam, s.className));
      scope = target === "all" ? "সব শিক্ষার্থী" : `${examTargetBatch(exam)} ব্যাচ`;
    }
    setEligibleData({ students: list.map(s => ({ studentId: s.studentId, name: s.name })), scope, meId: student.studentId });
  } catch (err) {
    console.error(err);
    setEligibleData({ error: true });
  }
}

async function renderIntro() {
  const [subjects, chapters] = await Promise.all([getSubjects(), getChapters()]);
  const subjectMap = buildNameMap(subjects);
  const subjNames = (exam.subjectIds || []).map(id => subjectMap[id]).filter(Boolean).join(", ");
  const dateStr = exam.examDate?.toDate ? exam.examDate.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—";

  shell.innerHTML = introHtml({
    backHref: "../student/dashboard.html",
    title: "পরীক্ষা শুরুর আগে",
    name: exam.name,
    description: exam.description || "",
    stats: [
      { label: "মোট প্রশ্ন", value: snapshot.questions.length },
      { label: "সময়কাল", value: `${exam.durationMinutes} মি` },
      { label: "মোট নম্বর", value: exam.totalMarks ?? "—" }
    ],
    facts: [
      `<strong>তারিখ:</strong> ${dateStr} • ${exam.informationalTime || "—"}`,
      ...(subjNames ? [`<strong>বিষয়:</strong> ${subjNames}`] : [])
    ],
    notes: [
      "শুরু করার মুহূর্ত থেকেই সময় গণনা শুরু হবে।",
      "সময় শেষ হলে পরীক্ষাটি স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।",
      "জমা দেওয়ার পর কোনো উত্তর পরিবর্তন করা যাবে না।",
      "<strong>ছবির ওপর ক্লিক করে জুম করা যাবে। ছবি ডাউনলোড করা সম্পূর্ণ নিষিদ্ধ।</strong>"
    ],
    startLabel: "পরীক্ষা শুরু করুন",
    showEligible: true
  });
  bindThemeButtons(shell);

  document.getElementById("startBtn").addEventListener("click", async () => {
    const btn = document.getElementById("startBtn");
    btn.disabled = true; btn.textContent = "শুরু করা হচ্ছে...";
    attemptState = await getOrStartAttempt(examId, student.studentId, exam.durationMinutes);
    attemptState.questionTimes = attemptState.questionTimes || {};
    attemptState.markedForReview = attemptState.markedForReview || {};
    attemptState.hintsUsed = attemptState.hintsUsed || {};
    renderExamShell();
    startTimer();
  });
}

function renderExamShell() {
  shell.innerHTML = runShellHtml({ name: student.name, photoURL: student.photoURL, total: snapshot.questions.length, showCardBtn: true, showEligible: true });
  bindThemeButtons(shell);

  document.getElementById("prevBtn").addEventListener("click", () => navigate(-1));
  document.getElementById("nextBtn").addEventListener("click", () => navigate(1));
  document.getElementById("paletteBtn").addEventListener("click", openPalette);
  document.getElementById("closePaletteBtn").addEventListener("click", closePalette);
  document.getElementById("submitBtn").addEventListener("click", openSubmitModal);
  document.getElementById("cancelSubmitBtn").addEventListener("click", closeSubmitModal);
  document.getElementById("confirmSubmitBtn").addEventListener("click", () => doSubmit(false));
  document.getElementById("figurePreviewModal").addEventListener("click", closeFigurePreview);
  document.getElementById("useCardBtn").addEventListener("click", openCardModal);
  document.getElementById("closeCardModalBtn").addEventListener("click", closeCardModal);
  document.getElementById("cancelCardBtn").addEventListener("click", closeCardModal);
  document.getElementById("confirmCardBtn").addEventListener("click", confirmUseCard);
  document.getElementById("cardQtyDec").addEventListener("click", () => setCardQty(cardQty - 1));
  document.getElementById("cardQtyInc").addEventListener("click", () => setCardQty(cardQty + 1));
  document.getElementById("cancelHintBtn").addEventListener("click", closeHintModal);
  document.getElementById("confirmHintBtn").addEventListener("click", confirmUseHint);
  document.getElementById("hintModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeHintModal(); });
  // tap on the dimmed backdrop closes a sheet
  document.getElementById("paletteOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closePalette(); });
  document.getElementById("submitModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeSubmitModal(); });
  document.getElementById("cardModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeCardModal(); });

  window.addEventListener("online", handleConnChange);
  window.addEventListener("offline", handleConnChange);
  if (!examInProgress) {
    examInProgress = true;
    window.addEventListener("beforeunload", leaveGuard);
  }
  questionStartMillis = Date.now();
  renderQuestion();
  refreshCardBadge();
}

async function refreshCardBadge() {
  try {
    const inv = await getStoreInventory(student.studentId);
    cardAvailable = inv[TIME_CARD.id]?.available || 0;
    hintCardAvailable = HINT_CARD ? (inv[HINT_CARD.id]?.available || 0) : 0;
  } catch { cardAvailable = 0; hintCardAvailable = 0; }
  const badge = document.getElementById("cardBadge");
  if (badge) {
    badge.textContent = cardAvailable;
    badge.classList.toggle("hidden", cardAvailable <= 0);
  }
  // The hint CTA renders with whatever hintCardAvailable was at question-render
  // time, which is usually 0 (this fetch hasn't resolved yet) — refresh it now
  // that we actually know the count.
  renderHintZone();
}

function cardsLeftThisAttempt() {
  return Math.max(0, MAX_CARDS_PER_ATTEMPT - (attemptState.cardsUsedCount || 0));
}

function setCardQty(next) {
  const cap = Math.min(cardAvailable, cardsLeftThisAttempt());
  cardQty = Math.max(1, Math.min(cap, next));
  document.getElementById("cardQtyValue").textContent = cardQty;
  document.getElementById("cardQtyDec").disabled = cardQty <= 1;
  document.getElementById("cardQtyInc").disabled = cardQty >= cap;
  document.getElementById("cardTotalNote").textContent =
    `মোট +${formatHms(cardQty * TIME_CARD.secondsGranted * 1000)} সময় যোগ হবে। (এই পরীক্ষায় ব্যবহার করা যাবে সর্বোচ্চ ${MAX_CARDS_PER_ATTEMPT}টি — বাকি আছে ${cardsLeftThisAttempt()}টি)`;
}

function openCardModal() {
  if (cardsLeftThisAttempt() <= 0) {
    showToast(`এই পরীক্ষায় সর্বোচ্চ ${MAX_CARDS_PER_ATTEMPT}টি টাইম কার্ড ব্যবহার করা যাবে — সেটা তুমি ইতিমধ্যে ব্যবহার করে ফেলেছো।`, "error");
    return;
  }
  if (cardAvailable <= 0) {
    showToast("তোমার কাছে কোনো টাইম কার্ড নেই। স্টোর থেকে কিনে রাখো।", "error");
    return;
  }
  document.getElementById("cardAvailCount").textContent = cardAvailable;
  document.getElementById("cardPerUnitLabel").textContent = `+${formatHms(TIME_CARD.secondsGranted * 1000)}`;
  document.getElementById("cardModal").querySelector(".ex-timecard")?.classList.remove("used");
  setCardQty(1);
  document.getElementById("cardModal").classList.remove("hidden");
}
function closeCardModal() { document.getElementById("cardModal").classList.add("hidden"); }

function flashTimeAdded(secondsGranted) {
  const timerBox = document.querySelector(".ex-timer");
  const timerEl = document.getElementById("timerDisplay");
  if (!timerBox || !timerEl) return;
  const float = document.createElement("span");
  float.className = "ex-timer-float";
  float.textContent = `+${formatHms(secondsGranted * 1000)}`;
  timerBox.appendChild(float);
  float.addEventListener("animationend", () => float.remove());
  timerEl.classList.remove("time-added");
  void timerEl.offsetWidth; // restart animation if already running
  timerEl.classList.add("time-added");
  timerEl.addEventListener("animationend", () => timerEl.classList.remove("time-added"), { once: true });
}

let usingCard = false;
async function confirmUseCard() {
  if (usingCard) return;
  usingCard = true;
  const btn = document.getElementById("confirmCardBtn");
  btn.disabled = true;
  try {
    const qty = cardQty;
    const { secondsGranted } = await useStoreItem(
      student.studentId, TIME_CARD.id, qty, { examId, examTitle: exam.name }
    );
    attemptState.endAtMillis += secondsGranted * 1000;
    attemptState.cardsUsedCount = (attemptState.cardsUsedCount || 0) + qty;
    saveLocalAttempt(examId, student.studentId, attemptState);
    await extendAttemptTime(examId, student.studentId, attemptState.endAtMillis, attemptState.cardsUsedCount);
    tick();
    showToast(`+${formatHms(secondsGranted * 1000)} সময় যোগ হয়েছে!`, "success");
    flashTimeAdded(secondsGranted);
    document.getElementById("cardModal")?.querySelector(".ex-timecard")?.classList.add("used");
    setTimeout(closeCardModal, 420);
    await refreshCardBadge();
  } catch (err) {
    const map = { NOTHING_TO_USE: "তোমার কাছে এত টাইম কার্ড নেই।" };
    showToast(map[err.message] || "কার্ড ব্যবহার করা যায়নি, আবার চেষ্টা করো।", "error");
  } finally {
    usingCard = false;
    btn.disabled = false;
  }
}

function buildHintData(q) {
  if (!HINT_CARD || !q) return { enabled: false };
  const used = !!attemptState.hintsUsed[q.questionId];
  const leftThisAttempt = Math.max(0, MAX_HINT_CARDS_PER_ATTEMPT - (attemptState.hintCardsUsedCount || 0));
  let subtitle;
  if (hintCardAvailable <= 0) subtitle = "তোমার কাছে কোনো হিন্ট কার্ড নেই — স্টোর থেকে কিনে নাও।";
  else if (leftThisAttempt <= 0) subtitle = `এই পরীক্ষায় সর্বোচ্চ ${MAX_HINT_CARDS_PER_ATTEMPT}টি ব্যবহার করা হয়ে গেছে।`;
  else subtitle = `তোমার কাছে আছে ${hintCardAvailable}টি · এই পরীক্ষায় বাকি আছে ${leftThisAttempt}টি`;
  return {
    enabled: true,
    used,
    canUse: !used && hintCardAvailable > 0 && leftThisAttempt > 0,
    subtitle,
    correctLetter: q.correctAnswer,
    correctText: q.options_bn?.[q.correctAnswer] ?? "",
    explanation: q.explanation_bn || ""
  };
}

function renderHintZone() {
  if (!attemptState) return;
  const q = snapshot?.questions?.[attemptState.currentIndex];
  const zone = document.getElementById("hintZone");
  if (!zone || !q) return;
  zone.innerHTML = hintZoneHtml(buildHintData(q));
  bindHintBtn();
}

function bindHintBtn() {
  const btn = document.getElementById("useHintBtn");
  if (btn) btn.addEventListener("click", openHintModal);
}

function openHintModal() {
  const q = snapshot.questions[attemptState.currentIndex];
  if (!HINT_CARD || !q || attemptState.hintsUsed[q.questionId]) return;
  if (hintCardAvailable <= 0) {
    showToast("তোমার কাছে কোনো হিন্ট কার্ড নেই। স্টোর থেকে কিনে রাখো।", "error");
    return;
  }
  const leftThisAttempt = Math.max(0, MAX_HINT_CARDS_PER_ATTEMPT - (attemptState.hintCardsUsedCount || 0));
  if (leftThisAttempt <= 0) {
    showToast(`এই পরীক্ষায় সর্বোচ্চ ${MAX_HINT_CARDS_PER_ATTEMPT}টি হিন্ট কার্ড ব্যবহার করা যাবে — সেটা তুমি ইতিমধ্যে ব্যবহার করে ফেলেছো।`, "error");
    return;
  }
  document.getElementById("hintModalText").textContent =
    `এই প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা দেখতে ১টি হিন্ট কার্ড খরচ হবে। তোমার কাছে আছে ${hintCardAvailable}টি — এই পরীক্ষায় বাকি আছে ${leftThisAttempt}টি।`;
  document.getElementById("hintModal").classList.remove("hidden");
}
function closeHintModal() { document.getElementById("hintModal").classList.add("hidden"); }

let usingHint = false;
async function confirmUseHint() {
  if (usingHint) return;
  usingHint = true;
  const btn = document.getElementById("confirmHintBtn");
  btn.disabled = true;
  const q = snapshot.questions[attemptState.currentIndex];
  try {
    await useStoreItem(student.studentId, HINT_CARD.id, 1, { examId, examTitle: exam.name });
    attemptState.hintsUsed[q.questionId] = true;
    attemptState.hintCardsUsedCount = (attemptState.hintCardsUsedCount || 0) + 1;
    hintCardAvailable = Math.max(0, hintCardAvailable - 1);
    saveLocalAttempt(examId, student.studentId, attemptState);
    await useHintOnAttempt(examId, student.studentId, attemptState.hintsUsed, attemptState.hintCardsUsedCount);
    closeHintModal();
    renderHintZone();
    showToast("সঠিক উত্তর ও ব্যাখ্যা দেখা যাচ্ছে ✅", "success");
  } catch (err) {
    const map = { NOTHING_TO_USE: "তোমার কাছে এত হিন্ট কার্ড নেই।" };
    showToast(map[err.message] || "হিন্ট কার্ড ব্যবহার করা যায়নি, আবার চেষ্টা করো।", "error");
  } finally {
    usingHint = false;
    btn.disabled = false;
  }
}

function openSubmitModal() {
  const qs = snapshot.questions;
  const unanswered = qs.filter(q => !attemptState.answers[q.questionId]).length;
  const marked = qs.filter(q => attemptState.markedForReview[q.questionId]).length;
  document.getElementById("submitModalText").textContent = submitMessage(unanswered, marked);
  document.getElementById("submitModal").classList.remove("hidden");
}
function closeSubmitModal() { document.getElementById("submitModal").classList.add("hidden"); }

function leaveGuard(e) { if (!examInProgress) return; e.preventDefault(); e.returnValue = ""; }
function handleConnChange() { showToast(navigator.onLine ? "অনলাইনে সংযুক্ত হয়েছে।" : "অফলাইন — উত্তর ডিভাইসে সেভ হচ্ছে।", navigator.onLine ? "success" : "error"); }

function renderQuestion() {
  const idx = attemptState.currentIndex;
  const q = snapshot.questions[idx];
  const total = snapshot.questions.length;
  setQuestionCounter(idx, total);
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === total - 1;
  setProgress(Object.keys(attemptState.answers).length, total);

  const selected = attemptState.answers[q.questionId];
  const isMarked = !!attemptState.markedForReview[q.questionId];

  const body = document.getElementById("questionBody");
  body.classList.remove("q-enter");
  void body.offsetWidth;
  body.classList.add("q-enter");

  body.innerHTML = questionHtml({
    questionBn: q.question_bn ?? q.question_en ?? "",
    questionEn: q.question_en,
    imageUrl: q.imageUrl,
    options: ["A", "B", "C", "D"].map(letter => ({ letter, text: q.options_bn?.[letter] ?? "" })),
    selected, isMarked,
    hint: buildHintData(q)
  });

  body.querySelectorAll(".ex-option").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(q.questionId, btn.dataset.letter));
  });
  document.getElementById("markReviewBtn").addEventListener("click", () => toggleMarkForReview(q.questionId));
  bindHintBtn();
  const shieldBtn = body.querySelector(".img-shield");
  if (shieldBtn) shieldBtn.addEventListener("click", () => openFigurePreview(shieldBtn.dataset.url));

  // MATHJAX DYNAMIC TRIGGER
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch((err) => console.log('MathJax error: ', err));
  }
}

function openFigurePreview(url) {
  const modal = document.getElementById("figurePreviewModal");
  const modalImg = document.getElementById("figurePreviewImg");
  modalImg.src = url;
  modal.classList.remove("hidden");
}
function closeFigurePreview() {
  const modal = document.getElementById("figurePreviewModal");
  modal.classList.add("hidden");
  document.getElementById("figurePreviewImg").src = "";
}

function toggleMarkForReview(questionId) {
  attemptState.markedForReview[questionId] = !attemptState.markedForReview[questionId];
  persistState(); renderQuestion();
}

function selectAnswer(questionId, letter) {
  if (attemptState.answers[questionId] === letter) delete attemptState.answers[questionId];
  else attemptState.answers[questionId] = letter;

  persistState();

  const body = document.getElementById("questionBody");
  const nowSelected = attemptState.answers[questionId];
  body.querySelectorAll(".ex-option").forEach(btn => {
    btn.classList.toggle("selected", btn.dataset.letter === nowSelected);
    btn.classList.remove("option-flash");
  });
  if (nowSelected) {
    const tappedBtn = body.querySelector(`.ex-option[data-letter="${nowSelected}"]`);
    if (tappedBtn) { void tappedBtn.offsetWidth; tappedBtn.classList.add("option-flash"); }
  }
  setProgress(Object.keys(attemptState.answers).length, snapshot.questions.length);
}

function navigate(delta) {
  const next = attemptState.currentIndex + delta;
  if (next < 0 || next >= snapshot.questions.length) return;
  recordElapsed();
  attemptState.currentIndex = next;
  persistState(); renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function recordElapsed() {
  if (questionStartMillis == null) return;
  const q = snapshot.questions[attemptState.currentIndex];
  const elapsed = Math.round((Date.now() - questionStartMillis) / 1000);
  if (elapsed > 0 && q) attemptState.questionTimes[q.questionId] = (attemptState.questionTimes[q.questionId] || 0) + elapsed;
  questionStartMillis = Date.now();
  slowQ1Warned = false; slowQ2Warned = false;
}

function persistState() {
  saveLocalAttempt(examId, student.studentId, attemptState);
  syncToFirestoreDebounced(examId, student.studentId, {
    answers: attemptState.answers, currentIndex: attemptState.currentIndex,
    questionTimes: attemptState.questionTimes, markedForReview: attemptState.markedForReview
  });
}

function openPalette() {
  fillPalette(snapshot.questions.map((q, i) => ({
    answered: !!attemptState.answers[q.questionId],
    marked: !!attemptState.markedForReview[q.questionId],
    current: i === attemptState.currentIndex
  })));
  document.getElementById("paletteGrid").querySelectorAll("[data-idx]").forEach(btn => btn.addEventListener("click", () => {
    recordElapsed(); attemptState.currentIndex = Number(btn.dataset.idx);
    persistState(); renderQuestion(); closePalette();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  document.getElementById("paletteOverlay").classList.remove("hidden");
}
function closePalette() { document.getElementById("paletteOverlay").classList.add("hidden"); }

// --- Exam voice: pre-recorded audio first, browser TTS as fallback -----
// DIALOGUE_BANK / MINUTE_WARN_LINES (imported above) are the single source
// of truth for every line the voice system can say. Each line has a
// matching pre-recorded file at assets/audio/voice/<key>-<index>.wav,
// generated once via admin/voice-generator.html (natural Gemini TTS voice,
// no per-exam API calls). If a file is missing or fails to load, we fall
// back to the browser's own (robotic but always-available) speechSynthesis
// so the timer/motivation announcements never go silent.
const VOICE_AUDIO_BASE = "../assets/audio/voice/";
let currentVoiceAudio = null;

let cachedBengaliVoice = null;
function pickBengaliVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const bn = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("bn"));
  if (!bn.length) return null;
  const score = (v) => (/google/i.test(v.name) ? 2 : 0) + (v.localService === false ? 1 : 0) + (/bn-in|bn-bd/i.test(v.lang) ? 1 : 0);
  return bn.slice().sort((a, b) => score(b) - score(a))[0];
}
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener("voiceschanged", () => { cachedBengaliVoice = pickBengaliVoice(); });
}
function speakFallback(text) {
  if (!("speechSynthesis" in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "bn-BD"; utter.rate = 0.95;
    const voice = cachedBengaliVoice || pickBengaliVoice();
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  } catch (e) { }
}

// Plays the pre-recorded file for {key, index}; falls back to speechSynthesis
// (using `text`) if the file is missing/blocked/fails to load.
function playVoiceFile(key, index, text) {
  try {
    if (currentVoiceAudio) { currentVoiceAudio.pause(); currentVoiceAudio = null; }
    const audio = new Audio(`${VOICE_AUDIO_BASE}${key}-${index}.wav`);
    currentVoiceAudio = audio;
    let fellBack = false;
    const fallbackOnce = () => { if (fellBack) return; fellBack = true; speakFallback(text); };
    audio.addEventListener("error", fallbackOnce);
    audio.play().catch(fallbackOnce);
  } catch (e) { speakFallback(text); }
}

// Multiple lines per situation so the same line doesn't repeat every exam;
// picked at random (never the same line twice in a row for that situation).
const lastDialogueIndex = {};
function pickDialogue(key) {
  const arr = DIALOGUE_BANK[key];
  if (!arr || !arr.length) return null;
  let idx = arr.length === 1 ? 0 : Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && idx === lastDialogueIndex[key]) idx = (idx + 1) % arr.length;
  lastDialogueIndex[key] = idx;
  return { text: arr[idx], index: idx };
}

// Speaks a random variant of a DIALOGUE_BANK situation (e.g. "slow1").
function speakDialogue(key) {
  const picked = pickDialogue(key);
  if (!picked) return;
  playVoiceFile(key, picked.index, picked.text);
}
// Speaks a fixed single-line entry (e.g. MINUTE_WARN_LINES.minuteWarn20).
function speakFixed(key) {
  const arr = MINUTE_WARN_LINES[key];
  if (!arr || !arr.length) return;
  playVoiceFile(key, 0, arr[0]);
}

function startTimer() { clearInterval(timerHandle); tick(); timerHandle = setInterval(tick, 1000); }
function tick() {
  const remaining = attemptState.endAtMillis - Date.now();
  const display = document.getElementById("timerDisplay");
  if (display) {
    display.textContent = formatHms(remaining);
    display.classList.toggle("timer-critical", remaining <= 60 * 1000 && remaining > 0);
    display.classList.toggle("timer-warning", remaining <= 5 * 60 * 1000 && remaining > 60 * 1000);
  }

  // Timer's in the last minute and the student still has a usable Time
  // Card -- nudge the card button so they notice it in time.
  const cardBtn = document.getElementById("useCardBtn");
  if (cardBtn) {
    const canNudge = remaining <= 60 * 1000 && remaining > 0
      && cardAvailable > 0 && cardsLeftThisAttempt() > 0;
    cardBtn.classList.toggle("card-nudge", canNudge);
  }
  
  const totalMinutes = exam?.durationMinutes || 0;
  const remainingMinutes = remaining / 60000;
  [20, 10, 5, 1].filter(m => m < totalMinutes).forEach(m => {
    if (remainingMinutes <= m && remainingMinutes > m - 1 && !firedMinuteCheckpoints.has(m)) {
      firedMinuteCheckpoints.add(m);
      if (m === 1) { showToast("আর মাত্র ১ মিনিট বাকি — সময় শেষ হলে উত্তর স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।", "error"); speakDialogue("minuteFinal"); }
      else { showToast(`আর মাত্র ${m} মিনিট বাকি আছে।`, "error"); speakFixed(`minuteWarn${m}`); }
    }
  });

  if (!motivationGiven && attemptState.startedAtMillis && totalMinutes > 0) {
    const elapsedMinutes = (Date.now() - attemptState.startedAtMillis) / 60000;
    if (elapsedMinutes >= totalMinutes / 2) {
      motivationGiven = true;
      const answeredCount = Object.keys(attemptState.answers).length;
      const progressRatio = snapshot.questions.length ? answeredCount / snapshot.questions.length : 0;
      const paceRatio = Math.min(1, elapsedMinutes / totalMinutes);
      speakDialogue(progressRatio >= paceRatio * 0.7 ? "halfwayGood" : "halfwaySlow");
    }
  }

  if (questionStartMillis != null) {
    const currentQ = snapshot.questions[attemptState.currentIndex];
    const alreadyAnswered = currentQ && attemptState.answers[currentQ.questionId];
    if (currentQ && !alreadyAnswered) {
      const qElapsedSec = (Date.now() - questionStartMillis) / 1000;
      if (qElapsedSec >= 60 && !slowQ1Warned) { slowQ1Warned = true; speakDialogue("slow1"); }
      if (qElapsedSec >= 120 && !slowQ2Warned) { slowQ2Warned = true; speakDialogue("slow2"); }
    }
  }

  if (attemptState.startedAtMillis && remaining > 5 * 60 * 1000) {
    const elapsedMinutes = (Date.now() - attemptState.startedAtMillis) / 60000;
    const currentInterval = Math.floor(elapsedMinutes / 30);
    if (currentInterval > lastWarnedInterval && currentInterval >= 1) { lastWarnedInterval = currentInterval; showToast(`৩০ মিনিট পার হয়ে গেছে — বাকি সময়: ${formatHms(remaining)}`, "error"); }
  }
  if (remaining <= 0) { clearInterval(timerHandle); doSubmit(true); }
}

let submitting = false;
async function doSubmit(isAutoSubmit) {
  if (submitting) return;
  submitting = true; clearInterval(timerHandle); recordElapsed();

  const modal = document.getElementById("submitModal");
  if (modal) modal.classList.add("hidden");
  shell.innerHTML = `<div class="state-block"><div class="spinner"></div><p class="text-sm text-muted mt-3" style="font-weight:800;">${isAutoSubmit ? "সময় শেষ — পরীক্ষা জমা দেওয়া হচ্ছে..." : "জমা দেওয়া হচ্ছে..."}</p></div>`;

  try {
    const result = await submitAttempt({
      examId, studentId: student.studentId, examName: exam.name,
      snapshotQuestions: snapshot.questions, answers: attemptState.answers,
      questionTimes: attemptState.questionTimes, markedForReview: attemptState.markedForReview,
      startedAtMillis: attemptState.startedAtMillis
    });
    examInProgress = false; window.removeEventListener("beforeunload", leaveGuard);
    window.location.href = `../student/result.html?resultId=${result.resultId}&justSubmitted=1`;
  } catch (err) {
    console.error(err); submitting = false;
    showToast("জমা দেওয়া যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।", "error");
    renderExamShell(); startTimer();
  }
}
</script>
