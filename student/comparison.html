<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিস্তারিত তুলনা — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 600px; padding-bottom: 40px; margin: 0 auto; }

  /* ===== Premium Glass Cards ===== */
  .glass-card {
    background: var(--surface); border: 1px solid var(--surface-border);
    border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .card-title { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); }

  /* ===== Leaderboard Row ===== */
  .leaderboard-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: rgba(128,128,128,0.03); border: 1px solid var(--surface-border); border-radius: 16px; margin-bottom: 10px; }
  .rank-badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.1); color: var(--text-secondary); font-weight: 900; font-size: 0.9rem; flex-shrink: 0; }
  
  .st-info { flex: 1; min-width: 0; }
  .st-name { font-weight: 800; font-size: 1rem; color: var(--text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .st-points { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
  .pts-val { color: var(--color-accent); font-weight: 900; font-size: 0.95rem; font-family: var(--font-num); }

  /* ===== Circular Progress Matches Image ===== */
  .scroll-row { display: flex; gap: 16px; overflow-x: auto; padding: 4px 0 12px 0; scrollbar-width: none; }
  .scroll-row::-webkit-scrollbar { display: none; }

  .circ-wrapper { 
    display: flex; flex-direction: column; align-items: center; width: 72px; flex-shrink: 0; 
    padding: 10px 6px; border-radius: 12px; border: 1.5px solid transparent; 
  }
  .circ-wrapper.is-me { 
    border-color: var(--color-accent); border-style: dashed;
    background: rgba(128, 128, 128, 0.03); 
  }
  .circ-wrapper.is-me .circ-name { color: var(--color-accent); font-weight: 800; }
  
  .circ-chart { display: block; margin: 0 auto; }
  .circ-bg { fill: none; stroke: rgba(128,128,128,0.15); stroke-width: 3; }
  .circ-fill { fill: none; stroke-linecap: round; stroke-width: 3.5; animation: fillup 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .circ-text { font-family: var(--font-num); font-size: 8.5px; font-weight: 900; fill: var(--text-primary); text-anchor: middle; dominant-baseline: central; }
  @keyframes fillup { from { stroke-dasharray: 0, 100; } }

  .circ-name { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-top: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .circ-pts { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-align: center; margin-top: 2px; font-family: var(--font-num); }

  /* ===== Page Header ===== */
  .vs-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(128,128,128,0.04); border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--surface-border); }
  .batch-title { font-size: 0.95rem; font-weight: 800; color: var(--text-secondary); }
  .batch-name { color: var(--color-accent); font-weight: 900; }
  
  .section-label { font-size: 1rem; font-weight: 900; color: var(--text-primary); margin: 24px 0 12px 4px; padding-bottom: 8px; border-bottom: 2px dashed var(--surface-border); display:inline-block; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { getApprovedResults, getLeaderboardData } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeStudentSummary, mergeStatsForDisplay } from "../js/utils/comparison-utils.js";

initTheme();
const shell = document.getElementById("shell");
const student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  renderPage();
}

const COLORS = ["var(--color-accent)", "#3b82f6", "#a855f7", "#10b981", "#f59e0b", "#f43f5e", "#06b6d4"];

function drawCircleCard(pct, color, name, points, isMe) {
  const p = isNaN(pct) || pct === null ? 0 : Math.round(pct);
  const c = pct === null ? "rgba(128,128,128,0.2)" : color;
  const textVal = pct === null ? "—" : `${p}%`;
  
  return `
    <div class="circ-wrapper ${isMe ? 'is-me' : ''}">
      <svg viewBox="0 0 36 36" class="circ-chart" style="width:52px; height:52px;">
        <path class="circ-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        <path class="circ-fill" stroke="${c}" stroke-dasharray="${p}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        <text x="18" y="18" class="circ-text">${textVal}</text>
      </svg>
      <div class="circ-name">${name}</div>
      <div class="circ-pts">${points} pts</div>
    </div>
  `;
}

function drawMiniCircle(pct, color) {
  const p = isNaN(pct) || pct === null ? 0 : Math.round(pct);
  const c = pct === null ? "rgba(128,128,128,0.2)" : color;
  return `
    <svg viewBox="0 0 36 36" class="circ-chart" style="width:42px; height:42px;">
      <path class="circ-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
      <path class="circ-fill" stroke="${c}" stroke-dasharray="${p}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
      <text x="18" y="18" class="circ-text">${pct === null ? "—" : p+"%"}</text>
    </svg>
  `;
}

async function renderPage() {
  const myBatch = student.className || "অজানা ব্যাচ";

  shell.innerHTML = `
    ${renderStudentHeader(student, "dashboard")}
    <div id="body" class="mt-4"><div class="spinner" style="margin:40px auto;"></div></div>
  `;

  const body = document.getElementById("body");

  try {
    let allStudents = await getActiveStudents();
    let batchStudents = allStudents.filter(s => (s.className || "অজানা ব্যাচ") === myBatch);
    
    if (batchStudents.length < 2) {
      renderState(body, "empty", "আপনার ব্যাচে তুলনার জন্য অন্য কোনো শিক্ষার্থী নেই।"); return;
    }

    // Fetch EXACT points from Leaderboard Logic
    const leaderboardData = await getLeaderboardData(batchStudents);
    const pointsMap = {};
    leaderboardData.forEach(l => {
      pointsMap[l.studentId] = l.totalPoints || 0;
    });

    const [subjects, chapters, topics] = await Promise.all([getSubjects(), getChapters(), getTopics()]);
    const subjectMap = buildNameMap(subjects), chapterMap = buildNameMap(chapters), topicMap = buildNameMap(topics);

    const summaries = await Promise.all(batchStudents.map(async s => {
      const results = await getApprovedResults(s.studentId);
      const summary = computeStudentSummary(s, results, subjectMap, chapterMap, topicMap);
      
      // Map Real Points
      summary.actualPoints = pointsMap[s.studentId] || 0;
      return summary;
    }));

    if (summaries.every(s => !s.hasData)) {
      renderState(body, "empty", "তুলনার জন্য এখনো পর্যাপ্ত ফলাফল পাওয়া যায়নি।"); return;
    }

    renderDetailedView(body, summaries, myBatch);

  } catch (err) {
    console.error(err);
    renderState(body, "error", "ডেটা লোড করতে সমস্যা হয়েছে।");
  }
}

function renderDetailedView(body, summaries, batchName) {
  // Sort by Actual Points Descending
  summaries.sort((a, b) => (b.actualPoints || 0) - (a.actualPoints || 0));

  // DB Schema:
  // subjectStats = Batch level
  // chapterStats = Subject level (e.g. Mathematics, Life Science)
  // topicStats = Topic level (e.g. Chapters inside subjects)
  
  const mergedSubjects = mergeStatsForDisplay(summaries, "chapterStats", "chapterId");
  const mergedTopics = mergeStatsForDisplay(summaries, "topicStats", "topicId");

  // --- Leaderboard Section ---
  const leaderboardRows = summaries.map((s, idx) => {
    const isMe = s.studentId === student.studentId;
    const color = isMe ? 'var(--color-accent)' : COLORS[(idx) % COLORS.length];
    
    return `
      <div class="leaderboard-row" style="${isMe ? 'border-color:var(--color-accent);' : ''}">
        <div class="rank-badge">#${idx + 1}</div>
        <div class="st-info">
          <div class="st-name">${s.name.split(" ")[0]} ${isMe ? '<span style="font-size:0.65rem; background:rgba(16, 185, 129, 0.15); color:#10b981; padding:2px 6px; border-radius:6px; font-weight:800;">আপনি</span>' : ''}</div>
          <div class="st-points">মোট পয়েন্ট: <span class="pts-val">${s.actualPoints}</span></div>
        </div>
        <div>${drawMiniCircle(s.avgPercentage, color)}</div>
      </div>
    `;
  }).join("");

  // --- Subject Wise Section (ChapterStats from DB) ---
  const subjectHtml = mergedSubjects.map(subRow => {
    const circles = summaries.map((s, idx) => {
      const isMe = s.studentId === student.studentId;
      const val = subRow[s.studentId];
      const color = isMe ? 'var(--color-accent)' : COLORS[(idx) % COLORS.length];
      return drawCircleCard(val, color, isMe ? "আপনি" : s.name.split(" ")[0], `${s.actualPoints} pts`, isMe);
    }).join("");

    return `
      <div class="glass-card">
        <div class="card-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          <span class="card-title">${subRow.name}</span>
        </div>
        <div class="scroll-row">
          ${circles}
        </div>
      </div>
    `;
  }).join("");

  // --- Topic/Chapter Wise Section (TopicStats from DB) ---
  const topicHtml = mergedTopics.filter(t => summaries.some(s => t[s.studentId] !== null && t[s.studentId] !== undefined)).map(topicRow => {
    const circles = summaries.map((s, idx) => {
      const isMe = s.studentId === student.studentId;
      const val = topicRow[s.studentId];
      const color = isMe ? 'var(--color-accent)' : COLORS[(idx) % COLORS.length];
      return drawCircleCard(val, color, isMe ? "আপনি" : s.name.split(" ")[0], `${s.actualPoints} pts`, isMe);
    }).join("");

    return `
      <div class="glass-card">
        <div class="card-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="card-title" style="font-size:0.95rem;">${topicRow.name}</span>
        </div>
        <div class="scroll-row">
          ${circles}
        </div>
      </div>
    `;
  }).join("");

  body.innerHTML = `
    <div class="vs-header">
      <span class="batch-title">ব্যাচ: <span class="batch-name">${batchName}</span></span>
      <span style="font-size:0.8rem; font-weight:800; color:var(--text-muted); background:rgba(128,128,128,0.1); padding:4px 10px; border-radius:99px;">${summaries.length} জন শিক্ষার্থী</span>
    </div>
    
    <div class="section-label">ওভারঅল লিডারবোর্ড</div>
    <div class="glass-card" style="padding:16px;">
      ${leaderboardRows}
    </div>

    <div class="section-label">বিষয়ভিত্তিক তুলনা</div>
    ${subjectHtml || `<div class="glass-card text-center text-sm text-muted font-bold">পর্যাপ্ত ডেটা নেই।</div>`}

    <div class="section-label">অধ্যায়/টপিকভিত্তিক তুলনা</div>
    ${topicHtml || `<div class="glass-card text-center text-sm text-muted font-bold">কোনো টপিকের ডেটা পাওয়া যায়নি।</div>`}
  `;
}
</script>
</body>
</html>
