<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিস্তারিত তুলনা — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 650px; padding-bottom: 48px; margin: 0 auto; }

  /* ---------- entrance / reveal ---------- */
  .cx-rv { opacity: 0; transform: translateY(16px); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1); transition-delay: calc(var(--i, 0) * 60ms); }
  .cx-rv.in { opacity: 1; transform: none; }

  /* ---------- top strip ---------- */
  .cx-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 2px 14px; }
  .cx-strip b { color: var(--color-accent); font-weight: 900; }
  .cx-strip span { font-size: .8rem; font-weight: 800; color: var(--text-secondary); }
  .cx-pill { font-size: .72rem; font-weight: 800; color: var(--text-muted); background: var(--surface-edge); padding: 4px 11px; border-radius: 99px; }

  /* ---------- head-to-head hero ---------- */
  .cx-hero { position: relative; overflow: hidden; border-radius: var(--radius-lg, 22px); padding: 18px 16px 16px; color: #f3f1ea; background: #21262f; }
  .cx-hero::before { content: ""; position: absolute; width: 260px; height: 260px; left: 50%; top: -120px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(var(--color-accent-rgb), .28), transparent 70%); animation: cxGlow 4s ease-in-out infinite; pointer-events: none; }
  .cx-hero > * { position: relative; }
  .cx-hero-label { text-align: center; font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: rgba(243,241,234,.6); }
  .cx-duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 12px; }
  .cx-side { text-align: center; min-width: 0; }
  .cx-av { width: 62px; height: 62px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.5rem; color: #fff; overflow: hidden;
    border: 3px solid rgba(255,255,255,.18); box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .cx-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cx-side.me .cx-av { animation: cxSlideL .7s cubic-bezier(.2,1.1,.3,1) both; }
  .cx-side.rv .cx-av { animation: cxSlideR .7s cubic-bezier(.2,1.1,.3,1) both; }
  .cx-sname { font-size: .9rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-sxp { font-family: var(--font-num); font-size: 1.55rem; font-weight: 900; line-height: 1.15; margin-top: 4px; }
  .cx-side.me .cx-sxp { color: var(--color-accent); }
  .cx-sxp small { font-size: .62rem; font-weight: 800; margin-left: 2px; color: rgba(243,241,234,.55); }
  .cx-savg { font-size: .72rem; font-weight: 700; color: rgba(243,241,234,.65); margin-top: 2px; }
  .cx-vs { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .8rem; color: #21262f;
    background: var(--color-accent); box-shadow: 0 0 0 6px rgba(var(--color-accent-rgb), .18); animation: cxVs 2.2s ease-in-out infinite; }
  .cx-tug { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 16px; background: rgba(255,255,255,.1); }
  .cx-tug i { display: block; height: 100%; width: 0; transition: width 1.1s cubic-bezier(.2,.9,.3,1) .2s; }
  .cx-tug i:first-child { background: var(--color-accent); }
  .cx-tug i:last-child { background: #6f8fb3; }
  .cx-verdict { text-align: center; margin: 12px 0 0; font-size: .86rem; font-weight: 800; line-height: 1.5; }
  .cx-verdict.up { color: #7fd1a8; } .cx-verdict.down { color: #f0a090; }

  /* ---------- rival chips ---------- */
  .cx-riv { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
  .cx-riv::-webkit-scrollbar { display: none; }
  .cx-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border-radius: 99px; border: 1px solid var(--surface-border);
    background: var(--surface-solid); color: var(--text-secondary); font: inherit; font-size: .78rem; font-weight: 800; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
  .cx-chip:active { transform: scale(.96); }
  .cx-chip .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 900; color: #fff; overflow: hidden; }
  .cx-chip .dot img { width: 100%; height: 100%; object-fit: cover; }
  .cx-chip.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; box-shadow: 0 8px 18px rgba(var(--color-accent-rgb), .3); }

  /* ---------- insight cards ---------- */
  .cx-ins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .cx-in { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: 16px; padding: 12px 10px; text-align: center; min-width: 0; }
  .cx-in svg { color: var(--color-accent); }
  .cx-in p { margin: 6px 0 0; font-size: .66rem; font-weight: 800; color: var(--text-muted); }
  .cx-in b { display: block; margin-top: 3px; font-size: .84rem; font-weight: 900; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-in em { display: block; font-style: normal; font-family: var(--font-num); font-size: .78rem; font-weight: 900; margin-top: 1px; }
  .cx-in.good em { color: var(--color-success); } .cx-in.bad em { color: var(--color-danger); } .cx-in.acc em { color: var(--color-accent); }

  /* ---------- radar ---------- */
  .cx-card { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: 20px; padding: 16px; margin-top: 14px; box-shadow: var(--shadow-soft); }
  .cx-card h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .cx-card h3 svg { color: var(--color-accent); }
  .cx-sub { margin: 0 0 6px; font-size: .74rem; font-weight: 700; color: var(--text-muted); }
  .cx-legend { display: flex; gap: 14px; justify-content: center; font-size: .74rem; font-weight: 800; color: var(--text-secondary); margin-top: 4px; }
  .cx-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .cx-radar { display: block; width: 100%; max-width: 340px; margin: 0 auto; overflow: visible; }
  .cx-radar .ring { fill: none; stroke: var(--surface-border); stroke-width: 1; }
  .cx-radar .axis { stroke: var(--surface-border); stroke-width: 1; }
  .cx-radar .lbl { font-size: 9.5px; font-weight: 800; fill: var(--text-secondary); }
  .cx-radar .shape { transform-box: view-box; transform-origin: 50% 50%; animation: cxRadar 1s cubic-bezier(.2,.9,.3,1) both; }
  .cx-radar .shape.b { animation-delay: .25s; }
  .cx-empty { text-align: center; font-size: .8rem; font-weight: 700; color: var(--text-muted); padding: 14px 0; }

  /* ---------- tabs ---------- */
  .cx-tabs { position: sticky; top: 8px; z-index: 5; margin: 18px 0 14px; }
  .cx-seg { position: relative; display: flex; gap: 3px; padding: 3px; border-radius: 14px; background: var(--surface-edge); box-shadow: var(--shadow-soft); }
  .cx-seg button { position: relative; z-index: 1; flex: 1; padding: 10px 4px; border: 0; border-radius: 11px; background: transparent; color: var(--text-secondary); font: inherit; font-size: .84rem; font-weight: 800; cursor: pointer; transition: color .25s; }
  .cx-seg button.on { color: var(--text-primary); }
  .cx-thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 12px) / 3); border-radius: 11px; background: var(--surface-solid); box-shadow: var(--shadow-soft); transition: transform .35s cubic-bezier(.3,1.2,.4,1); }

  /* ---------- podium ---------- */
  .cx-pod { display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding: 6px 4px 0; }
  .cx-pcol { flex: 1; max-width: 120px; text-align: center; min-width: 0; }
  .cx-pcol .cx-av { width: 46px; height: 46px; font-size: 1.1rem; border-width: 2px; margin-bottom: 6px; }
  .cx-pcol.first .cx-av { width: 58px; height: 58px; font-size: 1.4rem; border-color: #d4a73c; }
  .cx-pn { font-size: .8rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-pp { font-family: var(--font-num); font-size: .78rem; font-weight: 800; color: var(--color-accent); margin-bottom: 6px; }
  .cx-block { border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: 8px; font-family: var(--font-num); font-weight: 900; font-size: 1.3rem; color: #fff;
    height: 0; transition: height .9s cubic-bezier(.2,.9,.3,1) .25s; }
  .cx-pcol.first .cx-block { background: linear-gradient(180deg, #d4a73c, #a9801f); }
  .cx-pcol.second .cx-block { background: linear-gradient(180deg, #8d99a8, #667385); }
  .cx-pcol.third .cx-block { background: linear-gradient(180deg, #c27c45, #92572b); }
  .cx-crown { display: block; margin: 0 auto 2px; color: #d4a73c; animation: cxFloat 2.4s ease-in-out infinite; }

  /* ---------- race rows ---------- */
  .cx-row { display: grid; grid-template-columns: 26px 38px 1fr; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 16px; background: var(--surface-solid);
    border: 1px solid var(--surface-border); margin-top: 8px; }
  .cx-row.me { border-color: rgba(var(--color-accent-rgb), .45); background: linear-gradient(90deg, rgba(var(--color-accent-rgb), .08), var(--surface-solid)); }
  .cx-rk { font-family: var(--font-num); font-weight: 900; font-size: .95rem; color: var(--text-muted); text-align: center; }
  .cx-rk.r1 { color: #c9961f; } .cx-rk.r2 { color: #7a8696; } .cx-rk.r3 { color: #b0693a; }
  .cx-row .cx-av { width: 38px; height: 38px; font-size: .95rem; margin: 0; border-width: 2px; box-shadow: none; }
  .cx-rmain { min-width: 0; }
  .cx-rtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cx-rname { font-size: .88rem; font-weight: 900; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cx-rname span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cx-me { flex: 0 0 auto; font-size: .6rem; font-weight: 900; padding: 2px 7px; border-radius: 6px; color: var(--color-success); background: rgba(47,125,94,.14); }
  .cx-val { font-family: var(--font-num); font-weight: 900; font-size: .92rem; white-space: nowrap; }
  .cx-val small { font-size: .62rem; font-weight: 800; color: var(--text-muted); margin-left: 2px; }
  .cx-track { height: 8px; border-radius: 99px; background: var(--surface-edge); margin-top: 7px; overflow: hidden; }
  .cx-bar { height: 100%; width: 0; border-radius: 99px; transition: width 1.1s cubic-bezier(.2,.9,.3,1); transition-delay: calc(var(--i, 0) * 70ms + 150ms); position: relative; overflow: hidden; }
  .cx-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: cxSweep 2.8s ease-in-out 1.4s infinite; }
  .cx-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: .68rem; font-weight: 700; color: var(--text-muted); }
  .cx-delta { font-family: var(--font-num); font-weight: 900; }
  .cx-delta.up { color: var(--color-success); } .cx-delta.down { color: var(--color-danger); }

  /* ---------- subject / topic blocks ---------- */
  .cx-blk { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: 20px; margin-top: 12px; overflow: hidden; box-shadow: var(--shadow-soft); }
  .cx-bh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--surface-edge); background: rgba(128,128,128,.03); }
  .cx-bt { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 900; font-size: .94rem; }
  .cx-bt svg { flex: 0 0 auto; color: var(--color-accent); }
  .cx-bt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cx-tag { flex: 0 0 auto; font-size: .68rem; font-weight: 900; padding: 4px 10px; border-radius: 99px; font-family: var(--font-num); }
  .cx-tag.up { color: var(--color-success); background: rgba(47,125,94,.12); }
  .cx-tag.down { color: var(--color-danger); background: rgba(166,64,47,.12); }
  .cx-tag.eq { color: var(--text-muted); background: var(--surface-edge); }
  .cx-bb { padding: 4px 12px 12px; }
  .cx-mini { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; }
  .cx-mini .cx-av { width: 30px; height: 30px; font-size: .78rem; margin: 0; border-width: 0; box-shadow: none; }
  .cx-mini.me .cx-rname { color: var(--color-accent); }
  .cx-mini .cx-track { margin-top: 5px; height: 7px; }
  .cx-win { color: #c9961f; flex: 0 0 auto; }

  /* ---------- topic tools ---------- */
  .cx-tools { display: flex; flex-direction: column; gap: 10px; }
  .cx-search { width: 100%; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--surface-border); background: var(--surface-solid); color: inherit; font: inherit; font-size: .86rem; font-weight: 700; }
  .cx-search:focus { outline: 2px solid rgba(var(--color-accent-rgb), .45); }
  .cx-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .cx-f { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--surface-border); background: var(--surface-solid); color: var(--text-secondary); font: inherit; font-size: .76rem; font-weight: 800; cursor: pointer; transition: all .2s; }
  .cx-f.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

  @keyframes cxGlow { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
  @keyframes cxSlideL { from { transform: translateX(-40px) scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes cxSlideR { from { transform: translateX(40px) scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes cxVs { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
  @keyframes cxRadar { from { transform: scale(0); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes cxSweep { 0% { transform: translateX(-100%) } 55%,100% { transform: translateX(100%) } }
  @keyframes cxFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @keyframes cxFade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .cx-swap { animation: cxFade .35s ease both; }

  @media (prefers-reduced-motion: reduce) {
    .cx-rv { opacity: 1; transform: none; transition: none; }
    .cx-bar, .cx-tug i, .cx-block { transition: none; }
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { getApprovedResults, getLeaderboardData } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeStudentSummary, mergeStatsForDisplay } from "../js/utils/comparison-utils.js";

initTheme();
const shell = document.getElementById("shell");
const student = getActiveStudent();
if (!student) window.location.href = "../index.html"; else renderPage();

const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const PALETTE = ["#b8863c", "#4f7fb0", "#8a63b5", "#2f7d5e", "#c9772e", "#b24a63", "#2c8ea0"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-IN");
const r1 = n => Math.round(n * 10) / 10;

const I = {
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/>',
  crown: '<path d="M2 7l4.5 4L12 4l5.5 7L22 7l-2 12H4z"/>',
  layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  up: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  down: '<path d="M3 7l6 6 4-4 8 8"/><path d="M14 17h7v-7"/>',
  rank: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/>',
  radar: '<polygon points="12 2 21 9 18 20 6 20 3 9"/><polygon points="12 8 16 11 15 16 9 16 8 11"/>'
};
const svg = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

let S = null;   // page state

/* ---------------- data ---------------- */
async function renderPage() {
  const myBatch = student.className || "অজানা ব্যাচ";
  shell.innerHTML = `${renderStudentHeader(student, "dashboard")}<div id="body" class="mt-4"><div class="spinner" style="margin:40px auto;"></div></div>`;
  const body = document.getElementById("body");
  try {
    const allStudents = await getActiveStudents();
    const batchStudents = allStudents.filter(s => (s.className || "অজানা ব্যাচ") === myBatch);
    if (batchStudents.length < 2) { renderState(body, "empty", "আপনার ব্যাচে তুলনার জন্য অন্য কোনো শিক্ষার্থী নেই।"); return; }

    const leaderboardData = await getLeaderboardData(batchStudents);
    const pointsMap = {};
    leaderboardData.forEach(l => { pointsMap[l.studentId] = l.totalPoints || 0; });

    const [subjects, chapters, topics] = await Promise.all([getSubjects(), getChapters(), getTopics()]);
    const subjectMap = buildNameMap(subjects), chapterMap = buildNameMap(chapters), topicMap = buildNameMap(topics);

    const summaries = await Promise.all(batchStudents.map(async s => {
      const results = await getApprovedResults(s.studentId);
      const summary = computeStudentSummary(s, results, subjectMap, chapterMap, topicMap);
      summary.actualPoints = pointsMap[s.studentId] || 0;
      summary.photoURL = s.photoURL || "";
      return summary;
    }));
    if (summaries.every(s => !s.hasData)) { renderState(body, "empty", "তুলনার জন্য এখনো পর্যাপ্ত ফলাফল পাওয়া যায়নি।"); return; }

    renderDetailedView(body, summaries, myBatch);
  } catch (err) {
    console.error(err);
    renderState(body, "error", "ডেটা লোড করতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ চেক করুন।");
  }
}

/* ---------------- small builders ---------------- */
const colorOf = (s, i) => s.studentId === student.studentId ? PALETTE[0] : PALETTE[(i % (PALETTE.length - 1)) + 1];
const first = s => esc(String(s.name || "").split(" ")[0] || "—");
const idxOf = s => S.order.findIndex(x => x.studentId === s.studentId);
function avatar(s, size) {
  const c = S.colors[s.studentId];
  const st = size ? `style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;background:${c}"` : `style="background:${c}"`;
  return `<div class="cx-av" ${st}>${s.photoURL ? `<img src="${esc(s.photoURL)}" alt="">` : esc((s.name || "?").trim().charAt(0).toUpperCase())}</div>`;
}

/* ---------------- animations ---------------- */
function animateIn(root) {
  // 1. scroll-reveal with stagger
  const rv = [...root.querySelectorAll(".cx-rv")];
  if (REDUCED || !("IntersectionObserver" in window)) rv.forEach(e => e.classList.add("in"));
  else {
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .12 });
    rv.forEach(e => io.observe(e));
  }
  // 2. bars grow, podium rises, tug-of-war slides
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll("[data-w]").forEach(e => { e.style.width = e.dataset.w + "%"; });
    root.querySelectorAll("[data-h]").forEach(e => { e.style.height = e.dataset.h + "px"; });
  }));
  // 3. count-up numbers
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = Number(el.dataset.count) || 0, dec = Number(el.dataset.dec || 0);
    const show = v => { el.textContent = dec ? v.toFixed(dec) : fmt(Math.round(v)); };
    if (REDUCED) { show(target); return; }
    const t0 = performance.now(), dur = 1000;
    const tick = t => { const p = Math.min(1, (t - t0) / dur); show(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

/* ---------------- hero + radar (depend on chosen rival) ---------------- */
function heroHtml() {
  const me = S.me, rv = S.rival;
  const mp = me.actualPoints || 0, rp = rv.actualPoints || 0, tot = mp + rp;
  const share = tot > 0 ? Math.round((mp / tot) * 100) : 50;
  const diff = mp - rp;
  const verdict = diff > 0 ? `<p class="cx-verdict up">তুমি ${fmt(diff)} XP এগিয়ে আছো — ধরে রাখো!</p>`
    : diff < 0 ? `<p class="cx-verdict down">তুমি ${fmt(-diff)} XP পিছিয়ে — ধরে ফেলার সুযোগ আছে!</p>`
    : `<p class="cx-verdict">দুজনেই সমান সমান — পরের পরীক্ষাই ঠিক করবে।</p>`;
  const side = (s, cls, label) => `
    <div class="cx-side ${cls}">
      ${avatar(s)}
      <div class="cx-sname">${label}</div>
      <div class="cx-sxp"><span data-count="${s.actualPoints || 0}">0</span><small>XP</small></div>
      <div class="cx-savg">গড় ${s.hasData ? r1(s.avgPercentage) + "%" : "—"}</div>
    </div>`;
  return `
    <div class="cx-hero cx-swap">
      <div class="cx-hero-label">সামনাসামনি তুলনা</div>
      <div class="cx-duel">
        ${side(me, "me", "তুমি")}
        <div class="cx-vs">VS</div>
        ${side(rv, "rv", first(rv))}
      </div>
      <div class="cx-tug"><i data-w="${share}"></i><i style="flex:1"></i></div>
      ${verdict}
    </div>`;
}

function chipsHtml() {
  return S.others.map(s => `
    <button type="button" class="cx-chip ${s.studentId === S.rival.studentId ? "on" : ""}" data-rival="${esc(s.studentId)}">
      <span class="dot" style="background:${S.colors[s.studentId]}">${s.photoURL ? `<img src="${esc(s.photoURL)}" alt="">` : esc((s.name || "?").trim().charAt(0).toUpperCase())}</span>${first(s)}
    </button>`).join("");
}

function insightsHtml() {
  const mine = S.chapters.map(r => ({ name: r.name, v: r[S.me.studentId] })).filter(r => r.v !== null && r.v !== undefined);
  const best = mine.length ? mine.reduce((a, b) => b.v > a.v ? b : a) : null;
  const worst = mine.length > 1 ? mine.reduce((a, b) => b.v < a.v ? b : a) : null;
  const myIdx = idxOf(S.me);
  const above = myIdx > 0 ? S.order[myIdx - 1] : null;
  const rankLine = above ? `${fmt((above.actualPoints || 0) - (S.me.actualPoints || 0))} XP পিছনে` : "শীর্ষে আছো";
  return `
    <div class="cx-ins">
      <div class="cx-in acc cx-rv" style="--i:0">${svg("rank", 20)}<p>তোমার র‍্যাঙ্ক</p><b>${myIdx + 1} / ${S.order.length}</b><em>${rankLine}</em></div>
      <div class="cx-in good cx-rv" style="--i:1">${svg("up", 20)}<p>সবচেয়ে ভালো</p><b>${best ? esc(best.name) : "—"}</b><em>${best ? Math.round(best.v) + "%" : ""}</em></div>
      <div class="cx-in bad cx-rv" style="--i:2">${svg("down", 20)}<p>আরও মনোযোগ</p><b>${worst ? esc(worst.name) : "—"}</b><em>${worst ? Math.round(worst.v) + "%" : ""}</em></div>
    </div>`;
}

function radarHtml() {
  const a = S.me.studentId, b = S.rival.studentId;
  let axes = S.chapters.filter(r => r[a] !== null && r[a] !== undefined && r[b] !== null && r[b] !== undefined);
  axes = axes.sort((x, y) => Math.abs(y[a] - y[b]) - Math.abs(x[a] - x[b])).slice(0, 6);
  const head = `<h3>${svg("radar", 18)} শক্তি-দুর্বলতার রাডার</h3><p class="cx-sub">কোন বিষয়ে কে এগিয়ে (সঠিক উত্তরের %)</p>`;
  if (axes.length < 3) {
    return `<div class="cx-card cx-rv">${head}<div class="cx-empty">রাডারের জন্য দুজনেরই অন্তত ৩টি একই বিষয়ের ডেটা লাগবে।</div></div>`;
  }
  const n = axes.length, cx = 150, cy = 150, R = 92;
  const pt = (i, v) => { const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n; const r = (R * Math.max(0, Math.min(100, v))) / 100; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
  const poly = id => axes.map((row, i) => pt(i, row[id]).map(x => x.toFixed(1)).join(",")).join(" ");
  const rings = [25, 50, 75, 100].map(p => `<polygon class="ring" points="${axes.map((_, i) => pt(i, p).map(x => x.toFixed(1)).join(",")).join(" ")}"/>`).join("");
  const spokes = axes.map((_, i) => { const [x, y] = pt(i, 100); return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join("");
  const labels = axes.map((row, i) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n; const x = cx + (R + 16) * Math.cos(ang), y = cy + (R + 16) * Math.sin(ang);
    const anchor = Math.abs(Math.cos(ang)) < .25 ? "middle" : (Math.cos(ang) > 0 ? "start" : "end");
    const nm = row.name.length > 12 ? row.name.slice(0, 11) + "…" : row.name;
    return `<text class="lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle">${esc(nm)}</text>`;
  }).join("");
  const dots = (id, col) => axes.map((row, i) => { const [x, y] = pt(i, row[id]); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${col}"/>`; }).join("");
  const cMe = S.colors[a], cRv = S.colors[b];
  return `
    <div class="cx-card cx-rv cx-swap">
      ${head}
      <svg class="cx-radar" viewBox="-30 0 360 300" role="img" aria-label="রাডার চার্ট">
        ${rings}${spokes}
        <g class="shape b"><polygon points="${poly(b)}" fill="${cRv}" fill-opacity=".18" stroke="${cRv}" stroke-width="2.2" stroke-linejoin="round"/>${dots(b, cRv)}</g>
        <g class="shape"><polygon points="${poly(a)}" fill="${cMe}" fill-opacity=".24" stroke="${cMe}" stroke-width="2.4" stroke-linejoin="round"/>${dots(a, cMe)}</g>
        ${labels}
      </svg>
      <div class="cx-legend"><span><i style="background:${cMe}"></i>তুমি</span><span><i style="background:${cRv}"></i>${first(S.rival)}</span></div>
    </div>`;
}

/* ---------------- tab: overall ---------------- */
function overallHtml() {
  const o = S.order, top = o.slice(0, 3);
  const maxPts = Math.max(1, ...o.map(s => s.actualPoints || 0));
  const slot = (s, cls, h, place) => !s ? "" : `
    <div class="cx-pcol ${cls}">
      ${cls === "first" ? `<svg class="cx-crown" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${I.crown}</svg>` : ""}
      ${avatar(s)}
      <div class="cx-pn">${s.studentId === student.studentId ? "তুমি" : first(s)}</div>
      <div class="cx-pp">${fmt(s.actualPoints)} XP</div>
      <div class="cx-block" data-h="${h}">${place}</div>
    </div>`;
  const podium = `<div class="cx-card cx-rv"><h3>${svg("trophy", 18)} ওভারঅল পডিয়াম</h3><p class="cx-sub">মোট XP অনুযায়ী ব্যাচের সেরা ${top.length} জন</p>
    <div class="cx-pod">${slot(top[1], "second", 74, "২")}${slot(top[0], "first", 104, "১")}${slot(top[2], "third", 54, "৩")}</div></div>`;

  const rows = o.map((s, i) => {
    const isMe = s.studentId === student.studentId;
    const pts = s.actualPoints || 0;
    const d = pts - (S.me.actualPoints || 0);
    const meta = isMe ? `<span>তোমার অবস্থান</span><span class="cx-delta">${s.examsTaken || 0} টি পরীক্ষা</span>`
      : `<span>তোমার তুলনায়</span><span class="cx-delta ${d > 0 ? "down" : d < 0 ? "up" : ""}">${d === 0 ? "সমান" : (d > 0 ? "+" : "−") + fmt(Math.abs(d)) + " XP"}</span>`;
    return `
      <div class="cx-row ${isMe ? "me" : ""} cx-rv" style="--i:${Math.min(i, 8)}">
        <div class="cx-rk ${i < 3 ? "r" + (i + 1) : ""}">${i + 1}</div>
        ${avatar(s)}
        <div class="cx-rmain">
          <div class="cx-rtop">
            <div class="cx-rname"><span class="t">${first(s)}</span>${isMe ? '<span class="cx-me">তুমি</span>' : ""}</div>
            <div class="cx-val"><span data-count="${pts}">0</span><small>XP</small></div>
          </div>
          <div class="cx-track"><div class="cx-bar" style="--i:${i};background:${S.colors[s.studentId]}" data-w="${Math.max(3, Math.round((pts / maxPts) * 100))}"></div></div>
          <div class="cx-meta">${meta}<span>গড় ${s.hasData ? r1(s.avgPercentage) + "%" : "—"}</span></div>
        </div>
      </div>`;
  }).join("");
  return podium + rows;
}

/* ---------------- tabs: subject / topic blocks ---------------- */
function blockHtml(row, iconName, idx) {
  const sorted = [...S.summaries].sort((a, b) => {
    const A = row[a.studentId] ?? -1, B = row[b.studentId] ?? -1;
    return B !== A ? B - A : (b.actualPoints || 0) - (a.actualPoints || 0);
  });
  const myV = row[S.me.studentId], rvV = row[S.rival.studentId];
  let tag = "";
  if (myV !== null && myV !== undefined && rvV !== null && rvV !== undefined) {
    const d = r1(myV - rvV);
    tag = d > 0 ? `<span class="cx-tag up">+${d}% ${first(S.rival)}-এর চেয়ে</span>` : d < 0 ? `<span class="cx-tag down">${d}% ${first(S.rival)}-এর চেয়ে</span>` : `<span class="cx-tag eq">${first(S.rival)}-এর সমান</span>`;
  }
  const rows = sorted.map((s, i) => {
    const v = row[s.studentId], has = v !== null && v !== undefined;
    const isMe = s.studentId === student.studentId;
    return `
      <div class="cx-mini ${isMe ? "me" : ""}">
        ${avatar(s)}
        <div class="cx-rmain">
          <div class="cx-rname"><span class="t">${isMe ? "তুমি" : first(s)}</span>${has && i === 0 ? `<svg class="cx-win" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-label="সেরা">${I.crown}</svg>` : ""}</div>
          <div class="cx-track"><div class="cx-bar" style="--i:${i};background:${S.colors[s.studentId]}" data-w="${has ? Math.max(2, Math.round(v)) : 0}"></div></div>
        </div>
        <div class="cx-val">${has ? Math.round(v) + "<small>%</small>" : "<small>—</small>"}</div>
      </div>`;
  }).join("");
  return `
    <div class="cx-blk cx-rv" style="--i:${Math.min(idx, 5)}">
      <div class="cx-bh"><div class="cx-bt">${svg(iconName, 17)}<span>${esc(row.name)}</span></div>${tag}</div>
      <div class="cx-bb">${rows}</div>
    </div>`;
}

function subjectHtml() {
  return S.chapters.length ? S.chapters.map((r, i) => blockHtml(r, "layers", i)).join("") : `<div class="cx-empty">পর্যাপ্ত ডেটা নেই।</div>`;
}

function topicListHtml() {
  const a = S.me.studentId, b = S.rival.studentId, q = S.q.trim().toLowerCase();
  const list = S.topics.filter(t => S.summaries.some(s => t[s.studentId] !== null && t[s.studentId] !== undefined))
    .filter(t => !q || t.name.toLowerCase().includes(q))
    .filter(t => {
      if (S.filter === "all") return true;
      const x = t[a], y = t[b];
      if (x === null || x === undefined || y === null || y === undefined) return false;
      return S.filter === "ahead" ? x > y : x < y;
    });
  return list.length ? list.map((t, i) => blockHtml(t, "file", i)).join("") : `<div class="cx-empty">কোনো টপিক পাওয়া যায়নি।</div>`;
}

function topicHtml() {
  const f = (k, l) => `<button type="button" class="cx-f ${S.filter === k ? "on" : ""}" data-filter="${k}">${l}</button>`;
  return `
    <div class="cx-tools cx-rv">
      <input class="cx-search" id="cxSearch" type="search" placeholder="টপিক খুঁজুন…" value="${esc(S.q)}" autocomplete="off">
      <div class="cx-filters">${f("all", "সব টপিক")}${f("ahead", "আমি এগিয়ে")}${f("behind", "আমি পিছিয়ে")}</div>
    </div>
    <div id="cxTopicList">${topicListHtml()}</div>`;
}

/* ---------------- page assembly + events ---------------- */
function tabsHtml() {
  const tab = (k, l) => `<button type="button" class="${S.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`;
  const idx = ["overall", "subject", "topic"].indexOf(S.tab);
  return `<div class="cx-seg"><div class="cx-thumb" style="transform:translateX(${idx * 100}%)"></div>${tab("overall", "ওভারঅল")}${tab("subject", "বিষয়")}${tab("topic", "টপিক")}</div>`;
}
function tabBodyHtml() { return S.tab === "overall" ? overallHtml() : S.tab === "subject" ? subjectHtml() : topicHtml(); }

function paintTop() {
  document.getElementById("cxHero").innerHTML = heroHtml();
  document.getElementById("cxChips").innerHTML = chipsHtml();
  document.getElementById("cxRadar").innerHTML = radarHtml();
  document.getElementById("cxIns").innerHTML = insightsHtml();
  animateIn(document.getElementById("cxTop"));
}
function paintTab() {
  document.getElementById("cxTabs").innerHTML = tabsHtml();
  const el = document.getElementById("cxTabBody");
  el.innerHTML = `<div class="cx-swap">${tabBodyHtml()}</div>`;
  animateIn(el);
}

function renderDetailedView(body, summaries, batchName) {
  const order = [...summaries].sort((a, b) => (b.actualPoints || 0) - (a.actualPoints || 0));
  const me = summaries.find(s => s.studentId === student.studentId) || order[0];
  const others = order.filter(s => s.studentId !== me.studentId);
  const myIdx = order.findIndex(s => s.studentId === me.studentId);
  const defaultRival = (myIdx > 0 ? order[myIdx - 1] : order.find(s => s.studentId !== me.studentId)) || others[0];

  S = {
    summaries, order, me, others, rival: defaultRival,
    chapters: mergeStatsForDisplay(summaries, "chapterStats", "chapterId"),
    topics: mergeStatsForDisplay(summaries, "topicStats", "topicId"),
    colors: Object.fromEntries(order.map((s, i) => [s.studentId, colorOf(s, i)])),
    tab: "overall", filter: "all", q: ""
  };

  body.innerHTML = `
    <div class="cx-strip cx-rv"><span>ব্যাচ: <b>${esc(batchName)}</b></span><span class="cx-pill">${summaries.length} জন প্রতিযোগী</span></div>
    <div id="cxTop">
      <div id="cxHero"></div>
      <div class="cx-riv" id="cxChips" aria-label="রাইভাল বেছে নাও"></div>
      <div id="cxIns"></div>
      <div id="cxRadar"></div>
    </div>
    <div class="cx-tabs" id="cxTabs"></div>
    <div id="cxTabBody"></div>`;

  paintTop();
  paintTab();
  requestAnimationFrame(() => body.querySelector(".cx-strip")?.classList.add("in"));

  body.addEventListener("click", e => {
    const chip = e.target.closest("[data-rival]");
    if (chip) { S.rival = S.summaries.find(s => s.studentId === chip.dataset.rival) || S.rival; paintTop(); if (S.tab !== "overall") paintTab(); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab && tab.dataset.tab !== S.tab) { S.tab = tab.dataset.tab; paintTab(); return; }
    const f = e.target.closest("[data-filter]");
    if (f) { S.filter = f.dataset.filter; paintTab(); const s = document.getElementById("cxSearch"); if (s) s.focus(); }
  });
  body.addEventListener("input", e => {
    if (e.target.id !== "cxSearch") return;
    S.q = e.target.value;
    const list = document.getElementById("cxTopicList");
    list.innerHTML = topicListHtml();
    animateIn(list);
  });
}
</script>
</body>
</html>
