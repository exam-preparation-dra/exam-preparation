<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ব্যাটল মোড - লবি</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/battle-ui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
  /* Local overrides for Esports Lobby */
  body { background-color: var(--arena-bg, #070709); color: var(--arena-text, #fff); font-family: 'Inter', 'Noto Sans Bengali', sans-serif; }
  .app-shell { max-width: 620px; padding: 24px 16px 48px; margin: 0 auto; }
  .hidden { display: none !important; }
  
  .battle-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 2px solid #2a2d3a; padding-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-icon { width: 48px; height: 48px; background: #00f0ff; color: #000; display: grid; place-items: center; clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); }
  .brand-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; }
  .brand h1 { font-size: 1.4rem; margin: 0; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .brand p { margin: 2px 0 0; color: #6b728e; font-size: 0.8rem; font-weight: 700; }
  .back-btn { background: #111217; border: 1px solid #2a2d3a; color: #fff; padding: 10px 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { border-color: #ff005c; color: #ff005c; }

  .hero { background: #111217; border: 2px solid #2a2d3a; padding: 40px 20px; text-align: center; margin-bottom: 24px; position: relative; }
  .hero::before { content: ""; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: #00f0ff; }
  .hero-symbol { width: 60px; height: 60px; background: #ff005c; margin: 0 auto 20px; display: grid; place-items: center; transform: rotate(45deg); }
  .hero-symbol svg { width: 30px; height: 30px; stroke: #fff; transform: rotate(-45deg); stroke-width: 2.5; }
  .hero h2 { margin: 0; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; }
  .hero p { color: #6b728e; font-size: 0.95rem; font-weight: 600; margin-top: 10px; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .mode-card { background: #070709; border: 2px solid #2a2d3a; padding: 24px 20px; text-align: left; cursor: pointer; color: #fff; transition: all 0.2s; }
  .mode-card:hover { border-color: #00f0ff; background: rgba(0, 240, 255, 0.05); transform: translateY(-4px); box-shadow: 4px 4px 0 rgba(0, 240, 255, 0.2); }
  .mode-card.join:hover { border-color: #ff005c; background: rgba(255, 0, 92, 0.05); box-shadow: 4px 4px 0 rgba(255, 0, 92, 0.2); }
  .mode-icon { width: 40px; height: 40px; background: #111217; border: 1px solid #2a2d3a; display: grid; place-items: center; margin-bottom: 16px; color: #00f0ff; }
  .mode-card.join .mode-icon { color: #ff005c; }
  .mode-card h3 { margin: 0; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; }
  .mode-card p { margin: 8px 0 0; color: #6b728e; font-size: 0.85rem; font-weight: 600; }

  .section { background: #111217; border: 1px solid #2a2d3a; padding: 20px; margin-top: 20px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #2a2d3a; padding-bottom: 12px; }
  .section-title { margin: 0; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; color: #00f0ff; }
  .section-sub { margin: 4px 0 0; color: #6b728e; font-size: 0.85rem; font-weight: 600; }
  
  .topic-picker { max-height: 250px; overflow-y: auto; background: #070709; border: 1px solid #2a2d3a; padding: 10px; margin-top: 16px; }
  .subject-label { font-weight: 900; color: #ff005c; text-transform: uppercase; margin: 12px 8px 8px; font-size: 0.85rem; letter-spacing: 1px; }
  .topic-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; font-weight: 700; cursor: pointer; border-bottom: 1px solid #1a1c23; }
  .topic-row:hover { background: #1a1c23; }
  .topic-row input { accent-color: #00f0ff; width: 18px; height: 18px; }

  .primary-action { width: 100%; background: #00f0ff; color: #000; border: none; padding: 16px; font-weight: 900; font-size: 1rem; text-transform: uppercase; cursor: pointer; margin-top: 20px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
  .primary-action:hover { background: #fff; }
  .secondary-action { border: 2px solid #2a2d3a; background: transparent; color: #fff; padding: 12px 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .secondary-action:hover { background: #2a2d3a; }

  .battle-code { font-family: 'Space Grotesk', monospace; font-size: 3rem; font-weight: 900; letter-spacing: 10px; text-align: center; color: #00f0ff; margin: 20px 0; background: #070709; border: 1px dashed #2a2d3a; padding: 20px; }
  
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .team-panel { background: #070709; border: 1px solid #2a2d3a; padding: 16px; }
  .team-title { font-weight: 900; text-transform: uppercase; margin-bottom: 12px; color: #00f0ff; border-bottom: 1px solid #2a2d3a; padding-bottom: 8px; }
  .team-panel:last-child .team-title { color: #ff005c; }
  .member-chip { background: #111217; border: 1px solid #2a2d3a; padding: 10px 12px; font-weight: 800; font-size: 0.85rem; margin-bottom: 8px; display: flex; justify-content: space-between; }
  
  .modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: grid; place-items: center; padding: 16px; z-index: 100; }
  .modal { background: #111217; border: 2px solid #00f0ff; padding: 24px; width: 100%; max-width: 480px; box-shadow: 8px 8px 0 rgba(0, 240, 255, 0.2); }
  .join-code { background: #070709; border: 2px solid #2a2d3a; color: #00f0ff; font-family: 'Space Grotesk', monospace; font-size: 1.5rem; text-align: center; letter-spacing: 5px; padding: 16px; width: 100%; box-sizing: border-box; font-weight: 900; margin-bottom: 16px; }
  .join-code:focus { outline: none; border-color: #00f0ff; }
  
  .error-note { color: #ff005c; font-weight: 900; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
<div class="battle-page">

  <div class="battle-top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <div><h1>ব্যাটল মোড</h1><p>THE ARENA AWAITS</p></div>
    </div>
    <button id="homeBtn" class="back-btn" type="button">EXIT</button>
  </div>

  <!-- PHASE 1: MODE SELECT -->
  <section id="modeView">
    <div class="hero">
      <div class="hero-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m13 2-2 7H5l7 4-2 9 9-13h-6l1-7Z"/><path d="M4 4h2M18 4h2M19 17h2"/></svg>
      </div>
      <h2>ENTER THE BATTLE</h2>
      <p>ম্যাচ তৈরি করো অথবা কোড দিয়ে সরাসরি জয়েন করো।</p>
    </div>

    <div class="mode-grid">
      <button class="mode-card" id="openCreateBtn" type="button">
        <div class="mode-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <h3>HOST MATCH</h3>
        <p>নতুন টপিক বেছে নিয়ে যুদ্ধ শুরু করো।</p>
      </button>
      <button class="mode-card join" id="openJoinBtn" type="button">
        <div class="mode-icon"><svg viewBox="0 0 24 24"><path d="M8 12h8M13 7l5 5-5 5"/><path d="M5 5h5M5 19h5"/></svg></div>
        <h3>JOIN MATCH</h3>
        <p>বন্ধুর কোড ব্যবহার করে টিমে যোগ দাও।</p>
      </button>
    </div>
  </section>

  <!-- PHASE 2: CREATE -->
  <section id="createView" class="hidden">
    <div class="section">
      <div class="section-head">
        <div><h2 class="section-title">HOST MATCH</h2><p class="section-sub">যুদ্ধের বিষয়বস্তু নির্বাচন করুন</p></div>
      </div>
      <div id="topicPicker" class="topic-picker">লোড হচ্ছে…</div>
      <button id="createBtn" class="primary-action" type="button">CREATE BATTLE</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobbyView" class="hidden">
    <div class="section">
      <div class="section-head" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
        <h2 class="section-title">MATCH LOBBY</h2>
      </div>
      <div class="battle-code" id="codeBox">------</div>
      <div style="display: flex; gap: 12px; margin-bottom: 24px;">
        <button id="copyCodeBtn" class="secondary-action" style="flex: 1;" type="button">COPY CODE</button>
        <button id="shareCodeBtn" class="secondary-action" style="flex: 1;" type="button">SHARE</button>
      </div>
      <div style="background: #fff; padding: 12px; width: 160px; margin: 0 auto; border: 4px solid #2a2d3a;" id="qrBox"></div>
    </div>

    <div class="section">
      <div class="section-head"><div><h3 class="section-title" style="color: #fff;">SQUADS</h3></div></div>
      <div class="team-grid">
        <div class="team-panel"><div class="team-title">TEAM ALPHA (A)</div><div id="teamACol"></div></div>
        <div class="team-panel"><div class="team-title">TEAM OMEGA (B)</div><div id="teamBCol"></div></div>
      </div>
      <button id="startBtn" class="primary-action hidden" type="button">START MATCH</button>
      <p id="waitingNote" class="hidden" style="text-align:center;color:#6b728e;font-weight:800;margin-top:16px;">WAITING FOR HOST TO START...</p>
      <p id="errorNote" class="error-note"></p>
    </div>
    <button id="leaveLobbyBtn" class="secondary-action" type="button" style="width:100%;margin-top:16px;">LEAVE LOBBY</button>
  </section>

</div>
</div>

<!-- JOIN MODAL -->
<div id="joinModal" class="modal-wrap hidden">
  <div class="modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="margin: 0; font-size: 1.2rem; font-weight: 900; color: #00f0ff; text-transform: uppercase;">JOIN BATTLE</h3>
      <button id="closeJoinBtn" style="background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; font-weight: 900;">×</button>
    </div>
    <input id="joinCodeInput" class="join-code" maxlength="6" placeholder="ENTER CODE" autocomplete="off">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
      <button id="joinABtn" class="primary-action" style="margin: 0;" type="button">TEAM A</button>
      <button id="joinBBtn" class="primary-action" style="margin: 0; background: #ff005c; color: #fff;" type="button">TEAM B</button>
    </div>
    <button id="scanQrBtn" class="secondary-action" type="button" style="width:100%;">SCAN QR CODE</button>
    <div id="scannerArea" class="hidden" style="margin-top:16px; border: 2px solid #2a2d3a; background: #000; padding: 8px;"><div id="qr-reader"></div></div>
  </div>
</div>

<!-- JavaScript Block remains totally identical as your original file -->
<script type="module">
import { initTheme } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getFullSyllabusTree } from "../js/utils/syllabus-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { createMatch, joinMatch, startMatch, removeMember } from "../js/utils/battle-utils.js";

initTheme();
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

const student = getActiveStudent();
if (!student?.studentId) {
  document.getElementById("shell").innerHTML = `<div class="card">আগে লগইন করো।</div>`;
  throw new Error("no active student");
}

const modeView = document.getElementById("modeView");
const createView = document.getElementById("createView");
const lobbyView = document.getElementById("lobbyView");
const joinModal = document.getElementById("joinModal");
const topicPicker = document.getElementById("topicPicker");
const errorNote = document.getElementById("errorNote");
let unsub = null;
let myTeam = null;
let scanner = null;

function showError(msg) {
  errorNote.textContent = msg;
  setTimeout(() => { errorNote.textContent = ""; }, 4000);
}

function showOnly(view) {
  modeView.classList.toggle("hidden", view !== "mode");
  createView.classList.toggle("hidden", view !== "create");
  lobbyView.classList.toggle("hidden", view !== "lobby");
}

document.getElementById("openCreateBtn").addEventListener("click", () => showOnly("create"));
document.getElementById("openJoinBtn").addEventListener("click", () => joinModal.classList.remove("hidden"));
document.getElementById("homeBtn").addEventListener("click", () => {
  unsub?.();
  stopScanner();
  showOnly("mode");
});

document.getElementById("closeJoinBtn").addEventListener("click", () => {
  stopScanner();
  joinModal.classList.add("hidden");
});
joinModal.addEventListener("click", e => { if (e.target === joinModal) { stopScanner(); joinModal.classList.add("hidden"); } });

(async () => {
  try {
    const tree = await getFullSyllabusTree();
    topicPicker.innerHTML = tree.map(subject => `
      <div class="subject-label">${esc(subject.name_bn || subject.name_en)}</div>
      ${subject.chapters.flatMap(ch => ch.topics).map(t => `
        <label class="topic-row">
          <input type="checkbox" class="topic-check" value="${esc(t.id)}">
          <span>${esc(t.name_bn || t.name_en)}</span>
        </label>
      `).join("")}
    `).join("") || `<div style="color:var(--text-muted);padding:12px;">কোনো Topic পাওয়া যায়নি।</div>`;
  } catch (e) {
    topicPicker.innerHTML = `<div style="color:#ff005c;padding:12px;font-weight:bold;">Topic লোড করা যায়নি।</div>`;
  }
})();

document.getElementById("createBtn").addEventListener("click", async () => {
  const topics = [...document.querySelectorAll(".topic-check:checked")].map(c => c.value);
  if (!topics.length) return showError("অন্তত ১টি Topic বেছে নাও।");
  try {
    const code = await createMatch({ hostStudentId: student.studentId, hostName: student.name, topics });
    myTeam = "A";
    enterLobby(code);
  } catch (e) { showError(e.message || "Battle তৈরি করা যায়নি।"); }
});

async function doJoin(team) {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  if (code.length !== 6) return alert("সঠিক ৬ অক্ষরের Code দাও।");
  try {
    stopScanner();
    joinModal.classList.add("hidden");
    await joinMatch(code, { studentId: student.studentId, name: student.name, team });
    myTeam = team;
    enterLobby(code);
  } catch (e) {
    joinModal.classList.remove("hidden");
    const map = { MATCH_NOT_FOUND: "এই Code-এ কোনো Battle পাওয়া যায়নি।", MATCH_ALREADY_STARTED: "এই Battle ইতিমধ্যে শুরু হয়ে গেছে।", TEAM_FULL: "এই Team পূর্ণ (৪ জন)।", ALREADY_IN_OTHER_TEAM: "তুমি আগেই অন্য Team-এ আছো।" };
    alert(map[e.message] || "Join করা যায়নি।");
  }
}
document.getElementById("joinABtn").addEventListener("click", () => doJoin("A"));
document.getElementById("joinBBtn").addEventListener("click", () => doJoin("B"));

function extractBattleCode(text) {
  const raw = String(text || "").trim().toUpperCase();
  const match = raw.match(/(?:BATTLE[:/]|CODE[:=])?([A-Z0-9]{6})$/);
  return match ? match[1] : null;
}

function stopScanner() {
  if (!scanner) return;
  scanner.stop().catch(() => {}).finally(() => {
    scanner.clear().catch(() => {});
    scanner = null;
  });
  document.getElementById("scannerArea").classList.add("hidden");
}

document.getElementById("scanQrBtn").addEventListener("click", async () => {
  const area = document.getElementById("scannerArea");
  area.classList.remove("hidden");
  if (scanner) return;
  if (typeof Html5Qrcode === "undefined") { alert("QR Scanner লোড হয়নি।"); return; }
  scanner = new Html5Qrcode("qr-reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } }, decoded => {
      const code = extractBattleCode(decoded);
      if (!code) return;
      document.getElementById("joinCodeInput").value = code;
      stopScanner();
    }, () => {});
  } catch (e) {
    scanner = null;
    alert("Camera permission দিন।");
  }
});

document.getElementById("copyCodeBtn").addEventListener("click", async () => {
  const code = document.getElementById("codeBox").textContent.trim();
  try { await navigator.clipboard.writeText(code); } catch { const ta = document.createElement("textarea"); ta.value = code; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const btn = document.getElementById("copyCodeBtn"); const old = btn.textContent; btn.textContent = "COPIED ✓"; setTimeout(() => btn.textContent = old, 1300);
});

document.getElementById("shareCodeBtn").addEventListener("click", async () => {
  const code = document.getElementById("codeBox").textContent.trim();
  const text = `আমার Battle-এ Join করো!\nBattle Code: ${code}`;
  if (navigator.share) { try { await navigator.share({ title: "Battle Invite", text }); } catch {} }
  else { try { await navigator.clipboard.writeText(text); alert("Share text Copy হয়েছে।"); } catch { alert(text); } }
});

function renderQr(code) {
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  if (window.QRCode) new QRCode(box, { text: `BATTLE:${code}`, width: 136, height: 136, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

function renderTeam(colEl, members, team, isHost, code) {
  colEl.innerHTML = (members || []).map(m => {
    const canRemove = isHost && m.studentId !== student.studentId;
    return `<div class="member-chip">
      <span>${esc(m.name)}</span>
      ${canRemove ? `<button type="button" class="member-remove" data-team="${team}" data-sid="${esc(m.studentId)}" style="background:none;border:none;color:#ff005c;font-weight:900;cursor:pointer;">×</button>` : ""}
    </div>`;
  }).join("") || `<div style="color:#6b728e;font-size:0.8rem;padding:8px 0;font-weight:bold;">EMPTY SLOT</div>`;

  colEl.querySelectorAll(".member-remove").forEach(btn => {
    btn.addEventListener("click", async () => {
      try { await removeMember(code, { hostStudentId: student.studentId, team: btn.dataset.team, studentId: btn.dataset.sid }); }
      catch (e) { showError("Member বাদ দেওয়া যায়নি।"); }
    });
  });
}

function enterLobby(code) {
  showOnly("lobby");
  document.getElementById("codeBox").textContent = code;
  renderQr(code);

  const ref = doc(db, "battleMatches", code);
  unsub = onSnapshot(ref, (snap) => {
    if (!snap.exists()) return;
    const m = snap.data();
    if (m.status === "active") {
      unsub?.();
      window.location.href = `./battle-play.html?code=${code}&team=${myTeam}`;
      return;
    }
    const isHost = student.studentId === m.hostStudentId;
    renderTeam(document.getElementById("teamACol"), m.teamA?.members, "A", isHost, code);
    renderTeam(document.getElementById("teamBCol"), m.teamB?.members, "B", isHost, code);

    const bothReady = (m.teamA?.members?.length || 0) > 0 && (m.teamB?.members?.length || 0) > 0;
    const startBtn = document.getElementById("startBtn");
    const waitingNote = document.getElementById("waitingNote");
    if (student.studentId === m.hostStudentId) {
      startBtn.classList.toggle("hidden", !bothReady);
      waitingNote.classList.add("hidden");
    } else {
      startBtn.classList.add("hidden");
      waitingNote.classList.remove("hidden");
    }
  });

  document.getElementById("startBtn").onclick = async () => {
    try { await startMatch(code); }
    catch (e) { showError(e.message || "Battle শুরু করা যায়নি।"); }
  };
}

document.getElementById("leaveLobbyBtn").addEventListener("click", () => { unsub?.(); showOnly("mode"); });
</script>
</body>
</html>
