<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ব্যাটল মোড - লবি</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/battle-ui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
  /* Local overrides for the Battle lobby — same paper/card language as the rest of the site */
  body { background-color: var(--bg-app); color: var(--text-primary); font-family: var(--font-bn); }

  .battle-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); border-bottom: 1px solid var(--surface-border); padding-bottom: var(--space-4); }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .brand-icon { width: 48px; height: 48px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2)); color: #2b1d09; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 6px 16px rgba(201,151,63,0.3); }
  .brand-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .brand h1 { font-size: 1.25rem; margin: 0; font-weight: 700; color: var(--text-primary); }
  .brand p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .back-btn { background: var(--surface-solid); border: 1px solid var(--surface-border); color: var(--text-primary); border-radius: var(--radius-md); padding: 10px 16px; font-weight: 600; cursor: pointer; transition: border-color var(--transition), color var(--transition); }
  .back-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }

  .hero { background: var(--surface); border: 1px solid var(--surface-border); border-top: 3px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-7) var(--space-5); text-align: center; margin-bottom: var(--space-5); box-shadow: var(--shadow-soft); }
  .hero-symbol { width: 60px; height: 60px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2)); margin: 0 auto var(--space-5); display: grid; place-items: center; }
  .hero-symbol svg { width: 28px; height: 28px; stroke: #2b1d09; stroke-width: 2.2; }
  .hero h2 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .hero p { color: var(--text-secondary); font-size: 0.92rem; font-weight: 500; margin-top: var(--space-3); }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-5); }
  .mode-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-5) var(--space-4); text-align: left; cursor: pointer; color: var(--text-primary); transition: border-color var(--transition-lift), transform var(--transition-lift), box-shadow var(--transition-lift); box-shadow: var(--shadow-soft); }
  .mode-card:hover { border-color: var(--color-accent); transform: translateY(-3px); box-shadow: var(--shadow-lift); }
  .mode-card.join:hover { border-color: var(--color-violet); }
  .mode-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-accent-soft); display: grid; place-items: center; margin-bottom: var(--space-4); color: var(--color-accent); }
  .mode-card.join .mode-icon { background: color-mix(in srgb, var(--color-violet) 14%, transparent); color: var(--color-violet); }
  .mode-card h3 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text-primary); }
  .mode-card p { margin: var(--space-2) 0 0; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }

  .section { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-5); margin-top: var(--space-4); box-shadow: var(--shadow-soft); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); border-bottom: 1px solid var(--surface-border); padding-bottom: var(--space-3); }
  .section-title { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
  .section-sub { margin: var(--space-1) 0 0; color: var(--text-muted); font-size: 0.82rem; }

  .topic-picker { max-height: 260px; overflow-y: auto; background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: var(--space-2); margin-top: var(--space-4); }
  .subject-label { font-weight: 700; color: var(--color-violet); margin: 12px 8px 8px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .topic-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-2); font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--surface-border); border-radius: var(--radius-sm); }
  .topic-row:hover { background: var(--surface-highlight); }
  .topic-row input { accent-color: var(--color-accent); width: 18px; height: 18px; }

  .primary-action { width: 100%; background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2)); color: #2b1d09; border: none; border-radius: var(--radius-md); padding: 16px; font-weight: 700; font-size: 0.98rem; cursor: pointer; margin-top: var(--space-5); box-shadow: 0 10px 24px rgba(201,151,63,0.32), 0 2px 6px rgba(201,151,63,0.4); transition: transform var(--transition-lift); }
  .primary-action:hover { transform: translateY(-1px); }
  .secondary-action { border: 1px solid var(--surface-border); background: var(--surface-solid); color: var(--text-primary); border-radius: var(--radius-md); padding: 12px 16px; font-weight: 600; cursor: pointer; transition: border-color var(--transition), color var(--transition); }
  .secondary-action:hover { border-color: var(--color-accent); color: var(--color-accent); }

  .battle-code { font-family: var(--font-num); font-size: 2.6rem; font-weight: 700; letter-spacing: 8px; text-align: center; color: var(--color-accent); margin: var(--space-5) 0; background: var(--surface-solid); border: 1px dashed var(--surface-border); border-radius: var(--radius-md); padding: var(--space-5); }

  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-5); }
  .team-panel { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: var(--space-4); }
  .team-title { font-weight: 700; margin-bottom: var(--space-3); color: var(--color-accent); border-bottom: 1px solid var(--surface-border); padding-bottom: var(--space-2); font-size: 0.9rem; }
  .team-panel:last-child .team-title { color: var(--color-violet); }
  .member-chip { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-sm); padding: 10px 12px; font-weight: 600; font-size: 0.85rem; margin-bottom: var(--space-2); display: flex; justify-content: space-between; }

  .modal-wrap { position: fixed; inset: 0; background: rgba(20,18,10,0.55); display: grid; place-items: center; padding: var(--space-4); z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-5); width: 100%; max-width: 480px; box-shadow: var(--shadow-lift); }
  .join-code { background: var(--surface-solid); border: 1px solid var(--surface-border); color: var(--color-accent); font-family: var(--font-num); font-size: 1.4rem; text-align: center; letter-spacing: 6px; padding: var(--space-4); width: 100%; box-sizing: border-box; font-weight: 700; margin-bottom: var(--space-4); border-radius: var(--radius-md); }
  .join-code:focus { outline: none; border-color: var(--color-accent); }

  .error-note { color: var(--color-danger); font-weight: 600; text-align: center; margin-top: var(--space-3); }
</style>
</head>
<body>
<div class="app-shell" id="shell">
<div class="battle-page">

  <div class="battle-top">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <div><h1>ব্যাটল মোড</h1><p>THE ARENA AWAITS</p></div>
    </div>
    <button id="homeBtn" class="back-btn" type="button">EXIT</button>
  </div>

  <!-- PHASE 1: MODE SELECT -->
  <section id="modeView">
    <div class="hero">
      <div class="hero-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m13 2-2 7H5l7 4-2 9 9-13h-6l1-7Z"/><path d="M4 4h2M18 4h2M19 17h2"/></svg>
      </div>
      <h2>ENTER THE BATTLE</h2>
      <p>ম্যাচ তৈরি করো অথবা কোড দিয়ে সরাসরি জয়েন করো।</p>
    </div>

    <div class="mode-grid">
      <button class="mode-card" id="openCreateBtn" type="button">
        <div class="mode-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <h3>HOST MATCH</h3>
        <p>নতুন টপিক বেছে নিয়ে যুদ্ধ শুরু করো।</p>
      </button>
      <button class="mode-card join" id="openJoinBtn" type="button">
        <div class="mode-icon"><svg viewBox="0 0 24 24"><path d="M8 12h8M13 7l5 5-5 5"/><path d="M5 5h5M5 19h5"/></svg></div>
        <h3>JOIN MATCH</h3>
        <p>বন্ধুর কোড ব্যবহার করে টিমে যোগ দাও।</p>
      </button>
    </div>
  </section>

  <!-- PHASE 2: CREATE -->
  <section id="createView" class="hidden">
    <div class="section">
      <div class="section-head">
        <div><h2 class="section-title">HOST MATCH</h2><p class="section-sub">যুদ্ধের বিষয়বস্তু নির্বাচন করুন</p></div>
      </div>
      <div id="topicPicker" class="topic-picker">লোড হচ্ছে…</div>
      <button id="createBtn" class="primary-action" type="button">CREATE BATTLE</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobbyView" class="hidden">
    <div class="section">
      <div class="section-head" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
        <h2 class="section-title">MATCH LOBBY</h2>
      </div>
      <div class="battle-code" id="codeBox">------</div>
      <div style="display: flex; gap: 12px; margin-bottom: 24px;">
        <button id="copyCodeBtn" class="secondary-action" style="flex: 1;" type="button">COPY CODE</button>
        <button id="shareCodeBtn" class="secondary-action" style="flex: 1;" type="button">SHARE</button>
      </div>
      <div style="background: #fff; padding: 12px; width: 160px; margin: 0 auto; border: 1px solid var(--surface-border); border-radius: var(--radius-md);" id="qrBox"></div>
    </div>

    <div class="section">
      <div class="section-head"><div><h3 class="section-title">SQUADS</h3></div></div>
      <div class="team-grid">
        <div class="team-panel"><div class="team-title">TEAM ALPHA (A)</div><div id="teamACol"></div></div>
        <div class="team-panel"><div class="team-title">TEAM OMEGA (B)</div><div id="teamBCol"></div></div>
      </div>
      <button id="startBtn" class="primary-action hidden" type="button">START MATCH</button>
      <p id="waitingNote" class="hidden" style="text-align:center;color:var(--text-muted);font-weight:600;margin-top:16px;">WAITING FOR HOST TO START...</p>
      <p id="errorNote" class="error-note"></p>
    </div>
    <button id="leaveLobbyBtn" class="secondary-action" type="button" style="width:100%;margin-top:16px;">LEAVE LOBBY</button>
  </section>

</div>
</div>

<!-- JOIN MODAL -->
<div id="joinModal" class="modal-wrap hidden">
  <div class="modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">JOIN BATTLE</h3>
      <button id="closeJoinBtn" style="background: transparent; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; font-weight: 700;">×</button>
    </div>
    <input id="joinCodeInput" class="join-code" maxlength="6" placeholder="ENTER CODE" autocomplete="off">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
      <button id="joinABtn" class="primary-action" style="margin: 0;" type="button">TEAM A</button>
      <button id="joinBBtn" class="primary-action" style="margin: 0; background: var(--color-violet); color: #fff; box-shadow: none;" type="button">TEAM B</button>
    </div>
    <button id="scanQrBtn" class="secondary-action" type="button" style="width:100%;">SCAN QR CODE</button>
    <div id="scannerArea" class="hidden" style="margin-top:16px; border: 1px solid var(--surface-border); border-radius: var(--radius-md); background: #000; padding: 8px;"><div id="qr-reader"></div></div>
  </div>
</div>

<!-- JavaScript Block remains totally identical as your original file -->
<script type="module">
import { initTheme } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getFullSyllabusTree } from "../js/utils/syllabus-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { createMatch, joinMatch, startMatch, removeMember } from "../js/utils/battle-utils.js";

initTheme();
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

const student = getActiveStudent();
if (!student?.studentId) {
  document.getElementById("shell").innerHTML = `<div class="card">আগে লগইন করো।</div>`;
  throw new Error("no active student");
}

const modeView = document.getElementById("modeView");
const createView = document.getElementById("createView");
const lobbyView = document.getElementById("lobbyView");
const joinModal = document.getElementById("joinModal");
const topicPicker = document.getElementById("topicPicker");
const errorNote = document.getElementById("errorNote");
let unsub = null;
let myTeam = null;
let scanner = null;

function showError(msg) {
  errorNote.textContent = msg;
  setTimeout(() => { errorNote.textContent = ""; }, 4000);
}

function showOnly(view) {
  modeView.classList.toggle("hidden", view !== "mode");
  createView.classList.toggle("hidden", view !== "create");
  lobbyView.classList.toggle("hidden", view !== "lobby");
}

document.getElementById("openCreateBtn").addEventListener("click", () => showOnly("create"));
document.getElementById("openJoinBtn").addEventListener("click", () => joinModal.classList.remove("hidden"));
document.getElementById("homeBtn").addEventListener("click", () => {
  unsub?.();
  stopScanner();
  showOnly("mode");
});

document.getElementById("closeJoinBtn").addEventListener("click", () => {
  stopScanner();
  joinModal.classList.add("hidden");
});
joinModal.addEventListener("click", e => { if (e.target === joinModal) { stopScanner(); joinModal.classList.add("hidden"); } });

(async () => {
  try {
    const tree = await getFullSyllabusTree();
    topicPicker.innerHTML = tree.map(subject => `
      <div class="subject-label">${esc(subject.name_bn || subject.name_en)}</div>
      ${subject.chapters.flatMap(ch => ch.topics).map(t => `
        <label class="topic-row">
          <input type="checkbox" class="topic-check" value="${esc(t.id)}">
          <span>${esc(t.name_bn || t.name_en)}</span>
        </label>
      `).join("")}
    `).join("") || `<div style="color:var(--text-muted);padding:12px;">কোনো Topic পাওয়া যায়নি।</div>`;
  } catch (e) {
    topicPicker.innerHTML = `<div style="color:var(--color-danger);padding:12px;font-weight:bold;">Topic লোড করা যায়নি।</div>`;
  }
})();

document.getElementById("createBtn").addEventListener("click", async () => {
  const topics = [...document.querySelectorAll(".topic-check:checked")].map(c => c.value);
  if (!topics.length) return showError("অন্তত ১টি Topic বেছে নাও।");
  try {
    const code = await createMatch({ hostStudentId: student.studentId, hostName: student.name, topics });
    myTeam = "A";
    enterLobby(code);
  } catch (e) { showError(e.message || "Battle তৈরি করা যায়নি।"); }
});

async function doJoin(team) {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  if (code.length !== 6) return alert("সঠিক ৬ অক্ষরের Code দাও।");
  try {
    stopScanner();
    joinModal.classList.add("hidden");
    await joinMatch(code, { studentId: student.studentId, name: student.name, team });
    myTeam = team;
    enterLobby(code);
  } catch (e) {
    joinModal.classList.remove("hidden");
    const map = { MATCH_NOT_FOUND: "এই Code-এ কোনো Battle পাওয়া যায়নি।", MATCH_ALREADY_STARTED: "এই Battle ইতিমধ্যে শুরু হয়ে গেছে।", TEAM_FULL: "এই Team পূর্ণ (৪ জন)।", ALREADY_IN_OTHER_TEAM: "তুমি আগেই অন্য Team-এ আছো।" };
    alert(map[e.message] || "Join করা যায়নি।");
  }
}
document.getElementById("joinABtn").addEventListener("click", () => doJoin("A"));
document.getElementById("joinBBtn").addEventListener("click", () => doJoin("B"));

function extractBattleCode(text) {
  const raw = String(text || "").trim().toUpperCase();
  const match = raw.match(/(?:BATTLE[:/]|CODE[:=])?([A-Z0-9]{6})$/);
  return match ? match[1] : null;
}

function stopScanner() {
  if (!scanner) return;
  scanner.stop().catch(() => {}).finally(() => {
    scanner.clear().catch(() => {});
    scanner = null;
  });
  document.getElementById("scannerArea").classList.add("hidden");
}

document.getElementById("scanQrBtn").addEventListener("click", async () => {
  const area = document.getElementById("scannerArea");
  area.classList.remove("hidden");
  if (scanner) return;
  if (typeof Html5Qrcode === "undefined") { alert("QR Scanner লোড হয়নি।"); return; }
  scanner = new Html5Qrcode("qr-reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } }, decoded => {
      const code = extractBattleCode(decoded);
      if (!code) return;
      document.getElementById("joinCodeInput").value = code;
      stopScanner();
    }, () => {});
  } catch (e) {
    scanner = null;
    alert("Camera permission দিন।");
  }
});

document.getElementById("copyCodeBtn").addEventListener("click", async () => {
  const code = document.getElementById("codeBox").textContent.trim();
  try { await navigator.clipboard.writeText(code); } catch { const ta = document.createElement("textarea"); ta.value = code; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const btn = document.getElementById("copyCodeBtn"); const old = btn.textContent; btn.textContent = "COPIED ✓"; setTimeout(() => btn.textContent = old, 1300);
});

document.getElementById("shareCodeBtn").addEventListener("click", async () => {
  const code = document.getElementById("codeBox").textContent.trim();
  const text = `আমার Battle-এ Join করো!\nBattle Code: ${code}`;
  if (navigator.share) { try { await navigator.share({ title: "Battle Invite", text }); } catch {} }
  else { try { await navigator.clipboard.writeText(text); alert("Share text Copy হয়েছে।"); } catch { alert(text); } }
});

function renderQr(code) {
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  if (window.QRCode) new QRCode(box, { text: `BATTLE:${code}`, width: 136, height: 136, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

function renderTeam(colEl, members, team, isHost, code) {
  colEl.innerHTML = (members || []).map(m => {
    const canRemove = isHost && m.studentId !== student.studentId;
    return `<div class="member-chip">
      <span>${esc(m.name)}</span>
      ${canRemove ? `<button type="button" class="member-remove" data-team="${team}" data-sid="${esc(m.studentId)}" style="background:none;border:none;color:var(--color-danger);font-weight:700;cursor:pointer;">×</button>` : ""}
    </div>`;
  }).join("") || `<div style="color:var(--text-muted);font-size:0.8rem;padding:8px 0;font-weight:bold;">EMPTY SLOT</div>`;

  colEl.querySelectorAll(".member-remove").forEach(btn => {
    btn.addEventListener("click", async () => {
      try { await removeMember(code, { hostStudentId: student.studentId, team: btn.dataset.team, studentId: btn.dataset.sid }); }
      catch (e) { showError("Member বাদ দেওয়া যায়নি।"); }
    });
  });
}

function enterLobby(code) {
  showOnly("lobby");
  document.getElementById("codeBox").textContent = code;
  renderQr(code);

  const ref = doc(db, "battleMatches", code);
  unsub = onSnapshot(ref, (snap) => {
    if (!snap.exists()) return;
    const m = snap.data();
    if (m.status === "active") {
      unsub?.();
      window.location.href = `./battle-play.html?code=${code}&team=${myTeam}`;
      return;
    }
    const isHost = student.studentId === m.hostStudentId;
    renderTeam(document.getElementById("teamACol"), m.teamA?.members, "A", isHost, code);
    renderTeam(document.getElementById("teamBCol"), m.teamB?.members, "B", isHost, code);

    const bothReady = (m.teamA?.members?.length || 0) > 0 && (m.teamB?.members?.length || 0) > 0;
    const startBtn = document.getElementById("startBtn");
    const waitingNote = document.getElementById("waitingNote");
    if (student.studentId === m.hostStudentId) {
      startBtn.classList.toggle("hidden", !bothReady);
      waitingNote.classList.add("hidden");
    } else {
      startBtn.classList.add("hidden");
      waitingNote.classList.remove("hidden");
    }
  });

  document.getElementById("startBtn").onclick = async () => {
    try { await startMatch(code); }
    catch (e) { showError(e.message || "Battle শুরু করা যায়নি।"); }
  };
}

document.getElementById("leaveLobbyBtn").addEventListener("click", () => { unsub?.(); showOnly("mode"); });
</script>
</body>
</html>
