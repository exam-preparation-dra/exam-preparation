<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Section</title><link rel="stylesheet" href="../css/style.css"><style>
body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-bn);padding-bottom:78px}.wrap{max-width:900px;margin:auto;padding:18px 14px}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.link,.btn{border:1px solid var(--surface-border);background:var(--surface);color:inherit;border-radius:11px;padding:10px 13px;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#172033,#33425b);color:white;margin-bottom:16px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#d7deea}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.panel,.item{background:var(--surface);border:1px solid var(--surface-border);border-radius:17px;padding:16px}.tile{text-align:left;color:inherit;cursor:pointer}.tile strong{display:block;margin-top:10px}.tile small,.meta,.muted{color:var(--text-muted);font-size:.82rem}.panel{margin-top:16px}.tools{display:flex;gap:8px;margin:12px 0}.tools input,.tools select{min-width:0;flex:1;padding:11px;border:1px solid var(--surface-border);border-radius:10px;background:var(--surface-highlight);color:inherit}.item{margin:10px 0}.item h3{margin:0 0 7px;font-size:1rem}.btn.primary{background:var(--color-accent);color:white}.viewer{display:none;position:fixed;inset:0;background:#0c1019ed;z-index:999;align-items:center;justify-content:center;padding:10px}.viewer.show{display:flex}.viewbox{width:min(1100px,100%);height:92dvh;background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.viewhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}.viewbox iframe{border:0;flex:1;background:white}.empty{text-align:center;color:var(--text-muted);padding:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--surface-border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));text-align:center}.bottom a{color:inherit;text-decoration:none;font-weight:800}@media(max-width:400px){.cards{grid-template-columns:1fr}}@media(min-width:700px){.wrap{padding:28px 22px}}
</style></head><body><main class="wrap">
<div class="head"><a class="link" href="./dashboard.html">← Dashboard</a><strong>Study Section</strong></div>
<section class="hero"><h1>Study Section 📚</h1><p>Batch-wise Notes and yearly Suggestions in one place.</p></section>
<div class="cards"><button class="tile" id="notes"><span style="font-size:1.8rem">📘</span><strong>Notes</strong><small>Batch → Subject → Chapter → PDF</small></button><button class="tile" id="suggestions"><span style="font-size:1.8rem">🎯</span><strong id="suggestionTitle">Suggestions</strong><small>Year-wise exam suggestions</small></button></div>
<section class="panel" id="panel" hidden><h2 id="title">Notes</h2><div class="tools"><input id="search" placeholder="Search subject or chapter"><select id="subject"><option value="">All subjects</option></select></div><div id="items" class="empty">Loading…</div></section>
</main><div class="viewer" id="viewer"><div class="viewbox"><div class="viewhead"><strong id="viewTitle">PDF Preview</strong><button class="btn" id="close">Close ✕</button></div><iframe id="frame" title="PDF preview"></iframe></div></div><nav class="bottom"><a href="./study.html">📚 Study Section</a></nav>
<script type="module">
import {db} from "../js/firebase/firebase-config.js";
import {getActiveStudent,refreshActiveStudent} from "../js/utils/student-utils.js";
import {collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const $=id=>document.getElementById(id);let all=[],mode="notes",student;const year=new Date().getFullYear();$("suggestionTitle").textContent="Suggestions "+year;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function view(url,title){$("viewTitle").textContent=title;$("frame").src=url;$("viewer").classList.add("show")}$("close").onclick=()=>{$("viewer").classList.remove("show");$("frame").src="about:blank"};
function render(){let list=all.filter(x=>mode==="notes"?(x.type||"notes")==="notes":x.type==="suggestion"&&Number(x.year)===year);const q=$("search").value.toLowerCase().trim(),sub=$("subject").value;list=list.filter(x=>(!q||`${x.subject} ${x.chapter} ${x.title||""}`.toLowerCase().includes(q))&&(!sub||x.subject===sub)).sort((a,b)=>String(a.subject).localeCompare(String(b.subject))||String(a.chapter).localeCompare(String(b.chapter)));
const subjects=[...new Set(all.filter(x=>mode==="notes"?(x.type||"notes")==="notes":x.type==="suggestion"&&Number(x.year)===year).map(x=>x.subject).filter(Boolean))].sort();const old=$("subject").value;$("subject").innerHTML='<option value="">All subjects</option>'+subjects.map(x=>`<option>${esc(x)}</option>`).join("");if(subjects.includes(old))$("subject").value=old;
$("items").innerHTML=list.length?list.map(x=>`<article class="item"><h3>${esc(x.chapter||x.title||"Study Material")}</h3><div class="meta">${esc(x.batch)} · ${esc(x.subject)}${x.type==="suggestion"?" · "+esc(x.year):""}</div><button class="btn primary" data-view="${esc(x.pdfUrl)}" data-title="${esc(x.chapter||x.title||"PDF")}">View PDF</button> <a class="btn" href="${esc(x.pdfUrl)}" target="_blank" rel="noopener">Open / Download</a></article>`).join(""):'<div class="empty">No materials published for your batch yet.</div>';
$("items").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>view(b.dataset.view,b.dataset.title));}
async function load(){try{student=await refreshActiveStudent().catch(()=>null)||getActiveStudent();if(!student){$("items").textContent="Please log in as a student first.";return;}const batch=String(student.className||student.batch||"").trim();if(!batch){$("items").textContent="Your registered batch is missing. Contact admin.";return;}const snap=await getDocs(query(collection(db,"studyMaterials"),where("batch","==",batch)));all=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.published!==false);render()}catch(e){console.error(e);$("items").textContent="Could not load study materials. Check login, batch value and Firestore Rules."}}
function setMode(m){mode=m;$("panel").hidden=false;$("title").textContent=m==="notes"?"Notes":"Suggestions "+year;$("search").value="";$("subject").value="";render()}$("notes").onclick=()=>setMode("notes");$("suggestions").onclick=()=>setMode("suggestions");$("search").oninput=render;$("subject").onchange=render;load();
</script></body></html>
