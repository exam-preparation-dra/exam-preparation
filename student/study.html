<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="../js/utils/theme-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>স্টাডি — পরীক্ষা প্রস্তুতি</title>
  <meta name="theme-color" content="#b8863c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .sp{width:100%;max-width:960px;margin:0 auto;padding:4px 0 36px}
    .sp svg{display:block}
    .sp-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;border:1px solid rgba(var(--color-accent-rgb),.28);background:linear-gradient(135deg,rgba(var(--color-accent-rgb),.2),rgba(var(--color-accent-rgb),.04) 60%),var(--surface-solid)}
    .sp-hero-ic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;color:var(--color-accent);background:rgba(var(--color-accent-rgb),.16);border:1px solid rgba(var(--color-accent-rgb),.3)}
    .sp-hero-ic svg{width:26px;height:26px}
    .sp-hero h1{font-size:1.3rem;font-weight:900;letter-spacing:-.02em;line-height:1.25}
    .sp-hero p{margin-top:3px;font-size:.76rem;font-weight:600;color:var(--text-secondary)}
    .sp-bt{margin-left:auto;flex:none;padding:5px 12px;border-radius:99px;background:rgba(var(--color-accent-rgb),.15);border:1px solid rgba(var(--color-accent-rgb),.3);color:var(--color-accent);font-size:.72rem;font-weight:800}
    .sp-tabs{display:flex;gap:4px;margin-top:14px;padding:4px;border-radius:14px;background:var(--surface-highlight);border:1px solid var(--surface-border)}
    .sp-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--text-muted);font:inherit;font-weight:800;font-size:.8rem;cursor:pointer;transition:background .15s,color .15s}
    .sp-tab svg{width:16px;height:16px}
    .sp-tab em{font-style:normal;font-family:var(--font-num);font-size:.7rem;opacity:.8}
    .sp-tab.on{background:var(--surface-solid);color:var(--color-accent);box-shadow:0 1px 0 var(--surface-edge),0 4px 12px rgba(0,0,0,.12)}
    .sp-search{position:relative;margin-top:12px}
    .sp-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-muted)}
    .sp-search input{box-sizing:border-box;width:100%;padding:12px 14px 12px 40px;border:1px solid var(--surface-border);border-radius:13px;background:var(--surface-solid);color:var(--text-primary);font:inherit;font-size:.85rem;outline-color:var(--color-accent)}
    .sp-chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .sp-chips::-webkit-scrollbar{display:none}
    .sp-chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--surface-border);background:var(--surface-solid);color:var(--text-secondary);font:inherit;font-size:.75rem;font-weight:800;cursor:pointer;white-space:nowrap}
    .sp-chip.on{background:rgba(var(--color-accent-rgb),.16);border-color:var(--color-accent);color:var(--color-accent)}
    .sp-sub{display:flex;align-items:center;gap:9px;margin:22px 2px 4px;font-size:.95rem;font-weight:900}
    .sp-sub i{width:4px;height:17px;border-radius:4px;background:var(--color-accent)}
    .sp-sub small{margin-left:auto;font-size:.7rem;color:var(--text-muted);font-weight:800}
    .sp-ch{margin:12px 2px 6px;font-size:.72rem;font-weight:800;color:var(--text-muted);letter-spacing:.04em}
    .sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    @media(max-width:560px){.sp-grid{grid-template-columns:1fr}}
    .sp-card{position:relative;display:flex;gap:12px;align-items:center;padding:12px 8px 12px 12px;border:1px solid var(--surface-border);border-radius:16px;background:var(--surface-solid);transition:border-color .15s,transform .15s}
    .sp-card:hover{border-color:rgba(var(--color-accent-rgb),.6)}
    .sp-open{display:flex;flex:1;min-width:0;gap:12px;align-items:center;padding:0;border:0;background:none;text-align:left;font:inherit;color:var(--text-primary);cursor:pointer}
    .sp-open:active{opacity:.8}
    .sp-ico{flex:none;display:grid;place-items:center;width:44px;height:50px;border-radius:12px;color:var(--color-accent);background:rgba(var(--color-accent-rgb),.12);border:1px solid rgba(var(--color-accent-rgb),.25)}
    .sp-ico svg{width:21px;height:21px}
    .sp-main{flex:1;min-width:0}
    .sp-main b{display:block;font-size:.86rem;font-weight:850;line-height:1.45;overflow-wrap:anywhere}
    .sp-main span{display:block;margin-top:2px;font-size:.7rem;font-weight:700;color:var(--text-muted);overflow-wrap:anywhere}
    .sp-save{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--text-muted);cursor:pointer}
    .sp-save svg{width:19px;height:19px}
    .sp-save:hover{background:var(--surface-highlight)}
    .sp-save.on{color:var(--color-accent);background:rgba(var(--color-accent-rgb),.14)}
    .sp-save.on svg{fill:currentColor}
    .sp-empty{margin-top:22px;padding:36px 16px;text-align:center;border:1px dashed var(--surface-border);border-radius:18px;color:var(--text-muted);font-size:.84rem;line-height:1.8}
    .sp-empty svg{width:38px;height:38px;margin:0 auto 10px;color:var(--color-accent);opacity:.8}
    .fd-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px;border-radius:14px;border:1px dashed rgba(var(--color-accent-rgb),.5);background:rgba(var(--color-accent-rgb),.07);color:var(--color-accent);font:inherit;font-weight:850;font-size:.85rem;cursor:pointer}
    .fd-new svg{width:18px;height:18px}
    .fd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    @media(min-width:700px){.fd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .fd{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--surface-border);border-radius:18px;background:var(--surface-solid);text-align:left;font:inherit;color:var(--text-primary);cursor:pointer;min-width:0}
    .fd:hover{border-color:rgba(var(--color-accent-rgb),.6)}
    .fd-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;color:var(--color-accent);background:rgba(var(--color-accent-rgb),.13)}
    .fd-ic svg{width:24px;height:24px}
    .fd b{font-size:.88rem;font-weight:850;overflow-wrap:anywhere;line-height:1.35}
    .fd span{font-size:.7rem;font-weight:700;color:var(--text-muted)}
    .fd-bar{display:flex;align-items:center;gap:8px;margin-top:14px}
    .fd-bar h2{flex:1;min-width:0;font-size:1.05rem;font-weight:900;overflow-wrap:anywhere}
    .ib{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;min-width:38px;padding:0 11px;border-radius:11px;border:1px solid var(--surface-border);background:var(--surface-solid);color:var(--text-secondary);font:inherit;font-size:.76rem;font-weight:800;cursor:pointer;text-decoration:none}
    .ib svg{width:17px;height:17px}
    .ib.danger{color:#e5604f}
    .ib:active{background:var(--surface-highlight)}
    .ov{display:none;position:fixed;inset:0;z-index:300;background:rgba(6,8,12,.7);align-items:flex-end;justify-content:center}
    .ov.show{display:flex}
    .sheet{width:min(100%,460px);max-height:86vh;overflow:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--surface-solid);color:var(--text-primary);border:1px solid var(--surface-border);box-shadow:0 -14px 40px rgba(0,0,0,.35)}
    @media(min-width:600px){.ov{align-items:center}.sheet{border-radius:24px}}
    .sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--surface-border);margin:0 auto 12px}
    .sheet h3{font-size:1rem;font-weight:900}
    .sheet p.s{margin-top:3px;font-size:.74rem;font-weight:600;color:var(--text-muted)}
    .pick{display:flex;flex-direction:column;gap:7px;margin-top:14px}
    .pk{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;border:1px solid var(--surface-border);background:var(--surface-highlight);color:var(--text-primary);font:inherit;text-align:left;cursor:pointer}
    .pk .fi{flex:none;color:var(--color-accent)}
    .pk .fi svg{width:21px;height:21px}
    .pk b{flex:1;min-width:0;font-size:.84rem;font-weight:800;overflow-wrap:anywhere}
    .pk .ck{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--text-muted);color:transparent}
    .pk .ck svg{width:14px;height:14px}
    .pk.on{border-color:var(--color-accent);background:rgba(var(--color-accent-rgb),.1)}
    .pk.on .ck{background:var(--color-accent);border-color:var(--color-accent);color:#1d1608}
    .nf{display:flex;gap:8px;margin-top:14px}
    .nf input{flex:1;min-width:0;padding:12px 13px;border-radius:12px;border:1px solid var(--surface-border);background:var(--surface-highlight);color:var(--text-primary);font:inherit;font-size:.85rem;outline-color:var(--color-accent)}
    .pbtn{flex:none;padding:0 16px;min-height:44px;border-radius:12px;border:0;background:var(--color-accent);color:#1d1608;font:inherit;font-weight:850;font-size:.82rem;cursor:pointer}
    .sheet .done{width:100%;margin-top:14px}
    .sv{display:none;position:fixed;inset:0;z-index:310;background:rgba(6,8,12,.86);align-items:center;justify-content:center;padding:10px}
    .sv.show{display:flex}
    .sv-box{display:flex;flex-direction:column;width:min(1080px,100%);height:min(95dvh,920px);overflow:hidden;border-radius:18px;background:var(--surface-solid);border:1px solid var(--surface-border);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .sv-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--surface-border)}
    .sv-t{flex:1;min-width:0}
    .sv-t b{display:block;font-size:.86rem;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sv-t span{display:block;font-size:.68rem;font-weight:700;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sv-body{position:relative;flex:1;min-height:0;background:var(--surface-highlight)}
    .sv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .sv-load{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--text-muted);font-size:.78rem;font-weight:600}
    .sv-block{position:absolute;top:0;right:0;width:64px;height:56px;z-index:2}
    [hidden]{display:none!important}
  </style>
  <script src="../js/utils/nav-boot.js"></script>
  <link rel="stylesheet" href="../css/desktop.css">
  <script src="../js/utils/desktop-layout.js" defer></script>
  <script src="../js/popup.js"></script>
</head>
<body data-page="study">
  <div class="app-shell app-shell--wide" id="shell">
    <div class="state-block"><div class="spinner"></div><p>লোড হচ্ছে…</p></div>
  </div>
  <div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
  <div class="sv" id="sv" role="dialog" aria-modal="true">
    <div class="sv-box">
      <div class="sv-head">
        <div class="sv-t"><b id="svT"></b><span id="svS"></span></div>
        <button class="ib" id="svX" aria-label="বন্ধ করো"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sv-body"><div class="sv-load">লোড হচ্ছে…</div><div class="sv-block" aria-hidden="true"></div><iframe id="svF" title="নোট" allow="autoplay" referrerpolicy="no-referrer"></iframe></div>
    </div>
  </div>
  <script type="module">
    import { initTheme, renderStudentHeader, showToast } from "../js/utils/ui-utils.js";
    import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";
    import { normalizeBatch } from "../js/utils/batch-utils.js";
    import { materialLinks } from "../js/utils/drive-utils.js";
    import { db } from "../js/firebase/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    initTheme();
    const shell = document.getElementById("shell");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let student = getActiveStudent();
    const S = { tab: "notes", subject: "", year: "", q: "", items: [], folders: [], openFolder: null };

    const svg = (p, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
    const IC = {
      file: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'),
      book: svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19V5.5M8 7h8"/>'),
      target: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
      folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
      plus: svg('<path d="M12 5v14M5 12h14"/>'),
      search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
      mark: svg('<path d="M6 3h12v18l-6-4.5L6 21z"/>'),
      check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'stroke-width="3"'),
      back: svg('<path d="M15 6l-6 6 6 6"/>'),
      edit: svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>'),
      trash: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
      grad: svg('<path d="M2 9.5 12 4.5l10 5-10 5-10-5z"/><path d="M6 12v4.5c0 1.4 2.7 3 6 3s6-1.6 6-3V12"/>')
    };
    const dt = (t) => { try { const d = t?.toDate ? t.toDate() : null; return d ? d.toLocaleDateString("bn-BD", { day: "numeric", month: "short", year: "numeric" }) : ""; } catch { return ""; } };

    /* ---------- personal folders: this device only (localStorage, ids only) ---------- */
    const FKEY = () => "epStudyFolders:" + (student?.studentId || student?.docId || "x");
    function loadFolders() { try { const v = JSON.parse(localStorage.getItem(FKEY()) || "[]"); S.folders = Array.isArray(v) ? v : []; } catch { S.folders = []; } }
    function saveFolders() { try { localStorage.setItem(FKEY(), JSON.stringify(S.folders)); } catch { showToast("এই ডিভাইসে সেভ করা গেল না।", "error"); } }
    const uid = () => "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const inFolders = (id) => S.folders.filter(f => f.items.includes(id));
    const byId = (id) => S.items.find(x => x.id === id);

    async function load() {
      const b = normalizeBatch(student.className);
      const map = new Map();
      const run = async (q) => { try { (await getDocs(q)).forEach(d => map.set(d.id, { id: d.id, ...d.data() })); } catch (e) { console.error(e); } };
      const col = collection(db, "studyMaterials");
      await Promise.all([
        run(query(col, where("batches", "array-contains-any", b ? [b, "all"] : ["all"]))),
        student.className ? run(query(col, where("batch", "==", student.className))) : null,
        run(query(col, where("batch", "==", "all")))
      ]);
      S.items = [...map.values()].filter(x => x.published !== false && materialLinks(x).preview)
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    }

    const card = (x, inFolder) => {
      const saved = inFolders(x.id).length;
      return `<div class="sp-card">
        <button class="sp-open" data-open="${esc(x.id)}"><span class="sp-ico">${IC.file}</span>
          <span class="sp-main"><b>${esc(x.title || x.topic || "নোট")}</b>
            <span>${esc([x.topic, x.year, dt(x.createdAt)].filter(Boolean).join(" • "))}</span>
            ${x.description ? `<span>${esc(x.description)}</span>` : ""}</span></button>
        ${inFolder
          ? `<button class="sp-save" data-rm="${esc(x.id)}" aria-label="ফোল্ডার থেকে সরাও">${IC.trash}</button>`
          : `<button class="sp-save ${saved ? "on" : ""}" data-save="${esc(x.id)}" aria-label="ফোল্ডারে রাখো">${IC.mark}</button>`}
      </div>`;
    };

    function libraryView() {
      const list = S.items.filter(x => (x.type || "notes") === S.tab);
      const sug = S.tab === "suggestion";
      const subs = [...new Set(list.map(x => x.subject || "অন্যান্য"))];
      const years = sug ? [...new Set(list.map(x => String(x.year || "").trim()).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true })) : [];
      const q = S.q.trim().toLowerCase();
      const shown = list.filter(x => (!S.subject || (x.subject || "অন্যান্য") === S.subject) &&
        (!S.year || String(x.year || "").trim() === S.year) &&
        (!q || [x.title, x.subject, x.chapter, x.topic, x.description, x.year].join(" ").toLowerCase().includes(q)));
      let body;
      if (sug) {
        const byYear = {};
        shown.forEach(x => { const y = String(x.year || "").trim() || "অন্যান্য"; ((byYear[y] ||= {})[x.subject || "অন্যান্য"] ||= []).push(x); });
        const ys = Object.keys(byYear).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        body = ys.length ? ys.map(y => {
          const total = Object.values(byYear[y]).reduce((a, v) => a + v.length, 0);
          return `<div class="sp-sub"><i></i>${esc(y)}<small>${total}টি</small></div>` +
            Object.entries(byYear[y]).map(([s, arr]) => `<div class="sp-ch">${esc(s)}</div><div class="sp-grid">${arr.map(x => card(x)).join("")}</div>`).join("");
        }).join("") : `<div class="sp-empty">${IC.target}${S.items.length ? "এই ফিল্টারে কিছু পাওয়া যায়নি।" : "এখনো তোমার ব্যাচের জন্য কোনো সাজেশন দেওয়া হয়নি।"}</div>`;
      } else {
        const bySub = {};
        shown.forEach(x => { const s = x.subject || "অন্যান্য"; ((bySub[s] ||= {})[x.chapter || ""] ||= []).push(x); });
        body = Object.keys(bySub).length ? Object.entries(bySub).map(([s, chs]) => {
          const total = Object.values(chs).reduce((a, v) => a + v.length, 0);
          return `<div class="sp-sub"><i></i>${esc(s)}<small>${total}টি</small></div>` +
            Object.entries(chs).map(([c, arr]) => (c ? `<div class="sp-ch">${esc(c)}</div>` : "") + `<div class="sp-grid">${arr.map(x => card(x)).join("")}</div>`).join("");
        }).join("") : `<div class="sp-empty">${IC.book}${S.items.length ? "এই ফিল্টারে কিছু পাওয়া যায়নি।" : "এখনো তোমার ব্যাচের জন্য কিছু দেওয়া হয়নি।<br>নতুন নোট এলেই এখানে দেখতে পাবে।"}</div>`;
      }
      const chip = (k, v, label, on) => `<button class="sp-chip ${on ? "on" : ""}" data-${k}="${esc(v)}">${esc(label)}</button>`;
      return `<div class="sp-search">${IC.search}<input id="q" type="search" placeholder="${sug ? "সাজেশন, বছর বা বিষয় খোঁজো" : "নোট, চ্যাপ্টার বা টপিক খোঁজো"}" value="${esc(S.q)}"></div>
        ${years.length ? `<div class="sp-chips">${chip("y", "", "সব বছর", !S.year)}${years.map(y => chip("y", y, y, S.year === y)).join("")}</div>` : ""}
        ${subs.length > 1 ? `<div class="sp-chips">${chip("s", "", "সব বিষয়", !S.subject)}${subs.map(s => chip("s", s, s, S.subject === s)).join("")}</div>` : ""}${body}`;
    }

    function foldersView() {
      const f = S.folders.find(x => x.id === S.openFolder);
      if (f) {
        const items = f.items.map(byId).filter(Boolean);
        return `<div class="fd-bar"><button class="ib" id="fdBack" aria-label="ফিরে যাও">${IC.back}</button><h2>${esc(f.name)}</h2>
          <button class="ib" id="fdRen" aria-label="নাম বদলাও">${IC.edit}</button><button class="ib danger" id="fdDel" aria-label="ফোল্ডার মুছো">${IC.trash}</button></div>
          ${items.length ? `<div class="sp-grid" style="margin-top:14px">${items.map(x => card(x, true)).join("")}</div>`
          : `<div class="sp-empty">${IC.folder}ফোল্ডারটা খালি।<br>নোটস ট্যাবে নোটের পাশের মার্ক বাটন চেপে এখানে রাখো।</div>`}`;
      }
      return `<button class="fd-new" id="fdNew">${IC.plus}নতুন ফোল্ডার</button>
        ${S.folders.length ? `<div class="fd-grid">${S.folders.map(x => `<button class="fd" data-fd="${esc(x.id)}"><span class="fd-ic">${IC.folder}</span><b>${esc(x.name)}</b><span>${x.items.filter(byId).length}টি ফাইল</span></button>`).join("")}</div>`
        : `<div class="sp-empty">${IC.folder}তোমার নিজের ফোল্ডার বানাও, যেমন "Physics Revision"।<br>পছন্দের নোট সাজিয়ে রাখো। এগুলো শুধু এই ডিভাইসে থাকে।</div>`}`;
    }

    function draw() {
      const batch = normalizeBatch(student.className);
      const cnt = (t) => S.items.filter(x => (x.type || "notes") === t).length;
      const tab = (k, ic, label, n) => `<button class="sp-tab ${S.tab === k ? "on" : ""}" data-t="${k}">${ic}${label}<em>${n}</em></button>`;
      shell.innerHTML = renderStudentHeader(student, "study") + `
      <div class="sp">
        <div class="sp-hero"><span class="sp-hero-ic">${IC.grad}</span><div><h1>স্টাডি নোটস</h1><p>তোমার ব্যাচের নোট ও সাজেশন</p></div>${batch ? `<span class="sp-bt">${esc(batch)}</span>` : ""}</div>
        <div class="sp-tabs">${tab("notes", IC.book, "নোটস", cnt("notes"))}${tab("suggestion", IC.target, "সাজেশন", cnt("suggestion"))}${tab("folders", IC.folder, "ফোল্ডার", S.folders.length)}</div>
        ${S.tab === "folders" ? foldersView() : libraryView()}
      </div>`;
      bind();
    }

    function bind() {
      const $$ = (s, f) => shell.querySelectorAll(s).forEach(f);
      $$(".sp-tab", b => b.onclick = () => { S.tab = b.dataset.t; S.subject = ""; S.year = ""; S.q = ""; S.openFolder = null; draw(); });
      $$(".sp-chip", b => b.onclick = () => { if ("y" in b.dataset) S.year = b.dataset.y; else S.subject = b.dataset.s; draw(); });
      $$("[data-open]", b => b.onclick = () => openViewer(byId(b.dataset.open)));
      $$("[data-save]", b => b.onclick = () => saveSheet(b.dataset.save));
      $$("[data-rm]", b => b.onclick = () => { const f = S.folders.find(x => x.id === S.openFolder); if (f) { f.items = f.items.filter(i => i !== b.dataset.rm); saveFolders(); draw(); } });
      $$("[data-fd]", b => b.onclick = () => { S.openFolder = b.dataset.fd; draw(); });
      const qi = document.getElementById("q");
      if (qi) qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; draw(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p, p); };
      const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
      on("fdNew", () => nameSheet("নতুন ফোল্ডার", "", (n) => { S.folders.unshift({ id: uid(), name: n, items: [], createdAt: Date.now() }); saveFolders(); draw(); }));
      on("fdBack", () => { S.openFolder = null; draw(); });
      on("fdRen", () => { const f = S.folders.find(x => x.id === S.openFolder); nameSheet("ফোল্ডারের নাম", f.name, (n) => { f.name = n; saveFolders(); draw(); }); });
      on("fdDel", () => { const f = S.folders.find(x => x.id === S.openFolder); confirmSheet(`"${f.name}" ফোল্ডার মুছবে? নোটগুলো লাইব্রেরিতেই থাকবে।`, () => { S.folders = S.folders.filter(x => x !== f); S.openFolder = null; saveFolders(); draw(); }); });
    }

    /* ---------- sheets ---------- */
    const ov = document.getElementById("ov"), sheet = document.getElementById("sheet");
    const showSheet = (html) => { sheet.innerHTML = `<div class="grab"></div>` + html; ov.classList.add("show"); };
    const hideSheet = () => ov.classList.remove("show");
    ov.addEventListener("click", e => { if (e.target === ov) hideSheet(); });

    function nameSheet(title, val, ok) {
      showSheet(`<h3>${esc(title)}</h3><p class="s">নিজের পছন্দমতো নাম দাও</p>
        <div class="nf"><input id="nm" maxlength="40" placeholder="যেমন: ${esc(student?.name?.split(" ")[0] || "আমার")}'s Notes" value="${esc(val)}"><button class="pbtn" id="nmOk">সেভ</button></div>`);
      const i = document.getElementById("nm"); i.focus(); i.select();
      const go = () => { const n = i.value.trim(); if (!n) return; hideSheet(); ok(n); };
      document.getElementById("nmOk").onclick = go; i.onkeydown = e => { if (e.key === "Enter") go(); };
    }
    function confirmSheet(msg, ok) {
      showSheet(`<h3>নিশ্চিত করো</h3><p class="s">${esc(msg)}</p><div class="nf"><button class="ib" id="cNo" style="flex:1">না</button><button class="pbtn" id="cYes" style="flex:1;background:#e5604f;color:#fff">হ্যাঁ, মুছো</button></div>`);
      document.getElementById("cNo").onclick = hideSheet; document.getElementById("cYes").onclick = () => { hideSheet(); ok(); };
    }
    function saveSheet(id) {
      const x = byId(id); if (!x) return;
      const render = () => {
        showSheet(`<h3>ফোল্ডারে রাখো</h3><p class="s">${esc(x.title || "নোট")} — একাধিক ফোল্ডারেও রাখা যায়</p>
          <div class="pick">${S.folders.map(f => `<button class="pk ${f.items.includes(id) ? "on" : ""}" data-p="${esc(f.id)}"><span class="fi">${IC.folder}</span><b>${esc(f.name)}</b><span class="ck">${IC.check}</span></button>`).join("")}</div>
          <div class="nf"><input id="nm" maxlength="40" placeholder="নতুন ফোল্ডারের নাম"><button class="pbtn" id="nmOk">তৈরি</button></div>
          <button class="pbtn done" id="dn">হয়েছে</button>`);
        sheet.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
          const f = S.folders.find(z => z.id === b.dataset.p);
          f.items = f.items.includes(id) ? f.items.filter(i => i !== id) : [...f.items, id];
          saveFolders(); render();
        });
        const add = () => { const n = document.getElementById("nm").value.trim(); if (!n) return; S.folders.unshift({ id: uid(), name: n, items: [id], createdAt: Date.now() }); saveFolders(); render(); };
        document.getElementById("nmOk").onclick = add;
        document.getElementById("nm").onkeydown = e => { if (e.key === "Enter") add(); };
        document.getElementById("dn").onclick = () => { hideSheet(); draw(); };
      };
      render();
    }

    /* ---------- viewer ---------- */
    const sv = document.getElementById("sv"), svF = document.getElementById("svF");
    function openViewer(x) {
      if (!x) return;
      const l = materialLinks(x);
      if (!l.preview) return showToast("লিংক পাওয়া যায়নি।", "error");
      document.getElementById("svT").textContent = x.title || "নোট";
      document.getElementById("svS").textContent = [x.subject, x.chapter].filter(Boolean).join(" › ");
      svF.src = l.preview; sv.classList.add("show"); document.body.style.overflow = "hidden";
    }
    function closeViewer() { sv.classList.remove("show"); svF.src = "about:blank"; document.body.style.overflow = ""; }
    document.getElementById("svX").onclick = closeViewer;
    sv.addEventListener("click", e => { if (e.target === sv) closeViewer(); });
    document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (ov.classList.contains("show")) hideSheet(); else if (sv.classList.contains("show")) closeViewer(); });

    async function start() {
      if (!student) { window.location.href = "../index.html"; return; }
      try { const fresh = await refreshActiveStudent(student.docId); if (fresh) student = fresh; } catch {}
      loadFolders();
      shell.innerHTML = renderStudentHeader(student, "study") + `<div class="state-block"><div class="spinner"></div><p>নোট লোড হচ্ছে…</p></div>`;
      await load(); draw();
    }
    start();
  </script>
</body>
</html>
