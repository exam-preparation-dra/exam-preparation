<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="../js/utils/theme-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>স্টাডি নোটস — পরীক্ষা প্রস্তুতি</title>
  <meta name="theme-color" content="#b8863c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .sp{width:100%;max-width:960px;margin:0 auto;padding:4px 0 32px}
    .sp-hero{position:relative;overflow:hidden;padding:20px 18px;border-radius:22px;color:#211a0d;background:linear-gradient(135deg,#e9c987,#b8863c);box-shadow:0 14px 34px rgba(var(--color-accent-rgb),.25)}
    .sp-hero:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22)}
    .sp-hero h1{position:relative;font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
    .sp-hero p{position:relative;margin-top:4px;font-size:.8rem;font-weight:700;opacity:.8}
    .sp-bt{position:relative;display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.55);font-size:.74rem;font-weight:800}
    .sp-tabs{display:flex;gap:6px;margin-top:16px;padding:4px;border-radius:14px;background:var(--surface-highlight);border:1px solid var(--surface-border)}
    .sp-tab{flex:1;padding:10px;border:0;border-radius:11px;background:transparent;color:var(--text-secondary);font:inherit;font-weight:800;font-size:.85rem;cursor:pointer}
    .sp-tab.on{background:var(--surface-solid);color:var(--color-accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .sp-search{box-sizing:border-box;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--surface-border);border-radius:13px;background:var(--surface-solid);color:var(--text-primary);font:inherit;font-size:.86rem;outline-color:var(--color-accent)}
    .sp-chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .sp-chips::-webkit-scrollbar{display:none}
    .sp-chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--surface-border);background:var(--surface-solid);color:var(--text-secondary);font:inherit;font-size:.76rem;font-weight:800;cursor:pointer;white-space:nowrap}
    .sp-chip.on{background:var(--color-accent);border-color:var(--color-accent);color:#211a0d}
    .sp-sub{display:flex;align-items:center;gap:8px;margin:22px 2px 4px;font-size:.98rem;font-weight:900}
    .sp-sub i{width:4px;height:18px;border-radius:4px;background:var(--color-accent)}
    .sp-sub small{margin-left:auto;font-size:.7rem;color:var(--text-muted);font-weight:800}
    .sp-ch{margin:12px 2px 6px;font-size:.74rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
    .sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    @media(max-width:560px){.sp-grid{grid-template-columns:1fr}}
    .sp-card{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--surface-border);border-radius:16px;background:var(--surface-solid);text-align:left;font:inherit;color:var(--text-primary);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
    .sp-card:hover{border-color:var(--color-accent);box-shadow:0 8px 22px rgba(var(--color-accent-rgb),.14)}
    .sp-card:active{transform:scale(.985)}
    .sp-ico{flex:none;display:grid;place-items:center;width:46px;height:52px;border-radius:12px;color:var(--color-accent);background:linear-gradient(145deg,rgba(var(--color-accent-rgb),.22),rgba(var(--color-accent-rgb),.06));border:1px solid rgba(var(--color-accent-rgb),.28)}
    .sp-ico svg{width:22px;height:22px}
    .sp-main{flex:1;min-width:0}
    .sp-main b{display:block;font-size:.88rem;font-weight:850;line-height:1.45;overflow-wrap:anywhere}
    .sp-main span{display:block;margin-top:3px;font-size:.72rem;font-weight:700;color:var(--text-muted);overflow-wrap:anywhere}
    .sp-tag{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:99px;background:var(--color-accent-soft);color:var(--color-accent);font-size:.68rem;font-weight:800}
    .sp-go{flex:none;color:var(--text-muted);font-size:1.2rem;font-weight:800}
    .sp-empty{margin-top:22px;padding:34px 16px;text-align:center;border:1px dashed var(--surface-border);border-radius:18px;color:var(--text-muted);font-size:.85rem;line-height:1.8}
    .sp-empty b{display:block;font-size:2rem;margin-bottom:6px}
    .sv{display:none;position:fixed;inset:0;z-index:300;background:rgba(10,13,18,.82);align-items:center;justify-content:center;padding:12px}
    .sv.show{display:flex}
    .sv-box{display:flex;flex-direction:column;width:min(1080px,100%);height:min(94dvh,920px);overflow:hidden;border-radius:18px;background:var(--surface-solid);border:1px solid var(--surface-border);box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .sv-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--surface-border)}
    .sv-t{flex:1;min-width:0}
    .sv-t b{display:block;font-size:.88rem;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sv-t span{display:block;font-size:.7rem;font-weight:700;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sv-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--surface-border);background:var(--surface-solid);color:var(--text-primary);font:inherit;font-size:.74rem;font-weight:800;text-decoration:none;cursor:pointer}
    .sv-x{width:36px;padding:0;font-size:1rem}
    .sv-body{position:relative;flex:1;min-height:0;background:#fff}
    .sv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .sv-load{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:.8rem;pointer-events:none}
    [hidden]{display:none!important}
  </style>
  <script src="../js/utils/nav-boot.js"></script>
  <link rel="stylesheet" href="../css/desktop.css">
  <script src="../js/utils/desktop-layout.js" defer></script>
  <script src="../js/popup.js"></script>
</head>
<body data-page="study">
  <div class="app-shell app-shell--wide" id="shell">
    <div class="state-block"><div class="spinner"></div><p>লোড হচ্ছে…</p></div>
  </div>
  <div class="sv" id="sv" role="dialog" aria-modal="true">
    <div class="sv-box">
      <div class="sv-head">
        <div class="sv-t"><b id="svT"></b><span id="svS"></span></div>
        <a class="sv-btn" id="svOpen" target="_blank" rel="noopener noreferrer">নতুন ট্যাবে ↗</a>
        <button class="sv-btn sv-x" id="svX" aria-label="বন্ধ করো">✕</button>
      </div>
      <div class="sv-body"><div class="sv-load">লোড হচ্ছে… না এলে "নতুন ট্যাবে" চাপো</div><iframe id="svF" title="নোট" allow="autoplay" referrerpolicy="no-referrer"></iframe></div>
    </div>
  </div>
  <script type="module">
    import { initTheme, renderStudentHeader, showToast } from "../js/utils/ui-utils.js";
    import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";
    import { normalizeBatch } from "../js/utils/batch-utils.js";
    import { materialLinks } from "../js/utils/drive-utils.js";
    import { db } from "../js/firebase/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    initTheme();
    const shell = document.getElementById("shell");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let student = getActiveStudent();
    const S = { type: "notes", subject: "", q: "", items: [] };
    const FILE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>`;
    const dt = (t) => { try { const d = t?.toDate ? t.toDate() : null; return d ? d.toLocaleDateString("bn-BD", { day: "numeric", month: "short", year: "numeric" }) : ""; } catch { return ""; } };

    async function load() {
      const b = normalizeBatch(student.className);
      const map = new Map();
      const run = async (q) => { try { (await getDocs(q)).forEach(d => map.set(d.id, { id: d.id, ...d.data() })); } catch (e) { console.error(e); } };
      const col = collection(db, "studyMaterials");
      await Promise.all([
        run(query(col, where("batches", "array-contains-any", b ? [b, "all"] : ["all"]))),
        student.className ? run(query(col, where("batch", "==", student.className))) : null,
        run(query(col, where("batch", "==", "all")))
      ]);
      S.items = [...map.values()].filter(x => x.published !== false && materialLinks(x).preview)
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    }

    function draw() {
      const batch = normalizeBatch(student.className);
      const list = S.items.filter(x => (x.type || "notes") === S.type);
      const subs = [...new Set(list.map(x => x.subject || "অন্যান্য"))];
      const q = S.q.trim().toLowerCase();
      const shown = list.filter(x => (!S.subject || (x.subject || "অন্যান্য") === S.subject) &&
        (!q || [x.title, x.subject, x.chapter, x.topic, x.description].join(" ").toLowerCase().includes(q)));
      const nNotes = S.items.filter(x => (x.type || "notes") === "notes").length;
      const nSug = S.items.length - nNotes;

      const bySub = {};
      shown.forEach(x => { const s = x.subject || "অন্যান্য"; const c = x.chapter || ""; ((bySub[s] ||= {})[c] ||= []).push(x); });

      const cards = (arr) => `<div class="sp-grid">${arr.map(x => `
        <button class="sp-card" data-id="${esc(x.id)}">
          <span class="sp-ico">${FILE}</span>
          <span class="sp-main"><b>${esc(x.title || x.topic || "নোট")}</b>
            <span>${esc([x.topic, x.year, dt(x.createdAt)].filter(Boolean).join(" • "))}</span>
            ${x.description ? `<span>${esc(x.description)}</span>` : ""}
            ${x.topic ? `<span class="sp-tag">${esc(x.topic)}</span>` : ""}</span>
          <span class="sp-go">›</span></button>`).join("")}</div>`;

      const body = Object.keys(bySub).length ? Object.entries(bySub).map(([s, chs]) => {
        const total = Object.values(chs).reduce((a, v) => a + v.length, 0);
        return `<div class="sp-sub"><i></i>${esc(s)}<small>${total}টি</small></div>` +
          Object.entries(chs).map(([c, arr]) => (c ? `<div class="sp-ch">${esc(c)}</div>` : "") + cards(arr)).join("");
      }).join("") : `<div class="sp-empty"><b>📚</b>${S.items.length ? "এই ফিল্টারে কিছু পাওয়া যায়নি।" : "এখনো তোমার ব্যাচের জন্য কিছু দেওয়া হয়নি।<br>নতুন নোট এলেই এখানে দেখতে পাবে।"}</div>`;

      shell.innerHTML = renderStudentHeader(student, "study") + `
      <div class="sp">
        <div class="sp-hero"><h1>স্টাডি নোটস</h1><p>তোমার ব্যাচের জন্য স্যারের দেওয়া নোট ও সাজেশন</p>${batch ? `<span class="sp-bt">${esc(batch)}</span>` : ""}</div>
        <div class="sp-tabs"><button class="sp-tab ${S.type === "notes" ? "on" : ""}" data-t="notes">📘 নোটস (${nNotes})</button><button class="sp-tab ${S.type === "suggestion" ? "on" : ""}" data-t="suggestion">🎯 সাজেশন (${nSug})</button></div>
        <input class="sp-search" id="q" type="search" placeholder="🔍 নোট, চ্যাপ্টার বা টপিক খোঁজো" value="${esc(S.q)}">
        ${subs.length > 1 ? `<div class="sp-chips"><button class="sp-chip ${!S.subject ? "on" : ""}" data-s="">সব</button>${subs.map(s => `<button class="sp-chip ${S.subject === s ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
        ${body}
      </div>`;

      shell.querySelectorAll(".sp-tab").forEach(b => b.onclick = () => { S.type = b.dataset.t; S.subject = ""; draw(); });
      shell.querySelectorAll(".sp-chip").forEach(b => b.onclick = () => { S.subject = b.dataset.s; draw(); });
      const qi = document.getElementById("q");
      qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; draw(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
      shell.querySelectorAll(".sp-card").forEach(b => b.onclick = () => openViewer(S.items.find(x => x.id === b.dataset.id)));
    }

    const sv = document.getElementById("sv"), svF = document.getElementById("svF");
    function openViewer(x) {
      if (!x) return;
      const l = materialLinks(x);
      if (!l.preview) return showToast("লিংক পাওয়া যায়নি।", "error");
      document.getElementById("svT").textContent = x.title || "নোট";
      document.getElementById("svS").textContent = [x.subject, x.chapter].filter(Boolean).join(" › ");
      document.getElementById("svOpen").href = l.open;
      svF.src = l.preview;
      sv.classList.add("show"); document.body.style.overflow = "hidden";
    }
    function closeViewer() { sv.classList.remove("show"); svF.src = "about:blank"; document.body.style.overflow = ""; }
    document.getElementById("svX").onclick = closeViewer;
    sv.addEventListener("click", e => { if (e.target === sv) closeViewer(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && sv.classList.contains("show")) closeViewer(); });

    async function start() {
      if (!student) { window.location.href = "../index.html"; return; }
      try { const fresh = await refreshActiveStudent(student.docId); if (fresh) student = fresh; } catch {}
      shell.innerHTML = renderStudentHeader(student, "study") + `<div class="state-block"><div class="spinner"></div><p>নোট লোড হচ্ছে…</p></div>`;
      await load(); draw();
    }
    start();
  </script>
</body>
</html>
