<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="../js/utils/theme-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>স্টাডি সেকশন — পরীক্ষা প্রস্তুতি</title>
  <meta name="theme-color" content="#b8863c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .ud { min-height:62vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 20px; }
    .ud-ico { position:relative; display:grid; place-items:center; width:96px; height:96px; border-radius:28px; color:var(--color-accent);
      background:linear-gradient(145deg, rgba(var(--color-accent-rgb),.22), rgba(var(--color-accent-rgb),.06));
      border:1px solid rgba(var(--color-accent-rgb),.32); box-shadow:0 14px 34px rgba(var(--color-accent-rgb),.18); animation:udFloat 3.4s ease-in-out infinite; }
    @keyframes udFloat { 50% { transform:translateY(-7px); } }
    .ud-badge { display:inline-flex; align-items:center; gap:7px; margin-top:26px; padding:6px 13px; border-radius:999px; font-size:.7rem; font-weight:800; letter-spacing:.05em;
      color:var(--color-accent); background:rgba(var(--color-accent-rgb),.13); border:1px solid rgba(var(--color-accent-rgb),.3); }
    .ud-badge i { width:7px; height:7px; border-radius:50%; background:var(--color-accent); animation:udPulse 1.6s ease-in-out infinite; }
    @keyframes udPulse { 50% { opacity:.3; transform:scale(.7); } }
    .ud h1 { margin-top:14px; font-size:clamp(1.5rem,5vw,2.1rem); line-height:1.3; font-weight:900; letter-spacing:-.02em; color:var(--text-primary); }
    .ud p { margin-top:8px; max-width:360px; font-size:.88rem; line-height:1.75; color:var(--text-secondary); }
    @media (prefers-reduced-motion:reduce) { .ud-ico, .ud-badge i { animation:none; } }
  </style>
  <script src="../js/utils/nav-boot.js"></script>
  <link rel="stylesheet" href="../css/desktop.css">
  <script src="../js/utils/desktop-layout.js" defer></script>
  <script src="../js/popup.js"></script>
</head>
<body data-page="study">
  <div class="app-shell app-shell--wide" id="shell">
    <div class="state-block"><div class="spinner"></div><p>লোড হচ্ছে…</p></div>
  </div>
  <script type="module">
    import { initTheme, renderStudentHeader } from "../js/utils/ui-utils.js";
    import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";

    initTheme();
    const shell = document.getElementById("shell");
    let student = getActiveStudent();

    async function start() {
      if (!student) { window.location.href = "../index.html"; return; }
      try { const fresh = await refreshActiveStudent(student.docId); if (fresh) student = fresh; } catch {}
      shell.innerHTML = renderStudentHeader(student, "study") + `<section class="ud"><div class="ud-ico"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5 12 4.5l10 5-10 5-10-5z"/><path d="M6 12v4.5c0 1.4 2.7 3 6 3s6-1.6 6-3V12"/><path d="M22 9.5v6"/></svg></div><span class="ud-badge"><i></i>UNDER DEVELOPMENT</span><h1>স্টাডি সেকশন</h1><p>এই সেকশনটা তৈরি হচ্ছে। খুব শীঘ্রই এখানে সব কিছু পাবে।</p></section>`;
    }
    start();
  </script>
</body>
</html>
