<title>অ্যাডভান্সড বিশ্লেষণ — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  body { overflow-x: hidden; background: var(--bg-app); }
  svg { display: block; }
  .app-shell { max-width: 680px; padding-bottom: 48px; margin: 0 auto; }
  #body > * { animation: up .45s cubic-bezier(.22,1,.36,1) backwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: 16px; }
  .sec { margin: 28px 2px 12px; }
  .sec h2 { font-size: 1.02rem; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 9px; }
  .sec h2 i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: var(--color-accent); background: rgba(var(--color-accent-rgb), .14); font-style: normal; }
  .sec h2 i svg { width: 15px; height: 15px; }
  .sec p { margin: 5px 0 0; font-size: .72rem; font-weight: 600; color: var(--text-muted); line-height: 1.5; }
  .muted { color: var(--text-muted); }
  .empty { padding: 18px 10px; text-align: center; font-size: .76rem; font-weight: 700; color: var(--text-muted); line-height: 1.6; }
  .head { margin: 16px 2px 4px; }
  .head small { font-size: .7rem; font-weight: 800; letter-spacing: .06em; color: var(--color-accent); text-transform: uppercase; }
  .head h1 { margin: 4px 0 0; font-size: 1.35rem; font-weight: 900; line-height: 1.3; }

  /* coach */
  .coach { padding: 18px; border-color: rgba(var(--color-accent-rgb), .3); background: linear-gradient(135deg, rgba(var(--color-accent-rgb), .12), transparent 60%), var(--surface); }
  .coach-top { display: flex; align-items: center; gap: 12px; }
  .coach-ic { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--color-accent); background: rgba(var(--color-accent-rgb), .16); }
  .coach-ic svg { width: 22px; height: 22px; }
  .coach h3 { margin: 0; font-size: 1rem; font-weight: 900; }
  .coach-top p { margin: 2px 0 0; font-size: .72rem; font-weight: 600; color: var(--text-muted); }
  .rankchip { margin-left: auto; flex: none; text-align: right; }
  .rankchip b { display: block; font-family: var(--font-num); font-size: 1.5rem; font-weight: 900; line-height: 1; color: var(--color-accent); }
  .rankchip span { font-size: .62rem; font-weight: 700; color: var(--text-muted); }
  .says { margin-top: 14px; display: grid; gap: 9px; }
  .say { display: flex; gap: 11px; padding: 11px 12px; border-radius: 13px; background: var(--surface-highlight); border: 1px solid var(--surface-border); font-size: .8rem; font-weight: 600; line-height: 1.65; color: var(--text-secondary); }
  .say i { flex: none; width: 4px; border-radius: 4px; background: var(--text-muted); }
  .say.good i { background: var(--color-success); } .say.warn i { background: var(--color-accent); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  .kpi { padding: 12px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--surface-border); text-align: center; }
  .kpi small { display: block; font-size: .64rem; font-weight: 700; color: var(--text-muted); }
  .kpi b { display: block; margin-top: 3px; font-family: var(--font-num); font-size: 1.2rem; font-weight: 900; }

  /* ladder */
  .lad { display: grid; gap: 0; }
  .lad-h, .lad-r { display: grid; grid-template-columns: 1.6fr .8fr .8fr .8fr; gap: 6px; align-items: center; padding: 11px 6px; font-size: .74rem; }
  .lad-h { padding-top: 0; font-size: .62rem; font-weight: 800; color: var(--text-muted); letter-spacing: .03em; border-bottom: 1px solid var(--surface-border); }
  .lad-r + .lad-r { border-top: 1px solid var(--surface-border); }
  .lad-r.me { background: rgba(var(--color-accent-rgb), .1); border-radius: 12px; border-top-color: transparent; }
  .lad-r b { font-family: var(--font-num); font-weight: 800; font-size: .86rem; text-align: center; }
  .lad-h span:not(:first-child) { text-align: center; }
  .who { min-width: 0; display: flex; align-items: center; gap: 9px; }
  .who i { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-family: var(--font-num); font-size: .7rem; font-weight: 800; background: var(--surface-highlight); color: var(--text-secondary); }
  .who i.t { background: var(--color-accent); color: #1d1608; }
  .who span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .who small { display: block; font-size: .6rem; font-weight: 700; color: var(--text-muted); }
  .gapnote { margin-top: 12px; padding: 11px 13px; border-radius: 13px; background: var(--surface-highlight); font-size: .76rem; font-weight: 600; line-height: 1.6; color: var(--text-secondary); }
  .gapnote b { font-family: var(--font-num); color: var(--text-primary); }

  /* subject gap bars */
  .gp { padding: 12px 0; }
  .gp + .gp { border-top: 1px solid var(--surface-border); }
  .gp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: .82rem; font-weight: 800; }
  .gp-h em { font-style: normal; font-family: var(--font-num); font-size: .72rem; font-weight: 800; }
  .gp-h em.behind { color: var(--color-danger); } .gp-h em.ahead { color: var(--color-success); }
  .gb { display: flex; align-items: center; gap: 9px; margin-top: 7px; font-size: .64rem; font-weight: 700; color: var(--text-muted); }
  .gb span:first-child { width: 36px; flex: none; }
  .gb div { flex: 1; height: 7px; border-radius: 7px; background: var(--surface-edge); overflow: hidden; }
  .gb div i { display: block; height: 100%; border-radius: 7px; }
  .gb b { width: 40px; text-align: right; font-family: var(--font-num); font-size: .72rem; color: var(--text-primary); }

  /* trend */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 0; border-top: 3px solid; border-radius: 3px; }
  .seq { margin-top: 14px; }
  .sq { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .sq + .sq { border-top: 1px solid var(--surface-border); }
  .sq-n { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-highlight); font-family: var(--font-num); font-size: .72rem; font-weight: 800; color: var(--text-secondary); }
  .sq-m { flex: 1; min-width: 0; }

  .sq-m span { display: block; margin-top: 2px; font-size: .64rem; font-weight: 600; color: var(--text-muted); line-height: 1.5; }

  .dl { font-family: var(--font-num); font-size: .66rem; font-weight: 800; }
  .dl.up { color: var(--color-success); } .dl.down { color: var(--color-danger); } .dl.flat { color: var(--text-muted); }

  /* missions */
  .ms { display: grid; gap: 10px; }
  .m { padding: 14px; border-radius: 16px; border: 1px solid var(--surface-border); background: var(--surface); }
  .m-h { display: flex; align-items: center; gap: 11px; }

  .m-t { flex: 1; min-width: 0; }

  .m-bar { height: 7px; border-radius: 7px; background: var(--surface-edge); overflow: hidden; margin-top: 12px; }
  .m-bar i { display: block; height: 100%; border-radius: 7px; background: var(--color-accent); width: 0; transition: width 1s cubic-bezier(.22,1,.36,1); }
  .m-nums { display: flex; justify-content: space-between; margin-top: 6px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .m-nums b { font-family: var(--font-num); color: var(--text-primary); }
  .m details { margin-top: 10px; }
  .m summary, .dt summary { cursor: pointer; font-size: .72rem; font-weight: 800; color: var(--color-accent); list-style: none; }
  .m summary::-webkit-details-marker, .dt summary::-webkit-details-marker { display: none; }
  .m ol { margin: 8px 0 0; padding-left: 18px; font-size: .74rem; font-weight: 600; line-height: 1.75; color: var(--text-secondary); }

  /* plan */
  .pl { padding: 14px; border-radius: 16px; border: 1px solid var(--surface-border); background: var(--surface); }
  .pl + .pl { margin-top: 10px; }
  .pl-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pl-h b { font-size: .86rem; font-weight: 850; line-height: 1.4; overflow-wrap: anywhere; }
  .pl-h strong { flex: none; font-family: var(--font-num); font-size: 1.1rem; font-weight: 900; color: var(--color-danger); }
  .when { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 99px; font-size: .66rem; font-weight: 800; background: rgba(var(--color-accent-rgb), .13); color: var(--color-accent); }
  .when.late { background: rgba(214,80,60,.14); color: var(--color-danger); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
  .stp { padding: 9px 8px; border-radius: 11px; background: var(--surface-highlight); text-align: center; font-size: .64rem; font-weight: 700; line-height: 1.5; color: var(--text-secondary); }
  .stp b { display: block; font-family: var(--font-num); font-size: .8rem; color: var(--color-accent); margin-bottom: 2px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .act { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface-solid); color: var(--text-primary); text-decoration: none; font-size: .76rem; font-weight: 800; }
  .act.pri { background: var(--color-accent); border-color: transparent; color: #1d1608; }
  .act svg { width: 16px; height: 16px; }
  .how { display: grid; gap: 8px; }
  .how div { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--surface-border); }
  .how i { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-family: var(--font-num); font-weight: 900; font-size: .8rem; color: #1d1608; background: var(--color-accent); }
  .how b { display: block; font-size: .8rem; font-weight: 850; }
  .how span { display: block; margin-top: 2px; font-size: .72rem; font-weight: 600; color: var(--text-secondary); line-height: 1.6; }

  /* quick challenge (game) */
  .gm { position: relative; overflow: hidden; padding: 18px 16px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--surface-border); }
  .gm-top { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; font-weight: 800; color: var(--text-muted); }
  .gm-top b { font-family: var(--font-num); font-size: 1.05rem; color: var(--color-accent); }
  .gm-time { height: 5px; border-radius: 5px; background: var(--surface-edge); overflow: hidden; margin: 12px 0 16px; }
  .gm-time i { display: block; height: 100%; width: 100%; background: var(--color-accent); border-radius: 5px; }
  .gm-q { min-height: 84px; display: grid; place-items: center; text-align: center; }
  .gm-q b { display: block; font-size: 1.1rem; font-weight: 900; line-height: 1.4; }
  .gm-q span { display: block; margin-top: 5px; font-size: .68rem; font-weight: 700; color: var(--text-muted); }
  .gm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .gm-btn { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; border-radius: 13px; border: 1px solid; font: inherit; font-weight: 850; font-size: .86rem; cursor: pointer; }
  .gm-btn svg { width: 17px; height: 17px; }
  .gm-btn.s { color: var(--color-success); border-color: rgba(47,125,94,.45); background: rgba(47,125,94,.12); }
  .gm-btn.w { color: var(--color-danger); border-color: rgba(214,80,60,.45); background: rgba(214,80,60,.1); }
  .gm-res { text-align: center; }
  .gm-res b { display: block; font-size: 1.15rem; font-weight: 900; }
  .gm-res.ok b { color: var(--color-success); } .gm-res.no b { color: var(--color-danger); }
  .gm-res p { margin: 6px 0 0; font-size: .76rem; font-weight: 600; color: var(--text-secondary); }
  .gm-final b { display: block; text-align: center; font-family: var(--font-num); font-size: 2.3rem; font-weight: 900; color: var(--color-accent); }
  .gm-final p { text-align: center; margin: 4px 0 0; font-size: .78rem; font-weight: 600; color: var(--text-secondary); line-height: 1.6; }
  .gm-go { width: 100%; margin-top: 14px; min-height: 46px; border: 0; border-radius: 12px; background: var(--color-accent); color: #1d1608; font: inherit; font-weight: 850; cursor: pointer; }

  /* detail lists */
  .dt { margin-top: 12px; }
  .dt > summary { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-primary); font-size: .86rem; font-weight: 850; }
  .dt > summary:after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted); transform: rotate(45deg); transition: transform .2s; }
  .dt[open] > summary:after { transform: rotate(-135deg); }
  .dt-b { padding: 8px 4px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 4px; }
  .row + .row { border-top: 1px solid var(--surface-border); }
  .row b { font-size: .78rem; font-weight: 800; overflow-wrap: anywhere; }
  .row span { display: block; margin-top: 2px; font-size: .64rem; font-weight: 600; color: var(--text-muted); }
  .row strong { flex: none; font-family: var(--font-num); font-size: .92rem; font-weight: 900; }
  .good { color: var(--color-success); } .mid { color: var(--color-accent); } .weakc { color: var(--color-danger); }
  .loading { min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); font-size: .76rem; font-weight: 700; }
  @media (max-width: 460px) { .steps { grid-template-columns: 1fr; } .lad-h, .lad-r { grid-template-columns: 1.5fr .7fr .7fr .7fr; font-size: .7rem; } }
</style>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { getApprovedResults, getAllApprovedResults, getExamSnapshotsMap, buildLeaderboardRows } from "../js/utils/results-utils.js";
import { getChallengeBonusMap } from "../js/utils/challenge-utils.js";
import { getCompletedImprovementAttemptsByStudent } from "../js/utils/improvement-xp-integration.js";
import { getBattleXPMap } from "../js/utils/battle-utils.js";
import { getSubjects, getChapters, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { normalizeBatch, sameBatch } from "../js/utils/batch-utils.js";
import {
  computeSubjectStats, computeChapterStats, computeTopicStats, buildQuestionRecords,
  computeTimeManagementStats, computeWrongOptionPatterns, computeMarkedForReviewStats, getPerformanceLabel
} from "../js/utils/analytics-utils.js";
import {
  groupByStudent, summarize, findPeers, examSequence, momentum, subjectGaps, topicGaps, reviewPlan, buildMissions, coachLines
} from "../js/utils/coach-utils.js";

initTheme();
const shell = document.getElementById("shell");
const student = getActiveStudent();
if (!student) window.location.href = "../index.html"; else renderPage();

const BN = "০১২৩৪৫৬৭৮৯";
const bn = (v) => String(v ?? "").replace(/\d/g, d => BN[d]);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pc = (v) => v == null || Number.isNaN(Number(v)) ? "—" : bn(`${Number(v).toFixed(Number(v) % 1 ? 1 : 0)}%`);
const tm = (v) => v == null ? "—" : bn(`${Math.round(v)} সে`);
const cls = (v) => v == null ? "" : v >= 75 ? "good" : v >= 55 ? "mid" : "weakc";
const fdate = (ms) => { try { return ms ? new Date(ms).toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) : ""; } catch { return ""; } };

const P = {
  coach: '<path d="M12 3 4 7v5c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V7z"/><path d="m9 12 2 2 4-4"/>',
  ladder: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  chart: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  list: '<path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  note: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'
};
const ic = (k, n = 16) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const sec = (k, t, sub = "") => `<div class="sec"><h2><i>${ic(k)}</i>${esc(t)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div>`;
const MISSION_ICON = { topic: "target", rank: "flag", streak: "flame", habit: "clock" };

function trendSvg(seq) {
  const pts = seq.filter(s => s.my != null);
  if (pts.length < 2) return `<div class="empty">ট্রেন্ড দেখাতে অন্তত ২টা পরীক্ষা লাগবে।</div>`;
  const w = 520, h = 190, px = 30, py = 22;
  const all = seq.flatMap(s => [s.my, s.topper, s.batchAvg]).filter(v => v != null);
  const lo = Math.max(0, Math.floor((Math.min(...all) - 8) / 10) * 10), hi = Math.min(100, Math.ceil((Math.max(...all) + 5) / 10) * 10);
  const X = (i) => px + i * (w - px * 2) / Math.max(1, seq.length - 1);
  const Y = (v) => h - py - ((v - lo) / Math.max(1, hi - lo)) * (h - py * 2);
  const line = (key, color, dash = "") => {
    const d = seq.map((s, i) => s[key] == null ? null : [X(i), Y(s[key])]).reduce((a, p, i, arr) => p ? a + `${a && arr[i - 1] ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)} ` : a, "");
    return d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${key === "my" ? 3.5 : 2.2}" stroke-linecap="round" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` : "";
  };
  const grid = [lo, Math.round((lo + hi) / 2), hi].map(v => `<line x1="${px}" x2="${w - px}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--surface-border)" stroke-dasharray="3 5"/><text x="2" y="${Y(v) + 4}" font-size="10" fill="var(--text-muted)" font-family="var(--font-num)">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="পরীক্ষার ট্রেন্ড">${grid}${line("batchAvg", "var(--text-muted)", "5 5")}${line("topper", "var(--color-violet, #7257c9)", "")}${line("my", "var(--color-accent)")}

/* ---------- quick challenge (uses the student's own topic accuracy) ---------- */
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function initChallenge(topicStats) {
  const el = document.getElementById("gm"); if (!el) return;
  const pool = (topicStats || []).filter(t => t.accuracy != null && t.attempts > 0);
  if (pool.length < 4) { el.innerHTML = `<div class="empty">আরও কয়েকটা টপিকে পরীক্ষা দিলে এই চ্যালেঞ্জ খুলবে।</div>`; return; }
  const MS = 4500; let rounds = [], i = 0, score = 0, streak = 0, best = 0, timer = null, done = false;
  const top = () => `<div class="gm-top"><span>স্কোর <b>${bn(score)}</b></span><span>কম্বো <b>${bn(streak)}</b></span></div><div class="gm-time"><i id="gmBar"></i></div>`;
  const start = () => { rounds = shuffle(pool).slice(0, Math.min(8, pool.length)); i = 0; score = 0; streak = 0; best = 0; round(); };
  function round() {
    if (i >= rounds.length) return fin();
    done = false; const t = rounds[i];
    el.innerHTML = `${top()}<div class="gm-q"><div><b>${esc(t.name)}</b><span>${bn(t.attempts)} বার এসেছে</span></div></div>
      <div class="gm-btns"><button class="gm-btn s" data-g="s">${ic("check")}শক্তি</button><button class="gm-btn w" data-g="w">${ic("x")}দুর্বলতা</button></div>`;
    const bar = document.getElementById("gmBar");
    requestAnimationFrame(() => { bar.style.transition = "none"; bar.style.width = "100%"; requestAnimationFrame(() => { bar.style.transition = `width ${MS}ms linear`; bar.style.width = "0%"; }); });
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => guess(b.dataset.g));
    clearTimeout(timer); timer = setTimeout(() => guess(null), MS);
  }
  function guess(g) {
    if (done) return; done = true; clearTimeout(timer);
    const t = rounds[i], strong = Number(t.accuracy) >= 70, ok = g === (strong ? "s" : "w");
    if (ok) { streak++; best = Math.max(best, streak); score += 10 + Math.min(streak - 1, 5) * 2; } else streak = 0;
    el.innerHTML = `${top()}<div class="gm-q"><div class="gm-res ${ok ? "ok" : "no"}"><b>${ok ? "ঠিক ধরেছো" : "আসলে অন্যরকম"}</b><p>${esc(t.name)} — accuracy ${pc(t.accuracy)} (${strong ? "শক্তি" : "দুর্বলতা"})</p></div></div>`;
    setTimeout(() => { i++; round(); }, 1100);
  }
  function fin() {
    const msg = score >= 70 ? "নিজের দুর্বলতা সম্পর্কে তোমার ধারণা বেশ পরিষ্কার।" : score >= 40 ? "মোটামুটি ভালো। নিচের উন্নতির প্ল্যানটা একবার দেখে নাও।" : "নিজের টপিকগুলো আরেকবার দেখে নাও, পরের বার স্কোর বাড়বে।";
    el.innerHTML = `<div class="gm-final"><b>${bn(score)}</b><p>সর্বোচ্চ কম্বো ${bn(best)}। ${msg}</p></div><button class="gm-go" id="gmGo">আবার খেলো</button>`;
    document.getElementById("gmGo").onclick = start;
  }
  start();
}

        ${mySubj.length ? mySubj.sort((a, b) => (a.accuracy ?? 101) - (b.accuracy ?? 101)).map(s => `<div class="row"><div><b>${esc(s.name)}</b><span>${bn(s.attempts)} বার · সঠিক ${bn(s.correct)} · ভুল ${bn(s.wrong)}</span></div><strong class="${cls(s.accuracy)}">${pc(s.accuracy)}</strong></div>`).join("") : `<div class="empty">বিষয়ের তথ্য নেই।</div>`}
        ${chapStats.length ? `<div class="gp-h" style="margin:14px 4px 4px"><span>অধ্যায় (কম থেকে বেশি)</span></div>` + chapStats.map(c => `<div class="row"><div><b>${esc(c.name)}</b><span>${bn(c.attempts)} বার</span></div><strong class="${cls(c.accuracy)}">${pc(c.accuracy)}</strong></div>`).join("") : ""}</div></details>
      <details class="dt"><summary>সব টপিক</summary><div class="dt-b">
        ${[...myTopics].sort((a, b) => (a.accuracy ?? 101) - (b.accuracy ?? 101)).map(t => `<div class="row"><div><b>${esc(t.name)}</b><span>${bn(t.attempts)} বার · ${esc(getPerformanceLabel(t).label)}</span></div><strong class="${cls(t.accuracy)}">${pc(t.accuracy)}</strong></div>`).join("") || `<div class="empty">টপিকের তথ্য নেই।</div>`}</div></details>
      <details class="dt"><summary>সময় ও অভ্যাস</summary><div class="dt-b">
        ${timeStats ? `${timeStats.bySubject.slice(0, 5).map(x => `<div class="row"><div><b>${esc(x.name)}</b><span>প্রতি প্রশ্নে গড় সময়</span></div><strong>${tm(x.avgSeconds)}</strong></div>`).join("")}
          ${timeStats.speedAccuracy ? `<div class="row"><div><b>দ্রুত অংশে ভুলের হার</b><span>ধীর অংশে ${pc(timeStats.speedAccuracy.slowerWrongRate)}</span></div><strong>${pc(timeStats.speedAccuracy.fasterWrongRate)}</strong></div>` : ""}` : `<div class="empty">সময়ের হিসাবের জন্য আরও কিছু পরীক্ষা লাগবে।</div>`}
        ${reviewStats ? `<div class="row"><div><b>মার্ক করা প্রশ্ন</b><span>${bn(reviewStats.markedCount)}টি · মার্ক না করা ${pc(reviewStats.unmarkedAccuracy)}</span></div><strong>${pc(reviewStats.accuracy)}</strong></div>` : ""}</div></details>
      <details class="dt"><summary>বারবার হওয়া ভুল</summary><div class="dt-b">
        ${wrongPat.length ? wrongPat.slice(0, 5).map(w => `<div class="row"><div><b>${esc((w.question_bn || "প্রশ্ন").slice(0, 90))}</b><span>একই ভুল অপশন ${bn(w.repeatedCount)} বার</span></div></div>`).join("") : `<div class="empty">এখনো এমন ভুল পাওয়া যায়নি।</div>`}</div></details>`;

    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".m-bar i").forEach(b => { b.style.width = b.dataset.w + "%"; })));
    initChallenge(myTopics);
  } catch (err) {
    console.error("Analytics error:", err);
    body.innerHTML = `<div class="card"><div class="empty"><b style="color:var(--color-danger)">বিশ্লেষণ লোড করা যায়নি।</b><br>ইন্টারনেট দেখে আবার চেষ্টা করো।</div></div>`;
  }
}
</script>
</body>
</html>
