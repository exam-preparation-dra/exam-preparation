<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোফাইল — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  body { overflow-x: hidden; background: var(--bg-app); }
  .app-shell { max-width: 600px; margin: 0 auto; padding-bottom: 48px; }
  .pf { display: grid; gap: 14px; margin-top: 14px; }

  /* ---------- generic pieces ---------- */
  .pf-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-soft); }
  .pf-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .pf-h { font-size: 1rem; font-weight: 900; color: var(--text-primary); }
  .pf-note { font-size: .72rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }
  .pf-empty { padding: 22px 10px; text-align: center; font-size: .8rem; font-weight: 700; color: var(--text-muted); }
  .pf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-primary); font-size: .82rem; font-weight: 800; cursor: pointer; transition: transform var(--transition), background var(--transition); }
  .pf-btn:active { transform: scale(.97); }
  .pf-btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .pf-btn.danger { color: var(--color-danger); border-color: rgba(166,64,47,.3); background: transparent; }
  .pf-btn.sm { padding: 7px 11px; font-size: .74rem; border-radius: 10px; }
  .pf-btn:disabled { opacity: .6; cursor: not-allowed; }
  .pf-btn svg { flex: none; }

  /* ---------- hero ---------- */
  .pf-hero { position: relative; overflow: hidden; padding: 20px; border-radius: 24px; border: 1px solid rgba(var(--color-accent-rgb), .28); background: linear-gradient(140deg, rgba(var(--color-accent-rgb), .15), var(--surface) 64%); box-shadow: var(--shadow-soft); }
  .pf-id { display: flex; gap: 16px; align-items: center; }
  .pf-avatar { position: relative; width: 84px; height: 84px; flex: none; border-radius: 26px; overflow: hidden; background: linear-gradient(135deg, var(--color-accent), #7c5a22); color: #fff; display: grid; place-items: center; font-size: 2rem; font-weight: 900; border: 2px solid rgba(var(--color-accent-rgb), .45); }
  .pf-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .pf-avatar.pf-edit { cursor: pointer; }
  .pf-avatar-edit { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 0 4px; border: 0; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font: inherit; font-size: .62rem; font-weight: 900; letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; }
  .pf-avatar-edit svg { width: 11px; height: 11px; }
  .pf-name { font-size: 1.35rem; font-weight: 900; line-height: 1.2; color: var(--text-primary); word-break: break-word; }
  .pf-sub { margin-top: 4px; font-size: .78rem; font-weight: 700; color: var(--text-secondary); }
  .pf-title { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; padding: 5px 10px; border-radius: 999px; background: rgba(var(--color-accent-rgb), .12); border: 1px solid rgba(var(--color-accent-rgb), .25); color: var(--color-accent); font-size: .72rem; font-weight: 900; }
  .pf-level { margin-top: 18px; }
  .pf-level-row { display: flex; justify-content: space-between; gap: 10px; font-size: .72rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 6px; }
  .pf-bar { height: 8px; border-radius: 99px; background: var(--surface-edge); overflow: hidden; }
  .pf-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #d9a84e, var(--color-accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .pf-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .pf-metric { padding: 11px 4px; text-align: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--surface-border); }
  .pf-metric b { display: block; font-family: var(--font-num); font-size: 1.05rem; font-weight: 800; color: var(--text-primary); }
  .pf-metric span { display: block; margin-top: 2px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .pf-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pf-actions .pf-btn { flex: 1; }

  /* ---------- tabs ---------- */
  .pf-tabs { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: var(--surface-edge); border: 1px solid var(--surface-border); }
  .pf-tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border: 0; border-radius: 12px; background: transparent; color: var(--text-secondary); font-size: .8rem; font-weight: 800; cursor: pointer; transition: background var(--transition), color var(--transition); }
  .pf-tab.active { background: var(--surface); color: var(--color-accent); box-shadow: var(--shadow-soft); }
  .pf-dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; display: none; place-items: center; background: var(--color-danger); color: #fff; font-size: .62rem; font-weight: 900; }
  .pf-dot.on { display: inline-grid; }
  .pf-pane { display: none; gap: 14px; }
  .pf-pane.active { display: grid; animation: pfIn .25s ease; }
  @keyframes pfIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- overview ---------- */
  .pf-records { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pf-rec { padding: 14px; border-radius: 16px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-rec b { display: block; font-family: var(--font-num); font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }
  .pf-rec span { display: block; margin-top: 3px; font-size: .72rem; font-weight: 700; color: var(--text-muted); }
  .pf-strength { display: grid; gap: 12px; }
  .pf-srow { display: grid; grid-template-columns: 96px 1fr 46px; gap: 10px; align-items: center; }
  .pf-srow span { font-size: .76rem; font-weight: 800; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-srow b { font-family: var(--font-num); font-size: .78rem; font-weight: 800; text-align: right; color: var(--color-accent); }

  /* scan card */
  .pf-scan { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 18px; }
  .pf-qr { width: 176px; height: 176px; padding: 12px; border-radius: 22px; background: #fff; border: 1px solid var(--surface-border); box-shadow: var(--shadow-soft); display: grid; place-items: center; }
  .pf-qr img { display: block; width: 100%; height: 100%; }
  .pf-qr .spinner { margin: 0; }
  .pf-scan-lbl { font-size: .78rem; font-weight: 900; letter-spacing: .32em; text-indent: .32em; color: var(--color-accent); }

  /* ---------- badges ---------- */
  .pf-bsum { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pf-bsum big { font-family: var(--font-num); font-size: 1.7rem; font-weight: 800; color: var(--color-accent); }
  .pf-bsum big small { font-size: .8rem; color: var(--text-muted); font-weight: 700; }
  .pf-next { display: grid; gap: 4px; margin-top: 4px; }
  .pf-nrow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border: 0; background: transparent; text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; }
  .pf-nrow + .pf-nrow { border-top: 1px solid var(--surface-border); }
  .pf-nrow strong { display: block; font-size: .8rem; font-weight: 900; color: var(--text-primary); }
  .pf-nrow small { display: block; margin-top: 2px; font-size: .68rem; font-weight: 700; color: var(--text-muted); }
  .pf-chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
  .pf-chips::-webkit-scrollbar { display: none; }
  .pf-chip { padding: 7px 13px; border-radius: 99px; white-space: nowrap; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-secondary); font-size: .74rem; font-weight: 800; cursor: pointer; }
  .pf-chip.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .pf-bgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pf-badge { --rc: #8b95a5; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 16px 10px 14px; border-radius: 18px; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-primary); font: inherit; cursor: pointer; transition: transform var(--transition), border-color var(--transition); }
  .pf-badge:active { transform: scale(.98); }
  .pf-badge.earned { border-color: color-mix(in srgb, var(--rc) 45%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 11%, var(--surface)), var(--surface)); }
  .pf-bico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--rc) 32%, transparent); margin-bottom: 4px; }
  .pf-bico svg { width: 26px; height: 26px; }
  .pf-bico.sm { width: 44px; height: 44px; border-radius: 14px; margin: 0; flex: none; }
  .pf-bico.sm svg { width: 22px; height: 22px; }
  .pf-badge.locked .pf-bico { color: var(--text-muted); background: var(--surface-edge); border-color: var(--surface-border); filter: grayscale(.6); opacity: .8; }
  .pf-badge strong { font-size: .76rem; font-weight: 900; line-height: 1.3; }
  .pf-badge .rar { font-size: .6rem; font-weight: 900; letter-spacing: .04em; color: var(--rc); }
  .pf-badge.locked .rar { color: var(--text-muted); }
  .pf-badge .got { margin-top: 2px; font-size: .68rem; font-weight: 900; color: var(--color-success); }
  .pf-badge .prog { width: 100%; margin-top: 6px; }
  .pf-badge .prog .pf-bar { height: 5px; }
  .pf-badge .prog small { display: block; margin-top: 4px; font-size: .64rem; font-weight: 800; color: var(--text-muted); }
  .pf-badge .sec { margin-top: 2px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }

  .pf-modal { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.55); animation: pfIn .2s ease; }
  .pf-modal-card { --rc: #8b95a5; width: min(360px, 100%); padding: 26px 22px 20px; border-radius: 24px; text-align: center; background: var(--surface); border: 1px solid var(--surface-border); box-shadow: var(--shadow-lift); }
  .pf-modal-card .pf-bico { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 12px; }
  .pf-modal-card .pf-bico svg { width: 42px; height: 42px; }
  .pf-modal-card h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
  .pf-modal-card .rar { font-size: .68rem; font-weight: 900; color: var(--rc); }
  .pf-how { margin: 14px 0; padding: 12px; border-radius: 14px; background: var(--surface-highlight); text-align: left; font-size: .8rem; line-height: 1.6; color: var(--text-secondary); font-weight: 600; }
  .pf-how b { color: var(--text-primary); }
  .pf-unlock .pf-bico { animation: pfPop .7s cubic-bezier(.18,.9,.2,1); }
  @keyframes pfPop { 0% { transform: scale(.4) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }

  /* ---------- premium badges v2 ---------- */
  .pf-bico { position: relative; isolation: isolate; width: 58px; height: 58px; border-radius: 50%; margin-bottom: 6px; color: #fff; border: 0;
    background: radial-gradient(circle at 30% 22%, color-mix(in srgb, var(--rc) 55%, #fff) 0%, var(--rc) 52%, color-mix(in srgb, var(--rc) 68%, #000) 100%);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--rc) 30%, var(--surface)), 0 0 0 4px color-mix(in srgb, var(--rc) 55%, transparent), 0 8px 18px color-mix(in srgb, var(--rc) 34%, transparent), inset 0 2px 3px rgba(255,255,255,.55), inset 0 -4px 6px rgba(0,0,0,.22); }
  .pf-bico svg { position: relative; z-index: 1; width: 27px; height: 27px; stroke-width: 1.9; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.4)); }
  .pf-bico::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.6) 50%, transparent 62%); background-size: 260% 100%; background-position: 160% 0; }
  .pf-badge.earned .pf-bico::after, .pf-modal-card .pf-bico::after { animation: pfShine 3.4s ease-in-out infinite; }
  @keyframes pfShine { 0%, 55% { background-position: 160% 0; } 100% { background-position: -60% 0; } }
  .pf-bico.sm { width: 44px; height: 44px; margin: 0; flex: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 30%, var(--surface)), 0 0 0 3px color-mix(in srgb, var(--rc) 50%, transparent), 0 5px 12px color-mix(in srgb, var(--rc) 30%, transparent), inset 0 2px 2px rgba(255,255,255,.5), inset 0 -3px 4px rgba(0,0,0,.2); }
  .pf-bico.sm svg { width: 21px; height: 21px; }
  .pf-badge { padding: 20px 10px 14px; border-radius: 20px; overflow: hidden; }
  .pf-badge.earned { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 72%), linear-gradient(180deg, color-mix(in srgb, var(--rc) 7%, var(--surface)), var(--surface));
    box-shadow: 0 8px 22px color-mix(in srgb, var(--rc) 15%, transparent); }
  .pf-badge.earned::before { content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 3px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, transparent, var(--rc), transparent); }
  .pf-badge.earned.tier-legendary { animation: pfGlow 3s ease-in-out infinite; }
  @keyframes pfGlow { 50% { box-shadow: 0 8px 30px color-mix(in srgb, var(--rc) 42%, transparent); } }
  .pf-badge.locked .pf-bico { color: var(--text-muted); filter: grayscale(1); opacity: .72;
    background: linear-gradient(145deg, var(--surface-edge), var(--surface-highlight)); box-shadow: 0 0 0 3px var(--surface-border), inset 0 2px 3px rgba(255,255,255,.18); }
  .pf-badge.locked .pf-bico svg { filter: none; }
  .pf-badge .rar { padding: 2px 9px; border-radius: 99px; background: color-mix(in srgb, var(--rc) 14%, transparent); }
  .pf-badge.locked .rar { background: var(--surface-edge); }
  .pf-lock { position: absolute; top: 9px; right: 9px; width: 18px; height: 18px; color: var(--text-muted); opacity: .7; }
  .pf-lock svg { width: 100%; height: 100%; }
  .pf-bhero { display: flex; align-items: center; gap: 16px; }
  .pf-ring { --p: 0; position: relative; flex: none; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--color-accent) calc(var(--p) * 1%), var(--surface-edge) 0); }
  .pf-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
  .pf-ring b { position: relative; font-family: var(--font-num); font-size: 1.1rem; font-weight: 800; color: var(--color-accent); }
  .pf-tally { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pf-tally span { padding: 3px 9px; border-radius: 99px; font-size: .64rem; font-weight: 900; color: var(--rc); background: color-mix(in srgb, var(--rc) 13%, transparent); }
  .pf-gh { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px; font-size: .84rem; font-weight: 900; color: var(--text-primary); }
  .pf-gh:first-child { margin-top: 4px; }
  .pf-gh small { font-family: var(--font-num); font-size: .72rem; font-weight: 800; color: var(--text-muted); }
  .pf-chips + .pf-chips { margin-top: -4px; }
  .pf-modal-card { position: relative; overflow: hidden; }
  .pf-modal-card > * { position: relative; }
  .pf-modal-card > .pf-rays { position: absolute; top: -90px; left: 50%; width: 320px; height: 320px; margin-left: -160px; border-radius: 50%; opacity: .5; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 30%, transparent) 0 8deg, transparent 8deg 20deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 68%); mask-image: radial-gradient(circle, #000 0%, transparent 68%); animation: pfSpin 22s linear infinite; }
  @keyframes pfSpin { to { transform: rotate(360deg); } }
  .pf-modal-card .pf-bico { width: 96px; height: 96px; border-radius: 50%; }
  .pf-modal-card .pf-bico svg { width: 46px; height: 46px; }
  @media (prefers-reduced-motion: reduce) { .pf-badge.earned .pf-bico::after, .pf-modal-card .pf-bico::after, .pf-badge.earned.tier-legendary, .pf-modal-card > .pf-rays { animation: none; } }

  /* ---------- friends ---------- */
  .pf-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-row + .pf-row { margin-top: 8px; }
  .pf-rname { font-size: .88rem; font-weight: 800; color: var(--text-primary); min-width: 0; }
  .pf-rname small { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 6px; background: var(--surface-edge); font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .pf-tag { display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 6px; font-size: .64rem; font-weight: 800; background: rgba(var(--color-accent-rgb), .12); color: var(--color-accent); }
  .pf-state { padding: 4px 10px; border-radius: 8px; font-size: .68rem; font-weight: 800; white-space: nowrap; }
  .pf-state.ok { background: rgba(47,125,94,.12); color: var(--color-success); }
  .pf-state.wait { background: var(--surface-edge); color: var(--text-muted); }
  .pf-search { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 12px; border-radius: 12px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: .85rem; font-weight: 600; color: var(--text-primary); }

  @media (max-width: 380px) { .pf-metrics { grid-template-columns: repeat(2, 1fr); } .pf-avatar { width: 72px; height: 72px; font-size: 1.7rem; } }
  @media (min-width: 520px) { .pf-bgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .pf-tg { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--surface-border); font-size:.86rem; font-weight:600; cursor:pointer; }
  .pf-tg input { display:none; }
  .pf-tg i { flex:none; width:42px; height:24px; border-radius:99px; background:rgba(128,128,128,.35); position:relative; transition:.2s; }
  .pf-tg i::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
  .pf-tg input:checked + i { background:var(--color-accent); }
  .pf-tg input:checked + i::after { left:21px; }
  .pf-inp { width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:8px; border-radius:12px; border:1.5px solid var(--surface-border); background:var(--surface-solid,#fff); color:inherit; font-size:.95rem; outline:none; }
  .pf-inp:focus { border-color:var(--color-accent); }

  /* ================= clean redesign ================= */
  .pf { gap: 12px; }
  .pf-hero { padding: 20px 18px 18px; border-radius: 22px; border: 1px solid var(--surface-border); background: var(--surface); box-shadow: var(--shadow-soft); }
  .pf-avatar { width: 76px; height: 76px; border-radius: 22px; font-size: 1.8rem; }
  .pf-level { margin-top: 16px; }
  .pf-metrics { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .pf-metric { background: var(--surface-highlight); border-color: transparent; }
  .pf-tabs { padding: 0; gap: 0; background: transparent; border: 0; border-bottom: 1px solid var(--surface-border); border-radius: 0; }
  .pf-tab { position: relative; border-radius: 0; padding: 12px 4px; }
  .pf-tab.active { background: transparent; box-shadow: none; }
  .pf-tab.active::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
  .pf-scan { gap: 14px; padding: 22px 18px 18px; text-align: center; align-items: stretch; }
  .pf-scan .pf-head { display: block; margin: 0; }
  .pf-scan .pf-qr { align-self: center; }
  .pf-scan-actions { display: flex; gap: 8px; }
  .pf-scan-actions .pf-btn { flex: 1; }
  .pf-recent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pf-mini { --rc: #8b95a5; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px; border: 0; border-radius: 16px; background: var(--surface-highlight); color: inherit; font: inherit; cursor: pointer; text-align: center; }
  .pf-mini:active { transform: scale(.97); }
  .pf-mini .pf-bico { margin: 0; }
  .pf-mini span.t { font-size: .7rem; font-weight: 800; line-height: 1.3; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 380px) { .pf-metrics { grid-template-columns: repeat(3, 1fr); } .pf-avatar { width: 64px; height: 64px; font-size: 1.5rem; } .pf-tab { font-size: .74rem; } }

  /* streak / pins / cards */

<script>
(function () {
  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showProfileError(title, details) {
    const shell = document.getElementById("shell");
    if (!shell) return;
    window.__profileErrorShown = true;

    shell.innerHTML = `
      <div style="
        min-height:100vh;
        box-sizing:border-box;
        padding:24px;
        display:flex;
        align-items:flex-start;
        justify-content:center;
        background:#fff;
        font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      ">
        <div style="
          width:100%;
          max-width:760px;
          margin-top:20px;
          padding:22px;
          box-sizing:border-box;
          border:2px solid #ef4444;
          border-radius:18px;
          background:#fff1f2;
          color:#7f1d1d;
          box-shadow:0 8px 30px rgba(0,0,0,.08);
        ">
          <div style="
            font-size:22px;
            font-weight:900;
            margin-bottom:10px;
          ">প্রোফাইল ত্রুটি</div>

          <div style="
            font-size:16px;
            font-weight:800;
            margin-bottom:14px;
          ">${esc(title)}</div>

          <pre style="
            margin:0;
            padding:14px;
            box-sizing:border-box;
            white-space:pre-wrap;
            word-break:break-word;
            overflow:auto;
            border-radius:12px;
            background:#fff;
            color:#111827;
            font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
          ">${esc(details)}</pre>

          <div style="
            margin-top:14px;
            font-size:13px;
            line-height:1.5;
            color:#991b1b;
          ">
            এই error-এর screenshot পাঠাও। এতে কোন file/import/line-এ
            সমস্যা হচ্ছে সেটা সরাসরি ধরা যাবে।
          </div>
        </div>
      </div>
    `;
  }

  window.addEventListener("error", function (event) {
    // Resource-load failures (e.g. a 404 on a <script>/module import) have
    // no message/filename — they only show up via event.target. Handle both.
    const target = event.target;
    if (target && target !== window && (target.src || target.href)) {
      showProfileError(
        "রিসোর্স লোড ত্রুটি (ফাইল পাওয়া যায়নি)",
        [
          "ট্যাগ: " + (target.tagName || "অজানা"),
          "URL: " + (target.src || target.href || "অজানা"),
          "",
          "সম্ভবত এই ফাইলের path ভুল আছে অথবা GitHub Pages-এ ফাইলটি ওই path-এ নেই।"
        ].join("\n")
      );
      return;
    }
    showProfileError(
      "জাভাস্ক্রিপ্ট / মডিউল ত্রুটি",
      [
        "বার্তা: " + (event.message || "অজানা ত্রুটি"),
        "ফাইল: " + (event.filename || "অজানা ফাইল"),
        "লাইন: " + (event.lineno || "?"),
        "কলাম: " + (event.colno || "?"),
        "",
        "স্ট্যাক: " + (event.error && event.error.stack
          ? event.error.stack
          : "স্ট্যাক পাওয়া যায়নি")
      ].join("\n")
    );
  }, true);

  window.addEventListener("unhandledrejection", function (event) {
    const reason = event.reason;
    console.error("Profile non-fatal Promise error:", reason);
    // Do not replace the whole Profile shell for an optional feature failure.
    // The feature itself is responsible for showing its own safe empty/error state.
  });

  window.addEventListener("securitypolicyviolation", function (event) {
    console.error("Profile CSP warning:", event.blockedURI || "unknown");
  });

  window.__showProfileError = showProfileError;
})();
</script>

function getBadgeContext(results, gData, rank, subjectStats, chapterStats, topicStats, social = {}) {
  const arr=results||[], nums=k=>arr.reduce((s,r)=>s+Number(r[k]||0),0);
  const percentages=arr.map(r=>Number(r.percentage||0)), accuracies=arr.map(r=>Number(r.accuracy||0));
  const highAccuracyExamCount=arr.filter(r=>Number(r.accuracy||0)>=90).length;
  const highScoreExamCount=arr.filter(r=>Number(r.percentage||0)>=80).length;
  const perfectExams=arr.filter(r=>Number(r.percentage||0)>=100).length;
  const zeroWrongExams=arr.filter(r=>Number(r.wrongCount||0)===0&&Number(r.attempted||0)>0).length;
  const highAttemptExams=arr.filter(r=>Number(r.totalQuestions||0)>0 && Number(r.attempted||0)/Number(r.totalQuestions||1)>=.9).length;
  const fastAccurateExams=arr.filter(r=>Number(r.accuracy||0)>=80 && Number(r.timeTakenSeconds||0)>0 && Number(r.avgTimePerQuestionSeconds||999)<=60).length;
  let cleanRun=0,run=0; arr.slice().sort((a,b)=>new Date(a.submittedAt||0)-new Date(b.submittedAt||0)).forEach(r=>{if(Number(r.percentage||0)>=80&&Number(r.accuracy||0)>=80)run++;else run=0;cleanRun=Math.max(cleanRun,run)});
  const topicCoverage=topicStats?.length ? topicStats.filter(x=>x.attempts>0).length/topicStats.length*100 : 0;

  // গোপন badges + a couple of real fixes — computed straight from raw
  // results, no extra fetch. (computeGamificationData() has no
  // maxImprovement/longestStreak field at all — those two lines below
  // used to always read as 0, so "ঘুরে দাঁড়ানোর চ্যাম্পিয়ন" could never
  // actually be earned by anyone. Computed here from the student's own
  // exam history instead, the same way xp-utils.js judges improvement:
  // each exam vs. the running average of exams before it.)
  const submittedMs = r => r.submittedAt?.toMillis ? r.submittedAt.toMillis() : (r.submittedAt ? new Date(r.submittedAt).getTime() : 0);
  const nightOwl = arr.some(r => { const ms = submittedMs(r); if (!ms) return false; const h = new Date(ms).getHours(); return h >= 0 && h < 4; });
  const sortedByTime = arr.slice().filter(r => submittedMs(r)).sort((a, b) => submittedMs(a) - submittedMs(b));
  const perfectFirstExam = sortedByTime.length > 0 && Number(sortedByTime[0].percentage || 0) >= 100;

  let realMaxImprovement = 0, pctRunningSum = 0;
  const dayMs = 24 * 60 * 60 * 1000, weekOf = ms => Math.floor((ms + 3 * dayMs) / (7 * dayMs));
  const weeksSeen = new Set();
  sortedByTime.forEach((r, i) => {
    const pct = Number(r.percentage || 0);
    if (i > 0) realMaxImprovement = Math.max(realMaxImprovement, pct - (pctRunningSum / i));
    pctRunningSum += pct;
    const ms = submittedMs(r); if (ms) weeksSeen.add(weekOf(ms));
  });
  const weeksSorted = [...weeksSeen].sort((a, b) => a - b);
  let realLongestStreak = 0, streakRun = 0, prevWeek = null;
  weeksSorted.forEach(w => { streakRun = (prevWeek !== null && w === prevWeek + 1) ? streakRun + 1 : 1; realLongestStreak = Math.max(realLongestStreak, streakRun); prevWeek = w; });

  return {
    friendCount: Number(social.friendCount || 0),
    hasRival: !!social.hasRival,
    challengeWins: Number(social.challengeWins || 0),
    referralCount: Number(social.referralCount || 0),
    battle: social.battle || {},
    practice: social.practice || {},
    nightOwl, perfectFirstExam,
    realMaxImprovement, realLongestStreak,
    examCount:arr.length,totalCorrect:nums("correctCount"),totalPoints:Number(rank?.totalPoints ?? nums("obtainedMarks")),
    avgAccuracy:accuracies.length?accuracies.reduce((a,b)=>a+b,0)/accuracies.length:0,
    avgPercentage:percentages.length?percentages.reduce((a,b)=>a+b,0)/percentages.length:0,
    bestPercentage:Math.max(0,...percentages),bestAccuracy:Math.max(0,...accuracies),
    highAccuracyExamCount,highScoreExamCount,perfectExams,zeroWrongExams,highAttemptExams,fastAccurateExams,cleanRun,
    maxImprovement:realMaxImprovement,longestStreak:realLongestStreak,
    weeklyOverall:Number(gData?.badgeCounts?.[social.sid||student.studentId]?.weeklyOverall||0),
    weeklyClass:Number(gData?.badgeCounts?.[social.sid||student.studentId]?.weeklyClass||0),
    monthlyOverall:Number(gData?.badgeCounts?.[social.sid||student.studentId]?.monthlyOverall||0),
    monthlyClass:Number(gData?.badgeCounts?.[social.sid||student.studentId]?.monthlyClass||0),
    subjectStats,chapterStats,topicStats,topicCoverage,
    strongSubjects:(subjectStats||[]).filter(x=>x.attempts>=5&&x.accuracy>=80).length,
    bestSubjectMaster:(subjectStats||[]).some(x=>x.attempts>=5&&x.accuracy>=90),
    bestChapterMaster:(chapterStats||[]).some(x=>x.attempts>=5&&x.accuracy>=90),
    bestTopicMaster:(topicStats||[]).some(x=>x.attempts>=5&&x.accuracy>=90)
  };
}


const RARITY = {
  common:    { bn: "সাধারণ",     color: "#8b95a5" },
  uncommon:  { bn: "অসাধারণ",   color: "#0ea5e9" },
  rare:      { bn: "বিরল",       color: "#8b5cf6" },
  epic:      { bn: "এপিক",       color: "#ec4899" },
  legendary: { bn: "কিংবদন্তি", color: "#d99a1f" },
  secret:    { bn: "গোপন",       color: "#14b8a6" }
};
// The catalog mixes Bengali and English rarity names — normalise to one key.
function rarityKey(r) {
  const bn = { "সাধারণ": "common", "অসাধারণ": "uncommon", "বিরল": "rare", "বিশেষ": "epic", "অতি বিরল": "legendary", "গোপন": "secret" };
  const k = bn[r] || String(r || "").toLowerCase();
  return RARITY[k] ? k : "common";
}
const rarityOf = b => RARITY[rarityKey(b.rarity)];
const isSecretLocked = b => !b.earned && rarityKey(b.rarity) === "secret";

const FLAME = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.500 2-4.500 0 1.500 1 2.500 2 2.500 0-3-1-5.500 1-8z"/></svg>';
let pinned = [];
const cleanPins = (ids, d) => (Array.isArray(ids) ? ids : []).filter(id => d.badges.some(b => b.id === id && b.earned)).slice(0, 3);
function calcStreak(results) {
  const ms = r => { const t = r.submittedAt; const v = t?.toMillis ? t.toMillis() : (typeof t === "number" ? t : Date.parse(t)); return Number.isFinite(v) ? v : 0; };
  const wk = t => { const x = new Date(t); return Math.floor((Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) / 86400000 + 3) / 7); };
  const weeks = new Set((results || []).map(ms).filter(Boolean).map(wk));
  let w = wk(Date.now()); if (!weeks.has(w)) w -= 1;
  let n = 0; while (weeks.has(w)) { n++; w--; }
  return n;
}

async function fetchBattleStats(sid) {
  const s = { played: 0, wins: 0, losses: 0, mvp: 0, buzz: 0, attender: 0, hosted: 0, xp: 0, bestStreak: 0 };
  const snap = await getDocs(query(collection(db, "battleMatches"), where("participantIds", "array-contains", sid)));
  const matches = [];
  snap.forEach(x => { const m = x.data(); if (m.status === "finished" && m.result) matches.push(m); });
  matches.sort((a, b) => (Number(a.result.finishedAt) || 0) - (Number(b.result.finishedAt) || 0));
  let run = 0;
  matches.forEach(m => {
    const r = m.result, team = (m.teamA?.members || []).some(x => x.studentId === sid) ? "A" : "B";
    s.played++;
    if (r.winnerTeam === team) { s.wins++; run++; s.bestStreak = Math.max(s.bestStreak, run); } else { s.losses++; run = 0; }
    if (r.winMvp === sid || r.loseMvp === sid) s.mvp++;
    if (r.topBuzzer === sid) s.buzz++;
    if (r.loseTopAttender === sid) s.attender++;
    if (m.hostStudentId === sid) s.hosted++;
    s.xp += Number(r.xpLog?.[sid] || 0);
  });
  return s;
}

async function fetchPracticeStats(sid) {
  const snap = await getDocs(query(collection(db, "improvementAttempts"), where("studentId", "==", sid), where("status", "==", "completed")));
  const list = snap.docs.map(x => x.data());
  return {
    count: list.length,
    target: list.filter(p => p.targetReached === true).length,
    perfect: list.filter(p => Number(p.accuracy || 0) >= 100).length,
    bestGain: Math.max(0, ...list.map(p => Number(p.improvementPercent || 0)))
  };
}

async function fetchData(st = student) {
  const sid = st.studentId;
  const [results, rank, gData, subjectsSnap, chaptersSnap, topicsSnap, friendIds, rival, wins, allStudents, battle, practice] = await Promise.all([
    getApprovedResults(sid).catch(() => []),
    getStudentRank(sid).catch(() => null),
    computeGamificationData().catch(() => ({})),
    getDocs(collection(db, "subjects")).catch(() => null),
    getDocs(collection(db, "chapters")).catch(() => null),
    getDocs(collection(db, "topics")).catch(() => null),
    getMyFriendIds(sid).catch(() => []),
    getRival(sid).catch(() => null),
    getChallengeWinCount(sid).catch(() => 0),
    getActiveStudents().catch(() => []),
    fetchBattleStats(sid).catch(() => ({})),
    fetchPracticeStats(sid).catch(() => ({}))
  ]);
  const referralCount = (allStudents || []).filter(x => x.referredBy === sid).length;
  const nameMap = snap => { const m = {}; snap?.forEach(d => { const x = d.data(); m[d.id] = x.name_bn || x.name_en || d.id; }); return m; };
  const overall = computeOverallStats(results);
  let subjectStats = [], badges = [];
  try {
    subjectStats = computeSubjectStats(results, nameMap(subjectsSnap)).map(x => ({ ...x, id: x.subjectId }));
    const chapterStats = computeChapterStats(results, nameMap(chaptersSnap)).map(x => ({ ...x, id: x.chapterId }));
    const topicStats = computeTopicStats(results, nameMap(topicsSnap)).map(x => ({ ...x, id: x.topicId }));
    const ctx = getBadgeContext(results, gData, rank, subjectStats, chapterStats, topicStats,
      { friendCount: friendIds.length, hasRival: !!rival, challengeWins: wins, referralCount, battle, practice, sid });
    badges = buildBadgeCatalog(ctx).map(b => ({ ...b, earned: !!b.check(ctx), progress: b.progress ? b.progress(ctx) : null }));
  } catch (e) { console.warn("Badge calculation failed", e); }
  return { results, rank, overall, subjectStats, badges, friendCount: friendIds.length };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const t = document.createElement("textarea");
      t.value = text; t.style.cssText = "position:fixed;left:-9999px;top:0;";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch { return false; }
  }
}

(async function boot() {
  if (!viewer) { window.location.href = "../index.html"; return; }
  // Guard: the cached student must match a real signed-in Firebase session.
  if (!(await requireStudentSession(viewer.studentId))) {
    localStorage.removeItem("activeStudent");
    window.location.href = "../index.html";
    return;
  }
  if (targetSid && targetSid !== viewer.studentId) {
    try {
      const all = await getActiveStudents();
      const target = all.find(x => x.studentId === targetSid);
      if (!target) { window.location.href = "profile.html"; return; }
      student = target; viewMode = true;
      viewIsFriend = (await getMyFriendIds(viewer.studentId)).includes(target.studentId);
    } catch (e) { window.location.href = "profile.html"; return; }
    renderViewPage();
    return;
  }
  renderPage();
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) { student = fresh; renderHeroShell(); loadData().then(fillHero).catch(() => {}); }
  }).catch(err => console.warn("Student refresh skipped", err));
})();

async function renderViewAction(canCompare) {
  const el = $("viewAction");
  if (viewIsFriend) {
    el.innerHTML = `<div class="pf-state ok" style="display:inline-block">তোমরা বন্ধু</div>

      </div>`;
    $("vaChallenge").onclick = openChallengeFromProfile;
    return;
  }
  try {
    const [inc, out] = await Promise.all([getIncomingRequests(viewer.studentId), getOutgoingRequests(viewer.studentId)]);
    const incoming = inc.find(r => r.fromStudentId === student.studentId);
    const outgoing = out.find(r => r.toStudentId === student.studentId);
    if (incoming) {
      el.innerHTML = `<button class="pf-btn primary" id="vaBtn" type="button">বন্ধুত্বের অনুরোধ গ্রহণ করো</button>`;

    } else if (outgoing) {
      el.innerHTML = `<span class="pf-state wait">অনুরোধ পাঠানো হয়েছে, অপেক্ষমাণ</span>`;

function fillHero(d) {
  if (!$("pfHero")) return;
  const xp = Number(d.rank?.totalPoints || 0);
  const lv = getLevelInfo(xp);
  mainSubject = subjectVisible ? (detectMainSubject(d.subjectStats)?.name || null) : null;
  const title = stageTitle(stageOf(xp), mainSubject);
  $("pfTitle").innerHTML = `${ICON.star}<span>${title}</span><em class="pf-i">i</em>`;
  $("pfTitle").onclick = () => openStageModal(xp);
  $("pfLvText").textContent = `লেভেল ${lv.level}`;
  $("pfLvNext").textContent = lv.isMax ? "সর্বোচ্চ লেভেল" : `পরের লেভেলে ${lv.xpNeeded.toLocaleString()} XP বাকি`;
  requestAnimationFrame(() => { $("pfLvFill").style.width = Math.max(3, lv.percentage) + "%"; });
  $("pfMRank").textContent = d.rank?.rank ? "#" + d.rank.rank : "—";
  $("pfMXp").textContent = xp.toLocaleString();
  const got = d.badges.filter(b => b.earned).length;
  $("pfMBadges").textContent = d.badges.length ? `${got}/${d.badges.length}` : "—";
  const showStats = !viewMode || viewIsFriend || viewPrivacy.publicStats;
  const st = showStats ? calcStreak(d.results) : 0;
  const stEl = $("pfStreak");
  stEl.classList.toggle("on", st > 0);
  stEl.innerHTML = st > 0 ? `${FLAME}${st} সপ্তাহ ধারাবাহিক` : "";
  renderPins(d);
}

function renderPins(d) {

function renderPinCard(d) {
  const host = $("pinCard"); if (!host) return;
  const earned = d.badges.filter(b => b.earned);
  if (!earned.length) { host.style.display = "none"; return; }
  host.style.display = "";
  const items = pinned.map(id => d.badges.find(b => b.id === id)).filter(Boolean);
  const slots = [];
  for (let i = 0; i < 3; i++) {
    const b = items[i];
    slots.push(b
      ? `<button class="pf-mini pf-slot" type="button" data-badge="${b.id}" style="--rc:${rarityOf(b).color}"><span class="pf-bico sm">${badgeIcon(b)}</span><span class="t">${b.title}</span></button>`
      : `<button class="pf-slot empty" type="button" data-edit="1" aria-label="ব্যাজ বেছে নাও">+</button>`);
  }
  host.innerHTML = `
    <div class="pf-head"><div><h2 class="pf-h">প্রিয় ব্যাজ</h2><div class="pf-note">সেরা ৩টি বেছে নাও — প্রোফাইল ও শেয়ার কার্ডে দেখাবে</div></div>
      <button class="pf-btn sm" type="button" data-edit="1">বদলাও</button></div>
    <div class="pf-slots">${slots.join("")}</div>`;
  host.querySelectorAll("[data-edit]").forEach(x => x.addEventListener("click", () => openPinPicker(d)));
  host.querySelectorAll("[data-badge]").forEach(x => x.addEventListener("click", () => showBadgeDetail(d.badges.find(b => b.id === x.dataset.badge))));
}

function openPinPicker(d) {
  const earned = d.badges.filter(b => b.earned);
  let sel = pinned.slice();
  const div = document.createElement("div");
  div.className = "pf-modal"; div.setAttribute("role", "dialog");
  div.innerHTML = `<div class="pf-modal-card">
    <h3>প্রিয় ব্যাজ বেছে নাও</h3>
    <div class="pf-note" id="pickCount"></div>
    <div class="pf-pick">${earned.map(b => `<button type="button" class="pf-mini" data-id="${b.id}" style="--rc:${rarityOf(b).color}"><span class="pf-bico sm">${badgeIcon(b)}</span><span class="t">${b.title}</span></button>`).join("")}</div>
    <div style="display:flex;gap:10px"><button class="pf-btn" type="button" id="pickCancel" style="flex:1">বাতিল</button><button class="pf-btn primary" type="button" id="pickSave" style="flex:1">সেভ</button></div>
  </div>`;
  document.body.appendChild(div);
  const paint = () => {
    div.querySelectorAll(".pf-mini").forEach(x => x.classList.toggle("sel", sel.includes(x.dataset.id)));
    div.querySelector("#pickCount").textContent = `${sel.length}/3 বাছাই করা হয়েছে`;
  };
  paint();
  div.addEventListener("click", async e => {
    if (e.target === div || e.target.closest("#pickCancel")) return div.remove();
    const m = e.target.closest(".pf-mini");
    if (m) {
      const id = m.dataset.id;
      sel = sel.includes(id) ? sel.filter(x => x !== id) : (sel.length < 3 ? [...sel, id] : sel);
      return paint();
    }
    if (e.target.closest("#pickSave")) {
      const btn = div.querySelector("#pickSave"); btn.disabled = true; btn.textContent = "...";
      try {
        await savePinnedBadges(student.studentId, sel);
        pinned = sel; div.remove();
        renderPins(d); renderPinCard(d);
        showToast("সেভ হয়েছে", "success");
      } catch (err) { showToast(friendlyError(err), "error"); btn.disabled = false; btn.textContent = "সেভ"; }
    }
  });
}

async function renderCards() {

// what goes along with the shared file / gets copied: just the link
const inviteText = link => link;

/* ---------- badges ---------- */
let badgeFilter = null;   // null = choose a sensible default on first render

function badgeIcon(b) { return badgeIconSvg(b.icon); }

const BADGE_GROUPS = [
  { id: "all", bn: "সব" }, { id: "battle", bn: "ব্যাটল" }, { id: "referral", bn: "রেফারেল" },
  { id: "practice", bn: "উন্নতি অনুশীলন" }, { id: "exam", bn: "পরীক্ষা" }, { id: "board", bn: "লিডারবোর্ড" }, { id: "social", bn: "সামাজিক" }
];
function badgeGroupOf(b) {
  const id = b.id || "";
  if (id.startsWith("battle-")) return "battle";
  if (id.startsWith("referral-")) return "referral";
  if (id.startsWith("imp-")) return "practice";
  if (b.category === "লিডারবোর্ড") return "board";
  if (b.category === "সামাজিক") return "social";
  return "exam";
}
const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function badgeCardHtml(x) {
  const r = rarityOf(x), rk = rarityKey(x.rarity);
  return `<button type="button" class="pf-badge tier-${rk} ${x.earned ? "earned" : "locked"}" data-badge="${x.id}" style="--rc:${r.color}">
    ${x.earned ? "" : `<span class="pf-lock">${LOCK_SVG}</span>`}
    <div class="pf-bico">${badgeIcon(x)}</div>
    <strong>${isSecretLocked(x) ? "গোপন ব্যাজ" : x.title}</strong>
    <span class="rar">${r.bn}</span>
    ${x.earned ? `<span class="got">অর্জিত</span>`
      : isSecretLocked(x) ? `<span class="sec">শর্ত অজানা</span>`
      : x.progress ? `<div class="prog"><div class="pf-bar"><i style="width:${Math.min(100, x.progress.value / x.progress.max * 100)}%"></i></div><small>${x.progress.text}</small></div>` : ""}
  </button>`;
}

function renderBadges(d) {
  const host = $("badgeCollection");
  const state = d.badges;
  if (!state.length) { host.innerHTML = `<div class="pf-card"><div class="pf-empty">ব্যাজ লোড করা যায়নি।</div></div>`; return; }

  const got = state.filter(x => x.earned), locked = state.filter(x => !x.earned);
  if (badgeFilter === null) badgeFilter = got.length ? "earned" : "all";
  const pct = Math.round(got.length / state.length * 100);
  const tally = Object.keys(RARITY).map(k => ({ k, n: got.filter(x => rarityKey(x.rarity) === k).length, t: state.filter(x => rarityKey(x.rarity) === k).length })).filter(x => x.t);
  const next = locked.filter(x => x.progress && x.progress.max > 1 && x.progress.value > 0)
    .sort((a, b) => (b.progress.value / b.progress.max) - (a.progress.value / a.progress.max)).slice(0, 3);
  const gCount = id => { const l = state.filter(x => id === "all" || badgeGroupOf(x) === id); return `${l.filter(x => x.earned).length}/${l.length}`; };

  const xpNow = Number(d.rank?.totalPoints || 0);
  host.innerHTML = `
    ${stageCollectionHtml(xpNow)}
    <div class="pf-card pf-bhero">
      <div class="pf-ring" style="--p:${pct}"><b>${pct}%</b></div>
      <div style="flex:1;min-width:0">
        <h2 class="pf-h">${viewMode ? "ব্যাজ সংগ্রহ" : "আমার ব্যাজ সংগ্রহ"}</h2>
        <div class="pf-note">${got.length}টি অর্জিত, ${locked.length}টি বাকি</div>
        <div class="pf-tally">${tally.map(t => `<span style="--rc:${RARITY[t.k].color}">${RARITY[t.k].bn} ${t.n}/${t.t}</span>`).join("")}</div>
      </div>
    </div>
    ${next.length ? `<div class="pf-card">
      <div class="pf-head" style="margin-bottom:6px"><div><h2 class="pf-h">পরবর্তী অর্জন</h2><div class="pf-note">আর একটু এগোলেই</div></div></div>
      <div class="pf-next">${next.map(x => `
        <button class="pf-nrow" type="button" data-badge="${x.id}" style="--rc:${rarityOf(x).color}">
          <span class="pf-bico sm">${badgeIcon(x)}</span>
          <span style="flex:1;min-width:0"><strong>${x.title}</strong><small>${x.requirement}</small>
            <span class="pf-bar" style="display:block;height:5px;margin-top:6px"><i style="width:${Math.min(100, x.progress.value / x.progress.max * 100)}%"></i></span></span>
          <span style="font-family:var(--font-num);font-size:.72rem;font-weight:800;color:var(--text-muted);white-space:nowrap">${x.progress.text}</span>
        </button>`).join("")}</div>
    </div>` : ""}
    <div class="pf-card">
      <div class="pf-chips">${BADGE_GROUPS.map(g => `<button class="pf-chip ${badgeGroup === g.id ? "active" : ""}" data-g="${g.id}">${g.bn} ${gCount(g.id)}</button>`).join("")}</div>
      <div class="pf-chips">
        <button class="pf-chip ${badgeFilter === "earned" ? "active" : ""}" data-f="earned">অর্জিত ${got.length}</button>
        <button class="pf-chip ${badgeFilter === "locked" ? "active" : ""}" data-f="locked">বাকি ${locked.length}</button>
        <button class="pf-chip ${badgeFilter === "all" ? "active" : ""}" data-f="all">সব ${state.length}</button>
      </div>
      <div id="pfBadgeGrid"></div>
    </div>`;

  const grid = $("pfBadgeGrid");
  const sections = BADGE_GROUPS.filter(g => g.id !== "all" && (badgeGroup === "all" || badgeGroup === g.id)).map(g => {
    const all = state.filter(x => badgeGroupOf(x) === g.id);
    const list = all.filter(x => badgeFilter === "all" || (badgeFilter === "earned" ? x.earned : !x.earned))
      .sort((a, b) => Number(b.earned) - Number(a.earned));
    return list.length ? `<div class="pf-gh"><span>${g.bn}</span><small>${all.filter(x => x.earned).length}/${all.length}</small></div><div class="pf-bgrid">${list.map(badgeCardHtml).join("")}</div>` : "";
  }).join("");
  grid.innerHTML = sections || `<div class="pf-empty">এখানে কিছু নেই।</div>`;

  bindStageTiles(host, xpNow);
  host.querySelectorAll("[data-g]").forEach(c => c.addEventListener("click", () => { badgeGroup = c.dataset.g; renderBadges(d); }));
  host.querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => { badgeFilter = c.dataset.f; renderBadges(d); }));
  host.querySelectorAll("[data-badge]").forEach(el => el.addEventListener("click", () => showBadgeDetail(state.find(x => x.id === el.dataset.badge))));
}

function showBadgeDetail(b, whose) {
  if (!b) return;
  const w = whose || (viewMode ? "them" : "me");
  const whoTxt = w === "them" ? "এই শিক্ষার্থী এটা অর্জন করেছে" : w === "both" ? "তোমরা দুজনেই এটা অর্জন করেছ" : "তুমি এটা অর্জন করেছ";
  $("badgeDetailModal")?.remove();
  const r = rarityOf(b), hide = isSecretLocked(b);
  const div = document.createElement("div");
  div.id = "badgeDetailModal"; div.className = "pf-modal"; div.setAttribute("role", "dialog");
  div.innerHTML = `<div class="pf-modal-card" style="--rc:${r.color}"><div class="pf-rays"></div>
    <div class="pf-bico">${badgeIcon(b)}</div>
    <div class="rar">${r.bn}</div>
    <h3>${hide ? "গোপন ব্যাজ" : b.title}</h3>
    <div class="pf-how"><b>কীভাবে অর্জন করবে?</b><br>${hide ? "এটা একটা গোপন ব্যাজ — নিজে খুঁজে বের করো!" : b.requirement}</div>
    ${b.progress && !hide && !b.earned ? `<div class="pf-bar"><i style="width:${Math.min(100, b.progress.value / b.progress.max * 100)}%"></i></div><p style="font-size:.74rem;font-weight:800;color:var(--text-muted);margin-top:6px">${b.progress.text}</p>` : ""}
    ${b.earned ? `<p style="font-size:.8rem;font-weight:900;color:var(--color-success)">${whoTxt}</p>` : ""}
    <button class="pf-btn primary" type="button" style="margin-top:14px;width:100%">বন্ধ করো</button>
  </div>`;
  document.body.appendChild(div);
  div.addEventListener("click", e => { if (e.target === div || e.target.closest("button")) div.remove(); });
}

function showBadgeUnlocks(state) {
  try {
    const key = `badge-seen-${student.studentId}`;
    const seen = new Set(JSON.parse(localStorage.getItem(key) || "[]"));
    const earned = state.filter(b => b.earned);
    localStorage.setItem(key, JSON.stringify(earned.map(b => b.id)));
    const fresh = earned.filter(b => !seen.has(b.id));
    if (!fresh.length) return;
    const b = fresh[0], r = rarityOf(b);
    const div = document.createElement("div");
    div.className = "pf-modal pf-unlock";
    div.innerHTML = `<div class="pf-modal-card" style="--rc:${r.color}"><div class="pf-rays"></div>
      <div class="rar" style="margin-bottom:10px">নতুন ব্যাজ অর্জিত</div>
      <div class="pf-bico">${badgeIcon(b)}</div>
      <h3>${b.title}</h3>
      <div class="pf-how">${b.requirement}</div>
      ${fresh.length > 1 ? `<p style="font-size:.74rem;font-weight:800;color:var(--text-muted)">আরও ${fresh.length - 1}টি নতুন ব্যাজ পেয়েছ — ব্যাজ ট্যাবে দেখো</p>` : ""}
      <button class="pf-btn primary" type="button" style="margin-top:12px;width:100%">চালিয়ে যাও</button>
    </div>`;
    document.body.appendChild(div);
    div.addEventListener("click", e => { if (e.target === div || e.target.closest("button")) div.remove(); });
  } catch {}
}

const fmtN = n => Number(n || 0).toLocaleString();

function stageCollectionHtml(xp) {
  const cur = getLevelInfo(xp), have = cur.level;
  const next = cur.isMax ? null : STAGES[cur.level];
  return `<div class="pf-card pf-stg">
    <div class="pf-head" style="margin-bottom:12px">
      <div><h2 class="pf-h">স্টেজ কালেকশন</h2><div class="pf-note">${have}/${STAGES.length} স্টেজ আনলক${mainSubject ? ` · <span class="pf-subj">${esc(mainSubject)}</span>` : ""}</div></div>
      <button class="pf-btn sm" type="button" data-stage-info>${ICON.info}বিস্তারিত</button>
    </div>
    <div class="pf-stages">${STAGES.map((st, i) => {
      const st8 = i + 1 < have ? "done" : i + 1 === have ? "now" : "lock";
      return `<button type="button" class="pf-stage ${st8}" data-stage-info style="--rc:${st.color};--p:${st8 === "now" ? Math.max(4, cur.percentage) : st8 === "done" ? 100 : 0}">
        <span class="pf-sm">${st8 === "lock" ? LOCK_SVG : i + 1}</span>
        <strong>${st.name}</strong>
        <small>${st8 === "now" ? "বর্তমান" : fmtN(LEVEL_THRESHOLDS[i]) + " XP"}</small>
      </button>`;
    }).join("")}</div>
    ${next ? `<div class="pf-stg-next"><span>পরের স্টেজ <b>${next.name}</b></span><span>আর ${fmtN(cur.xpNeeded)} XP</span></div>
      <div class="pf-bar" style="margin-top:6px"><i style="width:${Math.max(3, cur.percentage)}%"></i></div>` : `<div class="pf-stg-next"><span>সর্বোচ্চ স্টেজে পৌঁছে গেছে</span></div>`}
  </div>`;
}
function bindStageTiles(host, xp) {
  host.querySelectorAll("[data-stage-info]").forEach(b => b.addEventListener("click", () => openStageModal(xp)));
}

function openStageModal(xp) {
  $("stageModal")?.remove();
  const cur = getLevelInfo(xp), have = cur.level;
  const who = viewMode ? `${esc(student.name || "শিক্ষার্থী")}-এর` : "তোমার";
  const div = document.createElement("div");
  div.id = "stageModal"; div.className = "pf-modal"; div.setAttribute("role", "dialog");
  div.innerHTML = `<div class="pf-modal-card pf-stm">
    <div class="pf-sthero" style="--rc:${STAGES[Math.min(have, STAGES.length) - 1].color};--p:${Math.max(4, cur.percentage)}">
      <span class="pf-sm big">${have}</span>
      <h3>${esc(stageTitle(stageOf(xp), mainSubject))}</h3>
      <div class="pf-note">${who} বর্তমান XP <b>${fmtN(xp)}</b> · লেভেল ${have}${mainSubject ? `<br>প্রধান বিষয় (সবচেয়ে বেশি অনুশীলন): <span class="pf-subj">${esc(mainSubject)}</span>` : ""}</div>
      ${cur.isMax ? "" : `<div class="pf-bar" style="margin:10px auto 0;width:100%;max-width:240px"><i style="width:${Math.max(3, cur.percentage)}%"></i></div><div class="pf-note" style="margin-top:5px">পরের স্টেজে আর ${fmtN(cur.xpNeeded)} XP</div>`}
    </div>
    <div class="pf-ladder" style="--fill:${have >= STAGES.length ? 100 : (have - 1) / (STAGES.length - 1) * 100 + 100 / (STAGES.length - 1) * Math.min(1, cur.percentage / 100)}%">${STAGES.map((st, i) => {
      const lv = i + 1, need = LEVEL_THRESHOLDS[i];
      const state = lv < have ? "done" : lv === have ? "now" : "lock";
      const sub = state === "lock" ? `আর ${fmtN(need - xp)} XP লাগবে` : state === "now" ? "এখন এই স্টেজে" : "পার হয়েছে";
      return `<div class="pf-lrow ${state}" style="--rc:${st.color}">
        <span class="pf-sm">${state === "lock" ? LOCK_SVG : lv}</span>
        <div><strong>${st.name}</strong><small>লেভেল ${lv} · ${need === 0 ? "শুরু থেকেই" : fmtN(need) + " XP"}</small><small class="d">${st.bn}</small></div>
        <em>${sub}</em>
      </div>`;
    }).join("")}</div>
    <div class="pf-how"><b>XP কীভাবে বাড়বে?</b><br>পরীক্ষা, ব্যাটল, উন্নতি অনুশীলন, চ্যালেঞ্জ ও বন্ধু রেফার — সবকিছু থেকেই XP জমে। লেভেল বাড়লেই পরের স্টেজ খুলে যায়।</div>
    <button class="pf-btn primary" type="button" style="width:100%">বন্ধ করো</button>
  </div>`;
  document.body.appendChild(div);
  div.addEventListener("click", e => { if (e.target === div || e.target.closest("button")) div.remove(); });
  div.querySelector(".pf-lrow.now")?.scrollIntoView({ block: "center" });
}

let viewerDataPromise = null;
const loadViewerData = () => (viewerDataPromise ||= fetchData(viewer));

function avatarHtml(st) {
  return `<span class="cm-av">${esc((st.name || "S").charAt(0).toUpperCase())}${st.photoURL ? `<img src="${esc(st.photoURL)}" alt="" onerror="this.remove()">` : ""}</span>`;
}

function cmCountUp(root) {
  root.querySelectorAll("[data-n]").forEach(el => {
    const to = Number(el.dataset.n) || 0, t0 = performance.now(), dur = 900;
    const tick = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtN(Math.round(to * e));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

async function renderCompare(dThem, canBadge) {
  const host = $("cmpHost"); if (!host) return;
  host.innerHTML = `<div class="pf-card"><div class="spinner" style="margin:18px auto"></div></div>`;
  let dMe;
  try { dMe = await loadViewerData(); } catch (e) { console.warn("viewer data failed", e); host.innerHTML = ""; return; }

  const xpMe = Number(dMe.rank?.totalPoints || 0), xpTh = Number(dThem.rank?.totalPoints || 0);
  const lvMe = getLevelInfo(xpMe), lvTh = getLevelInfo(xpTh);
  const sMe = stageOf(xpMe), sTh = stageOf(xpTh);
  const subMe = detectMainSubject(dMe.subjectStats)?.name || null;
  const subTh = subjectVisible ? (detectMainSubject(dThem.subjectStats)?.name || null) : null;
  const nameTh = esc(student.name || "শিক্ষার্থী");
  const gotMe = dMe.badges.filter(b => b.earned), gotTh = dThem.badges.filter(b => b.earned);

  const rows = [
    { l: "মোট XP", a: xpMe, b: xpTh },
    { l: "লেভেল", a: lvMe.level, b: lvTh.level, max: STAGES.length }
  ];
  if (canBadge) {
    rows.push({ l: "ব্যাজ", a: gotMe.length, b: gotTh.length, max: Math.max(dMe.badges.length, 1) });
    Object.keys(RARITY).forEach(k => {
      const a = gotMe.filter(x => rarityKey(x.rarity) === k).length, b = gotTh.filter(x => rarityKey(x.rarity) === k).length;
      const t = dMe.badges.filter(x => rarityKey(x.rarity) === k).length;
      if (t && (a || b)) rows.push({ l: RARITY[k].bn, a, b, max: t, color: RARITY[k].color });
    });
  }
  const rowHtml = (r, i) => {
    const mx = r.max || Math.max(r.a, r.b, 1);
    return `<div class="cm-row" style="--i:${i};--a:${Math.min(100, r.a / mx * 100)}%;--b:${Math.min(100, r.b / mx * 100)}%;${r.color ? `--rc:${r.color}` : ""}">
      <b class="cm-v ${r.a > r.b ? "lead" : ""}" data-n="${r.a}">0</b>
      <div class="cm-mid"><span>${r.l}</span><div class="cm-track"><div class="h l"><i></i></div><div class="h r"><i></i></div></div></div>
      <b class="cm-v ${r.b > r.a ? "lead" : ""}" data-n="${r.b}">0</b>
    </div>`;
  };

  const diff = xpMe - xpTh;
  const verdict = diff === 0 ? "XP-তে সমান সমান" : diff > 0 ? `XP-তে তুমি ${fmtN(diff)} এগিয়ে` : `XP-তে ${nameTh} ${fmtN(-diff)} এগিয়ে`;

  const seg = (lv, color) => STAGES.map((_, i) => `<b class="${i < lv ? "on" : ""}" style="--d:${i * 70}ms"></b>`).join("");

  const meIds = new Set(gotMe.map(b => b.id)), thIds = new Set(gotTh.map(b => b.id));
  const sets = canBadge ? {
    both: gotMe.filter(b => thIds.has(b.id)),
    me: gotMe.filter(b => !thIds.has(b.id)),
    th: gotTh.filter(b => !meIds.has(b.id))
  } : null;
  let tab = sets ? (sets.both.length ? "both" : sets.th.length ? "th" : "me") : null;

  host.innerHTML = `<div class="pf-card pf-cmp" id="cmpCard">
    <div class="pf-head" style="margin-bottom:14px"><div><h2 class="pf-h">তুলনা</h2><div class="pf-note">${verdict}</div></div></div>
    <div class="cm-duel">
      <div class="cm-p">${avatarHtml(viewer)}<strong>তুমি</strong><small>${esc(stageTitle(sMe, subMe))}</small></div>
      <div class="cm-vs">VS</div>
      <div class="cm-p">${avatarHtml(student)}<strong>${nameTh}</strong><small>${esc(stageTitle(sTh, subTh))}</small></div>
    </div>
    <div class="cm-rows">${rows.map(rowHtml).join("")}</div>
    <div class="cm-sub">স্টেজের পথ</div>
    <div class="cm-seg"><span>তুমি</span><div style="--rc:${sMe.color}">${seg(lvMe.level)}</div></div>
    <div class="cm-seg"><span>${nameTh}</span><div style="--rc:${sTh.color}">${seg(lvTh.level)}</div></div>
    ${sets ? `<div class="cm-sub">ব্যাজ মিলিয়ে দেখো</div>
      <div class="pf-chips" id="cmTabs">
        <button class="pf-chip" data-t="both">দুজনেরই ${sets.both.length}</button>
        <button class="pf-chip" data-t="me">শুধু আমার ${sets.me.length}</button>
        <button class="pf-chip" data-t="th">শুধু ${nameTh.length > 12 ? "ওর" : nameTh} ${sets.th.length}</button>
      </div><div class="cm-bl" id="cmList"></div>` : `<div class="pf-note" style="margin-top:14px">ব্যাজ তুলনা দেখতে বন্ধু হতে হবে এবং সে ব্যাজ দেখানোর অনুমতি দিয়ে রাখতে হবে।</div>`}
  </div>`;

  const card = $("cmpCard");
  const paintList = () => {
    if (!sets) return;
    card.querySelectorAll("#cmTabs .pf-chip").forEach(c => c.classList.toggle("active", c.dataset.t === tab));
    const list = sets[tab], el = $("cmList");
    el.innerHTML = list.length ? list.map((b, i) => `<button type="button" class="cm-b" data-id="${b.id}" style="--rc:${rarityOf(b).color};--d:${Math.min(i, 14) * 55}ms">
        <span class="pf-bico sm">${badgeIcon(b)}</span><small>${b.title}</small></button>`).join("")
      : `<div class="pf-empty" style="grid-column:1/-1">এখানে কিছু নেই।</div>`;
    el.querySelectorAll(".cm-b").forEach(x => x.addEventListener("click", () => {
      const b = list.find(v => v.id === x.dataset.id);
      showBadgeDetail(b, tab === "both" ? "both" : tab === "me" ? "me" : "them");
    }));
  };
  if (sets) {
    card.querySelectorAll("#cmTabs .pf-chip").forEach(c => c.addEventListener("click", () => { tab = c.dataset.t; paintList(); }));
    paintList();
  }
  const go = () => { card.classList.add("go"); cmCountUp(card); };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); go(); } }, { threshold: .25 });
    io.observe(card);
  } else go();
}

/* ---------- friends ---------- */
let allNetStudents = [], friendIds = [], incomingReqs = [], outgoingReqs = [];
let dirBatchFilter = "all", dirSearchTerm = "";

async function loadNetworkData() {
  try {
    const [students, fIds, inc, out] = await Promise.all([
      getActiveStudents(), getMyFriendIds(student.studentId),
      getIncomingRequests(student.studentId), getOutgoingRequests(student.studentId)
    ]);
    allNetStudents = students; friendIds = fIds; incomingReqs = inc; outgoingReqs = out;
    if (dirBatchFilter === "all" && student.className) dirBatchFilter = normalizeBatch(student.className);
    const dot = $("pfReqDot");
    if (dot) { dot.textContent = inc.length; dot.classList.toggle("on", inc.length > 0); }
    renderReqsAndFriends();
    renderDirectoryFilters();
    renderDirectory();
  } catch (err) {
    console.warn("Network load failed", err);
    const el = $("reqAndFriendsSection");
    if (el) el.innerHTML = `<div class="pf-card"><div class="pf-empty">বন্ধুদের তালিকা লোড করা যায়নি।</div></div>`;
  }
}

function refreshAfterFriendChange() {
  loadNetworkData();
  loadData(true).then(d => { fillHero(d); renderBadges(d); }).catch(() => {});
}

function renderReqsAndFriends() {
  const el = $("reqAndFriendsSection");
  const nameOf = {}, classOf = {};
  allNetStudents.forEach(s => { nameOf[s.studentId] = s.name; classOf[s.studentId] = s.className; });

  let html = "";
  if (incomingReqs.length) {
    html += `<div class="pf-card" style="margin-bottom:14px">
      <div class="pf-head"><div><h2 class="pf-h">বন্ধুত্বের অনুরোধ</h2><div class="pf-note">${incomingReqs.length}টি অপেক্ষায়</div></div></div>
      ${incomingReqs.map(r => `
        <div class="pf-row">
          <div class="pf-rname">${esc(nameOf[r.fromStudentId] || r.fromStudentId)}${classOf[r.fromStudentId] ? `<small>${esc(classOf[r.fromStudentId])}</small>` : ""}
            ${r.viaReferral ? `<br><span class="pf-tag">তোমার লিংকে যুক্ত হয়েছে</span>` : ""}</div>
          <div style="display:flex;gap:6px;flex:none">
            <button class="pf-btn sm req-reject" data-id="${r.id}" type="button">বাতিল</button>
            <button class="pf-btn sm primary req-accept" data-id="${r.id}" type="button">গ্রহণ</button>
          </div>
        </div>`).join("")}
    </div>`;
  }

  html += `<div class="pf-card" style="margin-bottom:14px">
    <div class="pf-head"><div><h2 class="pf-h">আমার বন্ধুরা</h2><div class="pf-note">${friendIds.length} / ${MAX_FRIENDS}</div></div></div>
    ${friendIds.length === 0 ? `<div class="pf-empty">এখনো কোনো বন্ধু যোগ হয়নি।</div>` : friendIds.map(fid => `
      <div class="pf-row">
        <div class="pf-rname"><a href="profile.html?sid=${esc(fid)}" style="color:inherit;text-decoration:none">${esc(nameOf[fid] || fid)}</a>${classOf[fid] ? `<small>${esc(classOf[fid])}</small>` : ""}</div>
        <button class="pf-btn sm danger friend-remove" data-id="${fid}" type="button">সরাও</button>
      </div>`).join("")}
  </div>`;

  el.innerHTML = html;
  el.querySelectorAll(".req-accept").forEach(b => b.addEventListener("click", () => acceptReq(b.dataset.id)));
  el.querySelectorAll(".req-reject").forEach(b => b.addEventListener("click", async () => { try { await rejectFriendRequest(b.dataset.id); refreshAfterFriendChange(); } catch (e) { showToast(friendlyError(e), "error"); } }));
  el.querySelectorAll(".friend-remove").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("এই বন্ধুকে তালিকা থেকে সরাতে চাও?")) return;
    try { await removeFriend(student.studentId, b.dataset.id); showToast("সরানো হয়েছে", "success"); refreshAfterFriendChange(); } catch (e) { showToast(friendlyError(e), "error"); }
  }));
}

async function acceptReq(id) {
  try { await acceptFriendRequest(id, student.studentId); showToast("বন্ধু যুক্ত হলো", "success"); refreshAfterFriendChange(); }
  catch (err) { showToast(friendlyError(err), "error"); }
}

function renderDirectoryFilters() {
  const el = $("dirFilters");
  const batches = [...new Set(allNetStudents.map(s => normalizeBatch(s.className) || "Other"))].sort();
  el.innerHTML = `<button class="pf-chip ${dirBatchFilter === "all" ? "active" : ""}" data-batch="all">সব ব্যাচ</button>` +
    batches.map(b => `<button class="pf-chip ${dirBatchFilter === b ? "active" : ""}" data-batch="${esc(b)}">${esc(b)}</button>`).join("");
  el.querySelectorAll(".pf-chip").forEach(c => c.addEventListener("click", () => { dirBatchFilter = c.dataset.batch; renderDirectoryFilters(); renderDirectory(); }));
}

function renderDirectory() {
  const list = $("dirList");
  let rows = allNetStudents.filter(s => s.studentId !== student.studentId);
  if (dirBatchFilter !== "all") rows = rows.filter(s => (normalizeBatch(s.className) || "Other") === dirBatchFilter);
  if (dirSearchTerm) rows = rows.filter(s => String(s.name || "").toLowerCase().includes(dirSearchTerm));
  if (!rows.length) { list.innerHTML = `<div class="pf-empty">কাউকে পাওয়া যায়নি।</div>`; return; }

  list.innerHTML = rows.map(s => {
    const isFriend = friendIds.includes(s.studentId);
    const inc = incomingReqs.find(r => r.fromStudentId === s.studentId);
    const out = outgoingReqs.find(r => r.toStudentId === s.studentId);
    const act = isFriend ? `<span class="pf-state ok">বন্ধু</span>`
      : inc ? `<button class="pf-btn sm primary req-accept" data-id="${inc.id}" type="button">গ্রহণ করো</button>`
      : out ? `<span class="pf-state wait">অপেক্ষমাণ</span>`
      : `<button class="pf-btn sm send-req" data-sid="${esc(s.studentId)}" type="button">+ যোগ করো</button>`;
    return `<div class="pf-row"><div class="pf-rname"><a href="profile.html?sid=${esc(s.studentId)}" style="color:inherit;text-decoration:none">${esc(s.name)}</a><small>${esc(s.className || "N/A")}</small></div><div style="flex:none">${act}</div></div>`;
  }).join("");

  list.querySelectorAll(".req-accept").forEach(b => b.addEventListener("click", () => acceptReq(b.dataset.id)));
  list.querySelectorAll(".send-req").forEach(b => b.addEventListener("click", async () => {
    const txt = b.textContent; b.disabled = true; b.textContent = "...";
    try { await sendFriendRequest(student.studentId, b.dataset.sid); showToast("অনুরোধ পাঠানো হয়েছে", "success"); await loadNetworkData(); }
    catch (err) { showToast(friendlyError(err), "error"); b.disabled = false; b.textContent = txt; }
  }));
}

        ${metric(rankText, "র‍্যাঙ্ক")}${metric(xp.toLocaleString(), "মোট XP")}${metric(`${got.length}/${d.badges.length || 0}`, "ব্যাজ")}
      </div>
    </div>

    ${showList.length ? `
    <div style="margin-top:12px;padding:16px;border-radius:20px;background:#fff;border:1px solid ${LINE};">
      <div style="font-size:13px;font-weight:900;color:${INK};margin-bottom:11px;line-height:1.4;">${shown.length ? "প্রিয় ব্যাজ" : "অর্জিত ব্যাজ"}</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;">
        ${showList.map(b => `<span style="padding:6px 11px;border-radius:999px;background:rgba(184,134,60,.12);border:1px solid rgba(184,134,60,.28);color:#8a6222;font-size:11px;font-weight:800;line-height:1.4;">${esc(b.title)}</span>`).join("")}
        ${!shown.length && got.length > 8 ? `<span style="padding:6px 11px;border-radius:999px;background:#efede4;color:${SOFT};font-size:11px;font-weight:800;line-height:1.4;">+${got.length - 8}</span>` : ""}
      </div>
    </div>` : ""}

    <div id="cardCta" style="margin-top:12px;padding:20px 16px 18px;border-radius:20px;background:#fff;border:1px solid ${LINE};text-align:center;">
      ${qrUrl ? `<img id="cardQr" src="${qrUrl}" width="168" height="168" style="width:168px;height:168px;display:block;margin:0 auto;">` : ""}
      <div style="margin-top:${qrUrl ? 12 : 0}px;font-size:13px;font-weight:900;letter-spacing:.32em;text-indent:.32em;color:${A};line-height:1.4;">SCAN</div>
      <div style="margin-top:4px;font-size:11px;font-weight:700;color:${MUTED};line-height:1.5;">স্ক্যান করে আমার বন্ধু হও</div>
    </div>
  </div>`;
}

async function generateProfileCard(format) {
  const btn = $("shareProfileBtn");
  const original = btn.innerHTML;
  btn.disabled = true; btn.textContent = "কার্ড তৈরি হচ্ছে...";

  try {
    const d = await loadData();
    const link = referralLink();
    const qrUrl = await makeQr(link, 512);

    const area = $("shareCardArea");
    area.innerHTML = buildProfileCardHtml(d, qrUrl);

    // photo: if it can't load (blocked / bad link), fall back to the initial — never a broken image
    const photo = area.querySelector("#cardPhoto");
    if (photo) {
      await new Promise(res => { if (photo.complete) return res(); photo.onload = res; photo.onerror = res; });
      if (!photo.naturalWidth) photo.remove();
    }
    try { await document.fonts.load('800 14px "Noto Sans Bengali"', "অআক"); await document.fonts.ready; } catch {}

    const qrImg = area.querySelector("#cardQr");
    if (qrImg) { try { await qrImg.decode(); } catch {} }
    const card = area.querySelector("#profileCardInner");
    const canvas = await html2canvas(card, { scale: 2, backgroundColor: "#f6f5f1", useCORS: true });
    const base = `${student.name}_প্রোফাইল`.replace(/\s+/g, "_");
    const w = canvas.width / 2, h = canvas.height / 2;

    let file, dataUrl;
    if (format === "png") {
      dataUrl = canvas.toDataURL("image/png");
      const blob = await (await fetch(dataUrl)).blob();
      file = new File([blob], `${base}.png`, { type: "image/png" });
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "px", format: [w, h] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, w, h);
      // the invite panel is a real tappable link inside the PDF
      const cta = card.querySelector("#cardCta");
      if (cta) {
        const cr = cta.getBoundingClientRect(), br = card.getBoundingClientRect();
        pdf.link(cr.left - br.left, cr.top - br.top, cr.width, cr.height, { url: link });
      }
      const blob = pdf.output("blob");
      file = new File([blob], `${base}.pdf`, { type: "application/pdf" });
      dataUrl = URL.createObjectURL(blob);
    }

    const text = inviteText(link);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: base, text }); return; }
      catch (err) { if (err && err.name === "AbortError") return; }
    }
    // Fallback (desktop / browsers that can't share files): save the file + copy the invite link
    const a = document.createElement("a"); a.href = dataUrl; a.download = file.name; a.click();
    const copied = await copyText(text);
    showToast(copied ? "ফাইল সেভ হয়েছে, লিংক কপি হয়েছে" : "ফাইল সেভ হয়েছে", "success");
  } catch (err) {
    console.error("Profile card failed", err);
    showToast("কার্ড তৈরি করা যায়নি।", "error");
  } finally {
    $("shareCardArea").innerHTML = "";
    btn.disabled = false; btn.innerHTML = original;
  }
}

} // end if (__ok)
</script>
