<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোফাইল — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  body { overflow-x: hidden; background: var(--bg-app); }
  .app-shell { max-width: 600px; margin: 0 auto; padding-bottom: 48px; }
  .pf { display: grid; gap: 14px; margin-top: 14px; }

  /* ---------- generic pieces ---------- */
  .pf-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-soft); }
  .pf-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .pf-h { font-size: 1rem; font-weight: 900; color: var(--text-primary); }
  .pf-note { font-size: .72rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }
  .pf-empty { padding: 22px 10px; text-align: center; font-size: .8rem; font-weight: 700; color: var(--text-muted); }
  .pf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-primary); font-size: .82rem; font-weight: 800; cursor: pointer; transition: transform var(--transition), background var(--transition); }
  .pf-btn:active { transform: scale(.97); }
  .pf-btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .pf-btn.danger { color: var(--color-danger); border-color: rgba(166,64,47,.3); background: transparent; }
  .pf-btn.sm { padding: 7px 11px; font-size: .74rem; border-radius: 10px; }
  .pf-btn:disabled { opacity: .6; cursor: not-allowed; }
  .pf-btn svg { flex: none; }

  /* ---------- hero ---------- */
  .pf-hero { position: relative; overflow: hidden; padding: 20px; border-radius: 24px; border: 1px solid rgba(var(--color-accent-rgb), .28); background: linear-gradient(140deg, rgba(var(--color-accent-rgb), .15), var(--surface) 64%); box-shadow: var(--shadow-soft); }
  .pf-id { display: flex; gap: 16px; align-items: center; }
  .pf-avatar { position: relative; width: 84px; height: 84px; flex: none; border-radius: 26px; overflow: hidden; background: linear-gradient(135deg, var(--color-accent), #7c5a22); color: #fff; display: grid; place-items: center; font-size: 2rem; font-weight: 900; border: 2px solid rgba(var(--color-accent-rgb), .45); }
  .pf-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .pf-name { font-size: 1.35rem; font-weight: 900; line-height: 1.2; color: var(--text-primary); word-break: break-word; }
  .pf-sub { margin-top: 4px; font-size: .78rem; font-weight: 700; color: var(--text-secondary); }
  .pf-title { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; padding: 5px 10px; border-radius: 999px; background: rgba(var(--color-accent-rgb), .12); border: 1px solid rgba(var(--color-accent-rgb), .25); color: var(--color-accent); font-size: .72rem; font-weight: 900; }
  .pf-level { margin-top: 18px; }
  .pf-level-row { display: flex; justify-content: space-between; gap: 10px; font-size: .72rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 6px; }
  .pf-bar { height: 8px; border-radius: 99px; background: var(--surface-edge); overflow: hidden; }
  .pf-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #d9a84e, var(--color-accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .pf-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .pf-metric { padding: 11px 4px; text-align: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--surface-border); }
  .pf-metric b { display: block; font-family: var(--font-num); font-size: 1.05rem; font-weight: 800; color: var(--text-primary); }
  .pf-metric span { display: block; margin-top: 2px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .pf-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pf-actions .pf-btn { flex: 1; }

  /* ---------- tabs ---------- */
  .pf-tabs { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: var(--surface-edge); border: 1px solid var(--surface-border); }
  .pf-tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border: 0; border-radius: 12px; background: transparent; color: var(--text-secondary); font-size: .8rem; font-weight: 800; cursor: pointer; transition: background var(--transition), color var(--transition); }
  .pf-tab.active { background: var(--surface); color: var(--color-accent); box-shadow: var(--shadow-soft); }
  .pf-dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; display: none; place-items: center; background: var(--color-danger); color: #fff; font-size: .62rem; font-weight: 900; }
  .pf-dot.on { display: inline-grid; }
  .pf-pane { display: none; gap: 14px; }
  .pf-pane.active { display: grid; animation: pfIn .25s ease; }
  @keyframes pfIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- overview ---------- */
  .pf-records { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pf-rec { padding: 14px; border-radius: 16px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-rec b { display: block; font-family: var(--font-num); font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }
  .pf-rec span { display: block; margin-top: 3px; font-size: .72rem; font-weight: 700; color: var(--text-muted); }
  .pf-strength { display: grid; gap: 12px; }
  .pf-srow { display: grid; grid-template-columns: 96px 1fr 46px; gap: 10px; align-items: center; }
  .pf-srow span { font-size: .76rem; font-weight: 800; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-srow b { font-family: var(--font-num); font-size: .78rem; font-weight: 800; text-align: right; color: var(--color-accent); }

  /* scan card */
  .pf-scan { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 18px; }
  .pf-qr { width: 176px; height: 176px; padding: 12px; border-radius: 22px; background: #fff; border: 1px solid var(--surface-border); box-shadow: var(--shadow-soft); display: grid; place-items: center; }
  .pf-qr img { display: block; width: 100%; height: 100%; }
  .pf-qr .spinner { margin: 0; }
  .pf-scan-lbl { font-size: .78rem; font-weight: 900; letter-spacing: .32em; text-indent: .32em; color: var(--color-accent); }

  /* ---------- badges ---------- */
  .pf-bsum { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pf-bsum big { font-family: var(--font-num); font-size: 1.7rem; font-weight: 800; color: var(--color-accent); }
  .pf-bsum big small { font-size: .8rem; color: var(--text-muted); font-weight: 700; }
  .pf-next { display: grid; gap: 4px; margin-top: 4px; }
  .pf-nrow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border: 0; background: transparent; text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; }
  .pf-nrow + .pf-nrow { border-top: 1px solid var(--surface-border); }
  .pf-nrow strong { display: block; font-size: .8rem; font-weight: 900; color: var(--text-primary); }
  .pf-nrow small { display: block; margin-top: 2px; font-size: .68rem; font-weight: 700; color: var(--text-muted); }
  .pf-chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
  .pf-chips::-webkit-scrollbar { display: none; }
  .pf-chip { padding: 7px 13px; border-radius: 99px; white-space: nowrap; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-secondary); font-size: .74rem; font-weight: 800; cursor: pointer; }
  .pf-chip.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .pf-bgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pf-badge { --rc: #8b95a5; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 16px 10px 14px; border-radius: 18px; border: 1px solid var(--surface-border); background: var(--surface-highlight); color: var(--text-primary); font: inherit; cursor: pointer; transition: transform var(--transition), border-color var(--transition); }
  .pf-badge:active { transform: scale(.98); }
  .pf-badge.earned { border-color: color-mix(in srgb, var(--rc) 45%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 11%, var(--surface)), var(--surface)); }
  .pf-bico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--rc) 32%, transparent); margin-bottom: 4px; }
  .pf-bico svg { width: 26px; height: 26px; }
  .pf-bico.sm { width: 44px; height: 44px; border-radius: 14px; margin: 0; flex: none; }
  .pf-bico.sm svg { width: 22px; height: 22px; }
  .pf-badge.locked .pf-bico { color: var(--text-muted); background: var(--surface-edge); border-color: var(--surface-border); filter: grayscale(.6); opacity: .8; }
  .pf-badge strong { font-size: .76rem; font-weight: 900; line-height: 1.3; }
  .pf-badge .rar { font-size: .6rem; font-weight: 900; letter-spacing: .04em; color: var(--rc); }
  .pf-badge.locked .rar { color: var(--text-muted); }
  .pf-badge .got { margin-top: 2px; font-size: .68rem; font-weight: 900; color: var(--color-success); }
  .pf-badge .prog { width: 100%; margin-top: 6px; }
  .pf-badge .prog .pf-bar { height: 5px; }
  .pf-badge .prog small { display: block; margin-top: 4px; font-size: .64rem; font-weight: 800; color: var(--text-muted); }
  .pf-badge .sec { margin-top: 2px; font-size: .66rem; font-weight: 700; color: var(--text-muted); }

  .pf-modal { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.55); animation: pfIn .2s ease; }
  .pf-modal-card { --rc: #8b95a5; width: min(360px, 100%); padding: 26px 22px 20px; border-radius: 24px; text-align: center; background: var(--surface); border: 1px solid var(--surface-border); box-shadow: var(--shadow-lift); }
  .pf-modal-card .pf-bico { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 12px; }
  .pf-modal-card .pf-bico svg { width: 42px; height: 42px; }
  .pf-modal-card h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
  .pf-modal-card .rar { font-size: .68rem; font-weight: 900; color: var(--rc); }
  .pf-how { margin: 14px 0; padding: 12px; border-radius: 14px; background: var(--surface-highlight); text-align: left; font-size: .8rem; line-height: 1.6; color: var(--text-secondary); font-weight: 600; }
  .pf-how b { color: var(--text-primary); }
  .pf-unlock .pf-bico { animation: pfPop .7s cubic-bezier(.18,.9,.2,1); }
  @keyframes pfPop { 0% { transform: scale(.4) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }

  /* ---------- friends ---------- */
  .pf-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-row + .pf-row { margin-top: 8px; }
  .pf-rname { font-size: .88rem; font-weight: 800; color: var(--text-primary); min-width: 0; }
  .pf-rname small { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 6px; background: var(--surface-edge); font-size: .66rem; font-weight: 700; color: var(--text-muted); }
  .pf-tag { display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 6px; font-size: .64rem; font-weight: 800; background: rgba(var(--color-accent-rgb), .12); color: var(--color-accent); }
  .pf-state { padding: 4px 10px; border-radius: 8px; font-size: .68rem; font-weight: 800; white-space: nowrap; }
  .pf-state.ok { background: rgba(47,125,94,.12); color: var(--color-success); }
  .pf-state.wait { background: var(--surface-edge); color: var(--text-muted); }
  .pf-search { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 12px; border-radius: 12px; background: var(--surface-highlight); border: 1px solid var(--surface-border); }
  .pf-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: .85rem; font-weight: 600; color: var(--text-primary); }

  @media (max-width: 380px) { .pf-metrics { grid-template-columns: repeat(2, 1fr); } .pf-avatar { width: 72px; height: 72px; font-size: 1.7rem; } }
  @media (min-width: 520px) { .pf-bgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .pf-tg { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--surface-border); font-size:.86rem; font-weight:600; cursor:pointer; }
  .pf-tg input { display:none; }
  .pf-tg i { flex:none; width:42px; height:24px; border-radius:99px; background:rgba(128,128,128,.35); position:relative; transition:.2s; }
  .pf-tg i::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
  .pf-tg input:checked + i { background:var(--color-accent); }
  .pf-tg input:checked + i::after { left:21px; }
  .pf-inp { width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:8px; border-radius:12px; border:1.5px solid var(--surface-border); background:var(--surface-solid,#fff); color:inherit; font-size:.95rem; outline:none; }
  .pf-inp:focus { border-color:var(--color-accent); }
</style>
</head>
<body oncontextmenu="return false;">
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<div id="shareCardArea" style="position:fixed;left:-9999px;top:0;"></div>

<script>
(function () {
  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showProfileError(title, details) {
    const shell = document.getElementById("shell");
    if (!shell) return;
    window.__profileErrorShown = true;

    shell.innerHTML = `
      <div style="
        min-height:100vh;
        box-sizing:border-box;
        padding:24px;
        display:flex;
        align-items:flex-start;
        justify-content:center;
        background:#fff;
        font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      ">
        <div style="
          width:100%;
          max-width:760px;
          margin-top:20px;
          padding:22px;
          box-sizing:border-box;
          border:2px solid #ef4444;
          border-radius:18px;
          background:#fff1f2;
          color:#7f1d1d;
          box-shadow:0 8px 30px rgba(0,0,0,.08);
        ">
          <div style="
            font-size:22px;
            font-weight:900;
            margin-bottom:10px;
          ">প্রোফাইল ত্রুটি</div>

          <div style="
            font-size:16px;
            font-weight:800;
            margin-bottom:14px;
          ">${esc(title)}</div>

          <pre style="
            margin:0;
            padding:14px;
            box-sizing:border-box;
            white-space:pre-wrap;
            word-break:break-word;
            overflow:auto;
            border-radius:12px;
            background:#fff;
            color:#111827;
            font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
          ">${esc(details)}</pre>

          <div style="
            margin-top:14px;
            font-size:13px;
            line-height:1.5;
            color:#991b1b;
          ">
            এই error-এর screenshot পাঠাও। এতে কোন file/import/line-এ
            সমস্যা হচ্ছে সেটা সরাসরি ধরা যাবে।
          </div>
        </div>
      </div>
    `;
  }

  window.addEventListener("error", function (event) {
    // Resource-load failures (e.g. a 404 on a <script>/module import) have
    // no message/filename — they only show up via event.target. Handle both.
    const target = event.target;
    if (target && target !== window && (target.src || target.href)) {
      showProfileError(
        "রিসোর্স লোড ত্রুটি (ফাইল পাওয়া যায়নি)",
        [
          "ট্যাগ: " + (target.tagName || "অজানা"),
          "URL: " + (target.src || target.href || "অজানা"),
          "",
          "সম্ভবত এই ফাইলের path ভুল আছে অথবা GitHub Pages-এ ফাইলটি ওই path-এ নেই।"
        ].join("\n")
      );
      return;
    }
    showProfileError(
      "জাভাস্ক্রিপ্ট / মডিউল ত্রুটি",
      [
        "বার্তা: " + (event.message || "অজানা ত্রুটি"),
        "ফাইল: " + (event.filename || "অজানা ফাইল"),
        "লাইন: " + (event.lineno || "?"),
        "কলাম: " + (event.colno || "?"),
        "",
        "স্ট্যাক: " + (event.error && event.error.stack
          ? event.error.stack
          : "স্ট্যাক পাওয়া যায়নি")
      ].join("\n")
    );
  }, true);

  window.addEventListener("unhandledrejection", function (event) {
    const reason = event.reason;
    console.error("Profile non-fatal Promise error:", reason);
    // Do not replace the whole Profile shell for an optional feature failure.
    // The feature itself is responsible for showing its own safe empty/error state.
  });

  window.addEventListener("securitypolicyviolation", function (event) {
    console.error("Profile CSP warning:", event.blockedURI || "unknown");
  });

  window.__showProfileError = showProfileError;
})();
</script>

<script type="module">
let initTheme, toggleTheme, renderState, renderStudentHeader, showToast, friendlyError;
let getActiveStudent, refreshActiveStudent, getActiveStudents;
let getApprovedResults, getStudentRank, getUpcomingExams;
let computeOverallStats, computeSubjectStats, computeChapterStats, computeTopicStats;
let computeGamificationData;
let db;
let doc, getDoc, collection, getDocs;
let getMyFriendIds, getIncomingRequests, getOutgoingRequests, sendFriendRequest, acceptFriendRequest, rejectFriendRequest, removeFriend, MAX_FRIENDS, getRival;
let getChallengeWinCount, sendChallenge;
let requireStudentSession, studentLogout, changeMyPassword, getPrivacy, savePrivacy, friendlyStudentAuthError;
let viewPrivacy = { records: true, subjects: true, badges: true, publicStats: false };
let getLevelInfo;

async function loadModule(path, run) {
  try {
    const mod = await import(path);
    run(mod);
    return true;
  } catch (err) {
    if (window.__showProfileError) {
      window.__showProfileError(
        "মডিউল ইম্পোর্ট ত্রুটি (ফাইল লোড হয়নি)",
        "ফাইল: " + path + "\nত্রুটি: " + (err && err.message ? err.message : String(err)) +
        "\n\nএই path-এ ফাইলটি GitHub repo-তে নেই, নাম ভুল আছে, অথবা ফাইলের ভেতরেই সিন্ট্যাক্স এরর আছে।"
      );
    }
    return false;
  }
}

const __ok = (
  await loadModule("../js/utils/ui-utils.js", m => ({ initTheme, toggleTheme, renderState, renderStudentHeader, showToast, friendlyError } = m)) &&
  await loadModule("../js/utils/student-utils.js", m => ({ getActiveStudent, refreshActiveStudent, getActiveStudents } = m)) &&
  await loadModule("../js/utils/results-utils.js", m => ({ getApprovedResults, getStudentRank, getUpcomingExams } = m)) &&
  await loadModule("../js/utils/analytics-utils.js", m => ({ computeOverallStats, computeSubjectStats, computeChapterStats, computeTopicStats } = m)) &&
  await loadModule("../js/utils/gamification-utils.js", m => ({ computeGamificationData } = m)) &&
  await loadModule("../js/firebase/firebase-config.js", m => ({ db } = m)) &&
  await loadModule("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js", m => ({ doc, getDoc, collection, getDocs } = m)) &&
  await loadModule("../js/utils/friend-utils.js?v=ref1", m => ({ getMyFriendIds, getIncomingRequests, getOutgoingRequests, sendFriendRequest, acceptFriendRequest, rejectFriendRequest, removeFriend, MAX_FRIENDS, getRival } = m)) &&
  await loadModule("../js/utils/student-auth.js", m => ({ requireStudentSession, studentLogout, changeMyPassword, getPrivacy, savePrivacy, friendlyStudentAuthError } = m)) &&
  await loadModule("../js/utils/challenge-utils.js", m => ({ getChallengeWinCount, sendChallenge } = m)) &&
  await loadModule("../js/utils/xp-utils.js", m => ({ getLevelInfo } = m))
);

if (__ok) {

initTheme();

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shell = $("shell");
const viewer = getActiveStudent();          // the logged-in student
let student = viewer;                        // whose profile is on screen
const targetSid = new URLSearchParams(location.search).get("sid");
let viewMode = false, viewIsFriend = false;  // viewing someone else's profile?

/* ==========================================================
   BADGES — 25 achievements, all computed from data already loaded.
   ========================================================== */
function buildBadgeCatalog(ctx) {

function getBadgeContext(results, gData, rank, subjectStats, chapterStats, topicStats, social = {}) {
  const arr=results||[], nums=k=>arr.reduce((s,r)=>s+Number(r[k]||0),0);
  const percentages=arr.map(r=>Number(r.percentage||0)), accuracies=arr.map(r=>Number(r.accuracy||0));
  const highAccuracyExamCount=arr.filter(r=>Number(r.accuracy||0)>=90).length;
  const highScoreExamCount=arr.filter(r=>Number(r.percentage||0)>=80).length;
  const perfectExams=arr.filter(r=>Number(r.percentage||0)>=100).length;
  const zeroWrongExams=arr.filter(r=>Number(r.wrongCount||0)===0&&Number(r.attempted||0)>0).length;
  const highAttemptExams=arr.filter(r=>Number(r.totalQuestions||0)>0 && Number(r.attempted||0)/Number(r.totalQuestions||1)>=.9).length;
  const fastAccurateExams=arr.filter(r=>Number(r.accuracy||0)>=80 && Number(r.timeTakenSeconds||0)>0 && Number(r.avgTimePerQuestionSeconds||999)<=60).length;
  let cleanRun=0,run=0; arr.slice().sort((a,b)=>new Date(a.submittedAt||0)-new Date(b.submittedAt||0)).forEach(r=>{if(Number(r.percentage||0)>=80&&Number(r.accuracy||0)>=80)run++;else run=0;cleanRun=Math.max(cleanRun,run)});
  const topicCoverage=topicStats?.length ? topicStats.filter(x=>x.attempts>0).length/topicStats.length*100 : 0;

  // গোপন badges + a couple of real fixes — computed straight from raw
  // results, no extra fetch. (computeGamificationData() has no
  // maxImprovement/longestStreak field at all — those two lines below
  // used to always read as 0, so "ঘুরে দাঁড়ানোর চ্যাম্পিয়ন" could never
  // actually be earned by anyone. Computed here from the student's own
  // exam history instead, the same way xp-utils.js judges improvement:
  // each exam vs. the running average of exams before it.)
  const submittedMs = r => r.submittedAt?.toMillis ? r.submittedAt.toMillis() : (r.submittedAt ? new Date(r.submittedAt).getTime() : 0);
  const nightOwl = arr.some(r => { const ms = submittedMs(r); if (!ms) return false; const h = new Date(ms).getHours(); return h >= 0 && h < 4; });
  const sortedByTime = arr.slice().filter(r => submittedMs(r)).sort((a, b) => submittedMs(a) - submittedMs(b));
  const perfectFirstExam = sortedByTime.length > 0 && Number(sortedByTime[0].percentage || 0) >= 100;

  let realMaxImprovement = 0, pctRunningSum = 0;
  const dayMs = 24 * 60 * 60 * 1000, weekOf = ms => Math.floor((ms + 3 * dayMs) / (7 * dayMs));
  const weeksSeen = new Set();
  sortedByTime.forEach((r, i) => {
    const pct = Number(r.percentage || 0);
    if (i > 0) realMaxImprovement = Math.max(realMaxImprovement, pct - (pctRunningSum / i));
    pctRunningSum += pct;
    const ms = submittedMs(r); if (ms) weeksSeen.add(weekOf(ms));
  });
  const weeksSorted = [...weeksSeen].sort((a, b) => a - b);
  let realLongestStreak = 0, streakRun = 0, prevWeek = null;
  weeksSorted.forEach(w => { streakRun = (prevWeek !== null && w === prevWeek + 1) ? streakRun + 1 : 1; realLongestStreak = Math.max(realLongestStreak, streakRun); prevWeek = w; });

  return {
    friendCount: Number(social.friendCount || 0),
    hasRival: !!social.hasRival,
    challengeWins: Number(social.challengeWins || 0),
    nightOwl, perfectFirstExam,
    realMaxImprovement, realLongestStreak,
    examCount:arr.length,totalCorrect:nums("correctCount"),totalPoints:Number(rank?.totalPoints ?? nums("obtainedMarks")),
    avgAccuracy:accuracies.length?accuracies.reduce((a,b)=>a+b,0)/accuracies.length:0,
    avgPercentage:percentages.length?percentages.reduce((a,b)=>a+b,0)/percentages.length:0,
    bestPercentage:Math.max(0,...percentages),bestAccuracy:Math.max(0,...accuracies),
    highAccuracyExamCount,highScoreExamCount,perfectExams,zeroWrongExams,highAttemptExams,fastAccurateExams,cleanRun,
    maxImprovement:realMaxImprovement,longestStreak:realLongestStreak,
    weeklyOverall:Number(gData?.badgeCounts?.[student.studentId]?.weeklyOverall||0),
    weeklyClass:Number(gData?.badgeCounts?.[student.studentId]?.weeklyClass||0),
    monthlyOverall:Number(gData?.badgeCounts?.[student.studentId]?.monthlyOverall||0),

const RARITY = {
  common:    { bn: "সাধারণ",     color: "#8b95a5" },
  uncommon:  { bn: "অসাধারণ",   color: "#0ea5e9" },
  rare:      { bn: "বিরল",       color: "#8b5cf6" },
  epic:      { bn: "এপিক",       color: "#ec4899" },
  legendary: { bn: "কিংবদন্তি", color: "#d99a1f" },
  secret:    { bn: "গোপন",       color: "#14b8a6" }
};
// The catalog mixes Bengali and English rarity names — normalise to one key.
function rarityKey(r) {
  const bn = { "সাধারণ": "common", "অসাধারণ": "uncommon", "বিরল": "rare", "বিশেষ": "epic", "অতি বিরল": "legendary", "গোপন": "secret" };
  const k = bn[r] || String(r || "").toLowerCase();
  return RARITY[k] ? k : "common";
}
const rarityOf = b => RARITY[rarityKey(b.rarity)];
const isSecretLocked = b => !b.earned && rarityKey(b.rarity) === "secret";

let dataPromise = null;
function loadData(force = false) {
  if (force || !dataPromise) dataPromise = fetchData();
  return dataPromise;
}

async function fetchData() {
  const sid = student.studentId;
  const [results, rank, gData, subjectsSnap, chaptersSnap, topicsSnap, friendIds, rival, wins] = await Promise.all([
    getApprovedResults(sid).catch(() => []),
    getStudentRank(sid).catch(() => null),
    computeGamificationData().catch(() => ({})),
    getDocs(collection(db, "subjects")).catch(() => null),
    getDocs(collection(db, "chapters")).catch(() => null),
    getDocs(collection(db, "topics")).catch(() => null),
    getMyFriendIds(sid).catch(() => []),
    getRival(sid).catch(() => null),
    getChallengeWinCount(sid).catch(() => 0)
  ]);
  const nameMap = snap => { const m = {}; snap?.forEach(d => { const x = d.data(); m[d.id] = x.name_bn || x.name_en || d.id; }); return m; };
  const overall = computeOverallStats(results);
  let subjectStats = [], badges = [];
  try {
    subjectStats = computeSubjectStats(results, nameMap(subjectsSnap)).map(x => ({ ...x, id: x.subjectId }));
    const chapterStats = computeChapterStats(results, nameMap(chaptersSnap)).map(x => ({ ...x, id: x.chapterId }));
    const topicStats = computeTopicStats(results, nameMap(topicsSnap)).map(x => ({ ...x, id: x.topicId }));
    const ctx = getBadgeContext(results, gData, rank, subjectStats, chapterStats, topicStats,
      { friendCount: friendIds.length, hasRival: !!rival, challengeWins: wins });
    badges = buildBadgeCatalog(ctx).map(b => ({ ...b, earned: !!b.check(ctx), progress: b.progress ? b.progress(ctx) : null }));
  } catch (e) { console.warn("Badge calculation failed", e); }
  return { results, rank, overall, subjectStats, badges, friendCount: friendIds.length };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const t = document.createElement("textarea");
      t.value = text; t.style.cssText = "position:fixed;left:-9999px;top:0;";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch { return false; }
  }
}

    fillHero(d);
    renderRecords(d);
    renderStrength(d);
    renderBadges(d);

  }).catch(err => {
    console.warn("Profile data failed", err);
    $("recordsSection").innerHTML = `<div class="pf-empty">তথ্য লোড করা যায়নি। পেজ রিফ্রেশ করো।</div>`;

  });
}

function fillHero(d) {
  if (!$("pfHero")) return;
  const xp = Number(d.rank?.totalPoints || 0);
  const lv = getLevelInfo(xp);
  const title = xp >= 10000 ? "Physics Legend" : xp >= 5000 ? "Physics Master" : xp >= 2500 ? "Problem Solver" : xp >= 1000 ? "Concept Builder" : "Physics Explorer";
  $("pfTitle").innerHTML = `${ICON.star}<span>${title}</span>`;
  $("pfLvText").textContent = `লেভেল ${lv.level}`;
  $("pfLvNext").textContent = lv.isMax ? "সর্বোচ্চ লেভেল" : `পরের লেভেলে ${lv.xpNeeded.toLocaleString()} XP বাকি`;
  requestAnimationFrame(() => { $("pfLvFill").style.width = Math.max(3, lv.percentage) + "%"; });
  $("pfMRank").textContent = d.rank?.rank ? "#" + d.rank.rank : "—";
  $("pfMXp").textContent = xp.toLocaleString();
  $("pfMExams").textContent = d.overall?.examsTaken || 0;
  const got = d.badges.filter(b => b.earned).length;
  $("pfMBadges").textContent = d.badges.length ? `${got}/${d.badges.length}` : "—";
}

/* ---------- badges ---------- */
let badgeFilter = null;   // null = choose a sensible default on first render

function badgeIcon(b) { return badgeIconSvg(b.icon); }

function renderBadges(d) {
  const host = $("badgeCollection");
  const state = d.badges;
  if (!state.length) { host.innerHTML = `<div class="pf-card"><div class="pf-empty">ব্যাজ লোড করা যায়নি।</div></div>`; return; }

  const got = state.filter(x => x.earned), locked = state.filter(x => !x.earned);
  if (badgeFilter === null) badgeFilter = got.length ? "earned" : "all";
  const next = locked.filter(x => x.progress && x.progress.max > 1 && x.progress.value > 0)
    .sort((a, b) => (b.progress.value / b.progress.max) - (a.progress.value / a.progress.max)).slice(0, 3);

  host.innerHTML = `
    <div class="pf-card">
      <div class="pf-bsum">
        <div><h2 class="pf-h">${viewMode ? "ব্যাজ সংগ্রহ" : "আমার ব্যাজ সংগ্রহ"}</h2><div class="pf-note">${got.length}টি অর্জিত, ${locked.length}টি বাকি</div></div>
        <big>${got.length}<small>/${state.length}</small></big>
      </div>
      <div class="pf-bar" style="margin-top:12px"><i style="width:${state.length ? (got.length / state.length) * 100 : 0}%"></i></div>
    </div>
    ${next.length ? `<div class="pf-card">
      <div class="pf-head" style="margin-bottom:6px"><div><h2 class="pf-h">পরবর্তী অর্জন</h2><div class="pf-note">আর একটু এগোলেই</div></div></div>
      <div class="pf-next">${next.map(x => `
        <button class="pf-nrow" type="button" data-badge="${x.id}" style="--rc:${rarityOf(x).color}">
          <span class="pf-bico sm">${badgeIcon(x)}</span>
          <span style="flex:1;min-width:0"><strong>${x.title}</strong><small>${x.requirement}</small>
            <span class="pf-bar" style="display:block;height:5px;margin-top:6px"><i style="width:${Math.min(100, x.progress.value / x.progress.max * 100)}%"></i></span></span>
          <span style="font-family:var(--font-num);font-size:.72rem;font-weight:800;color:var(--text-muted);white-space:nowrap">${x.progress.text}</span>
        </button>`).join("")}</div>
    </div>` : ""}
    <div class="pf-card">
      <div class="pf-chips">
        <button class="pf-chip ${badgeFilter === "earned" ? "active" : ""}" data-f="earned">অর্জিত ${got.length}</button>
        <button class="pf-chip ${badgeFilter === "locked" ? "active" : ""}" data-f="locked">বাকি ${locked.length}</button>
        <button class="pf-chip ${badgeFilter === "all" ? "active" : ""}" data-f="all">সব ${state.length}</button>
      </div>
      <div class="pf-bgrid" id="pfBadgeGrid"></div>

    const r = rarityOf(x);
    return `<button type="button" class="pf-badge ${x.earned ? "earned" : "locked"}" data-badge="${x.id}" style="--rc:${r.color}">
      <div class="pf-bico">${badgeIcon(x)}</div>
      <strong>${isSecretLocked(x) ? "গোপন ব্যাজ" : x.title}</strong>
      <span class="rar">${r.bn}</span>
      ${x.earned ? `<span class="got">অর্জিত</span>`

  host.querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => { badgeFilter = c.dataset.f; renderBadges(d); }));
  host.querySelectorAll("[data-badge]").forEach(el => el.addEventListener("click", () => showBadgeDetail(state.find(x => x.id === el.dataset.badge))));

function showBadgeDetail(b) {

  $("badgeDetailModal")?.remove();

  const div = document.createElement("div");
  div.id = "badgeDetailModal"; div.className = "pf-modal"; div.setAttribute("role", "dialog");
  div.innerHTML = `<div class="pf-modal-card" style="--rc:${r.color}">

function showBadgeUnlocks(state) {
  try {
    const key = `badge-seen-${student.studentId}`;
    const seen = new Set(JSON.parse(localStorage.getItem(key) || "[]"));
    const earned = state.filter(b => b.earned);
    localStorage.setItem(key, JSON.stringify(earned.map(b => b.id)));
    const fresh = earned.filter(b => !seen.has(b.id));
    if (!fresh.length) return;
    const b = fresh[0], r = rarityOf(b);
    const div = document.createElement("div");
    div.className = "pf-modal pf-unlock";
    div.innerHTML = `<div class="pf-modal-card" style="--rc:${r.color}">
      <div class="rar" style="margin-bottom:10px">নতুন ব্যাজ অর্জিত</div>
      <div class="pf-bico">${badgeIcon(b)}</div>
      <h3>${b.title}</h3>
      <div class="pf-how">${b.requirement}</div>
      ${fresh.length > 1 ? `<p style="font-size:.74rem;font-weight:800;color:var(--text-muted)">আরও ${fresh.length - 1}টি নতুন ব্যাজ পেয়েছ — ব্যাজ ট্যাবে দেখো</p>` : ""}
      <button class="pf-btn primary" type="button" style="margin-top:12px;width:100%">চালিয়ে যাও</button>
    </div>`;
    document.body.appendChild(div);
    div.addEventListener("click", e => { if (e.target === div || e.target.closest("button")) div.remove(); });
  } catch {}
}

/* ---------- friends ---------- */
let allNetStudents = [], friendIds = [], incomingReqs = [], outgoingReqs = [];
let dirBatchFilter = "all", dirSearchTerm = "";

async function loadNetworkData() {
  try {
    const [students, fIds, inc, out] = await Promise.all([
      getActiveStudents(), getMyFriendIds(student.studentId),
      getIncomingRequests(student.studentId), getOutgoingRequests(student.studentId)
    ]);
    allNetStudents = students; friendIds = fIds; incomingReqs = inc; outgoingReqs = out;
    if (dirBatchFilter === "all" && student.className) dirBatchFilter = student.className;
    const dot = $("pfReqDot");
    if (dot) { dot.textContent = inc.length; dot.classList.toggle("on", inc.length > 0); }
    renderReqsAndFriends();
    renderDirectoryFilters();
    renderDirectory();
  } catch (err) {
    console.warn("Network load failed", err);
    const el = $("reqAndFriendsSection");
    if (el) el.innerHTML = `<div class="pf-card"><div class="pf-empty">বন্ধুদের তালিকা লোড করা যায়নি।</div></div>`;
  }
}

function refreshAfterFriendChange() {
  loadNetworkData();
  loadData(true).then(d => { fillHero(d); renderBadges(d); }).catch(() => {});
}

function renderReqsAndFriends() {
  const el = $("reqAndFriendsSection");
  const nameOf = {}, classOf = {};
  allNetStudents.forEach(s => { nameOf[s.studentId] = s.name; classOf[s.studentId] = s.className; });

  let html = "";
  if (incomingReqs.length) {
    html += `<div class="pf-card" style="margin-bottom:14px">
      <div class="pf-head"><div><h2 class="pf-h">বন্ধুত্বের অনুরোধ</h2><div class="pf-note">${incomingReqs.length}টি অপেক্ষায়</div></div></div>
      ${incomingReqs.map(r => `
        <div class="pf-row">
          <div class="pf-rname">${esc(nameOf[r.fromStudentId] || r.fromStudentId)}${classOf[r.fromStudentId] ? `<small>${esc(classOf[r.fromStudentId])}</small>` : ""}
            ${r.viaReferral ? `<br><span class="pf-tag">তোমার লিংকে যুক্ত হয়েছে</span>` : ""}</div>
          <div style="display:flex;gap:6px;flex:none">
            <button class="pf-btn sm req-reject" data-id="${r.id}" type="button">বাতিল</button>
            <button class="pf-btn sm primary req-accept" data-id="${r.id}" type="button">গ্রহণ</button>
          </div>
        </div>`).join("")}
    </div>`;
  }

  html += `<div class="pf-card" style="margin-bottom:14px">
    <div class="pf-head"><div><h2 class="pf-h">আমার বন্ধুরা</h2><div class="pf-note">${friendIds.length} / ${MAX_FRIENDS}</div></div></div>
    ${friendIds.length === 0 ? `<div class="pf-empty">এখনো কোনো বন্ধু যোগ হয়নি।</div>` : friendIds.map(fid => `
      <div class="pf-row">
        <div class="pf-rname"><a href="profile.html?sid=${esc(fid)}" style="color:inherit;text-decoration:none">${esc(nameOf[fid] || fid)}</a>${classOf[fid] ? `<small>${esc(classOf[fid])}</small>` : ""}</div>
        <button class="pf-btn sm danger friend-remove" data-id="${fid}" type="button">সরাও</button>
      </div>`).join("")}
  </div>`;

  el.innerHTML = html;
  el.querySelectorAll(".req-accept").forEach(b => b.addEventListener("click", () => acceptReq(b.dataset.id)));
  el.querySelectorAll(".req-reject").forEach(b => b.addEventListener("click", async () => { try { await rejectFriendRequest(b.dataset.id); refreshAfterFriendChange(); } catch (e) { showToast(friendlyError(e), "error"); } }));
  el.querySelectorAll(".friend-remove").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("এই বন্ধুকে তালিকা থেকে সরাতে চাও?")) return;
    try { await removeFriend(student.studentId, b.dataset.id); showToast("সরানো হয়েছে", "success"); refreshAfterFriendChange(); } catch (e) { showToast(friendlyError(e), "error"); }
  }));
}

async function acceptReq(id) {
  try { await acceptFriendRequest(id, student.studentId); showToast("বন্ধু যুক্ত হলো", "success"); refreshAfterFriendChange(); }
  catch (err) { showToast(friendlyError(err), "error"); }
}

function renderDirectoryFilters() {
  const el = $("dirFilters");
  const batches = [...new Set(allNetStudents.map(s => s.className || "Other"))].sort();
  el.innerHTML = `<button class="pf-chip ${dirBatchFilter === "all" ? "active" : ""}" data-batch="all">সব ব্যাচ</button>` +
    batches.map(b => `<button class="pf-chip ${dirBatchFilter === b ? "active" : ""}" data-batch="${esc(b)}">${esc(b)}</button>`).join("");
  el.querySelectorAll(".pf-chip").forEach(c => c.addEventListener("click", () => { dirBatchFilter = c.dataset.batch; renderDirectoryFilters(); renderDirectory(); }));
}

function renderDirectory() {
  const list = $("dirList");
  let rows = allNetStudents.filter(s => s.studentId !== student.studentId);
  if (dirBatchFilter !== "all") rows = rows.filter(s => (s.className || "Other") === dirBatchFilter);
  if (dirSearchTerm) rows = rows.filter(s => String(s.name || "").toLowerCase().includes(dirSearchTerm));
  if (!rows.length) { list.innerHTML = `<div class="pf-empty">কাউকে পাওয়া যায়নি।</div>`; return; }

  list.innerHTML = rows.map(s => {
    const isFriend = friendIds.includes(s.studentId);
    const inc = incomingReqs.find(r => r.fromStudentId === s.studentId);
    const out = outgoingReqs.find(r => r.toStudentId === s.studentId);
    const act = isFriend ? `<span class="pf-state ok">বন্ধু</span>`
      : inc ? `<button class="pf-btn sm primary req-accept" data-id="${inc.id}" type="button">গ্রহণ করো</button>`
      : out ? `<span class="pf-state wait">অপেক্ষমাণ</span>`
      : `<button class="pf-btn sm send-req" data-sid="${esc(s.studentId)}" type="button">+ যোগ করো</button>`;
    return `<div class="pf-row"><div class="pf-rname"><a href="profile.html?sid=${esc(s.studentId)}" style="color:inherit;text-decoration:none">${esc(s.name)}</a><small>${esc(s.className || "N/A")}</small></div><div style="flex:none">${act}</div></div>`;
  }).join("");

  list.querySelectorAll(".req-accept").forEach(b => b.addEventListener("click", () => acceptReq(b.dataset.id)));
  list.querySelectorAll(".send-req").forEach(b => b.addEventListener("click", async () => {
    const txt = b.textContent; b.disabled = true; b.textContent = "...";
    try { await sendFriendRequest(student.studentId, b.dataset.sid); showToast("অনুরোধ পাঠানো হয়েছে", "success"); await loadNetworkData(); }
    catch (err) { showToast(friendlyError(err), "error"); b.disabled = false; b.textContent = txt; }
  }));
}

function makeQr(text, size = 320) {
  return new Promise(resolve => {
    if (typeof QRCode === "undefined") return resolve("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(box);
    try { new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
    catch { box.remove(); return resolve(""); }
    setTimeout(() => {
      const c = box.querySelector("canvas");
      const url = c ? c.toDataURL("image/png") : (box.querySelector("img")?.src || "");
      box.remove(); resolve(url);
    }, 80);
  });
}

function buildProfileCardHtml(d, qrUrl) {
  const xp = Number(d.rank?.totalPoints || 0);
  const lv = getLevelInfo(xp);
  const got = d.badges.filter(b => b.earned);
  const rankText = d.rank?.rank ? "#" + d.rank.rank : "—";
  const title = xp >= 10000 ? "Physics Legend" : xp >= 5000 ? "Physics Master" : xp >= 2500 ? "Problem Solver" : xp >= 1000 ? "Concept Builder" : "Physics Explorer";
  const initial = esc((student.name || "?").charAt(0).toUpperCase());
  const A = "#b8863c", INK = "#21262f", MUTED = "#8d94a0", SOFT = "#5b6270", LINE = "#e5e2d9";
  const num = "'Space Grotesk','Inter',sans-serif";
  const metric = (v, l) => `<div style="flex:1;padding:11px 4px;text-align:center;border-radius:14px;background:#fff;border:1px solid ${LINE};">
      <div style="font-family:${num};font-size:16px;font-weight:800;color:${INK};line-height:1.3;">${v}</div>
      <div style="margin-top:2px;font-size:10px;font-weight:700;color:${MUTED};line-height:1.3;">${l}</div></div>`;

  return `
  <div id="profileCardInner" style="width:400px;box-sizing:border-box;padding:16px;font-family:'Noto Sans Bengali','Inter',sans-serif;background:#f6f5f1;color:${INK};border-radius:26px;">

    <div style="padding:20px;border-radius:24px;border:1px solid rgba(184,134,60,.28);background:linear-gradient(140deg,rgba(184,134,60,.16),#ffffff 64%);">
      <div style="display:flex;gap:16px;align-items:center;">
        <div style="position:relative;width:84px;height:84px;flex:none;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,${A},#7c5a22);border:2px solid rgba(184,134,60,.45);">
          <div id="cardAvatarFb" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:900;">${initial}</div>
          ${student.photoURL ? `<img id="cardPhoto" src="${esc(student.photoURL)}" crossorigin="anonymous" style="position:absolute;left:0;top:0;width:84px;height:84px;object-fit:cover;display:block;">` : ""}
        </div>
        <div style="min-width:0;">
          <div style="font-size:21px;font-weight:900;line-height:1.3;color:${INK};word-break:break-word;">${esc(student.name)}</div>
          <div style="margin-top:3px;font-size:12px;font-weight:700;color:${SOFT};line-height:1.4;">${esc(student.className || "—")} · ${esc(student.studentId)}</div>
          <div style="display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:rgba(184,134,60,.12);border:1px solid rgba(184,134,60,.25);color:${A};font-size:11px;font-weight:900;line-height:1.4;">★ ${title}</div>
        </div>
      </div>

      <div style="margin-top:18px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:${SOFT};margin-bottom:6px;line-height:1.4;">
          <span>লেভেল ${lv.level}</span><span>${lv.isMax ? "সর্বোচ্চ লেভেল" : lv.xpNeeded.toLocaleString() + " XP বাকি"}</span>
        </div>
        <div style="height:8px;border-radius:99px;background:#efede4;overflow:hidden;"><div style="height:8px;width:${Math.max(3, lv.percentage)}%;border-radius:99px;background:linear-gradient(90deg,#d9a84e,${A});"></div></div>
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;">
        ${metric(rankText, "র‍্যাঙ্ক")}${metric(xp.toLocaleString(), "মোট XP")}${metric(d.overall?.examsTaken || 0, "পরীক্ষা")}${metric(`${got.length}/${d.badges.length || 0}`, "ব্যাজ")}
      </div>
    </div>

    ${got.length ? `
    <div style="margin-top:12px;padding:16px;border-radius:20px;background:#fff;border:1px solid ${LINE};">
      <div style="font-size:13px;font-weight:900;color:${INK};margin-bottom:11px;line-height:1.4;">অর্জিত ব্যাজ</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;">
        ${got.slice(0, 8).map(b => `<span style="padding:6px 11px;border-radius:999px;background:rgba(184,134,60,.12);border:1px solid rgba(184,134,60,.28);color:#8a6222;font-size:11px;font-weight:800;line-height:1.4;">${esc(b.title)}</span>`).join("")}
        ${got.length > 8 ? `<span style="padding:6px 11px;border-radius:999px;background:#efede4;color:${SOFT};font-size:11px;font-weight:800;line-height:1.4;">+${got.length - 8}</span>` : ""}
      </div>
    </div>` : ""}

    ${qrUrl ? `
    <div id="cardCta" style="margin-top:12px;padding:20px 16px 18px;border-radius:20px;background:#fff;border:1px solid ${LINE};text-align:center;">
      <div style="display:inline-block;padding:12px;border-radius:20px;background:#fff;border:1px solid ${LINE};line-height:0;"><img src="${qrUrl}" style="width:148px;height:148px;display:block;"></div>
      <div style="margin-top:12px;font-size:13px;font-weight:900;letter-spacing:.32em;text-indent:.32em;color:${A};line-height:1.4;">SCAN</div>
    </div>` : ""}
  </div>`;
}

async function generateProfileCard(format) {
  const btn = $("shareProfileBtn");
  const original = btn.innerHTML;
  btn.disabled = true; btn.textContent = "কার্ড তৈরি হচ্ছে...";

  try {
    const d = await loadData();
    const link = referralLink();
    const qrUrl = await makeQr(link, 320);

    const area = $("shareCardArea");
    area.innerHTML = buildProfileCardHtml(d, qrUrl);

    // photo: if it can't load (blocked / bad link), fall back to the initial — never a broken image
    const photo = area.querySelector("#cardPhoto");
    if (photo) {
      await new Promise(res => { if (photo.complete) return res(); photo.onload = res; photo.onerror = res; });
      if (!photo.naturalWidth) photo.remove();
    }
    try { await document.fonts.load('800 14px "Noto Sans Bengali"', "অআক"); await document.fonts.ready; } catch {}

    const card = area.querySelector("#profileCardInner");
    const canvas = await html2canvas(card, { scale: 2, backgroundColor: null, useCORS: true });
    const base = `${student.name}_প্রোফাইল`.replace(/\s+/g, "_");
    const w = canvas.width / 2, h = canvas.height / 2;

    let file, dataUrl;
    if (format === "png") {
      dataUrl = canvas.toDataURL("image/png");
      const blob = await (await fetch(dataUrl)).blob();
      file = new File([blob], `${base}.png`, { type: "image/png" });
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "px", format: [w, h] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, w, h);
      // the invite panel is a real tappable link inside the PDF
      const cta = card.querySelector("#cardCta");
      if (cta) {
        const cr = cta.getBoundingClientRect(), br = card.getBoundingClientRect();
        pdf.link(cr.left - br.left, cr.top - br.top, cr.width, cr.height, { url: link });
      }
      const blob = pdf.output("blob");
      file = new File([blob], `${base}.pdf`, { type: "application/pdf" });
      dataUrl = URL.createObjectURL(blob);
    }

    const text = inviteText(link);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: base, text }); return; }
      catch (err) { if (err && err.name === "AbortError") return; }
    }
    // Fallback (desktop / browsers that can't share files): save the file + copy the invite link
    const a = document.createElement("a"); a.href = dataUrl; a.download = file.name; a.click();
    const copied = await copyText(text);
    showToast(copied ? "ফাইল সেভ হয়েছে, লিংক কপি হয়েছে" : "ফাইল সেভ হয়েছে", "success");
  } catch (err) {
    console.error("Profile card failed", err);
    showToast("কার্ড তৈরি করা যায়নি।", "error");
  } finally {
    $("shareCardArea").innerHTML = "";
    btn.disabled = false; btn.innerHTML = original;
  }
}

} // end if (__ok)
</script>
