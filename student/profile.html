<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোফাইল — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Hidden render target for the shareable profile card (html2canvas). -->
<div id="shareCardArea" style="position:fixed;left:-9999px;top:0;"></div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, renderStudentHeader, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";
import { getApprovedResults, getStudentRank } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeOverallStats, computeSubjectStats, computeChapterStats } from "../js/utils/analytics-utils.js";
import { getChapterExamFrequencyMap } from "../js/utils/results-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    render();
  });
}

async function render() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "profile")}
    <div id="identityCard" class="mt-4"></div>
    <div id="statsCards" class="mt-5"></div>
    <div id="subjectCard" class="mt-5"></div>
    <div id="chapterCard" class="mt-5"></div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  loadIdentity();
  loadStats();
}

async function loadIdentity() {
  const el = document.getElementById("identityCard");
  el.innerHTML = `<div class="glass card skeleton" style="height:100px;"></div>`;
  try {
    const snap = await getDoc(doc(db, "students", student.docId));
    const data = snap.exists() ? snap.data() : {};
    const created = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : null;

    el.innerHTML = `
      <div class="glass card" style="text-align:center;padding:32px 20px;">
        ${data.photoURL
          ? `<img src="${data.photoURL}" alt="" draggable="false" oncontextmenu="return false"
               style="width:128px;height:128px;border-radius:50%;object-fit:cover;margin:0 auto;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.18);"
               onerror="var d=document.createElement('div');d.className='brand-mark';d.textContent='${student.name.charAt(0)}';d.style.cssText='width:128px;height:128px;font-size:2.6rem;margin:0 auto;';this.replaceWith(d);">`
          : `<div class="brand-mark" style="width:128px;height:128px;font-size:2.6rem;margin:0 auto;">${student.name.charAt(0)}</div>`}
        <p style="font-weight:800;font-size:1.3rem;margin-top:16px;">${student.name}</p>
        <p class="text-xs text-muted mt-1">স্থায়ী শিক্ষার্থী আইডি: <span style="color:var(--text-secondary);font-weight:600;">${student.studentId}</span></p>
        ${created ? `<p class="text-xs text-muted mt-2">যোগদানের তারিখ: ${created}</p>` : ""}
        <button class="btn btn-primary mt-4" id="shareProfileBtn" style="width:100%;">প্রোফাইল কার্ড শেয়ার করুন</button>
      </div>
    `;
    document.getElementById("shareProfileBtn").addEventListener("click", () => openShareChoice(data));
  } catch (err) {
    console.error(err);
    renderState(el, "error", "প্রোফাইল তথ্য লোড করা যায়নি।");
  }
}

async function loadStats() {
  const statsEl = document.getElementById("statsCards");
  const subjEl = document.getElementById("subjectCard");
  const chapEl = document.getElementById("chapterCard");
  statsEl.innerHTML = `<div class="glass card skeleton" style="height:100px;"></div>`;

  try {
    const results = await getApprovedResults(student.studentId);
    const overall = computeOverallStats(results);

    if (!overall) {
      renderState(statsEl, "empty", "এখনো কোনো পরিসংখ্যান নেই — পরীক্ষা অনুমোদনের পর এখানে দেখা যাবে।");
      subjEl.innerHTML = ""; chapEl.innerHTML = "";
      return;
    }

    statsEl.innerHTML = `
      <p class="eyebrow">সার্বিক পরিসংখ্যান</p>
      <div class="grid-2 mt-2">
        <div class="glass card"><p class="text-xs text-muted">মোট পরীক্ষা</p><p style="font-size:1.5rem;font-weight:800;">${overall.examsTaken}</p></div>
        <div class="glass card"><p class="text-xs text-muted">গড় শতাংশ</p><p style="font-size:1.5rem;font-weight:800;">${overall.avgPercentage ?? "—"}%</p></div>
        <div class="glass card"><p class="text-xs text-muted">গড় সঠিকতা</p><p style="font-size:1.5rem;font-weight:800;">${overall.avgAccuracy ?? "—"}%</p></div>
        <div class="glass card"><p class="text-xs text-muted">সাম্প্রতিক ফলাফল</p><p style="font-size:1.5rem;font-weight:800;">${overall.mostRecent?.percentage ?? "—"}%</p></div>
      </div>
    `;

    const [subjects, chapters] = await Promise.all([getSubjects(), getChapters()]);
    const subjectMap = buildNameMap(subjects);
    const chapterMap = buildNameMap(chapters);
    const subjectStats = computeSubjectStats(results, subjectMap);
    const chapterPerf = computeChapterStats(results, chapterMap);
    const chapterPerfMap = {};
    chapterPerf.forEach(c => { chapterPerfMap[c.chapterId] = c; });

    subjEl.innerHTML = `<p class="eyebrow">বিষয়ভিত্তিক পরিসংখ্যান</p>` + (subjectStats.length === 0
      ? `<p class="text-xs text-muted mt-2">তথ্য নেই।</p>`
      : subjectStats.map(s => `
        <div class="glass card mt-2 flex justify-between items-center">
          <p style="font-weight:600;">${s.name}</p>
          <p class="text-sm" style="font-weight:700;color:var(--color-accent);">${s.accuracy ?? "—"}%</p>
        </div>
      `).join(""));

    // Full syllabus progress — every chapter, tested or not (requirement E)
    if (chapters.length === 0) {
      chapEl.innerHTML = `<p class="eyebrow">সিলেবাস অগ্রগতি</p><p class="text-xs text-muted mt-2">এখনো কোনো অধ্যায় যোগ করা হয়নি।</p>`;
    } else {
      const freqMap = await getChapterExamFrequencyMap(chapters.map(c => c.id));
      chapEl.innerHTML = `<p class="eyebrow">সিলেবাস অগ্রগতি</p>` + chapters.map(c => {
        const perf = chapterPerfMap[c.id];
        const examCount = freqMap[c.id] || 0;
        return `
          <div class="glass card mt-2">
            <div class="flex justify-between items-center">
              <div>
                <p style="font-weight:700;">${c.name_bn}</p>
                <p class="text-xs text-muted">${subjectMap[c.subjectId] || ""}</p>
              </div>
              ${perf ? `<p class="text-sm" style="font-weight:700;color:var(--color-accent);">${perf.accuracy ?? "—"}%</p>`
                     : `<span class="badge badge-draft">এখনো পরীক্ষা হয়নি</span>`}
            </div>
            <div class="grid-2 mt-3">
              <div><p class="text-xs text-muted">পরীক্ষায় এসেছে</p><p class="text-sm" style="font-weight:600;">${examCount} বার</p></div>
              ${perf ? `
                <div><p class="text-xs text-muted">সঠিক / ভুল</p><p class="text-sm" style="font-weight:600;">${perf.correct} / ${perf.wrong}</p></div>
              ` : `<div><p class="text-xs text-muted">সঠিক / ভুল</p><p class="text-sm" style="font-weight:600;">—</p></div>`}
            </div>
          </div>
        `;
      }).join("");
    }

  } catch (err) {
    console.error(err);
    renderState(statsEl, "error", "পরিসংখ্যান লোড করা যায়নি।");
  }
}

// =========================================================
// SHAREABLE PROFILE CARD — name, photo, ID, overall stats, and rank
// among every student with at least one approved result. Offered as
// either a PNG image (easiest to share to WhatsApp/etc.) or a PDF.
// =========================================================
function fmtCardDate(d) {
  return d ? d.toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "";
}

function openShareChoice(studentData) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";
  overlay.innerHTML = `
    <div class="glass card" style="max-width:380px;width:100%;text-align:center;">
      <p style="font-weight:700;margin-bottom:4px;">কোন ফরম্যাটে শেয়ার করবে?</p>
      <p class="text-xs text-muted mb-3">ছবি (PNG) সবচেয়ে সহজে WhatsApp-এ পাঠানো যায়। PDF ডকুমেন্ট হিসেবে সেভ করতে চাইলে সেটাও নিতে পারো।</p>
      <div class="flex gap-2">
        <button type="button" class="btn btn-secondary" id="choosePngBtn" style="flex:1;">ছবি (PNG)</button>
        <button type="button" class="btn btn-primary" id="choosePdfBtn" style="flex:1;">PDF</button>
      </div>
      <button type="button" class="btn btn-secondary mt-2" id="shareChoiceCancelBtn" style="width:100%;">বাতিল</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector("#shareChoiceCancelBtn").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#choosePngBtn").addEventListener("click", () => { overlay.remove(); generateProfileCard(studentData, "png"); });
  overlay.querySelector("#choosePdfBtn").addEventListener("click", () => { overlay.remove(); generateProfileCard(studentData, "pdf"); });
}

async function buildProfileCardHtml(studentData) {
  const [results, rank] = await Promise.all([
    getApprovedResults(student.studentId),
    getStudentRank(student.studentId)
  ]);
  const overall = computeOverallStats(results);

  const pct = overall?.avgPercentage ?? 0;
  let grade = "C", badgeColor = "#f87171";
  if (pct >= 80) { grade = "A+"; badgeColor = "#4ade80"; }
  else if (pct >= 60) { grade = "A"; badgeColor = "#60a5fa"; }
  else if (pct >= 40) { grade = "B"; badgeColor = "#fbbf24"; }

  const photoURL = studentData.photoURL || null;
  const ordinalSuffix = rank?.rank === 1 ? "ম" : (rank?.rank === 2 || rank?.rank === 3) ? "য়" : rank?.rank === 4 ? "র্থ" : "তম";

  return `
    <div id="profileCardInner" style="width:400px;font-family:'Noto Sans Bengali',sans-serif;background:linear-gradient(160deg,#0b0f1a 0%,#1a1024 55%,#2b1608 100%);color:#ffffff;border-radius:26px;overflow:hidden;">
      <div style="padding:34px 28px 22px;text-align:center;">
        <p style="margin:0;line-height:1.4;font-size:12px;text-transform:uppercase;color:#ffb38a;font-weight:700;">পরীক্ষা প্রস্তুতি — প্রোফাইল</p>
        ${photoURL
          ? `<img src="${photoURL}" crossorigin="anonymous" style="width:104px;height:104px;border-radius:50%;object-fit:cover;margin:18px auto 14px;display:block;border:3px solid ${badgeColor};">`
          : `<div style="width:104px;height:104px;border-radius:50%;margin:18px auto 14px;background:${badgeColor};display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#0b0f1a;">${(student.name || "?").charAt(0)}</div>`}
        <h1 style="margin:0;line-height:1.15;font-size:32px;font-weight:800;color:#ffffff;">${student.name}</h1>
        <div style="margin-top:10px;">
          <span style="display:inline-block;line-height:1.4;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,0.1);color:#94a3b8;font-size:11px;font-weight:600;">${student.studentId}${studentData.className ? ` • ${studentData.className}` : ""}</span>
        </div>
      </div>

      <div style="margin:0 20px;background:rgba(255,255,255,0.07);border-radius:18px;padding:22px;text-align:center;border:1px solid rgba(255,255,255,0.12);">
        <div style="width:72px;height:72px;border-radius:50%;margin:0 auto 12px;border:3px solid ${badgeColor};display:flex;align-items:center;justify-content:center;">
          <span style="font-size:26px;font-weight:800;line-height:1;color:${badgeColor};">${grade}</span>
        </div>
        <p style="margin:0;line-height:1;font-size:48px;font-weight:800;color:#ff8a3d;">${overall?.avgPercentage ?? "—"}%</p>
        <p style="margin:8px 0 0;line-height:1.4;font-size:12px;color:#cbd5e1;">ওভারঅল গড় শতাংশ</p>
      </div>

      <div style="display:flex;gap:10px;margin:16px 20px 0;">
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;text-align:center;">
          <p style="margin:0;line-height:1.3;font-size:20px;font-weight:800;color:#ffffff;">${overall?.examsTaken ?? 0}</p>
          <p style="margin:3px 0 0;line-height:1.3;font-size:10px;color:#94a3b8;">মোট পরীক্ষা</p>
        </div>
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;text-align:center;">
          <p style="margin:0;line-height:1.3;font-size:20px;font-weight:800;color:#ffffff;">${overall?.avgAccuracy ?? "—"}%</p>
          <p style="margin:3px 0 0;line-height:1.3;font-size:10px;color:#94a3b8;">গড় সঠিকতা</p>
        </div>
      </div>

      ${rank ? `
      <div style="margin:14px 20px 0;background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;text-align:center;">
        <p style="margin:0;line-height:1.4;font-size:14px;font-weight:700;color:#ffd08a;">
          ${rank.totalStudents} জনের মধ্যে অবস্থান: ${rank.rank}${ordinalSuffix}
        </p>
      </div>` : ""}

      <p style="text-align:center;margin:22px 0 22px;line-height:1.4;font-size:10px;color:#64748b;">${fmtCardDate(new Date())}</p>
    </div>
  `;
}

async function generateProfileCard(studentData, format) {
  const btn = document.getElementById("shareProfileBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "কার্ড তৈরি হচ্ছে...";

  try {
    const area = document.getElementById("shareCardArea");
    area.innerHTML = await buildProfileCardHtml(studentData);
    const img = area.querySelector("img");
    if (img && !img.complete) await new Promise(res => { img.onload = res; img.onerror = res; });

    const canvas = await html2canvas(document.getElementById("profileCardInner"), { scale: 2, backgroundColor: null, useCORS: true });
    const fileNameBase = `${student.name}_প্রোফাইল`.replace(/\s+/g, "_");

    let file, dataUrl;
    if (format === "png") {
      dataUrl = canvas.toDataURL("image/png");
      const blob = await (await fetch(dataUrl)).blob();
      file = new File([blob], `${fileNameBase}.png`, { type: "image/png" });
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "px", format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
      const blob = pdf.output("blob");
      file = new File([blob], `${fileNameBase}.pdf`, { type: "application/pdf" });
      dataUrl = URL.createObjectURL(blob);
    }

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: fileNameBase });
        return;
      } catch { /* user cancelled the share sheet — fall through to download */ }
    }
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = file.name;
    a.click();
  } catch (err) {
    console.error(err);
    showToast("কার্ড তৈরি করা যায়নি।", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
</script>
</body>
</html>
