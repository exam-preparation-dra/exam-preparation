<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>XP স্টোর — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .store-topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }
  .store-topbar-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
  .store-topbar .icon-btn[aria-hidden] { visibility: hidden; }

  /* ---------- balance hero (ink-stamp, matches dashboard XP hero) ---------- */
  .store-hero {
    position: relative; overflow: hidden; isolation: isolate; color: #f3f1ea; text-align: center;
    border-radius: 22px; padding: 22px 20px 18px;
    background: linear-gradient(150deg, #21262f, #12151b);
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 14px 34px rgba(0,0,0,.22);
  }
  .store-hero::before { content: ""; position: absolute; z-index: -1; right: -60px; top: -72px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--color-accent-rgb),.35), rgba(var(--color-accent-rgb),0) 70%); }
  .store-hero-label { font-size: .8rem; font-weight: 700; letter-spacing: .02em; color: rgba(243,241,234,.7); }
  .store-hero-big { margin-top: 6px; font-family: var(--font-num); font-size: 2.7rem; font-weight: 800; line-height: 1.05; }
  .store-hero-big small { font-size: 1rem; font-weight: 700; margin-left: 6px; color: var(--color-accent); }
  .store-hero-note { margin-top: 6px; font-size: .8rem; font-weight: 600; color: rgba(243,241,234,.72); }

  /* ---------- "recommended for you": badge + reason live on the item's own card ---------- */
  .store-ticket--reco { border-color: rgba(var(--color-accent-rgb), .55); box-shadow: 0 0 0 2px rgba(var(--color-accent-rgb), .28), var(--shadow-soft); }
  .store-reco-badge {
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px; padding: 4px 11px 4px 9px; border-radius: 99px;
    font-size: .68rem; font-weight: 800; letter-spacing: .01em; color: #1d1608;
    background: linear-gradient(135deg, #ffe9b8, #f0c264);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .store-reco-badge svg { width: 12px; height: 12px; flex-shrink: 0; }
  .store-reco-why { display: flex; align-items: flex-start; gap: 11px; padding: 12px 18px; background: var(--color-accent-soft); border-bottom: 1px solid var(--surface-border); }
  .store-reco-why-ico { flex-shrink: 0; width: 25px; height: 25px; margin-top: 1px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--color-accent); }
  .store-reco-why-txt { min-width: 0; }
  .store-reco-why-txt b { display: block; font-size: .68rem; font-weight: 800; letter-spacing: .01em; color: var(--color-accent); margin-bottom: 2px; }
  .store-reco-why-txt span { font-size: .8rem; font-weight: 600; line-height: 1.55; color: var(--text-primary); }
  .store-reco-exam { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; font-size: .66rem; font-weight: 800; color: var(--color-accent); background: var(--surface-solid); }
  .store-section-sub { margin: -4px 0 10px; }

  /* highlight a card jumped to (arriving from the dashboard wallet) */

  .store-ticket.deep-link-glow { animation: storeDeepGlow 1.7s ease; }
  @keyframes storeDeepGlow {
    0%   { box-shadow: var(--shadow-soft); }
    18%  { box-shadow: 0 0 0 4px rgba(var(--color-accent-rgb), .45); }
    100% { box-shadow: var(--shadow-soft); }
  }

  .store-section-title { font-size: 0.98rem; font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-3); display: flex; align-items: center; gap: 8px; }

  /* ---- Card item: coloured card face on top, plain-language details below ---- */
  .store-ticket {
    --wc-a: #2d5a7b; --wc-b: #15283b;
    margin-bottom: var(--space-4); overflow: hidden; border-radius: 22px;
    background: var(--surface); border: 1px solid var(--surface-border); box-shadow: var(--shadow-soft);
  }
  .store-ticket[data-kind="hint"] { --wc-a: #a77a2c; --wc-b: #4d3611; }
  .store-ticket[data-kind="battle"] { --wc-a: #6d3f78; --wc-b: #2b1834; }
  .store-face {
    position: relative; overflow: hidden; isolation: isolate; color: #f6f3ea; padding: 16px 18px 18px;
    background: linear-gradient(145deg, var(--wc-a), var(--wc-b));
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset;
  }
  .store-face::before { content: ""; position: absolute; z-index: -1; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,255,255,0) 68%); }
  .store-face::after { content: ""; position: absolute; z-index: -1; left: -34px; bottom: -84px; width: 210px; height: 210px; border-radius: 50%; border: 28px solid rgba(255,255,255,.05); }
  .store-face-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .store-face-name { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: .98rem; font-weight: 800; }
  .store-face-ico { flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.16); }
  .store-price { flex-shrink: 0; padding: 5px 12px; border-radius: 99px; font-size: .95rem; font-weight: 800; color: #1b1b1b; background: rgba(255,255,255,.9); white-space: nowrap; }
  .store-price small { font-size: .66rem; font-weight: 800; margin-left: 2px; opacity: .7; }
  .store-face-main { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; }
  .store-face-big { font-family: var(--font-num); font-size: 2.9rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .store-face-unit { font-size: .9rem; font-weight: 700; opacity: .8; }
  .store-face-tag { margin-top: 8px; font-size: .78rem; font-weight: 700; color: rgba(246,243,234,.82); }

  .store-ticket-body { padding: 16px 18px 16px; }
  .store-what { font-size: .88rem; font-weight: 600; line-height: 1.7; color: var(--text-secondary); }
  .store-facts { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
  .store-facts li { display: flex; align-items: flex-start; gap: 12px; }
  .store-fact-n { flex-shrink: 0; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-size: .76rem; font-weight: 800; color: var(--color-accent); background: var(--color-accent-soft); }
  .store-fact-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .store-fact-t b { font-size: .8rem; font-weight: 800; color: var(--text-primary); }
  .store-fact-t span { font-size: .8rem; font-weight: 600; line-height: 1.6; color: var(--text-muted); }

  .store-item-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px dashed var(--surface-border); flex-wrap: wrap; }
  .store-qty { display: flex; align-items: center; gap: 10px; }
  .store-qty-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--surface-border);
    background: var(--surface-solid); color: var(--text-primary); font-size: 1.15rem; font-weight: 700;
    display: grid; place-items: center; transition: border-color var(--transition), opacity var(--transition);
  }
  .store-qty-btn:disabled { opacity: 0.35; pointer-events: none; }
  .store-qty-btn:not(:disabled):hover { border-color: var(--color-accent); color: var(--color-accent); }
  .store-qty-value { min-width: 22px; text-align: center; font-weight: 700; }

  /* ---------- checkout bar (elevated pill, matches card gradients) ---------- */
  .store-cart-bar {
    position: sticky; bottom: var(--space-4);
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px;
    padding: 10px 10px 10px 18px; box-shadow: var(--shadow-lift); margin: var(--space-4) 0;
  }
  .store-cart-info { display: flex; flex-direction: column; gap: 2px; }
  .store-cart-count { font-size: 0.74rem; font-weight: 700; color: var(--text-muted); }
  .store-cart-total { font-family: var(--font-num); font-size: 1.2rem; font-weight: 800; color: var(--text-primary); }
  .store-checkout-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border: none; border-radius: 14px;
    cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 800; color: #1d1608; white-space: nowrap;
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2));
    box-shadow: 0 8px 18px rgba(var(--color-accent-rgb), .32);
    transition: transform .15s ease, filter .2s ease;
  }
  .store-checkout-btn:hover:not(:disabled) { filter: brightness(1.05); }
  .store-checkout-btn:active:not(:disabled) { transform: scale(.96); }
  .store-checkout-btn:disabled { opacity: 0.6; pointer-events: none; }

  .store-history-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .store-history-name { font-weight: 700; font-size: 0.92rem; color: var(--text-primary); }
  .store-history-cost { font-weight: 700; color: var(--color-danger); white-space: nowrap; }
  .store-history-used { font-weight: 700; color: var(--color-accent); white-space: nowrap; }

  /* ---- Little confetti burst after a purchase ---- */
  .confetti-burst { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-burst span {
    position: absolute; top: 32%; width: 8px; height: 12px; border-radius: 2px;
    animation: confetti-fall var(--d, 900ms) cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--x, 0), 280px) rotate(var(--r, 360deg)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .confetti-burst { display: none; } }

  .store-empty-note { padding: var(--space-3) 0; }

  /* ---- "just bought this" flash on a ticket + floating "+N" over its
     owned-count, shown briefly right after checkout succeeds ---- */
  .store-ticket.purchase-flash { animation: storeTicketFlash .9s ease-out; }
  @keyframes storeTicketFlash {
    0%   { box-shadow: 0 0 0 3px var(--color-accent); }
    100% { box-shadow: var(--shadow-soft); }
  }
  .store-owned-wrap { position: relative; display: inline-block; }
  .store-owned-pop {
    position: absolute; left: 50%; top: -2px; transform: translate(-50%, 0);
    font-weight: 700; font-size: .78rem; color: var(--color-accent);
    pointer-events: none; white-space: nowrap;
    animation: storeOwnedFloat 1.1s ease-out forwards;
  }
  @keyframes storeOwnedFloat {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.85); }
    20%  { opacity: 1; transform: translate(-50%, -6px) scale(1.08); }
    70%  { opacity: 1; transform: translate(-50%, -20px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -28px) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .store-ticket.purchase-flash { animation: none; }
    .store-owned-pop { animation: none; display: none; }
  }

  /* ---- Custom confirm modal (replaces native confirm(), which some
     in-app/embedded browsers silently block or auto-dismiss after an
     await, making the checkout button look like it does nothing) ---- */
  .confirm-overlay {
    position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end;
    justify-content: center; background: rgba(0,0,0,0.45); padding: var(--space-4);
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    width: 100%; max-width: 420px; background: var(--surface-solid); border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-lift);
  }
  .confirm-box-msg { white-space: pre-line; font-size: 0.95rem; color: var(--text-primary); line-height: 1.6; margin-bottom: var(--space-4); }
  .confirm-box-actions { display: flex; gap: var(--space-3); }
  .confirm-box-actions .btn { flex: 1; }

  /* ---- Persistent error panel (unlike the toast, this stays on screen
     until closed, so the exact error can be read/screenshotted) ---- */
  .debug-error-panel {
    position: fixed; left: var(--space-4); right: var(--space-4); bottom: var(--space-4); z-index: 600;
    background: #2a1414; border: 1px solid var(--color-danger); border-radius: var(--radius-lg);
    padding: var(--space-4); box-shadow: var(--shadow-lift); max-height: 45vh; overflow-y: auto;
  }
  .debug-error-panel.hidden { display: none; }
  .debug-error-panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
  .debug-error-panel-title { font-weight: 700; color: #ff8a80; font-size: 0.9rem; }
  .debug-error-panel-close { background: none; border: none; color: #ff8a80; font-size: 1.2rem; line-height: 1; padding: 4px 8px; cursor: pointer; }
  .debug-error-panel-body { font-family: monospace; font-size: 0.78rem; color: #ffd6d0; white-space: pre-wrap; word-break: break-word; }
  .debug-error-panel-actions { margin-top: var(--space-3); }
  .debug-error-panel-actions .btn { width: auto; padding: 8px 16px; font-size: 0.82rem; }
</style>
</head>
<body>
<div class="app-shell">

  <header class="store-topbar">
    <a href="./dashboard.html" class="icon-btn" aria-label="ফিরে যাও">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="store-topbar-title">XP স্টোর</h1>
    <span class="icon-btn" aria-hidden="true"></span>
  </header>

  <section class="store-hero">
    <p class="store-hero-label">খরচযোগ্য ব্যালেন্স</p>
    <p class="store-hero-big" id="balanceValue">০</p>
    <p class="store-hero-note" id="balanceNote">লোড হচ্ছে…</p>
  </section>

  <section class="d-sec">
    <h2 class="store-section-title">আইটেম</h2>
    <p class="text-sm text-muted store-section-sub" id="recoNote" hidden></p>
    <div id="itemList"><div class="card"><p class="text-sm text-muted">লোড হচ্ছে…</p></div></div>
  </section>

  <div id="cartBar" class="store-cart-bar hidden">
    <div class="store-cart-info">
      <div class="store-cart-count" id="cartCount"></div>
      <div class="store-cart-total" id="cartTotal"></div>
    </div>
    <button id="checkoutBtn" class="store-checkout-btn" type="button">চেকআউট করো</button>
  </div>

  <section class="d-sec">
    <h2 class="store-section-title">কেনাকাটার ইতিহাস</h2>
    <div id="historyList"></div>
  </section>

</div>

<div id="confirmOverlay" class="confirm-overlay hidden">
  <div class="confirm-box">
    <p class="confirm-box-msg" id="confirmMsg"></p>
    <div class="confirm-box-actions">
      <button type="button" class="btn btn-secondary" id="confirmCancelBtn">বাতিল</button>
      <button type="button" class="btn btn-primary" id="confirmOkBtn">কিনবো</button>
    </div>
  </div>
</div>

<div id="debugErrorPanel" class="debug-error-panel hidden">
  <div class="debug-error-panel-head">
    <span class="debug-error-panel-title">⚠️ সমস্যার বিস্তারিত (স্ক্রিনশট নিয়ে পাঠাও)</span>
    <button type="button" class="debug-error-panel-close" id="debugErrorCloseBtn">×</button>
  </div>
  <div class="debug-error-panel-body" id="debugErrorBody"></div>
  <div class="debug-error-panel-actions">
    <button type="button" class="btn btn-secondary" id="debugErrorCopyBtn">টেক্সট কপি করো</button>
  </div>
</div>

<script type="module">
import { getActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { getApprovedResults, getUpcomingExams, getStudentResultStatusMap, getExamSnapshotsMap } from "../js/utils/results-utils.js";
import { getSubjects, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeSubjectStats, buildQuestionRecords, computeTimeManagementStats } from "../js/utils/analytics-utils.js";
import { computeStudentXP } from "../js/utils/xp-utils.js";
import { resolveCompletedChallenges, getChallengeBonusXP } from "../js/utils/challenge-utils.js";
import { getCompletedImprovementAttempts } from "../js/utils/improvement-xp-integration.js";
import { getStudentBattleXP } from "../js/utils/battle-utils.js?v=roomcard1";
import { STORE_ITEMS, MAX_CARDS_PER_ATTEMPT, MAX_HINT_CARDS_PER_ATTEMPT, getSpentXP, getStoreInventory, getAvailableBattleRoomCardCount, purchaseCart, getPurchaseHistory, getUsageHistory } from "../js/utils/store-utils.js?v=roomcard1";
import { initTheme, showToast, formatDate, formatTime } from "../js/utils/ui-utils.js";

initTheme();

window.addEventListener("error", (e) => showDebugError(e.error || new Error(e.message), "window error"));
window.addEventListener("unhandledrejection", (e) => showDebugError(e.reason, "unhandled promise rejection"));

const student = getActiveStudent();
if (!student) { window.location.href = "../index.html"; }

const fmt = (n) => Number(n || 0).toLocaleString("bn-BD");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BN_DIGITS = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
const toBn = (s) => String(s).replace(/[0-9]/g, d => BN_DIGITS[d]);
const fmtDuration = (totalSec) => {
  const m = Math.floor((totalSec || 0) / 60);
  const s = Math.round((totalSec || 0) % 60);
  return toBn(`${m}:${String(s).padStart(2, "0")}`);
};

const cart = {};       // itemId -> qty currently staged for checkout
let currentTotalXP = 0; // lifetime XP (before this session's spend), used to re-check purchases
let inventory = {};
let reco = null;       // { itemId, examName, reason } once computed — badges that item's own card

function renderBalance(xp) {
  document.getElementById("balanceValue").innerHTML = `${fmt(xp.spendableXP)} <small>XP</small>`;
  document.getElementById("balanceNote").textContent =
    `মোট অর্জিত ${fmt(xp.totalXP)} XP${xp.spentXP > 0 ? ` · খরচ হয়েছে ${fmt(xp.spentXP)} XP` : ""}`;
}

const ICONS = {
  time: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  hint: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.45.9 1.15.9 1.9V16h5.4v-.3c0-.75.3-1.45.9-1.9A6 6 0 0 0 12 3z"/>',
  battle: '<path d="M13 2 4 11l3 3 9-9V2z"/><path d="m11 13 6 6"/><path d="m20 16-4 4"/>'
};
const icon = (k) => `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const STAR = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.8 4.5 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8z"/></svg>`;

/* ---------- scroll to + briefly glow a store card (recommendation tap, or arriving from the dashboard wallet) ---------- */
function jumpToItem(itemId) {
  const card = document.querySelector(`.store-ticket[data-item="${itemId}"]`);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("deep-link-glow");
  void card.offsetWidth;
  card.classList.add("deep-link-glow");
  card.addEventListener("animationend", () => card.classList.remove("deep-link-glow"), { once: true });
}

/* ---------- "recommended for you": looks at this student's own results
   (subject accuracy + speed-vs-accuracy) and, when it exists, the next
   exam this student is still eligible to take — so the pick and its
   reason change automatically as new exams come up. ---------- */
async function buildRecommendation(results, subjectNameMap) {
  let upcoming = null;
  try {
    const [exams, resultMap] = await Promise.all([
      getUpcomingExams(),
      getStudentResultStatusMap(student.studentId)
    ]);
    const now = Date.now();
    const eligible = exams.filter(exam => {
      const target = exam.targetBatch || "all";
      if (target !== "all" && target !== student.className) return false;
      const allowed = exam.allowedStudents || [];
      if (allowed.length > 0 && !allowed.includes(student.studentId)) return false;
      if (resultMap[exam.id]) return false; // already submitted/approved for this one
      const examMs = exam.examDate?.toMillis?.();
      return !Number.isFinite(examMs) || examMs >= now - 24 * 60 * 60 * 1000;
    }).sort((a, b) => (a.examDate?.toMillis?.() ?? 0) - (b.examDate?.toMillis?.() ?? 0));
    upcoming = eligible[0] || null;
  } catch { upcoming = null; }

  const examName = upcoming?.name || null;

  if (!results.length) {
    return { itemId: null, examName, reason: "এখনো কোনো পরীক্ষা দাওনি — একটা পরীক্ষা দিলেই তোমার ফলাফল দেখে এখানে কার্ড সুপারিশ করা হবে।" };
  }

  const subjectStats = computeSubjectStats(results, subjectNameMap);
  const bySubjectId = Object.fromEntries(subjectStats.map(s => [s.subjectId, s]));

  let speedAccuracy = null;
  try {
    const snapshotsByExamId = await getExamSnapshotsMap(results.map(r => r.examId));
    const records = buildQuestionRecords(results, snapshotsByExamId);
    speedAccuracy = computeTimeManagementStats(records, subjectNameMap, {})?.speedAccuracy || null;
  } catch { speedAccuracy = null; }

  // ---- We know what's coming next: the pick must be about THAT exam's own
  // subjects — never a weak subject from some unrelated exam, even if it's
  // the weakest one overall. ----
  if (upcoming && Array.isArray(upcoming.subjectIds) && upcoming.subjectIds.length) {
    const examSubjects = upcoming.subjectIds.map(id => bySubjectId[id]).filter(Boolean);
    const weakestInExam = examSubjects
      .filter(s => s.accuracy !== null && (s.correct + s.wrong) >= 4)
      .sort((a, b) => a.accuracy - b.accuracy)[0];

    if (weakestInExam && weakestInExam.accuracy < 65) {
      return {
        itemId: "hint_card", examName,
        reason: `আসন্ন “${examName}”-এ ${weakestInExam.name} আছে, যেখানে তোমার accuracy মাত্র ${weakestInExam.accuracy}% — হিন্ট কার্ড আটকে যাওয়া প্রশ্নে কাজে লাগবে।`
      };
    }

    if (speedAccuracy?.rushingLikely) {
      return {
        itemId: "time_extend_card", examName,
        reason: `তাড়াহুড়ো করে উত্তর দিলে ভুল হওয়ার হার (${speedAccuracy.fasterWrongRate}%) বেশি দেখা যাচ্ছে — “${examName}”-এ বাড়তি সময় থাকলে চাপ কমবে।`
      };
    }

    if (!examSubjects.length) {
      return {
        itemId: "time_extend_card", examName,
        reason: `“${examName}”-এর বিষয়ে তোমার আগের কোনো ফলাফল নেই — নতুন জায়গায় সময় বেশি লাগতে পারে, তাই টাইম কার্ড রাখা ভালো।`
      };
    }

    // this exam's own subjects already look fine — a safe generic pick, still tied to this exam
    return {
      itemId: "time_extend_card", examName,
      reason: `“${examName}”-এর বিষয়গুলোতে তোমার accuracy ভালো — শুধু সময় কম পড়া থেকে বাঁচতে টাইম কার্ড রাখা যায়।`
    };
  }

  // ---- No specific upcoming exam known: fall back to overall weakest subject
  // (kept general — no exam tag, since it isn't tied to any particular exam). ----
  const weakOverall = subjectStats
    .filter(s => s.accuracy !== null && (s.correct + s.wrong) >= 4 && s.accuracy < 60)
    .sort((a, b) => a.accuracy - b.accuracy)[0];
  if (weakOverall) {
    return {
      itemId: "hint_card", examName: null,
      reason: `${weakOverall.name}-এ তোমার সার্বিক accuracy ${weakOverall.accuracy}% — হিন্ট কার্ড দিয়ে ভুল হওয়ার কারণটা বুঝে নেওয়া যাবে।`
    };
  }
  if (speedAccuracy?.rushingLikely) {
    return {
      itemId: "time_extend_card", examName: null,
      reason: `তাড়াহুড়ো করে উত্তর দিলে ভুল হওয়ার হার (${speedAccuracy.fasterWrongRate}%) বেশি দেখা যাচ্ছে — বাড়তি সময় থাকলে চাপ কমবে।`
    };
  }
  return {
    itemId: "time_extend_card", examName: null,
    reason: "তোমার পারফরম্যান্স মোটামুটি স্থিতিশীল — তাও পরীক্ষায় শেষ মুহূর্তে সময় কম পড়লে কাজে লাগার জন্য টাইম কার্ড রাখা ভালো।"
  };
}

// Applies the computed recommendation onto the matching item's own card
// (badge + "কেন সুপারিশ করা হলো" strip, see renderItems) instead of a
// separate banner, and re-renders the list so that card moves to the top.
function applyRecommendation(rec) {
  reco = rec && rec.itemId ? rec : null;
  const note = document.getElementById("recoNote");
  if (!reco && rec?.reason) {
    note.textContent = rec.reason;
    note.hidden = false;
  } else {
    note.hidden = true;
  }
  renderItems();
}

// What each card does, in plain words (shown on the card).

    kind: "battle", big: "১", unit: "টি নতুন Battle",

      ["মেয়াদ", `কেনার পর ${fmt(item.validityDays)} দিন (২ মাস) পর্যন্ত ব্যবহার করা যাবে — তারপর কার্ড মেয়াদোত্তীর্ণ হয়ে যাবে।`]

    facts: [
      ["কোথায় ব্যবহার হবে", "পরীক্ষা চলার সময়, প্রশ্নের নিচে “হিন্ট কার্ড ব্যবহার করো” বাটনে ট্যাপ করে।"],
      ["কী পাবে", "১টি কার্ডে ১টি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা দেখা যাবে।"],
      ["সীমা", `এক পরীক্ষায় সর্বোচ্চ ${fmt(MAX_HINT_CARDS_PER_ATTEMPT)}টি হিন্ট কার্ড ব্যবহার করা যাবে। আগে থেকে কিনে রাখতে হবে।`]

  const mins = Math.round((item.secondsGranted || 60) / 60);
  return {

    what: "সময় কম পড়লে পরীক্ষা চলার মাঝেই টাইমারে বাড়তি সময় যোগ করতে পারবে।",

      ["কী পাবে", `প্রতিটি কার্ডে মূল সময়ের সাথে ${fmt(mins)} মিনিট বাড়তি যোগ হবে।`],

function renderItems() {
  const list = document.getElementById("itemList");
  const ordered = reco?.itemId
    ? [...STORE_ITEMS].sort((a, b) => (a.id === reco.itemId ? -1 : 0) - (b.id === reco.itemId ? -1 : 0))

  list.innerHTML = ordered.map(item => {
    const owned = inventory[item.id] || { purchased: 0, used: 0, available: 0 };
    const qty = cart[item.id] || 0;
    const info = cardInfo(item);
    const isReco = reco?.itemId === item.id;
    return `
    <div class="store-ticket ${isReco ? "store-ticket--reco" : ""}" data-item="${item.id}" data-kind="${info.kind}">
      <div class="store-face">
        ${isReco ? `<span class="store-reco-badge">${STAR} সুপারিশকৃত</span>` : ""}
        <div class="store-face-top">
          <div class="store-face-name"><span class="store-face-ico">${icon(info.kind)}</span><span>${esc(item.name)}</span></div>
          <span class="store-price num">${fmt(item.priceXP)}<small>XP</small></span>
        </div>
        <div class="store-face-main"><span class="store-face-big">${info.big}</span><span class="store-face-unit">${info.unit}</span></div>
        <p class="store-face-tag">${esc(item.tagline)}</p>
      </div>
      ${isReco ? `
      <div class="store-reco-why">
        <span class="store-reco-why-ico">${icon(info.kind)}</span>
        <span class="store-reco-why-txt">
          <b>কেন সুপারিশ করা হলো</b>
          <span>${esc(reco.reason)}</span>
          ${reco.examName ? `<span class="store-reco-exam">${esc(reco.examName)}-এর জন্য</span>` : ""}
        </span>
      </div>` : ""}
      <div class="store-ticket-body">
        <p class="store-what">${info.what}</p>
        <ul class="store-facts">
          ${info.facts.map(([label, text], i) => `
          <li><span class="store-fact-n">${toBn(i + 1)}</span><span class="store-fact-t"><b>${label}</b><span>${text}</span></span></li>`).join("")}
        </ul>
        <div class="store-item-footer">
          <div class="text-sm text-muted">তোমার কাছে আছে: <span class="store-owned-wrap"><strong class="num" data-owned-count="${item.id}">${fmt(owned.available)}</strong></span>টি</div>
          <div class="store-qty">
            <button type="button" class="store-qty-btn" data-act="dec" ${qty <= 0 ? "disabled" : ""} aria-label="কমাও">−</button>
            <span class="store-qty-value num">${qty}</span>
            <button type="button" class="store-qty-btn" data-act="inc" ${qty >= (item.maxPerOrder || 10) ? "disabled" : ""} aria-label="বাড়াও">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".store-ticket").forEach(card => {
    const itemId = card.dataset.item;
    const item = STORE_ITEMS.find(i => i.id === itemId);
    card.querySelectorAll(".store-qty-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const cur = cart[itemId] || 0;
        cart[itemId] = btn.dataset.act === "inc"
          ? Math.min(item.maxPerOrder || 10, cur + 1)
          : Math.max(0, cur - 1);
        renderItems();
        renderCartBar();
      });
    });
  });
}

function renderCartBar() {
  const bar = document.getElementById("cartBar");
  const lines = Object.entries(cart).filter(([, q]) => q > 0);
  if (!lines.length) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  const totalItems = lines.reduce((s, [, q]) => s + q, 0);
  const totalCost = lines.reduce((s, [id, q]) => s + (STORE_ITEMS.find(i => i.id === id)?.priceXP || 0) * q, 0);
  document.getElementById("cartCount").textContent = `${fmt(totalItems)}টি আইটেম`;
  document.getElementById("cartTotal").innerHTML = `<span class="num">${fmt(totalCost)}</span> XP`;
  document.getElementById("checkoutBtn").dataset.cost = totalCost;
}

        <div class="text-sm text-muted">${formatDate(r.createdAtMs)} · ${formatTime(r.createdAtMs)}</div>
      </div>

async function loadAll() {
  await resolveCompletedChallenges(student.studentId).catch(() => []);

  const [results, allStudents, subjects, challengeBonusXP, improvementResults, battleXP, spentXP, inv, purchases, usage, battleCards] = await Promise.all([
    getApprovedResults(student.studentId),
    getActiveStudents(),
    getSubjects().catch(() => []),
    getChallengeBonusXP(student.studentId).catch(() => 0),
    getCompletedImprovementAttempts(student.studentId).catch(() => []),
    getStudentBattleXP(student.studentId).catch(() => 0),
    getSpentXP(student.studentId).catch(() => 0),
    getStoreInventory(student.studentId).catch(() => ({})),
    getPurchaseHistory(student.studentId).catch(() => []),
    getUsageHistory(student.studentId).catch(() => []),
    getAvailableBattleRoomCardCount(student.studentId).catch(() => null)
  ]);
  const subjectNameMap = buildNameMap(subjects);

  const myRefs = allStudents.filter(s => s.referredBy === student.studentId && s.studentId !== student.studentId);
  const xp = computeStudentXP(results, {
    referralCount: myRefs.length, challengeBonusXP,
    improvementPracticeResults: improvementResults, battleXP, spentXP
  });

  currentTotalXP = xp.totalXP;
  inventory = inv;
  // Battle cards expire — show only the ones still usable (same number the dashboard shows).
  if (battleCards !== null && inventory.battle_room_card) inventory.battle_room_card.available = battleCards;

  const history = [
    ...purchases.map(r => ({ ...r, kind: "purchase" })),
    ...usage.map(r => ({ ...r, kind: "use" }))
  ].sort((a, b) => Number(b.createdAtMs || 0) - Number(a.createdAtMs || 0));

  renderBalance(xp);
  renderItems();
  renderCartBar();
  renderHistory(history);

  buildRecommendation(results, subjectNameMap).then(applyRecommendation).catch(() => applyRecommendation(null));

  const jumpId = new URLSearchParams(location.search).get("item");
  if (jumpId) setTimeout(() => jumpToItem(jumpId), 200);
}

/** Custom confirm dialog — resolves true/false. Replaces window.confirm(),
    which some in-app/embedded browsers silently block or mis-handle when
    called after an await (i.e. not directly inside the tap), making the
    checkout button look like it does nothing. */
function showConfirmModal(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("confirmOverlay");
    document.getElementById("confirmMsg").textContent = message;
    overlay.classList.remove("hidden");

    const cleanup = (result) => {
      overlay.classList.add("hidden");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onOverlay);
      resolve(result);
    };
    const okBtn = document.getElementById("confirmOkBtn");
    const cancelBtn = document.getElementById("confirmCancelBtn");
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onOverlay = (e) => { if (e.target === overlay) cleanup(false); };

    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onOverlay);
  });
}

// Briefly flashes each just-purchased item's ticket and pops a "+qty" over
// its owned-count, so the purchase feels tied to the specific item(s)
// bought (confetti alone is generic, this points at what changed).
function flashPurchasedItems(lines) {
  (lines || []).forEach(({ itemId, qty }) => {
    const ticket = document.querySelector(`.store-ticket[data-item="${itemId}"]`);
    if (ticket) {
      ticket.classList.remove("purchase-flash");
      void ticket.offsetWidth;
      ticket.classList.add("purchase-flash");
      ticket.addEventListener("animationend", () => ticket.classList.remove("purchase-flash"), { once: true });
    }
    const countEl = document.querySelector(`[data-owned-count="${itemId}"]`);
    const wrap = countEl?.closest(".store-owned-wrap");
    if (wrap) {
      const pop = document.createElement("span");
      pop.className = "store-owned-pop";
      pop.textContent = `+${qty}`;
      wrap.appendChild(pop);
      pop.addEventListener("animationend", () => pop.remove());
    }
  });
}

function fireConfetti() {
  const colors = ["#ff6a2b", "#22c55e", "#3b82f6", "#eab308", "#ec4899"];
  const box = document.createElement("div");
  box.className = "confetti-burst";
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement("span");
    piece.style.setProperty("--x", `${(Math.random() - 0.5) * 240}px`);
    piece.style.setProperty("--r", `${(Math.random() - 0.5) * 720}deg`);
    piece.style.setProperty("--d", `${650 + Math.random() * 500}ms`);
    piece.style.left = `${42 + Math.random() * 16}%`;
    piece.style.background = colors[i % colors.length];
    box.appendChild(piece);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1500);
}

document.getElementById("checkoutBtn").addEventListener("click", async (e) => {
  // Capture the button synchronously — e.currentTarget is reset to null once
  // the event finishes dispatching, which happens long before the awaits
  // below resolve. Reading it later throws "Cannot read properties of null".
  const btn = e.currentTarget;
  const totalCost = Number(btn.dataset.cost || 0);

  const lines = Object.entries(cart).filter(([, q]) => q > 0).map(([itemId, qty]) => ({ itemId, qty }));
  if (!lines.length) return;

  const spentSoFar = await getSpentXP(student.studentId).catch(() => 0);
  if (totalCost > currentTotalXP - spentSoFar) {
    showToast("তোমার ব্যালেন্সে যথেষ্ট XP নেই।", "error");
    return;
  }

  const summary = lines.map(l => `${STORE_ITEMS.find(i => i.id === l.itemId)?.name} × ${l.qty}`).join(", ");
  const confirmed = await showConfirmModal(`${summary}\n\nমোট ${fmt(totalCost)} XP খরচ হবে। কিনতে চাও?`);
  if (!confirmed) return;

  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "প্রসেস হচ্ছে…";
  try {
    await purchaseCart(student.studentId, lines, currentTotalXP);
    showToast("কেনা হয়ে গেছে! ✅", "success");
    fireConfetti();
    Object.keys(cart).forEach(k => { cart[k] = 0; });
    await loadAll();
    flashPurchasedItems(lines);
  } catch (err) {
    console.error("purchaseCart failed:", err);
    showDebugError(err, "checkout / purchaseCart");
    const map = {
      INSUFFICIENT_XP: "তোমার ব্যালেন্সে যথেষ্ট XP নেই।",
      QTY_TOO_HIGH: "একবারে এত বেশি কেনা যাবে না।",
      EMPTY_CART: "কার্ট খালি।"
    };
    // Show the real error text (not just a generic message) so it can be
    // read/screenshotted directly off the screen for debugging, in case
    // something other than the three expected errors above is thrown
    // (e.g. a Firestore network/permission error).
    showToast(map[err.message] || `কেনা যায়নি: ${err.message || err}`, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

loadAll().catch(err => {
  console.error(err);
  showDebugError(err, "পাতা লোড হওয়ার সময় (loadAll)");
  showToast("তথ্য লোড করা যায়নি।", "error");
});
</script>
