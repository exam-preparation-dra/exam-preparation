<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.glass-float-card{background:rgba(128,128,128,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(128,128,128,.15);border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.04)}
.lb-icon{width:17px;height:17px;flex-shrink:0}.lb-icon-lg{width:20px;height:20px;flex-shrink:0}
.btn-glass{background:rgba(128,128,128,.09);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(128,128,128,.19);border-radius:11px;color:var(--text-primary);padding:8px 12px;font-weight:750;font-size:.8rem;display:inline-flex;justify-content:center;align-items:center;gap:6px;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;text-decoration:none;white-space:nowrap}
.btn-glass:hover{background:rgba(128,128,128,.15);border-color:rgba(128,128,128,.28);box-shadow:0 7px 20px rgba(0,0,0,.07)}.btn-glass:active{transform:scale(.96)}
.lb-intro{position:relative;overflow:hidden;padding:20px;border-radius:20px;margin-top:16px;background:linear-gradient(135deg,rgba(128,128,128,.11),rgba(128,128,128,.035));border:1px solid rgba(128,128,128,.15)}
.lb-intro::before{content:"";position:absolute;width:160px;height:160px;right:-75px;top:-85px;border-radius:50%;background:var(--color-accent);opacity:.07}.lb-intro::after{content:"";position:absolute;width:110px;height:110px;left:-70px;bottom:-70px;border-radius:50%;background:var(--color-accent);opacity:.045}
.lb-intro-content{position:relative;z-index:1}.lb-kicker{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent);margin-bottom:7px}
.lb-intro h1{margin:0;font-size:clamp(1.3rem,5vw,1.7rem);line-height:1.2;font-weight:900;letter-spacing:-.02em}.lb-intro p{margin:8px 0 0;color:var(--text-secondary);font-size:.83rem;line-height:1.65;max-width:650px}
.lb-guide{margin-top:12px}.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.guide-item{border:1px solid rgba(128,128,128,.15);background:rgba(128,128,128,.055);color:var(--text-primary);border-radius:13px;padding:12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.guide-item:hover{background:rgba(128,128,128,.10);transform:translateY(-1px)}.guide-item.active{background:var(--color-accent-soft);border-color:var(--color-accent)}
.guide-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.09);color:var(--color-accent);flex-shrink:0}
.guide-title{font-size:.78rem;font-weight:850;line-height:1.2}.guide-subtitle{font-size:.67rem;color:var(--text-muted);margin-top:3px}.guide-arrow{margin-left:auto;color:var(--text-muted);transition:transform .2s ease}.guide-item.active .guide-arrow{transform:rotate(180deg);color:var(--color-accent)}
.guide-detail{margin-top:8px;display:none;animation:guideOpen .22s ease}.guide-detail.show{display:block}@keyframes guideOpen{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.guide-detail-inner{padding:14px;border-radius:13px;background:rgba(128,128,128,.055);border:1px solid rgba(128,128,128,.12)}.guide-detail-title{font-size:.88rem;font-weight:850;margin-bottom:5px}.guide-detail-text{color:var(--text-secondary);font-size:.77rem;line-height:1.65}
.lb-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.lb-section-title{display:flex;align-items:center;gap:8px}.lb-section-title h2{font-size:1.1rem;font-weight:900;margin:0}.lb-section-badge{font-size:.65rem;font-weight:800;padding:4px 8px;border-radius:99px;background:var(--color-accent-soft);color:var(--color-accent)}
#classFilterRow{-ms-overflow-style:none;scrollbar-width:none}#classFilterRow::-webkit-scrollbar{display:none}
.lb-row{display:flex;align-items:center;gap:11px;padding:13px 10px;border-bottom:1px dashed rgba(128,128,128,.15);transition:background .18s ease,transform .18s ease}.lb-row:last-child{border-bottom:none}.lb-row:hover{background:rgba(128,128,128,.035)}
.lb-row.is-me{background:linear-gradient(135deg,rgba(250,204,21,.16),rgba(250,204,21,.045));border:1px solid rgba(234,179,8,.30);border-radius:13px;padding:13px;margin:4px 0}.lb-row.is-me .lb-name{color:#a16207}.lb-row.is-me .points-pill{background:rgba(161,98,7,.10);color:#a16207}
.rank-number{width:25px;font-size:.82rem;font-weight:900;color:var(--text-muted);flex-shrink:0;text-align:center}.lb-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--color-accent-soft);color:var(--color-accent);font-weight:900;border:1px solid rgba(128,128,128,.14)}.lb-avatar img{width:100%;height:100%;object-fit:cover}
.lb-name{font-weight:850;font-size:.91rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}.points-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:rgba(128,128,128,.09);color:var(--text-secondary);font-weight:800;font-size:.69rem;font-family:var(--font-num)}
.lb-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}.lb-action-btn{min-height:34px}.lb-action-label{display:inline}
.challenge-banner{position:relative;overflow:hidden;border:1px solid rgba(239,68,68,.22);background:linear-gradient(135deg,rgba(239,68,68,.09),rgba(128,128,128,.035))}.challenge-banner::after{content:"";position:absolute;width:100px;height:100px;right:-45px;top:-45px;border-radius:50%;background:#ef4444;opacity:.055}.challenge-title{color:#ef4444;font-size:.7rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.64);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.challenge-modal-card{width:100%;max-width:410px;padding:23px;border-radius:21px;animation:modalIn .22s ease}@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-heading{display:flex;align-items:flex-start;gap:11px}.modal-icon{width:40px;height:40px;border-radius:12px;background:rgba(239,68,68,.10);color:#ef4444;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:520px){.lb-intro{padding:17px;border-radius:17px}.guide-grid{grid-template-columns:1fr 1fr;gap:7px}.guide-item{padding:10px;gap:8px}.guide-icon{width:30px;height:30px;border-radius:9px}.guide-title{font-size:.72rem}.guide-subtitle{font-size:.61rem}.lb-row{gap:8px;padding-left:6px;padding-right:6px}.lb-row.is-me{padding-left:8px;padding-right:8px}.lb-avatar{width:38px;height:38px}.lb-name{font-size:.84rem}.lb-action-btn{padding:7px 8px;min-height:32px}.lb-action-label{display:none}.rank-number{width:21px;font-size:.75rem}}
@media(max-width:360px){.guide-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell" id="shell"><div class="state-block"><div class="spinner"></div></div></div>

<div id="challengeModal" class="modal-overlay" style="display:none;">
  <div class="glass-float-card challenge-modal-card" style="background:var(--surface);">
    <div class="modal-heading">
      <div class="modal-icon">
        <svg class="lb-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
      </div>
      <div>
        <h3 style="font-weight:900;margin:0 0 6px;color:var(--text-primary);font-size:1.15rem;">বন্ধুকে চ্যালেঞ্জ করো</h3>
        <p class="text-sm text-muted" style="line-height:1.6;">একটি আসন্ন পরীক্ষা বেছে নিয়ে বন্ধুকে চ্যালেঞ্জ পাঠাও। জিতলে পাবে <strong style="color:#eab308;">+১০০ পয়েন্ট</strong>।</p>
      </div>
    </div>
    <div id="challengeModalBody" style="margin-top:18px;"><div class="spinner"></div></div>
    <div class="flex gap-2 mt-5">
      <button class="btn-glass" id="closeChallengeModal" style="flex:1;">
        <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg> বাতিল
      </button>
      <button class="btn-glass" id="confirmChallengeBtn" style="flex:1;background:var(--color-danger);color:#fff;border:none;display:none;">
        <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg> চ্যালেঞ্জ পাঠাও
      </button>
    </div>
  </div>
</div>

<script type="module">
import {initTheme,toggleTheme,renderState,renderStudentHeader,showToast,friendlyError} from "../js/utils/ui-utils.js";
import {getActiveStudent,refreshActiveStudent,getActiveStudents} from "../js/utils/student-utils.js";
import {getLeaderboardData,getUpcomingExams} from "../js/utils/results-utils.js";
import {getMyFriendIds,getOutgoingRequests,sendFriendRequest} from "../js/utils/friend-utils.js";
import {getIncomingChallenges,getOutgoingChallenges,sendChallenge,acceptChallenge,rejectChallenge} from "../js/utils/challenge-utils.js";

initTheme();
const shell=document.getElementById("shell");
let student=getActiveStudent();

if(!student){window.location.href="../index.html";}
else{refreshActiveStudent(student.docId).then(fresh=>{if(fresh)student=fresh;render();});}

let allLeaderboard=[];
let myFriendIds=[];
let activeClassFilter="all";
let friendsOnly=false;
let upcomingExamsCache=null;
let selectedFriendIdForChallenge=null;
let liveActivities=[];
let liveActivityIndex=0;
let liveActivityTimer=null;
let liveRefreshTimer=null;

const guideData={
purpose:{title:"লিডারবোর্ড কেন আছে?",text:"লিডারবোর্ডের উদ্দেশ্য হলো পরীক্ষার প্রস্তুতিকে আরও নিয়মিত ও motivating করা। এখানে শিক্ষার্থীদের অর্জিত পয়েন্ট অনুযায়ী অবস্থান দেখা যায়। এটি অন্যকে ছোট করার জন্য নয়; নিজের progress বোঝা এবং নিয়মিত পড়াশোনায় উৎসাহ পাওয়ার জন্য তৈরি।"},
points:{title:"পয়েন্ট কীভাবে কাজ করে?",text:"পরীক্ষা বা নির্ধারিত academic activity থেকে পাওয়া পয়েন্ট এখানে জমা হয়। মোট পয়েন্ট যত বেশি হবে, লিডারবোর্ডে অবস্থান তত উপরে যাবে। তাই শুধু rank নয়, নিজের accumulated points-ও গুরুত্বপূর্ণ।"},
friends:{title:"বন্ধু ফিল্টার কী করে?",text:"‘সবাই’ থেকে ‘শুধু বন্ধুরা’ নির্বাচন করলে পুরো লিডারবোর্ডের বদলে শুধু তোমার বন্ধুদের এবং তোমার নিজের অবস্থান দেখা যাবে। এতে নিজের কাছের study group-এর progress সহজে দেখা যায়।"},
compare:{title:"তুলনা অপশনের কাজ কী?",text:"তুলনা অপশন ব্যবহার করে বন্ধুর সঙ্গে academic performance তুলনা করা যায়। এটি কোন জায়গায় তুমি ভালো করছ এবং কোথায় আরও practice দরকার তা বুঝতে সাহায্য করে।"},
challenge:{title:"চ্যালেঞ্জ অপশনের কাজ কী?",text:"চ্যালেঞ্জের মাধ্যমে কোনো বন্ধুকে একটি আসন্ন পরীক্ষায় প্রতিযোগিতার জন্য আমন্ত্রণ জানানো যায়। দুজন একই পরীক্ষায় অংশ নিয়ে নিজেদের performance অনুযায়ী প্রতিযোগিতা করতে পারে।"}
};

function createGuideButton(key,title,subtitle,icon){
return `<button class="guide-item" data-guide="${key}"><span class="guide-icon">${icon}</span><span style="min-width:0;"><span class="guide-title">${title}</span><span class="guide-subtitle">${subtitle}</span></span><span class="guide-arrow"><svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button>`;
}

function render(){
shell.innerHTML=`
${renderStudentHeader(student,"leaderboard")}
<section class="lb-intro"><div class="lb-intro-content">
<div class="lb-kicker"><svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M6 4v5a6 6 0 0 0 12 0V4"/><path d="M6 7H3a3 3 0 0 0 3 3"/><path d="M18 7h3a3 3 0 0 1-3 3"/></svg>STUDENT PERFORMANCE</div>
<h1>লিডারবোর্ড</h1>
<p>তোমার পরীক্ষার পারফরম্যান্স, পয়েন্ট এবং বন্ধুদের progress এক জায়গায় দেখো। নিচের অপশনগুলোতে tap করে প্রতিটি feature কীভাবে কাজ করে জেনে নাও।</p>
</div></section>

<div class="lb-top-tools">
  <button class="btn-glass lb-help-btn" id="leaderboardHelpBtn" title="লিডারবোর্ড সহায়তা" aria-label="লিডারবোর্ড সহায়তা">
    <svg class="lb-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.8 9a2.4 2.4 0 1 1 4.1 1.7c-.9.8-1.9 1.2-1.9 2.8"/>
      <path d="M12 17h.01"/>
    </svg>
  </button>
</div>

<div id="leaderboardHelpPanel" class="help-panel">
  <div class="help-panel-inner">
    <div class="help-panel-title">লিডারবোর্ড কীভাবে ব্যবহার করবে?</div>
    <div class="help-point"><span class="help-dot"></span><span><strong>র‍্যাঙ্কিং:</strong> পরীক্ষার performance অনুযায়ী শিক্ষার্থীদের অবস্থান দেখায়।</span></div>
    <div class="help-point"><span class="help-dot"></span><span><strong>বন্ধু:</strong> শুধু নিজের বন্ধুদের progress আলাদা করে দেখা যায়।</span></div>
    <div class="help-point"><span class="help-dot"></span><span><strong>তুলনা:</strong> বন্ধুর সঙ্গে academic performance compare করার জন্য।</span></div>
    <div class="help-point"><span class="help-dot"></span><span><strong>চ্যালেঞ্জ:</strong> আসন্ন পরীক্ষায় বন্ধুর সঙ্গে healthy competition শুরু করার জন্য।</span></div>
    <div class="help-point"><span class="help-dot"></span><span><strong>Live activity:</strong> বন্ধুদের নতুন academic activity বা score update থাকলে উপরের slider-এ দেখা যাবে।</span></div>
  </div>
</div>

<section class="lb-guide" style="display:none;"><div class="guide-grid">
${createGuideButton("purpose","লিডারবোর্ড","কেন ব্যবহার করবে?",`<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>`)}
${createGuideButton("points","পয়েন্ট","কীভাবে কাজ করে?",`<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M17 7.5c0-1.5-2.2-2.5-5-2.5s-5 1-5 2.5 2.2 2.5 5 2.5 5 1 5 2.5-2.2 2.5-5 2.5-5-1-5-2.5"/></svg>`)}
${createGuideButton("friends","বন্ধু","শুধু বন্ধুদের দেখো?",`<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6"/><circle cx="17" cy="9" r="2.5"/><path d="M14 20c.4-2.5 2.4-4.5 5-4.5"/></svg>`)}
${createGuideButton("compare","তুলনা","বন্ধুর performance",`<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V9"/><path d="M12 20V4"/><path d="M18 20v-7"/></svg>`)}
${createGuideButton("challenge","চ্যালেঞ্জ","বন্ধুর সঙ্গে test",`<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>`)}
</div>
<div id="guideDetail" class="guide-detail"><div class="guide-detail-inner"><div id="guideDetailTitle" class="guide-detail-title"></div><div id="guideDetailText" class="guide-detail-text"></div></div></div>
</section>


<div class="live-section">
  <div class="live-head">
    <div class="live-title">
      <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 0 1 16 0"/>
        <path d="M7 12a5 5 0 0 1 10 0"/>
        <path d="M10 12a2 2 0 0 1 4 0"/>
        <path d="M12 12v.01"/>
      </svg>
      বন্ধুদের Live Activity
    </div>
    <span class="live-status"><span class="live-status-dot"></span>লাইভ</span>
  </div>

  <div class="live-slider" id="liveActivitySlider">
    <div class="live-track" id="liveActivityTrack">
      <div class="live-empty">বন্ধুদের recent academic update খোঁজা হচ্ছে...</div>
    </div>
    <div class="live-controls" id="liveActivityControls"></div>
  </div>

  <div class="live-note">
    নতুন update পাওয়া গেলে slider নিজে থেকেই এগিয়ে যাবে।
  </div>
</div>

/* =========================================================
   LIVE ACTIVITY
   =========================================================
   This UI reads activity-shaped fields when they are available
   in the student/result objects. It also refreshes the leaderboard
   automatically so point/rank changes appear without reloading.
   Supported activity fields include:
   recentActivity / latestActivity / lastActivity / activity
   with subject, marks/score, examName/title and timestamp/time.
   ========================================================= */

function startLiveActivityRefresh(){
  refreshLiveActivity();
  if(liveRefreshTimer) clearInterval(liveRefreshTimer);
  liveRefreshTimer=setInterval(refreshLiveActivity,15000);
}

function stopLiveActivityRefresh(){
  if(liveRefreshTimer) clearInterval(liveRefreshTimer);
  if(liveActivityTimer) clearInterval(liveActivityTimer);
  liveRefreshTimer=null;
  liveActivityTimer=null;
}

function normalizeActivity(value, studentRecord){
  if(!value) return null;

  const a=Array.isArray(value)?value[0]:value;
  if(!a || typeof a!=="object") return null;

  const subject=a.subject || a.subjectName || a.topic || a.chapter || "";
  const marks=a.marks ?? a.score ?? a.obtainedMarks ?? a.totalScore ?? null;
  const total=a.total ?? a.totalMarks ?? a.maxMarks ?? null;
  const exam=a.examName || a.exam || a.testName || a.title || "পরীক্ষা";
  const timestamp=a.timestamp || a.time || a.createdAt || a.updatedAt || null;

  if(!subject && marks===null) return null;

  return {
    studentId:studentRecord.studentId,
    name:studentRecord.name || "বন্ধু",
    photoURL:studentRecord.photoURL || "",
    subject,
    marks,
    total,
    exam,
    timestamp
  };
}

function collectLiveActivities(students){
  const result=[];

  students.forEach(s=>{
    const possible=[
      s.recentActivity,
      s.latestActivity,
      s.lastActivity,
      s.activity
    ];

    for(const value of possible){
      const normalized=normalizeActivity(value,s);
      if(normalized){
        result.push(normalized);
        break;
      }
    }
  });

  return result.filter(a=>myFriendIds.includes(a.studentId));
}

function formatLiveTime(value){
  if(!value) return "এইমাত্র";

  try{
    let date;

    if(typeof value==="object" && typeof value.toDate==="function"){
      date=value.toDate();
    }else{
      date=new Date(value);
    }

    if(Number.isNaN(date.getTime())) return "এইমাত্র";

    const diff=Math.max(0,Date.now()-date.getTime());
    const mins=Math.floor(diff/60000);

    if(mins<1) return "এইমাত্র";
    if(mins<60) return `${mins} মিনিট আগে`;

    const hours=Math.floor(mins/60);
    if(hours<24) return `${hours} ঘণ্টা আগে`;

    return `${Math.floor(hours/24)} দিন আগে`;
  }catch{
    return "এইমাত্র";
  }
}

function renderLiveActivities(){
  const track=document.getElementById("liveActivityTrack");
  const controls=document.getElementById("liveActivityControls");

  if(!track || !controls) return;

  if(!liveActivities.length){
    track.innerHTML=`
      <div class="live-empty">
        তোমার বন্ধুদের নতুন subject/marks update এলে এখানে automaticভাবে দেখাবে।
      </div>`;
    controls.innerHTML="";
    return;
  }

  track.innerHTML=liveActivities.map(a=>{
    const avatar=a.photoURL
      ? `<img src="${a.photoURL}" alt="">`
      : (a.name||"ব").charAt(0);

    const score=a.marks===null || a.marks===undefined
      ? ""
      : `${a.marks}${a.total!==null && a.total!==undefined ? `/${a.total}` : ""}`;

    const action=a.subject
      ? `${a.subject} করেছে`
      : "নতুন academic update করেছে";

    return `
      <div class="live-card">
        <span class="live-avatar">${avatar}</span>

        <div class="live-copy">
          <div class="live-line">
            <strong>${a.name}</strong> ${action}
          </div>

          <div class="live-meta">
            ${a.exam} · ${formatLiveTime(a.timestamp)}
          </div>
        </div>

        ${score ? `<span class="live-score">${score}</span>` : ""}
      </div>`;
  }).join("");

  controls.innerHTML=liveActivities.map((_,i)=>`
    <button
      class="live-control ${i===liveActivityIndex?"active":""}"
      data-live-index="${i}"
      aria-label="Activity ${i+1}">
    </button>
  `).join("");

  controls.querySelectorAll(".live-control").forEach(btn=>{
    btn.addEventListener("click",()=>{
      liveActivityIndex=Number(btn.dataset.liveIndex);
      updateLiveSlider();
      restartLiveSlider();
    });
  });

  updateLiveSlider();
  restartLiveSlider();
}

function updateLiveSlider(){
  const track=document.getElementById("liveActivityTrack");
  const controls=document.getElementById("liveActivityControls");

  if(!track || !liveActivities.length) return;

  track.style.transform=`translateX(-${liveActivityIndex*100}%)`;

  controls?.querySelectorAll(".live-control").forEach((dot,i)=>{
    dot.classList.toggle("active",i===liveActivityIndex);
  });
}

function restartLiveSlider(){
  if(liveActivityTimer) clearInterval(liveActivityTimer);

  if(liveActivities.length<=1) return;

  liveActivityTimer=setInterval(()=>{
    liveActivityIndex=(liveActivityIndex+1)%liveActivities.length;
    updateLiveSlider();
  },4000);
}

async function refreshLiveActivity(){
  try{
    const students=await getActiveStudents();

    const activities=collectLiveActivities(students);

    if(activities.length){
      liveActivities=activities.slice(0,10);

      if(liveActivityIndex>=liveActivities.length){
        liveActivityIndex=0;
      }

      renderLiveActivities();
    }else{
      renderLiveActivities();
    }

    /* Refresh leaderboard data silently for live point/rank changes. */
    const latestBoard=await getLeaderboardData(students);

    if(Array.isArray(latestBoard)){
      allLeaderboard=latestBoard;

      if(document.getElementById("leaderboardList")){
        renderClassFilterRow();
        await renderLeaderboardList();
      }
    }
  }catch(err){
    console.error("Live activity refresh failed:",err);
  }
}
