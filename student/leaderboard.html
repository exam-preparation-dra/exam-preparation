<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">

<style>
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; }
  }

  :root {
    --lb-glass: rgba(128,128,128,.075);
    --lb-glass-strong: rgba(128,128,128,.115);
    --lb-border: rgba(128,128,128,.16);
    --lb-shadow: 0 18px 55px rgba(0,0,0,.07);

  .num { font-family:var(--font-num); font-variant-numeric:tabular-nums; }

  .lb-page { padding-bottom:28px; }

  .glass-float-card {
    background:var(--lb-glass);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--lb-border);
    border-radius:18px;
    box-shadow:var(--lb-shadow);
  }

  .btn-glass {
    appearance:none;
    border:1px solid var(--lb-border);
    background:var(--lb-glass);
    color:var(--text-primary);
    border-radius:11px;
    min-height:38px;
    padding:8px 12px;
    font:inherit;
    font-size:.76rem;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    cursor:pointer;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
    text-decoration:none;
    white-space:nowrap;
  }

  .btn-glass:hover { background:var(--lb-glass-strong); }
  .btn-glass:active { transform:scale(.96); }
  .btn-primary {
    background:var(--color-accent);
    color:#fff;
    border-color:var(--color-accent);
  }
  .btn-danger {
    color:#ef4444;
    border-color:rgba(239,68,68,.28);
  }

  .lb-icon { width:17px; height:17px; flex-shrink:0; }
  .lb-icon-lg { width:19px; height:19px; flex-shrink:0; }

  /* Intro */
  .lb-hero {
    position:relative;
    overflow:hidden;
    margin-top:16px;
    padding:22px 20px;
  }
  .lb-hero::before {
    content:"";
    position:absolute;
    width:150px;height:150px;
    right:-55px;top:-75px;
    border-radius:50%;

  }
  .lb-kicker {
    display:flex;

    color:var(--color-accent);

  .lb-hero h1 {

  .lb-hero p {

    margin:0;

    line-height:1.65;

  .lb-top-tools { display:flex; justify-content:flex-end; margin:9px 0 2px; }
  .lb-help-btn { width:40px; height:40px; padding:0; border-radius:13px; }

  @keyframes lbOpen {

  .lb-help-inner { padding:16px; }
  .lb-help-title {

    margin-bottom:10px;
  }
  .lb-help-row {
    display:flex;
    align-items:flex-start;
    gap:9px;

    margin-top:8px;

  .lb-dot {

  .live-status {

  .filter-btn { min-height:34px;padding:7px 11px;font-size:.7rem;flex-shrink:0; }

  /* Rows */
  .lb-list-card { padding:6px; }
  .lb-row {

  .lb-avatar {

  /* Challenge */
  .challenge-card { margin-top:12px;padding:14px; }
  .challenge-kicker {

  .challenge-row {

  .challenge-row:last-child { border-bottom:0;padding-bottom:0; }
  .challenge-row:first-of-type { padding-top:0; }

<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Challenge modal -->
<div id="challengeModal" class="modal-overlay" style="display:none;">
  <div class="glass-float-card challenge-modal">
    <div class="modal-title">বন্ধুকে চ্যালেঞ্জ করো</div>

      একটি আসন্ন পরীক্ষা বেছে নিয়ে বন্ধুকে challenge পাঠাও। দুজনের জন্য healthy competition তৈরি হবে।

<script type="module">
import {
  initTheme, toggleTheme, renderState, renderStudentHeader,
  showToast, friendlyError
} from "../js/utils/ui-utils.js";

import {
  getActiveStudent, refreshActiveStudent, getActiveStudents
} from "../js/utils/student-utils.js";

import {
  getLeaderboardData, getUpcomingExams
} from "../js/utils/results-utils.js";

import {
  getMyFriendIds, getOutgoingRequests, sendFriendRequest
} from "../js/utils/friend-utils.js";

import { getSubjects } from "../js/utils/syllabus-utils.js";

import {
  getIncomingChallenges, getOutgoingChallenges,
  sendChallenge, acceptChallenge, rejectChallenge
} from "../js/utils/challenge-utils.js";

import {
  collection, query, where, getDocs, updateDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db } from "../js/firebase/firebase-config.js";

const CHALLENGE_REWARDS = Object.freeze({ winner: 100, loser: 25, draw: 50 });

initTheme();

const shell = document.getElementById("shell");
let student = getActiveStudent();

let allLeaderboard = [];
let myFriendIds = [];
let activeClassFilter = "all";
let friendsOnly = false;
let upcomingExamsCache = null;
let selectedFriendIdForChallenge = null;

let liveActivities = [];
let liveActivityIndex = 0;
let liveActivityTimer = null;
let liveRefreshTimer = null;
let liveSubjectsMap = {};

/* ---------- Safety / display helpers ---------- */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getMillis(value) {
  if (!value) return 0;
  if (typeof value.toMillis === "function") return value.toMillis();
  if (value instanceof Date) return value.getTime();
  const n = new Date(value).getTime();
  return Number.isFinite(n) ? n : 0;
}

function relativeTime(value) {
  const ms = getMillis(value);
  if (!ms) return "এইমাত্র";

  const diff = Math.max(0, Date.now() - ms);
  const min = Math.floor(diff / 60000);

  if (min < 1) return "এইমাত্র";
  if (min < 60) return `${min} মিনিট আগে`;

  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour} ঘণ্টা আগে`;

  const day = Math.floor(hour / 24);
  if (day < 30) return `${day} দিন আগে`;

  return `${Math.floor(day / 30)} মাস আগে`;
}

function getResultSubjectText(result) {
  if (result.subjectName) return result.subjectName;
  if (result.subject) return result.subject;

  const list = Array.isArray(result.subjectBreakdown) ? result.subjectBreakdown : [];
  const names = list.map(x => liveSubjectsMap[x.subjectId]).filter(Boolean);

  if (names.length === 1) return names[0];
  if (names.length > 1) return names.slice(0, 2).join(" + ") + (names.length > 2 ? ` + ${names.length - 2}টি` : "");
  if (list.length === 1) return "বিষয়ভিত্তিক পরীক্ষা";
  return "পরীক্ষা";
}

function buildActivityFromResult(result, studentMap) {
  const friend = studentMap[result.studentId];
  if (!friend) return null;
  if (!myFriendIds.includes(result.studentId)) return null;

  const marks = Number(result.obtainedMarks);
  const total = Number(result.totalMarks);
  const pct = Number(result.percentage);
  const correct = Number(result.correctCount) || 0;
  const wrong = Number(result.wrongCount) || 0;
  const unanswered = Number(result.unansweredCount) || 0;

  const mine = allLeaderboard.find(r => r.studentId === student.studentId);
  const friendBoard = allLeaderboard.find(r => r.studentId === result.studentId);

  const pointGap = mine && friendBoard
    ? (Number(friendBoard.totalPoints) || 0) - (Number(mine.totalPoints) || 0)
    : null;

  const percentageGap = Number.isFinite(pct) && mine && Number.isFinite(Number(mine.avgPercentage))
    ? Math.round((pct - Number(mine.avgPercentage)) * 10) / 10
    : null;

  let comparison = "সমান";
  if (pointGap !== null) {
    if (pointGap > 0) comparison = `${pointGap} points এগিয়ে`;
    else if (pointGap < 0) comparison = `${Math.abs(pointGap)} points পিছিয়ে`;
  } else if (percentageGap !== null) {
    if (percentageGap > 0) comparison = `${percentageGap}% এগিয়ে`;
    else if (percentageGap < 0) comparison = `${Math.abs(percentageGap)}% পিছিয়ে`;
  }

  return {
    id: result.id || `${result.examId}_${result.studentId}`,
    studentId: result.studentId,
    name: friend.name || "বন্ধু",
    photoURL: friend.photoURL || null,
    subject: getResultSubjectText(result),
    examName: result.examName || "পরীক্ষা",
    obtainedMarks: Number.isFinite(marks) ? marks : null,
    totalMarks: Number.isFinite(total) ? total : null,
    percentage: Number.isFinite(pct) ? pct : null,
    correctCount: correct,
    wrongCount: wrong,
    unansweredCount: unanswered,
    submittedAt: result.submittedAt || result.approvedAt || null,
    pointGap,
    percentageGap,
    comparison
  };
}


/* ---------- Self-contained approved-results + challenge bonus layer ---------- */
async function getApprovedResultsForLeaderboard() {
  const snap = await getDocs(query(collection(db, "results"), where("status", "==", "approved")));
  return snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.submittedAt?.toMillis?.() ?? 0) - (a.submittedAt?.toMillis?.() ?? 0));
}

async function resolveCompletedChallengesLocal(approvedResults) {
  const bonusMap = {};
  try {
    const challengeSnap = await getDocs(collection(db, "examChallenges"));
    const challenges = challengeSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    const resultMap = new Map();
    for (const r of approvedResults || []) {
      if (r.studentId && r.examId) resultMap.set(`${r.examId}__${r.studentId}`, r);
    }

    for (const c of challenges) {
      if (c.bonusAwarded === true || c.status === "resolved" || c.status === "completed") {
        if (c.winnerStudentId) {
          bonusMap[c.winnerStudentId] = (bonusMap[c.winnerStudentId] || 0) + (Number(c.winnerBonus) || 0);
          bonusMap[c.loserStudentId] = (bonusMap[c.loserStudentId] || 0) + (Number(c.loserBonus) || 0);
        } else if (Array.isArray(c.drawStudentIds)) {
          for (const sid of c.drawStudentIds) bonusMap[sid] = (bonusMap[sid] || 0) + (Number(c.drawBonus) || CHALLENGE_REWARDS.draw);
        }
        continue;
      }
      if (c.status !== "accepted") continue;

      const a = resultMap.get(`${c.examId}__${c.fromStudentId}`);
      const b = resultMap.get(`${c.examId}__${c.toStudentId}`);
      if (!a || !b) continue;

      const pa = Number(a.percentage) || 0, pb = Number(b.percentage) || 0;
      const ma = Number(a.obtainedMarks) || 0, mb = Number(b.obtainedMarks) || 0;
      let update;
      if (pa > pb || (pa === pb && ma > mb)) {
        update = {status:"resolved", bonusAwarded:true, winnerStudentId:c.fromStudentId, loserStudentId:c.toStudentId,
          winnerBonus:CHALLENGE_REWARDS.winner, loserBonus:CHALLENGE_REWARDS.loser, drawStudentIds:[], drawBonus:0, resolvedAt:serverTimestamp()};
      } else if (pb > pa || (pa === pb && mb > ma)) {
        update = {status:"resolved", bonusAwarded:true, winnerStudentId:c.toStudentId, loserStudentId:c.fromStudentId,
          winnerBonus:CHALLENGE_REWARDS.winner, loserBonus:CHALLENGE_REWARDS.loser, drawStudentIds:[], drawBonus:0, resolvedAt:serverTimestamp()};
      } else {
        update = {status:"resolved", bonusAwarded:true, winnerStudentId:null, loserStudentId:null,
          winnerBonus:0, loserBonus:0, drawStudentIds:[c.fromStudentId,c.toStudentId], drawBonus:CHALLENGE_REWARDS.draw, resolvedAt:serverTimestamp()};
      }
      try { await updateDoc(doc(db,"examChallenges",c.id), update); } catch(e) { console.warn("Challenge save skipped", e); }

      if (update.winnerStudentId) {
        bonusMap[update.winnerStudentId] = (bonusMap[update.winnerStudentId] || 0) + update.winnerBonus;
        bonusMap[update.loserStudentId] = (bonusMap[update.loserStudentId] || 0) + update.loserBonus;
      } else {
        for (const sid of update.drawStudentIds) bonusMap[sid] = (bonusMap[sid] || 0) + update.drawBonus;
      }
    }
  } catch (e) {
    console.warn("Challenge bonus layer unavailable", e);
  }
  return bonusMap;
}

/* ---------- Existing leaderboard data ---------- */

async function loadEverything() {
  const listEl = document.getElementById("leaderboardList");

  try {
    /* First fetch the students. This is the only hard dependency for the
       leaderboard itself. */
    let students;
    try {
      students = await getActiveStudents();
    } catch (err) {
      console.error("Students load failed:", err);
      if (listEl) {
        listEl.innerHTML = `<div class="lb-error">
          <strong>লিডারবোর্ড লোড করা যায়নি</strong>
          <span>ইন্টারনেট/Firebase connection check করে আবার চেষ্টা করো।</span>
          <button class="btn-glass text-action" id="retryLeaderboardBtn">আবার চেষ্টা</button>
        </div>`;
        document.getElementById("retryLeaderboardBtn")?.addEventListener("click", loadEverything);
      }
      return;
    }

    /* Load independent data separately so a challenge/bonus read failure
       cannot blank the entire leaderboard. */
    const [boardResult, friendsResult, resultsResult] = await Promise.allSettled([
      getLeaderboardData(students),
      getMyFriendIds(student.studentId),
      getApprovedResultsForLeaderboard()
    ]);

    const board = boardResult.status === "fulfilled" && Array.isArray(boardResult.value)
      ? boardResult.value : [];

    myFriendIds = friendsResult.status === "fulfilled" && Array.isArray(friendsResult.value)
      ? friendsResult.value : [];

    const approvedResults = resultsResult.status === "fulfilled"
      ? resultsResult.value : [];

    if (boardResult.status === "rejected") {
      console.error("Leaderboard data failed:", boardResult.reason);
    }

    /* Bonus resolution is optional. The base leaderboard must still render
       even if Firestore denies the challenge update/read. */
    let bonusMap = {};
    try {
      bonusMap = await resolveCompletedChallengesLocal(approvedResults);
    } catch (err) {
      console.warn("Challenge bonus resolution skipped:", err);
    }

    allLeaderboard = board.map(r => ({
      ...r,
      basePoints: Number(r.totalPoints) || 0,
      challengeBonus: Number(bonusMap[r.studentId]) || 0,
      totalPoints: (Number(r.totalPoints) || 0) + (Number(bonusMap[r.studentId]) || 0)
    })).sort((a, b) => b.totalPoints - a.totalPoints);

    renderClassFilterRow();
    await renderLeaderboardList();

    try {
      await renderIncomingChallenges(students);
    } catch (err) {
      console.warn("Incoming challenge render skipped:", err);
    }

  } catch (err) {
    console.error("Leaderboard load failed:", err);
    if (listEl) {
      listEl.innerHTML = `<div class="lb-error">
        <strong>কিছুক্ষণ পরে আবার চেষ্টা করো</strong>
        <span>Leaderboard-এর মূল page চালু আছে, কিন্তু data আনতে সমস্যা হয়েছে।</span>
        <button class="btn-glass text-action" id="retryLeaderboardBtn">আবার চেষ্টা</button>
      </div>`;
      document.getElementById("retryLeaderboardBtn")?.addEventListener("click", loadEverything);
    }
  }
}

function renderClassFilterRow() {

  const classes = [...new Set(

  el.innerHTML = [
    `<button class="btn-glass filter-btn ${activeClassFilter === "all" ? "active" : ""}" data-class="all">সব</button>`,
    ...classes.map(c => `
      <button class="btn-glass filter-btn ${activeClassFilter === c ? "active" : ""}" data-class="${escapeHtml(c)}">
        ${escapeHtml(c)}

    `)
  ].join("");

  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {

      renderClassFilterRow();
      renderLeaderboardList();
    });
  });
}

async function renderLeaderboardList() {
  const el = document.getElementById("leaderboardList");
  if (!el) return;

  let rows = [...allLeaderboard];

  if (activeClassFilter !== "all") {
    rows = rows.filter(r => r.className === activeClassFilter);
  }

  if (friendsOnly) {
    rows = rows.filter(r =>
      myFriendIds.includes(r.studentId) || r.studentId === student.studentId
    );
  }

  if (!rows.length) {
    renderState(el, "empty", "এখনো কোনো approved result নেই।");
    return;
  }

  let outgoingReqs = [];
  let outgoingChalls = [];

  try {
    [outgoingReqs, outgoingChalls] = await Promise.all([
      getOutgoingRequests(student.studentId),
      getOutgoingChallenges(student.studentId)
    ]);
  } catch (err) {
    console.error("Action state load failed:", err);
  }

  const pendingToIds = new Set(
    outgoingReqs.map(r => r.toStudentId)
  );

  const challengedIds = new Set(
    outgoingChalls
      .filter(c => c.status === "pending")
      .map(c => c.toStudentId)
  );

  el.innerHTML = rows.map((r, i) => {
    const isMe = r.studentId === student.studentId;
    const isFriend = myFriendIds.includes(r.studentId);

    let actions = "";

    if (!isMe) {
      if (isFriend) {
        const hasChallenged = challengedIds.has(r.studentId);

        actions += `
          <a href="../student/comparison.html?friendId=${encodeURIComponent(r.studentId)}"
             class="btn-glass label-action"
             title="তুলনা"
             aria-label="তুলনা">
            <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
            </svg>
            তুলনা
          </a>
        `;

        actions += hasChallenged
          ? `
            <span class="btn-glass action-btn"
                  style="color:var(--text-muted);cursor:default;"
                  title="চ্যালেঞ্জ অপেক্ষমান">
              <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
              </svg>
            </span>
          `
          : `
            <button class="btn-glass btn-danger label-action challenge-btn"
                    data-id="${escapeHtml(r.studentId)}"
                    title="চ্যালেঞ্জ"
                    aria-label="চ্যালেঞ্জ">
              <svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m14.5 17.5-11.5-11.5V3h3l11.5 11.5"/>
                <path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>
              </svg>
              চ্যালেঞ্জ
            </button>
          `;
      } else if (pendingToIds.has(r.studentId)) {
        actions = `<span class="btn-glass text-action" style="color:var(--text-muted);">পাঠানো</span>`;
      } else {
        actions = `
          <button class="btn-glass text-action add-friend-btn"
                  data-id="${escapeHtml(r.studentId)}">
            + বন্ধু
          </button>
        `;
      }
    }

    const pct = Number(r.avgPercentage);
    const avgText = Number.isFinite(pct) ? `${pct}% গড়` : "";

    return `
      <div class="lb-row ${isMe ? "is-me" : ""}">
        <span class="rank-number">${i + 1}.</span>

        <span class="lb-avatar">
          ${
            r.photoURL
              ? `<img src="${escapeHtml(r.photoURL)}" alt="">`
              : escapeHtml((r.name || "শ").charAt(0))
          }
        </span>

        <div class="lb-main">
          <p class="lb-name">${escapeHtml(r.name || r.studentId)}${isMe ? " (তুমি)" : ""}</p>
          <div class="lb-subline">
            <span class="points-pill">${Number(r.totalPoints) || 0} পয়েন্ট</span>
            ${Number(r.challengeBonus) > 0 ? `<span class="bonus-pill">+${Number(r.challengeBonus)} challenge</span>` : ""}
            ${avgText ? `<span class="avg-pill">${avgText}</span>` : ""}
          </div>
        </div>

        <div class="lb-actions">${actions}</div>
      </div>
    `;
  }).join("");

  el.querySelectorAll(".add-friend-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await sendFriendRequest(student.studentId, btn.dataset.id);
        showToast("অনুরোধ পাঠানো হয়েছে।", "success");
        await renderLeaderboardList();
      } catch (err) {
        showToast(friendlyError(err), "error");
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".challenge-btn").forEach(btn => {
    btn.addEventListener("click", () => openChallengeModal(btn.dataset.id));
  });
}

async function refreshLiveResults() {
  try {

      getApprovedResultsForLeaderboard(),
      getActiveStudents(),
      getSubjects(true)
    ]);

    liveSubjectsMap = {};
    subjects.forEach(sub => {
      liveSubjectsMap[sub.id] = sub.name_bn || sub.name_en || sub.id;
    });

    const studentMap = {};
    students.forEach(s => { studentMap[s.studentId] = s; });

    liveActivities = results
      .map(r => buildActivityFromResult(r, studentMap))
      .filter(Boolean)
      .sort((a,b) => getMillis(b.submittedAt) - getMillis(a.submittedAt))
      .slice(0, 10);

    if (liveActivityIndex >= liveActivities.length) liveActivityIndex = 0;
    renderLiveActivities();

    const latestBoard = await getLeaderboardData(students);
    const bonusMap = await resolveCompletedChallengesLocal(results);
    if (Array.isArray(latestBoard)) {
      allLeaderboard = latestBoard.map(r => ({
        ...r,
        basePoints: Number(r.totalPoints) || 0,
        challengeBonus: Number(bonusMap[r.studentId]) || 0,
        totalPoints: (Number(r.totalPoints) || 0) + (Number(bonusMap[r.studentId]) || 0)
      })).sort((a,b) => b.totalPoints - a.totalPoints);
      renderClassFilterRow();
      await renderLeaderboardList();
    }
  } catch (err) {
    console.error("Live activity refresh failed:", err);
    /* Do not replace the whole page with a spinner if live feed fails. */
  }
}

function startLiveResultsListener() {
  if (liveRefreshTimer) clearInterval(liveRefreshTimer);

  /* Initial load + automatic refresh every 10 seconds.
     This deliberately uses the existing results-utils data layer so this page
     does not need to know/export the Firebase db instance itself. */
  refreshLiveResults();
  liveRefreshTimer = setInterval(refreshLiveResults, 10000);
}

function updateLiveSlider() {
  const track = document.getElementById("liveActivityTrack");
  if (!track || !liveActivities.length) return;
  track.style.transform = `translateX(-${liveActivityIndex * 100}%)`;
}

function restartLiveSlider() {
  if (liveActivityTimer) clearInterval(liveActivityTimer);
  if (liveActivities.length <= 1) {
    liveActivityTimer = null;
    return;
  }
  liveActivityTimer = setInterval(() => {
    liveActivityIndex = (liveActivityIndex + 1) % liveActivities.length;
    updateLiveSlider();
  }, 4500);
}

function renderLiveActivities(list = liveActivities) {
  liveActivities = Array.isArray(list) ? list : [];
  const track = document.getElementById("liveActivityTrack");
  if (!track) return;

  if (!liveActivities.length) {
    track.innerHTML = `
      <div class="live-empty">
        তোমার accepted friend-এর approved result এলে এখানে
        <strong>marks, percentage ও correct/wrong</strong> দেখা যাবে।
      </div>`;
    if (liveActivityTimer) clearInterval(liveActivityTimer);
    liveActivityTimer = null;
    return;
  }

  if (liveActivityIndex >= liveActivities.length) liveActivityIndex = 0;

  track.innerHTML = liveActivities.map(a => {
    const avatar = a.photoURL
      ? `<img src="${escapeHtml(a.photoURL)}" alt="">`
      : escapeHtml((a.name || "ব").charAt(0));

    const marks = a.obtainedMarks !== null && a.totalMarks !== null
      ? `${a.obtainedMarks}/${a.totalMarks}` : "—";
    const pct = a.percentage !== null ? `${a.percentage}%` : "—";

    return `
      <div class="live-card">
        <div class="live-card-inner">
          <span class="live-avatar">${avatar}</span>

          <div class="live-copy">
            <div class="live-name">${escapeHtml(a.name)}</div>
            <div class="live-exam">${escapeHtml(a.examName)} · ${escapeHtml(a.subject)}</div>
          </div>

          <div class="live-score">
            <div class="live-score-value">${escapeHtml(pct)}</div>
            <div class="live-score-label">percentage</div>
          </div>
        </div>

        <div class="live-stats">
          <div class="live-stat">
            <span class="live-stat-icon"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>
            <span class="live-stat-value">${escapeHtml(marks)}</span>
            <span class="live-stat-label">Marks</span>
          </div>
          <div class="live-stat">
            <span class="live-stat-icon"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></span>
            <span class="live-stat-value">${a.correctCount}</span>
            <span class="live-stat-label">Correct</span>
          </div>
          <div class="live-stat">
            <span class="live-stat-icon"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
            <span class="live-stat-value">${a.wrongCount}</span>
            <span class="live-stat-label">Wrong</span>
          </div>
          <div class="live-stat">
            <span class="live-stat-icon"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5v14l10-7L5 5Z"/><path d="M19 5v14"/></svg></span>
            <span class="live-stat-value">${a.unansweredCount}</span>
            <span class="live-stat-label">Skipped</span>
          </div>
        </div>

        <div class="live-time">${escapeHtml(relativeTime(a.submittedAt))}</div>
      </div>
    `;
  }).join("");

  updateLiveSlider();
  restartLiveSlider();
}
</script>
</body>
</html>
