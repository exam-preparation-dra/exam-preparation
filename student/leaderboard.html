<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  .lx { display:flex; flex-direction:column; gap:12px; }
  .lx-ico { width:14px; height:14px; flex:none; }
  .lx-card { background:var(--surface); border:1px solid var(--surface-border); border-radius:16px; padding:6px 12px; }
  .lx-empty { text-align:center; color:var(--text-muted); font-size:.82rem; padding:26px 10px; }
  .lx-title { font-size:.74rem; font-weight:800; color:var(--text-muted); margin:6px 2px -4px; }

  .lx-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:11px; border:1px solid var(--surface-border); background:var(--surface-solid); color:var(--text-primary); font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .lx-btn.primary { background:var(--color-accent); border-color:var(--color-accent); color:#fff; }
  .lx-btn.ok { background:var(--color-success); border-color:var(--color-success); color:#fff; }
  .lx-btn.danger { color:var(--color-danger); background:transparent; }
  .lx-btn.sm { padding:6px 11px; font-size:.72rem; border-radius:9px; }
  .lx-btn[disabled] { opacity:.5; cursor:default; }

  .lx-av { position:relative; flex:none; border-radius:50%; background:var(--color-accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:800; overflow:hidden; }
  .lx-av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .lx-me { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--surface-border); border-radius:16px; }
  .lx-me b { font-size:.92rem; display:block; }
  .lx-me small { font-size:.72rem; color:var(--text-muted); }
  .lx-me .r { margin-left:auto; text-align:right; }
  .lx-me .r b { font-family:var(--font-num); font-size:1.2rem; color:var(--color-accent); }

  .lx-seg { display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--surface-edge); }
  .lx-seg button { flex:1; padding:8px 4px; border:0; border-radius:9px; background:transparent; color:var(--text-secondary); font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; }
  .lx-seg button.on { background:var(--surface-solid); color:var(--text-primary); box-shadow:var(--shadow-soft); }
  .lx-dot { display:inline-block; min-width:16px; height:16px; line-height:16px; padding:0 4px; margin-left:4px; border-radius:99px; background:var(--color-danger); color:#fff; font-size:.62rem; font-weight:800; }
  .lx-filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .lx-chip { padding:6px 12px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface-solid); color:var(--text-secondary); font:inherit; font-size:.74rem; font-weight:700; cursor:pointer; }
  .lx-chip.on { background:var(--color-accent); border-color:var(--color-accent); color:#fff; }
  .lx-sel, .lx-inp { padding:9px 12px; border-radius:11px; border:1px solid var(--surface-border); background:var(--surface-solid); color:inherit; font:inherit; font-size:.85rem; }
  .lx-inp { width:100%; }

  .lx-row { display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--surface-edge); cursor:pointer; }
  .lx-row:first-child { border-top:0; }
  .lx-row.me { background:rgba(var(--color-accent-rgb),.09); margin:0 -8px; padding-left:10px; padding-right:10px; border-radius:10px; }
  .lx-rk { width:24px; text-align:center; font-family:var(--font-num); font-weight:800; color:var(--text-muted); font-size:.85rem; flex:none; }
  .lx-rk.t1 { color:#c99a3b; } .lx-rk.t2 { color:#8d94a0; } .lx-rk.t3 { color:#a7683c; }
  .lx-nm { font-weight:700; font-size:.86rem; line-height:1.25; }
  .lx-sub { font-size:.68rem; color:var(--text-muted); margin-top:1px; }
  .lx-val { margin-left:auto; text-align:right; flex:none; font-family:var(--font-num); font-weight:800; font-size:.9rem; }
  .lx-tag { font-size:.6rem; font-weight:800; padding:2px 6px; border-radius:99px; background:var(--color-accent); color:#fff; margin-left:5px; vertical-align:1px; }
  .lx-mv { display:inline-flex; align-items:center; font-size:.64rem; font-weight:800; margin-left:4px; }
  .lx-mv.up { color:var(--color-success); } .lx-mv.down { color:var(--color-danger); }
  .lx-badge { margin-left:auto; flex:none; font-size:.66rem; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--surface-edge); color:var(--text-secondary); }
  .lx-badge.win { background:rgba(47,125,94,.14); color:var(--color-success); }
  .lx-badge.lose { background:rgba(166,64,47,.12); color:var(--color-danger); }
  .lx-badge.wait { background:rgba(var(--color-accent-rgb),.14); color:var(--color-accent); }
  .lx-acts { display:flex; gap:6px; margin-left:auto; flex:none; }

  .lx-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lx-rec { font-size:.8rem; font-weight:700; color:var(--text-secondary); }

  .lx-ov { position:fixed; inset:0; z-index:9000; background:rgba(15,15,20,.5); display:flex; align-items:flex-end; justify-content:center; }
  .lx-sheet { width:100%; max-width:480px; background:var(--surface-solid); border-radius:18px 18px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); }
  .lx-ov.center { align-items:center; padding:16px; }
  .lx-ov.center .lx-sheet { border-radius:18px; }
  .lx-sheet .lx-inp, .lx-sheet .lx-sel { width:100%; margin-bottom:10px; }
  .lx-sheet-h { font-weight:800; margin-bottom:12px; }
  .lx-list { display:flex; flex-direction:column; gap:8px; }
  .lx-list .lx-btn { width:100%; padding:12px; }

  /* ===== Leaderboard v2: hero card, podium, rich rows, awards, rival ===== */
  .lx-hero { position:relative; overflow:hidden; color:#f3f1ea; background:#21262f; border-radius:var(--radius-lg); padding:16px 16px 12px; display:grid; grid-template-columns:1fr auto; column-gap:12px; align-items:center; }
  .lx-h-label { font-size:.76rem; font-weight:700; color:rgba(243,241,234,.68); display:flex; align-items:center; gap:8px; }
  .lx-h-label .lx-av { width:22px!important; height:22px!important; font-size:.66rem!important; }
  .lx-h-rank { font-family:var(--font-num); font-weight:700; font-size:2.7rem; line-height:1.08; letter-spacing:-.02em; margin:2px 0 2px; color:var(--color-accent); }
  .lx-h-xp { font-size:.8rem; font-weight:700; color:rgba(243,241,234,.78); }
  .lx-h-xp b { font-family:var(--font-num); color:#f3f1ea; font-weight:800; }
  .lx-h-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .lx-h-chip { font-size:.7rem; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(243,241,234,.1); border:1px solid rgba(243,241,234,.16); color:rgba(243,241,234,.9); display:inline-flex; align-items:center; gap:3px; }
  .lx-h-chip b { font-family:var(--font-num); font-weight:700; }
  .lx-h-chip.up { background:rgba(47,125,94,.28); border-color:rgba(47,125,94,.5); color:#a9d9bf; }
  .lx-h-chip.down { background:rgba(166,64,47,.28); border-color:rgba(166,64,47,.5); color:#e8b5aa; }
  .lx-h-seal { position:relative; width:84px; height:84px; }
  .lx-h-seal svg.ring { width:100%; height:100%; transform:rotate(-90deg); }
  .lx-h-ring { transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .lx-h-seal-c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .lx-h-seal-c b { font-family:var(--font-num); font-size:1.35rem; line-height:1; font-weight:700; color:var(--color-accent); }
  .lx-h-seal-c span { font-size:.6rem; font-weight:700; color:rgba(243,241,234,.6); margin-top:2px; }
  .lx-h-foot { grid-column:1 / -1; margin-top:12px; padding-top:10px; border-top:1px solid rgba(243,241,234,.14); font-size:.78rem; font-weight:600; color:rgba(243,241,234,.8); line-height:1.6; }
  .lx-h-foot b { font-family:var(--font-num); color:var(--color-accent); font-weight:700; }

  .lx-rival { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:var(--radius-lg); border:1px solid var(--surface-border); background:var(--surface); color:var(--text-primary); font:inherit; text-align:left; cursor:pointer; position:relative; padding-left:16px; }
  .lx-rival::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--color-danger); }
  .lx-rival .mid { min-width:0; flex:1; }
  .lx-rival .k { font-size:.66rem; font-weight:800; color:var(--text-muted); }
  .lx-rival .n { font-size:.88rem; font-weight:800; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lx-rival .g { font-size:.74rem; font-weight:700; margin-top:1px; }
  .lx-rival .g.ahead { color:var(--color-success); } .lx-rival .g.behind { color:var(--color-danger); } .lx-rival .g.even { color:var(--text-secondary); }
  .lx-rival .rec { flex:none; text-align:right; font-size:.68rem; font-weight:700; color:var(--text-muted); line-height:1.5; }
  .lx-rival .rec b { font-family:var(--font-num); color:var(--text-primary); font-weight:800; font-size:.92rem; display:block; }
  .lx-rival.empty { justify-content:center; color:var(--text-secondary); font-size:.78rem; font-weight:700; border-style:dashed; background:transparent; }
  .lx-rival.empty::before { display:none; }

  .lx-awards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .lx-award { background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius-md); padding:10px 8px 9px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; cursor:pointer; }
  .lx-award .t { font-size:.64rem; font-weight:800; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
  .lx-award .t .lx-ico { color:var(--color-accent); width:13px; height:13px; }
  .lx-award .nm { font-size:.76rem; font-weight:800; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lx-award .v { font-family:var(--font-num); font-size:.72rem; font-weight:800; color:var(--color-accent); }

  .lx-search { display:flex; gap:8px; }
  .lx-search .lx-inp { flex:1; min-width:0; }
  .lx-jump { flex:none; display:inline-flex; align-items:center; gap:5px; padding:0 13px; border-radius:11px; border:1px solid var(--surface-border); background:var(--surface-solid); color:var(--text-primary); font:inherit; font-size:.76rem; font-weight:800; cursor:pointer; }
  .lx-jump .lx-ico { color:var(--color-accent); }

  .lx-podium { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:8px; align-items:end; background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius-lg); padding:16px 10px 0; overflow:hidden; }
  .lx-pod { --medal:var(--color-accent); display:flex; flex-direction:column; align-items:center; min-width:0; cursor:pointer; }
  .lx-pod.p2 { --medal:#8d94a0; } .lx-pod.p3 { --medal:#a7683c; }
  .lx-pod-av { position:relative; margin-bottom:8px; }
  .lx-pod-av .lx-av { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--medal); }
  .lx-pod-n { position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; border-radius:50%; background:var(--medal); color:#fff; font-family:var(--font-num); font-weight:800; font-size:.7rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--surface); }
  .lx-pod-nm { font-size:.78rem; font-weight:800; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  .lx-pod-v { font-family:var(--font-num); font-weight:800; font-size:.92rem; color:var(--text-primary); margin-top:1px; }
  .lx-pod-v small { font-size:.62rem; font-weight:700; color:var(--text-muted); margin-left:2px; }
  .lx-pod-bar { width:100%; margin-top:8px; border-radius:8px 8px 0 0; background:color-mix(in srgb, var(--medal) 16%, transparent); border:1px solid color-mix(in srgb, var(--medal) 40%, transparent); border-bottom:0; }
  .lx-pod.p1 .lx-pod-bar { height:44px; } .lx-pod.p2 .lx-pod-bar { height:30px; } .lx-pod.p3 .lx-pod-bar { height:22px; }
  .lx-pod.me .lx-pod-nm { color:var(--color-accent); }

  .lx-mid { min-width:0; flex:1; }
  .lx-bar { height:4px; border-radius:4px; background:var(--surface-edge); margin-top:6px; overflow:hidden; }
  .lx-bar i { display:block; height:100%; border-radius:4px; background:var(--color-accent); opacity:.85; }
  .lx-row.me .lx-bar { background:rgba(var(--color-accent-rgb),.2); }
  .lx-val small { font-size:.6rem; font-weight:700; color:var(--text-muted); margin-left:2px; }
  .lx-wk { display:block; font-size:.62rem; font-weight:700; color:var(--color-success); margin-top:1px; }
  .lx-flash { animation:lxFlash 1.4s ease-out; }
  @keyframes lxFlash { 0%,35% { box-shadow:0 0 0 2px var(--color-accent); } 100% { box-shadow:0 0 0 2px transparent; } }
</style>
</head>
<body>
<div class="app-shell" id="shell"><div class="state-block"><div class="spinner"></div></div></div>

<script type="module">
import { initTheme, renderStudentHeader, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { requireStudentSession } from "../js/utils/student-auth.js";
import { buildLeaderboardRows, getUpcomingExams, getAllApprovedResults } from "../js/utils/results-utils.js";
import { getBattleXPMap } from "../js/utils/battle-utils.js?v=roomcard1";
import { getMyFriendIds, getIncomingRequests, getOutgoingRequests, sendFriendRequest, acceptFriendRequest, rejectFriendRequest, removeFriend, MAX_FRIENDS, getRival, setRival, clearRival } from "../js/utils/friend-utils.js";
import { getIncomingChallenges, getOutgoingChallenges, sendChallenge, acceptChallenge, rejectChallenge, cancelChallenge, resolveCompletedChallenges, getChallengeBonusMap, CHALLENGE_REWARDS } from "../js/utils/challenge-utils.js";
import { publishMyActivity, getFriendFeed, localExamFeed, activityFeedHtml, bindActivityFeed } from "../js/utils/activity-utils.js";
import { buildStudentExtras, computeRankMovement, getHeadToHeadMap, CHEER_ICONS, toMillis, DAY_MS } from "../js/utils/friend-stats-utils.js";
import { watchChatBadge } from "../js/utils/chat-utils.js";
import { getCompletedImprovementAttemptsByStudent } from "../js/utils/improvement-xp-integration.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

/* ---------------- state ---------------- */
const S = {
  q: "",
  tab: ["rank", "challenges", "friends"].includes(new URLSearchParams(location.search).get("tab")) ? new URLSearchParams(location.search).get("tab") : "rank",
  scope: "overall",       // overall | batch | friends
  period: "all",          // all | week
  batch: null,
  students: [], studentMap: {}, results: [], rows: [], extras: {}, movement: {}, overallRank: {},
  friendIds: [], incoming: [], outgoing: [], inChalls: [], outChalls: [], h2h: {},
  challengeBonusMap: {}, improvementResultsMap: {}, battleXPMap: {},
  feed: null, feedAt: 0, feedShow: 8,
  rivalId: null, q: "", rq: "", chatUnread: 0
};
const NO_BATCH = "ব্যাচ নেই";
let examsCache = null;

/* ---------------- helpers ---------------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmt = v => Math.round(num(v)).toLocaleString("en-US");
const batchOf = r => (r && r.className) || NO_BATCH;
const isFriend = id => S.friendIds.includes(id);
const me = () => student.studentId;
const svg = (inner, sw = 2.2) => `<svg class="lx-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const I = {
  up: svg(`<path d="m6 15 6-6 6 6"/>`, 3), down: svg(`<path d="m6 9 6 6 6-6"/>`, 3),
  swords: svg(`<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>`),
  refresh: svg(`<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>`)
};

function avatar(r, size = 42) {
  const inner = r?.photoURL ? `<img src="${esc(r.photoURL)}" alt="" draggable="false" onerror="this.remove()">` : "";
  return `<span class="lx-av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px">${esc((r?.name || "শ").charAt(0))}${inner}</span>`;
}
function mvChip(change) {
  if (change === null || change === undefined || change === 0) return "";
  return change > 0 ? `<span class="lx-mv up">${I.up}${change}</span>` : `<span class="lx-mv down">${I.down}${Math.abs(change)}</span>`;
}
const linkProfile = sid => sid === me() ? "profile.html" : `profile.html?sid=${encodeURIComponent(sid)}`;

/* ---------------- boot ---------------- */
(async function boot() {
  if (!student) { window.location.href = "../index.html"; return; }
  if (!(await requireStudentSession(student.studentId))) {
    localStorage.removeItem("activeStudent"); window.location.href = "../index.html"; return;
  }
  const fresh = await refreshActiveStudent(student.docId).catch(() => null);
  if (fresh) student = fresh;
  shell.innerHTML = `<div class="lx">
      ${renderStudentHeader(student, "leaderboard")}
      <div id="lxHero"></div>
      <div id="lxTabs"></div>
      <div id="lxBody"><div class="state-block"><div class="spinner"></div></div></div>
    </div>`;
  // live unread count for the "চ্যাট" tab
  try { watchChatBadge(student.studentId, b => { S.chatUnread = b.total; if (document.getElementById("lxTabs")?.firstChild) renderTabs(); }); } catch (e) { console.warn("chat badge", e); }
  try { await loadAll(); }
  catch (err) { console.error(err); document.getElementById("lxBody").innerHTML = `<div class="lx-card lx-empty">তথ্য লোড করা যায়নি। পেজ রিফ্রেশ করো।</div>`; }
})();

/* ---------------- data ---------------- */
async function loadAll() {
  S.students = await getActiveStudents();
  const id = me();
  await resolveCompletedChallenges(id).catch(e => { console.warn("resolve failed", e); return []; });

  const [results, friendIds, incoming, outgoing, outChalls, inChalls, h2h, bonus, rival, impr, battle] = await Promise.all([
    getAllApprovedResults(),
    getMyFriendIds(id).catch(() => []),
    getIncomingRequests(id).catch(() => []),
    getOutgoingRequests(id).catch(() => []),
    getOutgoingChallenges(id).catch(() => []),
    getIncomingChallenges(id).catch(() => []),
    getHeadToHeadMap(id).catch(() => ({})),
    getChallengeBonusMap().catch(() => ({})),
    getRival(id).catch(() => null),
    getCompletedImprovementAttemptsByStudent().catch(() => ({})),
    getBattleXPMap().catch(() => ({}))
  ]);
  S.results = results; S.friendIds = Array.isArray(friendIds) ? friendIds : [];
  S.incoming = incoming; S.outgoing = outgoing; S.outChalls = outChalls; S.inChalls = inChalls; S.h2h = h2h;
  S.challengeBonusMap = bonus; S.improvementResultsMap = impr; S.battleXPMap = battle;
  S.rivalId = S.friendIds.includes(rival?.rivalId) ? rival.rivalId : null;

  const rows = buildLeaderboardRows(S.results, S.students, S.challengeBonusMap, S.improvementResultsMap, S.battleXPMap);
  S.rows = rows;
  const weekAgo = Date.now() - 7 * DAY_MS;
  const old = buildLeaderboardRows(S.results.filter(r => toMillis(r.submittedAt) && toMillis(r.submittedAt) < weekAgo), S.students, S.challengeBonusMap, S.improvementResultsMap, {});
  S.movement = computeRankMovement(rows, old);
  S.extras = buildStudentExtras(S.results);
  S.overallRank = {}; rows.forEach((r, i) => { S.overallRank[r.studentId] = i + 1; });
  S.studentMap = {}; S.students.forEach(s => { S.studentMap[s.studentId] = s; });
  // post my new milestones for friends (silent, never blocks the page)
  publishMyActivity(student, { results: S.results.filter(r => r.studentId === id), xp: rows.find(r => r.studentId === id)?.totalPoints ?? null });
  if (!S.batch) S.batch = student.className || [...new Set(rows.map(batchOf))].filter(b => b !== NO_BATCH).sort()[0] || null;
  renderAll();
}
async function reload(tab) { if (tab) S.tab = tab; try { await loadAll(); } catch (e) { showToast(friendlyError(e), "error"); } }

const allChalls = () => [
  ...S.inChalls.map(c => ({ ...c, dir: "in" })),
  ...S.outChalls.map(c => ({ ...c, dir: "out" }))
];
const otherOf = c => c.dir === "in" ? c.fromStudentId : c.toStudentId;
const nameOf = id => S.studentMap[id]?.name || id;
const weeklyXP = id => num(S.extras[id]?.weeklyXP);
const pendingIncomingChalls = () => allChalls().filter(c => c.dir === "in" && c.status === "pending");

function scopeRows() {
  let rows = S.rows;
  if (S.scope === "batch") rows = rows.filter(r => batchOf(r) === S.batch);
  else if (S.scope === "friends") rows = rows.filter(r => isFriend(r.studentId) || r.studentId === me());
  if (S.period === "week") rows = [...rows].sort((a, b) => weeklyXP(b.studentId) - weeklyXP(a.studentId));
  return rows;
}

/* ---------------- render ---------------- */
function renderAll() { renderHero(); renderTabs(); renderBody(); }

function renderHero() {
  const r = S.rows.find(x => x.studentId === me());
  const rank = S.overallRank[me()];
  const top = S.rows[0];
  const pct = top && num(top.totalPoints) > 0 ? Math.min(100, Math.round(num(r?.totalPoints) / num(top.totalPoints) * 100)) : 0;
  const R = 34, C = 2 * Math.PI * R;
  const wk = weeklyXP(me()), mv = S.movement[me()], streak = num(S.extras[me()]?.streak);

  let foot;
  if (!rank) foot = "পরীক্ষা দিলেই তুমি র‍্যাঙ্কিংয়ে চলে আসবে।";
  else if (rank === 1) {
    const nx = S.rows[1];
    foot = nx ? `তুমিই শীর্ষে — দ্বিতীয়জনের চেয়ে <b>${fmt(num(r.totalPoints) - num(nx.totalPoints))}</b> XP এগিয়ে।` : "তুমিই এখন শীর্ষে।";
  } else {
    const up = S.rows[rank - 2], gap = num(up.totalPoints) - num(r.totalPoints);
    foot = gap > 0 ? `<b>#${rank - 1}</b>-এ উঠতে আর <b>${fmt(gap)}</b> XP দরকার — ${esc(up.name)}-কে ছাড়াতে হবে।` : `${esc(up.name)}-এর সাথে পয়েন্ট সমান — একটা পরীক্ষাই র‍্যাঙ্ক বদলে দেবে।`;
  }
  const chips = [
    wk > 0 ? `<span class="lx-h-chip up">এই সপ্তাহে +<b>${fmt(wk)}</b> XP</span>` : "",
    mv > 0 ? `<span class="lx-h-chip up">${I.up}<b>${mv}</b> ধাপ উপরে</span>` : mv < 0 ? `<span class="lx-h-chip down">${I.down}<b>${Math.abs(mv)}</b> ধাপ নিচে</span>` : "",
    streak >= 2 ? `<span class="lx-h-chip"><b>${streak}</b> সপ্তাহের স্ট্রিক</span>` : ""
  ].join("");

  document.getElementById("lxHero").innerHTML = `<section class="lx-hero" aria-label="তোমার র‍্যাঙ্ক">
    <div>
      <p class="lx-h-label">${avatar(student, 22)}<span>${esc(student.name)}</span></p>
      <p class="lx-h-rank">${rank ? "#" + rank : "—"}</p>
      <p class="lx-h-xp"><b>${fmt(r?.totalPoints)}</b> XP${S.rows.length ? ` · ${S.rows.length} জনের মধ্যে` : ""}</p>
      ${chips ? `<div class="lx-h-chips">${chips}</div>` : ""}
    </div>
    <div class="lx-h-seal" role="img" aria-label="শীর্ষের ${pct}%">
      <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="${R}" fill="none" stroke="rgba(243,241,234,0.12)" stroke-width="7"/>
        <circle class="lx-h-ring" id="lxRing" cx="40" cy="40" r="${R}" fill="none" stroke="#b8863c" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-c="${C.toFixed(2)}" data-pct="${pct}"/>
      </svg>
      <div class="lx-h-seal-c"><b>${pct}%</b><span>শীর্ষের</span></div>
    </div>
    <p class="lx-h-foot">${foot}</p>
  </section>`;
  const ring = document.getElementById("lxRing");
  if (ring) requestAnimationFrame(() => requestAnimationFrame(() => {
    ring.style.strokeDashoffset = (Number(ring.dataset.c) * (1 - Number(ring.dataset.pct) / 100)).toFixed(2);
  }));
}

function renderTabs() {
  const chN = pendingIncomingChalls().length, frN = S.incoming.length;

function renderBody() {

/* ---- friend activity feed ---- */
async function loadFeed(force) {
  const host = document.getElementById("afHost");
  if (!host) return;
  try {
    if (force || !S.feed || Date.now() - S.feedAt > 60000) {
      if (!S.feed) host.innerHTML = `<div class="state-block"><div class="spinner"></div></div>`;
      const real = await getFriendFeed(S.friendIds).catch(e => { console.warn("feed read failed", e); return []; });
      const local = await localExamFeed(S.friendIds, S.results).catch(() => []);
      // drop local items that a published post already covers (same friend, same exam title/sub within a minute)
      const dup = l => real.some(r => r.studentId === l.studentId && r.type === "exam" && r.sub === l.sub && r.title === l.title);
      S.feed = [...real, ...local.filter(l => !dup(l))].sort((a, b) => (b.createdMs || 0) - (a.createdMs || 0));
      S.feedAt = Date.now();
    }
    paintFeed();
  } catch (e) {
    console.warn("feed failed", e);
    host.innerHTML = `<div class="af-empty">খবর লোড করা যায়নি। একটু পরে আবার চেষ্টা করো।</div>`;
  }
}
function paintFeed() {
  const host = document.getElementById("afHost");
  if (!host || !S.feed) return;
  const ctx = { meId: me(), studentMap: S.studentMap, linkProfile };
  const shown = S.feed.slice(0, S.feedShow);
  host.innerHTML = `<div class="af-list">${activityFeedHtml(shown, ctx)}</div>` +
    (S.feed.length > S.feedShow ? `<button type="button" class="af-more" id="afMore">আরও দেখো (${S.feed.length - S.feedShow})</button>` : "");
  bindActivityFeed(host, S.feed, ctx, paintFeed);
  document.getElementById("afMore")?.addEventListener("click", () => { S.feedShow += 8; paintFeed(); });
}

/* ---- ranking ---- */
const ICO = {
  trophy: svg(`<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>`),
  trend: svg(`<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>`),
  doc: svg(`<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>`),
  target: svg(`<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>`)
};

function awardsHtml() {
  const rows = S.rows;
  const best = fn => { let b = null, bv = 0; rows.forEach(r => { const v = fn(r); if (v > bv) { bv = v; b = r; } }); return b ? { r: b, v: bv } : null; };
  const wk = best(r => weeklyXP(r.studentId));
  const up = best(r => num(S.movement[r.studentId]));
  const ex = best(r => num(S.extras[r.studentId]?.weeklyExams));
  const tiles = [
    wk && { t: "সপ্তাহের সেরা", ic: ICO.trophy, ...wk, txt: `+${fmt(wk.v)} XP` },
    up && { t: "সবচেয়ে উন্নতি", ic: ICO.trend, ...up, txt: `${up.v} ধাপ উপরে` },
    ex && { t: "বেশি পরীক্ষা", ic: ICO.doc, ...ex, txt: `${ex.v}টি পরীক্ষা` }
  ].filter(Boolean);
  if (!tiles.length) return "";
  return `<div class="lx-title">এই সপ্তাহের সেরা</div>
    <div class="lx-awards" style="grid-template-columns:repeat(${tiles.length}, minmax(0,1fr))">${tiles.map(x => `
      <div class="lx-award" data-act="go" data-id="${esc(x.r.studentId)}">
        <span class="t">${x.ic}${x.t}</span>${avatar(x.r, 34)}
        <span class="nm">${esc(x.r.name)}</span><span class="v">${x.txt}</span></div>`).join("")}</div>`;
}

function rivalHtml() {
  const rid = S.rivalId;
  if (!rid) {
    return S.friendIds.length ? `<button class="lx-rival empty" data-act="tab" data-id="friends">${I.swords} রাইভাল বানাও — বন্ধুদের তালিকা থেকে</button>` : "";
  }
  const rv = S.rows.find(r => r.studentId === rid), mine = S.rows.find(r => r.studentId === me());
  if (!rv) return "";
  const gap = num(mine?.totalPoints) - num(rv.totalPoints);
  const rec = S.h2h[rid] || { wins: 0, losses: 0, draws: 0 };
  const g = gap > 0 ? `<div class="g ahead">তুমি ${fmt(gap)} XP এগিয়ে</div>` : gap < 0 ? `<div class="g behind">তুমি ${fmt(-gap)} XP পিছিয়ে</div>` : `<div class="g even">পয়েন্ট সমান সমান</div>`;
  return `<button class="lx-rival" data-act="go" data-id="${esc(rid)}">
    ${avatar(rv, 38)}
    <div class="mid"><div class="k">তোমার রাইভাল · #${S.overallRank[rid] || "-"}</div><div class="n">${esc(rv.name)}</div>${g}</div>
    <div class="rec"><b>${rec.wins}-${rec.losses}</b>জিত-হার</div></button>`;
}

function rankListHtml() {
  const all = scopeRows();
  const val = r => S.period === "week" ? weeklyXP(r.studentId) : num(r.totalPoints);
  const q = normQ(S.rq);
  const idx = new Map(all.map((r, i) => [r.studentId, i]));
  const rows = q ? all.filter(r => normQ(r.name).includes(q) || normQ(r.studentId).includes(q)) : all;
  if (all.length === 0) return `<div class="lx-card lx-empty">কেউ নেই</div>`;
  if (rows.length === 0) return `<div class="lx-card lx-empty">পাওয়া যায়নি</div>`;

  const showPodium = !q && all.length >= 3;
  const topVal = Math.max(1, ...all.map(val));
  let out = "";

  if (showPodium) {
    const order = [1, 0, 2];
    out += `<div class="lx-podium">${order.map(i => {
      const r = all[i], mine = r.studentId === me();
      return `<div class="lx-pod p${i + 1} ${mine ? "me" : ""}" ${mine ? 'id="lxMe"' : ""} data-act="go" data-id="${esc(r.studentId)}">
        <div class="lx-pod-av">${avatar(r, i === 0 ? 58 : 48)}<span class="lx-pod-n">${i + 1}</span></div>
        <div class="lx-pod-nm">${esc(r.name)}</div>
        <div class="lx-pod-v">${fmt(val(r))}<small>XP</small></div>
        <div class="lx-pod-bar"></div></div>`;
    }).join("")}</div>`;
  }

  const list = showPodium ? rows.slice(3) : rows;
  if (list.length) {
    out += `<div class="lx-card">${list.map(r => {
      const i = idx.get(r.studentId), mine = r.studentId === me();
      const w = weeklyXP(r.studentId);
      const pct = Math.max(2, Math.round(val(r) / topVal * 100));
      const meta = [batchOf(r), r.examsTaken ? `${r.examsTaken}টি পরীক্ষা` : "", r.examsTaken ? `গড় ${Math.round(num(r.avgPercentage))}%` : ""].filter(Boolean).join(" · ");
      return `<div class="lx-row ${mine ? "me" : ""}" ${mine ? 'id="lxMe"' : ""} data-act="go" data-id="${esc(r.studentId)}">
        <span class="lx-rk">${i + 1}</span>${avatar(r, 36)}
        <div class="lx-mid"><div class="lx-nm">${esc(r.name)}${mine ? `<span class="lx-tag">তুমি</span>` : ""}</div>
          <div class="lx-sub">${esc(meta)}</div>
          <div class="lx-bar"><i style="width:${pct}%"></i></div></div>
        <div class="lx-val">${fmt(val(r))}<small>XP</small>${S.period === "all" ? mvChip(S.movement[r.studentId]) : ""}
          ${S.period === "all" && w > 0 ? `<span class="lx-wk">+${fmt(w)} এই সপ্তাহে</span>` : ""}</div></div>`;
    }).join("")}</div>`;
  }
  return out;
}
const normQ = v => String(v ?? "").trim().toLocaleLowerCase();

function viewRank() {
  const batches = [...new Set(S.rows.map(batchOf))].filter(b => b !== NO_BATCH).sort();
  const chip = (group, k, t) => `<button class="lx-chip ${S[group] === k ? "on" : ""}" data-act="${group}" data-id="${k}">${t}</button>`;

  </div>`;
}

/* ---- challenges ---- */
function viewChallenges() {
  const all = allChalls();
  const inc = all.filter(c => c.dir === "in" && c.status === "pending");
  const active = all.filter(c => c.status === "accepted");
  const sent = all.filter(c => c.dir === "out" && c.status === "pending");
  const hist = all.filter(c => c.status === "completed" || c.status === "expired")
    .sort((a, b) => (toMillis(b.resolvedAt) || toMillis(b.createdAt)) - (toMillis(a.resolvedAt) || toMillis(a.createdAt))).slice(0, 10);
  let w = 0, l = 0, d = 0;
  Object.values(S.h2h).forEach(x => { w += x.wins; l += x.losses; d += x.draws; });

  const row = (c, right) => {
    const oid = otherOf(c);
    return `<div class="lx-row" style="cursor:default">${avatar(S.studentMap[oid], 34)}
      <div style="min-width:0"><div class="lx-nm">${esc(nameOf(oid))}</div><div class="lx-sub">${esc(c.examName || "পরবর্তী পরীক্ষা")}</div></div>${right}</div>`;
  };
  const sec = (title, list) => list.length ? `<div class="lx-title">${title}</div><div class="lx-card">${list.join("")}</div>` : "";

  const out = `
    <div class="lx-top"><div class="lx-rec">জিত ${w} · হার ${l} · ড্র ${d}</div>
      <button class="lx-btn primary sm" data-act="ch-new">${I.swords} নতুন চ্যালেঞ্জ</button></div>
    ${sec("আসা চ্যালেঞ্জ", inc.map(c => row(c, `<div class="lx-acts"><button class="lx-btn ok sm" data-act="ch-accept" data-id="${c.id}">গ্রহণ</button><button class="lx-btn danger sm" data-act="ch-reject" data-id="${c.id}">বাদ</button></div>`)))}
    ${sec("চলছে", active.map(c => row(c, `<span class="lx-badge wait">চলছে</span>`)))}
    ${sec("পাঠানো", sent.map(c => row(c, `<div class="lx-acts"><span class="lx-badge">অপেক্ষমাণ</span><button class="lx-btn danger sm" data-act="ch-cancel" data-id="${c.id}">বাতিল</button></div>`)))}
    ${sec("আগের", hist.map(c => {
      if (c.status === "expired") return row(c, `<span class="lx-badge">মেয়াদ শেষ</span>`);
      const won = c.winnerStudentId === me(), lost = c.loserStudentId === me();
      return row(c, `<span class="lx-badge ${won ? "win" : lost ? "lose" : ""}">${won ? "জিত" : lost ? "হার" : "ড্র"}</span>`);
    }))}
    ${!inc.length && !active.length && !sent.length && !hist.length ? `<div class="lx-card lx-empty">কোনো চ্যালেঞ্জ নেই</div>` : ""}`;
  return `<div style="display:flex;flex-direction:column;gap:10px">${out}</div>`;
}

}

        <div class="lx-sub">${esc(f.className || "")}${rk ? ` · #${rk}` : ""}</div></div>
        <div class="lx-acts" data-stop="1"><button class="lx-btn sm" data-act="chat-with" data-id="${esc(f.studentId)}" aria-label="চ্যাট">${CHEER_ICONS.message}</button><button class="lx-btn sm" data-act="menu" data-id="${esc(f.studentId)}">আরও</button></div></div>`;

    <button class="lx-btn" data-act="ch-new" data-id="${esc(sid)}" ${busy ? "disabled" : ""}>${busy ? "চ্যালেঞ্জ চলছে" : "চ্যালেঞ্জ"}</button>
    <a class="lx-btn" href="comparison.html?friendId=${encodeURIComponent(sid)}">তুলনা</a>
    ${S.rivalId === sid ? `<button class="lx-btn" data-act="rival-clear">রাইভাল সরাও</button>` : `<button class="lx-btn" data-act="rival-set" data-id="${esc(sid)}">রাইভাল বানাও</button>`}
    <button class="lx-btn danger" data-act="fr-remove" data-id="${esc(sid)}">বন্ধুত্ব শেষ</button></div>`, false);
}

function overlay(html, center) {
  const ov = document.createElement("div");
  ov.className = "lx-ov" + (center ? " center" : ""); ov.id = "lxOv";
  ov.innerHTML = `<div class="lx-sheet">${html}</div>`;
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeOverlay(); });
  document.body.appendChild(ov);
  return ov;
}
function closeOverlay() { document.getElementById("lxOv")?.remove(); }

/* ---------------- challenge modal ---------------- */
async function openChallengeModal(preId) {
  closeOverlay();
  const friends = S.friendIds.map(id => S.studentMap[id]).filter(Boolean);
  if (!friends.length) { showToast("আগে কাউকে বন্ধু বানাও।", "error"); return; }
  const busy = new Set(allChalls().filter(c => ["pending", "accepted"].includes(c.status)).map(otherOf));
  const ov = overlay(`<div class="lx-sheet-h">নতুন চ্যালেঞ্জ</div>
    <select class="lx-sel" id="chFriend">${friends.map(f => `<option value="${esc(f.studentId)}" ${busy.has(f.studentId) ? "disabled" : ""} ${f.studentId === preId ? "selected" : ""}>${esc(f.name)}${busy.has(f.studentId) ? " (চলছে)" : ""}</option>`).join("")}</select>
    <select class="lx-sel" id="chExam"><option value="__NEXT_EXAM__">পরবর্তী পরীক্ষা</option></select>
    <div style="display:flex;gap:8px"><button class="lx-btn" style="flex:1" data-act="close">বাতিল</button>
      <button class="lx-btn primary" style="flex:1" id="chSend">পাঠাও</button></div>`, true);
  try {
    if (!examsCache) examsCache = await getUpcomingExams();
    const sel = ov.querySelector("#chExam");
    (Array.isArray(examsCache) ? examsCache : []).forEach(e => sel.insertAdjacentHTML("beforeend", `<option value="${esc(e.id)}">${esc(e.name || "পরীক্ষা")}</option>`));
  } catch {}
  const first = ov.querySelector("#chFriend");
  if (first.selectedOptions[0]?.disabled) { const ok = [...first.options].find(o => !o.disabled); if (ok) first.value = ok.value; }
  ov.querySelector("#chSend").addEventListener("click", async (e) => {
    const btn = e.currentTarget, fsel = ov.querySelector("#chFriend"), xsel = ov.querySelector("#chExam");
    if (fsel.selectedOptions[0]?.disabled) { showToast("এই বন্ধুর সাথে চ্যালেঞ্জ চলছে।", "error"); return; }
    btn.disabled = true;
    try {
      await sendChallenge({ fromStudentId: me(), toStudentId: fsel.value, examId: xsel.value,
        examName: xsel.value === "__NEXT_EXAM__" ? "পরবর্তী পরীক্ষা" : (xsel.selectedOptions[0]?.text || "পরীক্ষা") });
      showToast("চ্যালেঞ্জ পাঠানো হয়েছে", "success"); closeOverlay(); await reload("challenges");
    } catch (err) { showToast(err.message || friendlyError(err), "error"); btn.disabled = false; }
  });
}

/* ---------------- actions ---------------- */
async function run(fn, okMsg, tab) {
  try { await fn(); if (okMsg) showToast(okMsg, "success"); closeOverlay(); await reload(tab); }
  catch (err) { showToast(err.message || friendlyError(err), "error"); }
}

document.addEventListener("change", (e) => {
  if (e.target.dataset?.sel === "batch") { S.batch = e.target.value; renderBody(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "lxSearch") { S.rq = e.target.value; const l = document.getElementById("lxList"); if (l) l.innerHTML = rankListHtml(); return; }
  if (e.target.id === "frSearch") { S.q = e.target.value; const r = document.getElementById("frRes"); if (r) r.innerHTML = searchResultsHtml(); }
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  if (t.dataset.act === "go" && e.target.closest("[data-stop]")) {
    const inner = e.target.closest("[data-act]");
    if (inner === t) return;
  }
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "tab": S.tab = id; renderTabs(); renderBody(); break;
    case "scope": S.scope = id; renderBody(); break;
    case "period": S.period = id; renderBody(); break;
    case "batch": S.batch = id; renderBody(); break;
    case "go": if (!e.target.closest("[data-stop]")) window.location.href = linkProfile(id); break;
    case "menu": openMenu(id); break;
    case "close": closeOverlay(); break;
    case "ch-new": openChallengeModal(id); break;
    case "ch-accept": run(() => acceptChallenge(id, me()), "চ্যালেঞ্জ গ্রহণ করা হয়েছে", "challenges"); break;
    case "ch-reject": run(() => rejectChallenge(id, me()), "বাদ দেওয়া হয়েছে", "challenges"); break;
    case "ch-cancel": run(() => cancelChallenge(id, me()), "বাতিল করা হয়েছে", "challenges"); break;
    case "fr-add": run(() => sendFriendRequest(me(), id), "অনুরোধ পাঠানো হয়েছে"); break;
    case "fr-accept": run(() => acceptFriendRequest(id, me()), "বন্ধু যুক্ত হলো"); break;
    case "fr-reject": run(() => rejectFriendRequest(id), "বাদ দেওয়া হয়েছে"); break;
    case "fr-remove": if (confirm("এই বন্ধুকে তালিকা থেকে সরাবে?")) run(() => removeFriend(me(), id), "বন্ধুত্ব শেষ হয়েছে"); break;
    case "rival-set": run(() => setRival(me(), id), "রাইভাল ঠিক করা হয়েছে"); break;
    case "rival-clear": run(() => clearRival(me()), "রাইভাল সরানো হয়েছে"); break;
    case "jump": {
      if (S.rq) { S.rq = ""; const inp = document.getElementById("lxSearch"); if (inp) inp.value = ""; const l = document.getElementById("lxList"); if (l) l.innerHTML = rankListHtml(); }
      const el = document.getElementById("lxMe");
      if (!el) { showToast("এই তালিকায় তুমি নেই।", "error"); break; }
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.remove("lx-flash"); void el.offsetWidth; el.classList.add("lx-flash");
      break;
    }
    case "chat": window.location.href = "chat.html"; break;
    case "chat-with": window.location.href = `chat.html?with=${encodeURIComponent(id)}`; break;
  }
});
</script>
</body>
