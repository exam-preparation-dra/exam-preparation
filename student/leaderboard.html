<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">

<style>
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; }
  }

  :root {
    --color-accent-rgb: 201, 151, 63; /* matches --color-accent; not defined in style.css */
    --lb-glass: rgba(128,128,128,.075);
    --lb-glass-strong: rgba(128,128,128,.115);
    --lb-border: rgba(128,128,128,.16);
    --lb-shadow: 0 18px 55px rgba(0,0,0,.07);
    --gold: #eab308;
    --gold-deep: #b45309;
    --silver: #94a3b8;
    --bronze: #c2703d;
  }

  .num { font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  .lb-page { padding-bottom:28px; }

  .glass-float-card {
    background:var(--lb-glass);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--lb-border);
    border-radius:18px;
    box-shadow:var(--lb-shadow);
  }

  .btn-glass {
    appearance:none; border:1px solid var(--lb-border);
    background:var(--lb-glass); color:var(--text-primary);
    border-radius:11px; min-height:38px; padding:8px 12px;
    font:inherit; font-size:.76rem; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center;
    gap:7px; cursor:pointer; transition:all .18s ease;
    text-decoration:none; white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-glass:hover { background:var(--lb-glass-strong); }
  .btn-glass:active { transform:scale(.96); }
  .btn-glass:disabled { opacity:.5; cursor:not-allowed; }
  .btn-danger { color:#ef4444; border-color:rgba(239,68,68,.28); background:rgba(239,68,68,.05); }
  .btn-ok { color:#16a34a; border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.07); }

  .lb-icon { width:17px; height:17px; flex-shrink:0; }
  .hidden { display:none !important; }

  /* ===== Hero ===== */
  .lb-hero { position:relative; overflow:hidden; margin-top:16px; padding:20px; }
  .lb-kicker { display:flex; align-items:center; gap:8px; color:var(--color-accent); font-size:.75rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
  .lb-hero h1 { margin:6px 0 6px; font-size:1.6rem; line-height:1.15; font-weight:950; }
  .lb-hero p { margin:0; color:var(--text-secondary); font-size:.83rem; line-height:1.5; }
  .friend-count { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:5px 11px; border-radius:99px; font-size:.68rem; font-weight:900; color:var(--color-accent); background:rgba(var(--color-accent-rgb),.1); border:1px solid rgba(var(--color-accent-rgb),.2); }

  /* ===== Scope tabs (Total / Batch / Friends) ===== */
  .lb-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:18px; padding:5px; border-radius:16px; background:var(--lb-glass); border:1px solid var(--lb-border); }
  .lb-tab { appearance:none; border:0; background:transparent; color:var(--text-secondary); font:inherit; font-size:.78rem; font-weight:900; min-height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; transition:all .18s ease; -webkit-tap-highlight-color:transparent; }
  .lb-tab.active { background:var(--color-accent); color:#fff; box-shadow:0 6px 16px rgba(var(--color-accent-rgb),.28); }
  .lb-tab .lb-icon { width:16px; height:16px; }

  .lb-filter-row { display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; }
  .lb-filter-row::-webkit-scrollbar { display:none; }
  .filter-btn { min-height:34px; padding:6px 14px; font-size:.74rem; flex-shrink:0; border-radius:99px; }
  .filter-btn.active { background:var(--color-accent); color:#fff; border-color:var(--color-accent); box-shadow:0 4px 12px rgba(var(--color-accent-rgb),.2); }

  /* ===== Rank badge / crown / topper pills ===== */
  .rank-badge { width:28px; height:28px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-size:.78rem; font-weight:950; color:var(--text-muted); }
  .rank-badge.r1 { background:linear-gradient(135deg,#fde68a,#f59e0b); color:#78350f; box-shadow:0 3px 10px rgba(245,158,11,.45); }
  .rank-badge.r2 { background:linear-gradient(135deg,#f8fafc,#94a3b8); color:#334155; box-shadow:0 3px 10px rgba(148,163,184,.4); }
  .rank-badge.r3 { background:linear-gradient(135deg,#fed7aa,#c2703d); color:#431407; box-shadow:0 3px 10px rgba(194,112,61,.35); }

  .av-wrap { position:relative; flex:0 0 auto; }
  .av { border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--color-accent-soft); border:1px solid var(--lb-border); font-weight:900; color:var(--color-accent); }
  .av img { width:100%; height:100%; object-fit:cover; border-radius:50%; pointer-events:none; user-select:none; -webkit-user-select:none; }
  .av-crown { position:absolute; left:50%; top:-11px; transform:translateX(-50%) rotate(-8deg); width:20px; height:20px; color:var(--gold); filter:drop-shadow(0 2px 3px rgba(180,83,9,.35)); pointer-events:none; }

  .pill { display:inline-flex; align-items:center; gap:4px; border-radius:99px; padding:2px 8px; font-size:.6rem; font-weight:900; white-space:nowrap; line-height:1.5; }
  .pill svg { width:11px; height:11px; }
  .pill-topper { color:#78350f; background:linear-gradient(135deg,#fde68a,#fbbf24); border:1px solid rgba(180,83,9,.25); }
  .pill-batch { color:var(--gold-deep); background:rgba(234,179,8,.14); border:1px solid rgba(234,179,8,.3); }
  .pill-target { color:#a16207; background:rgba(234,179,8,.18); }
  .pill-streak { color:var(--color-accent); background:rgba(var(--color-accent-rgb),.1); }
  .pill-up { color:#16a34a; background:rgba(34,197,94,.1); }
  .pill-down { color:#dc2626; background:rgba(239,68,68,.1); }
  .pill-same { color:var(--text-muted); background:rgba(128,128,128,.09); }

  /* ===== Cards ===== */
  .lb-extra-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-top:16px; }
  @media (min-width:700px){ .lb-extra-grid { grid-template-columns:1.1fr .9fr; } }
  .lb-card { position:relative; overflow:hidden; background:linear-gradient(145deg,rgba(128,128,128,.09),rgba(128,128,128,.025)); border:1px solid var(--lb-border); border-radius:18px; padding:15px; }
  .lb-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .lb-card-title { display:flex; align-items:center; gap:7px; font-size:.84rem; font-weight:950; min-width:0; }
  .lb-card-title svg { color:var(--gold); flex-shrink:0; }
  .lb-card-sub { font-size:.62rem; color:var(--text-muted); font-weight:700; text-align:right; }

  /* Podium */
  .podium { display:grid; grid-template-columns:1fr 1.15fr 1fr; align-items:end; gap:8px; }
  .podium.two { grid-template-columns:1fr 1fr; }
  .podium.one { grid-template-columns:1fr; max-width:180px; margin:0 auto; }
  .pod { text-align:center; padding:16px 6px 11px; border:1px solid var(--lb-border); background:rgba(128,128,128,.055); border-radius:16px 16px 11px 11px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .pod.first { padding-top:20px; padding-bottom:16px; background:linear-gradient(180deg,rgba(234,179,8,.16),rgba(234,179,8,.04)); border-color:rgba(234,179,8,.4); }
  .pod.me { box-shadow:inset 0 0 0 1.5px rgba(var(--color-accent-rgb),.5); }
  .pod-name { font-size:.72rem; font-weight:900; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pod-points { font-family:var(--font-num); font-size:.72rem; color:var(--color-accent); font-weight:950; }
  .pod .pill { margin-top:1px; }

  /* Batch toppers strip */
  .topper-strip { display:flex; gap:10px; overflow-x:auto; padding:4px 2px 6px; scrollbar-width:none; }
  .topper-strip::-webkit-scrollbar { display:none; }
  .topper-card { flex:0 0 auto; width:150px; padding:12px; border-radius:16px; border:1px solid rgba(234,179,8,.3); background:linear-gradient(160deg,rgba(234,179,8,.12),rgba(234,179,8,.02)); display:flex; flex-direction:column; gap:8px; }
  .topper-card.me { border-color:rgba(var(--color-accent-rgb),.55); }
  .topper-batch { font-size:.62rem; font-weight:900; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topper-who { display:flex; align-items:center; gap:9px; min-width:0; }
  .topper-name { font-size:.78rem; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topper-pts { font-family:var(--font-num); font-size:.68rem; font-weight:900; color:var(--color-accent); }

  /* Target / highlight */
  .target-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .target-name { font-size:.9rem; font-weight:950; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .target-gap { margin-top:4px; font-size:.68rem; color:var(--text-muted); font-weight:700; line-height:1.5; }
  .target-score { text-align:right; flex-shrink:0; }
  .target-score strong { display:block; font-family:var(--font-num); font-size:1.05rem; color:var(--color-accent); }
  .target-score span { display:block; font-size:.58rem; color:var(--text-muted); margin-top:2px; }
  .target-bar { height:7px; margin-top:12px; border-radius:99px; background:rgba(128,128,128,.13); overflow:hidden; }
  .target-bar i { display:block; height:100%; border-radius:99px; background:var(--color-accent); transition:width .45s ease; }
  .hl-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
  .hl { padding:11px; border-radius:14px; background:var(--lb-glass); border:1px solid var(--lb-border); min-width:0; }
  .hl small { display:block; color:var(--text-muted); font-size:.58rem; font-weight:750; }
  .hl strong { display:flex; align-items:center; gap:5px; margin-top:5px; font-size:.8rem; font-weight:950; }

  /* ===== Ranking list ===== */
  .lb-section { margin-top:18px; }
  .lb-section-title { display:flex; align-items:center; gap:8px; font-size:1.02rem; font-weight:950; margin-bottom:10px; }
  .lb-list-card { padding:8px; }
  .lb-row { display:flex; align-items:center; gap:11px; padding:14px 10px; border-bottom:1px dashed rgba(128,128,128,.15); }
  .lb-row:last-child { border-bottom:none; }
  .lb-row.tappable { cursor:pointer; }
  .lb-row.is-top { background:linear-gradient(135deg,rgba(234,179,8,.13),rgba(234,179,8,.02)); border:1px solid rgba(234,179,8,.32); border-radius:14px; margin:4px 0; }
  .lb-row.is-me { margin:4px 0; border:1px solid rgba(234,179,8,.3); border-radius:14px; background:linear-gradient(135deg,#fefce8,#fef08a); }
  .lb-row.is-me .lb-name { color:#713f12; }
  .lb-row.is-me .points-pill { color:#713f12; background:rgba(113,63,18,.1); border:1px solid rgba(113,63,18,.15); }
  .lb-main { flex:1; min-width:0; }
  .lb-name { font-size:.88rem; font-weight:900; margin:0 0 5px; display:flex; align-items:center; flex-wrap:wrap; gap:5px; }
  .lb-name-text { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-sub { font-size:.62rem; color:var(--text-muted); font-weight:700; margin:-2px 0 5px; }
  .points-pill { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:3px 10px; background:rgba(128,128,128,.1); color:var(--text-secondary); font-size:.68rem; font-weight:900; }
  .lb-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .action-btn { width:38px; min-height:38px; height:38px; padding:0; border-radius:50%; }
  .text-action { min-height:34px; padding:6px 12px; font-size:.7rem; border-radius:99px; }

  /* ===== Friend requests / challenge cards ===== */
  .req-card { margin-top:14px; padding:14px 16px; }
  .req-head { display:flex; align-items:center; gap:7px; font-size:.86rem; font-weight:950; margin-bottom:6px; }
  .req-row { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px dashed var(--surface-border); }
  .req-row:last-child { border-bottom:none; }

  /* ===== Weekly race ===== */
  .race-row { display:flex; align-items:center; gap:10px; padding:7px 0; }
  .race-name { width:82px; flex-shrink:0; font-size:.72rem; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .race-bar { flex:1; height:10px; border-radius:99px; background:rgba(128,128,128,.13); overflow:hidden; }
  .race-bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--color-accent),#f59e0b); transition:width .5s ease; }
  .race-val { width:52px; text-align:right; font-family:var(--font-num); font-size:.72rem; font-weight:950; }

  /* ===== Live feed ===== */
  .live-section { margin-top:20px; }
  .live-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .live-title { display:flex; align-items:center; gap:8px; font-size:.9rem; font-weight:950; }
  .live-status { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:5px 9px; background:rgba(34,197,94,.08); color:#16a34a; font-size:.65rem; font-weight:900; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:livePulse 1.5s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { opacity:.45; transform:scale(.82); } 50% { opacity:1; transform:scale(1.12); } }
  .live-slider { overflow:hidden; position:relative; min-height:110px; border-radius:18px; border:1px solid var(--lb-border); background:linear-gradient(135deg,rgba(128,128,128,.08),rgba(128,128,128,.02)); }
  .live-track { display:flex; width:100%; transition:transform .55s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  .live-card { min-width:100%; box-sizing:border-box; padding:16px; }
  .live-card-inner { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; }
  .live-name { font-size:.85rem; line-height:1.3; font-weight:950; }
  .live-exam { margin-top:4px; color:var(--text-muted); font-size:.7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
  .live-stat { min-width:0; padding:10px 6px; border-radius:12px; background:rgba(128,128,128,.05); border:1px solid rgba(128,128,128,.08); text-align:center; }
  .live-stat b { display:block; font-size:.9rem; font-weight:900; }
  .live-stat-label { display:block; margin-top:2px; color:var(--text-muted); font-size:.55rem; }
  .live-time { margin-top:10px; color:var(--text-muted); font-size:.6rem; text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:4px; }

  /* ===== Modals / friend sheet ===== */
  .modal-overlay { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .challenge-modal { width:100%; max-width:420px; padding:24px; background:#fffdf6; border:1px solid rgba(0,0,0,.08); border-radius:20px; }
  .challenge-select { width:100%; box-sizing:border-box; padding:14px; border-radius:12px; border:1px solid var(--surface-border); background:rgba(128,128,128,.05); color:var(--text-primary); font:inherit; font-size:.85rem; font-weight:700; }

  .sheet-overlay { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s ease; }
  .sheet { width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background:#fffdf6; border-radius:24px 24px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px)); animation:sheetUp .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -12px 50px rgba(0,0,0,.25); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes sheetUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .sheet-grab { width:42px; height:4px; border-radius:99px; background:rgba(128,128,128,.35); margin:0 auto 14px; }
  .sheet-top { display:flex; align-items:center; gap:14px; }
  .sheet-name { font-size:1.15rem; font-weight:950; line-height:1.2; }
  .sheet-close { margin-left:auto; align-self:flex-start; width:36px; min-height:36px; height:36px; padding:0; border-radius:50%; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-box { padding:11px 6px; border-radius:14px; text-align:center; background:var(--lb-glass); border:1px solid var(--lb-border); min-width:0; }
  .stat-box b { display:block; font-family:var(--font-num); font-size:1.02rem; font-weight:950; }
  .stat-box small { display:block; margin-top:3px; font-size:.58rem; font-weight:700; color:var(--text-muted); }
  .sheet-block { margin-top:16px; padding:14px; border-radius:16px; background:var(--lb-glass); border:1px solid var(--lb-border); }
  .sheet-block h4 { margin:0 0 10px; font-size:.8rem; font-weight:950; display:flex; align-items:center; gap:7px; }
  .vs-row { margin-top:9px; }
  .vs-labels { display:flex; justify-content:space-between; font-size:.64rem; font-weight:800; color:var(--text-muted); margin-bottom:4px; }
  .vs-labels b { color:var(--text-primary); font-family:var(--font-num); }
  .vs-bar { display:flex; height:9px; border-radius:99px; overflow:hidden; background:rgba(128,128,128,.13); }
  .vs-bar i { display:block; height:100%; }
  .vs-me { background:var(--color-accent); }
  .vs-fr { background:#64748b; }
  .h2h { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .h2h div { padding:10px 4px; border-radius:12px; background:rgba(128,128,128,.06); }
  .h2h b { display:block; font-family:var(--font-num); font-size:1.15rem; font-weight:950; }
  .h2h small { font-size:.6rem; font-weight:800; color:var(--text-muted); }
  .spark { display:flex; align-items:flex-end; justify-content:center; gap:7px; height:74px; }
  .spark-col { flex:1; max-width:56px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; min-width:0; }
  .spark-bar { width:100%; border-radius:7px 7px 3px 3px; background:linear-gradient(180deg,var(--color-accent),rgba(var(--color-accent-rgb),.45)); min-height:4px; }
  .spark-col span { font-family:var(--font-num); font-size:.58rem; font-weight:900; color:var(--text-secondary); }
  .sheet-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; }
  .sheet-actions .full { grid-column:1 / -1; }
  .empty-note { padding:20px 10px; text-align:center; font-size:.78rem; color:var(--text-muted); font-weight:700; }

  @media (max-width:480px){
    .lb-row { gap:9px; padding:12px 8px; }
    .podium { gap:5px; }
    .race-name { width:70px; }
  }
</style>
</head>

<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Friend detail sheet -->
<div id="friendSheet" class="sheet-overlay hidden"><div class="sheet" id="friendSheetBody"></div></div>

<!-- Challenge Modal -->
<div id="challengeModal" class="modal-overlay" style="display:none;">
  <div class="challenge-modal">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/></svg>
      <h3 style="font-size:1.15rem; font-weight:900; color:var(--text-primary); margin:0;">বন্ধুকে চ্যালেঞ্জ করো</h3>
    </div>
    <p style="color:var(--text-muted); font-size:0.8rem; line-height:1.5; margin:0 0 14px;">একটি আসন্ন পরীক্ষা বেছে নিয়ে বন্ধুকে চ্যালেঞ্জ পাঠাও। জিতলে পাবে <span style="color:#b45309; font-weight:900;">+100 পয়েন্ট</span>।</p>

    <div id="challengeModalBody"><div class="spinner"></div></div>

    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn-glass" id="closeChallengeModal" style="flex:1;">বাতিল</button>
      <button class="btn-glass btn-danger" id="confirmChallengeBtn" style="flex:1; display:none;">চ্যালেঞ্জ পাঠাও</button>
    </div>
  </div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { buildLeaderboardRows, getUpcomingExams, getAllApprovedResults } from "../js/utils/results-utils.js";
import { getMyFriendIds, getIncomingRequests, getOutgoingRequests, sendFriendRequest, acceptFriendRequest, rejectFriendRequest, removeFriend, MAX_FRIENDS } from "../js/utils/friend-utils.js";
import { getIncomingChallenges, getOutgoingChallenges, sendChallenge, acceptChallenge, rejectChallenge, resolveCompletedChallenges, getChallengeBonusMap } from "../js/utils/challenge-utils.js";
import { buildStudentExtras, computeRankMovement, getHeadToHeadMap, toMillis, DAY_MS } from "../js/utils/friend-stats-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

/* ---------------- state ---------------- */
const S = {
  scope: "overall",          // "overall" | "batch" | "friends"
  batch: null,               // selected batch in "batch" scope
  students: [],
  results: [],
  rows: [],                  // leaderboard rows, best first
  extras: {},                // weekly XP / streak / recent scores per student
  movement: {},              // rank change vs 7 days ago (null = new)
  overallRank: {},
  batchRank: {},
  batchTop: {},              // { batchName: row }
  friendIds: [],
  incoming: [],
  outgoing: [],
  outChalls: [],
  h2h: {},
  challengeBonusMap: {},
  studentMap: {}
};
let upcomingExamsCache = null;
let selectedFriendIdForChallenge = null;
let openFriendId = null;

let liveActivities = [];
let liveActivityIndex = 0;
let liveActivityTimer = null;
let refreshTimer = null;

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(async fresh => {
    if (fresh) student = fresh;
    await handleIncomingFriendLink().catch(() => {});
    render();
  });
}

/* ---------------- helpers ---------------- */
const NO_BATCH = "ব্যাচ নেই";

function escapeHtml(value) {
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
const safeNum = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const batchOf = r => (r && r.className) || NO_BATCH;
const isFriend = id => S.friendIds.includes(id);

function relativeTime(value) {
  const ms = toMillis(value);
  if (!ms) return "এইমাত্র";
  const diff = Math.max(0, Date.now() - ms);
  const min = Math.floor(diff / 60000);
  if (min < 1) return "এইমাত্র";
  if (min < 60) return `${min} মিনিট আগে`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour} ঘণ্টা আগে`;
  const day = Math.floor(hour / 24);
  if (day < 30) return `${day} দিন আগে`;
  return `${Math.floor(day / 30)} মাস আগে`;
}

/* Icons: plain SVG, no emoji anywhere. */
const svg = (inner, cls = "lb-icon", sw = 2.2) =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON = {
  crown:  `<svg class="av-crown" viewBox="0 0 24 24" fill="currentColor" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`,
  crownSm: `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`,
  trophy: svg(`<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>`),
  users:  svg(`<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`),
  userPlus: svg(`<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>`),
  layers: svg(`<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>`),
  chart:  svg(`<path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>`),
  swords: svg(`<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>`, "lb-icon", 2.4),
  flame:  svg(`<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>`),
  up:     svg(`<path d="m6 15 6-6 6 6"/>`, "lb-icon", 3),
  down:   svg(`<path d="m6 9 6 6 6-6"/>`, "lb-icon", 3),
  minus:  svg(`<path d="M5 12h14"/>`, "lb-icon", 3),
  check:  svg(`<path d="m5 12 4 4L19 6"/>`, "lb-icon", 3),
  close:  svg(`<path d="M18 6 6 18M6 6l12 12"/>`, "lb-icon", 2.6),
  clock:  svg(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`),
  target: svg(`<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>`),
  chevron: svg(`<path d="m9 6 6 6-6 6"/>`, "lb-icon", 2.6),
  activity: svg(`<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>`),
  userMinus: svg(`<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/>`)
};

function avatar(r, size = 44, crown = false) {
  const inner = r?.photoURL
    ? `<img src="${escapeHtml(r.photoURL)}" alt="" draggable="false" oncontextmenu="return false">`
    : escapeHtml((r?.name || "শ").charAt(0));
  return `<span class="av-wrap"><span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px;">${inner}</span>${crown ? ICON.crown : ""}</span>`;
}

function rankBadge(n) {
  return `<span class="rank-badge ${n <= 3 ? "r" + n : ""}">${n}</span>`;
}

function movementChip(change) {
  if (change === null || change === undefined) return "";
  if (change > 0) return `<span class="pill pill-up">${ICON.up}${change}</span>`;
  if (change < 0) return `<span class="pill pill-down">${ICON.down}${Math.abs(change)}</span>`;
  return "";
}

/* ---------------- data ---------------- */
function computeDerived() {
  const rows = buildLeaderboardRows(S.results, S.students, S.challengeBonusMap);
  S.rows = rows;

  const weekAgo = Date.now() - 7 * DAY_MS;
  const oldRows = buildLeaderboardRows(S.results.filter(r => toMillis(r.submittedAt) && toMillis(r.submittedAt) < weekAgo), S.students, S.challengeBonusMap);
  S.movement = computeRankMovement(rows, oldRows);
  S.extras = buildStudentExtras(S.results);

  S.overallRank = {}; S.batchRank = {}; S.batchTop = {};
  const seen = {};
  rows.forEach((r, i) => {
    S.overallRank[r.studentId] = i + 1;
    const b = batchOf(r);
    seen[b] = (seen[b] || 0) + 1;
    S.batchRank[r.studentId] = seen[b];
    if (seen[b] === 1 && safeNum(r.totalPoints) > 0) S.batchTop[b] = r;
  });

  S.studentMap = {};
  S.students.forEach(s => { S.studentMap[s.studentId] = s; });
}

async function loadAll({ soft = false } = {}) {
  const students = await getActiveStudents();
  S.students = students;

  const id = student.studentId;

  // Settle any of MY challenges whose exam results are both in now, so
  // win/loss + bonus XP stop sitting stuck on "accepted" forever.
  await resolveCompletedChallenges(id).catch(() => []);

  const [results, friendIds, incoming, outgoing, outChalls, h2h, challengeBonusMap] = await Promise.all([
    getAllApprovedResults(),
    getMyFriendIds(id),
    getIncomingRequests(id).catch(() => []),
    getOutgoingRequests(id).catch(() => []),
    getOutgoingChallenges(id).catch(() => []),
    getHeadToHeadMap(id).catch(() => ({})),
    getChallengeBonusMap().catch(() => ({}))
  ]);

  S.results = results;
  S.friendIds = Array.isArray(friendIds) ? friendIds : [];
  S.incoming = incoming; S.outgoing = outgoing; S.outChalls = outChalls; S.h2h = h2h;
  S.challengeBonusMap = challengeBonusMap;

  computeDerived();

  if (!S.batch) {
    const mine = S.rows.find(r => r.studentId === id);
    const batches = allBatches();
    S.batch = (mine && batchOf(mine) !== NO_BATCH ? batchOf(mine) : null) || student.className || batches[0] || null;
  }
  renderAll();
  await renderIncomingChallenges();
}

function allBatches() {
  return [...new Set(S.rows.map(batchOf))].filter(b => b !== NO_BATCH).sort();
}

function scopeRows() {
  if (S.scope === "batch") return S.rows.filter(r => batchOf(r) === S.batch);
  if (S.scope === "friends") return S.rows.filter(r => isFriend(r.studentId) || r.studentId === student.studentId);
  return S.rows;
}

/* ---------------- render: page skeleton ---------------- */
function render() {
  shell.innerHTML = `
    <div class="lb-page">
      ${renderStudentHeader(student, "leaderboard")}

      <section class="glass-float-card lb-hero">
        <div class="lb-kicker">${ICON.trophy} স্টুডেন্ট পারফরম্যান্স</div>
        <h1>লিডারবোর্ড</h1>
        <p>সর্বমোট, ব্যাচ অনুযায়ী আর বন্ধুদের মধ্যে — কে কোথায় আছে এক জায়গায় দেখো।</p>
        <div class="friend-count" id="friendCount"></div>
      </section>

      <div id="friendLinkCard"></div>
      <div id="requestsCard"></div>
      <div id="incomingChallengesCard"></div>

      <div class="lb-tabs" id="scopeTabs"></div>
      <div class="lb-filter-row hidden" id="batchChips"></div>

      <div id="topperStrip"></div>
      <div id="lbHighlights" class="lb-extra-grid"></div>
      <div id="weeklyRace"></div>

      <section class="lb-section">
        <div class="lb-section-title" id="listTitle"></div>
        <div class="glass-float-card lb-list-card"><div id="leaderboardList"><div class="spinner" style="margin:24px auto;"></div></div></div>
      </section>

      <section class="live-section">
        <div class="live-head">
          <div class="live-title">${ICON.activity} বন্ধুদের লাইভ আপডেট</div>
          <span class="live-status"><span class="live-dot"></span>LIVE SYNC</span>
        </div>
        <div class="live-slider"><div class="live-track" id="liveActivityTrack">
          <div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.8rem; width:100%;">বন্ধুদের ফলাফল খোঁজা হচ্ছে...</div>
        </div></div>
      </section>
    </div>
  `;

  document.getElementById("closeChallengeModal").addEventListener("click", () => {
    document.getElementById("challengeModal").style.display = "none";
    selectedFriendIdForChallenge = null;
  });
  document.getElementById("friendSheet").addEventListener("click", e => { if (e.target.id === "friendSheet") closeFriendSheet(); });

  loadAll().catch(err => {
    console.error(err);
    showToast(friendlyError(err), "error");
    renderState(document.getElementById("leaderboardList"), "error", "লিডারবোর্ড লোড করা যায়নি।");
  });

  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (document.hidden) return;
    loadAll({ soft: true }).catch(err => console.warn("Background refresh failed:", err));
  }, 45000);
}

function renderAll() {
  renderHeroCount();
  renderFriendLinkCard();
  renderRequests();
  renderTabs();
  renderToppers();
  renderHighlights();
  renderWeeklyRace();
  renderList();
  renderLive();
  if (openFriendId) renderFriendSheet(openFriendId);
}

function renderHeroCount() {
  const el = document.getElementById("friendCount");
  if (el) el.innerHTML = `${ICON.users} বন্ধু ${S.friendIds.length}/${MAX_FRIENDS}`;
}

/* ---------------- scope tabs ---------------- */
function renderTabs() {
  const tabs = document.getElementById("scopeTabs");
  const chips = document.getElementById("batchChips");
  if (!tabs) return;

  const defs = [
    { key: "overall", label: "সর্বমোট", icon: ICON.trophy },
    { key: "batch",   label: "ব্যাচ",   icon: ICON.layers },
    { key: "friends", label: "বন্ধুরা", icon: ICON.users }
  ];
  tabs.innerHTML = defs.map(d => `<button type="button" class="lb-tab ${S.scope === d.key ? "active" : ""}" data-scope="${d.key}">${d.icon}${d.label}</button>`).join("");
  tabs.querySelectorAll(".lb-tab").forEach(b => b.addEventListener("click", () => {
    S.scope = b.dataset.scope;
    renderTabs(); renderToppers(); renderHighlights(); renderWeeklyRace(); renderList();
  }));

  if (S.scope === "batch") {
    const batches = allBatches();
    chips.classList.remove("hidden");
    chips.innerHTML = batches.length
      ? batches.map(b => `<button type="button" class="btn-glass filter-btn ${S.batch === b ? "active" : ""}" data-batch="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join("")
      : `<span style="font-size:.75rem; color:var(--text-muted); font-weight:700;">কোনো ব্যাচ পাওয়া যায়নি।</span>`;
    chips.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      S.batch = b.dataset.batch;
      renderTabs(); renderToppers(); renderHighlights(); renderList();
    }));
  } else {
    chips.classList.add("hidden");
  }
}

/* ---------------- toppers: podium + batch toppers ---------------- */
function scopeLabels() {
  if (S.scope === "batch") return { podium: `${S.batch || "ব্যাচ"} — সেরা ৩`, top: "ব্যাচ টপার", list: `${S.batch || "ব্যাচ"} র‍্যাঙ্কিং` };
  if (S.scope === "friends") return { podium: "বন্ধুদের মধ্যে সেরা ৩", top: "বন্ধুদের সেরা", list: "বন্ধুদের র‍্যাঙ্কিং" };
  return { podium: "সর্বমোট সেরা ৩", top: "সেরা টপার", list: "সর্বমোট র‍্যাঙ্কিং" };
}

function renderToppers() {
  const el = document.getElementById("topperStrip");
  if (!el) return;

  const rows = scopeRows().filter(r => safeNum(r.totalPoints) > 0 || safeNum(r.examsTaken) > 0);
  const labels = scopeLabels();
  const top3 = rows.slice(0, 3);
  if (!top3.length) { el.innerHTML = ""; return; }

  const order = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;
  const cls = top3.length === 3 ? "" : top3.length === 2 ? "two" : "one";

  const podium = `
    <section class="lb-card" style="margin-top:16px;">
      <div class="lb-card-head">
        <div class="lb-card-title">${ICON.crownSm.replace("<svg", '<svg width="18" height="18"')}${escapeHtml(labels.podium)}</div>
        <span class="lb-card-sub">পয়েন্ট অনুযায়ী</span>
      </div>
      <div class="podium ${cls}">
        ${order.map(r => {
          const pos = top3.indexOf(r) + 1;
          const me = r.studentId === student.studentId;
          return `
            <div class="pod ${pos === 1 ? "first" : ""} ${me ? "me" : ""}">
              ${rankBadge(pos)}
              ${avatar(r, pos === 1 ? 54 : 44, pos === 1)}
              <div class="pod-name">${escapeHtml(r.name || r.studentId)}${me ? " (তুমি)" : ""}</div>
              <div class="pod-points">${safeNum(r.totalPoints)} pts</div>
              ${pos === 1 ? `<span class="pill pill-topper">${ICON.crownSm}${escapeHtml(labels.top)}</span>` : ""}
            </div>`;
        }).join("")}
      </div>
    </section>`;

  let strip = "";
  if (S.scope === "overall") {
    const tops = Object.entries(S.batchTop);
    if (tops.length > 1) {
      strip = `
        <section class="lb-card" style="margin-top:12px;">
          <div class="lb-card-head">
            <div class="lb-card-title">${ICON.layers}ব্যাচ টপারস</div>
            <span class="lb-card-sub">প্রতি ব্যাচের সেরা</span>
          </div>
          <div class="topper-strip">
            ${tops.map(([batch, r]) => `
              <div class="topper-card ${r.studentId === student.studentId ? "me" : ""}">
                <div class="topper-batch">${escapeHtml(batch)}</div>
                <div class="topper-who">
                  ${avatar(r, 38, true)}
                  <div style="min-width:0;">
                    <div class="topper-name">${escapeHtml(r.name || r.studentId)}</div>
                    <div class="topper-pts">${safeNum(r.totalPoints)} pts</div>
                  </div>
                </div>
              </div>`).join("")}
          </div>
        </section>`;
    }
  }

  el.innerHTML = podium + strip;
}

/* ---------------- my position card ---------------- */
function renderHighlights() {
  const el = document.getElementById("lbHighlights");
  if (!el) return;

  const rows = scopeRows();
  const myPos = rows.findIndex(r => r.studentId === student.studentId);
  const me = myPos >= 0 ? rows[myPos] : null;
  const target = myPos > 0 ? rows[myPos - 1] : null;
  const ex = S.extras[student.studentId] || { streak: 0, weeklyXP: 0 };

  if (!rows.length) { el.innerHTML = ""; return; }

  const gap = target && me ? Math.max(0, safeNum(target.totalPoints) - safeNum(me.totalPoints)) : 0;
  const progress = target && me && safeNum(target.totalPoints) > 0
    ? Math.min(100, Math.max(8, safeNum(me.totalPoints) / safeNum(target.totalPoints) * 100)) : 0;

  const mv = S.movement[student.studentId];
  const mvHtml = mv === null || mv === undefined ? `<span style="color:var(--text-muted);">নতুন</span>`
    : mv > 0 ? `<span style="color:#16a34a; display:flex; align-items:center; gap:3px;">${ICON.up}${mv} ধাপ</span>`
    : mv < 0 ? `<span style="color:#dc2626; display:flex; align-items:center; gap:3px;">${ICON.down}${Math.abs(mv)} ধাপ</span>`
    : `<span style="color:var(--text-muted); display:flex; align-items:center; gap:3px;">${ICON.minus}অপরিবর্তিত</span>`;

  let body;
  if (!me) {
    body = `<div class="target-name">${S.scope === "batch" ? "তুমি এই ব্যাচে নেই" : "র‍্যাঙ্ক পাওয়া যায়নি"}</div>
            <div class="target-gap">${S.scope === "batch" ? "নিজের ব্যাচ বেছে নিলে তোমার অবস্থান দেখা যাবে।" : "পরীক্ষা দিলে এখানে তোমার অবস্থান দেখা যাবে।"}</div>`;
  } else if (target) {
    body = `
      <div class="target-row">
        <div style="min-width:0;">
          <div class="target-name">${escapeHtml(target.name || target.studentId)}</div>
          <div class="target-gap">আরও <b>${gap}</b> পয়েন্ট পেলে এই র‍্যাঙ্কে পৌঁছাবে।</div>
        </div>
        <div class="target-score"><strong>${safeNum(me.totalPoints)}</strong><span>তোমার পয়েন্ট</span></div>
      </div>
      <div class="target-bar"><i style="width:${progress}%"></i></div>`;
  } else {
    body = `<div class="target-name">তুমি এই তালিকার সবার উপরে</div>
            <div class="target-gap">${safeNum(me.totalPoints)} পয়েন্ট নিয়ে শীর্ষে আছো।</div>`;
  }

  el.innerHTML = `
    <section class="lb-card">
      <div class="lb-card-head">
        <div class="lb-card-title">${ICON.target}${target ? "পরের টার্গেট" : "তোমার অবস্থান"}</div>
        <span class="lb-card-sub">${me ? `${myPos + 1} নম্বর` : "—"}</span>
      </div>
      ${body}
      <div class="hl-grid">
        <div class="hl"><small>গত ৭ দিনে র‍্যাঙ্ক</small><strong>${mvHtml}</strong></div>
        <div class="hl"><small>সাপ্তাহিক স্ট্রিক</small><strong style="color:var(--color-accent);">${ICON.flame}${ex.streak} সপ্তাহ</strong></div>
      </div>
    </section>`;
}

/* ---------------- weekly race (friends) ---------------- */
function renderWeeklyRace() {
  const el = document.getElementById("weeklyRace");
  if (!el) return;
  if (S.scope !== "friends") { el.innerHTML = ""; return; }

  const people = S.rows.filter(r => isFriend(r.studentId) || r.studentId === student.studentId)
    .map(r => ({ r, xp: (S.extras[r.studentId]?.weeklyXP) || 0 }))
    .sort((a, b) => b.xp - a.xp);

  if (people.length < 2) {
    el.innerHTML = `
      <section class="lb-card" style="margin-top:12px;">
        <div class="lb-card-head"><div class="lb-card-title">${ICON.flame}সাপ্তাহিক রেস</div></div>
        <div class="empty-note">বন্ধু যোগ করলে এখানে এই সপ্তাহে কে বেশি পয়েন্ট পেল তা দেখা যাবে।</div>
      </section>`;
    return;
  }

  const max = Math.max(1, ...people.map(p => p.xp));
  const leader = people[0].xp > 0 ? people[0] : null;

  el.innerHTML = `
    <section class="lb-card" style="margin-top:12px;">
      <div class="lb-card-head">
        <div class="lb-card-title">${ICON.flame}সাপ্তাহিক রেস</div>
        <span class="lb-card-sub">সোমবার থেকে এই পর্যন্ত</span>
      </div>
      ${leader ? `<div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;"><span class="pill pill-topper">${ICON.crownSm}সপ্তাহের সেরা</span><b style="font-size:.78rem;">${escapeHtml(leader.r.name || leader.r.studentId)}${leader.r.studentId === student.studentId ? " (তুমি)" : ""}</b></div>` : ""}
      ${people.map(p => `
        <div class="race-row">
          <div class="race-name">${escapeHtml(p.r.studentId === student.studentId ? "তুমি" : (p.r.name || p.r.studentId))}</div>
          <div class="race-bar"><i style="width:${p.xp > 0 ? Math.max(4, Math.round(p.xp / max * 100)) : 0}%"></i></div>
          <div class="race-val">+${p.xp}</div>
        </div>`).join("")}
      ${leader ? "" : `<div class="empty-note" style="padding:10px 0 0;">এই সপ্তাহে এখনো কেউ পরীক্ষা দেয়নি।</div>`}
    </section>`;
}

/* ---------------- ranking list ---------------- */
function renderList() {
  const el = document.getElementById("leaderboardList");
  const title = document.getElementById("listTitle");
  if (!el) return;

  const labels = scopeLabels();
  if (title) title.innerHTML = `${ICON.trophy}${escapeHtml(labels.list)}`;

  const rows = scopeRows();
  if (!rows.length) {
    renderState(el, "empty", S.scope === "friends" ? "এখনো কোনো বন্ধু নেই। সর্বমোট তালিকা থেকে বন্ধু যোগ করো।" : "এখনো কোনো রেজাল্ট নেই।");
    return;
  }

  const pendingTo = new Set(S.outgoing.map(r => r.toStudentId));
  const challenged = new Set(S.outChalls.filter(c => c.status === "pending").map(c => c.toStudentId));
  const incomingFrom = new Set(S.incoming.map(r => r.fromStudentId));
  const myIndex = rows.findIndex(r => r.studentId === student.studentId);

  el.innerHTML = rows.map((r, i) => {
    const me = r.studentId === student.studentId;
    const friend = isFriend(r.studentId);
    const pos = i + 1;
    const hasPoints = safeNum(r.totalPoints) > 0;
    const isScopeTop = pos === 1 && hasPoints;
    const isBatchTop = hasPoints && S.batchRank[r.studentId] === 1;
    const ex = S.extras[r.studentId];
    const isTarget = !me && myIndex > 0 && i === myIndex - 1 && S.scope !== "friends";

    const pills = [];
    if (me) pills.push(`<span class="pill pill-same">তুমি</span>`);
    if (isScopeTop) pills.push(`<span class="pill pill-topper">${ICON.crownSm}${escapeHtml(labels.top)}</span>`);
    else if (isBatchTop && S.scope !== "batch") pills.push(`<span class="pill pill-batch">${ICON.crownSm}ব্যাচ টপার</span>`);
    if (isTarget) pills.push(`<span class="pill pill-target">${ICON.target}টার্গেট</span>`);
    const mv = movementChip(S.movement[r.studentId]);
    if (mv) pills.push(mv);
    if (ex && ex.streak >= 2) pills.push(`<span class="pill pill-streak">${ICON.flame}${ex.streak} সপ্তাহ</span>`);

    let actions = "";
    if (!me) {
      if (friend) {
        actions = `<button type="button" class="btn-glass action-btn open-friend" data-id="${escapeHtml(r.studentId)}" title="বিস্তারিত">${ICON.chevron}</button>`;
      } else if (pendingTo.has(r.studentId)) {
        actions = `<span class="btn-glass text-action" style="color:var(--text-muted); cursor:default;">পাঠানো</span>`;
      } else if (incomingFrom.has(r.studentId)) {
        actions = `<span class="btn-glass text-action" style="color:var(--color-accent); cursor:default;">অনুরোধ এসেছে</span>`;
      } else {
        actions = `<button type="button" class="btn-glass text-action add-friend-btn" data-id="${escapeHtml(r.studentId)}">${ICON.userPlus}বন্ধু</button>`;
      }
    }

    const showBatchLine = S.scope !== "batch";
    const overallLine = S.scope === "batch" ? `<span class="lb-sub">সর্বমোট #${S.overallRank[r.studentId]}</span>` : (showBatchLine ? `<span class="lb-sub">${escapeHtml(batchOf(r))}</span>` : "");

    return `
      <div class="lb-row ${me ? "is-me" : ""} ${isScopeTop && !me ? "is-top" : ""} ${friend ? "tappable" : ""}" ${friend ? `data-open="${escapeHtml(r.studentId)}"` : ""}>
        ${rankBadge(pos)}
        ${avatar(r, 42, isScopeTop)}
        <div class="lb-main">
          <p class="lb-name"><span class="lb-name-text">${escapeHtml(r.name || r.studentId)}</span>${pills.join("")}</p>
          ${overallLine}
          <div class="points-pill">
            <span class="num">${safeNum(r.totalPoints)}</span> pts
            <span style="opacity:.75; font-weight:700;">(${escapeHtml(r.avgPercentage)}%)</span>
          </div>
        </div>
        <div class="lb-actions">${actions}</div>
      </div>`;
  }).join("");

  el.querySelectorAll(".add-friend-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      btn.disabled = true;
      try {
        await sendFriendRequest(student.studentId, btn.dataset.id);
        showToast("অনুরোধ পাঠানো হয়েছে।", "success");
        S.outgoing = await getOutgoingRequests(student.studentId);
        renderList();
      } catch (err) { showToast(err.message || friendlyError(err), "error"); btn.disabled = false; }
    });
  });

  el.querySelectorAll("[data-open]").forEach(row => row.addEventListener("click", () => openFriendSheet(row.dataset.open)));
}

/* ---------------- friend link (share -> auto friend request) ---------------- */
function myFriendLink() {
  return new URL(`./leaderboard.html?addFriend=${encodeURIComponent(student.studentId)}`, window.location.href).href;
}

function renderFriendLinkCard() {
  const el = document.getElementById("friendLinkCard");

  const link = myFriendLink();

  el.innerHTML = `
    <div class="glass-float-card req-card" style="border-left:4px solid var(--color-accent);">

        ${full ? `তোমার বন্ধু তালিকা পূর্ণ (${MAX_FRIENDS}/${MAX_FRIENDS}) — নতুন কাউকে যোগ করতে আগে কাউকে সরাও।` : "এই লিংক যাকে পাঠাবে, সে খুললেই সরাসরি তোমাকে বন্ধুর অনুরোধ পাঠিয়ে দেবে — আইডি খুঁজে বের করার দরকার নেই।"}
      </p>
      <div style="background:rgba(128,128,128,0.05); border:1px solid var(--surface-border); border-radius:10px; padding:10px 12px; font-size:0.72rem; color:var(--text-muted); font-weight:700; word-break:break-all; margin-bottom:12px;">${escapeHtml(link)}</div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-glass action-btn" id="copyFriendLinkBtn" style="flex:1;">কপি করো</button>
        <button type="button" class="btn-glass action-btn" id="shareFriendLinkBtn" style="flex:1;">শেয়ার করো</button>
      </div>
    </div>`;

  document.getElementById("copyFriendLinkBtn")?.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link); showToast("লিংক কপি হয়েছে!", "success"); }
    catch { showToast("কপি করা যায়নি।", "error"); }
  });

    const shareText = "আমার সাথে বন্ধু হয়ে যাও:";
    if (navigator.share) {
      try { await navigator.share({ title: "বন্ধু হও", text: shareText, url: link }); return; } catch { return; }
    }
    try { await navigator.clipboard.writeText(`${shareText} ${link}`); showToast("লিংক কপি হয়েছে!", "success"); }

// A friend's link lands back here with ?addFriend=<their studentId>. If
// I'm logged in as someone else, that's an automatic friend request to
// them — no ID typing needed. Runs once, then the param is scrubbed from
// the URL so refreshing the page never re-sends it.
async function handleIncomingFriendLink() {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get("addFriend");
  if (!targetId) return;

  window.history.replaceState({}, "", window.location.pathname);
  if (targetId === student.studentId) return;

  try {
    await sendFriendRequest(student.studentId, targetId);
    showToast("বন্ধুর অনুরোধ পাঠানো হয়েছে!", "success");
  } catch (err) {
    showToast(err.message || friendlyError(err), "error");
  }
}

/* ---------------- friend detail sheet (the "friend perk") ---------------- */
function vsRow(label, mine, theirs, suffix = "") {
  const total = Math.max(1, safeNum(mine) + safeNum(theirs));
  const a = Math.round(safeNum(mine) / total * 100);
  return `
    <div class="vs-row">
      <div class="vs-labels"><span>তুমি <b>${safeNum(mine)}${suffix}</b></span><span>${label}</span><span><b>${safeNum(theirs)}${suffix}</b> সে</span></div>
      <div class="vs-bar"><i class="vs-me" style="width:${a}%"></i><i class="vs-fr" style="width:${100 - a}%"></i></div>
    </div>`;
}

function openFriendSheet(friendId) {
  if (!isFriend(friendId)) return;
  openFriendId = friendId;
  document.getElementById("friendSheet").classList.remove("hidden");
  renderFriendSheet(friendId);
}

function closeFriendSheet() {
  openFriendId = null;
  document.getElementById("friendSheet").classList.add("hidden");
}

function renderFriendSheet(friendId) {
  const body = document.getElementById("friendSheetBody");
  const f = S.rows.find(r => r.studentId === friendId);
  const info = S.studentMap[friendId];
  if (!body) return;
  if (!info && !f) { closeFriendSheet(); return; }

  const me = S.rows.find(r => r.studentId === student.studentId) || { totalPoints: 0, avgPercentage: 0, examsTaken: 0 };
  const row = f || { studentId: friendId, name: info?.name, photoURL: info?.photoURL, className: info?.className, totalPoints: 0, avgPercentage: 0, examsTaken: 0, level: 1 };
  const ex = S.extras[friendId] || { weeklyXP: 0, weeklyExams: 0, streak: 0, recent: [], last: null, perfectExams: 0 };
  const rec = S.h2h[friendId] || { wins: 0, losses: 0, draws: 0 };
  const isTop = S.overallRank[friendId] === 1 && safeNum(row.totalPoints) > 0;
  const isBatchTop = S.batchRank[friendId] === 1 && safeNum(row.totalPoints) > 0;
  const challenged = S.outChalls.some(c => c.status === "pending" && c.toStudentId === friendId);
  const last = ex.last;

  const maxPct = 100;
  const spark = ex.recent.length
    ? `<div class="spark">${ex.recent.map(x => `<div class="spark-col" title="${escapeHtml(x.name)}"><span>${Math.round(x.pct)}%</span><div class="spark-bar" style="height:${Math.max(6, Math.round(x.pct / maxPct * 100))}%"></div></div>`).join("")}</div>`
    : `<div class="empty-note" style="padding:8px;">এখনো কোনো পরীক্ষার ফলাফল নেই।</div>`;

  body.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      ${avatar(row, 60, isTop)}
      <div style="min-width:0;">
        <div class="sheet-name">${escapeHtml(row.name || friendId)}</div>
        <div style="font-size:.7rem; color:var(--text-muted); font-weight:700; margin:3px 0 6px;">${escapeHtml(batchOf(row))} · লেভেল ${safeNum(row.level) || 1}</div>
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
          ${isTop ? `<span class="pill pill-topper">${ICON.crownSm}সেরা টপার</span>` : isBatchTop ? `<span class="pill pill-batch">${ICON.crownSm}ব্যাচ টপার</span>` : ""}
          ${ex.streak >= 1 ? `<span class="pill pill-streak">${ICON.flame}${ex.streak} সপ্তাহ স্ট্রিক</span>` : ""}
        </div>
      </div>
      <button type="button" class="btn-glass sheet-close" id="sheetCloseBtn" aria-label="বন্ধ করো">${ICON.close}</button>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><b>#${S.overallRank[friendId] || "—"}</b><small>সর্বমোট র‍্যাঙ্ক</small></div>
      <div class="stat-box"><b>#${S.batchRank[friendId] || "—"}</b><small>ব্যাচ র‍্যাঙ্ক</small></div>
      <div class="stat-box"><b>${safeNum(row.totalPoints)}</b><small>মোট পয়েন্ট</small></div>
      <div class="stat-box"><b>${row.avgPercentage ?? 0}%</b><small>গড় স্কোর</small></div>
      <div class="stat-box"><b>${safeNum(row.examsTaken)}</b><small>পরীক্ষা দিয়েছে</small></div>
      <div class="stat-box"><b>+${ex.weeklyXP}</b><small>এই সপ্তাহে</small></div>
    </div>

    <div class="sheet-block">
      <h4>${ICON.chart}তুমি বনাম ${escapeHtml(row.name || "বন্ধু")}</h4>
      ${vsRow("পয়েন্ট", me.totalPoints, row.totalPoints)}
      ${vsRow("গড় স্কোর", me.avgPercentage, row.avgPercentage, "%")}
      ${vsRow("পরীক্ষা", me.examsTaken, row.examsTaken)}
    </div>

    <div class="sheet-block">
      <h4>${ICON.swords}চ্যালেঞ্জ রেকর্ড</h4>
      <div class="h2h">
        <div><b style="color:#16a34a;">${rec.wins}</b><small>তোমার জয়</small></div>
        <div><b>${rec.draws}</b><small>ড্র</small></div>
        <div><b style="color:#dc2626;">${rec.losses}</b><small>তোমার হার</small></div>
      </div>
    </div>

    <div class="sheet-block">
      <h4>${ICON.activity}সাম্প্রতিক স্কোর</h4>
      ${spark}
      ${last ? `<div style="margin-top:10px; font-size:.68rem; color:var(--text-muted); font-weight:700; display:flex; justify-content:space-between; gap:8px;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">শেষ পরীক্ষা: ${escapeHtml(last.examName || "পরীক্ষা")}</span><span>${escapeHtml(relativeTime(last.submittedAt))}</span></div>` : ""}
    </div>

    <div class="sheet-actions">
      <a class="btn-glass" href="../student/comparison.html?friendId=${encodeURIComponent(friendId)}">${ICON.chart}বিস্তারিত তুলনা</a>
      ${challenged
        ? `<span class="btn-glass" style="color:var(--text-muted); cursor:default;">${ICON.clock}চ্যালেঞ্জ অপেক্ষমান</span>`
        : `<button type="button" class="btn-glass btn-danger" id="sheetChallengeBtn">${ICON.swords}চ্যালেঞ্জ করো</button>`}
      <button type="button" class="btn-glass full" id="sheetRemoveBtn" style="color:var(--text-muted);">${ICON.userMinus}বন্ধুত্ব শেষ করো</button>
    </div>`;

  document.getElementById("sheetCloseBtn").addEventListener("click", closeFriendSheet);
  document.getElementById("sheetChallengeBtn")?.addEventListener("click", () => openChallengeModal(friendId));
  document.getElementById("sheetRemoveBtn").addEventListener("click", async () => {
    if (!confirm("এই বন্ধুকে তালিকা থেকে সরাতে চাও?")) return;
    try {
      await removeFriend(student.studentId, friendId);
      showToast("বন্ধুত্ব শেষ হয়েছে।", "success");
      closeFriendSheet();
      await loadAll();
    } catch (err) { showToast(err.message || friendlyError(err), "error"); }
  });
}

/* ---------------- challenges ---------------- */
async function renderIncomingChallenges() {
  const card = document.getElementById("incomingChallengesCard");
  if (!card) return;
  try {
    const all = await getIncomingChallenges(student.studentId);
    // Only still-pending challenges belong on this "respond to it" card —
    // once accepted/completed/etc. it has nothing left for the recipient
    // to decide, so it must disappear from here.
    const incoming = all.filter(c => c.status === "pending");
    if (!incoming.length) { card.innerHTML = ""; return; }

    card.innerHTML = `
      <div class="glass-float-card req-card" style="border-left:4px solid #ef4444;">
        <div class="req-head" style="color:#ef4444;">${ICON.swords} নতুন চ্যালেঞ্জ!</div>
        ${incoming.map(c => `
          <div class="req-row">
            <div style="flex:1; min-width:0;">
              <div style="font-size:.92rem; font-weight:900;">${escapeHtml(S.studentMap[c.fromStudentId]?.name || "বন্ধু")}</div>
              <div style="margin-top:3px; font-size:.72rem; color:var(--text-secondary);">পরীক্ষা: <b>${escapeHtml(c.examName || "পরীক্ষা")}</b></div>
            </div>
            <button type="button" class="btn-glass action-btn btn-danger chall-reject" data-id="${escapeHtml(c.id)}" title="বাতিল">${ICON.close}</button>
            <button type="button" class="btn-glass action-btn btn-ok chall-accept" data-id="${escapeHtml(c.id)}" title="গ্রহণ">${ICON.check}</button>
          </div>`).join("")}
      </div>`;

    card.querySelectorAll(".chall-accept").forEach(btn => btn.addEventListener("click", async () => {
      try { await acceptChallenge(btn.dataset.id, student.studentId); showToast("চ্যালেঞ্জ গৃহীত!", "success"); await loadAll(); }
      catch (err) { showToast(err.message || friendlyError(err), "error"); }
    }));
    card.querySelectorAll(".chall-reject").forEach(btn => btn.addEventListener("click", async () => {
      try { await rejectChallenge(btn.dataset.id, student.studentId); await loadAll(); }
      catch (err) { showToast(err.message || friendlyError(err), "error"); }
    }));
  } catch (err) { console.error("Incoming challenges failed:", err); }
}

async function openChallengeModal(friendId) {
  selectedFriendIdForChallenge = friendId;
  const modal = document.getElementById("challengeModal");
  const body = document.getElementById("challengeModalBody");
  const confirmBtn = document.getElementById("confirmChallengeBtn");

  modal.style.display = "flex";
  confirmBtn.style.display = "none";
  confirmBtn.disabled = false;
  confirmBtn.textContent = "চ্যালেঞ্জ পাঠাও";
  body.innerHTML = `<div class="spinner"></div>`;

  try {
    if (!upcomingExamsCache) upcomingExamsCache = await getUpcomingExams();
    const exams = Array.isArray(upcomingExamsCache) ? upcomingExamsCache : [];
    body.innerHTML = `
      <select id="challengeExamSelect" class="challenge-select">
        <option value="__NEXT_EXAM__">পরবর্তী পরীক্ষা (Auto Select)</option>
        ${exams.map(e => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name || "পরীক্ষা")}</option>`).join("")}
      </select>
      <div style="margin-top:14px; padding:12px; border-radius:12px; background:rgba(234,179,8,.1); border:1px solid rgba(234,179,8,.2); color:#b45309; font-size:.75rem; font-weight:700; line-height:1.55;">
        এখনো কোনো পরীক্ষা প্রকাশিত না থাকলেও চ্যালেঞ্জ পাঠানো যাবে। এটি পরবর্তী পরীক্ষার সঙ্গে স্বয়ংক্রিয়ভাবে যুক্ত হবে।
      </div>`;
    confirmBtn.style.display = "inline-flex";
  } catch (err) { body.innerHTML = `<p style="font-size:.8rem; color:#ef4444;">পরীক্ষার তালিকা আনা যায়নি।</p>`; }
}

document.getElementById("confirmChallengeBtn").onclick = async () => {
  const select = document.getElementById("challengeExamSelect");
  const btn = document.getElementById("confirmChallengeBtn");
  if (!select || !selectedFriendIdForChallenge) return;

  const examId = select.value;
  const examName = select.options[select.selectedIndex]?.text || "পরীক্ষা";

  try {
    btn.disabled = true;
    btn.textContent = "পাঠানো হচ্ছে...";
    await sendChallenge({ fromStudentId: student.studentId, toStudentId: selectedFriendIdForChallenge, examId, examName });
    showToast("চ্যালেঞ্জ পাঠানো হয়েছে!", "success");
    document.getElementById("challengeModal").style.display = "none";
    selectedFriendIdForChallenge = null;
    S.outChalls = await getOutgoingChallenges(student.studentId).catch(() => S.outChalls);
    renderList();
    if (openFriendId) renderFriendSheet(openFriendId);
  } catch (err) {
    showToast(err.message || friendlyError(err), "error");
    btn.disabled = false;
    btn.textContent = "চ্যালেঞ্জ পাঠাও";
  }
};

/* ---------------- live feed (friends' latest results) ---------------- */
function renderLive() {
  const track = document.getElementById("liveActivityTrack");
  if (!track) return;

  liveActivities = S.results
    .filter(r => isFriend(r.studentId))
    .sort((a, b) => toMillis(b.submittedAt) - toMillis(a.submittedAt))
    .slice(0, 8);

  if (liveActivityIndex >= liveActivities.length) liveActivityIndex = 0;

  if (!liveActivities.length) {
    track.innerHTML = `<div style="padding:22px; text-align:center; color:var(--text-muted); font-size:.8rem; width:100%;">এখনো কোনো বন্ধুর আপডেট নেই।</div>`;
    if (liveActivityTimer) clearInterval(liveActivityTimer);
    liveActivityTimer = null;
    track.style.transform = "translateX(0)";
    return;
  }

  track.innerHTML = liveActivities.map(a => {
    const friend = S.studentMap[a.studentId] || {};
    const marks = a.obtainedMarks !== undefined ? `${a.obtainedMarks}/${a.totalMarks}` : "—";
    const pct = a.percentage !== undefined ? `${a.percentage}%` : "—";
    return `
      <div class="live-card">
        <div class="live-card-inner">
          ${avatar(friend, 38)}
          <div style="min-width:0;">
            <div class="live-name">${escapeHtml(friend.name || "বন্ধু")}</div>
            <div class="live-exam">${escapeHtml(a.examName)}</div>
          </div>
          <div style="font-size:1.1rem; font-weight:950; color:var(--color-accent);">${escapeHtml(pct)}</div>
        </div>
        <div class="live-stats">
          <div class="live-stat"><b>${escapeHtml(marks)}</b><span class="live-stat-label">Marks</span></div>
          <div class="live-stat"><b style="color:var(--color-success);">${a.correctCount || 0}</b><span class="live-stat-label">Correct</span></div>
          <div class="live-stat"><b style="color:var(--color-danger);">${a.wrongCount || 0}</b><span class="live-stat-label">Wrong</span></div>
          <div class="live-stat"><b style="color:var(--text-secondary);">${a.unansweredCount || 0}</b><span class="live-stat-label">Skipped</span></div>
        </div>
        <div class="live-time">${ICON.clock}${escapeHtml(relativeTime(a.submittedAt))}</div>
      </div>`;
  }).join("");

  updateLiveSlider();
  restartLiveSlider();
}

function updateLiveSlider() {
  const track = document.getElementById("liveActivityTrack");
  if (!track || !liveActivities.length) return;
  track.style.transform = `translateX(-${liveActivityIndex * 100}%)`;
}

function restartLiveSlider() {
  if (liveActivityTimer) clearInterval(liveActivityTimer);
  if (liveActivities.length <= 1) { liveActivityTimer = null; return; }
  liveActivityTimer = setInterval(() => {
    liveActivityIndex = (liveActivityIndex + 1) % liveActivities.length;
    updateLiveSlider();
  }, 4000);
}
</script>
</body>
</html>
