<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  .lx { display:flex; flex-direction:column; gap:12px; }
  .lx-ico { width:14px; height:14px; flex:none; }
  .lx-card { background:var(--surface); border:1px solid var(--surface-border); border-radius:16px; padding:6px 12px; }
  .lx-empty { text-align:center; color:var(--text-muted); font-size:.82rem; padding:26px 10px; }
  .lx-title { font-size:.74rem; font-weight:800; color:var(--text-muted); margin:6px 2px -4px; }

  .lx-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:11px; border:1px solid var(--surface-border); background:var(--surface-solid); color:var(--text-primary); font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .lx-btn.primary { background:var(--color-accent); border-color:var(--color-accent); color:#fff; }
  .lx-btn.ok { background:var(--color-success); border-color:var(--color-success); color:#fff; }
  .lx-btn.danger { color:var(--color-danger); background:transparent; }
  .lx-btn.sm { padding:6px 11px; font-size:.72rem; border-radius:9px; }
  .lx-btn[disabled] { opacity:.5; cursor:default; }

  .lx-av { position:relative; flex:none; border-radius:50%; background:var(--color-accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:800; overflow:hidden; }
  .lx-av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .lx-me { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--surface-border); border-radius:16px; }
  .lx-me b { font-size:.92rem; display:block; }
  .lx-me small { font-size:.72rem; color:var(--text-muted); }
  .lx-me .r { margin-left:auto; text-align:right; }
  .lx-me .r b { font-family:var(--font-num); font-size:1.2rem; color:var(--color-accent); }

  .lx-seg { display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--surface-edge); }
  .lx-seg button { flex:1; padding:8px 4px; border:0; border-radius:9px; background:transparent; color:var(--text-secondary); font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; }
  .lx-seg button.on { background:var(--surface-solid); color:var(--text-primary); box-shadow:var(--shadow-soft); }
  .lx-dot { display:inline-block; min-width:16px; height:16px; line-height:16px; padding:0 4px; margin-left:4px; border-radius:99px; background:var(--color-danger); color:#fff; font-size:.62rem; font-weight:800; }
  .lx-filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .lx-chip { padding:6px 12px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface-solid); color:var(--text-secondary); font:inherit; font-size:.74rem; font-weight:700; cursor:pointer; }
  .lx-chip.on { background:var(--color-accent); border-color:var(--color-accent); color:#fff; }
  .lx-sel, .lx-inp { padding:9px 12px; border-radius:11px; border:1px solid var(--surface-border); background:var(--surface-solid); color:inherit; font:inherit; font-size:.85rem; }
  .lx-inp { width:100%; }

  .lx-row { display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--surface-edge); cursor:pointer; }
  .lx-row:first-child { border-top:0; }
  .lx-row.me { background:rgba(var(--color-accent-rgb),.09); margin:0 -8px; padding-left:10px; padding-right:10px; border-radius:10px; }
  .lx-rk { width:24px; text-align:center; font-family:var(--font-num); font-weight:800; color:var(--text-muted); font-size:.85rem; flex:none; }
  .lx-rk.t1 { color:#c99a3b; } .lx-rk.t2 { color:#8d94a0; } .lx-rk.t3 { color:#a7683c; }
  .lx-nm { font-weight:700; font-size:.86rem; line-height:1.25; }
  .lx-sub { font-size:.68rem; color:var(--text-muted); margin-top:1px; }
  .lx-val { margin-left:auto; text-align:right; flex:none; font-family:var(--font-num); font-weight:800; font-size:.9rem; }
  .lx-tag { font-size:.6rem; font-weight:800; padding:2px 6px; border-radius:99px; background:var(--color-accent); color:#fff; margin-left:5px; vertical-align:1px; }
  .lx-mv { font-size:.64rem; font-weight:800; margin-left:4px; }
  .lx-mv.up { color:var(--color-success); } .lx-mv.down { color:var(--color-danger); }
  .lx-badge { margin-left:auto; flex:none; font-size:.66rem; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--surface-edge); color:var(--text-secondary); }
  .lx-badge.win { background:rgba(47,125,94,.14); color:var(--color-success); }
  .lx-badge.lose { background:rgba(166,64,47,.12); color:var(--color-danger); }
  .lx-badge.wait { background:rgba(var(--color-accent-rgb),.14); color:var(--color-accent); }
  .lx-acts { display:flex; gap:6px; margin-left:auto; flex:none; }

  .lx-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lx-rec { font-size:.8rem; font-weight:700; color:var(--text-secondary); }

  .lx-ov { position:fixed; inset:0; z-index:9000; background:rgba(15,15,20,.5); display:flex; align-items:flex-end; justify-content:center; }
  .lx-sheet { width:100%; max-width:480px; background:var(--surface-solid); border-radius:18px 18px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); }
  .lx-ov.center { align-items:center; padding:16px; }
  .lx-ov.center .lx-sheet { border-radius:18px; }
  .lx-sheet .lx-inp, .lx-sheet .lx-sel { width:100%; margin-bottom:10px; }
  .lx-sheet-h { font-weight:800; margin-bottom:12px; }
  .lx-list { display:flex; flex-direction:column; gap:8px; }
  .lx-list .lx-btn { width:100%; padding:12px; }
</style>
</head>
<body>
<div class="app-shell" id="shell"><div class="state-block"><div class="spinner"></div></div></div>

<script type="module">
import { initTheme, renderStudentHeader, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { requireStudentSession } from "../js/utils/student-auth.js";
import { buildLeaderboardRows, getUpcomingExams, getAllApprovedResults } from "../js/utils/results-utils.js";
import { getBattleXPMap } from "../js/utils/battle-utils.js?v=roomcard1";
import { getMyFriendIds, getIncomingRequests, getOutgoingRequests, sendFriendRequest, acceptFriendRequest, rejectFriendRequest, removeFriend, MAX_FRIENDS, getRival, setRival, clearRival } from "../js/utils/friend-utils.js";
import { getIncomingChallenges, getOutgoingChallenges, sendChallenge, acceptChallenge, rejectChallenge, cancelChallenge, resolveCompletedChallenges, getChallengeBonusMap, CHALLENGE_REWARDS } from "../js/utils/challenge-utils.js";
import { buildStudentExtras, computeRankMovement, getHeadToHeadMap, getCheerData, sendCheer, toMillis, DAY_MS } from "../js/utils/friend-stats-utils.js";
import { getCompletedImprovementAttemptsByStudent } from "../js/utils/improvement-xp-integration.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

/* ---------------- state ---------------- */
const S = {
  q: "",
  tab: "rank",            // rank | challenges | friends
  scope: "overall",       // overall | batch | friends
  period: "all",          // all | week
  batch: null,
  students: [], studentMap: {}, results: [], rows: [], extras: {}, movement: {}, overallRank: {},
  friendIds: [], incoming: [], outgoing: [], inChalls: [], outChalls: [], h2h: {},
  challengeBonusMap: {}, improvementResultsMap: {}, battleXPMap: {},
  rivalId: null, q: "", cheers: { received: [], sentToday: new Set() }
};
const NO_BATCH = "ব্যাচ নেই";
let examsCache = null;

/* ---------------- helpers ---------------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmt = v => Math.round(num(v)).toLocaleString("en-US");
const batchOf = r => (r && r.className) || NO_BATCH;
const isFriend = id => S.friendIds.includes(id);
const me = () => student.studentId;
const svg = (inner, sw = 2.2) => `<svg class="lx-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const I = {
  up: svg(`<path d="m6 15 6-6 6 6"/>`, 3), down: svg(`<path d="m6 9 6 6 6-6"/>`, 3),
  swords: svg(`<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>`),
  refresh: svg(`<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>`)
};

function avatar(r, size = 42) {
  const inner = r?.photoURL ? `<img src="${esc(r.photoURL)}" alt="" draggable="false" onerror="this.remove()">` : "";
  return `<span class="lx-av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px">${esc((r?.name || "শ").charAt(0))}${inner}</span>`;
}
function mvChip(change) {
  if (change === null || change === undefined || change === 0) return "";
  return change > 0 ? `<span class="lx-mv up">${I.up}${change}</span>` : `<span class="lx-mv down">${I.down}${Math.abs(change)}</span>`;
}
const linkProfile = sid => sid === me() ? "profile.html" : `profile.html?sid=${encodeURIComponent(sid)}`;

/* ---------------- boot ---------------- */
(async function boot() {
  if (!student) { window.location.href = "../index.html"; return; }
  if (!(await requireStudentSession(student.studentId))) {
    localStorage.removeItem("activeStudent"); window.location.href = "../index.html"; return;
  }
  const fresh = await refreshActiveStudent(student.docId).catch(() => null);
  if (fresh) student = fresh;
  shell.innerHTML = `<div class="lx">
      ${renderStudentHeader(student, "leaderboard")}
      <div id="lxHero"></div>
      <div id="lxTabs"></div>
      <div id="lxBody"><div class="state-block"><div class="spinner"></div></div></div>
    </div>`;
  try { await loadAll(); }
  catch (err) { console.error(err); document.getElementById("lxBody").innerHTML = `<div class="lx-card lx-empty">তথ্য লোড করা যায়নি। পেজ রিফ্রেশ করো।</div>`; }
})();

/* ---------------- data ---------------- */
async function loadAll() {
  S.students = await getActiveStudents();
  const id = me();
  await resolveCompletedChallenges(id).catch(e => { console.warn("resolve failed", e); return []; });

  const [results, friendIds, incoming, outgoing, outChalls, inChalls, h2h, bonus, rival, impr, battle, cheers] = await Promise.all([
    getAllApprovedResults(),
    getMyFriendIds(id).catch(() => []),
    getIncomingRequests(id).catch(() => []),
    getOutgoingRequests(id).catch(() => []),
    getOutgoingChallenges(id).catch(() => []),
    getIncomingChallenges(id).catch(() => []),
    getHeadToHeadMap(id).catch(() => ({})),
    getChallengeBonusMap().catch(() => ({})),
    getRival(id).catch(() => null),
    getCompletedImprovementAttemptsByStudent().catch(() => ({})),
    getBattleXPMap().catch(() => ({})),
    getCheerData(id).catch(() => ({ received: [], sentToday: new Set() }))
  ]);
  S.results = results; S.friendIds = Array.isArray(friendIds) ? friendIds : [];
  S.incoming = incoming; S.outgoing = outgoing; S.outChalls = outChalls; S.inChalls = inChalls; S.h2h = h2h;
  S.challengeBonusMap = bonus; S.improvementResultsMap = impr; S.battleXPMap = battle; S.cheers = cheers;
  S.rivalId = S.friendIds.includes(rival?.rivalId) ? rival.rivalId : null;

  const rows = buildLeaderboardRows(S.results, S.students, S.challengeBonusMap, S.improvementResultsMap, S.battleXPMap);
  S.rows = rows;
  const weekAgo = Date.now() - 7 * DAY_MS;
  const old = buildLeaderboardRows(S.results.filter(r => toMillis(r.submittedAt) && toMillis(r.submittedAt) < weekAgo), S.students, S.challengeBonusMap, S.improvementResultsMap, {});
  S.movement = computeRankMovement(rows, old);
  S.extras = buildStudentExtras(S.results);
  S.overallRank = {}; rows.forEach((r, i) => { S.overallRank[r.studentId] = i + 1; });
  S.studentMap = {}; S.students.forEach(s => { S.studentMap[s.studentId] = s; });
  if (!S.batch) S.batch = student.className || [...new Set(rows.map(batchOf))].filter(b => b !== NO_BATCH).sort()[0] || null;
  renderAll();
}
async function reload(tab) { if (tab) S.tab = tab; try { await loadAll(); } catch (e) { showToast(friendlyError(e), "error"); } }

const allChalls = () => [
  ...S.inChalls.map(c => ({ ...c, dir: "in" })),
  ...S.outChalls.map(c => ({ ...c, dir: "out" }))
];
const otherOf = c => c.dir === "in" ? c.fromStudentId : c.toStudentId;
const nameOf = id => S.studentMap[id]?.name || id;
const weeklyXP = id => num(S.extras[id]?.weeklyXP);
const pendingIncomingChalls = () => allChalls().filter(c => c.dir === "in" && c.status === "pending");

function scopeRows() {
  let rows = S.rows;
  if (S.scope === "batch") rows = rows.filter(r => batchOf(r) === S.batch);
  else if (S.scope === "friends") rows = rows.filter(r => isFriend(r.studentId) || r.studentId === me());
  if (S.period === "week") rows = [...rows].sort((a, b) => weeklyXP(b.studentId) - weeklyXP(a.studentId));
  return rows;
}

/* ---------------- render ---------------- */
function renderAll() { renderHero(); renderTabs(); renderBody(); }

function renderHero() {
  const r = S.rows.find(x => x.studentId === me());
  const rank = S.overallRank[me()];
  document.getElementById("lxHero").innerHTML = `<div class="lx-me">${avatar(student, 38)}
    <div style="min-width:0"><b>${esc(student.name)}</b><small>${esc(student.className || "")}</small></div>
    <div class="r"><b>${rank ? "#" + rank : "-"}</b><br><small>${fmt(r?.totalPoints)} XP</small></div></div>`;
}

function renderTabs() {
  const chN = pendingIncomingChalls().length, frN = S.incoming.length;
  const tab = (k, t, n) => `<button class="${S.tab === k ? "on" : ""}" data-act="tab" data-id="${k}">${t}${n ? `<span class="lx-dot">${n}</span>` : ""}</button>`;
  document.getElementById("lxTabs").innerHTML = `<div class="lx-seg">${tab("rank", "র‍্যাঙ্কিং")}${tab("challenges", "চ্যালেঞ্জ", chN)}${tab("friends", "বন্ধু", frN)}</div>`;
}

function renderBody() {
  document.getElementById("lxBody").innerHTML = S.tab === "challenges" ? viewChallenges() : S.tab === "friends" ? viewFriends() : viewRank();
}

/* ---- ranking ---- */
function viewRank() {
  const rows = scopeRows();
  const batches = [...new Set(S.rows.map(batchOf))].filter(b => b !== NO_BATCH).sort();
  const chip = (group, k, t) => `<button class="lx-chip ${S[group] === k ? "on" : ""}" data-act="${group}" data-id="${k}">${t}</button>`;
  const val = r => S.period === "week" ? weeklyXP(r.studentId) : num(r.totalPoints);
  return `<div style="display:flex;flex-direction:column;gap:10px">
    <div class="lx-filters">${chip("scope", "overall", "সবাই")}${chip("scope", "batch", "ব্যাচ")}${chip("scope", "friends", "বন্ধুরা")}
      <span style="flex:1"></span>${chip("period", "all", "সর্বমোট")}${chip("period", "week", "এই সপ্তাহ")}</div>
    ${S.scope === "batch" ? `<select class="lx-sel" data-sel="batch">${batches.map(b => `<option value="${esc(b)}" ${S.batch === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>` : ""}
    ${rows.length === 0 ? `<div class="lx-card lx-empty">কেউ নেই</div>` : `<div class="lx-card">${rows.map((r, i) => {
      const mine = r.studentId === me();
      return `<div class="lx-row ${mine ? "me" : ""}" data-act="go" data-id="${esc(r.studentId)}">
        <span class="lx-rk ${i < 3 ? "t" + (i + 1) : ""}">${i + 1}</span>${avatar(r, 34)}
        <div style="min-width:0"><div class="lx-nm">${esc(r.name)}${mine ? `<span class="lx-tag">তুমি</span>` : ""}</div>
        <div class="lx-sub">${esc(batchOf(r))}</div></div>
        <div class="lx-val">${fmt(val(r))}${S.period === "all" ? mvChip(S.movement[r.studentId]) : ""}</div></div>`;
    }).join("")}</div>`}
  </div>`;
}

/* ---- challenges ---- */
function viewChallenges() {
  const all = allChalls();
  const inc = all.filter(c => c.dir === "in" && c.status === "pending");
  const active = all.filter(c => c.status === "accepted");
  const sent = all.filter(c => c.dir === "out" && c.status === "pending");
  const hist = all.filter(c => c.status === "completed" || c.status === "expired")
    .sort((a, b) => (toMillis(b.resolvedAt) || toMillis(b.createdAt)) - (toMillis(a.resolvedAt) || toMillis(a.createdAt))).slice(0, 10);
  let w = 0, l = 0, d = 0;
  Object.values(S.h2h).forEach(x => { w += x.wins; l += x.losses; d += x.draws; });

  const row = (c, right) => {
    const oid = otherOf(c);
    return `<div class="lx-row" style="cursor:default">${avatar(S.studentMap[oid], 34)}
      <div style="min-width:0"><div class="lx-nm">${esc(nameOf(oid))}</div><div class="lx-sub">${esc(c.examName || "পরবর্তী পরীক্ষা")}</div></div>${right}</div>`;
  };
  const sec = (title, list) => list.length ? `<div class="lx-title">${title}</div><div class="lx-card">${list.join("")}</div>` : "";

  const out = `
    <div class="lx-top"><div class="lx-rec">জিত ${w} · হার ${l} · ড্র ${d}</div>
      <button class="lx-btn primary sm" data-act="ch-new">${I.swords} নতুন চ্যালেঞ্জ</button></div>
    ${sec("আসা চ্যালেঞ্জ", inc.map(c => row(c, `<div class="lx-acts"><button class="lx-btn ok sm" data-act="ch-accept" data-id="${c.id}">গ্রহণ</button><button class="lx-btn danger sm" data-act="ch-reject" data-id="${c.id}">বাদ</button></div>`)))}
    ${sec("চলছে", active.map(c => row(c, `<span class="lx-badge wait">চলছে</span>`)))}
    ${sec("পাঠানো", sent.map(c => row(c, `<div class="lx-acts"><span class="lx-badge">অপেক্ষমাণ</span><button class="lx-btn danger sm" data-act="ch-cancel" data-id="${c.id}">বাতিল</button></div>`)))}
    ${sec("আগের", hist.map(c => {
      if (c.status === "expired") return row(c, `<span class="lx-badge">মেয়াদ শেষ</span>`);
      const won = c.winnerStudentId === me(), lost = c.loserStudentId === me();
      return row(c, `<span class="lx-badge ${won ? "win" : lost ? "lose" : ""}">${won ? "জিত" : lost ? "হার" : "ড্র"}</span>`);
    }))}
    ${!inc.length && !active.length && !sent.length && !hist.length ? `<div class="lx-card lx-empty">কোনো চ্যালেঞ্জ নেই</div>` : ""}`;
  return `<div style="display:flex;flex-direction:column;gap:10px">${out}</div>`;
}

/* ---- friends ---- */
function frStatusBtn(sid) {
  const inc = S.incoming.find(x => x.fromStudentId === sid), out = S.outgoing.find(x => x.toStudentId === sid);
  if (isFriend(sid)) return `<span class="lx-badge">বন্ধু</span>`;
  if (inc) return `<button class="lx-btn ok sm" data-act="fr-accept" data-id="${inc.id}">গ্রহণ</button>`;
  if (out) return `<span class="lx-badge">পাঠানো হয়েছে</span>`;
  return `<button class="lx-btn primary sm" data-act="fr-add" data-id="${esc(sid)}">+ বন্ধু</button>`;
}
function searchResultsHtml() {
  const q = (S.q || "").trim().toLowerCase();
  if (!q) return "";
  const list = S.students.filter(x => x.studentId !== me() &&
    ((x.name || "").toLowerCase().includes(q) || (x.studentId || "").toLowerCase().includes(q) || (x.className || "").toLowerCase().includes(q))).slice(0, 8);
  if (!list.length) return `<div class="lx-card lx-empty">পাওয়া যায়নি</div>`;
  return `<div class="lx-card">${list.map(x => `<div class="lx-row" data-act="go" data-id="${esc(x.studentId)}">${avatar(x, 34)}
    <div style="min-width:0"><div class="lx-nm">${esc(x.name)}</div><div class="lx-sub">${esc(x.className || "")}</div></div>
    <div class="lx-acts" data-stop="1">${frStatusBtn(x.studentId)}</div></div>`).join("")}</div>`;
}
function viewFriends() {
  const friends = S.friendIds.map(id => S.studentMap[id]).filter(Boolean)
    .sort((a, b) => ((b.studentId === S.rivalId) - (a.studentId === S.rivalId)) || (num(S.overallRank[a.studentId]) || 9999) - (num(S.overallRank[b.studentId]) || 9999));
  return `<div style="display:flex;flex-direction:column;gap:10px">
    <input class="lx-inp" id="frSearch" placeholder="নাম বা ID দিয়ে খোঁজো" value="${esc(S.q || "")}" autocomplete="off">
    <div id="frRes">${searchResultsHtml()}</div>
    ${S.incoming.length ? `<div class="lx-title">অনুরোধ</div><div class="lx-card">${S.incoming.map(r => `<div class="lx-row" style="cursor:default">${avatar(S.studentMap[r.fromStudentId], 34)}
      <div style="min-width:0"><div class="lx-nm">${esc(nameOf(r.fromStudentId))}</div><div class="lx-sub">${esc(S.studentMap[r.fromStudentId]?.className || "")}</div></div>
      <div class="lx-acts"><button class="lx-btn ok sm" data-act="fr-accept" data-id="${r.id}">গ্রহণ</button><button class="lx-btn danger sm" data-act="fr-reject" data-id="${r.id}">বাদ</button></div></div>`).join("")}</div>` : ""}
    <div class="lx-title">বন্ধুরা (${friends.length})</div>
    ${friends.length === 0 ? `<div class="lx-card lx-empty">এখনো কোনো বন্ধু নেই</div>` : `<div class="lx-card">${friends.map(f => {
      const isRival = f.studentId === S.rivalId, rk = S.overallRank[f.studentId];
      return `<div class="lx-row" data-act="go" data-id="${esc(f.studentId)}">${avatar(f, 34)}
        <div style="min-width:0"><div class="lx-nm">${esc(f.name)}${isRival ? `<span class="lx-tag">রাইভাল</span>` : ""}</div>
        <div class="lx-sub">${esc(f.className || "")}${rk ? ` · #${rk}` : ""}</div></div>
        <div class="lx-acts" data-stop="1"><button class="lx-btn sm" data-act="menu" data-id="${esc(f.studentId)}">আরও</button></div></div>`;
    }).join("")}</div>`}
  </div>`;
}

/* ---------------- friend menu (small) ---------------- */
function openMenu(sid) {
  closeOverlay();
  const busy = allChalls().some(c => ["pending", "accepted"].includes(c.status) && otherOf(c) === sid);
  overlay(`<div class="lx-sheet-h">${esc(nameOf(sid))}</div><div class="lx-list">
    <a class="lx-btn primary" href="${linkProfile(sid)}">প্রোফাইল</a>
    <button class="lx-btn" data-act="ch-new" data-id="${esc(sid)}" ${busy ? "disabled" : ""}>${busy ? "চ্যালেঞ্জ চলছে" : "চ্যালেঞ্জ"}</button>
    <a class="lx-btn" href="comparison.html?friendId=${encodeURIComponent(sid)}">তুলনা</a>
    ${S.rivalId === sid ? `<button class="lx-btn" data-act="rival-clear">রাইভাল সরাও</button>` : `<button class="lx-btn" data-act="rival-set" data-id="${esc(sid)}">রাইভাল বানাও</button>`}
    <button class="lx-btn danger" data-act="fr-remove" data-id="${esc(sid)}">বন্ধুত্ব শেষ</button></div>`, false);
}

function overlay(html, center) {
  const ov = document.createElement("div");
  ov.className = "lx-ov" + (center ? " center" : ""); ov.id = "lxOv";
  ov.innerHTML = `<div class="lx-sheet">${html}</div>`;
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeOverlay(); });
  document.body.appendChild(ov);
  return ov;
}
function closeOverlay() { document.getElementById("lxOv")?.remove(); }

/* ---------------- challenge modal ---------------- */
async function openChallengeModal(preId) {
  closeOverlay();
  const friends = S.friendIds.map(id => S.studentMap[id]).filter(Boolean);
  if (!friends.length) { showToast("আগে কাউকে বন্ধু বানাও।", "error"); return; }
  const busy = new Set(allChalls().filter(c => ["pending", "accepted"].includes(c.status)).map(otherOf));
  const ov = overlay(`<div class="lx-sheet-h">নতুন চ্যালেঞ্জ</div>
    <select class="lx-sel" id="chFriend">${friends.map(f => `<option value="${esc(f.studentId)}" ${busy.has(f.studentId) ? "disabled" : ""} ${f.studentId === preId ? "selected" : ""}>${esc(f.name)}${busy.has(f.studentId) ? " (চলছে)" : ""}</option>`).join("")}</select>
    <select class="lx-sel" id="chExam"><option value="__NEXT_EXAM__">পরবর্তী পরীক্ষা</option></select>
    <div style="display:flex;gap:8px"><button class="lx-btn" style="flex:1" data-act="close">বাতিল</button>
      <button class="lx-btn primary" style="flex:1" id="chSend">পাঠাও</button></div>`, true);
  try {
    if (!examsCache) examsCache = await getUpcomingExams();
    const sel = ov.querySelector("#chExam");
    (Array.isArray(examsCache) ? examsCache : []).forEach(e => sel.insertAdjacentHTML("beforeend", `<option value="${esc(e.id)}">${esc(e.name || "পরীক্ষা")}</option>`));
  } catch {}
  const first = ov.querySelector("#chFriend");
  if (first.selectedOptions[0]?.disabled) { const ok = [...first.options].find(o => !o.disabled); if (ok) first.value = ok.value; }
  ov.querySelector("#chSend").addEventListener("click", async (e) => {
    const btn = e.currentTarget, fsel = ov.querySelector("#chFriend"), xsel = ov.querySelector("#chExam");
    if (fsel.selectedOptions[0]?.disabled) { showToast("এই বন্ধুর সাথে চ্যালেঞ্জ চলছে।", "error"); return; }
    btn.disabled = true;
    try {
      await sendChallenge({ fromStudentId: me(), toStudentId: fsel.value, examId: xsel.value,
        examName: xsel.value === "__NEXT_EXAM__" ? "পরবর্তী পরীক্ষা" : (xsel.selectedOptions[0]?.text || "পরীক্ষা") });
      showToast("চ্যালেঞ্জ পাঠানো হয়েছে", "success"); closeOverlay(); await reload("challenges");
    } catch (err) { showToast(err.message || friendlyError(err), "error"); btn.disabled = false; }
  });
}

/* ---------------- actions ---------------- */
async function run(fn, okMsg, tab) {
  try { await fn(); if (okMsg) showToast(okMsg, "success"); closeOverlay(); await reload(tab); }
  catch (err) { showToast(err.message || friendlyError(err), "error"); }
}

document.addEventListener("change", (e) => {
  if (e.target.dataset?.sel === "batch") { S.batch = e.target.value; renderBody(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "frSearch") { S.q = e.target.value; const r = document.getElementById("frRes"); if (r) r.innerHTML = searchResultsHtml(); }
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  if (t.dataset.act === "go" && e.target.closest("[data-stop]")) {
    const inner = e.target.closest("[data-act]");
    if (inner === t) return;
  }
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "tab": S.tab = id; renderTabs(); renderBody(); break;
    case "scope": S.scope = id; renderBody(); break;
    case "period": S.period = id; renderBody(); break;
    case "batch": S.batch = id; renderBody(); break;
    case "go": if (!e.target.closest("[data-stop]")) window.location.href = linkProfile(id); break;
    case "menu": openMenu(id); break;
    case "close": closeOverlay(); break;
    case "ch-new": openChallengeModal(id); break;
    case "ch-accept": run(() => acceptChallenge(id, me()), "চ্যালেঞ্জ গ্রহণ করা হয়েছে", "challenges"); break;
    case "ch-reject": run(() => rejectChallenge(id, me()), "বাদ দেওয়া হয়েছে", "challenges"); break;
    case "ch-cancel": run(() => cancelChallenge(id, me()), "বাতিল করা হয়েছে", "challenges"); break;
    case "fr-add": run(() => sendFriendRequest(me(), id), "অনুরোধ পাঠানো হয়েছে"); break;
    case "fr-accept": run(() => acceptFriendRequest(id, me()), "বন্ধু যুক্ত হলো"); break;
    case "fr-reject": run(() => rejectFriendRequest(id), "বাদ দেওয়া হয়েছে"); break;
    case "fr-remove": if (confirm("এই বন্ধুকে তালিকা থেকে সরাবে?")) run(() => removeFriend(me(), id), "বন্ধুত্ব শেষ হয়েছে"); break;
    case "rival-set": run(() => setRival(me(), id), "রাইভাল ঠিক করা হয়েছে"); break;
    case "rival-clear": run(() => clearRival(me()), "রাইভাল সরানো হয়েছে"); break;
    case "cheer": run(() => sendCheer(me(), id, t.dataset.x), "উৎসাহ পাঠানো হয়েছে"); break;
  }
});
</script>
</body>
