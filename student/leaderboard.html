<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লিডারবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* ---- Clean Card-based Leaderboard Rows ---- */
  .lb-card {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--surface); border: 1px solid var(--surface-border);
    border-radius: 12px; margin-bottom: 8px; transition: transform 0.2s;
  }
  .lb-card.is-me { border-color: var(--color-accent); background: var(--color-accent-soft); }
  
  .lb-rank { width: 32px; text-align: center; font-weight: 800; font-size: 1.1rem; color: var(--text-muted); flex-shrink: 0; }
  .lb-rank.top1 { color: #f5b301; font-size: 1.4rem; }
  .lb-rank.top2 { color: #94a3b8; font-size: 1.3rem; }
  .lb-rank.top3 { color: #cd7f32; font-size: 1.2rem; }
  
  .lb-avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-soft); color: var(--color-accent); font-weight: 800;
  }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom:4px; }
  
  .points-pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
    background: rgba(245, 179, 1, 0.15); color: #b45309; border-radius: 99px;
    font-weight: 800; font-size: 0.75rem;
  }

  .lb-friend-btn {
    flex-shrink: 0; font-size: 0.7rem; font-weight: 700; padding: 6px 10px; border-radius: 8px;
    border: none; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .btn-compare { background: var(--color-accent-soft); color: var(--color-accent); }
  .btn-add { background: var(--surface-border); color: var(--text-secondary); }
  
  /* ---- Super Smooth CSS Marquee Activity Feed ---- */
  .feed-container { overflow: hidden; white-space: nowrap; width: 100%; position: relative; padding-bottom: 8px; }
  .feed-scroll { 
    display: inline-flex; gap: 12px; width: max-content;
    animation: marquee 25s linear infinite; 
  }
  .feed-scroll:hover { animation-play-state: paused; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .feed-card { flex-shrink: 0; width: 250px; padding: 12px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface); white-space: normal; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, renderStudentHeader, showToast, friendlyError } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { getLeaderboardData, getAllApprovedResults } from "../js/utils/results-utils.js";
import { getMyFriendIds, getOutgoingRequests, sendFriendRequest } from "../js/utils/friend-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    render();
  });
}

let allLeaderboard = [];
let myFriendIds = [];
let activeClassFilter = "all";
let friendsOnly = false;

function render() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "leaderboard")}

    <!-- 1. Leaderboard at the TOP -->
    <div class="mt-2">
      <div class="flex justify-between items-center mb-3">
        <h2 style="font-size: 1.1rem; font-weight: 800;">🏆 র‍্যাঙ্কিং ও পয়েন্টস</h2>
        <button class="btn btn-secondary btn-sm" id="friendsToggleBtn">সবাই</button>
      </div>
      <div id="classFilterRow" class="flex gap-2 mb-3" style="overflow-x:auto;"></div>
      <div id="leaderboardList"></div>
    </div>

    <!-- 2. Activity Feed at the BOTTOM -->
    <div id="activityFeedSection" class="mt-5"></div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("friendsToggleBtn").addEventListener("click", () => {
    friendsOnly = !friendsOnly;
    document.getElementById("friendsToggleBtn").textContent = friendsOnly ? "শুধু বন্ধুরা" : "সবাই";
    renderLeaderboardList();
  });

  loadEverything();
}

async function loadEverything() {
  try {
    const [students, board, friendIds, allResults] = await Promise.all([
      getActiveStudents(),
      getLeaderboardData(await getActiveStudents()),
      getMyFriendIds(student.studentId),
      getAllApprovedResults()
    ]);
    allLeaderboard = board;
    myFriendIds = friendIds;

    renderClassFilterRow();
    renderLeaderboardList();
    renderActivityFeed(allResults, students);
  } catch (err) {
    console.error(err);
    showToast(friendlyError(err), "error");
  }
}

function renderClassFilterRow() {
  const el = document.getElementById("classFilterRow");
  const classes = [...new Set(allLeaderboard.map(r => r.className).filter(Boolean))].sort();
  el.innerHTML = [
    `<button class="btn btn-sm ${activeClassFilter === "all" ? "btn-primary" : "btn-secondary"}" data-class="all" style="flex-shrink:0;">সব</button>`,
    ...classes.map(c => `<button class="btn btn-sm ${activeClassFilter === c ? "btn-primary" : "btn-secondary"}" data-class="${c}" style="flex-shrink:0;">${c}</button>`)
  ].join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    activeClassFilter = b.dataset.class;
    renderClassFilterRow();
    renderLeaderboardList();
  }));
}

async function renderLeaderboardList() {
  const el = document.getElementById("leaderboardList");
  let rows = allLeaderboard;
  if (activeClassFilter !== "all") rows = rows.filter(r => r.className === activeClassFilter);
  if (friendsOnly) rows = rows.filter(r => myFriendIds.includes(r.studentId) || r.studentId === student.studentId);

  if (rows.length === 0) {
    renderState(el, "empty", friendsOnly ? "কোনো বন্ধুর ফলাফল এখনো নেই।" : "এখনো কোনো রেজাল্ট নেই।");
    return;
  }

  const outgoing = await getOutgoingRequests(student.studentId);
  const pendingToIds = new Set(outgoing.map(r => r.toStudentId));
  const myIndex = rows.findIndex(r => r.studentId === student.studentId);

  el.innerHTML = rows.map((r, i) => {
    const rankClass = i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
    const isMe = r.studentId === student.studentId;
    const isFriend = myFriendIds.includes(r.studentId);
    const isPending = pendingToIds.has(r.studentId);
    
    const isTarget = (!isMe && myIndex > 0 && i === myIndex - 1 && !friendsOnly);
    const targetBadge = isTarget ? `<span style="font-size:0.6rem; background:#fef08a; color:#854d0e; padding:2px 6px; border-radius:4px; font-weight:800; margin-left:6px; vertical-align:middle;">🔥 টার্গেট</span>` : "";

    let friendBtn = "";
    if (!isMe) {
      if (isFriend) friendBtn = `<a href="../student/comparison.html?friendId=${r.studentId}" class="lb-friend-btn btn-compare">তুলনা</a>`;
      else if (isPending) friendBtn = `<span class="lb-friend-btn" style="color:var(--text-muted); border:1px solid var(--surface-border);">পাঠানো</span>`;
      else friendBtn = `<button class="lb-friend-btn btn-add add-friend-btn" data-id="${r.studentId}">+ বন্ধু</button>`;
    }
    
    return `
      <div class="lb-card ${isMe ? "is-me" : ""}">
        <span class="lb-rank ${rankClass}">${i + 1}</span>
        <span class="lb-avatar">${r.photoURL ? `<img src="${r.photoURL}" alt="">` : r.name.charAt(0)}</span>
        <div class="lb-info">
          <div class="lb-name">${r.name}${isMe ? " (তুমি)" : ""}${targetBadge}</div>
          <div class="points-pill">⭐ ${r.totalPoints || 0} পয়েন্ট <span style="color:var(--text-muted); font-weight:600; margin-left:4px;">(${r.avgPercentage || 0}%)</span></div>
        </div>
        ${friendBtn}
      </div>
    `;
  }).join("");

  el.querySelectorAll(".add-friend-btn").forEach(b => b.addEventListener("click", async () => {
    try {
      await sendFriendRequest(student.studentId, b.dataset.id);
      showToast("অনুরোধ পাঠানো হয়েছে।", "success");
      renderLeaderboardList();
    } catch (err) {
      showToast(friendlyError(err), "error");
    }
  }));
}

function renderActivityFeed(results, students) {
  const el = document.getElementById("activityFeedSection");
  const feed = results.filter(r => myFriendIds.includes(r.studentId)).slice(0, 5);
  
  if (feed.length === 0) return;

  const nameOf = {}; students.forEach(s => { nameOf[s.studentId] = s.name; });
  
  // Create feed items
  const feedHtml = feed.map(r => `
    <div class="feed-card">
       <p class="text-xs text-muted mb-1">🔥 লাইভ আপডেট</p>
       <p class="text-sm" style="font-weight:600; line-height:1.4;">
         ${nameOf[r.studentId]} <span style="color:var(--color-accent);">${r.examName || "পরীক্ষা"}</span>-এ ${r.percentage}% পেয়েছে!
       </p>
    </div>
  `).join("");
  
  // Duplicate feedHtml so the marquee loops seamlessly
  el.innerHTML = `
    <p class="eyebrow mb-2">বন্ধুদের লাইভ আপডেট</p>
    <div class="feed-container">
      <div class="feed-scroll">
        ${feedHtml}${feedHtml}
      </div>
    </div>
  `;
}
</script>
</body>
</html>
