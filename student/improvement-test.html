<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>উন্নতির অনুশীলন — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/exam-ui.css">
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="exam-page" oncontextmenu="return false;">
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getAssignedImprovementTest } from "../js/utils/improvement-test-utils.js";
import { calculateImprovement } from "../js/utils/improvement-utils.js";
import { computeImprovementPracticeXP } from "../js/utils/xp-utils.js";
import { updateImprovementRequestAfterCompletion } from "../js/utils/improvement-test-completion.js";
import { formatHms } from "../js/utils/grading-utils.js";
import {
  initExamPage, bindThemeButtons, themeButtonHtml, introHtml, runShellHtml, questionHtml,
  setQuestionCounter, setProgress, fillPalette, submitMessage
} from "../js/utils/exam-ui.js";
import { db } from "../js/firebase/firebase-config.js";
import {
  collection, doc, getDocs, query, where, setDoc, serverTimestamp, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

initTheme();
initExamPage();

const shell = document.getElementById("shell");
const params = new URLSearchParams(location.search);
const testId = params.get("testId");
const student = getActiveStudent();

let test = null;
let questions = [];
let answers = {};
let marked = {};
let index = 0;
let startedAt = Date.now();
let durationMinutes = 20;
let timerHandle = null;
let submitting = false;
let inProgress = false;
let earlierAttempts = 0;   // completed attempts of this test by this student (repeats earn no XP)
const firedMinutes = new Set();

const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const localKey = () => `improvement:${testId}:${student.studentId}`;

/* ---------- question helpers (options may be {A,B,C,D} or an array) ---------- */
function optionSource(q) {
  for (const src of [q.options_bn, q.options_en, q.options]) {
    if (src && typeof src === "object" && Object.keys(src).length) return src;
  }
  return {};
}
function optionLetters(q) {
  const src = optionSource(q);
  if (Array.isArray(src)) return src.map((_, i) => String.fromCharCode(65 + i));
  const letters = ["A", "B", "C", "D"].filter(l => src[l] !== undefined);
  return letters.length ? letters : ["A", "B", "C", "D"];
}
function optionText(q, letter) {
  const src = optionSource(q);
  const raw = Array.isArray(src) ? src[letter.charCodeAt(0) - 65] : src[letter];
  if (raw && typeof raw === "object") return raw.text_bn || raw.text || raw.label || "";
  return raw ?? "";
}
const sameAnswer = (a, b) => String(a ?? "").trim().toUpperCase() === String(b ?? "").trim().toUpperCase();

/* ---------- persistence ---------- */
let syncTimer = null;
function persist() {
  try { localStorage.setItem(localKey(), JSON.stringify({ answers, marked, index, startedAt })); } catch {}
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, "improvementAttempts", `${testId}_${student.studentId}_active`), {
        testId, studentId: student.studentId, answers, index,
        startedAtMillis: startedAt, status: "in_progress", updatedAt: serverTimestamp()
      }, { merge: true });
    } catch (err) { console.warn("Improvement progress sync failed", err); }
  }, 800);
}
function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(localKey()) || "null");
    if (data && data.answers) {
      answers = data.answers; marked = data.marked || {};
      index = Math.min(Math.max(0, Number(data.index) || 0), questions.length - 1);
      startedAt = Number(data.startedAt) || Date.now();
      return true;
    }
  } catch {}
  return false;
}

/* ---------- boot ---------- */
async function boot() {
  if (!student) { location.href = "../index.html"; return; }
  if (!testId) { renderState(shell, "error", "Improvement Test শনাক্ত করা যায়নি।"); return; }

  try {
    test = await getAssignedImprovementTest(testId, student.studentId);
    if (!test) { renderState(shell, "error", "এই অনুশীলনটি এখন উপলব্ধ নয়। এটি হয় প্রকাশিত হয়নি, মুছে ফেলা হয়েছে, অথবা তোমার জন্য বরাদ্দ করা হয়নি।"); return; }

    questions = (Array.isArray(test.snapshot?.questions) ? test.snapshot.questions : [])
      .filter(q => q && q.questionId && q.correctAnswer);
    if (!questions.length) { renderState(shell, "error", "এই অনুশীলনে এখন কোনো বৈধ প্রশ্ন নেই।"); return; }

    durationMinutes = Number(test.durationMinutes || Math.max(5, Math.ceil(questions.length * 1.5)));
    try { earlierAttempts = await getAttemptCount(); } catch (err) { console.warn("Attempt count skipped:", err); }

    if (loadLocal()) { renderExamShell(); startTimer(); }
    else renderIntro();
  } catch (err) {
    console.error(err);
    renderState(shell, "error", "অনুশীলন লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করো।");
  }
}

/* ---------- intro ---------- */
function renderIntro() {
  shell.innerHTML = introHtml({
    backHref: "./improvement.html",
    title: "অনুশীলন শুরুর আগে",
    name: esc(test.title || "উন্নতির অনুশীলন"),
    description: esc(test.description || "তোমার নির্দিষ্ট দুর্বলতা উন্নত করার জন্য এই অনুশীলনটি তৈরি করা হয়েছে।"),
    stats: [
      { label: "মোট প্রশ্ন", value: questions.length },
      { label: "সময়কাল", value: `${durationMinutes} মি` }
    ],
    notes: [
      "শুরু করার মুহূর্ত থেকেই সময় গণনা শুরু হবে।",
      "সময় শেষ হলে অনুশীলনটি স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।",
      "জমা দেওয়ার পর কোনো উত্তর পরিবর্তন করা যাবে না।",
      earlierAttempts > 0
        ? "<strong>এই অনুশীলন তুমি আগে দিয়েছ। আবার দিতে পারবে, তবে নতুন XP পাবে না।</strong>"
        : "এটি অফিসিয়াল পরীক্ষা নয়। প্রথমবার দিলে এর XP তোমার মোট XP-তে যোগ হবে, পরের বার দিলে XP বাড়বে না।"
    ],
    startLabel: "অনুশীলন শুরু করো"
  });
  bindThemeButtons(shell);

  document.getElementById("startBtn").addEventListener("click", renderNote);
}

/* ---------- pre-exam summary note ---------- */
// New feature: before the actual improvement exam starts, show the student a
// summary note built from the already-generated explanation_bn of exactly
// the questions that will appear in THIS exam (not the whole topic's bank) --
// so they can read/study it first. Explanations are already embedded in the
// improvementTestSnapshot the student loaded (test.snapshot.questions), so
// this needs no extra Firestore reads and no access to the admin-only
// `questions` collection.
function renderNote() {
  const cards = questions.map((q, i) => {
    const qText = q.question_bn || q.question_en || q.question || "";
    const exp = String(q.explanation_bn || "").trim();
    return `
      <section class="ex-card">
        <p class="ex-desc"><b>${i + 1}.</b> ${qText}</p>
        ${exp ? `<p class="ex-desc">${exp}</p>` : `<p class="ex-desc"><i>এই প্রশ্নের ব্যাখ্যা যোগ করা নেই।</i></p>`}
      </section>`;
  }).join("");

  shell.innerHTML = `
    <header class="ex-topbar"><div class="ex-topbar-in">
      <button class="ex-icon-btn" id="noteBackBtn" type="button" aria-label="ফিরে যান">←</button>
      <h2 class="ex-page-title">আগে পড়ে নাও</h2>
      <div class="ex-actions">${themeButtonHtml()}</div>
    </div></header>
    <main class="ex-main">
      <section class="ex-card">
        <p class="ex-notes-title">এই অনুশীলনের প্রশ্নগুলো এখান থেকেই আসবে — শুরু করার আগে ভালো করে পড়ে নাও।</p>
      </section>
      ${cards}
    </main>
    <nav class="ex-nav"><div class="ex-nav-in single">
      <button class="ex-btn ex-btn-primary" id="noteStartBtn" type="button">অনুশীলন শুরু করো</button>
    </div></nav>
  `;
  bindThemeButtons(shell);
  document.getElementById("noteBackBtn").addEventListener("click", renderIntro);
  document.getElementById("noteStartBtn").addEventListener("click", () => {
    startedAt = Date.now();
    persist();
    renderExamShell();
    startTimer();
  });
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise().catch(() => {});
}

/* ---------- exam shell ---------- */
function renderExamShell() {
  shell.innerHTML = runShellHtml({ name: student.name, photoURL: student.photoURL, total: questions.length });
  bindThemeButtons(shell);

  document.getElementById("prevBtn").addEventListener("click", () => navigate(-1));
  document.getElementById("nextBtn").addEventListener("click", () => navigate(1));
  document.getElementById("paletteBtn").addEventListener("click", openPalette);
  document.getElementById("closePaletteBtn").addEventListener("click", closePalette);
  document.getElementById("submitBtn").addEventListener("click", openSubmitModal);
  document.getElementById("cancelSubmitBtn").addEventListener("click", closeSubmitModal);
  document.getElementById("confirmSubmitBtn").addEventListener("click", () => doSubmit(false));
  document.getElementById("figurePreviewModal").addEventListener("click", () => {
    document.getElementById("figurePreviewModal").classList.add("hidden");
    document.getElementById("figurePreviewImg").src = "";
  });
  document.getElementById("paletteOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closePalette(); });
  document.getElementById("submitModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeSubmitModal(); });

  if (!inProgress) {
    inProgress = true;
    window.addEventListener("beforeunload", leaveGuard);
  }
  renderQuestion();
}

function leaveGuard(e) { if (!inProgress) return; e.preventDefault(); e.returnValue = ""; }

function renderQuestion() {
  const q = questions[index];
  setQuestionCounter(index, questions.length);
  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").disabled = index === questions.length - 1;
  setProgress(Object.keys(answers).length, questions.length);

  const selected = answers[q.questionId];
  const isMarked = !!marked[q.questionId];
  const body = document.getElementById("questionBody");
  body.classList.remove("q-enter"); void body.offsetWidth; body.classList.add("q-enter");

  // Question and option text is admin-authored (may contain math/HTML), same as exam.html.
  body.innerHTML = questionHtml({
    questionBn: q.question_bn || q.question_en || q.question || "প্রশ্নের লেখা পাওয়া যায়নি।",
    questionEn: q.question_bn ? q.question_en : "",
    imageUrl: q.imageUrl,
    options: optionLetters(q).map(letter => ({ letter, text: optionText(q, letter) })),
    selected, isMarked
  });

  body.querySelectorAll(".ex-option").forEach(btn => btn.addEventListener("click", () => selectAnswer(q.questionId, btn.dataset.letter)));
  document.getElementById("markReviewBtn").addEventListener("click", () => { marked[q.questionId] = !marked[q.questionId]; persist(); renderQuestion(); });
  const shield = body.querySelector(".img-shield");
  if (shield) shield.addEventListener("click", () => {
    document.getElementById("figurePreviewImg").src = shield.dataset.url;
    document.getElementById("figurePreviewModal").classList.remove("hidden");
  });

  if (window.MathJax?.typesetPromise) MathJax.typesetPromise().catch(() => {});
}

function selectAnswer(questionId, letter) {
  if (answers[questionId] === letter) delete answers[questionId]; else answers[questionId] = letter;
  persist();

  const body = document.getElementById("questionBody");
  body.querySelectorAll(".ex-option").forEach(btn => {
    btn.classList.toggle("selected", btn.dataset.letter === answers[questionId]);
    btn.classList.remove("option-flash");
  });
  if (answers[questionId]) {
    const tapped = body.querySelector(`.ex-option[data-letter="${answers[questionId]}"]`);
    if (tapped) { void tapped.offsetWidth; tapped.classList.add("option-flash"); }
  }
  setProgress(Object.keys(answers).length, questions.length);
}

function navigate(delta) {
  const next = index + delta;
  if (next < 0 || next >= questions.length) return;
  index = next; persist(); renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openPalette() {
  fillPalette(questions.map((q, i) => ({ answered: !!answers[q.questionId], marked: !!marked[q.questionId], current: i === index })));
  document.getElementById("paletteGrid").querySelectorAll("[data-idx]").forEach(btn => btn.addEventListener("click", () => {
    index = Number(btn.dataset.idx); persist(); renderQuestion(); closePalette();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  document.getElementById("paletteOverlay").classList.remove("hidden");
}
function closePalette() { document.getElementById("paletteOverlay").classList.add("hidden"); }

function openSubmitModal() {
  const unanswered = questions.filter(q => !answers[q.questionId]).length;
  const flagged = questions.filter(q => marked[q.questionId]).length;
  document.getElementById("submitModalText").textContent = submitMessage(unanswered, flagged);
  document.getElementById("submitModal").classList.remove("hidden");
}
function closeSubmitModal() { document.getElementById("submitModal").classList.add("hidden"); }

/* ---------- timer ---------- */
function startTimer() { clearInterval(timerHandle); tick(); timerHandle = setInterval(tick, 1000); }
function tick() {
  const remaining = startedAt + durationMinutes * 60000 - Date.now();
  const display = document.getElementById("timerDisplay");
  if (display) {
    display.textContent = formatHms(Math.max(0, remaining));
    display.classList.toggle("timer-critical", remaining <= 60000 && remaining > 0);
    display.classList.toggle("timer-warning", remaining <= 300000 && remaining > 60000);
  }
  const mins = remaining / 60000;
  [5, 1].filter(m => m < durationMinutes).forEach(m => {
    if (mins <= m && mins > m - 1 && !firedMinutes.has(m)) {
      firedMinutes.add(m);
      showToast(m === 1 ? "আর মাত্র ১ মিনিট বাকি — সময় শেষ হলে উত্তর স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।" : `আর মাত্র ${m} মিনিট বাকি আছে।`, "error");
    }
  });
  if (remaining <= 0) { clearInterval(timerHandle); doSubmit(true); }
}

/* ---------- submit ---------- */
async function getAttemptCount() {
  const snap = await getDocs(query(
    collection(db, "improvementAttempts"),
    where("testId", "==", testId),
    where("studentId", "==", student.studentId)
  ));
  return snap.docs.filter(d => d.data().status === "completed").length;
}

async function doSubmit(auto) {
  if (submitting) return;
  submitting = true;
  clearInterval(timerHandle);
  clearTimeout(syncTimer);
  document.getElementById("submitModal")?.classList.add("hidden");
  shell.innerHTML = `<div class="state-block"><div class="spinner"></div><p class="text-sm text-muted mt-3" style="font-weight:800;">${auto ? "সময় শেষ — জমা দেওয়া হচ্ছে..." : "জমা দেওয়া হচ্ছে..."}</p></div>`;

  try {
    let correct = 0, attempted = 0, totalMarks = 0, obtainedMarks = 0;
    questions.forEach(q => {
      const marks = Number(q.marks) || 1;
      totalMarks += marks;
      const a = answers[q.questionId];
      if (a) {
        attempted++;
        if (sameAnswer(a, q.correctAnswer)) { correct++; obtainedMarks += marks; }
      }
    });

    const percentage = totalMarks ? Math.round(obtainedMarks / totalMarks * 1000) / 10 : 0;
    const accuracy = attempted ? Math.round(correct / attempted * 1000) / 10 : 0;

    const previousAccuracy = Number(test.baselineAccuracy ?? test.currentAccuracy ?? 0);
    const targetAccuracy = Number(test.targetAccuracy ?? 0);
    // Exam based improvement is compared like-for-like with the original exam: score %.
    const score = test.entityType === "exam" ? percentage : accuracy;
    const improvement = calculateImprovement({ previousAccuracy, practiceAccuracy: score, targetAccuracy });

    const attemptNumber = (await getAttemptCount()) + 1;
    const xp = computeImprovementPracticeXP({
      totalQuestions: questions.length, attempted, correctCount: correct, percentage,
      targetReached: improvement.targetReached, improvementPoints: improvement.improvementPoints, attemptNumber
    });

    await setDoc(doc(db, "improvementAttempts", `${testId}_${student.studentId}_${Date.now()}`), {
      testId, studentId: student.studentId,
      answers, startedAtMillis: startedAt, submittedAtMillis: Date.now(),
      totalQuestions: questions.length, attempted,
      correctCount: correct, wrongCount: attempted - correct, unansweredCount: questions.length - attempted,
      obtainedMarks, totalMarks, percentage, accuracy: score,
      previousAccuracy: improvement.previousAccuracy, targetAccuracy: improvement.targetAccuracy,
      improvementPoints: improvement.improvementPoints, targetReached: improvement.targetReached,
      meaningfulImprovement: improvement.meaningfulImprovement,
      xp: xp.xp, xpEarned: xp.xp, attemptNumber,
      status: "completed", createdAt: serverTimestamp()
    });

    // Result is saved. Everything below is best-effort and must never turn a
    // saved result into an error screen.
    // Students cannot delete (Firestore rules), so close the in-progress document instead.
    try {
      await setDoc(doc(db, "improvementAttempts", `${testId}_${student.studentId}_active`),
        { status: "submitted", updatedAt: serverTimestamp() }, { merge: true });
    } catch {}

    // Only the FIRST attempt settles the request; a repeat must not overwrite it.
    const requestId = test.requestId || (Array.isArray(test.requestIds) ? test.requestIds[0] : null) || null;
    if (requestId && attemptNumber === 1) {
      try {
        await updateImprovementRequestAfterCompletion(requestId, {
          accuracy: score, improvementPercent: improvement.improvementPoints, targetReached: improvement.targetReached
        });
      } catch (err) { console.warn("Improvement request status update skipped:", err); }
    }

    try { localStorage.removeItem(localKey()); } catch {}
    inProgress = false;
    window.removeEventListener("beforeunload", leaveGuard);
    window.dispatchEvent(new CustomEvent("improvement:completed", { detail: { testId, studentId: student.studentId, accuracy: score, xp: xp.xp } }));

    renderResult({ accuracy: score, improvement, xp: xp.xp, correct, total: questions.length, attempted, repeat: attemptNumber > 1 });
  } catch (err) {
    console.error(err);
    submitting = false;
    showToast("জমা দেওয়া যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করো।", "error");
    renderExamShell(); startTimer();
  }
}

function renderResult({ accuracy, improvement, xp, correct, total, attempted, repeat }) {
  const gain = improvement.improvementPoints;
  const examBased = test.entityType === "exam";
  shell.innerHTML = `
    <header class="ex-topbar"><div class="ex-topbar-in">
      <div style="width:38px;"></div>
      <h2 class="ex-page-title">অনুশীলনের ফলাফল</h2>
      <div class="ex-actions">${themeButtonHtml()}</div>
    </div></header>

    <main class="ex-main">
      <section class="ex-card ex-score">
        <small>${examBased ? "এই অনুশীলনে তোমার স্কোর" : "এই অনুশীলনে তোমার accuracy"}</small>
        <p class="big">${accuracy}%</p>
        <p class="sub">${improvement.targetReached ? "তোমার নির্ধারিত লক্ষ্য পূরণ হয়েছে।" : `লক্ষ্য: ${improvement.targetAccuracy}%`}</p>

        <div class="ex-stats">
          <div class="ex-stat"><small>সঠিক</small><b>${correct}/${total}</b></div>
          <div class="ex-stat"><small>উত্তর দিয়েছ</small><b>${attempted}/${total}</b></div>
          <div class="ex-stat"><small>${examBased ? "আগের স্কোর" : "আগের accuracy"}</small><b>${improvement.previousAccuracy}%</b></div>
          <div class="ex-stat"><small>উন্নতি</small><b>${gain >= 0 ? "+" : ""}${gain}</b></div>
        </div>

        ${repeat
          ? `<div class="ex-xp none"><b>+0 XP</b><span>পুনরায় দেওয়া অনুশীলনে XP বাড়ে না</span></div>`
          : `<div class="ex-xp"><b>+${xp} XP</b><span>তোমার মোট XP-তে যোগ হয়েছে</span></div>`}
      </section>

      <div class="ex-link-row">
        <a class="ex-btn ex-btn-ghost" href="./dashboard.html">ড্যাশবোর্ড</a>
        <a class="ex-btn ex-btn-primary" href="./improvement.html">উন্নতি পাতা</a>
      </div>
    </main>
  `;
  bindThemeButtons(shell);
}

boot();
</script>
</body>
</html>
