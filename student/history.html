<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষার ইতিহাস — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; }
  .app-shell { max-width: 560px; padding-bottom: 36px; margin: 0 auto; }

  /* ===== Shared flat card — no blur, no translucency ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
  }

  /* ===== Summary grid ===== */
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .summary-box {
    background: var(--surface-highlight); border: 1px solid var(--surface-border);
    border-radius: var(--radius-md); padding: 12px 6px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .sum-val { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-num); line-height: 1.2; }
  .sum-lbl { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); margin-top: 3px; }

  .sum-box-highlight { background: var(--color-accent-soft); border-color: rgba(var(--color-accent-rgb), 0.28); }
  .sum-box-highlight .sum-val { color: var(--color-accent); }

  .sum-breakdown { margin-top: 12px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-align: center; }

  /* ===== History list cards ===== */
  .history-card { padding: 0; overflow: hidden; }
  .hc-link { display: block; text-decoration: none; color: inherit; padding: var(--space-4); transition: background var(--transition); }
  .hc-link:active { background: var(--surface-highlight); }

  .hc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .hc-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hc-points {
    background: var(--color-accent-soft); color: var(--color-accent); border: 1px solid rgba(var(--color-accent-rgb), 0.25);
    font-size: 0.74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    font-family: var(--font-num); flex-shrink: 0;
  }

  .hc-meta { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  .hc-stats { display: flex; gap: 8px; border-top: 1px solid var(--surface-border); padding-top: 10px; }
  .hc-stat-box { flex: 1; background: var(--surface-highlight); border-radius: var(--radius-sm); padding: 7px 6px; text-align: center; }
  .hc-val { display: block; font-size: 0.95rem; font-weight: 800; color: var(--text-secondary); font-family: var(--font-num); }
  .hc-lbl { display: block; font-size: 0.63rem; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
  .stat-pct .hc-val { color: var(--text-primary); }
  .stat-correct .hc-val { color: var(--color-success); }

  /* ===== Per-exam point calculation ===== */
  .hc-calc { border-top: 1px solid var(--surface-border); }
  .hc-calc summary {
    cursor: pointer; list-style: none; padding: 10px var(--space-4); font-size: 0.78rem; font-weight: 700;
    color: var(--color-accent); display: flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
  }
  .hc-calc summary::-webkit-details-marker { display: none; }
  .hc-calc summary::before { content: "▸"; font-size: 0.7rem; transition: transform 150ms ease; }
  .hc-calc[open] summary::before { transform: rotate(90deg); }
  .hc-calc-body { padding: 0 var(--space-4) 12px; }
  .hc-calc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--surface-border); }
  .hc-calc-row small { display: block; font-size: 0.65rem; font-weight: 500; color: var(--text-muted); }
  .hc-calc-row .v { font-family: var(--font-num); font-weight: 800; color: var(--text-primary); white-space: nowrap; }
  .hc-calc-total { display: flex; justify-content: space-between; padding: 8px 0 0; font-size: 0.85rem; font-weight: 800; color: var(--color-accent); }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";
import { getApprovedResults, getStudentRank } from "../js/utils/results-utils.js";
import { computeStudentXP, getExamXPLines } from "../js/utils/xp-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getCompletedImprovementAttempts } from "../js/utils/improvement-xp-integration.js";
import { getStudentBattleXP } from "../js/utils/battle-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    renderPage();
  });
}

function fmtDate(ts) {
  return ts?.toDate ? ts.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—";
}

async function renderPage() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "history")}
    <div id="bodyContent" class="mt-4"><div class="spinner" style="margin:40px auto;"></div></div>
  `;

  const bodyContent = document.getElementById("bodyContent");

  try {
    // Fetch user results & Exact Leaderboard Points
    const [results, rankData, improvementResults, battleXP] = await Promise.all([
      getApprovedResults(student.studentId),
      getStudentRank(student.studentId),
      getCompletedImprovementAttempts(student.studentId).catch(() => []),
      getStudentBattleXP(student.studentId).catch(() => 0)
    ]);

    // Fetch all exams to calculate total exams conducted for this batch
    const examsSnap = await getDocs(collection(db, "exams"));
    let totalExamsConducted = 0;

    examsSnap.forEach(doc => {
      const data = doc.data();
      const validStatus = ["published", "completed", "archived"].includes(data.status);

      // Check if exam is for this student's batch (or open to all)
      let isForMe = true;
      if (data.targetBatch && data.targetBatch !== "all" && data.targetBatch !== student.className) isForMe = false;
      if (data.targetBatches && data.targetBatches.length > 0 && !data.targetBatches.includes(student.className)) isForMe = false;

      if (validStatus && isForMe) {
        totalExamsConducted++;
      }
    });

    // Fallback sanity check (cannot attend more than total)
    if (totalExamsConducted < results.length) totalExamsConducted = results.length;

    // Points: computed by the SAME engine the leaderboard and dashboard use, so
    // every exam's number below adds up to the total shown in the summary.
    const xp = computeStudentXP(results, { referralCount: rankData?.referralCount || 0, challengeBonusXP: rankData?.challengeXP || 0, improvementPracticeResults: improvementResults, battleXP });
    const totalPoints = xp.totalXP;
    const battleHistoryLink = `<a href="./battle-history.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;margin:12px 0;text-decoration:none;border:1px solid var(--surface-border);border-radius:var(--radius-md);font-weight:800;color:var(--text-primary);background:var(--surface);">Battle History</a>`;
    const xpByResult = {};
    xp.exams.forEach(e => { if (e.resultId) xpByResult[e.resultId] = e; });

    // Header Summary
    const summaryHtml = `
      <div class="card">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span style="font-size:1.05rem; font-weight:800; color:var(--text-primary);">আপনার রিপোর্ট কার্ড</span>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <span class="sum-val">${totalExamsConducted}</span>
            <span class="sum-lbl">মোট পরীক্ষা</span>
          </div>
          <div class="summary-box">
            <span class="sum-val">${results.length}</span>
            <span class="sum-lbl">অ্যাটেন্ড করেছে</span>
          </div>
          <div class="summary-box sum-box-highlight">
            <span class="sum-val">${totalPoints}</span>
            <span class="sum-lbl">সর্বমোট পয়েন্ট</span>
          </div>
        </div>
        ${(() => {
          const parts = [`পরীক্ষা থেকে ${xp.examXP}`];
          if (xp.referralXP > 0) parts.push(`বন্ধু রেফার ${xp.referralXP}`);
          if (xp.improvementPracticeXP > 0) parts.push(`উন্নতি অনুশীলন ${xp.improvementPracticeXP}`);
          if (xp.challengeXP > 0) parts.push(`চ্যালেঞ্জ ${xp.challengeXP}`);
          return parts.length > 1 ? `<p class="sum-breakdown">${parts.join(" + ")} = ${totalPoints} পয়েন্ট</p>` : "";
        })()}
      </div>
    `;

    // Empty State Check
    if (results.length === 0) {
      bodyContent.innerHTML = summaryHtml + `<div class="card text-center" style="color:var(--text-muted); font-weight:600;">এখনো কোনো অনুমোদিত পরীক্ষার ফলাফল নেই।</div>`;
      return;
    }

    // Sort results by newest first
    results.sort((a, b) => (b.submittedAt?.toMillis?.() ?? 0) - (a.submittedAt?.toMillis?.() ?? 0));

    // List Generation
    const listHtml = results.map(r => {
      // Points for THIS exam from the XP engine (not raw marks).
      const examXp = xpByResult[r.id];
      const pts = examXp ? examXp.xp : 0;
      const lines = examXp ? getExamXPLines(examXp.parts) : [];
      const totalQ = (r.correctCount || 0) + (r.wrongCount || 0) + (r.unansweredCount || 0);

      const calcHtml = lines.length ? `
        <details class="hc-calc">
          <summary>পয়েন্ট কীভাবে হলো</summary>
          <div class="hc-calc-body">
            ${lines.map(l => `
              <div class="hc-calc-row">
                <span>${l.label}<small>${l.hint}</small></span>
                <span class="v">+${l.xp}</span>
              </div>`).join("")}
            <div class="hc-calc-total"><span>মোট</span><span style="font-family:var(--font-num);">+${pts} pts</span></div>
          </div>
        </details>` : "";

      return `
        <div class="card history-card">
          <a href="../student/result.html?resultId=${r.id}" class="hc-link">
            <div class="hc-header">
              <div class="hc-title">${r.examName || "অজানা পরীক্ষা"}</div>
              <div class="hc-points">+${pts} pts</div>
            </div>
            <div class="hc-meta">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${fmtDate(r.submittedAt)}
            </div>

            <div class="hc-stats">
              <div class="hc-stat-box stat-pct">
                <span class="hc-val">${r.percentage ?? "—"}%</span>
                <span class="hc-lbl">স্কোর</span>
              </div>
              <div class="hc-stat-box">
                <span class="hc-val">${r.accuracy ?? "—"}%</span>
                <span class="hc-lbl">সঠিকতা</span>
              </div>
              <div class="hc-stat-box stat-correct">
                <span class="hc-val">${r.correctCount || 0}/${totalQ > 0 ? totalQ : '-'}</span>
                <span class="hc-lbl">সঠিক উত্তর</span>
              </div>
            </div>
          </a>
          ${calcHtml}
        </div>
      `;
    }).join("");

    bodyContent.innerHTML = summaryHtml + `<div style="font-weight:800; font-size:1rem; color:var(--text-primary); margin-bottom:10px; padding-left:2px;">পরীক্ষার তালিকা</div>` + listHtml;

  } catch (err) {
    console.error(err);
    renderState(bodyContent, "error", "ইতিহাস লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
  }
}
</script>
</body>
</html>
