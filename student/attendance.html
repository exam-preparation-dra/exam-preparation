<!DOCTYPE html>
<html lang="bn">
<head>
<script src="../js/utils/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>অ্যাটেনডেন্স — পরীক্ষা প্রস্তুতি</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#b8863c">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .a-sec { margin-top: 16px; }
  .a-title { font-size: 1.35rem; font-weight: 800; line-height: 1.3; }
  .a-sub { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); line-height: 1.5; }
  .a-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: 16px; }
  .a-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-size: 0.92rem; font-weight: 800; }
  .a-ic { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: var(--color-accent); background: rgba(var(--color-accent-rgb), .14); flex: none; }
  .a-ic svg { width: 15px; height: 15px; }

  /* summary */
  .a-hero { display: flex; align-items: center; gap: 18px; }
  .a-ring { position: relative; flex: none; width: 98px; height: 98px; }
  .a-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .a-ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .a-ring-c b { font-family: var(--font-num); font-size: 1.55rem; line-height: 1; font-weight: 800; }
  .a-ring-c span { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); margin-top: 3px; }
  .a-stats { flex: 1; min-width: 0; display: grid; gap: 0; }
  .a-stat { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
  .a-stat + .a-stat { border-top: 1px solid var(--surface-border); }
  .a-stat i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .a-stat b { margin-left: auto; font-family: var(--font-num); font-size: 1rem; font-weight: 800; color: var(--text-primary); }
  .a-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 14px; border-radius: var(--radius-md); border: 1px solid var(--surface-border); background: var(--surface-solid); color: var(--text-primary); font: inherit; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
  .a-btn:active { background: var(--surface-highlight); }
  .a-btn svg { color: var(--color-accent); }

  /* month calendar */
  .a-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .a-nav b { flex: 1; text-align: center; font-size: 0.95rem; font-weight: 800; }
  .a-nb { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--surface-border); background: var(--surface-solid); color: var(--text-secondary); cursor: pointer; }
  .a-nb:disabled { opacity: .3; cursor: default; }
  .a-nb svg { width: 16px; height: 16px; }
  .a-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .a-wd { text-align: center; font-size: 0.64rem; font-weight: 800; color: var(--text-muted); padding-bottom: 2px; }
  .a-d { position: relative; aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px; font-family: var(--font-num); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
  .a-d.has { color: var(--text-primary); font-weight: 800; }
  .a-d.p { background: rgba(47,125,94,.2); color: var(--color-success); }
  .a-d.x { background: rgba(214,80,60,.16); color: var(--color-danger); }
  .a-d.fut { opacity: .45; }
  .a-d.today { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
  .a-d.ex::after { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: #8b6cc8; }
  .a-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 0.68rem; font-weight: 700; color: var(--text-muted); }
  .a-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .a-legend i { width: 10px; height: 10px; border-radius: 4px; }
  .a-msum { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--surface-highlight); font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); }
  .a-msum b { font-family: var(--font-num); font-size: 1rem; font-weight: 800; color: var(--text-primary); }

  /* list */
  .a-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--surface-border); }
  .a-row:last-child { border-bottom: none; padding-bottom: 0; }
  .a-row:first-child { padding-top: 0; }
  .a-dot { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
  .a-dot svg { width: 15px; height: 15px; }
  .a-dot.p { background: rgba(47,125,94,.16); color: var(--color-success); }
  .a-dot.x { background: rgba(214,80,60,.14); color: var(--color-danger); }
  .a-row-main { flex: 1; min-width: 0; }
  .a-row-main strong { display: block; font-size: 0.86rem; font-weight: 800; }
  .a-row-main span { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }
  .a-tag { font-size: 0.64rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(var(--color-accent-rgb), .13); color: var(--color-accent); white-space: nowrap; }
  .a-tag.exam { background: rgba(139,108,200,.18); color: #a58ddb; }

  /* ranking */
  .a-reward { display: flex; gap: 11px; align-items: flex-start; padding: 11px 12px; border-radius: 12px; background: rgba(var(--color-accent-rgb), .1); border: 1px solid rgba(var(--color-accent-rgb), .25); margin-bottom: 8px; font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); line-height: 1.55; }
  .a-reward svg { flex: none; width: 18px; height: 18px; color: var(--color-accent); margin-top: 1px; }
  .a-reward b { font-family: var(--font-num); color: var(--color-accent); }
  .a-rank { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .a-pos { width: 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: .74rem; font-weight: 800; color: var(--text-secondary); background: var(--surface-highlight); flex: none; }
  .a-pos.p1 { background: var(--color-accent); color: #211a0d; } .a-pos.p2 { background: #8f9aa0; color: #fff; } .a-pos.p3 { background: #a5673f; color: #fff; }
  .a-rank-name { flex: 1; min-width: 0; font-size: .86rem; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-rank-me { background: rgba(var(--color-accent-rgb), .1); margin: 0 -8px; padding: 9px 8px; border-radius: 12px; }
  .a-rank-me .a-rank-name { color: var(--text-primary); font-weight: 800; }
  .a-rank-val { font-family: var(--font-num); font-weight: 700; font-size: .8rem; white-space: nowrap; color: var(--text-secondary); }
  .a-empty { text-align: center; padding: 10px 0; }
  .a-last { padding-bottom: 28px; }
</style>
<script src="../js/utils/nav-boot.js"></script>
<link rel="stylesheet" href="../css/desktop.css">
<script src="../js/utils/desktop-layout.js" defer></script>
<script src="../js/popup.js"></script>
</head>
<body data-page="attendance">
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderStudentHeader, renderState } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { normalizeBatch } from "../js/utils/batch-utils.js";
import { openAttendanceSheet } from "../js/utils/attendance-sheet.js";
import {
  getBatchDays, getStudentAttendance, getMonthAttendance, getAwards,
  computeAttendanceStats, rankMonth, monthOf, dateStr, fmtDate, fmtMonth, bn, DAY_TYPES, ATTENDANCE_MONTHLY_XP
} from "../js/utils/attendance-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();
if (!student) window.location.href = "../index.html";
else refreshActiveStudent(student.docId).then(f => { if (f) student = f; render(); });

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);
const I = (p, n = 16, w = 2.4) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const QR = '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17.5 21H21v-3.5"/>';
const OK = '<path d="m5 12.5 4.5 4.5L19 7.5"/>', NO = '<path d="M6 6l12 12M18 6 6 18"/>';
const CAL = '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>';
const TROPHY = '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>';
const WD = ["র", "সো", "ম", "বু", "বৃ", "শু", "শ"];

let state = { days: [], recs: [], awards: [], month: monthOf(dateStr()) };

async function render() {
  const batch = normalizeBatch(student.className);
  shell.innerHTML = `
    ${renderStudentHeader(student, "attendance")}
    <div class="a-sec">
      <h1 class="a-title">অ্যাটেনডেন্স</h1>
      <p class="a-sub">${batch ? esc(batch) + " · " : ""}ক্লাস ও পরীক্ষায় তোমার উপস্থিতি</p>
    </div>
    <div id="sumSec" class="a-sec"><div class="skeleton" style="height:190px;border-radius:20px;"></div></div>
    <div id="calSec" class="a-sec"></div>
    <div id="monthSec" class="a-sec a-last"></div>`;
  try {
    const [days, recs, awards] = await Promise.all([
      getBatchDays(student.className), getStudentAttendance(student.studentId), getAwards().catch(() => [])
    ]);
    state.days = days; state.recs = recs; state.awards = awards;
    const ms = monthsList();
    if (!ms.includes(state.month)) state.month = ms[ms.length - 1] || monthOf(dateStr());
    drawSummary(); drawCalendar();
    drawMonth().catch(e => console.error(e));
  } catch (e) {
    console.error(e);
    renderState($("sumSec"), "error", "অ্যাটেনডেন্স লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।");
  }
}
const monthsList = () => [...new Set([...state.days.map(d => monthOf(d.date)), monthOf(dateStr())])].sort();

function drawSummary() {
  const st = computeAttendanceStats(state.days, state.recs);
  const R = 46, C = 2 * Math.PI * R, pct = st.pct ?? 0;
  $("sumSec").innerHTML = `
    <div class="a-card">
      <div class="a-hero">
        <div class="a-ring" role="img" aria-label="উপস্থিতি ${bn(pct)}%">
          <svg viewBox="0 0 110 110" aria-hidden="true">
            <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--surface-edge)" stroke-width="9"/>
            <circle id="aRing" cx="55" cy="55" r="${R}" fill="none" stroke="var(--color-accent)" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)" data-c="${C.toFixed(2)}" data-pct="${pct}"/>
          </svg>
          <div class="a-ring-c"><b>${st.pct == null ? "—" : bn(st.pct) + "%"}</b><span>উপস্থিতি</span></div>
        </div>
        <div class="a-stats">
          <div class="a-stat"><i style="background:var(--text-muted)"></i>মোট দিন<b>${bn(st.total)}</b></div>
          <div class="a-stat"><i style="background:var(--color-success)"></i>উপস্থিত<b>${bn(st.present)}</b></div>
          <div class="a-stat"><i style="background:var(--color-danger)"></i>অনুপস্থিত<b>${bn(st.absent)}</b></div>
        </div>
      </div>
      <button type="button" class="a-btn" id="aQrBtn">${I(QR, 17)} আমার অ্যাটেনডেন্স QR</button>
    </div>
    <p class="a-sub" style="margin:8px 4px 0;">অ্যাডমিন যত দিন ক্লাস/পরীক্ষা সেট করেছেন সেটাই ১০০%।${st.total ? "" : " এখনো কোনো দিন সেট হয়নি।"}</p>`;
  $("aQrBtn").onclick = () => openAttendanceSheet(student, { historyHref: null });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const r = $("aRing"); if (r) r.style.strokeDashoffset = (Number(r.dataset.c) * (1 - Number(r.dataset.pct) / 100)).toFixed(2);
  }));
}

function drawCalendar() {
  const ms = monthsList(), i = ms.indexOf(state.month), today = dateStr();
  const [y, m] = state.month.split("-").map(Number);
  const first = new Date(y, m - 1, 1).getDay(), len = new Date(y, m, 0).getDate();
  const present = new Set(state.recs.map(r => r.date));
  const byDate = Object.fromEntries(state.days.filter(d => monthOf(d.date) === state.month).map(d => [d.date, d]));
  const st = computeAttendanceStats(state.days, state.recs, { month: state.month });
  let cells = WD.map(w => `<div class="a-wd">${w}</div>`).join("") + `<div></div>`.repeat(first);
  for (let d = 1; d <= len; d++) {
    const ds = `${state.month}-${String(d).padStart(2, "0")}`, day = byDate[ds];
    const cls = ["a-d"];
    if (day) { cls.push("has"); if (ds > today) cls.push("fut"); else cls.push(present.has(ds) ? "p" : "x"); if (day.type === "exam") cls.push("ex"); }
    if (ds === today) cls.push("today");
    cells += `<div class="${cls.join(" ")}">${bn(d)}</div>`;
  }
  $("calSec").innerHTML = `
    <div class="a-card">
      <div class="a-nav">
        <button class="a-nb" id="mPrev" ${i <= 0 ? "disabled" : ""} aria-label="আগের মাস">${I('<path d="m15 18-6-6 6-6"/>')}</button>
        <b>${fmtMonth(state.month)}</b>
        <button class="a-nb" id="mNext" ${i >= ms.length - 1 ? "disabled" : ""} aria-label="পরের মাস">${I('<path d="m9 18 6-6-6-6"/>')}</button>
      </div>
      <div class="a-cal">${cells}</div>
      <div class="a-legend"><span><i style="background:rgba(47,125,94,.5)"></i>উপস্থিত</span><span><i style="background:rgba(214,80,60,.45)"></i>অনুপস্থিত</span><span><i style="background:#8b6cc8;border-radius:50%;width:7px;height:7px"></i>পরীক্ষা</span></div>
      <div class="a-msum"><span>এই মাসে</span><span>${st.total ? `<b>${bn(st.present)}/${bn(st.total)}</b> দিন · <b>${bn(st.pct)}%</b>` : "কোনো দিন নেই"}</span></div>
      ${st.rows.length ? `<div style="margin-top:14px">${st.rows.map(r => `
        <div class="a-row">
          <span class="a-dot ${r.present ? "p" : "x"}">${I(r.present ? OK : NO, 15, 3)}</span>
          <div class="a-row-main"><strong>${fmtDate(r.date, { weekday: "long", day: "numeric", month: "long" })}</strong>${r.note ? `<span>${esc(r.note)}</span>` : ""}</div>
          <span class="a-tag ${r.type === "exam" ? "exam" : ""}">${DAY_TYPES[r.type] || "ক্লাস"}</span>
        </div>`).join("")}</div>` : ""}
    </div>`;
  $("mPrev").onclick = () => { state.month = ms[i - 1]; drawCalendar(); };
  $("mNext").onclick = () => { state.month = ms[i + 1]; drawCalendar(); };
}

async function drawMonth() {
  const el = $("monthSec");
  const month = monthOf(dateStr());
  const [recs, students] = await Promise.all([getMonthAttendance(month), getActiveStudents()]);
  const myBatch = normalizeBatch(student.className);
  const ranked = rankMonth(month, students, state.days.map(d => ({ ...d, batch: myBatch })), recs.filter(r => normalizeBatch(r.batch) === myBatch))
    .filter(r => r.batch === myBatch);
  const myWins = state.awards.filter(a => (a.winners || []).some(w => w.studentId === student.studentId));
  const medal = (i) => i === 0 ? "p1" : i === 1 ? "p2" : i === 2 ? "p3" : "";
  const myIdx = ranked.findIndex(r => r.studentId === student.studentId);
  const shown = ranked.slice(0, 3);
  if (myIdx > 2) shown.push(ranked[myIdx]);
  el.innerHTML = `
    <div class="a-card">
      <div class="a-h"><span style="display:flex;align-items:center;gap:9px"><span class="a-ic">${I(TROPHY, 15, 2.2)}</span>${fmtMonth(month)} — মাসের সেরা</span></div>
      <div class="a-reward">${I(TROPHY, 18, 2.2)}<span>মাস শেষে তোমার ব্যাচে সবচেয়ে বেশি উপস্থিত যে, সে পাবে <b>+${bn(ATTENDANCE_MONTHLY_XP)} XP</b>।${myWins.length ? ` তুমি এ পর্যন্ত <b>${bn(myWins.length)}</b> বার পেয়েছো।` : ""}</span></div>
      ${shown.length ? shown.map(r => {
        const i = ranked.indexOf(r), me = r.studentId === student.studentId;
        return `<div class="a-rank ${me ? "a-rank-me" : ""}"><span class="a-pos ${medal(i)}">${bn(i + 1)}</span><span class="a-rank-name">${esc(r.name)}${me ? " (তুমি)" : ""}</span><span class="a-rank-val">${bn(r.present)}/${bn(r.total)} · ${bn(r.pct)}%</span></div>`;
      }).join("") : `<p class="a-sub a-empty">এই মাসে এখনো কারো উপস্থিতি জমা হয়নি।</p>`}
    </div>`;
}
</script>
</body>
</html>
