<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ড্যাশবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }

  .glass.card {
    animation: cardRise 420ms cubic-bezier(.22,.9,.3,1) both;
    transition: transform var(--transition-lift, 220ms ease), box-shadow var(--transition-lift, 220ms ease);
  }
  @keyframes cardRise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (hover: hover) {
    #upcomingSection .glass.card:hover,
    #subjectSection .glass.card:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); }
  }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  /* ===== Premium Hero Points Card Animations ===== */
  .hero-points-card {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    border-radius: 20px;
    padding: 24px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 24px -8px rgba(234, 88, 12, 0.5);
    animation: cardRise 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  
  /* Shimmering effect across the card */
  .hero-points-card::after {
    content: '';
    position: absolute;
    top: 0; left: -150%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-25deg);
    animation: shine 4s infinite;
  }
  @keyframes shine {
    0% { left: -150%; }
    20% { left: 150%; }
    100% { left: 150%; }
  }

  /* Floating animation for the SVG icon */
  .hero-icon-container {
    animation: floatIcon 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 12px rgba(154, 52, 18, 0.4));
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ===== Staggered Stats ===== */
  #statsSection .grid-2 .glass.card:nth-child(1) { animation-delay: 40ms; }
  #statsSection .grid-2 .glass.card:nth-child(2) { animation-delay: 90ms; }
  #statsSection .grid-2 .glass.card:nth-child(3) { animation-delay: 140ms; }
  #statsSection .grid-2 .glass.card:nth-child(4) { animation-delay: 190ms; }

  .trend-bar {
    flex: 1; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--color-accent), var(--color-accent-2));
    background-size: 100% 200%;
    height: 0%;
    transition: height 700ms cubic-bezier(.22,.9,.3,1);
    animation: trendShimmer 2.6s linear infinite;
  }
  @keyframes trendShimmer { 0% { background-position: 0 0%; } 100% { background-position: 0 100%; } }

  .progress-track { overflow: hidden; }
  .progress-fill { width: 0%; transition: width 900ms cubic-bezier(.22,.9,.3,1); }
  .weak-alert-icon { animation: weakPulse 2.2s ease-in-out infinite; }
  @keyframes weakPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .btn { transition: transform 140ms ease, filter 180ms ease; }
  .btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent } from "../js/utils/student-utils.js";
import { subscribeToUpcomingExams, getApprovedResults, getStudentResultStatusMap, getStudentRank } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeOverallStats, computeSubjectStats, computeTopicStats } from "../js/utils/analytics-utils.js";
import { generateMotivation } from "../js/utils/motivation-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    render();
  });
}

function animateCountUp(el, target, duration = 800, suffix = "") {
  if (!el || typeof target !== "number" || isNaN(target)) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = `${target}${suffix}`; return; }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = `${Math.round(target * eased)}${suffix}`;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function render() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "dashboard")}
    
    <!-- Premium Hero Points Section (Moved to TOP) -->
    <div id="pointsHeroSection" class="mt-4"></div>
    
    <div id="motivationSection"></div>
    <div id="upcomingSection" class="mt-4"></div>
    <div id="statsSection" class="mt-5"></div>
    <div id="subjectSection" class="mt-5"></div>
    <div id="weakTopicSection" class="mt-5"></div>
    
    <!-- Original Buttons -->
    <div class="mt-5 flex gap-2">
      <a href="../student/analytics.html" class="btn btn-secondary">বিস্তারিত বিশ্লেষণ</a>
      <a href="../student/comparison.html" class="btn btn-secondary">তুলনা দেখুন</a>
    </div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  loadMotivation();
  loadUpcoming();
  loadPerformance();
}

async function loadMotivation() {
  const el = document.getElementById("motivationSection");
  try {
    const [rank, results, subjects] = await Promise.all([
      getStudentRank(student.studentId),
      getApprovedResults(student.studentId),
      getSubjects()
    ]);
    
    if (results.length === 0) return; 

    const overall = computeOverallStats(results);
    const subjectStats = computeSubjectStats(results, buildNameMap(subjects));
    let weakest = null, strongest = null;
    (subjectStats || []).forEach(s => {
      if (!weakest || s.accuracy < weakest.accuracy) weakest = s;
      if (!strongest || s.accuracy > strongest.accuracy) strongest = s;
    });

    const advice = generateMotivation({
      overallPercentage: overall?.avgPercentage,
      rank: rank?.rank,
      totalStudents: rank?.totalStudents,
      examsTaken: overall?.examsTaken ?? results.length,
      weakestSubjectName: weakest?.name,
      weakestSubjectAccuracy: weakest?.accuracy,
      strongestSubjectName: strongest?.name !== weakest?.name ? strongest?.name : null,
      strongestSubjectAccuracy: strongest?.accuracy
    });

    el.innerHTML = `
      <div class="glass card mt-3" style="background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(37,99,235,0.08)); border: 1px solid rgba(124,58,237,0.2);">
        <div class="flex items-start gap-3">
          <span style="font-size:1.4rem;">💡</span>
          <div>
            <p class="text-sm" style="font-weight:700; color: var(--color-accent); margin-bottom:4px;">আজকের বিশ্লেষণ</p>
            <p class="text-sm" style="line-height:1.6; color: var(--text-secondary);">${advice}</p>
          </div>
        </div>
      </div>
    `;
  } catch (err) {
    console.error("Motivation load failed:", err);
  }
}

let unsubscribeUpcoming = null;
async function loadUpcoming() {
  const el = document.getElementById("upcomingSection");
  el.innerHTML = `<p class="eyebrow mb-2">আসন্ন পরীক্ষা</p><div class="glass card skeleton" style="height:90px;margin-top:8px;"></div>`;
  try {
    const [subjects, chapters, resultMap] = await Promise.all([
      getSubjects(), getChapters(), getStudentResultStatusMap(student.studentId)
    ]);
    const subjectMap = buildNameMap(subjects);
    const chapterMap = buildNameMap(chapters);

    if (unsubscribeUpcoming) unsubscribeUpcoming();
    unsubscribeUpcoming = subscribeToUpcomingExams(
      (exams) => renderUpcomingExams(el, exams, subjectMap, chapterMap, resultMap),
      (err) => { console.error(err); renderState(el, "error", "আসন্ন পরীক্ষা লোড করা যায়নি।"); }
    );
  } catch (err) {
    console.error(err);
    renderState(el, "error", "আসন্ন পরীক্ষা লোড করা যায়নি।");
  }
}

function renderUpcomingExams(el, exams, subjectMap, chapterMap, resultMap) {
  if (exams.length === 0) {
    el.innerHTML = `<p class="eyebrow">আসন্ন পরীক্ষা</p>`;
    const box = document.createElement("div");
    box.className = "mt-2";
    renderState(box, "empty", "এখন কোনো পরীক্ষা নির্ধারিত নেই।");
    el.appendChild(box);
    return;
  }

  el.innerHTML = `<p class="eyebrow">আসন্ন পরীক্ষা</p>` + exams.map(exam => {
    const dateStr = exam.examDate?.toDate ? exam.examDate.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "";
    const subjNames = (exam.subjectIds || []).map(id => subjectMap[id]).filter(Boolean).join(", ");
    const chapNames = (exam.chapterIds || []).map(id => chapterMap[id]).filter(Boolean).join(", ");
    const own = resultMap[exam.id];
    let actionHtml = "";
    if (own?.status === "approved") {
      actionHtml = `<a href="../student/result.html?resultId=${own.resultId}" class="btn btn-secondary mt-3">ফলাফল দেখুন</a>`;
    } else if (own?.status === "pending") {
      actionHtml = `<p class="text-xs text-muted mt-3">জমা দেওয়া হয়েছে — অনুমোদনের অপেক্ষায়।</p>`;
    } else if (exam.status === "published") {
      actionHtml = `<a href="../student/exam.html?examId=${exam.id}" class="btn btn-primary mt-3">পরীক্ষা শুরু করুন</a>`;
    }
    return `
      <div class="glass card mt-2">
        <div class="flex justify-between items-center">
          <h3>${exam.name}</h3>
          <span class="badge badge-upcoming">${exam.status === "published" ? "প্রকাশিত" : "আসন্ন"}</span>
        </div>
        <div class="grid-2 mt-3">
          <div><p class="text-xs text-muted">তারিখ</p><p class="text-sm" style="font-weight:600;">${dateStr || "—"}</p></div>
          <div><p class="text-xs text-muted">সময়</p><p class="text-sm" style="font-weight:600;">${exam.informationalTime || "—"}</p></div>
          <div><p class="text-xs text-muted">সময়কাল</p><p class="text-sm" style="font-weight:600;">${exam.durationMinutes ? exam.durationMinutes + " মিনিট" : "—"}</p></div>
          <div><p class="text-xs text-muted">মোট নম্বর</p><p class="text-sm" style="font-weight:600;">${exam.totalMarks ?? "—"}</p></div>
        </div>
        ${subjNames ? `<p class="text-xs text-muted mt-3">বিষয়: <span style="color:var(--text-secondary);">${subjNames}</span></p>` : ""}
        ${chapNames ? `<p class="text-xs text-muted mt-2">অধ্যায়: <span style="color:var(--text-secondary);">${chapNames}</span></p>` : ""}
        ${actionHtml}
      </div>
    `;
  }).join("");
}

async function loadPerformance() {
  const ptsEl = document.getElementById("pointsHeroSection");
  const statsEl = document.getElementById("statsSection");
  const subjEl = document.getElementById("subjectSection");
  const weakEl = document.getElementById("weakTopicSection");
  
  ptsEl.innerHTML = `<div class="glass card skeleton" style="height:110px;"></div>`;
  statsEl.innerHTML = `<p class="eyebrow">পারফরম্যান্স সারাংশ</p><div class="glass card skeleton mt-2" style="height:120px;"></div>`;

  try {
    const [results, rank] = await Promise.all([
      getApprovedResults(student.studentId),
      getStudentRank(student.studentId)
    ]);
    const overall = computeOverallStats(results);
    const totalPoints = rank?.totalPoints || 0;
    const rankText = rank ? `${rank.rank} / ${rank.totalStudents}` : "—";

    if (!overall) {
      ptsEl.innerHTML = "";
      statsEl.innerHTML = `<p class="eyebrow">পারফরম্যান্স সারাংশ</p>`;
      const box = document.createElement("div");
      box.className = "mt-2";
      renderState(box, "empty", "এখনো কোনো অনুমোদিত ফলাফল নেই। প্রথম পরীক্ষার পর এখানে পারফরম্যান্স দেখা যাবে।");
      statsEl.appendChild(box);
      subjEl.innerHTML = ""; weakEl.innerHTML = "";
      return;
    }

    // Custom SVG Icon (Replaces Emoji)
    const diamondSvg = `
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="none">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#eab308" />
            <stop offset="100%" stop-color="#a16207" />
          </linearGradient>
        </defs>
        <path fill="url(#goldGrad)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        <path fill="#ffffff" opacity="0.4" d="M12 2l3.09 6.26L12 10.5V2z" />
      </svg>
    `;

    // Render Premium Points Hero Card
    ptsEl.innerHTML = `
      <div class="hero-points-card">
        <div>
          <p style="font-size: 0.85rem; font-weight: 700; opacity: 0.9; margin-bottom: 2px;">সর্বমোট অর্জিত পয়েন্ট</p>
          <h2 style="font-size: 2.6rem; font-weight: 900; line-height: 1.1; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
            <span class="num" id="heroTotalPoints">0</span>
          </h2>
          <p style="font-size: 0.8rem; font-weight: 600; opacity: 0.9; margin-top: 6px; background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 99px; display: inline-block;">
            বর্তমান র‍্যাঙ্ক: ${rankText}
          </p>
        </div>
        <div class="hero-icon-container">
          ${diamondSvg}
        </div>
      </div>
    `;

    // Render Rest of Stats without points card
    statsEl.innerHTML = `
      <p class="eyebrow">পারফরম্যান্স সারাংশ</p>
      <div class="grid-2 mt-2">
        <div class="glass card"><p class="text-xs text-muted">মোট পরীক্ষা</p><p style="font-size:1.5rem;font-weight:800;"><span class="num" id="statExams">0</span></p></div>
        <div class="glass card"><p class="text-xs text-muted">সঠিক উত্তর</p><p style="font-size:1.5rem;font-weight:800; color:var(--color-success);" class="num">${overall.totalCorrect}</p></div>
        <div class="glass card"><p class="text-xs text-muted">গড় শতাংশ</p><p class="stat-pct stat-pct--lg num" id="statAvgPct">0%</p></div>
        <div class="glass card"><p class="text-xs text-muted">গড় সঠিকতা</p><p class="stat-pct stat-pct--lg num" id="statAvgAcc">0%</p></div>
      </div>
      ${overall.mostRecent ? `
        <div class="glass card mt-3">
          <p class="eyebrow">সাম্প্রতিক ফলাফল</p>
          <div class="flex justify-between items-center mt-2">
            <div>
              <p style="font-weight:700;">${overall.mostRecent.examName || "পরীক্ষা"}</p>
              <p class="text-xs text-muted num">${overall.mostRecent.percentage ?? "—"}% • সঠিকতা ${overall.mostRecent.accuracy ?? "—"}%</p>
            </div>
            <a href="../student/result.html?resultId=${overall.mostRecent.id}" class="icon-btn">${icons.arrowRight}</a>
          </div>
        </div>` : ""}
      ${overall.trend ? `
        <div class="glass card mt-3">
          <p class="eyebrow">সার্বিক ধারা</p>
          <div class="flex items-end gap-2 mt-3" style="height:60px;">
            ${overall.trend.map(t => `<div class="trend-bar" data-h="${Math.max(6, (t.value || 0))}" title="${t.value ?? '—'}%"></div>`).join("")}
          </div>
        </div>` : `<p class="text-xs text-muted mt-3">ধারা দেখতে আরও পরীক্ষার ফলাফল প্রয়োজন।</p>`}
    `;

    requestAnimationFrame(() => {
      animateCountUp(document.getElementById("heroTotalPoints"), totalPoints, 1200);
      animateCountUp(document.getElementById("statExams"), Number(overall.examsTaken) || 0, 700);
      if (overall.avgPercentage != null) animateCountUp(document.getElementById("statAvgPct"), Number(overall.avgPercentage) || 0, 800, "%");
      if (overall.avgAccuracy != null) animateCountUp(document.getElementById("statAvgAcc"), Number(overall.avgAccuracy) || 0, 800, "%");
      document.querySelectorAll(".trend-bar").forEach(bar => {
        const h = bar.dataset.h || 6;
        requestAnimationFrame(() => { bar.style.height = `${h}%`; });
      });
    });

    const subjects = await getSubjects();
    const subjectMap = buildNameMap(subjects);
    const subjectStats = computeSubjectStats(results, subjectMap);
    subjEl.innerHTML = `<p class="eyebrow">বিষয়ভিত্তিক পারফরম্যান্স</p>` + (subjectStats.length === 0
      ? `<p class="text-xs text-muted mt-2">তথ্য নেই।</p>`
      : subjectStats.map(s => `
        <div class="glass card mt-2">
          <div class="flex justify-between items-center">
            <p style="font-weight:700;">${s.name}</p>
            <p class="stat-pct">${s.accuracy ?? "—"}%</p>
          </div>
          <div class="progress-track mt-2"><div class="progress-fill subj-progress" data-w="${s.accuracy ?? 0}"></div></div>
          <p class="text-xs text-muted mt-2 num">সঠিক ${s.correct} • ভুল ${s.wrong} • মোট নম্বর ${s.marks}</p>
        </div>
      `).join(""));
    requestAnimationFrame(() => {
      document.querySelectorAll(".subj-progress").forEach(bar => {
        const w = bar.dataset.w || 0;
        requestAnimationFrame(() => { bar.style.width = `${w}%`; });
      });
    });

    const { getTopics } = await import("../js/utils/syllabus-utils.js");
    const topics = await getTopics();
    const topicMap = buildNameMap(topics);
    const topicStats = computeTopicStats(results, topicMap);
    const weakTopics = topicStats.filter(t => t.isWeak);

    weakEl.innerHTML = `<p class="eyebrow">দুর্বল টপিক নির্দেশক</p>` + (weakTopics.length === 0
      ? `<p class="text-xs text-muted mt-2">${topicStats.length === 0 ? "পর্যাপ্ত তথ্য নেই।" : "কোনো ধারাবাহিক দুর্বল টপিক পাওয়া যায়নি।"}</p>`
      : weakTopics.map(t => `
        <div class="glass card mt-2" style="border-color:var(--color-danger)55;">
          <div class="flex items-center gap-3">
            <span class="icon-btn weak-alert-icon" style="color:var(--color-danger);">${icons.alert}</span>
            <div>
              <p style="font-weight:700;">${t.name}</p>
              <p class="text-xs text-muted">সাম্প্রতিক পরীক্ষাগুলোতে ধারাবাহিকভাবে কম সঠিকতা (${t.accuracy}%)</p>
            </div>
          </div>
        </div>
      `).join(""));

  } catch (err) {
    console.error(err);
    renderState(statsEl, "error", "পারফরম্যান্স তথ্য লোড করা যায়নি।");
  }
}
</script>
</body>
</html>
