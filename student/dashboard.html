<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ড্যাশবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#b8863c">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EP2.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  /* =========================================================
     Dashboard — flat "মার্কশিট" layout on the app's shared tokens.
     One loud moment: the ink-stamp hero (XP + level ring). The
     referral card gets a distinct ticket *shape* (it's a redeemable
     voucher, a different kind of object) but flat, accent-solid fill —
     no gradients, no blur, everything else quiet hairline cards.
     ========================================================= */
  .d-sec { margin-top: 18px; }
  .d-greet { margin-top: 2px; }
  .d-greet h1 { font-size: 1.4rem; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  .d-greet h1 span { color: var(--color-accent); }
  .d-greet p { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
  .d-h { font-size: 0.98rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .d-h svg { color: var(--color-accent); flex-shrink: 0; }
  .d-sub { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }

  .d-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: 14px;
  }

  /* ---------- "cards running low" reminder ---------- */
  .d-card-reminder {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--color-accent-soft); border: 1px solid rgba(var(--color-accent-rgb), 0.3);
    border-radius: var(--radius-lg); text-decoration: none; color: inherit; position: relative;
  }
  .d-card-reminder-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--color-accent); }
  .d-card-reminder-text { flex: 1; min-width: 0; }
  .d-card-reminder-title { font-weight: 800; font-size: 0.88rem; color: var(--text-primary); }
  .d-card-reminder-sub { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
  .d-card-reminder-close {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; color: var(--text-muted); background: transparent; border: none;
  }

  /* ---------- my cards (wallet): physical-card look, swipe on phone ---------- */
  .d-wallet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .d-wallet-head .d-h { margin: 0; }
  .d-wallet-buy { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 800; color: var(--color-accent); text-decoration: none; padding: 4px 2px; }
  .d-wallet-rail {
    display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px;
    scroll-snap-type: x mandatory; scroll-padding: 0 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .d-wallet-rail::-webkit-scrollbar { display: none; }
  .wc {
    --wc-a: #24425f; --wc-b: #16283d;
    position: relative; overflow: hidden; flex: 0 0 74%; max-width: 280px; min-height: 148px; scroll-snap-align: start;
    display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px 12px;
    border-radius: 20px; color: #f6f3ea; text-decoration: none; isolation: isolate;
    background: linear-gradient(145deg, var(--wc-a), var(--wc-b));
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 10px 24px rgba(15, 20, 30, .22);
    transition: transform .18s ease, box-shadow .2s ease;
  }
  .wc::before { content: ""; position: absolute; z-index: -1; right: -46px; top: -54px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,255,255,0) 68%); }
  .wc::after { content: ""; position: absolute; z-index: -1; left: -30px; bottom: -70px; width: 190px; height: 190px; border-radius: 50%; border: 26px solid rgba(255,255,255,.05); }
  .wc:active { transform: scale(.98); }
  .wc-time { --wc-a: #2d5a7b; --wc-b: #15283b; }
  .wc-hint { --wc-a: #a77a2c; --wc-b: #4d3611; }
  .wc-battle { --wc-a: #6d3f78; --wc-b: #2b1834; }
  .wc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wc-name { display: flex; align-items: center; gap: 9px; font-size: .86rem; font-weight: 800; letter-spacing: .01em; }
  .wc-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.16); }
  .wc-chip { width: 30px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.18)); opacity: .75; }
  .wc-bal { display: flex; align-items: baseline; gap: 7px; margin-top: 10px; }
  .wc-bal b { font-family: var(--font-num); font-size: 2.6rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .wc-bal small { font-size: .78rem; font-weight: 700; opacity: .75; }
  .wc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.16); font-size: .72rem; font-weight: 700; color: rgba(246,243,234,.82); }
  .wc-plus { flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: .72rem; font-weight: 800; color: #1b1b1b; background: rgba(255,255,255,.88); }
  .wc.empty { filter: saturate(.55) brightness(.9); }
  .wc.empty .wc-bal b { opacity: .55; }
  @media (min-width: 640px) {
    .d-wallet-rail { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; margin: 0; padding: 4px 0 6px; }
    .wc { flex: none; max-width: none; }
  }

  /* ---------- quick links ---------- */
  .d-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .d-link {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 86px; padding: 10px 2px; text-align: center;
    border-radius: var(--radius-md); border: 1px solid var(--surface-border); background: var(--surface-solid);
    font-weight: 700; font-size: 0.74rem; color: var(--text-primary);
    transition: background var(--transition);
  }
  .d-link-ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--color-accent-soft); }
  .d-link svg { color: var(--color-accent); }
  .d-link:active { background: var(--surface-highlight); }
  .d-link:focus-visible, .d-btn:focus-visible, .d-rules summary:focus-visible, .d-row-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* ---------- hero (ink stamp) ---------- */
  .d-hero {
    position: relative; overflow: hidden; color: #f3f1ea;
    border-radius: var(--radius-lg); padding: 18px 16px 14px;
    background: #21262f; isolation: isolate;
    display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center;
  }
  .d-hero::before { content: ""; position: absolute; z-index: -1; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(184,134,60,.28), rgba(184,134,60,0) 68%); }
  .d-hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(243,241,234,0.14); }
  .d-hs { text-align: center; }
  .d-hs + .d-hs { border-left: 1px solid rgba(243,241,234,0.14); }
  .d-hs b { display: block; font-family: var(--font-num); font-size: 1.25rem; font-weight: 700; color: #f3f1ea; line-height: 1.2; }
  .d-hs b small { font-size: .7rem; color: rgba(243,241,234,.55); font-weight: 600; }
  .d-hs span { font-size: 0.68rem; font-weight: 700; color: rgba(243,241,234,0.6); }
  .d-hero-label { font-size: 0.78rem; font-weight: 700; color: rgba(243,241,234,0.68); }
  .d-hero-xp {
    font-family: var(--font-num); font-weight: 700; font-size: 2.7rem; line-height: 1.08; letter-spacing: -0.02em; margin: 2px 0 8px;
    color: var(--color-accent);
  }
  .d-hero-xp small { font-size: 1rem; font-weight: 700; letter-spacing: 0; margin-left: 4px; color: rgba(243,241,234,0.6); }
  .d-hero-spendable { display: block; margin: 4px 0 10px; font-size: 0.78rem; font-weight: 700; color: rgba(243,241,234,0.75); text-decoration: none; }
  .d-hero-spendable b { font-family: var(--font-num); color: var(--color-accent); font-weight: 800; }
  .d-hero-spendable .d-hero-spent { margin-left: 4px; font-weight: 600; color: rgba(243,241,234,0.5); }
  .d-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .d-chip { font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(243,241,234,0.1); border: 1px solid rgba(243,241,234,0.16); color: rgba(243,241,234,0.9); }
  .d-chip b { font-family: var(--font-num); font-weight: 700; }
  .d-chip-gain { background: rgba(47,125,94,0.28); border-color: rgba(47,125,94,0.5); color: #a9d9bf; }

  .d-seal { position: relative; width: 100px; height: 100px; }
  .d-seal svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .d-seal-ring { transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  .d-seal-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .d-seal-center span { font-size: 0.65rem; font-weight: 700; color: rgba(243,241,234,0.6); }
  .d-seal-center b { font-family: var(--font-num); font-size: 2rem; line-height: 1; font-weight: 700; color: var(--color-accent); }

  .d-hero-foot { grid-column: 1 / -1; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(243,241,234,0.14); font-size: 0.78rem; font-weight: 600; color: rgba(243,241,234,0.8); line-height: 1.6; }
  .d-hero-foot b { font-family: var(--font-num); color: var(--color-accent); font-weight: 700; }

  /* ---------- upcoming exam ---------- */
  .d-exam { position: relative; padding-left: 18px; margin-top: 10px; }
  .d-exam::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--color-accent); }
  .d-exam-special::before { background: var(--color-danger); }
  .d-exam-title { font-size: 1rem; font-weight: 800; line-height: 1.4; }
  .d-tag { font-size: 0.66rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--color-accent-soft); color: var(--color-accent); white-space: nowrap; }
  .d-facts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border-top: 1px solid var(--surface-border); border-bottom: 1px solid var(--surface-border); }
  .d-fact { padding: 8px 8px; text-align: center; }
  .d-fact + .d-fact { border-left: 1px solid var(--surface-border); }
  .d-fact p:first-child { font-size: 0.66rem; color: var(--text-muted); font-weight: 700; }
  .d-fact p:last-child { font-size: 0.84rem; font-weight: 800; margin-top: 2px; }
  .d-xp-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 10px; }
  .d-xp-line p { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }
  .d-xp-line strong { font-family: var(--font-num); font-size: 1.3rem; font-weight: 700; color: var(--color-accent); white-space: nowrap; }
  .d-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; margin-top: 10px;
    border-radius: var(--radius-md); border: 1px solid var(--surface-border); font-weight: 800; font-size: 0.9rem; font-family: inherit; cursor: pointer;
    background: var(--surface-solid); color: var(--text-primary); transition: background var(--transition);
  }
  .d-btn:active { background: var(--surface-highlight); }
  .d-btn-primary { background: var(--color-accent); color: #211a0d; border: none; }
  .d-btn-ok { color: var(--color-success); border-color: rgba(47,125,94,0.4); }
  .d-note { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-top: 10px; }

  /* ---------- referral (compact: QR + progress + share dropdown) ---------- */
  .d-ref { padding: 14px; }
  .d-ref-row { display: flex; gap: 14px; align-items: center; }
  .d-ref-qr {
    position: relative; flex: none; width: 96px; height: 96px; padding: 7px; border-radius: 18px; cursor: pointer;
    background: #fff; border: 1px solid var(--surface-border); display: grid; place-items: center;
    transition: transform .15s ease, border-color .15s ease;
  }
  .d-ref-qr:active { transform: scale(.96); border-color: var(--color-accent); }
  .d-ref-qr img { display: block; width: 100%; height: 100%; }
  .d-ref-qr .spinner { margin: 0; }
  .d-ref-qr-zoom { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--color-accent); color: #211a0d; border: 2px solid var(--surface); }
  .d-ref-main { flex: 1; min-width: 0; }
  .d-ref-title { font-size: 0.95rem; font-weight: 800; line-height: 1.35; }
  .d-ref-title b { font-family: var(--font-num); color: var(--color-accent); }
  .d-ref-sub { font-size: 0.73rem; font-weight: 600; color: var(--text-muted); margin-top: 2px; line-height: 1.45; }
  .d-ref-sub b { color: var(--text-secondary); font-family: var(--font-num); }
  .d-ref-bar { height: 6px; border-radius: 6px; background: var(--surface-edge); overflow: hidden; margin-top: 9px; }
  .d-ref-bar i { display: block; height: 100%; border-radius: 6px; background: var(--color-accent); transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
  .d-ref-actions { position: relative; display: flex; gap: 8px; margin-top: 12px; }
  .d-rbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 13px; border-radius: 12px;
    font: inherit; font-size: 0.8rem; font-weight: 800; cursor: pointer; border: 1px solid var(--surface-border);
    background: var(--surface-solid); color: var(--text-primary); transition: background var(--transition);
  }
  .d-rbtn:active { background: var(--surface-highlight); }
  .d-rbtn.pri { background: var(--color-accent); color: #211a0d; border-color: transparent; flex: 1; }
  .d-rbtn svg { flex: none; }
  .d-rbtn .d-caret { transition: transform .18s ease; }
  .d-rbtn[aria-expanded="true"] .d-caret { transform: rotate(180deg); }
  .d-menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 25; min-width: 220px; padding: 6px;
    background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: 16px;
    box-shadow: 0 16px 38px rgba(20,18,10,0.2); transform-origin: top right;
  }
  .d-menu[hidden] { display: none; }
  .d-menu:not([hidden]) { animation: dMenuIn .16s cubic-bezier(.22,1,.36,1); }
  @keyframes dMenuIn { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
  .d-menu button {
    display: flex; align-items: center; gap: 11px; width: 100%; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 11px; text-align: left;
    background: none; color: var(--text-primary); font: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer;
  }
  .d-menu button:active { background: var(--color-accent-soft); }
  .d-menu button i { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent); }
  .d-ref-how { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--surface-border); font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); }
  .d-ref-how span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .d-ref-how em { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent); font-family: var(--font-num); font-size: 0.66rem; font-weight: 800; }
  .d-ref-how svg { color: var(--text-muted); flex: none; }
  .d-ref-joined { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 0.74rem; font-weight: 700; color: var(--text-secondary); }
  .d-ref-av { display: flex; }
  .d-ref-av i { width: 26px; height: 26px; border-radius: 50%; margin-left: -8px; display: grid; place-items: center; font-style: normal; font-size: 0.7rem; font-weight: 800; background: #21262f; color: var(--color-accent); border: 2px solid var(--surface); }
  .d-ref-av i:first-child { margin-left: 0; }
  @media (max-width: 359px) { .d-ref-qr { width: 80px; height: 80px; } .d-ref-how { font-size: 0.64rem; } }

  /* ---------- XP breakdown ---------- */
  .d-stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-edge); }
  .d-stack i { display: block; height: 100%; }
  .d-xrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--surface-border); }
  .d-xrow:last-of-type { border-bottom: none; }
  .d-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .d-xrow-name { flex: 1; min-width: 0; font-size: 0.85rem; font-weight: 700; }
  .d-xrow-name span { display: block; font-size: 0.67rem; font-weight: 600; color: var(--text-muted); }
  .d-xrow-val { font-family: var(--font-num); font-weight: 700; font-size: 0.94rem; }
  .d-rules { margin-top: 8px; border-top: 1px solid var(--surface-border); padding-top: 8px; }
  .d-rules summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 800; color: var(--color-accent); min-height: 32px; }
  .d-rules summary::-webkit-details-marker { display: none; }
  .d-rules summary svg { transition: transform var(--transition); }
  .d-rules[open] summary svg { transform: rotate(180deg); }
  .d-rules ul { list-style: none; margin-top: 6px; }
  .d-rules li { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); padding: 6px 0; line-height: 1.5; }
  .d-rules li b { color: var(--text-primary); font-weight: 800; }

  /* ---------- recent exams ---------- */
  .d-row-link { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-border); min-height: 50px; }
  .d-row-link:last-child { border-bottom: none; padding-bottom: 0; }
  .d-row-link:first-of-type { padding-top: 0; }
  .d-row-main { flex: 1; min-width: 0; }
  .d-row-main strong { display: block; font-size: 0.9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-row-main span { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
  .d-gain { font-family: var(--font-num); font-weight: 700; font-size: 0.86rem; padding: 4px 10px; border-radius: 999px; background: rgba(47,125,94,0.14); color: var(--color-success); white-space: nowrap; }

  /* ---------- note ---------- */
  .d-quote { border-left: 3px solid var(--color-accent); padding: 4px 0 4px 12px; }
  .d-quote p:first-child { font-size: 0.78rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
  .d-quote p:last-child { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); line-height: 1.65; }

  /* ---------- class ranking ---------- */
  .d-class { margin-top: 10px; }
  .d-class-name { font-size: 0.84rem; font-weight: 800; color: var(--color-accent); padding-bottom: 8px; border-bottom: 1px solid var(--surface-border); margin-bottom: 4px; }
  .d-rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .d-pos { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 0.76rem; font-weight: 700; color: #fff; background: var(--text-muted); flex-shrink: 0; }
  .d-pos-1 { background: var(--color-accent); } .d-pos-2 { background: #8f9aa0; } .d-pos-3 { background: #a5673f; }
  .d-rank-name { flex: 1; min-width: 0; font-size: 0.89rem; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-rank-me .d-rank-name { color: var(--text-primary); font-weight: 800; }
  .d-rank-me { background: var(--color-accent-soft); margin: 0 -10px; padding: 8px 10px; border-radius: var(--radius-md); }
  .d-rank-xp { font-family: var(--font-num); font-weight: 700; font-size: 0.87rem; }
  .d-gap { text-align: center; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 3px; line-height: 0.6; padding: 2px 0; }

  /* ---------- stats ---------- */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-IN");
const $ = (id) => document.getElementById(id);
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function countUp(el, target, duration = 1000) {
  if (!el || !Number.isFinite(target)) return;
  if (reduceMotion()) { el.textContent = fmt(target); return; }
  const start = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - t, 3))));
    if (t < 1) requestAnimationFrame(frame);
  })(start);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  }
}

/* ---------------- "টাইম কার্ড কমে যাচ্ছে" reminder (আর ব্যবহার হচ্ছে না — উপরের কার্ড ব্যালেন্স সেটা দেখায়) ---------------- */

  }

/* ---------------- upcoming exams (live) ---------------- */
let unsubscribeUpcoming = null;
/* ---------------- next-exam countdown ---------------- */
const startOfExam = (exam) => {
  const examMs = exam?.examDate?.toMillis?.();
  const publishMs = exam?.publishDate?.toMillis?.();
  return Math.max(Number.isFinite(examMs) ? examMs : 0, Number.isFinite(publishMs) ? publishMs : 0);
};
let timerCtx = { exams: [], resultMap: {}, el: null };
let timerInterval = null;

function nextExamFor(exams, resultMap) {
  const now = Date.now();
  return exams.filter(e => {
    const st = startOfExam(e);
    if (!st || st <= now) return false;
    if (resultMap[e.id]) return false;
    if (!isExamForStudent(e, student)) return false;
    return true;
  }).sort((a, b) => startOfExam(a) - startOfExam(b))[0] || null;
}

function fmtCountdown(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => String(n).padStart(2, "0");
  return (d > 0 ? d + "দিন " : "") + p(h) + ":" + p(m) + ":" + p(s);
}

function renderTimer() {
  const el = $("timerSection");
  if (!el) return;
  clearInterval(timerInterval);
  const next = isExamTimerHidden() ? null : nextExamFor(timerCtx.exams, timerCtx.resultMap);
  if (!next) { el.hidden = true; el.innerHTML = ""; return; }

  const target = startOfExam(next);
  el.hidden = false;
  el.innerHTML = `
    <button type="button" class="d-timer" id="dTimer" aria-label="পরের পরীক্ষার টাইমার">
      ${svg("clock", 18)}
      <span class="d-timer-name">পরের পরীক্ষা: ${esc(next.name)}</span>
      <span class="d-timer-time" id="tmrTime"></span>
    </button>`;
  const btn = $("dTimer"), tEl = $("tmrTime");
  let confirming = false, confirmTimer = null;

  const tick = () => {
    const left = target - Date.now();
    if (left <= 0) {            // exam time has come: drop the timer, show the exam card
      clearInterval(timerInterval);
      renderTimer();
      if (timerCtx.el) renderUpcoming(timerCtx.el, timerCtx.exams, timerCtx.resultMap);
      return;
    }
    btn.classList.toggle("d-timer-urgent", left < 10 * 60 * 1000);
    if (!confirming) tEl.textContent = fmtCountdown(left);
  };
  tick();
  timerInterval = setInterval(tick, 1000);

  // 1st tap -> shows "লুকাও"; 2nd tap (within 3s) -> hides. Turn back on from the avatar menu.
  btn.onclick = () => {
    if (!confirming) {
      confirming = true;
      tEl.textContent = "লুকাও";
      btn.classList.add("d-timer-confirm");
      confirmTimer = setTimeout(() => { confirming = false; btn.classList.remove("d-timer-confirm"); tick(); }, 3000);
    } else {
      clearTimeout(confirmTimer);
      setExamTimerHidden(true);
    }
  };
}
window.addEventListener("examtimer:change", renderTimer);

async function loadUpcoming() {
  const el = $("upcomingSection");
  try {
    const resultMap = await getStudentResultStatusMap(student.studentId).catch(() => ({}));
    if (unsubscribeUpcoming) unsubscribeUpcoming();
    unsubscribeUpcoming = subscribeToUpcomingExams(
      (exams) => {
        timerCtx = { exams, resultMap, el };
        renderUpcoming(el, exams, resultMap);
        renderTimer();
      },
      (err) => { console.error(err); el.hidden = true; }
    );
  } catch (err) { console.error(err); el.hidden = true; }
}

function renderUpcoming(el, exams, resultMap) {
  const now = Date.now();
  const startOf = (exam) => {
    const examMs = exam?.examDate?.toMillis?.();
    const publishMs = exam?.publishDate?.toMillis?.();
    return Math.max(Number.isFinite(examMs) ? examMs : 0, Number.isFinite(publishMs) ? publishMs : 0);
  };
  const endOfToday = new Date(now); endOfToday.setHours(23, 59, 59, 999);
  const DAY7 = 7 * 24 * 60 * 60 * 1000;
  const eligible = exams.filter(exam => {
    // An exam can be taken for 7 days from its date. It appears once its
    // day has come (later start time today => shown locked) and disappears
    // after the 7 days are over.
    const examMs = exam?.examDate?.toMillis?.();
    if (!Number.isFinite(examMs)) return false;
    if (now >= examMs + DAY7) return false;
    if (startOf(exam) > endOfToday.getTime()) return false;
    if (!isExamForStudent(exam, student)) { console.info("[exam hidden: batch/allowed]", exam.name, exam.targetBatch, student.className); return false; }
    return true;
  }).sort((x, y) => x.examDate.toMillis() - y.examDate.toMillis());
  // Only ONE exam at a time: the earliest one the student hasn't submitted yet;
  // if everything is submitted, the latest submitted one (so the result stays reachable).
  const notDone = eligible.find(e => !resultMap[e.id]);
  const list = notDone ? [notDone] : (eligible.length ? [eligible[eligible.length - 1]] : []);
  // Pending-exam popup: every time the dashboard opens (animated, name shown big).
  if (notDone && notDone.status === "published" && now >= startOf(notDone)) {
    showPendingExamAlert({ student, exam: notDone, examUrl: "../student/exam.html?examId=" + encodeURIComponent(notDone.id) });
  }
  if (list.length === 0) {
    el.hidden = false;
    el.innerHTML = `<p class="d-h">${svg("clock", 20)} চলমান পরীক্ষা</p><div class="d-card"><p class="d-sub" style="text-align:center;padding:6px 0;">এখন কোনো পরীক্ষা চালু নেই।</p></div>`;
    return;
  }

  el.hidden = false;
  el.innerHTML = `<p class="d-h">${svg("clock", 20)} চলমান পরীক্ষা</p>` + list.map(exam => {
    const d = exam.examDate?.toDate ? exam.examDate.toDate() : null;
    const dateStr = d ? d.toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) : "—";
    const own = resultMap[exam.id];
    const qCount = exam.questionIds ? exam.questionIds.length : 0;
    const marks = Number(exam.totalMarks) || 0;
    const maxXP = computeMaxExamXP({ questionCount: qCount || marks, totalMarks: marks });
    const special = exam.allowedStudents && exam.allowedStudents.length > 0;

    let action = "";
    if (own?.status === "approved") action = `<a href="../student/result.html?resultId=${esc(own.resultId)}" class="d-btn d-btn-ok">ফলাফল দেখুন</a>`;
    else if (own?.status === "pending") action = `<p class="d-note">জমা দেওয়া হয়েছে — অনুমোদনের অপেক্ষায়।</p>`;
    else if (now < startOf(exam)) {
      const st = new Date(startOf(exam));
      action = `<p class="d-note">শুরু হবে ${st.toLocaleDateString("bn-BD", { day: "numeric", month: "short" })}, ${st.toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" })}</p>`;
    }
    else if (exam.status === "published") action = `<a href="../student/exam.html?examId=${esc(exam.id)}" class="d-btn d-btn-primary">পরীক্ষা শুরু করুন</a>`;

    return `
      <div class="d-card d-exam ${special ? "d-exam-special" : ""}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <h3 class="d-exam-title">${esc(exam.name)}</h3>
          <span class="d-tag">${special ? "স্পেশাল" : (exam.status === "published" ? "প্রকাশিত" : "আসন্ন")}</span>
        </div>
        <div class="d-facts">
          <div class="d-fact"><p>তারিখ</p><p>${dateStr}</p></div>
          <div class="d-fact"><p>সময়</p><p class="num">${exam.durationMinutes ? exam.durationMinutes + " মি." : "—"}</p></div>
          <div class="d-fact"><p>প্রশ্ন</p><p class="num">${qCount || "—"}</p></div>
        </div>
        <p class="d-sub" style="margin:8px 0 0;">${exam.examDate?.toMillis ? "শেষ তারিখ: " + new Date(exam.examDate.toMillis() + 6 * 24 * 60 * 60 * 1000).toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) + " (৭ দিন সময়)" : ""}</p>
        <div class="d-xp-line">
          <p>এই পরীক্ষায় সর্বোচ্চ XP<br><span class="d-sub">উন্নতি ও ধারাবাহিকতা বোনাস আলাদা</span></p>
          <strong>${fmt(maxXP)}</strong>
        </div>
        ${(() => { const eb = !own && getEarlyBonus(exam, now); return eb ? `<div class="d-xp-line"><p>আজ দিলে এক্সট্রা বোনাস<br><span class="d-sub">${eb.day}ম দিন · যত দেরি তত কম, ${EXAM_BONUS.days.length} দিনে শেষ</span></p><strong>+${fmt(eb.bonus)}</strong></div>` : ""; })()}
        ${action}
      </div>`;
  }).join("");
}

/* ---------------- main data ---------------- */
async function loadMain() {
  try {
    // Dashboard is the page almost everyone opens first after logging in,
    // so this is where "accepted" challenges whose exam result is now in
    // get settled into "completed" (win/loss/draw + bonus XP decided).
    await resolveCompletedChallenges(student.studentId).catch(() => []);

    const [results, allStudents, subjects, topics, challengeBonusXP, improvementResults, battleXP, spentXP] = await Promise.all([
      getApprovedResults(student.studentId), getActiveStudents(), getSubjects(), getTopics(),
      getChallengeBonusXP(student.studentId).catch(() => 0),
      getCompletedImprovementAttempts(student.studentId).catch(() => []),
      getStudentBattleXP(student.studentId).catch(() => 0),
      getSpentXP(student.studentId).catch(() => 0)
    ]);
    const leaderboard = await getLeaderboardData(allStudents);

    const myRefs = allStudents.filter(s => s.referredBy === student.studentId && s.studentId !== student.studentId);
    const xp = computeStudentXP(results, { referralCount: myRefs.length, challengeBonusXP, improvementPracticeResults: improvementResults, battleXP, spentXP, student });
    const myIdx = leaderboard.findIndex(r => r.studentId === student.studentId);
    const rank = myIdx >= 0 ? { rank: myIdx + 1, total: leaderboard.length } : null;

    const ctx = {
      results, allStudents, leaderboard, xp, rank, myRefs, battleXP,
      overall: computeOverallStats(results),
      subjectMap: buildNameMap(subjects), topicMap: buildNameMap(topics),
      resultById: Object.fromEntries(results.map(r => [r.id, r]))
    };

    for (const fn of [renderHero, renderReferral, renderRecent]) {
      try { fn(ctx); } catch (e) { console.error(fn.name, e); }
    }
    animateBars();
  } catch (err) {
    console.error(err);
    renderState($("heroSection"), "error", "তথ্য লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।");
    $("referralSection").innerHTML = "";
  }
}

/* ---------------- hero ---------------- */
function renderHero({ xp, rank, leaderboard, overall, results }) {
  const lv = getLevelInfo(xp.totalXP);
  const R = 50, C = 2 * Math.PI * R;
  const last = xp.exams[0];
  const top = leaderboard[0];
  const iAmTop = top && top.studentId === student.studentId;

  let footTop = "";
  if (iAmTop) footTop = "তুমিই এখন লিডারবোর্ডের শীর্ষে।";
  else if (top && xp.totalXP > 0) footTop = `শীর্ষে আছে ${esc(top.name)} — তার থেকে <b>${fmt(Math.max(0, top.totalPoints - xp.totalXP))}</b> XP পিছিয়ে।`;

  $("heroSection").innerHTML = `
    <section class="d-hero" aria-label="তোমার XP ও লেভেল">
      <div>
        <p class="d-hero-label">সর্বমোট XP</p>
        <p class="d-hero-xp"><span id="heroXp">0</span><small>XP</small></p>
        <a href="../student/store.html" class="d-hero-spendable">
          খরচযোগ্য ব্যালেন্স <b class="num">${fmt(xp.spendableXP)}</b> XP
          ${xp.spentXP > 0 ? `<span class="d-hero-spent">(খরচ হয়েছে ${fmt(xp.spentXP)})</span>` : ""}
        </a>
        <div class="d-chips">
          ${last ? `<span class="d-chip d-chip-gain">শেষ পরীক্ষায় +<b>${fmt(last.xp)}</b></span>` : ""}
        </div>
      </div>
      <div class="d-seal" role="img" aria-label="লেভেল ${lv.level}, পরের লেভেলের ${lv.percentage}% সম্পন্ন">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="57" fill="none" stroke="rgba(184,134,60,0.22)" stroke-width="1.5" stroke-dasharray="2 5"/>
          <circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(243,241,234,0.12)" stroke-width="8"/>
          <circle class="d-seal-ring" id="sealRing" cx="60" cy="60" r="${R}" fill="none" stroke="#b8863c" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-c="${C.toFixed(2)}" data-pct="${lv.percentage}"/>
        </svg>
        <div class="d-seal-center"><span>লেভেল</span><b>${lv.level}</b></div>
      </div>
      <div class="d-hero-stats">
        <div class="d-hs"><b>${rank ? "#" + rank.rank : "—"}${rank ? `<small> /${rank.total}</small>` : ""}</b><span>র‍্যাঙ্ক</span></div>
        <div class="d-hs"><b>${fmt(results.length)}</b><span>পরীক্ষা দিয়েছ</span></div>
        <div class="d-hs"><b>${overall && overall.avgPercentage != null ? overall.avgPercentage + "<small>%</small>" : "—"}</b><span>গড় স্কোর</span></div>
      </div>
      <p class="d-hero-foot">
        ${lv.isMax ? "তুমি সর্বোচ্চ লেভেলে পৌঁছে গেছো।" : `লেভেল ${lv.nextLevel}-এ যেতে আর <b>${fmt(lv.xpNeeded)}</b> XP দরকার।`}
        ${footTop ? `<br>${footTop}` : ""}
      </p>
    </section>`;

  countUp($("heroXp"), xp.totalXP, 1200);
}

/* ---------------- referral (compact) ---------------- */
function renderReferral({ myRefs }) {
  const count = myRefs.length;
  const steps = [1, 3, 5, 10];
  const next = steps.find(n => n > count);
  const prev = [...steps].reverse().find(n => n <= count) || 0;
  const pct = next ? Math.round(((count - prev) / (next - prev)) * 100) : 100;
  const shown = myRefs.slice(0, 4);

  const sub = count === 0
    ? `প্রথম বন্ধু যুক্ত হলেই <b>+${REFERRAL_XP} XP</b> তোমার।`
    : next
      ? `এখন পর্যন্ত <b>${fmt(count * REFERRAL_XP)} XP</b> · আর <b>${next - count}</b> জন এলে মোট <b>${fmt(next * REFERRAL_XP)}</b>`
      : `${count} জনে মোট <b>${fmt(count * REFERRAL_XP)} XP</b> — প্রতি নতুন বন্ধুতে আরও +${REFERRAL_XP}`;

  $("referralSection").innerHTML = `
    <p class="d-h">${svg("gift", 20)} বন্ধু আনো, XP জেতো</p>
    <div class="d-card d-ref">
      <div class="d-ref-row">
        <button type="button" class="d-ref-qr" id="refQr" aria-label="QR বড় করে দেখো"><div class="spinner"></div></button>
        <div class="d-ref-main">
          <p class="d-ref-title">প্রতি বন্ধুতে <b>+${REFERRAL_XP} XP</b></p>
          <p class="d-ref-sub">${sub}</p>
          <div class="d-ref-bar"><i style="width:0" data-w="${pct}"></i></div>
        </div>
      </div>

      <div class="d-ref-actions">
        <button type="button" class="d-rbtn pri" id="refQrBtn">${svg("qr", 16)} QR দেখো</button>
        <button type="button" class="d-rbtn" id="refMenuBtn" aria-haspopup="true" aria-expanded="false">শেয়ার ${svg("down", 14).replace("<svg", '<svg class="d-caret"')}</button>
        <div class="d-menu" id="refMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-a="copy"><i>${svg("copy", 16)}</i>লিংক কপি করো</button>
          <button type="button" role="menuitem" data-a="wa"><i>${svg("msg", 16)}</i>WhatsApp-এ পাঠাও</button>
          <button type="button" role="menuitem" data-a="share"><i>${svg("share", 16)}</i>অন্য অ্যাপে শেয়ার</button>
        </div>
      </div>

      <div class="d-ref-how" aria-label="কীভাবে কাজ করে">
        <span><em>১</em>QR স্ক্যান</span>${svg("chev", 12)}
        <span><em>২</em>আবেদন</span>${svg("chev", 12)}
        <span><em>৩</em>অনুমোদন</span>${svg("chev", 12)}
        <span><em>+</em>XP জমা</span>
      </div>

      ${count > 0 ? `<div class="d-ref-joined"><div class="d-ref-av">${shown.map(s => `<i>${esc(String(s.name || "?").charAt(0))}</i>`).join("")}</div><span>${count} জন তোমার মাধ্যমে যুক্ত</span></div>` : ""}
    </div>`;

  const open = () => openInviteSheet(student, { xpPerFriend: REFERRAL_XP });
  $("refQr").addEventListener("click", open);
  $("refQrBtn").addEventListener("click", open);
  makeInviteQr(student, 320).then(url => {
    const b = $("refQr"); if (!b) return;
    b.innerHTML = url
      ? `<img src="${url}" alt="QR"><span class="d-ref-qr-zoom">${svg("expand", 12)}</span>`
      : `<span class="d-sub" style="text-align:center">QR নেই</span>`;
  });

  // share dropdown
  const btn = $("refMenuBtn"), menu = $("refMenu");
  const setMenu = (on) => { menu.hidden = !on; btn.setAttribute("aria-expanded", on ? "true" : "false"); };
  btn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener("click", (e) => {
    const a = e.target.closest("button[data-a]"); if (!a) return;
    e.stopPropagation(); setMenu(false);
    if (a.dataset.a === "copy") copyInvite(student);
    else if (a.dataset.a === "wa") whatsappInvite(student);
    else shareInvite(student);
  });
  document.addEventListener("click", () => { if (!menu.hidden) setMenu(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) setMenu(false); });
}


/* ---------------- recent exams with XP ---------------- */
function renderRecent({ xp, resultById }) {
  const el = $("recentSection");
  if (xp.exams.length === 0) { el.innerHTML = ""; return; }
  const rows = xp.exams.slice(0, 5);
  el.innerHTML = `<div id="claimMount"></div>` + `
    <p class="d-h">${svg("list", 20)} সাম্প্রতিক পরীক্ষা ও XP</p>
    <div class="d-card">
      ${rows.map(e => {
        const r = resultById[e.resultId] || {};
        const date = e.submittedAtMs ? new Date(e.submittedAtMs).toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) : "";
        return `
          <a class="d-row-link" href="../student/result.html?resultId=${esc(e.resultId)}">
            <div class="d-row-main">
              <strong>${esc(e.examName)}</strong>
              <span>${date} &nbsp;•&nbsp; ${e.percentage}% &nbsp;•&nbsp; ${r.totalQuestions || "—"} প্রশ্ন</span>
            </div>
            <span class="d-gain">+${fmt(e.xp)} XP</span>
          </a>`;
      }).join("")}
    </div>`;
  // Free card: only for the NEWEST exam; the widget itself hides when it is
  // already claimed or the exam's 7-day window is over.
  const newest = (resultById[rows[0].resultId] || {}).examId;
  if (newest) mountExamClaim($("claimMount"), { examId: newest, studentId: student.studentId, hideIfClaimed: true });
}






/* ---------------- one-time bar animations ---------------- */
function animateBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ring = $("sealRing");
    if (ring) ring.style.strokeDashoffset = (Number(ring.dataset.c) * (1 - Number(ring.dataset.pct) / 100)).toFixed(2);
    document.querySelectorAll(".d-trend i").forEach(b => { b.style.height = b.dataset.h + "%"; });
    document.querySelectorAll(".d-ref-bar i").forEach(b => { b.style.width = b.dataset.w + "%"; });
    document.querySelectorAll(".d-bar i").forEach(b => { b.style.width = b.dataset.w + "%"; });
  }));
}
