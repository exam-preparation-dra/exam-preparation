<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ড্যাশবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  /* =========================================================
     Dashboard — flat "মার্কশিট" layout on the app's shared tokens.
     One loud moment: the ink-stamp hero (XP + level ring). The
     referral card gets a distinct ticket *shape* (it's a redeemable
     voucher, a different kind of object) but flat, accent-solid fill —
     no gradients, no blur, everything else quiet hairline cards.
     ========================================================= */
  .d-sec { margin-top: 16px; }
  .d-h { font-size: 0.98rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .d-h svg { color: var(--color-accent); flex-shrink: 0; }
  .d-sub { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }

  .d-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: 14px;
  }

  /* ---------- quick links ---------- */
  .d-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .d-link {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    border-radius: var(--radius-md); border: 1px solid var(--surface-border); background: var(--surface-solid);
    font-weight: 700; font-size: 0.85rem; color: var(--text-primary);
    transition: background var(--transition);
  }
  .d-link:active { background: var(--surface-highlight); }
  .d-link:focus-visible, .d-btn:focus-visible, .d-rules summary:focus-visible, .d-row-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* ---------- hero (ink stamp) ---------- */
  .d-hero {
    position: relative; overflow: hidden; color: #f3f1ea;
    border-radius: var(--radius-lg); padding: 18px 16px 14px;
    background: #21262f;
    display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center;
  }
  .d-hero-label { font-size: 0.78rem; font-weight: 700; color: rgba(243,241,234,0.68); }
  .d-hero-xp {
    font-family: var(--font-num); font-weight: 700; font-size: 2.7rem; line-height: 1.08; letter-spacing: -0.02em; margin: 2px 0 8px;
    color: var(--color-accent);
  }
  .d-hero-xp small { font-size: 1rem; font-weight: 700; letter-spacing: 0; margin-left: 4px; color: rgba(243,241,234,0.6); }
  .d-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .d-chip { font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(243,241,234,0.1); border: 1px solid rgba(243,241,234,0.16); color: rgba(243,241,234,0.9); }
  .d-chip b { font-family: var(--font-num); font-weight: 700; }
  .d-chip-gain { background: rgba(47,125,94,0.28); border-color: rgba(47,125,94,0.5); color: #a9d9bf; }

  .d-seal { position: relative; width: 100px; height: 100px; }
  .d-seal svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .d-seal-ring { transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  .d-seal-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .d-seal-center span { font-size: 0.65rem; font-weight: 700; color: rgba(243,241,234,0.6); }
  .d-seal-center b { font-family: var(--font-num); font-size: 2rem; line-height: 1; font-weight: 700; color: var(--color-accent); }

  .d-hero-foot { grid-column: 1 / -1; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(243,241,234,0.14); font-size: 0.78rem; font-weight: 600; color: rgba(243,241,234,0.8); line-height: 1.6; }
  .d-hero-foot b { font-family: var(--font-num); color: var(--color-accent); font-weight: 700; }

  /* ---------- upcoming exam ---------- */
  .d-exam { position: relative; padding-left: 18px; margin-top: 10px; }
  .d-exam::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--color-accent); }
  .d-exam-special::before { background: var(--color-danger); }
  .d-exam-title { font-size: 1rem; font-weight: 800; line-height: 1.4; }
  .d-tag { font-size: 0.66rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--color-accent-soft); color: var(--color-accent); white-space: nowrap; }
  .d-facts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border-top: 1px solid var(--surface-border); border-bottom: 1px solid var(--surface-border); }
  .d-fact { padding: 8px 8px; text-align: center; }
  .d-fact + .d-fact { border-left: 1px solid var(--surface-border); }
  .d-fact p:first-child { font-size: 0.66rem; color: var(--text-muted); font-weight: 700; }
  .d-fact p:last-child { font-size: 0.84rem; font-weight: 800; margin-top: 2px; }
  .d-xp-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 10px; }
  .d-xp-line p { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }
  .d-xp-line strong { font-family: var(--font-num); font-size: 1.3rem; font-weight: 700; color: var(--color-accent); white-space: nowrap; }
  .d-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; margin-top: 10px;
    border-radius: var(--radius-md); border: 1px solid var(--surface-border); font-weight: 800; font-size: 0.9rem; font-family: inherit; cursor: pointer;
    background: var(--surface-solid); color: var(--text-primary); transition: background var(--transition);
  }
  .d-btn:active { background: var(--surface-highlight); }
  .d-btn-primary { background: var(--color-accent); color: #211a0d; border: none; }
  .d-btn-ok { color: var(--color-success); border-color: rgba(47,125,94,0.4); }
  .d-note { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-top: 10px; }

  /* ---------- referral ticket (redeemable voucher shape, flat accent fill) ---------- */
  .d-ticket { --perf: 88px; --r: 11px; color: #241d10; border-radius: 18px; overflow: hidden; background: var(--color-accent);
    -webkit-mask: radial-gradient(circle var(--r) at 0 var(--perf), #0000 calc(var(--r) - 1px), #000 var(--r)) left / 51% 100% no-repeat,
                  radial-gradient(circle var(--r) at 100% var(--perf), #0000 calc(var(--r) - 1px), #000 var(--r)) right / 51% 100% no-repeat;
            mask: radial-gradient(circle var(--r) at 0 var(--perf), #0000 calc(var(--r) - 1px), #000 var(--r)) left / 51% 100% no-repeat,
                  radial-gradient(circle var(--r) at 100% var(--perf), #0000 calc(var(--r) - 1px), #000 var(--r)) right / 51% 100% no-repeat;
  }
  .d-ticket h3, .d-ticket p { color: inherit; }
  .d-ticket-top { height: var(--perf); padding: 0 18px; display: flex; align-items: center; gap: 12px; }
  .d-ticket-amt { font-family: var(--font-num); font-weight: 700; font-size: 2.5rem; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
  .d-ticket-amt small { font-size: 0.95rem; letter-spacing: 0; margin-left: 3px; }
  .d-ticket-top h3 { font-size: 0.98rem; font-weight: 800; line-height: 1.3; }
  .d-ticket-top p { font-size: 0.74rem; font-weight: 600; color: rgba(36,29,16,0.72); margin-top: 3px; line-height: 1.45; }
  .d-ticket-perf { height: 0; margin: 0 16px; border-top: 2px dashed rgba(36,29,16,0.3); }
  .d-ticket-body { padding: 14px 16px 16px; }

  .d-linkrow { display: flex; gap: 8px; }
  .d-linkrow input {
    flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md); font-family: var(--font-en); font-size: 0.78rem; font-weight: 600;
    color: #241d10; background: rgba(255,255,255,0.55); border: 1px solid rgba(36,29,16,0.3); text-overflow: ellipsis;
  }
  .d-linkrow .d-btn { width: auto; margin: 0; padding: 0 16px; background: #21262f; color: var(--color-accent); border: none; }
  .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .d-actions .d-btn { margin: 0; background: rgba(255,255,255,0.5); color: #241d10; border: 1px solid rgba(36,29,16,0.22); }

  .d-ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
  .d-step { text-align: center; padding: 8px 2px; border-radius: var(--radius-sm); border: 1px solid rgba(36,29,16,0.25); }
  .d-step p:first-child { font-size: 0.7rem; font-weight: 700; color: rgba(36,29,16,0.7); }
  .d-step p:last-child { font-family: var(--font-num); font-size: 0.94rem; font-weight: 700; margin-top: 1px; }
  .d-step-done { background: #21262f; border-color: #21262f; }
  .d-step-done p:first-child { color: rgba(184,134,60,0.75); }
  .d-step-done p:last-child { color: var(--color-accent); }

  .d-ladder-msg { font-size: 0.8rem; font-weight: 700; margin-top: 10px; line-height: 1.55; }
  .d-ladder-msg b { font-family: var(--font-num); }

  .d-joined { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(36,29,16,0.22); }
  .d-joined-h { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 800; }
  .d-joined-h b { font-family: var(--font-num); }
  .d-joined-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .d-joined-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(255,255,255,0.55); font-size: 0.76rem; font-weight: 700; }
  .d-joined-pill i { width: 22px; height: 22px; border-radius: 50%; background: #21262f; color: var(--color-accent); font-style: normal; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; }
  .d-foot { font-size: 0.7rem; font-weight: 600; color: rgba(36,29,16,0.65); margin-top: 10px; line-height: 1.5; }

  /* ---------- XP breakdown ---------- */
  .d-stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-edge); }
  .d-stack i { display: block; height: 100%; }
  .d-xrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--surface-border); }
  .d-xrow:last-of-type { border-bottom: none; }
  .d-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .d-xrow-name { flex: 1; min-width: 0; font-size: 0.85rem; font-weight: 700; }
  .d-xrow-name span { display: block; font-size: 0.67rem; font-weight: 600; color: var(--text-muted); }
  .d-xrow-val { font-family: var(--font-num); font-weight: 700; font-size: 0.94rem; }
  .d-rules { margin-top: 8px; border-top: 1px solid var(--surface-border); padding-top: 8px; }
  .d-rules summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 800; color: var(--color-accent); min-height: 32px; }
  .d-rules summary::-webkit-details-marker { display: none; }
  .d-rules summary svg { transition: transform var(--transition); }
  .d-rules[open] summary svg { transform: rotate(180deg); }
  .d-rules ul { list-style: none; margin-top: 6px; }
  .d-rules li { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); padding: 6px 0; line-height: 1.5; }
  .d-rules li b { color: var(--text-primary); font-weight: 800; }

  /* ---------- recent exams ---------- */
  .d-row-link { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-border); min-height: 50px; }
  .d-row-link:last-child { border-bottom: none; padding-bottom: 0; }
  .d-row-link:first-of-type { padding-top: 0; }
  .d-row-main { flex: 1; min-width: 0; }
  .d-row-main strong { display: block; font-size: 0.9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-row-main span { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
  .d-gain { font-family: var(--font-num); font-weight: 700; font-size: 0.86rem; padding: 4px 10px; border-radius: 999px; background: rgba(47,125,94,0.14); color: var(--color-success); white-space: nowrap; }

  /* ---------- note ---------- */
  .d-quote { border-left: 3px solid var(--color-accent); padding: 4px 0 4px 12px; }
  .d-quote p:first-child { font-size: 0.78rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
  .d-quote p:last-child { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); line-height: 1.65; }

  /* ---------- class ranking ---------- */
  .d-class { margin-top: 10px; }
  .d-class-name { font-size: 0.84rem; font-weight: 800; color: var(--color-accent); padding-bottom: 8px; border-bottom: 1px solid var(--surface-border); margin-bottom: 4px; }
  .d-rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .d-pos { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 0.76rem; font-weight: 700; color: #fff; background: var(--text-muted); flex-shrink: 0; }
  .d-pos-1 { background: var(--color-accent); } .d-pos-2 { background: #8f9aa0; } .d-pos-3 { background: #a5673f; }
  .d-rank-name { flex: 1; min-width: 0; font-size: 0.89rem; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-rank-me .d-rank-name { color: var(--text-primary); font-weight: 800; }
  .d-rank-me { background: var(--color-accent-soft); margin: 0 -10px; padding: 8px 10px; border-radius: var(--radius-md); }
  .d-rank-xp { font-family: var(--font-num); font-weight: 700; font-size: 0.87rem; }
  .d-gap { text-align: center; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 3px; line-height: 0.6; padding: 2px 0; }

  /* ---------- stats ---------- */
  .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .d-stat { text-align: center; padding: 12px 4px; border-bottom: 1px solid var(--surface-border); }
  .d-stat:nth-child(n+4) { border-bottom: none; }
  .d-stat:not(:nth-child(3n+1)) { border-left: 1px solid var(--surface-border); }
  .d-stat p:first-child { font-size: 0.67rem; font-weight: 700; color: var(--text-muted); }
  .d-stat p:last-child { font-family: var(--font-num); font-size: 1.35rem; font-weight: 700; margin-top: 3px; }
  .d-trend { display: flex; align-items: flex-end; gap: 5px; height: 78px; margin-top: 10px; }
  .d-trend i { flex: 1; border-radius: 4px 4px 0 0; background: var(--color-accent); height: 0; transition: height 1s cubic-bezier(0.22, 1, 0.36, 1); }

  /* ---------- subjects / weak topics ---------- */
  .d-bar { height: 6px; border-radius: 5px; background: var(--surface-edge); overflow: hidden; margin-top: 7px; }
  .d-bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--color-accent); transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1); }
  .d-subj { padding: 10px 0; border-bottom: 1px solid var(--surface-border); }
  .d-subj:first-child { padding-top: 0; } .d-subj:last-child { border-bottom: none; padding-bottom: 0; }
  .d-subj-top { display: flex; justify-content: space-between; align-items: baseline; }
  .d-subj-top strong { font-size: 0.9rem; font-weight: 800; }
  .d-subj-top span { font-family: var(--font-num); font-weight: 700; color: var(--color-accent); }
  .d-subj-meta { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-top: 5px; }
  .d-weak { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 8px; border-radius: var(--radius-md); border: 1px solid rgba(166,64,47,0.28); border-left: 3px solid var(--color-danger); background: rgba(166,64,47,0.06); }
  .d-weak strong { display: block; font-size: 0.92rem; font-weight: 800; }
  .d-weak span { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
  .d-weak em { font-style: normal; font-family: var(--font-num); font-weight: 700; color: var(--color-danger); }

  .d-last { padding-bottom: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, renderState, renderStudentHeader, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { subscribeToUpcomingExams, getApprovedResults, getStudentResultStatusMap, getLeaderboardData, isExamAvailableNow } from "../js/utils/results-utils.js";
import { getSubjects, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeOverallStats, computeSubjectStats, computeTopicStats } from "../js/utils/analytics-utils.js";
import { generateMotivation } from "../js/utils/motivation-utils.js";
import { computeStudentXP, computeMaxExamXP, getLevelInfo, XP_CATEGORIES, REFERRAL_XP } from "../js/utils/xp-utils.js";
import { resolveCompletedChallenges, getChallengeBonusXP } from "../js/utils/challenge-utils.js";
import { getCompletedImprovementAttempts } from "../js/utils/improvement-xp-integration.js";
import { getStudentBattleXP } from "../js/utils/battle-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    render();
  });
}

/* ---------------- helpers ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-IN");
const $ = (id) => document.getElementById(id);
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function countUp(el, target, duration = 1000) {
  if (!el || !Number.isFinite(target)) return;
  if (reduceMotion()) { el.textContent = fmt(target); return; }
  const start = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - t, 3))));
    if (t < 1) requestAnimationFrame(frame);
  })(start);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  }
}

const ic = {
  chart: '<path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-5 5"/>',
  compare: '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  bolt: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  grid: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  alert: '<path d="M12 3L2.8 20h18.4L12 3z"/><path d="M12 9v5M12 17h.01"/>',
  msg: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 1 1 21 11.5z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  down: '<polyline points="6 9 12 15 18 9"/>',
  store: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'
};
const svg = (name, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[name]}</svg>`;

const CAT_COLORS = {
  correct: "#2f7d5e", participation: "#3e6e8c", effort: "#6f9a8d", accuracy: "#6b4e96", tier: "#b8863c",
  flawless: "#d27a3a", mastery: "#a05a8a", improvement: "#5b8f3a", streak: "#a6402f", referral: "#d9b06a"
};

/* ---------------- upcoming exams (live) ---------------- */
let unsubscribeUpcoming = null;
async function loadUpcoming() {
  const el = $("upcomingSection");
  try {
    const resultMap = await getStudentResultStatusMap(student.studentId);
    if (unsubscribeUpcoming) unsubscribeUpcoming();
    unsubscribeUpcoming = subscribeToUpcomingExams(
      (exams) => renderUpcoming(el, exams, resultMap),
      (err) => { console.error(err); el.hidden = true; }
    );
  } catch (err) { console.error(err); el.hidden = true; }
}

function renderUpcoming(el, exams, resultMap) {
  const now = Date.now();
  const list = exams.filter(exam => {
    // isExamAvailableNow already encodes the intended rule (both
    // publishDate AND examDate must have arrived) — it just wasn't being
    // used here, so an exam published today but scheduled for next week
    // was showing up immediately instead of waiting for its date.
    if (!isExamAvailableNow(exam, now)) return false;
    const target = exam.targetBatch || "all";
    if (target !== "all" && target !== student.className) return false;
    const allowed = exam.allowedStudents || [];
    if (allowed.length > 0 && !allowed.includes(student.studentId)) return false;
    return true;
  });
  if (list.length === 0) { el.hidden = true; el.innerHTML = ""; return; }

  el.hidden = false;
  el.innerHTML = `<p class="d-h">${svg("clock", 20)} আসন্ন পরীক্ষা</p>` + list.map(exam => {
    const d = exam.examDate?.toDate ? exam.examDate.toDate() : null;
    const dateStr = d ? d.toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) : "—";
    const own = resultMap[exam.id];
    const qCount = exam.questionIds ? exam.questionIds.length : 0;
    const marks = Number(exam.totalMarks) || 0;
    const maxXP = computeMaxExamXP({ questionCount: qCount || marks, totalMarks: marks });
    const special = exam.allowedStudents && exam.allowedStudents.length > 0;

    let action = "";
    if (own?.status === "approved") action = `<a href="../student/result.html?resultId=${esc(own.resultId)}" class="d-btn d-btn-ok">ফলাফল দেখুন</a>`;
    else if (own?.status === "pending") action = `<p class="d-note">জমা দেওয়া হয়েছে — অনুমোদনের অপেক্ষায়।</p>`;
    else if (exam.status === "published") action = `<a href="../student/exam.html?examId=${esc(exam.id)}" class="d-btn d-btn-primary">পরীক্ষা শুরু করুন</a>`;

    return `
      <div class="d-card d-exam ${special ? "d-exam-special" : ""}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <h3 class="d-exam-title">${esc(exam.name)}</h3>
          <span class="d-tag">${special ? "স্পেশাল" : (exam.status === "published" ? "প্রকাশিত" : "আসন্ন")}</span>
        </div>
        <div class="d-facts">
          <div class="d-fact"><p>তারিখ</p><p>${dateStr}</p></div>
          <div class="d-fact"><p>সময়</p><p class="num">${exam.durationMinutes ? exam.durationMinutes + " মি." : "—"}</p></div>
          <div class="d-fact"><p>প্রশ্ন</p><p class="num">${qCount || "—"}</p></div>
        </div>
        <div class="d-xp-line">
          <p>এই পরীক্ষায় সর্বোচ্চ XP<br><span class="d-sub">উন্নতি ও ধারাবাহিকতা বোনাস আলাদা</span></p>
          <strong>${fmt(maxXP)}</strong>
        </div>
        ${action}
      </div>`;
  }).join("");
}

/* ---------------- main data ---------------- */
async function loadMain() {
  try {
    // Dashboard is the page almost everyone opens first after logging in,
    // so this is where "accepted" challenges whose exam result is now in
    // get settled into "completed" (win/loss/draw + bonus XP decided).
    await resolveCompletedChallenges(student.studentId).catch(() => []);

    const [results, allStudents, subjects, topics, challengeBonusXP, improvementResults, battleXP] = await Promise.all([
      getApprovedResults(student.studentId), getActiveStudents(), getSubjects(), getTopics(),
      getChallengeBonusXP(student.studentId).catch(() => 0),
      getCompletedImprovementAttempts(student.studentId).catch(() => []),
      getStudentBattleXP(student.studentId).catch(() => 0)
    ]);
    const leaderboard = await getLeaderboardData(allStudents);

    const myRefs = allStudents.filter(s => s.referredBy === student.studentId && s.studentId !== student.studentId);
    const xp = computeStudentXP(results, { referralCount: myRefs.length, challengeBonusXP, improvementPracticeResults: improvementResults, battleXP });
    const myIdx = leaderboard.findIndex(r => r.studentId === student.studentId);
    const rank = myIdx >= 0 ? { rank: myIdx + 1, total: leaderboard.length } : null;

    const ctx = {
      results, allStudents, leaderboard, xp, rank, myRefs, battleXP,
      overall: computeOverallStats(results),
      subjectMap: buildNameMap(subjects), topicMap: buildNameMap(topics),
      resultById: Object.fromEntries(results.map(r => [r.id, r]))
    };

    for (const fn of [renderHero, renderReferral, renderXPBreakdown, renderRecent, renderMotivation, renderRank, renderStats, renderSubjects, renderWeak]) {
      try { fn(ctx); } catch (e) { console.error(fn.name, e); }
    }
    animateBars();
  } catch (err) {
    console.error(err);
    renderState($("heroSection"), "error", "তথ্য লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।");
    $("referralSection").innerHTML = "";
  }
}

      </div>

  countUp($("heroXp"), xp.totalXP, 1200);
}

/* ---------------- referral ticket ---------------- */
function renderReferral({ myRefs }) {
  const count = myRefs.length;
  const link = new URL(`../join.html?ref=${encodeURIComponent(student.studentId)}`, window.location.href).href;
  const shareText = "আমার সাথে পরীক্ষার প্রস্তুতিতে যুক্ত হও:";
  const steps = [1, 3, 5, 10];
  const next = steps.find(n => n > count);

  let msg;
  if (count === 0) msg = `প্রথম বন্ধু যুক্ত হলেই <b>+${REFERRAL_XP} XP</b> তোমার।`;
  else if (next) msg = `এখন পর্যন্ত <b>${fmt(count * REFERRAL_XP)} XP</b>। আর <b>${next - count}</b> জন এলে মোট <b>${fmt(next * REFERRAL_XP)} XP</b>।`;
  else msg = `দারুণ! ${count} জনে মোট <b>${fmt(count * REFERRAL_XP)} XP</b> — প্রতি নতুন বন্ধুতে আরও +${REFERRAL_XP}।`;

  const shown = myRefs.slice(0, 6);
  $("referralSection").innerHTML = `
    <p class="d-h">${svg("gift", 20)} বন্ধু রেফার করো, XP জেতো</p>
    <div class="d-ticket-wrap">
      <div class="d-ticket">
        <div class="d-ticket-top">
          <div class="d-ticket-amt">+${REFERRAL_XP}<small>XP</small></div>
          <div>
            <h3>প্রতি বন্ধু রেফারে</h3>
            <p>বন্ধু তোমার লিংক দিয়ে যুক্ত হলেই XP তোমার অ্যাকাউন্টে জমা হবে।</p>
          </div>
        </div>
        <div class="d-ticket-perf"></div>
        <div class="d-ticket-body">
          <div class="d-linkrow">
            <input id="refLink" type="text" readonly value="${esc(link)}" aria-label="তোমার রেফার লিংক">
            <button class="d-btn" id="copyRef" type="button">${svg("copy", 16)} কপি</button>
          </div>
          <div class="d-actions">
            <button class="d-btn" id="waRef" type="button">${svg("msg", 16)} WhatsApp</button>
            <button class="d-btn" id="shareRef" type="button">${svg("share", 16)} শেয়ার</button>
          </div>

          <div class="d-ladder">
            ${steps.map(n => `<div class="d-step ${count >= n ? "d-step-done" : ""}"><p>${n} জন</p><p>+${fmt(n * REFERRAL_XP)}</p></div>`).join("")}
          </div>
          <p class="d-ladder-msg">${msg}</p>

          <div class="d-joined">
            <div class="d-joined-h"><span>তোমার মাধ্যমে যুক্ত</span><b>${count} জন</b></div>
            ${count === 0
              ? `<p class="d-foot" style="margin-top:6px;">এখনো কেউ যুক্ত হয়নি। লিংকটা গ্রুপে বা বন্ধুকে পাঠিয়ে দাও।</p>`
              : `<div class="d-joined-list">${shown.map(s => `<span class="d-joined-pill"><i>${esc(String(s.name || "?").charAt(0))}</i>${esc(s.name)}</span>`).join("")}${count > shown.length ? `<span class="d-joined-pill" style="padding:3px 10px;">+${count - shown.length}</span>` : ""}</div>`}
          </div>
          <p class="d-foot">বন্ধুর আবেদন অ্যাডমিন অনুমোদন করলে সে তালিকায় আসবে এবং তোমার XP যুক্ত হবে।</p>
        </div>
      </div>
    </div>`;

  const copyBtn = $("copyRef");
  copyBtn.addEventListener("click", async () => {
    const ok = await copyText(link);
    if (ok) {
      copyBtn.innerHTML = `${svg("check", 16)} হয়েছে`;
      setTimeout(() => { copyBtn.innerHTML = `${svg("copy", 16)} কপি`; }, 1600);
      showToast("লিংক কপি হয়েছে", "success");
    } else { $("refLink").select(); showToast("কপি করা যায়নি — লিংকটা সিলেক্ট করা আছে, ধরে কপি করো।", "error"); }
  });
  $("refLink").addEventListener("focus", (e) => e.target.select());
  $("waRef").addEventListener("click", () => {
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + " " + link)}`, "_blank", "noopener");
  });
  $("shareRef").addEventListener("click", async () => {
    if (navigator.share) { try { await navigator.share({ title: "যুক্ত হও", text: shareText, url: link }); } catch {} return; }
    const ok = await copyText(`${shareText} ${link}`);
    showToast(ok ? "লিংক কপি হয়েছে — যেকোনো জায়গায় পেস্ট করো" : "শেয়ার সাপোর্ট নেই — লিংক কপি করো", ok ? "success" : "error");
  });
}

/* ---------------- XP breakdown ---------------- */
function renderXPBreakdown({ xp }) {
  const el = $("xpSection");
  const rows = XP_CATEGORIES.map(c => ({ ...c, value: xp.breakdown[c.key] || 0 })).filter(r => r.value > 0).sort((a, b) => b.value - a.value);
  const total = rows.reduce((a, r) => a + r.value, 0);

  el.innerHTML = `
    <p class="d-h">${svg("bolt", 20)} XP কোথা থেকে এলো</p>

      ${total === 0
        ? `<p class="d-sub" style="text-align:center;padding:10px 0;">প্রথম পরীক্ষা দিলেই XP জমতে শুরু করবে।</p>`
        : `<div class="d-stack" role="img" aria-label="XP ভাগ">${rows.map(r => `<i style="width:${(r.value / total * 100).toFixed(2)}%;background:${CAT_COLORS[r.key]}"></i>`).join("")}</div>
           <div style="margin-top:8px;">
             ${rows.map(r => `
               <div class="d-xrow">
                 <span class="d-dot" style="background:${CAT_COLORS[r.key]}"></span>
                 <div class="d-xrow-name">${r.label}<span>${r.hint}</span></div>
                 <span class="d-xrow-val">+${fmt(r.value)}</span>
               </div>`).join("")}
           </div>`}
      <details class="d-rules">
        <summary>কীভাবে আরও XP পাবো? ${svg("down", 18)}</summary>
        <ul>
          <li><b>বড় পরীক্ষা, বেশি XP।</b> প্রশ্ন যত বেশি, অংশগ্রহণ ও সঠিক উত্তরের XP তত বেশি।</li>
          <li><b>নির্ভুলতা দামি।</b> 90% নির্ভুলতা ও 70% নির্ভুলতার XP এক নয়।</li>
          <li><b>নিজেকে ছাড়াও।</b> আগের গড়ের চেয়ে 10 বা 20 পয়েন্ট ভালো করলে বোনাস।</li>

          <li><b>ফাঁকা খাতা জমা দিলে</b> অংশগ্রহণের XP মেলে না।</li>

/* ---------------- motivation ---------------- */
function renderMotivation({ results, overall, rank, subjectMap }) {
  const el = $("motivationSection");
  if (results.length === 0 || !overall) { el.innerHTML = ""; return; }
  const stats = computeSubjectStats(results, subjectMap);
  let weakest = null, strongest = null;
  stats.forEach(s => {
    if (s.accuracy == null) return;
    if (!weakest || s.accuracy < weakest.accuracy) weakest = s;
    if (!strongest || s.accuracy > strongest.accuracy) strongest = s;
  });
  const advice = generateMotivation({
    overallPercentage: overall.avgPercentage, rank: rank?.rank, totalStudents: rank?.total, examsTaken: overall.examsTaken,
    weakestSubjectName: weakest?.name, weakestSubjectAccuracy: weakest?.accuracy,
    strongestSubjectName: strongest?.name !== weakest?.name ? strongest?.name : null, strongestSubjectAccuracy: strongest?.accuracy
  });
  el.innerHTML = `<div class="d-card"><div class="d-quote"><p>AI বিশ্লেষণ ও পরামর্শ</p><p>${advice}</p></div></div>`;
}

/* ---------------- class ranking ---------------- */
function renderRank({ leaderboard }) {
  const el = $("rankSection");
  if (leaderboard.length === 0) { el.innerHTML = ""; return; }
  const byClass = {};
  leaderboard.forEach(r => { (byClass[r.className || "অনির্ধারিত ক্লাস"] ||= []).push(r); });
  const myClass = student.className || "অনির্ধারিত ক্লাস";
  const names = Object.keys(byClass).sort((a, b) => (a === myClass ? -1 : 0) - (b === myClass ? -1 : 0));

  const row = (s, pos, me) => `
    <div class="d-rank ${me ? "d-rank-me" : ""}">
      <span class="d-pos d-pos-${pos}">${pos}</span>
      <span class="d-rank-name">${esc(s.name)}${me ? " (তুমি)" : ""}</span>
      <span class="d-rank-xp">${fmt(s.totalPoints)} XP</span>
    </div>`;

  el.innerHTML = `
    <p class="d-h">${svg("users", 20)} ক্লাস র‍্যাঙ্কিং</p>
    ${names.map(cls => {
      const list = byClass[cls];
      const top3 = list.slice(0, 3);
      const myPos = list.findIndex(s => s.studentId === student.studentId);
      return `
        <div class="d-card d-class">
          <p class="d-class-name">${esc(cls)}</p>
          ${top3.map((s, i) => row(s, i + 1, s.studentId === student.studentId)).join("")}
          ${myPos >= 3 ? `<p class="d-gap">• • •</p>${row(list[myPos], myPos + 1, true)}` : ""}
        </div>`;
    }).join("")}
    <a href="../student/leaderboard.html" class="d-btn">সম্পূর্ণ লিডারবোর্ড দেখো</a>
    <a href="../student/battle-history.html" class="d-btn">Battle History দেখো</a>`;
}

/* ---------------- stats ---------------- */
function renderStats({ overall }) {
  const el = $("statsSection");
  if (!overall) {
    el.innerHTML = `<p class="d-h">${svg("chart", 20)} পরিসংখ্যান</p><div class="d-card"></div>`;
    renderState(el.querySelector(".d-card"), "empty", "এখনো কোনো অনুমোদিত ফলাফল নেই।");
    return;
  }
  const totalQ = overall.totalCorrect + overall.totalWrong + overall.totalUnanswered;
  const cells = [
    ["মোট পরীক্ষা", overall.examsTaken, ""], ["সঠিক", overall.totalCorrect, "color:var(--color-success)"], ["ভুল", overall.totalWrong, "color:var(--color-danger)"],
    ["গড় স্কোর", overall.avgPercentage != null ? overall.avgPercentage + "%" : "—", ""], ["গড় নির্ভুলতা", overall.avgAccuracy != null ? overall.avgAccuracy + "%" : "—", ""], ["প্রশ্ন ফেস করা", totalQ, ""]
  ];
  const trend = overall.trend ? overall.trend.slice(-12) : null;
  el.innerHTML = `
    <p class="d-h">${svg("chart", 20)} পরিসংখ্যান</p>
    <div class="d-card" style="padding:4px 12px;">
      <div class="d-stats">${cells.map(c => `<div class="d-stat"><p>${c[0]}</p><p style="${c[2]}">${c[1]}</p></div>`).join("")}</div>
    </div>
    ${trend ? `
      <div class="d-card" style="margin-top:10px;">
        <p class="d-sub">স্কোরের ধারা (সর্বশেষ ${trend.length}টি পরীক্ষা)</p>
        <div class="d-trend">${trend.map(t => `<i data-h="${Math.max(6, t.value || 0)}" title="${esc(t.label)}: ${t.value ?? "—"}%"></i>`).join("")}</div>
      </div>` : ""}`;
}

/* ---------------- subjects ---------------- */
function renderSubjects({ results, subjectMap }) {
  const el = $("subjectSection");
  const stats = computeSubjectStats(results, subjectMap);
  if (stats.length === 0) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <p class="d-h">${svg("grid", 20)} বিষয়ভিত্তিক পারফরম্যান্স</p>
    <div class="d-card">
      ${stats.map(s => `
        <div class="d-subj">
          <div class="d-subj-top"><strong>${esc(s.name)}</strong><span>${s.accuracy ?? "—"}%</span></div>
          <div class="d-bar"><i data-w="${s.accuracy ?? 0}"></i></div>
          <p class="d-subj-meta">সঠিক ${s.correct} &nbsp;•&nbsp; ভুল ${s.wrong}</p>
        </div>`).join("")}
    </div>`;
}

/* ---------------- weak topics ---------------- */
function renderWeak({ results, topicMap }) {
  const el = $("weakSection");
  if (results.length === 0) { el.innerHTML = ""; return; }
  const stats = computeTopicStats(results, topicMap);
  const weak = stats.filter(t => t.isWeak);
  el.innerHTML = `
    <p class="d-h">${svg("alert", 20)} দুর্বল টপিক</p>
    ${weak.length === 0
      ? `<div class="d-card"><p class="d-sub" style="font-weight:700;">${stats.length === 0 ? "পর্যাপ্ত তথ্য নেই।" : "কোনো ধারাবাহিক দুর্বল টপিক পাওয়া যায়নি।"}</p></div>`
      : weak.map(t => `<div class="d-weak"><div><strong>${esc(t.name ?? "—")}</strong><span>সঠিকতার হার মাত্র <em>${t.accuracy}%</em></span></div></div>`).join("")}`;
}

/* ---------------- one-time bar animations ---------------- */
function animateBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ring = $("sealRing");
    if (ring) ring.style.strokeDashoffset = (Number(ring.dataset.c) * (1 - Number(ring.dataset.pct) / 100)).toFixed(2);
    document.querySelectorAll(".d-trend i").forEach(b => { b.style.height = b.dataset.h + "%"; });
    document.querySelectorAll(".d-bar i").forEach(b => { b.style.width = b.dataset.w + "%"; });
  }));
}
</script>
