<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>উন্নতি — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 600px; padding-bottom: 40px; margin: 0 auto; }

  .glass-card {
    background: rgba(128, 128, 128, 0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02);
  }

  .xp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .xp-box {
    background: rgba(128, 128, 128, 0.03); border: 1px solid rgba(128, 128, 128, 0.12);
    border-radius: 16px; padding: 16px 10px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .xp-val { font-size: 1.5rem; font-weight: 900; color: var(--text-primary); font-family: var(--font-num); line-height: 1.2; }
  .xp-lbl { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); margin-top: 4px; }
  .xp-box-highlight { background: rgba(var(--color-accent-rgb), 0.05); border-color: rgba(var(--color-accent-rgb), 0.2); }
  .xp-box-highlight .xp-val { color: var(--color-accent); }

  .section-title { font-weight: 900; font-size: 1.05rem; color: var(--text-primary); margin: 4px 0 12px; padding-left: 4px; }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { injectImprovementJourneyStyles } from "../js/utils/improvement-profile-utils.js";
import { initFinalImprovementProfileIntegration } from "../js/utils/improvement-profile-final-integration.js";
import { getProfileXPBreakdown } from "../js/utils/improvement-xp-integration.js";

initTheme();
const shell = document.getElementById("shell");
const student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  renderPage();
}

async function renderPage() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "improvement")}
    <div id="bodyContent" class="mt-4"><div class="spinner" style="margin:40px auto;"></div></div>
  `;

  const bodyContent = document.getElementById("bodyContent");

  try {
    injectImprovementJourneyStyles();

    const xpBreakdown = await getProfileXPBreakdown(student);

    bodyContent.innerHTML = `
      <div class="glass-card" style="padding: 20px 16px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span style="font-size:1.1rem; font-weight:900; color:var(--text-primary);">তোমার উন্নতির যাত্রা</span>
        </div>
        <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600; margin:8px 0 0;">
          তোমার দুর্বলতা চিহ্নিত করে এখানে নির্দিষ্ট অনুশীলন পরীক্ষা দেওয়া হয়, যাতে সেই অংশে তুমি উন্নতি করতে পারো।
        </p>
        <div class="xp-grid">
          <div class="xp-box">
            <span class="xp-val">${xpBreakdown.officialXP}</span>
            <span class="xp-lbl">পরীক্ষার XP</span>
          </div>
          <div class="xp-box xp-box-highlight">
            <span class="xp-val">${xpBreakdown.improvementXP}</span>
            <span class="xp-lbl">উন্নতির XP</span>
          </div>
          <div class="xp-box">
            <span class="xp-val">${xpBreakdown.totalXP}</span>
            <span class="xp-lbl">সর্বমোট XP</span>
          </div>
        </div>
      </div>

      <div id="improvementSection"></div>
    `;

    // Renders the active mission + practice/details buttons and the
    // completed-history list into #improvementSection, and refreshes
    // itself whenever an "improvement:completed" event fires.
    initFinalImprovementProfileIntegration();

    // Keep the XP summary above in sync after a practice run completes.
    window.addEventListener("improvement:completed", async () => {
      try {
        const fresh = await getProfileXPBreakdown(student);
        const totalEl = document.querySelector(".xp-box-highlight + .xp-box .xp-val");
        const improvementEl = document.querySelector(".xp-box-highlight .xp-val");
        if (improvementEl) improvementEl.textContent = fresh.improvementXP;
        if (totalEl) totalEl.textContent = fresh.totalXP;
      } catch (err) {
        console.warn("XP summary refresh failed:", err);
      }
    });
  } catch (err) {
    console.error(err);
    renderState(bodyContent, "error", "উন্নতির তথ্য লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করো।");
  }
}
</script>
</body>
</html>
