<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>উন্নতি — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  body { overflow-x: hidden; }
  .app-shell { max-width: 600px; padding-bottom: 40px; margin: 0 auto; }
  .acc { --acc-rgb: 201,151,63; }

  .sec-title { display:flex; align-items:center; justify-content:space-between; margin: 20px 4px 10px;
    font-weight: 900; font-size: 1.02rem; color: var(--text-primary); }
  .sec-title span { font-family: var(--font-num); font-size: .78rem; font-weight: 800; color: var(--text-muted); }

  .card {
    background: rgba(128,128,128,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(128,128,128,0.12); border-radius: 20px; padding: 18px; margin-bottom: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02);
  }

  /* ---- Exam card ---- */
  .ex-area { font-size: 1.05rem; font-weight: 900; color: var(--text-primary); line-height: 1.4; }
  .ex-path { margin-top: 2px; font-size: .74rem; font-weight: 700; color: var(--text-muted); }
  .ex-acc { margin-top: 14px; }
  .ex-acc-row { display:flex; justify-content:space-between; font-size:.76rem; font-weight:800; color:var(--text-muted); margin-bottom:6px; }
  .ex-acc-row b { font-family: var(--font-num); color: var(--text-primary); }
  .bar { position:relative; height:8px; border-radius:99px; background: rgba(128,128,128,.15); }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background: linear-gradient(90deg, var(--color-accent), #f59e0b); }
  .bar em { position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:2px; background: var(--text-primary); opacity:.5; }
  .ex-meta { margin-top: 12px; font-size: .78rem; font-weight: 700; color: var(--text-muted); }
  .start-btn {
    width:100%; margin-top: 14px; padding: 14px; border:none; border-radius:14px; cursor:pointer;
    font: inherit; font-size:.95rem; font-weight:900; color:#fff;
    background: linear-gradient(135deg, var(--color-accent), #f59e0b);
    box-shadow: 0 4px 15px rgba(201,151,63,.3); transition: transform .18s ease;
  }
  .start-btn:active { transform: scale(.97); }

  /* ---- History row ---- */
  .hi { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .hi-main { min-width:0; }
  .hi-main b { display:block; font-size:.92rem; font-weight:900; color:var(--text-primary); }
  .hi-main span { display:block; margin-top:2px; font-size:.74rem; font-weight:700; color:var(--text-muted); }
  .hi-score { text-align:right; flex-shrink:0; }
  .hi-score strong { display:block; font-family:var(--font-num); font-size:1.15rem; font-weight:900; color:var(--text-primary); }
  .chip { display:inline-block; margin-top:3px; padding:3px 9px; border-radius:99px; font-size:.68rem; font-weight:900; }
  .chip.up   { color:#10b981; background:rgba(16,185,129,.1); }
  .chip.down { color:#ef4444; background:rgba(239,68,68,.1); }
  .chip.flat { color:var(--text-muted); background:rgba(128,128,128,.1); }

  .empty { text-align:center; padding: 28px 12px; font-size:.86rem; font-weight:700; line-height:1.7; color:var(--text-muted); }
</style>
</head>
<body>
<div class="app-shell acc" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getImprovementRequestsForStudent } from "../js/utils/improvement-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

initTheme();
const shell = document.getElementById("shell");
const student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  renderPage();
}

const esc = v => String(v ?? "")
  .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
const num = (v, d = 0) => (Number.isFinite(Number(v)) ? Number(v) : d);
const pct = v => Math.max(0, Math.min(100, Math.round(num(v))));

const areaName = r => r.topicName || r.chapterName || r.subjectName || r.entityName || "উন্নতির ক্ষেত্র";
const areaPath = r => {
  const p = [r.subjectName, r.chapterName, r.topicName].filter(Boolean);
  return p.length > 1 ? p.join(" › ") : "";
};

// A request only counts as a ready exam if its test still exists and is published.
// (An admin may have deleted the exam.)
async function loadReadyExams(requests) {
  const candidates = requests.filter(r =>
    ["test_created", "assigned"].includes(r.status) && (r.improvementTestId || r.assignedTestId));

  const checked = await Promise.all(candidates.map(async r => {
    const testId = r.improvementTestId || r.assignedTestId;
    try {
      const snap = await getDoc(doc(db, "improvementTests", testId));
      if (!snap.exists()) return null;
      const t = snap.data();
      if (t.published !== true) return null;
      if (Array.isArray(t.studentIds) && t.studentIds.length && !t.studentIds.includes(student.studentId)) return null;
      return { request: r, testId, questionCount: num(t.questionCount), durationMinutes: num(t.durationMinutes) };
    } catch (err) {
      console.warn("Improvement test check failed:", err);
      return null;
    }
  }));

  return checked.filter(Boolean);
}

function examCard({ request: r, testId, questionCount, durationMinutes }) {
  const cur = pct(r.currentAccuracy);
  const target = Math.max(cur, pct(r.targetAccuracy || 65));
  const meta = [questionCount ? `${questionCount}টি প্রশ্ন` : "", durationMinutes ? `${durationMinutes} মিনিট` : ""].filter(Boolean).join(" · ");

  return `
    <div class="card">
      <div class="ex-area">${esc(areaName(r))}</div>
      ${areaPath(r) ? `<div class="ex-path">${esc(areaPath(r))}</div>` : ""}
      <div class="ex-acc">
        <div class="ex-acc-row"><span>এখন <b>${cur}%</b></span><span>লক্ষ্য <b>${target}%</b></span></div>
        <div class="bar"><i style="width:${cur}%"></i><em style="left:calc(${target}% - 1px)"></em></div>
      </div>
      ${meta ? `<div class="ex-meta">${esc(meta)}</div>` : ""}
      <button type="button" class="start-btn" data-test="${esc(testId)}">অনুশীলন শুরু করো</button>
    </div>`;
}

function historyRow(r) {
  const before = pct(r.currentAccuracy);
  const hasResult = r.lastAccuracy !== undefined && r.lastAccuracy !== null;
  const after = hasResult ? pct(r.lastAccuracy) : null;
  const delta = hasResult ? Math.round(num(r.lastImprovementPercent ?? (after - before))) : 0;

  const chip = !hasResult ? `<span class="chip flat">ফলাফল অপেক্ষমাণ</span>`
    : delta > 0 ? `<span class="chip up">+${delta}%${r.targetReached ? " · লক্ষ্য পূর্ণ" : ""}</span>`
    : delta < 0 ? `<span class="chip down">${delta}%</span>`
    : `<span class="chip flat">কোনো পরিবর্তন নেই</span>`;

  return `
    <div class="card hi">
      <div class="hi-main">
        <b>${esc(areaName(r))}</b>
        <span>${hasResult ? `আগে ${before}%` : esc(areaPath(r) || "সম্পন্ন")}</span>
      </div>
      <div class="hi-score">
        <strong>${hasResult ? `${after}%` : "—"}</strong>
        ${chip}
      </div>
    </div>`;
}

async function renderPage() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "improvement")}
    <div id="bodyContent" class="mt-4"><div class="spinner" style="margin:40px auto;"></div></div>
  `;
  const body = document.getElementById("bodyContent");

  try {
    const requests = await getImprovementRequestsForStudent(student.studentId);
    const exams = await loadReadyExams(requests);
    const history = requests.filter(r => ["completed", "resolved"].includes(r.status));

    body.innerHTML = `
      <div class="sec-title">তোমার Exam <span>${exams.length}</span></div>
      ${exams.length
        ? exams.map(examCard).join("")
        : `<div class="card empty">এখন কোনো Improvement Exam নেই।<br>অ্যাডমিন তৈরি করলে এখানে দেখা যাবে।</div>`}

      <div class="sec-title">সম্পন্ন <span>${history.length}</span></div>
      ${history.length
        ? history.slice(0, 10).map(historyRow).join("")
        : `<div class="card empty">এখনও কোনো Exam সম্পন্ন হয়নি।</div>`}
    `;

    body.querySelectorAll("[data-test]").forEach(btn => {
      btn.addEventListener("click", () => {
        location.href = `./exam.html?improvementTestId=${encodeURIComponent(btn.dataset.test)}`;
      });
    });
  } catch (err) {
    console.error(err);
    renderState(body, "error", "উন্নতির তথ্য লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করো।");
  }
}
</script>
</body>
</html>
