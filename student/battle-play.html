<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ব্যাটেল মোড — লাইভ</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/battle-ui.css">
</head>
<body class="battle-page">
<div class="app-shell" id="shell">
  <header class="battle-header animate-in">
    <div class="battle-brand">
      <div class="battle-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10l-1 8a4 4 0 0 1-8 0L7 3Z"/><path d="M7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3M9 3V1M15 3V1M8 20h8M12 15v5"/></svg></div>
      <div><div class="battle-brand-title">ব্যাটেল</div><div class="battle-brand-sub">লাইভ প্রতিযোগিতা</div></div>
    </div>
    <div class="battle-round" id="levelPill">Level 1 · প্রশ্ন 1/5</div>
  </header>

  <section class="battle-scoreboard animate-in" aria-label="স্কোরবোর্ড">
    <div class="battle-team"><div class="battle-team-label">TEAM A</div><div class="battle-team-name" id="teamAName">Team A</div><div class="battle-team-score num" id="teamAScore">0</div></div>
    <div class="battle-vs">VS</div>
    <div class="battle-team battle-team--b"><div class="battle-team-label">TEAM B</div><div class="battle-team-name" id="teamBName">Team B</div><div class="battle-team-score num" id="teamBScore">0</div></div>
  </section>

  <div class="battle-progress animate-in"><div class="battle-progress-meta"><span>এই লেভেলের অগ্রগতি</span><span class="num" id="progressText">0%</span></div><div class="battle-progress-track"><div class="battle-progress-fill" id="progressBar"></div></div></div>

  <div id="eliminatedBanner" class="battle-eliminated hidden">তুমি এই লেভেলে বাদ পড়েছো — পরের লেভেলে আবার সুযোগ পাবে।</div>

  <main id="qCard" class="battle-question-card animate-in">
    <div class="battle-question-head"><span class="battle-question-label">QUESTION</span><span class="battle-timer num" id="timerBox">60s</span></div>
    <div class="battle-question" id="qText">লোড হচ্ছে…</div>
    <div id="optionsBox" class="battle-options"></div>
    <div class="battle-actions"><button id="buzzBtn" class="battle-buzz hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v4M5.6 6.6l2.8 2.8M3 13h4M21 13h-4M18.4 6.6l-2.8 2.8M8 16a5 5 0 1 1 8 0l1 2H7l1-2Z"/><path d="M9 21h6"/></svg>বাজ়ার চাপুন</button></div>
    <div class="battle-status" id="statusNote"></div>
  </main>

  <section id="resultView" class="battle-question-card battle-result hidden">
    <div class="battle-result-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10l-1 7a4 4 0 0 1-8 0L7 4Z"/><path d="M7 7H4a3 3 0 0 0 3 3M17 7h3a3 3 0 0 1-3 3"/></svg></div>
    <h2 id="resultTitle" class="battle-result-title"></h2><div class="battle-result-sub">এই ম্যাচের ফলাফল ও XP</div>
    <div id="xpList" class="battle-xp-list"></div>
    <a href="./battle-lobby.html" class="battle-new-match">নতুন ম্যাচ</a>
  </section>
</div>
<div id="toast" class="battle-toast hidden"></div>
<script type="module">
import { initTheme } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { db } from "../js/firebase/firebase-config.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { buzzIn, submitAnswer, checkTimeout } from "../js/utils/battle-utils.js";

initTheme();
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

const params = new URLSearchParams(location.search);
const code = params.get("code");
const myTeam = params.get("team") === "B" ? "B" : "A";
const student = getActiveStudent();

if (!code || !student?.studentId) {
  document.getElementById("shell").innerHTML = `<div class="qCard">ম্যাচ কোড বা লগইন পাওয়া যায়নি।</div>`;
  throw new Error("missing code/student");
}

const qText = document.getElementById("qText");
const optionsBox = document.getElementById("optionsBox");
const buzzBtn = document.getElementById("buzzBtn");
const statusNote = document.getElementById("statusNote");
const eliminatedBanner = document.getElementById("eliminatedBanner");
const toast = document.getElementById("toast");
const resultView = document.getElementById("resultView");
const qCard = document.getElementById("qCard");

let lastQuestionId = null;
let lastSnapshotForToast = null;
let claimingInFlight = false;
let answeringInFlight = false;
let currentExpiresAt = null;
const timerBox = document.getElementById("timerBox");

// Every question carries a shared 1-minute clock (currentQuestion.expiresAt).
// Any connected player's browser polls it here; whoever's tick reaches
// Firestore first when time is up resolves the question via checkTimeout
// (safe to call repeatedly -- see battle-utils.js).
setInterval(() => {
  if (!currentExpiresAt) return;
  const remaining = Math.max(0, Math.ceil((currentExpiresAt - Date.now()) / 1000));
  timerBox.textContent = `⏱ ${remaining}s`;
  timerBox.classList.toggle("low", remaining <= 10);
  if (remaining <= 0) {
    checkTimeout(code).catch(() => {});
  }
}, 1000);

function showToast(msg, ms = 2600) {
  toast.textContent = msg;
  toast.classList.remove("hidden");
  setTimeout(() => toast.classList.add("hidden"), ms);
}

function nameOf(m, studentId) {
  const all = [...(m.teamA?.members || []), ...(m.teamB?.members || [])];
  return all.find(x => x.studentId === studentId)?.name || "কেউ একজন";
}

function summarizePrevious(prevM) {
  const q = prevM.currentQuestion;
  if (!q) return null;
  const a = q.answers?.A, b = q.answers?.B;
  if (!a && !b) return "কেউ উত্তর দেয়নি — কোনো পয়েন্ট নেই।";
  if (a?.correct && b?.correct) {
    const faster = a.answeredAt <= b.answeredAt ? "A" : "B";
    return `দুটো টিমই ঠিক দিয়েছে — Team ${faster} দ্রুত ছিল, পয়েন্ট পেলো Team ${faster}!`;
  }
  if (a?.correct) return "Team A ঠিক উত্তর দিয়েছে — পয়েন্ট পেলো Team A!";
  if (b?.correct) return "Team B ঠিক উত্তর দিয়েছে — পয়েন্ট পেলো Team B!";
  return "দুটো টিমই ভুল দিয়েছে — কোনো পয়েন্ট নেই।";
}

const ref = doc(db, "battleMatches", code);
onSnapshot(ref, (snap) => {
  if (!snap.exists()) return;
  const m = snap.data();

  document.getElementById("teamAName").textContent = "Team A";
  document.getElementById("teamBName").textContent = "Team B";

  if (m.status === "finished" && m.result) {
    currentExpiresAt = null;
    renderResult(m);
    return;
  }
  resultView.classList.add("hidden");
  qCard.classList.remove("hidden");

  const q = m.currentQuestion;
  if (!q) { qText.textContent = "পরবর্তী প্রশ্নের অপেক্ষায়…"; currentExpiresAt = null; return; }
  currentExpiresAt = q.expiresAt || null;

  if (lastSnapshotForToast && lastQuestionId && q.questionId !== lastQuestionId) {
    const msg = summarizePrevious(lastSnapshotForToast);
    if (msg) showToast(msg);
  }

  document.getElementById("teamAScore").textContent = `${m.levelWins?.A || 0}`;
  document.getElementById("teamBScore").textContent = `${m.levelWins?.B || 0}`;
  document.getElementById("levelPill").textContent =
    `Level ${m.currentLevel}/4 · প্রশ্ন ${(m.currentQuestionIndex || 0) + 1}/${m.questionsPerLevel}`;
  const qNo = (m.currentQuestionIndex || 0) + 1;
  const totalQ = m.questionsPerLevel || 1;
  const pct = Math.min(100, Math.round(((qNo - 1) / totalQ) * 100));
  document.getElementById("progressBar").style.width = `${pct}%`;
  document.getElementById("progressText").textContent = `${pct}%`;

  const iAmEliminated = !!m.eliminated?.[student.studentId];
  eliminatedBanner.classList.toggle("hidden", !iAmEliminated);

  qText.innerHTML = q.question_bn;
  const myClaim = q.claim?.[myTeam];
  const iClaimed = myClaim?.studentId === student.studentId;
  const myAnswer = q.answers?.[myTeam];

  // ---- options ----
  optionsBox.innerHTML = ["A", "B", "C", "D"].map(k => {
    let cls = "battle-option";
    if (myAnswer) {
      if (k === myAnswer.option) cls += myAnswer.correct ? " correct" : " wrong";
    }
    return `<button class="${cls}" data-opt="${k}" ${iClaimed && !myAnswer ? "" : "disabled"}><span class="battle-option-key">${k}</span><span>${esc(q.options_bn?.[k] || "—")}</span></button>`;
  }).join("");
  optionsBox.querySelectorAll(".battle-option").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (answeringInFlight || myAnswer || !iClaimed) return;
      answeringInFlight = true;
      try { await submitAnswer(code, { studentId: student.studentId, team: myTeam, option: btn.dataset.opt }); }
      catch (e) { showToast(e.message === "TIME_UP" ? "সময় শেষ হয়ে গেছে!" : (e.message || "উত্তর জমা দেওয়া যায়নি।")); }
      answeringInFlight = false;
    });
  });

  // ---- buzz button ----
  if (myClaim || iAmEliminated || myAnswer) {
    buzzBtn.classList.add("hidden");
  } else {
    buzzBtn.classList.remove("hidden");
    buzzBtn.disabled = claimingInFlight;
  }

  if (myClaim && !iClaimed) {
    statusNote.textContent = `${nameOf(m, myClaim.studentId)} উত্তর দিচ্ছে তোমার টিমের হয়ে…`;
  } else if (iClaimed && !myAnswer) {
    statusNote.textContent = "তুমি চান্স পেয়েছো — উত্তর বেছে নাও!";
  } else if (myAnswer) {
    statusNote.textContent = myAnswer.correct ? "ঠিক! পরের প্রশ্নের অপেক্ষায়…" : "ভুল হয়েছে। পরের প্রশ্নের অপেক্ষায়…";
  } else {
    statusNote.textContent = "";
  }

  lastQuestionId = q.questionId;
  lastSnapshotForToast = m;
});

buzzBtn.addEventListener("click", async () => {
  if (claimingInFlight) return;
  claimingInFlight = true;
  buzzBtn.disabled = true;
  try { await buzzIn(code, { studentId: student.studentId, team: myTeam }); }
  catch (e) {
    const map = { ALREADY_CLAIMED: "একটু দেরি হয়ে গেলো!", TIME_UP: "সময় শেষ হয়ে গেছে!" };
    showToast(map[e.message] || (e.message || "চাপা যায়নি।"));
  }
  claimingInFlight = false;
});

function renderResult(m) {
  qCard.classList.add("hidden");
  resultView.classList.remove("hidden");
  const r = m.result;
  const iWon = r.winnerTeam === myTeam;
  document.getElementById("resultTitle").textContent = iWon ? "তোমার টিম জিতেছে!" : "Team " + r.winnerTeam + " জিতেছে";

  const rows = Object.entries(r.xpLog || {}).map(([sid, xp]) => {
    const name = nameOf(m, sid);
    const isMvp = sid === r.winMvp ? " ⭐ MVP" : (sid === r.loseMvp ? " (সেরা, হেরে যাওয়া দলে)" : "");
    return `<div class="battle-xp-row"><span>${esc(name)}${isMvp}</span><span class="battle-xp-value">+${xp} XP</span></div>`;
  }).join("");
  document.getElementById("xpList").innerHTML = rows || `<div style="color:var(--text-muted);">কোনো XP তথ্য নেই।</div>`;
}
</script>
</body>
</html>
