<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg); }
  .app-shell { max-width: 650px; padding-bottom: 40px; margin: 0 auto; }

  /* ===== Premium Glass Cards ===== */
  .glass-card {
    background: rgba(128, 128, 128, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(128, 128, 128, 0.12); border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.02);
  }
  .glass-card { animation: cardRise 420ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes cardRise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* ===== Suspense Reveal Stage ===== */
  .suspense-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px 10px 18px; }
  .suspense-pulse { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; color: var(--color-accent); }
  .suspense-pulse::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(var(--color-accent-rgb),0.2) 0%, transparent 72%); animation: suspensePulse 1.15s ease-in-out infinite; }
  .suspense-pulse svg { width: 32px; height: 32px; position: relative; z-index: 1; }
  @keyframes suspensePulse { 0%,100% { transform: scale(.8); opacity: .5; } 50% { transform: scale(1.25); opacity: 1; } }
  .suspense-stage p { font-size: 1rem; color: var(--text-secondary); font-weight: 800; }
  @keyframes dotBlink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .suspense-stage .dot { animation: dotBlink 1.2s ease-in-out infinite; }
  .suspense-stage .dot:nth-child(2) { animation-delay: 0.15s; }
  .suspense-stage .dot:nth-child(3) { animation-delay: 0.3s; }

  /* ===== Score Hero Section ===== */
  .score-hero-box { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 10px 0; }
  .score-mega-wrap { position: relative; flex-shrink: 0; margin-bottom: 10px; }
  .score-burst { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, var(--score-color, rgba(var(--color-accent-rgb),0.2)) 0%, transparent 70%); opacity: 0; transform: scale(.4); pointer-events: none; z-index: 0; }
  .score-hero-box.landed .score-burst { animation: scoreBurst 750ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes scoreBurst { 0% { opacity: 0; transform: scale(.4); } 42% { opacity: .5; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.7); } }
  .score-mega { position: relative; z-index: 1; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 900; font-size: 4rem; line-height: 1; color: var(--text-primary); transition: color 320ms ease; text-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .score-hero-box.landed .score-mega { color: var(--score-color, var(--color-accent)); animation: scoreSettle 420ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes scoreSettle { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }

  /* ===== Reveal Area & Stats Grid ===== */
  #revealArea { transition: opacity 550ms ease, transform 550ms ease; }
  #revealArea.pre-reveal { opacity: 0; transform: translateY(16px); pointer-events: none; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
  .stat-box { background: rgba(128,128,128,0.02); border: 1px solid rgba(128,128,128,0.08); border-radius: 16px; padding: 16px; text-align: center; }
  .stat-val { font-size: 1.8rem; font-weight: 900; font-family: var(--font-num); margin-bottom: 4px; }
  .stat-lbl { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  /* ===== Mini Bars ===== */
  .mini-bar-row { margin-top: 14px; background: rgba(128,128,128,0.02); border: 1px solid rgba(128,128,128,0.06); padding: 12px; border-radius: 12px; }
  .mini-bar-track { height: 8px; border-radius: 999px; background: rgba(128,128,128,0.1); overflow: hidden; margin-top: 8px; }
  .mini-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--color-accent), #f59e0b); width: 0%; transition: width 900ms cubic-bezier(.22,.9,.3,1); }
  .mini-bar-fill.fill-success { background: linear-gradient(90deg, #10b981, #34d399); }

  /* ===== Review Options Styling ===== */
  .review-card { background: rgba(128,128,128,0.02); border: 1px solid rgba(128,128,128,0.12); border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: 0.2s; }
  .review-option { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid rgba(128,128,128,0.15); background: rgba(128,128,128,0.03); color: var(--text-primary); font-family: var(--font-bn); font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; transition: transform 150ms ease; }
  .review-option .opt-letter { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: rgba(128,128,128,0.1); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; color: var(--text-secondary); }
  .review-option .opt-text { flex: 1; line-height: 1.4; }
  .review-option .opt-tag { flex-shrink: 0; font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  
  .review-option.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.05); }
  .review-option.correct .opt-letter { background: #10b981; color: #fff; }
  .review-option.correct .opt-tag { background: rgba(16, 185, 129, 0.15); color: #10b981; }
  
  .review-option.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); }
  .review-option.wrong .opt-letter { background: #ef4444; color: #fff; }
  .review-option.wrong .opt-tag { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
  
  .review-unanswered-note { font-size: 0.85rem; color: #ef4444; font-weight: 700; margin-top: 12px; display: flex; align-items: center; gap: 6px; }

  /* ===== Explanation Box (For Wrong or Unanswered) ===== */
  .explanation-box {
    margin-top: 16px;
    padding: 16px;
    background: rgba(var(--color-accent-rgb), 0.06);
    border: 1px dashed rgba(var(--color-accent-rgb), 0.3);
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .explanation-title {
    font-weight: 900;
    color: var(--color-accent);
    font-size: 0.85rem;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .explanation-text {
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ===== Buttons ===== */
  .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font-weight: 800; font-size: 0.95rem; border: none; cursor: pointer; transition: 0.2s; flex: 1; }
  .btn-primary { background: var(--color-accent); color: #fff; box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.2); }
  .btn-secondary { background: rgba(128,128,128,0.08); color: var(--text-primary); border: 1px solid rgba(128,128,128,0.2); }
  .btn-action:active:not(:disabled) { transform: scale(0.96); }
  .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

  #reviewList .review-card { animation: reviewRise 380ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes reviewRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Hidden render target for PDF export -->
<div id="pdfArea" style="position:fixed;left:-9999px;top:0;width:380px;background:#ffffff;color:#111;padding:20px;font-family:'Noto Sans Bengali',sans-serif;"></div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getResultById, getExamSnapshot } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { buildQuestionReview, formatSeconds, getSlowestQuestions } from "../js/utils/grading-utils.js";

initTheme();
const shell = document.getElementById("shell");
const params = new URLSearchParams(window.location.search);
const resultId = params.get("resultId");
const justSubmitted = params.get("justSubmitted") === "1";
const student = getActiveStudent();

let result = null;
let subjectMap = {}, chapterMap = {}, topicMap = {};
let review = [];

if (!student) {
  window.location.href = "../index.html";
} else if (!resultId) {
  renderState(shell, "error", "ফলাফল শনাক্ত করা যায়নি।");
} else {
  load();
}

function fmtDate(ts) { return ts?.toDate ? ts.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—"; }
function fmtTime(ts) { return ts?.toDate ? ts.toDate().toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) : "—"; }

function suspenseReveal(el, target, opts = {}) {
  const { totalMs = 2300, scrambleMs = 600, suffix = "" } = opts;
  if (!el || typeof target !== "number" || isNaN(target)) return Promise.resolve();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = `${target}${suffix}`; return Promise.resolve(); }
  const digits = Math.max(2, String(Math.round(Math.abs(target))).length);
  const maxRand = Math.pow(10, digits) - 1;
  const start = performance.now();
  return new Promise(resolve => {
    function frame(now) {
      const elapsed = now - start;
      if (elapsed < scrambleMs) {
        el.textContent = `${Math.floor(Math.random() * maxRand)}${suffix}`;
        requestAnimationFrame(frame); return;
      }
      const t = Math.min(1, (elapsed - scrambleMs) / (totalMs - scrambleMs));
      const eased = 1 - Math.pow(1 - t, 4);
      if (t < 1) {
        const jitter = Math.round((1 - eased) * digits * 3 * (Math.random() - 0.5));
        const val = Math.max(0, Math.round(target * eased) + jitter);
        el.textContent = `${val}${suffix}`;
        requestAnimationFrame(frame);
      } else {
        el.textContent = `${target}${suffix}`; resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

function animateCountUp(el, target, duration = 900, suffix = "") {
  if (!el || typeof target !== "number" || isNaN(target)) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = `${target}${suffix}`; return; }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const value = Math.round(target * eased);
    el.textContent = `${value}${suffix}`;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function load() {
  try {
    result = await getResultById(resultId);
    if (!result || result.studentId !== student.studentId) {
      renderState(shell, "error", "এই ফলাফলটি পাওয়া যায়নি অথবা অ্যাক্সেসযোগ্য নয়।"); return;
    }
    const [subjects, chapters, topics] = await Promise.all([getSubjects(), getChapters(), getTopics()]);
    subjectMap = buildNameMap(subjects); chapterMap = buildNameMap(chapters); topicMap = buildNameMap(topics);

    if (result.status === "pending") {
      renderPending();
    } else {
      await renderApproved();
    }
  } catch (err) {
    console.error(err);
    renderState(shell, "error", "ফলাফল লোড করা যায়নি।");
  }
}

function renderPending() {
  shell.innerHTML = `
    <div class="topbar" style="display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--surface); border-bottom:1px solid var(--surface-border); border-radius:0 0 16px 16px; margin-bottom:20px;">
      <a href="../student/dashboard.html" class="icon-btn" style="border:1px solid rgba(128,128,128,0.2); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 style="font-size:1.1rem; font-weight:900; color:var(--text-primary);">ফলাফল</h2>
      <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
    </div>
    <div class="glass-card text-center" style="padding:40px 20px;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2" style="margin:0 auto 16px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <p style="font-weight:900;font-size:1.2rem; color:var(--text-primary);">${justSubmitted ? "পরীক্ষা সফলভাবে জমা হয়েছে!" : result.examName || "পরীক্ষা"}</p>
      <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600; margin-top:12px; line-height:1.6;">অ্যাডমিন অনুমোদনের অপেক্ষায় আছে। অনুমোদনের পর সম্পূর্ণ ফলাফল ও সঠিক উত্তর এখানে দেখা যাবে।</p>
      <div style="background:rgba(128,128,128,0.1); color:var(--text-secondary); padding:6px 14px; border-radius:99px; font-size:0.8rem; font-weight:800; display:inline-block; margin-top:20px;">অনুমোদনের অপেক্ষায়</div>
    </div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
}

async function renderApproved() {
  const snapshot = await getExamSnapshot(result.examId);
  review = snapshot ? buildQuestionReview(snapshot.questions, result.answers || {}, result.questionTimes || {}) : [];
  const pctVal = Number(result.percentage) || 0;
  const scoreColor = pctVal >= 75 ? "#10b981" : pctVal >= 40 ? "var(--color-accent)" : "#ef4444";

  shell.innerHTML = `
    <div class="topbar" style="display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--surface); border-bottom:1px solid var(--surface-border); border-radius:0 0 16px 16px; margin-bottom:24px;">
      <a href="../student/dashboard.html" class="icon-btn" style="border:1px solid rgba(128,128,128,0.2); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 style="font-size:1.1rem; font-weight:900; color:var(--text-primary);">ফলাফল কার্ড</h2>
      <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
    </div>

    <div class="glass-card">
      <p style="font-weight:900; font-size:1.1rem; color:var(--text-primary); text-align:center; margin-bottom:16px;">${result.examName || "পরীক্ষা"}</p>

      <div class="suspense-stage" id="suspenseStage">
        <div class="suspense-pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <p>ফলাফল গণনা করা হচ্ছে<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
      </div>

      <div class="score-hero-box hidden" id="scoreHeroBox">
        <div class="score-mega-wrap">
          <div class="score-burst"></div>
          <span class="score-mega" id="scorePct">0%</span>
        </div>
        <div style="margin-top:8px;">
          <p style="font-size:0.85rem; color:var(--text-muted); font-weight:700;">প্রাপ্ত নম্বর</p>
          <p style="font-size:1.5rem;font-weight:900; color:var(--text-primary); margin-top:4px;"><span class="num" id="marksObtained">0</span><span style="font-size:1rem; color:var(--text-muted);"> / ${result.totalMarks ?? "—"}</span></p>
        </div>
      </div>
    </div>

    <div id="revealArea" class="pre-reveal">
      <div class="stats-grid">
        <div class="stat-box" style="background:rgba(16, 185, 129, 0.05); border-color:rgba(16, 185, 129, 0.15);">
          <div class="stat-lbl" style="color:#10b981;">সঠিক উত্তর</div>
          <div class="stat-val" style="color:#10b981;" id="statCorrect">0</div>
        </div>
        <div class="stat-box" style="background:rgba(239, 68, 68, 0.05); border-color:rgba(239, 68, 68, 0.15);">
          <div class="stat-lbl" style="color:#ef4444;">ভুল উত্তর</div>
          <div class="stat-val" style="color:#ef4444;" id="statWrong">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">অনুত্তরিত</div>
          <div class="stat-val" id="statUnanswered">0</div>
        </div>
        <div class="stat-box" style="background:rgba(var(--color-accent-rgb), 0.05); border-color:rgba(var(--color-accent-rgb), 0.15);">
          <div class="stat-lbl" style="color:var(--color-accent);">সঠিকতার হার</div>
          <div class="stat-val" style="color:var(--color-accent);"><span id="statAccuracy">0</span>%</div>
        </div>
      </div>

      <div class="glass-card mt-4">
        <p style="font-size:1.05rem; font-weight:900; color:var(--text-primary); border-bottom:1px dashed var(--surface-border); padding-bottom:8px; margin-bottom:12px;">সময় ও তারিখ</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div><p style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">জমাদানের সময়</p><p style="font-size:0.9rem; font-weight:800; color:var(--text-primary); margin-top:4px;">${fmtDate(result.submittedAt)}<br>${fmtTime(result.submittedAt)}</p></div>
          <div><p style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">মোট ব্যয়িত সময়</p><p style="font-size:0.95rem; font-weight:800; color:var(--text-primary); font-family:var(--font-num); margin-top:4px;">${formatSeconds(result.timeTakenSeconds)}</p></div>
        </div>
      </div>

      ${result.subjectBreakdown?.length ? `
      <div class="glass-card mt-4">
        <p style="font-size:1.05rem; font-weight:900; color:var(--text-primary); margin-bottom:16px;">বিষয়ভিত্তিক ফলাফল</p>
        ${result.subjectBreakdown.map((s) => {
          const totalQ = s.correct + s.wrong + s.unanswered;
          const pct = totalQ ? Math.round((s.correct / totalQ) * 100) : 0;
          return `
          <div class="mini-bar-row">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <p style="font-size:0.9rem; font-weight:800; color:var(--text-secondary);">${subjectMap[s.subjectId] || "—"}</p>
              <p style="font-size:0.85rem; font-weight:900; font-family:var(--font-num); color:var(--text-primary);">${s.correct}/${totalQ} সঠিক</p>
            </div>
            <div class="mini-bar-track"><div class="mini-bar-fill fill-success subj-bar" data-pct="${pct}"></div></div>
          </div>`;
        }).join("")}
      </div>` : ""}

      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn-action btn-secondary" id="pdfBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> রেজাল্ট PDF</button>
        <button class="btn-action btn-primary" id="shareBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> শেয়ার করুন</button>
      </div>
      
      <p style="font-size:1.1rem; font-weight:900; color:var(--text-primary); margin:32px 0 16px;">প্রশ্নভিত্তিক পর্যালোচনা</p>
      <div id="reviewList"></div>
    </div>
  `;

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("pdfBtn").addEventListener("click", () => generatePdf(false));
  document.getElementById("shareBtn").addEventListener("click", () => generatePdf(true));

  const heroBox = document.getElementById("scoreHeroBox");
  heroBox.style.setProperty("--score-color", scoreColor);
  runSuspenseReveal();

  async function runSuspenseReveal() {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    await new Promise(r => setTimeout(r, reduce ? 50 : 950));
    document.getElementById("suspenseStage").style.display = "none";
    heroBox.classList.remove("hidden");

    await Promise.all([
      suspenseReveal(document.getElementById("scorePct"), pctVal, { suffix: "%", totalMs: 2300 }),
      suspenseReveal(document.getElementById("marksObtained"), Number(result.obtainedMarks) || 0, { totalMs: 2500 })
    ]);
    heroBox.classList.add("landed");

    await new Promise(r => setTimeout(r, reduce ? 0 : 250));
    document.getElementById("revealArea").classList.remove("pre-reveal");

    animateCountUp(document.getElementById("statCorrect"), Number(result.correctCount) || 0, 800);
    animateCountUp(document.getElementById("statWrong"), Number(result.wrongCount) || 0, 800);
    animateCountUp(document.getElementById("statUnanswered"), Number(result.unansweredCount) || 0, 800);
    animateCountUp(document.getElementById("statAccuracy"), Number(result.accuracy) || 0, 800);
    document.querySelectorAll(".subj-bar, .slow-bar").forEach(bar => {
      const pct = bar.dataset.pct || 0;
      requestAnimationFrame(() => { bar.style.width = `${pct}%`; });
    });
  }

  const reviewEl = document.getElementById("reviewList");
  if (review.length === 0) {
    reviewEl.innerHTML = `<div class="glass-card text-center text-muted font-bold">প্রশ্নের বিস্তারিত পাওয়া যায়নি।</div>`;
  } else {
    reviewEl.innerHTML = review.map((q, i) => `
      <div class="review-card" style="animation-delay:${Math.min(i * 45, 400)}ms; ${q.status === "wrong" ? "border-color:rgba(239,68,68,0.3);" : q.status === "correct" ? "border-color:rgba(16,185,129,0.3);" : ""}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <p style="font-size:0.8rem; color:var(--text-muted); font-weight:700;">প্রশ্ন ${i + 1} • ${subjectMap[q.subjectId] || "অজানা বিষয়"}</p>
          <span style="font-size:0.75rem; font-weight:800; padding:4px 10px; border-radius:8px; border:1px solid transparent; ${q.status === "correct" ? "background:rgba(16,185,129,0.1); color:#10b981; border-color:rgba(16,185,129,0.2);" : q.status === "wrong" ? "background:rgba(239,68,68,0.1); color:#ef4444; border-color:rgba(239,68,68,0.2);" : "background:rgba(128,128,128,0.1); color:var(--text-muted);"}">
            ${q.status === "correct" ? "সঠিক" : q.status === "wrong" ? "ভুল" : "অনুত্তরিত"}
          </span>
        </div>
        
        <p style="font-weight:800; font-size:1.05rem; color:var(--text-primary); line-height:1.5; margin-bottom:16px;">${q.question_bn}</p>
        ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-height:160px; border-radius:12px; margin-bottom:16px; border:1px solid rgba(128,128,128,0.2);">` : ""}
        
        <div>
          ${["A", "B", "C", "D"].map(letter => {
            const isCorrect = letter === q.correctAnswer;
            const isYourPick = letter === q.studentAnswer;
            const cls = isCorrect ? "correct" : (isYourPick ? "wrong" : "");
            let tag = "";
            if (isCorrect && isYourPick) tag = `<span class="opt-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> আপনার উত্তর</span>`;
            else if (isCorrect) tag = `<span class="opt-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> সঠিক উত্তর</span>`;
            else if (isYourPick) tag = `<span class="opt-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> আপনার উত্তর</span>`;
            return `
              <div class="review-option ${cls}">
                <span class="opt-letter">${letter}</span>
                <span class="opt-text">${q.options_bn[letter] ?? ""}</span>
                ${tag}
              </div>`;
          }).join("")}
          ${!q.studentAnswer ? `<div class="review-unanswered-note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> আপনি এই প্রশ্নের উত্তর দেননি।</div>` : ""}
        </div>

        ${(q.status === "wrong" || !q.studentAnswer) && q.explanation_bn ? `
          <div class="explanation-box">
            <div class="explanation-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              সঠিক ব্যাখ্যা ও সমাধান
            </div>
            <div class="explanation-text">${q.explanation_bn}</div>
          </div>
        ` : ""}

      </div>
    `).join("");
  }
}

function buildPdfHtml() {
  const subjRows = (result.subjectBreakdown || []).map(s => `<tr><td style="padding:4px 8px;">${subjectMap[s.subjectId] || "—"}</td><td style="padding:4px 8px;text-align:center;">${s.correct}</td><td style="padding:4px 8px;text-align:center;">${s.wrong}</td><td style="padding:4px 8px;text-align:center;">${s.marks}/${s.totalMarks}</td></tr>`).join("");
  const chapRows = (result.chapterBreakdown || []).map(c => `<tr><td style="padding:4px 8px;">${chapterMap[c.chapterId] || "—"}</td><td style="padding:4px 8px;text-align:center;">${c.correct}</td><td style="padding:4px 8px;text-align:center;">${c.wrong}</td><td style="padding:4px 8px;text-align:center;">${c.marks}/${c.totalMarks}</td></tr>`).join("");

  return `
    <h2 style="margin:0 0 4px;">${result.examName || "পরীক্ষা"}</h2>
    <p style="margin:0 0 12px;color:#555;font-size:13px;">${student.name} • ${student.studentId}</p>
    <p style="font-size:28px;font-weight:800;margin:8px 0;">${result.percentage ?? "—"}% <span style="font-size:14px;font-weight:400;color:#555;">(${result.obtainedMarks}/${result.totalMarks} নম্বর)</span></p>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;">
      <tr><td style="padding:4px 8px;color:#555;">সঠিক</td><td style="padding:4px 8px;">${result.correctCount}</td><td style="padding:4px 8px;color:#555;">ভুল</td><td style="padding:4px 8px;">${result.wrongCount}</td></tr>
      <tr><td style="padding:4px 8px;color:#555;">অনুত্তরিত</td><td style="padding:4px 8px;">${result.unansweredCount}</td><td style="padding:4px 8px;color:#555;">সঠিকতা</td><td style="padding:4px 8px;">${result.accuracy ?? "—"}%</td></tr>
      <tr><td style="padding:4px 8px;color:#555;">সময়</td><td style="padding:4px 8px;" colspan="3">${formatSeconds(result.timeTakenSeconds)}</td></tr>
    </table>
    ${subjRows ? `<h3 style="margin:16px 0 4px;font-size:14px;">বিষয়ভিত্তিক</h3><table style="width:100%;border-collapse:collapse;font-size:12px;"><tr style="color:#555;"><td style="padding:4px 8px;">বিষয়</td><td style="padding:4px 8px;">সঠিক</td><td style="padding:4px 8px;">ভুল</td><td style="padding:4px 8px;">নম্বর</td></tr>${subjRows}</table>` : ""}
    ${chapRows ? `<h3 style="margin:16px 0 4px;font-size:14px;">অধ্যায়ভিত্তিক</h3><table style="width:100%;border-collapse:collapse;font-size:12px;"><tr style="color:#555;"><td style="padding:4px 8px;">অধ্যায়</td><td style="padding:4px 8px;">সঠিক</td><td style="padding:4px 8px;">ভুল</td><td style="padding:4px 8px;">নম্বর</td></tr>${chapRows}</table>` : ""}
  `;
}

async function generatePdf(shareInstead) {
  const btn = shareInstead ? document.getElementById("shareBtn") : document.getElementById("pdfBtn");
  const originalText = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = "প্রস্তুত করা হচ্ছে...";

  try {
    const area = document.getElementById("pdfArea");
    area.innerHTML = buildPdfHtml();
    const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#ffffff" });
    const imgData = canvas.toDataURL("image/png");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "px", format: [canvas.width / 2, canvas.height / 2] });
    pdf.addImage(imgData, "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
    const fileName = `${result.examName || "result"}_${student.studentId}.pdf`;

    if (shareInstead && navigator.canShare) {
      const blob = pdf.output("blob");
      const file = new File([blob], fileName, { type: "application/pdf" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fileName }); return; }
    }
    pdf.save(fileName);
  } catch (err) {
    showToast("PDF তৈরি করা যায়নি।", "error");
  } finally {
    btn.disabled = false; btn.innerHTML = originalText;
  }
}
</script>
