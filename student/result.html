<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .review-option {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 46px; padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--surface-border);
    background: var(--surface-solid);
    color: var(--text-primary);
    font-family: var(--font-bn);
    font-size: 0.9rem;
    margin-bottom: 8px;
    transition: transform 150ms ease;
  }
  .review-option .opt-letter {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface-border); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.78rem;
  }
  .review-option .opt-text { flex: 1; }
  .review-option .opt-tag {
    flex-shrink: 0; font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .review-option.correct {
    border-color: var(--color-success);
    background: var(--color-success)1a;
  }
  .review-option.correct .opt-letter { background: var(--color-success); color: #072925; }
  .review-option.correct .opt-tag { background: var(--color-success); color: #072925; }
  .review-option.wrong {
    border-color: var(--color-danger);
    background: var(--color-danger)1a;
  }
  .review-option.wrong .opt-letter { background: var(--color-danger); color: #fff; }
  .review-option.wrong .opt-tag { background: var(--color-danger); color: #fff; }
  .review-unanswered-note {
    font-size: 0.78rem; color: var(--color-danger); font-weight: 600; margin-top: 8px;
  }

  /* ===== Card + stat entrance ===== */
  .glass.card { animation: cardRise 420ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes cardRise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }

  /* ===== Score hero: circular ring around the percentage ===== */
  .score-hero { display: flex; align-items: center; gap: 20px; }
  .score-ring-wrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .score-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring-track { fill: none; stroke: var(--surface-border); stroke-width: 8; }
  .score-ring-fill {
    fill: none; stroke-width: 8; stroke-linecap: round;
    stroke-dasharray: 301.6; stroke-dashoffset: 301.6;
    transition: stroke-dashoffset 1200ms cubic-bezier(.22,.9,.3,1);
  }
  .score-ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring-pct {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 1.5rem; line-height: 1;
  }
  .score-ring-pct::after { content: "%"; font-size: 0.95rem; }

  /* ===== Stat cards stagger ===== */
  .grid-2 .glass.card:nth-child(1) { animation-delay: 60ms; }
  .grid-2 .glass.card:nth-child(2) { animation-delay: 110ms; }
  .grid-2 .glass.card:nth-child(3) { animation-delay: 160ms; }
  .grid-2 .glass.card:nth-child(4) { animation-delay: 210ms; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  /* ===== Subject / slowest-question mini bars ===== */
  .mini-bar-row { margin-top: 10px; }
  .mini-bar-track { height: 8px; border-radius: 999px; background: var(--surface-border); overflow: hidden; margin-top: 5px; }
  .mini-bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--color-accent), var(--color-accent-2));
    width: 0%;
    transition: width 900ms cubic-bezier(.22,.9,.3,1);
  }
  .mini-bar-fill.fill-success { background: linear-gradient(90deg, var(--color-success), #5eead4); }

  /* ===== Review list stagger ===== */
  #reviewList .glass.card { animation: reviewRise 380ms cubic-bezier(.22,.9,.3,1) both; }
  @keyframes reviewRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .btn { transition: transform 140ms ease, filter 180ms ease; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<!-- Hidden render target for PDF export (image-based, so Bengali glyphs render
     correctly without embedding a custom font into jsPDF — see README). -->
<div id="pdfArea" style="position:fixed;left:-9999px;top:0;width:380px;background:#ffffff;color:#111;padding:20px;font-family:'Noto Sans Bengali',sans-serif;"></div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, showToast } from "../js/utils/ui-utils.js";
import { getActiveStudent } from "../js/utils/student-utils.js";
import { getResultById, getExamSnapshot } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, getTopics, buildNameMap } from "../js/utils/syllabus-utils.js";
import { buildQuestionReview, formatSeconds, getSlowestQuestions } from "../js/utils/grading-utils.js";

initTheme();
const shell = document.getElementById("shell");
const params = new URLSearchParams(window.location.search);
const resultId = params.get("resultId");
const justSubmitted = params.get("justSubmitted") === "1";
const student = getActiveStudent();

let result = null;
let subjectMap = {}, chapterMap = {}, topicMap = {};

if (!student) {
  window.location.href = "../index.html";
} else if (!resultId) {
  renderState(shell, "error", "ফলাফল শনাক্ত করা যায়নি।");
} else {
  load();
}

function fmtDate(ts) { return ts?.toDate ? ts.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "—"; }
function fmtTime(ts) { return ts?.toDate ? ts.toDate().toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) : "—"; }

// Animate a number counting up from 0 to `target` inside `el`, over `duration` ms.
// Respects prefers-reduced-motion by jumping straight to the target.
function animateCountUp(el, target, duration = 900, suffix = "") {
  if (!el || typeof target !== "number" || isNaN(target)) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = `${target}${suffix}`; return; }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const value = Math.round(target * eased);
    el.textContent = `${value}${suffix}`;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function load() {
  try {
    result = await getResultById(resultId);
    if (!result || result.studentId !== student.studentId) {
      renderState(shell, "error", "এই ফলাফলটি পাওয়া যায়নি অথবা অ্যাক্সেসযোগ্য নয়।");
      return;
    }
    const [subjects, chapters, topics] = await Promise.all([getSubjects(), getChapters(), getTopics()]);
    subjectMap = buildNameMap(subjects); chapterMap = buildNameMap(chapters); topicMap = buildNameMap(topics);

    if (result.status === "pending") {
      renderPending();
    } else {
      await renderApproved();
    }
  } catch (err) {
    console.error(err);
    renderState(shell, "error", "ফলাফল লোড করা যায়নি।");
  }
}

function renderPending() {
  shell.innerHTML = `
    <div class="topbar">
      <a href="../student/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">ফলাফল</h2>
      <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
    </div>
    <div class="glass card text-center" style="padding:32px 20px;">
      <span class="icon-btn" style="width:56px;height:56px;margin:0 auto;color:var(--color-accent);">${icons.clock}</span>
      <p class="mt-3" style="font-weight:700;font-size:1.1rem;">${justSubmitted ? "পরীক্ষা সফলভাবে জমা হয়েছে।" : result.examName || "পরীক্ষা"}</p>
      <p class="text-sm text-muted mt-2">অ্যাডমিন অনুমোদনের অপেক্ষায় আছে। অনুমোদনের পর সম্পূর্ণ ফলাফল এখানে দেখা যাবে।</p>
      <span class="badge badge-pending mt-3">অনুমোদনের অপেক্ষায়</span>
    </div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
}

async function renderApproved() {
  const snapshot = await getExamSnapshot(result.examId);
  const review = snapshot ? buildQuestionReview(snapshot.questions, result.answers || {}, result.questionTimes || {}) : [];
  const slowest = getSlowestQuestions(review, 3);
  const pctVal = Number(result.percentage) || 0;
  const scoreColor = pctVal >= 75 ? "var(--color-success)" : pctVal >= 40 ? "var(--color-accent)" : "var(--color-danger)";

  shell.innerHTML = `
    <div class="topbar">
      <a href="../student/dashboard.html" class="icon-btn">${icons.arrowLeft}</a>
      <h2 style="font-size:1.05rem;">ফলাফল</h2>
      <button class="theme-toggle" id="themeToggle"><span class="theme-toggle-thumb"></span></button>
    </div>

    <div class="glass card">
      <p class="eyebrow">${result.examName || "পরীক্ষা"}</p>
      <div class="score-hero mt-3">
        <div class="score-ring-wrap">
          <svg viewBox="0 0 108 108">
            <circle class="score-ring-track" cx="54" cy="54" r="48"></circle>
            <circle class="score-ring-fill" id="scoreRingFill" cx="54" cy="54" r="48"
              stroke="${scoreColor}"></circle>
          </svg>
          <div class="score-ring-center">
            <span class="score-ring-pct" id="scorePct">0</span>
          </div>
        </div>
        <div>
          <p class="text-sm text-muted">প্রাপ্ত নম্বর</p>
          <p style="font-size:1.3rem;font-weight:800;"><span class="num" id="marksObtained">0</span><span class="text-sm text-muted"> / ${result.totalMarks ?? "—"}</span></p>
          <span class="badge badge-completed mt-2">অনুমোদিত</span>
        </div>
      </div>
    </div>

    <div class="grid-2 mt-4">
      <div class="glass card"><p class="text-xs text-muted">সঠিক</p><p style="font-size:1.3rem;font-weight:800;color:var(--color-success);"><span class="num" id="statCorrect">0</span></p></div>
      <div class="glass card"><p class="text-xs text-muted">ভুল</p><p style="font-size:1.3rem;font-weight:800;color:var(--color-danger);"><span class="num" id="statWrong">0</span></p></div>
      <div class="glass card"><p class="text-xs text-muted">অনুত্তরিত</p><p style="font-size:1.3rem;font-weight:800;"><span class="num" id="statUnanswered">0</span></p></div>
      <div class="glass card"><p class="text-xs text-muted">সঠিকতা</p><p style="font-size:1.3rem;font-weight:800;"><span class="num" id="statAccuracy">0</span>%</p></div>
    </div>

    <div class="glass card mt-4">
      <p class="eyebrow">সময়</p>
      <div class="grid-2 mt-2">
        <div><p class="text-xs text-muted">জমাদানের তারিখ</p><p class="text-sm" style="font-weight:600;">${fmtDate(result.submittedAt)}</p></div>
        <div><p class="text-xs text-muted">জমাদানের সময়</p><p class="text-sm" style="font-weight:600;">${fmtTime(result.submittedAt)}</p></div>
        <div><p class="text-xs text-muted">মোট ব্যয়িত সময়</p><p class="text-sm" style="font-weight:600;">${formatSeconds(result.timeTakenSeconds)}</p></div>
        <div><p class="text-xs text-muted">প্রশ্নপ্রতি গড় সময়</p><p class="text-sm" style="font-weight:600;">${result.avgTimePerQuestionSeconds ?? "—"} সেকেন্ড</p></div>
      </div>
    </div>

    ${result.subjectBreakdown?.length ? `
    <div class="glass card mt-4">
      <p class="eyebrow">বিষয়ভিত্তিক ফলাফল</p>
      ${result.subjectBreakdown.map((s, i) => {
        const totalQ = s.correct + s.wrong + s.unanswered;
        const pct = totalQ ? Math.round((s.correct / totalQ) * 100) : 0;
        return `
        <div class="mini-bar-row" ${i === 0 ? "" : "mt-2"}>
          <div class="flex justify-between items-center">
            <p class="text-sm">${subjectMap[s.subjectId] || "—"}</p>
            <p class="text-sm num" style="font-weight:700;">${s.correct}/${totalQ} সঠিক</p>
          </div>
          <div class="mini-bar-track"><div class="mini-bar-fill fill-success subj-bar" data-pct="${pct}"></div></div>
        </div>`;
      }).join("")}
    </div>` : ""}

    ${slowest.length ? `
    <div class="glass card mt-4">
      <p class="eyebrow">সবচেয়ে বেশি সময় নেওয়া প্রশ্ন</p>
      ${(() => {
        const maxTime = Math.max(...slowest.map(q => q.timeSeconds || 0), 1);
        return slowest.map((q, i) => `
        <div class="mini-bar-row" ${i === 0 ? "" : "mt-2"}>
          <div class="flex justify-between items-center">
            <p class="text-sm" style="flex:1;">${i + 1}. ${q.question_bn.length > 50 ? q.question_bn.slice(0, 50) + "…" : q.question_bn}</p>
            <p class="text-sm num" style="font-weight:700;color:var(--color-accent);white-space:nowrap;margin-right:8px;">${q.timeSeconds} সে.</p>
          </div>
          <div class="mini-bar-track"><div class="mini-bar-fill slow-bar" data-pct="${Math.round((q.timeSeconds || 0) / maxTime * 100)}"></div></div>
        </div>`).join("");
      })()}
    </div>` : ""}

    <div class="flex gap-2 mt-4">
      <button class="btn btn-secondary" id="pdfBtn">ফলাফল PDF ডাউনলোড</button>
      <button class="btn btn-secondary" id="shareBtn">PDF শেয়ার করুন</button>
    </div>

    <p class="eyebrow mt-5">প্রশ্নভিত্তিক পর্যালোচনা</p>
    <div id="reviewList" class="mt-2"></div>
  `;

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("pdfBtn").addEventListener("click", () => generatePdf(false));
  document.getElementById("shareBtn").addEventListener("click", () => generatePdf(true));

  // Kick off the reveal animations: ring sweep, count-up numbers, mini-bar fills.
  requestAnimationFrame(() => {
    const ringFill = document.getElementById("scoreRingFill");
    if (ringFill) {
      const circumference = 301.6;
      const offset = circumference * (1 - pctVal / 100);
      requestAnimationFrame(() => { ringFill.style.strokeDashoffset = String(offset); });
    }
    animateCountUp(document.getElementById("scorePct"), pctVal, 1100);
    animateCountUp(document.getElementById("marksObtained"), Number(result.obtainedMarks) || 0, 900);
    animateCountUp(document.getElementById("statCorrect"), Number(result.correctCount) || 0, 800);
    animateCountUp(document.getElementById("statWrong"), Number(result.wrongCount) || 0, 800);
    animateCountUp(document.getElementById("statUnanswered"), Number(result.unansweredCount) || 0, 800);
    animateCountUp(document.getElementById("statAccuracy"), Number(result.accuracy) || 0, 800);
    document.querySelectorAll(".subj-bar, .slow-bar").forEach(bar => {
      const pct = bar.dataset.pct || 0;
      requestAnimationFrame(() => { bar.style.width = `${pct}%`; });
    });
  });

  const reviewEl = document.getElementById("reviewList");
  if (review.length === 0) {
    reviewEl.innerHTML = `<p class="text-xs text-muted">প্রশ্নের বিস্তারিত পাওয়া যায়নি।</p>`;
  } else {
    reviewEl.innerHTML = review.map((q, i) => `
      <div class="glass card mt-2" style="animation-delay:${Math.min(i * 45, 400)}ms;${q.status === "wrong" ? "border-color:var(--color-danger)66;" : q.status === "correct" ? "border-color:var(--color-success)66;" : ""}">
        <div class="flex justify-between items-center">
          <p class="text-xs text-muted">প্রশ্ন ${i + 1} • ${subjectMap[q.subjectId] || ""} / ${chapterMap[q.chapterId] || ""}</p>
          <span class="badge ${q.status === "correct" ? "badge-completed" : q.status === "wrong" ? "badge-pending" : "badge-draft"}">
            ${q.status === "correct" ? "সঠিক" : q.status === "wrong" ? "ভুল" : "অনুত্তরিত"}
          </span>
        </div>
        ${q.timeSeconds !== null ? `<p class="text-xs text-muted mt-1">সময় ব্যয়: ${q.timeSeconds} সেকেন্ড</p>` : ""}
        <p class="mt-2" style="font-weight:600;">${q.question_bn}</p>
        <p class="text-xs text-muted lang-en">${q.question_en}</p>
        ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-height:120px;border-radius:8px;margin-top:8px;">` : ""}
        <div class="mt-3">
          ${["A", "B", "C", "D"].map(letter => {
            const isCorrect = letter === q.correctAnswer;
            const isYourPick = letter === q.studentAnswer;
            const cls = isCorrect ? "correct" : (isYourPick ? "wrong" : "");
            let tag = "";
            if (isCorrect && isYourPick) tag = `<span class="opt-tag">✓ আপনার উত্তর • সঠিক</span>`;
            else if (isCorrect) tag = `<span class="opt-tag">✓ সঠিক উত্তর</span>`;
            else if (isYourPick) tag = `<span class="opt-tag">✕ আপনার উত্তর</span>`;
            return `
              <div class="review-option ${cls}">
                <span class="opt-letter">${letter}</span>
                <span class="opt-text">${q.options_bn[letter] ?? ""}</span>
                ${tag}
              </div>`;
          }).join("")}
          ${!q.studentAnswer ? `<p class="review-unanswered-note">আপনি এই প্রশ্নের উত্তর দেননি।</p>` : ""}
        </div>
        ${q.explanation_bn ? `<p class="text-xs text-muted mt-2">ব্যাখ্যা: ${q.explanation_bn}</p>` : ""}
      </div>
    `).join("");
  }
}

function buildPdfHtml() {
  const subjRows = (result.subjectBreakdown || []).map(s => `
    <tr><td style="padding:4px 8px;">${subjectMap[s.subjectId] || "—"}</td><td style="padding:4px 8px;text-align:center;">${s.correct}</td><td style="padding:4px 8px;text-align:center;">${s.wrong}</td><td style="padding:4px 8px;text-align:center;">${s.marks}/${s.totalMarks}</td></tr>
  `).join("");
  const chapRows = (result.chapterBreakdown || []).map(c => `
    <tr><td style="padding:4px 8px;">${chapterMap[c.chapterId] || "—"}</td><td style="padding:4px 8px;text-align:center;">${c.correct}</td><td style="padding:4px 8px;text-align:center;">${c.wrong}</td><td style="padding:4px 8px;text-align:center;">${c.marks}/${c.totalMarks}</td></tr>
  `).join("");

  return `
    <h2 style="margin:0 0 4px;">${result.examName || "পরীক্ষা"}</h2>
    <p style="margin:0 0 12px;color:#555;font-size:13px;">${student.name} • ${student.studentId}</p>
    <p style="font-size:28px;font-weight:800;margin:8px 0;">${result.percentage ?? "—"}% <span style="font-size:14px;font-weight:400;color:#555;">(${result.obtainedMarks}/${result.totalMarks} নম্বর)</span></p>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;">
      <tr><td style="padding:4px 8px;color:#555;">সঠিক</td><td style="padding:4px 8px;">${result.correctCount}</td>
          <td style="padding:4px 8px;color:#555;">ভুল</td><td style="padding:4px 8px;">${result.wrongCount}</td></tr>
      <tr><td style="padding:4px 8px;color:#555;">অনুত্তরিত</td><td style="padding:4px 8px;">${result.unansweredCount}</td>
          <td style="padding:4px 8px;color:#555;">সঠিকতা</td><td style="padding:4px 8px;">${result.accuracy ?? "—"}%</td></tr>
      <tr><td style="padding:4px 8px;color:#555;">সময়</td><td style="padding:4px 8px;" colspan="3">${formatSeconds(result.timeTakenSeconds)}</td></tr>
    </table>
    ${subjRows ? `<h3 style="margin:16px 0 4px;font-size:14px;">বিষয়ভিত্তিক</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <tr style="color:#555;"><td style="padding:4px 8px;">বিষয়</td><td style="padding:4px 8px;">সঠিক</td><td style="padding:4px 8px;">ভুল</td><td style="padding:4px 8px;">নম্বর</td></tr>
      ${subjRows}
    </table>` : ""}
    ${chapRows ? `<h3 style="margin:16px 0 4px;font-size:14px;">অধ্যায়ভিত্তিক</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <tr style="color:#555;"><td style="padding:4px 8px;">অধ্যায়</td><td style="padding:4px 8px;">সঠিক</td><td style="padding:4px 8px;">ভুল</td><td style="padding:4px 8px;">নম্বর</td></tr>
      ${chapRows}
    </table>` : ""}
  `;
}

async function generatePdf(shareInstead) {
  const btn = shareInstead ? document.getElementById("shareBtn") : document.getElementById("pdfBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "প্রস্তুত করা হচ্ছে...";

  try {
    const area = document.getElementById("pdfArea");
    area.innerHTML = buildPdfHtml();
    const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#ffffff" });
    const imgData = canvas.toDataURL("image/png");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "px", format: [canvas.width / 2, canvas.height / 2] });
    pdf.addImage(imgData, "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
    const fileName = `${result.examName || "result"}_${student.studentId}.pdf`;

    if (shareInstead && navigator.canShare) {
      const blob = pdf.output("blob");
      const file = new File([blob], fileName, { type: "application/pdf" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return;
      }
    }
    pdf.save(fileName);
  } catch (err) {
    console.error(err);
    showToast("PDF তৈরি করা যায়নি।", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
</script>
