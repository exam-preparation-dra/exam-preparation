<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EXAM PREPARATION</title>
<link rel="stylesheet" href="./css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg-app); margin: 0; }

  /* ===== App shell ===== */
  .app-shell { max-width: 480px; padding-bottom: 40px; margin: 0 auto; display: block; }

  /* ===== Cascading entrance ===== */
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .entry-hero, .search-glass, #classFilter, .list-head { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) backwards; }
  .entry-hero { animation-delay: .02s; }
  .search-glass { animation-delay: .08s; }
  #classFilter { animation-delay: .12s; }
  .list-head { animation-delay: .16s; }

  /* ===== Header — ink-stamp seal (same "মার্কশিট" hero language as dashboard/leaderboard) ===== */
  .entry-hero { position: relative; overflow: hidden; margin-top: 14px; margin-bottom: 20px; padding: 26px 20px 22px; border-radius: var(--radius-lg); background: #21262f; color: #f3f1ea; text-align: center; }
  .eh-seal { position: relative; width: 62px; height: 62px; margin: 0 auto 14px; }
  .eh-seal svg { width: 100%; height: 100%; }
  .eh-seal-ring { fill: none; stroke: rgba(184,134,60,.3); stroke-width: 1.6; stroke-dasharray: 3 5; }
  .eh-seal-icon { color: var(--color-accent); }
  .entry-hero h1 { font-size: 1.4rem; font-weight: 900; color: #f3f1ea; line-height: 1.3; letter-spacing: -0.2px; }
  .entry-hero p { margin-top: 6px; font-size: 0.82rem; color: rgba(243,241,234,.65); font-weight: 600; }

  /* ===== Search bar (flat, no glow) ===== */
  .search-glass {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg); padding: 4px 14px; transition: border-color var(--transition);
  }
  .search-glass:focus-within { border-color: var(--color-accent); }
  .search-icon { width: 19px; height: 19px; color: var(--text-muted); flex-shrink: 0; }
  .search-glass input { flex: 1; background: transparent; border: none; outline: none; padding: 11px 0; font-size: 0.92rem; color: var(--text-primary); font-family: inherit; font-weight: 600; }
  .search-glass input::placeholder { color: var(--text-muted); font-weight: 500; }
  .search-glass input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
  .search-clear { display: none; background: var(--surface-edge); color: var(--text-muted); border: none; border-radius: 50%; width: 27px; height: 27px; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  /* ===== Class filter chips ===== */
  .class-filter { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; margin-top: 10px; scrollbar-width: none; }
  .class-filter::-webkit-scrollbar { display: none; }
  .chip-glass { padding: 8px 15px; border-radius: 99px; font-size: 0.82rem; font-weight: 700; background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: background var(--transition), border-color var(--transition), color var(--transition); flex-shrink: 0; }
  .chip-glass.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

  /* ===== Student list ===== */
  .list-head { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .list-head-title { font-size: 0.88rem; font-weight: 800; color: var(--text-primary); }
  .list-count { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; background: var(--surface-edge); padding: 4px 10px; border-radius: 99px; }

  .student-card { position: relative; display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 9px; cursor: pointer; text-align: left; width: 100%; transition: background var(--transition); animation: printIn 400ms ease-out both; overflow: hidden; }
  .student-card:active { background: var(--surface-highlight); }
  @keyframes printIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .student-card.from-cache { animation: none; }

  .student-card.is-loading { border-color: var(--color-accent); box-shadow: 0 0 0 1.5px rgba(var(--color-accent-rgb), 0.3); background: var(--surface-highlight); pointer-events: none; }
  .student-card.is-loading .st-arrow, .student-card.is-loading .st-roll { display: none; }
  .student-card.is-loading::after { content: ""; position: absolute; right: 18px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border: 2.5px solid var(--color-accent); border-top-color: transparent; border-radius: 50%; animation: spinLoad 0.8s linear infinite; }
  @keyframes spinLoad { to { transform: rotate(360deg); } }

  .st-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15rem; overflow: hidden; flex-shrink: 0; }
  .st-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .st-info { flex: 1; min-width: 0; }
  .st-name { font-weight: 800; font-size: 1rem; color: var(--text-primary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-id { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
  .st-roll { background: var(--surface-edge); color: var(--text-secondary); padding: 6px 11px; border-radius: 9px; font-weight: 800; font-size: 0.82rem; font-family: var(--font-num); }

  /* ===== Skeletons & empty state ===== */
  .skel-card { display: flex; gap: 14px; padding: 13px 14px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); margin-bottom: 9px; }
  .skel-circle { width: 46px; height: 46px; border-radius: 50%; background: var(--surface-edge); animation: pulse 1.5s infinite; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .skel-line { height: 12px; border-radius: 6px; background: var(--surface-edge); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  .empty-search { padding: 36px 20px; text-align: center; color: var(--text-muted); background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--surface-border); margin-top: 10px; }
  .empty-search-icon { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--color-accent); }
  .empty-search strong { display:block; color:var(--text-primary); font-size:0.95rem; margin-bottom:6px; font-weight: 800; }

  /* ===== Footer ===== */
  .foot-section { margin-top: 26px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .btn-join { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-primary); font-weight: 700; padding: 13px; border-radius: var(--radius-md); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background var(--transition); }
  .btn-join:active { background: var(--surface-highlight); }
  .admin-link { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-decoration: none; padding: 8px; }
</style>
</head>
<body>

<!-- App Content -->
<div class="app-shell" id="appShell">
  <div class="entry-hero">
    <div class="eh-seal">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="eh-seal-ring" cx="32" cy="32" r="29"/>
        <g class="eh-seal-icon" transform="translate(16,16)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 2 2 8l14 6 14-6z"/>
          <path d="M6 11v6c0 2.5 4.5 5 10 5s10-2.5 10-5v-6"/>
          <path d="M30 8v8"/>
        </g>
      </svg>
    </div>
    <h1 id="platformHeading">EXAM PREPARATION</h1>
    <p>তালিকা থেকে নিজের নাম বেছে নাও</p>
  </div>

  <div class="search-glass" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    <input id="studentSearchInput" type="search" autocomplete="off" placeholder="শিক্ষার্থীর নাম বা আইডি দিয়ে খুঁজুন...">
    <button class="search-clear" id="studentSearchClear" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div id="classFilter" class="class-filter hidden"></div>

  <div class="list-head">
    <div class="list-head-title">শিক্ষার্থীদের তালিকা</div>
    <div class="list-count" id="studentCount">0 জন</div>
  </div>

  <div id="studentList">
    <div class="skel-card"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line" style="width:60%"></div><div class="skel-line" style="width:40%"></div></div></div>
    <div class="skel-card"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line" style="width:50%"></div><div class="skel-line" style="width:30%"></div></div></div>
    <div class="skel-card"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line" style="width:70%"></div><div class="skel-line" style="width:45%"></div></div></div>
  </div>

  <div class="foot-section">
    <a href="./join.html" class="btn-join">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      নতুন শিক্ষার্থী? যুক্ত হওয়ার আবেদন করো
    </a>
    <a href="./admin/index.html" class="admin-link">অ্যাডমিন প্যানেল</a>
  </div>
</div>

<script type="module">
import { initTheme, icons, renderState } from "./js/utils/ui-utils.js";
import { getActiveStudents, setActiveStudent, findActiveAttempt } from "./js/utils/student-utils.js";
import { currentStudentSession, studentLogin, setNewPassword, friendlyStudentAuthError, getStudentAuthStatus, requestSetupCode } from "./js/utils/student-auth.js";
import { getPlatformSettings } from "./js/utils/settings-utils.js";

// Initialize Theme
initTheme();

// Name fallback logic
const TITLE_CACHE_KEY = "cachedPlatformTitle";
const headingEl = document.getElementById("platformHeading");
try {
  const cachedTitle = localStorage.getItem(TITLE_CACHE_KEY);
  if (cachedTitle) headingEl.textContent = cachedTitle;
} catch {}

async function loadPlatformTitle() {
  try {
    const settings = await getPlatformSettings();
    if (settings.platformTitle) {
      headingEl.textContent = settings.platformTitle;
      try { localStorage.setItem(TITLE_CACHE_KEY, settings.platformTitle); } catch {}
    }
  } catch (err) { console.error(err); }
}
loadPlatformTitle();

const listEl = document.getElementById("studentList");
const filterEl = document.getElementById("classFilter");
const searchInput = document.getElementById("studentSearchInput");
const searchClear = document.getElementById("studentSearchClear");
const countEl = document.getElementById("studentCount");
const CACHE_KEY = "cachedStudentList";

let students = [];
let allStudents = [];
let activeClassFilter = "all";
let activeSearch = "";

function renderClassFilter() {
  const classes = [...new Set(allStudents.map(s => s.className).filter(Boolean))].sort();
  if (classes.length === 0) { filterEl.classList.add("hidden"); return; }
  filterEl.classList.remove("hidden");
  filterEl.innerHTML = [
    `<button class="chip-glass${activeClassFilter === "all" ? " active" : ""}" data-class="all">সব ব্যাচ</button>`,
    ...classes.map(c => `<button class="chip-glass${activeClassFilter === c ? " active" : ""}" data-class="${c}">${c}</button>`)
  ].join("");
  filterEl.querySelectorAll(".chip-glass").forEach(chip => {
    chip.addEventListener("click", () => {
      activeClassFilter = chip.dataset.class;
      applySearchAndClassFilter();
    });
  });
}

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function bnRoll(n) { return String(n).padStart(2, "0").split("").map(d => BN_DIGITS[Number(d)]).join(""); }

function safeStudentName(s) {
  const value = s?.name ?? s?.studentName ?? s?.displayName ?? s?.fullName ?? "";
  const text = String(value).trim();
  return text && text !== "undefined" && text !== "null" ? text : "নাম পাওয়া যায়নি";
}

function safeStudentId(s) {
  const value = s?.studentId ?? s?.id ?? s?.uid ?? "";
  const text = String(value).trim();
  return text && text !== "undefined" && text !== "null" ? text : "আইডি পাওয়া যায়নি";
}

function normalized(value) { return String(value ?? "").trim().toLocaleLowerCase(); }

function applySearchAndClassFilter() {
  renderClassFilter();
  let filtered = allStudents;
  if (activeClassFilter !== "all") filtered = filtered.filter(s => s?.className === activeClassFilter);
  if (activeSearch) {
    filtered = filtered.filter(s => {
      const name = normalized(safeStudentName(s));
      const id = normalized(safeStudentId(s));
      return name.includes(activeSearch) || id.includes(activeSearch);
    });
  }
  renderList(filtered, false);
  const total = filtered.length;
  if (countEl) countEl.textContent = `${total} জন`;
  if (searchClear) searchClear.style.display = activeSearch ? "flex" : "none";
}

function rowHtml(s, i, fromCache) {
  const name = safeStudentName(s);
  const studentId = safeStudentId(s);
  const initial = name.charAt(0) || "শ";
  const photo = typeof s?.photoURL === "string" ? s.photoURL.trim() : "";
  const avatar = photo
    ? `<img src="${photo}" alt="" draggable="false" oncontextmenu="return false" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'st-avatar',textContent:'${initial.replace(/'/g,"&#039;")}'}))">`
    : `<span class="st-avatar">${initial}</span>`;
  return `
    <button class="student-card${fromCache ? " from-cache" : ""}" data-idx="${i}" style="animation-delay:${fromCache ? 0 : i * 40}ms;">
      <div class="st-avatar">${avatar}</div>
      <div class="st-info">
        <div class="st-name">${name}</div>
        <div class="st-id">${studentId}</div>
      </div>
      <div class="st-roll">${bnRoll(i + 1)}</div>
      <div class="st-arrow" style="color:var(--text-muted); opacity:0.6; margin-left:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </button>
  `;
}

function renderList(list, fromCache = false) {
  students = list;
  if (list.length === 0) {
    if (activeSearch) {
      listEl.innerHTML = `<div class="empty-search">
        <svg class="empty-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <strong>শিক্ষার্থী পাওয়া যায়নি</strong>
        <span style="font-size:0.85rem;">নাম বা আইডি একটু অন্যভাবে লিখে চেষ্টা করো।</span>
      </div>`;
    } else {
      renderState(listEl, "empty", "এখনো কোনো শিক্ষার্থী যোগ করা হয়নি। অ্যাডমিন প্যানেল থেকে শিক্ষার্থী তৈরি করুন।");
    }
    if (countEl) countEl.textContent = "0 জন";
    return;
  }
  
  listEl.innerHTML = list.map((s, i) => rowHtml(s, i, fromCache)).join("");
  if (countEl) countEl.textContent = `${list.length} জন`;
  
  listEl.querySelectorAll("[data-idx]").forEach(btn => {
    btn.addEventListener("click", function() {
      selectStudent(students[Number(this.dataset.idx)], this);
    });
  });
}

// ---------------------------------------------------------------
// Password gate. Resolves true once the student is authenticated.
// Screens: login (returning) · code (first time, has admin's code) ·
// newpass (choose own password) · apply (first time, no code yet) ·
// pending (applied, waiting) · forgot (request a reset).
// ---------------------------------------------------------------
function injectPwStyle() {
  if (document.getElementById("pwStyle")) return;
  const st = document.createElement("style"); st.id = "pwStyle";
  st.textContent = `
  .pw-ov{position:fixed;inset:0;z-index:9999;background:rgba(15,15,20,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
  .pw-card{width:100%;max-width:380px;background:var(--surface-solid,#fff);color:var(--text-main,#222);border:1px solid var(--surface-border,#e5e2d9);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
  .pw-top{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--surface-highlight,#faf9f5);border-bottom:1px solid var(--surface-border,#e5e2d9)}
  .pw-av{width:42px;height:42px;border-radius:50%;background:var(--color-accent,#b8863c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex:none}
  .pw-nm{font-weight:800;font-size:.98rem;line-height:1.2}
  .pw-cl{font-size:.74rem;color:var(--text-muted,#888);margin-top:2px}
  .pw-x{margin-left:auto;background:none;border:0;font-size:1.5rem;line-height:1;color:var(--text-muted,#888);cursor:pointer;padding:4px 8px}
  .pw-steps{display:flex;gap:6px;padding:14px 18px 0}
  .pw-step{flex:1;text-align:center;font-size:.72rem;font-weight:700;padding:7px 4px;border-radius:9px;background:rgba(128,128,128,.10);color:var(--text-muted,#888)}
  .pw-step.on{background:var(--color-accent,#b8863c);color:#fff}
  .pw-step.done{background:rgba(22,163,74,.14);color:#15803d}
  .pw-body{padding:18px}
  .pw-emoji{font-size:1.9rem;margin-bottom:6px}
  .pw-h{margin:0 0 6px;font-size:1.08rem;font-weight:800}
  .pw-p{margin:0 0 14px;font-size:.84rem;line-height:1.55;color:var(--text-muted,#777)}
  .pw-f{position:relative;margin-bottom:10px}
  .pw-f input{width:100%;box-sizing:border-box;padding:13px 44px 13px 14px;border-radius:12px;border:1.5px solid var(--surface-border,#ddd);background:var(--surface-solid,#fff);color:inherit;font-size:1rem;outline:none}
  .pw-f input:focus{border-color:var(--color-accent,#b8863c)}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.05rem;padding:8px}
  .pw-err{color:#dc2626;font-size:.8rem;min-height:18px;margin:2px 0 8px}
  .pw-btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--color-accent,#b8863c);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer}
  .pw-btn:disabled{opacity:.55;cursor:default}
  .pw-link{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--color-accent,#b8863c);font-weight:700;font-size:.82rem;cursor:pointer;padding:6px}
  .pw-note{background:rgba(234,179,8,.12);color:#a16207;border-radius:10px;padding:10px 12px;font-size:.8rem;margin-bottom:12px}`;
  document.head.appendChild(st);
}

function askStudentPassword(student) {
  injectPwStyle();
  return new Promise((resolve) => {
    const ov = document.createElement("div");
    ov.className = "pw-ov";
    ov.innerHTML = `<div class="pw-card">
      <div class="pw-top">
        <div class="pw-av">${(student.name || "S").charAt(0)}</div>
        <div><div class="pw-nm"></div><div class="pw-cl"></div></div>
        <button class="pw-x" type="button" aria-label="বন্ধ">×</button>
      </div>
      <div id="pwSteps"></div>
      <div class="pw-body" id="pwBody"></div></div>`;
    ov.querySelector(".pw-nm").textContent = student.name || "";
    ov.querySelector(".pw-cl").textContent = `${student.className || ""} · ${student.studentId}`;
    document.body.appendChild(ov);

    const body = ov.querySelector("#pwBody");
    const stepsEl = ov.querySelector("#pwSteps");
    const done = (v) => { ov.remove(); resolve(v); };
    ov.querySelector(".pw-x").addEventListener("click", () => done(false));
    ov.addEventListener("mousedown", (e) => { if (e.target === ov) done(false); });

    const field = (id, ph, ac) => `<div class="pw-f"><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"><button type="button" class="pw-eye" data-for="${id}" aria-label="দেখাও">👁</button></div>`;
    const steps = (n) => { stepsEl.innerHTML = `<div class="pw-steps">
        <div class="pw-step ${n === 1 ? "on" : "done"}">${n === 1 ? "১" : "✔"} সেটআপ কোড</div>
        <div class="pw-step ${n === 2 ? "on" : ""}">২ নিজের পাসওয়ার্ড</div></div>`; };
    const wireCommon = () => {
      body.querySelectorAll(".pw-eye").forEach(b => b.addEventListener("click", () => {
        const i = body.querySelector("#" + b.dataset.for); i.type = i.type === "password" ? "text" : "password";
      }));
      body.querySelector("input")?.focus();
    };
    const setErr = (m) => { const e = body.querySelector(".pw-err"); if (e) e.textContent = m || ""; };
    const busy = (b, t) => { b.disabled = true; b.dataset.t = b.textContent; b.textContent = t; };
    const idle = (b) => { b.disabled = false; b.textContent = b.dataset.t; };

    // ---- screens ----
    function viewChecking() { stepsEl.innerHTML = ""; body.innerHTML = `<p class="pw-p" style="text-align:center;margin:18px 0">একটু অপেক্ষা করো…</p>`; }

    function viewLogin(note) {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-emoji">🔐</div>
        <h3 class="pw-h">পাসওয়ার্ড দাও</h3>
        <p class="pw-p">তোমার নিজের পাসওয়ার্ড লিখে ঢোকো।</p>
        ${note ? `<div class="pw-note">${note}</div>` : ""}
        ${field("pw1", "পাসওয়ার্ড", "current-password")}
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">প্রবেশ করো</button>
        <button class="pw-link" id="pwForgot" type="button">পাসওয়ার্ড ভুলে গেছো?</button>`;
      wireCommon();
      const go = async () => {
        const v = body.querySelector("#pw1").value; if (!v) return setErr("পাসওয়ার্ড লেখো।");
        const b = body.querySelector("#pwGo"); busy(b, "যাচাই হচ্ছে…"); setErr("");
        try { const r = await studentLogin(student.studentId, v); r.needsNewPassword ? viewNewPass() : done(true); }
        catch (e) { setErr(friendlyStudentAuthError(e)); idle(b); }
      };
      body.querySelector("#pwGo").addEventListener("click", go);
      body.querySelector("#pw1").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      body.querySelector("#pwForgot").addEventListener("click", viewForgot);
    }

    function viewCode() {
      steps(1);
      body.innerHTML = `<div class="pw-emoji">🎟️</div>
        <h3 class="pw-h">সেটআপ কোড লেখো</h3>
        <p class="pw-p">অ্যাডমিন তোমাকে যে কোডটা পাঠিয়েছে সেটা এখানে লেখো। এটা শুধু প্রথমবারের জন্য — এরপর তুমি নিজের পাসওয়ার্ড বানাবে।</p>
        ${field("pw1", "যেমন: K7M2XQ4P", "one-time-code")}
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">পরের ধাপ →</button>`;
      wireCommon();
      const go = async () => {
        const v = body.querySelector("#pw1").value.trim(); if (!v) return setErr("কোডটা লেখো।");
        const b = body.querySelector("#pwGo"); busy(b, "যাচাই হচ্ছে…"); setErr("");
        try { const r = await studentLogin(student.studentId, v); r.needsNewPassword ? viewNewPass() : done(true); }
        catch (e) { setErr("কোডটা মেলেনি। অ্যাডমিনের পাঠানো কোড আবার দেখে লেখো।"); idle(b); }
      };
      body.querySelector("#pwGo").addEventListener("click", go);
      body.querySelector("#pw1").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }

    function viewNewPass() {
      steps(2);
      body.innerHTML = `<div class="pw-emoji">🔑</div>
        <h3 class="pw-h">নিজের পাসওয়ার্ড বানাও</h3>
        <p class="pw-p">কোড ঠিক আছে ✔ এখন থেকে এই পাসওয়ার্ড দিয়েই তুমি ঢুকবে। কমপক্ষে ৬ অক্ষর দাও, আর নিজে মনে রাখো।</p>
        ${field("pw1", "নতুন পাসওয়ার্ড", "new-password")}
        ${field("pw2", "আবার লেখো", "new-password")}
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">পাসওয়ার্ড সেভ করে ঢোকো</button>`;
      wireCommon();
      const go = async () => {
        const p1 = body.querySelector("#pw1").value, p2 = body.querySelector("#pw2").value;
        if (p1.length < 6) return setErr("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
        if (p1 !== p2) return setErr("দুটি পাসওয়ার্ড মেলেনি।");
        const b = body.querySelector("#pwGo"); busy(b, "সেভ হচ্ছে…"); setErr("");
        try { await setNewPassword(student.studentId, p1); done(true); }
        catch (e) { setErr(friendlyStudentAuthError(e)); idle(b); }
      };
      body.querySelector("#pwGo").addEventListener("click", go);
      body.querySelector("#pw2").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }

    function viewApply() {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-emoji">👋</div>
        <h3 class="pw-h">প্রথমবার এসেছো?</h3>
        <p class="pw-p">তোমার প্রোফাইল এখনো চালু হয়নি। নিজের পাসওয়ার্ড বানাতে আগে অ্যাডমিনের কাছ থেকে একটা <b>সেটআপ কোড</b> লাগবে। নিচের বাটনে চাপলে অ্যাডমিন তোমার আবেদন দেখতে পাবে।</p>
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">সেটআপ কোডের জন্য আবেদন করো</button>
        <button class="pw-link" id="pwHave" type="button">আমার কাছে কোড আছে</button>`;
      body.querySelector("#pwGo").addEventListener("click", async (e) => {
        const b = e.currentTarget; busy(b, "পাঠানো হচ্ছে…");
        try { await requestSetupCode(student, "setup"); viewPending("setup"); }
        catch (err) { setErr("আবেদন পাঠানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।"); idle(b); }
      });
      body.querySelector("#pwHave").addEventListener("click", viewCode);
    }

    function viewPending(type) {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-emoji">⏳</div>
        <h3 class="pw-h">আবেদন পাঠানো হয়েছে ✔</h3>
        <p class="pw-p">অ্যাডমিন তোমার আবেদন দেখতে পাবে এবং তোমাকে ${type === "reset" ? "নতুন " : ""}সেটআপ কোড পাঠাবে। কোড পেলে আবার এখানে এসে <b>নিজের নাম চাপো</b>, তারপর কোডটা লিখবে।</p>
        <button class="pw-btn" id="pwOk" type="button">ঠিক আছে</button>`;
      body.querySelector("#pwOk").addEventListener("click", () => done(false));
    }

    function viewForgot() {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-emoji">🤔</div>
        <h3 class="pw-h">পাসওয়ার্ড ভুলে গেছো?</h3>
        <p class="pw-p">সমস্যা নেই। আবেদন পাঠাও — অ্যাডমিন তোমার পাসওয়ার্ড রিসেট করে নতুন সেটআপ কোড দেবে, তারপর তুমি নতুন পাসওয়ার্ড বানাবে।</p>
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">রিসেটের আবেদন পাঠাও</button>
        <button class="pw-link" id="pwBack" type="button">← ফিরে যাও</button>`;
      body.querySelector("#pwBack").addEventListener("click", () => viewLogin());
      body.querySelector("#pwGo").addEventListener("click", async (e) => {
        const b = e.currentTarget; busy(b, "পাঠানো হচ্ছে…");
        try { await requestSetupCode(student, "reset"); viewPending("reset"); }
        catch (err) { setErr("আবেদন পাঠানো যায়নি। আবার চেষ্টা করো।"); idle(b); }
      });
    }

    // ---- decide which screen to open first ----
    viewChecking();
    getStudentAuthStatus(student.studentId).then(st => {
      if (st.hasAccount && st.passwordSet) viewLogin(st.pending ? "তোমার রিসেটের আবেদন অ্যাডমিনের কাছে পাঠানো আছে।" : "");
      else if (st.hasAccount) viewCode();
      else if (st.pending) viewPending(st.pending.type);
      else viewApply();
    }).catch(() => viewLogin());
  });
}

async function selectStudent(student, btnElement) {
  if (btnElement) { btnElement.classList.add("is-loading"); }

  // Already signed in as this exact student on this device? Skip the prompt.
  const sessionSid = await currentStudentSession();
  if (sessionSid !== student.studentId) {
    const ok = await askStudentPassword(student);
    if (!ok) { btnElement?.classList.remove("is-loading"); return; }
  }

  setActiveStudent(student); 
  const active = await findActiveAttempt(student.studentId);
  if (active) {
    window.location.href = `./student/exam.html?examId=${active.examId}&resume=1`;
  } else {
    window.location.href = "./student/dashboard.html";
  }
}

searchInput?.addEventListener("input", () => {
  activeSearch = normalized(searchInput.value);
  applySearchAndClassFilter();
});

searchClear?.addEventListener("click", () => {
  if (searchInput) searchInput.value = "";
  activeSearch = "";
  applySearchAndClassFilter();
  searchInput?.focus();
});

try {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
  if (cached && cached.length) {
    allStudents = cached;
    applySearchAndClassFilter();
  }
} catch {}

async function loadStudents() {
  try {
    const fresh = await getActiveStudents();
    allStudents = fresh;
    applySearchAndClassFilter();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch {}
  } catch (err) {
    console.error(err);
    if (students.length === 0) renderState(listEl, "error", "শিক্ষার্থীদের তালিকা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
  }
}

loadStudents();
</script>
</body>
</html>
