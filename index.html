<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>বাংলা MCQ পরীক্ষা প্ল্যাটফর্ম</title>
<link rel="stylesheet" href="./css/style.css">
<style>
  /* =========================================================
     DESIGN CONCEPT: an exam roll register / admit-card sheet —
     not a generic app dashboard. Each student is a numbered roll
     entry on a ledger, torn at perforations, stamped with a roll
     seal — grounded in the actual subject (an exam-prep roster),
     not decorative gradients. One calm "printing in" entrance;
     restrained hover response; no per-card shadow/glow theatrics.
     ========================================================= */

  :root {
    --seal: #ff6a2b;
  }

  body { overflow-x: hidden; background: var(--bg); }

  .app-shell { max-width: 460px; }

  /* ---- Faint ruled-ledger texture behind everything — replaces
     decorative color blobs with something that belongs to the subject. ---- */
  .ledger-bg {
    position: fixed; inset: 0; z-index: -1;
    background-image: repeating-linear-gradient(
      to bottom, transparent, transparent 37px, var(--surface-border) 38px
    );
    opacity: 0.6;
  }

  /* ---- Register heading — the platform's own name (admin-set), big and
     confident, right at the very top now. One short line under it. ---- */
  .register-head { margin-top: 8px; }
  .register-head h1 {
    font-size: 1.9rem; font-weight: 800; color: var(--text-primary); line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .register-head p { margin-top: 8px; font-size: 0.86rem; color: var(--text-muted); }

  /* ---- The roll sheet: one continuous surface, rows torn apart by
     a dashed perforation — not a stack of separate floating cards. ---- */
  /* ---- Class filter chips — scrolls horizontally if there are many
     classes; auto-built from whichever classes actually exist among the
     current students, so a brand-new class shows up on its own. ---- */
  .class-filter { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; margin-top: 18px; scrollbar-width: none; }
  .class-filter::-webkit-scrollbar { display: none; }
  .class-chip {
    flex-shrink: 0; padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
    border: 1px solid var(--surface-border); background: transparent; color: var(--text-muted); cursor: pointer;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .class-chip.active { background: var(--seal); border-color: var(--seal); color: #fff; }

  .roll-sheet {
    position: relative;
    margin-top: 22px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--surface-border);
    background: var(--surface-solid, transparent);
  }
  .roll-sheet::before, .roll-sheet::after {
    content: ""; position: absolute; top: 14px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--bg); border: 1px solid var(--surface-border);
  }
  .roll-sheet::before { left: -4px; }
  .roll-sheet::after { right: -4px; }

  .roll-row {
    position: relative; display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 16px; border: none; text-align: left; cursor: pointer;
    background: transparent; color: inherit;
    clip-path: inset(0 0 0 0);
    animation: printIn 420ms cubic-bezier(.16,.9,.28,1) both;
  }
  .roll-row + .roll-row { border-top: 1px dashed var(--surface-border); }
  .roll-row.from-cache { animation: none; }
  @keyframes printIn {
    from { clip-path: inset(0 100% 0 0); opacity: 0.4; }
    to   { clip-path: inset(0 0 0 0); opacity: 1; }
  }

  .roll-no {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 8px;
    border: 1.5px solid rgba(255,106,43,0.4);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; color: var(--seal);
    transition: border-color 160ms ease, background 160ms ease;
  }
  .roll-row:hover .roll-no, .roll-row:active .roll-no { border-color: var(--seal); background: rgba(255,106,43,0.1); }

  .roll-avatar {
    width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #ff6a2b1a; border: 1px solid rgba(255,106,43,0.35);
  }
  .roll-avatar img { width: 100%; height: 100%; object-fit: cover; -webkit-touch-callout: none; user-select: none; pointer-events: none; }
  .roll-avatar-fallback { color: var(--seal); font-weight: 800; font-size: 1.2rem; line-height: 1; }

  .roll-info { flex: 1; min-width: 0; }
  .roll-name { display: block; font-weight: 800; font-size: 1.18rem; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roll-id { display: block; font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; }

  .roll-chevron { flex-shrink: 0; color: var(--text-muted); transition: transform 160ms ease, color 160ms ease; }
  .roll-row:hover .roll-chevron, .roll-row:active .roll-chevron { transform: translateX(3px); color: var(--seal); }

  /* ---- Skeleton: quiet pulse, no shimmer sweep theatrics ---- */
  .roll-skel { height: 66px; }
  .roll-skel + .roll-skel { border-top: 1px dashed var(--surface-border); }
  .roll-skel-bar { height: 100%; margin: 0 16px; display: flex; align-items: center; gap: 14px; }
  .roll-skel-chip { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-border); animation: pulse 1.6s ease-in-out infinite; }
  .roll-skel-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-border); animation: pulse 1.6s ease-in-out infinite; }
  .roll-skel-lines { flex: 1; }
  .roll-skel-line { height: 10px; border-radius: 4px; background: var(--surface-border); animation: pulse 1.6s ease-in-out infinite; }
  .roll-skel-line + .roll-skel-line { width: 40%; margin-top: 8px; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ---- Footer ---- */
  .foot-row { margin-top: 30px; padding-top: 16px; border-top: 1px dashed var(--surface-border); text-align: center; }
  .admin-link { font-size: 0.76rem; color: var(--text-muted); text-decoration: none; }
  .admin-link:hover { color: var(--seal); }
</style>
</head>
<body>

<div class="ledger-bg"></div>

<div class="app-shell">

  <div class="register-head">
    <h1 id="platformHeading">পরীক্ষা প্রস্তুতি</h1>
    <p>তালিকা থেকে নিজের নাম বেছে নাও।</p>
  </div>

  <div id="classFilter" class="class-filter hidden"></div>

  <div class="roll-sheet" id="studentList">
    <div class="roll-skel"><div class="roll-skel-bar">
      <div class="roll-skel-chip"></div><div class="roll-skel-circle"></div>
      <div class="roll-skel-lines"><div class="roll-skel-line"></div><div class="roll-skel-line"></div></div>
    </div></div>
    <div class="roll-skel"><div class="roll-skel-bar">
      <div class="roll-skel-chip"></div><div class="roll-skel-circle"></div>
      <div class="roll-skel-lines"><div class="roll-skel-line"></div><div class="roll-skel-line"></div></div>
    </div></div>
  </div>

  <div class="foot-row">
    <a href="./join.html" class="admin-link" style="font-weight:700;">নতুন শিক্ষার্থী? যুক্ত হওয়ার আবেদন করো →</a>
    <div class="mt-2"><a href="./admin/index.html" class="admin-link">অ্যাডমিন প্যানেল</a></div>
  </div>

</div>

<script type="module">
import { initTheme, icons, renderState } from "./js/utils/ui-utils.js";
import { getActiveStudents, setActiveStudent, findActiveAttempt } from "./js/utils/student-utils.js";
import { getPlatformSettings } from "./js/utils/settings-utils.js";

initTheme();

// ---- Platform title: cache-first paint (same fast-loading pattern as the
// student list below), then quietly refreshed from the admin's setting. ----
const TITLE_CACHE_KEY = "cachedPlatformTitle";
const headingEl = document.getElementById("platformHeading");
try {
  const cachedTitle = localStorage.getItem(TITLE_CACHE_KEY);
  if (cachedTitle) headingEl.textContent = cachedTitle;
} catch { /* non-fatal — falls back to the default heading already in the HTML */ }

async function loadPlatformTitle() {
  try {
    const settings = await getPlatformSettings();
    if (settings.platformTitle) {
      headingEl.textContent = settings.platformTitle;
      try { localStorage.setItem(TITLE_CACHE_KEY, settings.platformTitle); } catch { /* storage full/unavailable — non-fatal */ }
    }
  } catch (err) {
    console.error(err); // keep whatever's already showing (cache or default) — never blank the heading
  }
}
loadPlatformTitle();

const listEl = document.getElementById("studentList");
const filterEl = document.getElementById("classFilter");
const CACHE_KEY = "cachedStudentList";
let students = [];       // the currently DISPLAYED (possibly filtered) list — what rowHtml/selectStudent index into
let allStudents = [];    // the full unfiltered list, used to rebuild chips + re-filter
let activeClassFilter = "all";

function renderClassFilter() {
  const classes = [...new Set(allStudents.map(s => s.className).filter(Boolean))].sort();
  if (classes.length === 0) { filterEl.classList.add("hidden"); return; }
  filterEl.classList.remove("hidden");
  filterEl.innerHTML = [
    `<button class="class-chip${activeClassFilter === "all" ? " active" : ""}" data-class="all">সব</button>`,
    ...classes.map(c => `<button class="class-chip${activeClassFilter === c ? " active" : ""}" data-class="${c}">${c}</button>`)
  ].join("");
  filterEl.querySelectorAll(".class-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeClassFilter = chip.dataset.class;
      applyClassFilter();
    });
  });
}

function applyClassFilter() {
  renderClassFilter();
  const filtered = activeClassFilter === "all" ? allStudents : allStudents.filter(s => s.className === activeClassFilter);
  renderList(filtered, false);
}

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function bnRoll(n) {
  return String(n).padStart(2, "0").split("").map(d => BN_DIGITS[Number(d)]).join("");
}

function rowHtml(s, i, fromCache) {
  const avatar = s.photoURL
    ? `<img src="${s.photoURL}" alt="" draggable="false" oncontextmenu="return false" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'roll-avatar-fallback',textContent:'${s.name.charAt(0)}'}))">`
    : `<span class="roll-avatar-fallback">${s.name.charAt(0)}</span>`;
  return `
    <button class="roll-row${fromCache ? " from-cache" : ""}" data-idx="${i}" style="animation-delay:${fromCache ? 0 : i * 65}ms;">
      <span class="roll-no">${bnRoll(i + 1)}</span>
      <span class="roll-avatar">${avatar}</span>
      <span class="roll-info">
        <span class="roll-name">${s.name}</span>
        <span class="roll-id">${s.studentId}</span>
      </span>
      <span class="roll-chevron">${icons.arrowRight}</span>
    </button>
  `;
}

function renderList(list, fromCache = false) {
  students = list;
  if (list.length === 0) {
    renderState(listEl, "empty", "এখনো কোনো শিক্ষার্থী যোগ করা হয়নি। অ্যাডমিন প্যানেল থেকে শিক্ষার্থী তৈরি করুন।");
    return;
  }
  listEl.innerHTML = list.map((s, i) => rowHtml(s, i, fromCache)).join("");
  listEl.querySelectorAll("[data-idx]").forEach(btn => {
    btn.addEventListener("click", () => selectStudent(students[Number(btn.dataset.idx)]));
  });
}

async function selectStudent(student) {
  setActiveStudent(student); // full student object (name/photoURL/etc.), not just id/name
  const active = await findActiveAttempt(student.studentId);
  if (active) {
    window.location.href = `./student/exam.html?examId=${active.examId}&resume=1`;
  } else {
    window.location.href = "./student/dashboard.html";
  }
}

// ---- Cache-first paint: show the last-known roll instantly, then quietly
// refresh from the live list in the background. ----
try {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
  if (cached && cached.length) {
    allStudents = cached;
    renderClassFilter();
    renderList(cached, true);
  }
} catch { /* corrupted cache — ignore, fresh fetch below will fix it */ }

async function loadStudents() {
  try {
    const fresh = await getActiveStudents();
    allStudents = fresh;
    applyClassFilter();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch { /* storage full/unavailable — non-fatal */ }
  } catch (err) {
    console.error(err);
    if (students.length === 0) renderState(listEl, "error", "শিক্ষার্থীদের তালিকা লোড করা যায়নি। আবার চেষ্টা করুন।");
  }
}

loadStudents();
</script>
</body>
</html>
