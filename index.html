<!DOCTYPE html>
<html lang="bn">
<head>
<script src="./js/utils/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EP2.0</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#b8863c">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EP2.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
  body { overflow-x: hidden; background: var(--bg-app); margin: 0; }

  /* ===== Page ===== */
  .app-shell { max-width: 680px; margin: 0 auto; padding: 0 18px 56px; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .topbar, .intro, .searchbar, .tabs, .directory { animation: fadeUp .45s cubic-bezier(.22,1,.36,1) backwards; }
  .intro { animation-delay: .05s; } .searchbar { animation-delay: .1s; } .tabs { animation-delay: .13s; } .directory { animation-delay: .17s; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 800; font-size: .95rem; color: var(--text-primary); letter-spacing: .01em; }
  .brand-mark { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--color-accent); color: #fff; display: flex; align-items: center; justify-content: center; }
  .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .admin-link { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--text-secondary); text-decoration: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--surface-border); background: var(--surface); transition: border-color var(--transition), color var(--transition); }
  .admin-link:hover { border-color: var(--color-accent); color: var(--text-primary); }

  /* Intro */
  .intro { padding: 30px 0 20px; }
  .intro h1 { font-size: 1.85rem; font-weight: 800; line-height: 1.25; letter-spacing: -.4px; color: var(--text-primary); }
  .intro p { margin-top: 8px; font-size: .92rem; color: var(--text-secondary); font-weight: 500; }
  .intro p b { color: var(--text-primary); font-family: var(--font-num); font-weight: 700; }
  @media (max-width: 480px) { .intro { padding-top: 22px; } .intro h1 { font-size: 1.55rem; } }

  /* Resume */
  .resume { display: none; align-items: center; gap: 12px; width: 100%; margin: 0 0 16px; padding: 10px 14px; text-align: left; font-family: inherit; cursor: pointer; border-radius: 14px; background: var(--color-accent-soft); border: 1px solid rgba(var(--color-accent-rgb), .3); color: var(--text-primary); transition: border-color var(--transition); }
  .resume.show { display: flex; }
  .resume:hover { border-color: var(--color-accent); }
  .resume .st-avatar { width: 38px; height: 38px; font-size: 1rem; }
  .resume small { display: block; font-size: .7rem; font-weight: 700; color: var(--color-accent); }
  .resume strong { display: block; font-size: .94rem; font-weight: 800; }
  .resume .go { margin-left: auto; flex: none; color: var(--color-accent); display: flex; }

  /* Search */
  .searchbar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 14px; padding: 0 14px; transition: border-color var(--transition), box-shadow var(--transition); }
  .searchbar:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), .15); }
  .search-icon { width: 19px; height: 19px; color: var(--text-muted); flex-shrink: 0; }
  .searchbar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; padding: 14px 0; font-size: .96rem; color: var(--text-primary); font-family: inherit; font-weight: 600; }
  .searchbar input::placeholder { color: var(--text-muted); font-weight: 500; }
  .searchbar input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
  .search-clear { display: none; background: var(--surface-edge); color: var(--text-muted); border: none; border-radius: 50%; width: 26px; height: 26px; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  /* Batch tabs (underline) */
  .tabs { display: flex; gap: 22px; overflow-x: auto; margin-top: 14px; border-bottom: 1px solid var(--surface-border); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 10px 0 11px; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid transparent; font-family: inherit; font-size: .88rem; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: color var(--transition), border-color var(--transition); }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--color-accent); }
  .tab em { font-style: normal; font-family: var(--font-num); font-size: .72rem; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--surface-edge); color: var(--text-secondary); }

  /* Directory list */
  .directory { margin-top: 16px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 18px; overflow: hidden; }
  .group-head { padding: 7px 18px; font-size: .74rem; font-weight: 800; color: var(--text-muted); background: var(--surface-highlight); border-bottom: 1px solid var(--surface-border); letter-spacing: .04em; }
  .student-card { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 18px; background: transparent; border: 0; border-bottom: 1px solid var(--surface-border); text-align: left; font-family: inherit; color: inherit; cursor: pointer; transition: background var(--transition); animation: printIn 350ms ease-out both; }
  .student-card:last-child { border-bottom: 0; }
  .student-card:hover { background: var(--surface-highlight); }
  .student-card:active { background: var(--surface-edge); }
  .student-card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  @keyframes printIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .student-card.from-cache { animation: none; }
  .student-card.is-loading { background: var(--surface-highlight); pointer-events: none; }
  .student-card.is-loading .st-go { display: none; }
  .student-card.is-loading::after { content: ""; position: absolute; right: 18px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border: 2.5px solid var(--color-accent); border-top-color: transparent; border-radius: 50%; animation: spinLoad .8s linear infinite; }
  @keyframes spinLoad { to { transform: rotate(360deg); } }

  .st-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; overflow: hidden; flex-shrink: 0; }
  .st-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .st-info { flex: 1; min-width: 0; }
  .st-name { font-weight: 700; font-size: .98rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-id { margin-top: 2px; font-size: .74rem; color: var(--text-muted); font-weight: 600; font-family: var(--font-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-batch { flex: none; font-size: .72rem; font-weight: 700; color: var(--text-secondary); }
  .st-go { flex: none; display: flex; color: var(--text-muted); transition: transform var(--transition), color var(--transition); }
  .student-card:hover .st-go { color: var(--color-accent); transform: translateX(2px); }
  @media (max-width: 420px) { .st-batch { display: none; } }

  /* Skeleton / empty */
  .skel-card { display: flex; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--surface-border); }
  .skel-circle { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-edge); animation: pulse 1.5s infinite; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .skel-line { height: 11px; border-radius: 6px; background: var(--surface-edge); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .empty-search { padding: 44px 20px; text-align: center; color: var(--text-muted); }
  .empty-search-icon { width: 38px; height: 38px; margin: 0 auto 12px; color: var(--color-accent); }
  .empty-search strong { display: block; color: var(--text-primary); font-size: .95rem; margin-bottom: 6px; font-weight: 800; }

  /* Install card */
  .pwa-card { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 40px 12px 12px; border-radius: 16px; border: 1px solid rgba(var(--color-accent-rgb), .3); background: var(--color-accent-soft); }
  .pwa-card img { width: 44px; height: 44px; border-radius: 12px; flex: none; }
  .pwa-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4; }
  .pwa-txt b { font-size: .86rem; font-weight: 800; color: var(--text-primary); }
  .pwa-txt small { font-size: .72rem; font-weight: 600; color: var(--text-secondary); }
  .pwa-btn { flex: none; height: 36px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--color-accent); color: #fff; font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .pwa-x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--text-muted); font-size: .8rem; cursor: pointer; }

  /* Footer */
  .foot-section { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--surface-border); }
  .foot-section p { font-size: .84rem; font-weight: 600; color: var(--text-secondary); line-height: 1.4; }
  .btn-join { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 99px; background: var(--text-primary); color: var(--bg-app); font-size: .82rem; font-weight: 700; text-decoration: none; transition: opacity var(--transition); }
  .btn-join:hover { opacity: .86; }
  @media (max-width: 420px) { .foot-section { flex-direction: column; align-items: stretch; text-align: center; } .btn-join { justify-content: center; } }

  /* ===== Personal welcome-back (this device remembers who you are) ===== */
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  @media (max-width: 420px) { .topbar-actions .theme-toggle { transform: scale(.88); } .topbar-actions .admin-link { padding: 7px 10px; } .topbar { gap: 8px; } }
  .me-hero { display: none; }
  .hero-mode .me-hero { display: flex; flex-direction: column; justify-content: center; }
  /* Phone: in hero mode only the personal card is shown (nobody else's name). PC re-shows the list on the right. */
  @media (max-width: 959px) {
    .hero-mode .intro, .hero-mode .resume, .hero-mode .searchbar, .hero-mode .tabs, .hero-mode #classFilter, .hero-mode .directory, .hero-mode .foot-section, .hero-mode #meBack, .hero-mode .battle-note, .hero-mode .side-head, .hero-mode #pwaHost { display: none !important; }
  }
  .has-remembered .resume { display: none !important; }
  .me-back { display: none; align-items: center; gap: 8px; margin: 14px 0 0; padding: 9px 14px 9px 10px; border-radius: 99px; background: var(--color-accent-soft); border: 1px solid rgba(var(--color-accent-rgb), .3); color: var(--text-primary); font: inherit; font-size: .8rem; font-weight: 800; cursor: pointer; max-width: 100%; }
  .list-mode.has-remembered .me-back { display: inline-flex; animation: fadeUp .4s cubic-bezier(.22,1,.36,1) backwards; }
  .me-back .st-avatar { width: 26px; height: 26px; font-size: .75rem; }
  .me-back span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .me-hero { position: relative; margin-top: 10px; padding: 30px 22px 22px; text-align: center; border-radius: 30px; overflow: hidden; border: 1px solid var(--surface-border); background: radial-gradient(120% 85% at 50% 0%, rgba(var(--color-accent-rgb), .20), transparent 64%), var(--surface); box-shadow: var(--shadow-lift); }
  .me-glow { position: absolute; width: 340px; height: 340px; left: 50%; top: -150px; margin-left: -170px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--color-accent-rgb), .38), transparent 66%); animation: meGlow 6s ease-in-out infinite; pointer-events: none; }
  @keyframes meGlow { 0%, 100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.1); opacity: 1; } }
  .me-hero > *:not(.me-glow) { position: relative; }
  .me-hello { font-size: .84rem; font-weight: 800; color: var(--color-accent); letter-spacing: .03em; }
  .me-av-wrap { position: relative; width: 132px; height: 132px; margin: 18px auto 18px; display: grid; place-items: center; }
  .me-ring { position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgba(var(--color-accent-rgb), .55); animation: meRing 3.2s ease-out infinite; }
  .me-ring.r2 { animation-delay: 1.6s; }
  @keyframes meRing { 0% { transform: scale(.82); opacity: .9; } 100% { transform: scale(1.2); opacity: 0; } }
  .me-av { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent); font-size: 3rem; font-weight: 900; border: 3px solid var(--surface); box-shadow: 0 0 0 3px var(--color-accent), 0 16px 36px rgba(var(--color-accent-rgb), .42); }
  .me-av .me-av-in { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%; }
  .me-av img { width: 100%; height: 100%; object-fit: cover; }
  .me-name { font-size: clamp(2.1rem, 10.5vw, 3rem); font-weight: 900; line-height: 1.16; letter-spacing: -.8px; color: var(--text-primary); word-break: break-word; padding: 0 4px; }
  .me-meta { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
  .me-pill { padding: 5px 13px; border-radius: 99px; background: var(--color-accent-soft); border: 1px solid rgba(var(--color-accent-rgb), .3); color: var(--text-primary); font-size: .78rem; font-weight: 800; }
  .me-id { font-family: var(--font-num); font-size: .78rem; font-weight: 700; color: var(--text-muted); letter-spacing: .04em; }
  .me-go { position: relative; overflow: hidden; width: 100%; min-height: 58px; margin-top: 26px; border: 0; border-radius: 20px; background: var(--color-accent); color: #fff; font: inherit; font-size: 1.05rem; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 14px 30px rgba(var(--color-accent-rgb), .45); transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .me-go:active { transform: scale(.97); }
  .me-go::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); animation: meShine 3.4s ease-in-out infinite 1s; }
  @keyframes meShine { 0% { left: -80px; } 40%, 100% { left: 120%; } }
  .me-go.is-loading { pointer-events: none; opacity: .85; }
  .me-go.is-loading svg { display: none; }
  .me-go.is-loading::before { content: ""; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spinLoad .7s linear infinite; }
  .me-other { margin: 12px auto 0; padding: 10px 14px; background: none; border: 0; color: var(--text-secondary); font: inherit; font-size: .85rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; }
  .me-other:hover, .me-other:active { color: var(--color-accent); background: var(--color-accent-soft); }
  .me-hero.in > .me-hello { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) backwards .05s; }
  .me-hero.in .me-av-wrap { animation: meAvIn .7s cubic-bezier(.34,1.56,.64,1) backwards .12s; }
  .me-hero.in .me-name { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) backwards .25s; }
  .me-hero.in .me-meta { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) backwards .33s; }
  .me-hero.in .me-go { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) backwards .42s; }
  .me-hero.in .me-other { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) backwards .5s; }
  @keyframes meAvIn { from { opacity: 0; transform: scale(.6) rotate(-10deg); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .me-glow, .me-ring, .me-go::after { animation: none; } }

  /* =====================================================================
     FULL-SCREEN LAYOUT  (phone = one column, PC = hero left + students right)
     ===================================================================== */
  .app-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .topbar { flex: none; }
  .layout { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .col-main, .col-side { display: contents; }   /* phone: children flow in one column, ordered below */
  .me-hero { order: 0; } .me-back { order: 1; } .intro { order: 2; } .side-head { display: none; order: 3; }
  .resume, .battle-note { order: 4; } .searchbar { order: 5; } #classFilter { order: 6; } .directory { order: 7; } #pwaHost { order: 8; } .foot-section { order: 9; }

  /* Hero fills the whole phone screen, content centred */
  .hero-mode .me-hero { flex: 1; margin: 6px 0 0; padding: clamp(24px, 5dvh, 44px) 22px clamp(22px, 4dvh, 36px); }
  .me-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(var(--color-accent-rgb), .18) 1.2px, transparent 1.5px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(75% 60% at 50% 42%, transparent 38%, #000 100%); mask-image: radial-gradient(75% 60% at 50% 42%, transparent 38%, #000 100%); }
  .me-av-wrap { flex: none; width: clamp(132px, 24dvh, 196px); height: clamp(132px, 24dvh, 196px); margin: clamp(14px, 3dvh, 28px) auto; }
  .me-av { width: calc(100% - 20px); height: calc(100% - 20px); font-size: clamp(3rem, 8dvh, 4.6rem); }
  .me-hello { font-size: .9rem; margin-top: auto; }
  .me-meta { margin-bottom: clamp(20px, 4dvh, 40px); }
  .me-go { margin-top: auto; }

  /* Student rows: "you" tag + active (previewed) state */
  .student-card .st-me { flex: none; font-size: .66rem; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--color-accent); color: #fff; letter-spacing: .02em; }
  .student-card.is-active { background: var(--color-accent-soft); }
  .student-card.is-active .st-go { color: var(--color-accent); }

  /* ---------------- PC ---------------- */
  @media (min-width: 960px) {
    .app-shell { max-width: 1260px; padding: 0 44px 30px; height: 100vh; height: 100dvh; min-height: 640px; }
    .topbar { padding: 24px 0 18px; }
    .brand { font-size: 1.02rem; } .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(390px, 34vw, 470px); gap: 28px; }
    .col-main { display: flex; flex-direction: column; gap: 16px; min-height: 0; min-width: 0; }
    .col-side { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 24px 20px 10px; border-radius: 32px; background: var(--surface); border: 1px solid var(--surface-border); box-shadow: var(--shadow-lift); overflow: hidden; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) backwards .12s; }

    /* these are replaced by the hero's own buttons / the side list */
    .resume, .me-back { display: none !important; }
    .hero-mode .intro { display: none !important; }

    /* Left: hero fills the column */
    .hero-mode .me-hero { margin: 0; padding: 36px 40px 32px; border-radius: 36px; }
    .me-name { font-size: clamp(2.6rem, 4.6vw, 4rem); }
    .me-go { max-width: 440px; margin-left: auto; margin-right: auto; }
    .me-other { margin-top: 16px; }
    .me-hello { font-size: .98rem; }
    .me-pill { font-size: .86rem; padding: 6px 16px; } .me-id { font-size: .86rem; }

    /* Left, nothing chosen yet: welcome panel */
    .app-shell:not(.hero-mode) .intro { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; margin: 0; border-radius: 36px; border: 1px solid var(--surface-border); box-shadow: var(--shadow-lift); background: radial-gradient(120% 85% at 50% 0%, rgba(var(--color-accent-rgb), .20), transparent 64%), var(--surface); }
    .app-shell:not(.hero-mode) .intro { position: relative; overflow: hidden; }
    .app-shell:not(.hero-mode) .intro::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(var(--color-accent-rgb), .18) 1.2px, transparent 1.5px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(70% 55% at 50% 50%, transparent 40%, #000 100%); mask-image: radial-gradient(70% 55% at 50% 50%, transparent 40%, #000 100%); }
    .app-shell:not(.hero-mode) .intro > * { position: relative; }
    .intro h1 { font-size: clamp(2.2rem, 3.6vw, 3.1rem); line-height: 1.22; }
    .intro p { font-size: 1.02rem; margin-top: 14px; }
    #pwaHost { margin-top: 0 !important; } #pwaHost:empty { display: none; }
    .foot-section { margin-top: 0; padding: 14px 20px; border-radius: 20px; }

    /* Right: students panel */
    .side-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 16px; }
    .side-head h2 { font-size: 1.12rem; font-weight: 800; color: var(--text-primary); letter-spacing: -.1px; }
    .side-head h2 small { display: block; margin-top: 3px; font-size: .76rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0; }
    .side-count { flex: none; font-family: var(--font-num); font-size: .8rem; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: var(--color-accent-soft); color: var(--color-accent); border: 1px solid rgba(var(--color-accent-rgb), .25); }
    .col-side .searchbar { background: var(--surface-highlight); border-radius: 16px; }
    .col-side .tabs { margin-top: 12px; }

<script type="module">
import { initTheme, toggleTheme, icons, renderState } from "./js/utils/ui-utils.js";
import { getActiveStudents, setActiveStudent, findActiveAttempt } from "./js/utils/student-utils.js";
import { currentStudentSession, studentLogin, setNewPassword, friendlyStudentAuthError, getStudentAuthStatus, requestSetupCode, studentLogout, validatePin, PIN_LENGTH } from "./js/utils/student-auth.js";
import { getPlatformSettings } from "./js/utils/settings-utils.js";
import { mountInstallCard } from "./js/utils/pwa-install.js";
import { watchPendingApplications, watchApplication, getApplication } from "./js/utils/student-requests-utils.js";
import { getWelcomePending, markWelcomeSeen } from "./js/utils/student-auth.js";

// Initialize Theme
initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);

// Name fallback logic
const TITLE_CACHE_KEY = "cachedPlatformTitle";
const headingEl = document.getElementById("platformHeading");
try {
  const cachedTitle = localStorage.getItem(TITLE_CACHE_KEY);
  if (cachedTitle) headingEl.textContent = cachedTitle;
} catch {}

async function loadPlatformTitle() {
  try {
    const settings = await getPlatformSettings();
    if (settings.platformTitle) {
      headingEl.textContent = settings.platformTitle;
      try { localStorage.setItem(TITLE_CACHE_KEY, settings.platformTitle); } catch {}
    }
  } catch (err) { console.error(err); }
}
loadPlatformTitle();
mountInstallCard(document.getElementById("pwaHost"));

const listEl = document.getElementById("studentList");
const filterEl = document.getElementById("classFilter");
const searchInput = document.getElementById("studentSearchInput");
if (safeNext()) {
  const note = document.createElement("div");
  note.style.cssText = "margin:0 0 12px;padding:12px 14px;border-radius:var(--radius-md);background:var(--color-accent-soft);border:1px solid rgba(var(--color-accent-rgb),.28);color:var(--text-primary);font-size:.84rem;font-weight:700;line-height:1.5";
  note.className = "battle-note";
  note.textContent = "Battle-এ যোগ দিতে আগে নিজের নাম বেছে PIN দাও। তারপর নিজে থেকেই Battle-এ যোগ হবে।";
  searchInput?.parentElement?.insertAdjacentElement("beforebegin", note);
}
const searchClear = document.getElementById("studentSearchClear");
const countEl = document.getElementById("studentCount");
const CACHE_KEY = "cachedStudentList";

let students = [];
let allStudents = [];
let activeClassFilter = "all";
let activeSearch = "";
let pendingApps = [];                  // applications waiting for admin approval (from the database)

function renderClassFilter() {
  const classes = [...new Set(allStudents.map(s => s.className).filter(Boolean))].sort();
  if (classes.length === 0) { filterEl.classList.add("hidden"); return; }
  filterEl.classList.remove("hidden");
  const cnt = (c) => allStudents.filter(s => s.className === c).length;
  filterEl.innerHTML = [
    `<button class="tab${activeClassFilter === "all" ? " active" : ""}" data-class="all">সবাই<em>${bnNum(allStudents.length)}</em></button>`,
    ...classes.map(c => `<button class="tab${activeClassFilter === c ? " active" : ""}" data-class="${esc(c)}">${esc(c)}<em>${bnNum(cnt(c))}</em></button>`)
  ].join("");
  filterEl.querySelectorAll(".tab").forEach(chip => {
    chip.addEventListener("click", () => {
      activeClassFilter = chip.dataset.class;
      applySearchAndClassFilter();
    });
  });
}

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const bnNum = (n) => String(n).split("").map(d => /\d/.test(d) ? BN_DIGITS[Number(d)] : d).join("");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LAST_KEY = "lastStudentId";
const sortStudents = (list) => [...list].sort((a, b) => safeStudentName(a).localeCompare(safeStudentName(b), "bn"));

function updateStats() {
  const b = new Set(allStudents.map(s => s.className).filter(Boolean)).size;
  document.getElementById("statStudents").textContent = bnNum(allStudents.length);
  document.getElementById("statBatches").textContent = bnNum(b);
}

function avatarHtml(s, cls = "st-avatar") {
  const name = safeStudentName(s);
  const initial = esc(name.charAt(0) || "শ");
  const photo = typeof s?.photoURL === "string" ? s.photoURL.trim() : "";
  return photo
    ? `<span class="${cls}"><img src="${esc(photo)}" alt="" draggable="false" oncontextmenu="return false" onerror="this.replaceWith(document.createTextNode('${initial}'))"></span>`
    : `<span class="${cls}">${initial}</span>`;
}

function renderResume() {
  const btn = document.getElementById("resumeBtn");
  let id = ""; try { id = localStorage.getItem(LAST_KEY) || ""; } catch {}
  const s = allStudents.find(x => safeStudentId(x) === id);
  if (!s || activeSearch) { btn.classList.remove("show"); return; }
  btn.classList.add("show");
  document.getElementById("resumeAv").outerHTML = avatarHtml(s).replace('class="st-avatar"', 'class="st-avatar" id="resumeAv"');
  document.getElementById("resumeName").textContent = safeStudentName(s);
  btn.onclick = () => selectStudent(s, btn);
}

function safeStudentName(s) {
  const value = s?.name ?? s?.studentName ?? s?.displayName ?? s?.fullName ?? "";
  const text = String(value).trim();
  return text && text !== "undefined" && text !== "null" ? text : "নাম পাওয়া যায়নি";
}

function safeStudentId(s) {
  const value = s?.studentId ?? s?.id ?? s?.uid ?? "";
  const text = String(value).trim();
  return text && text !== "undefined" && text !== "null" ? text : "আইডি পাওয়া যায়নি";
}

function normalized(value) { return String(value ?? "").trim().toLocaleLowerCase(); }

function applySearchAndClassFilter() {
  renderClassFilter();
  let filtered = allStudents;
  if (activeClassFilter !== "all") filtered = filtered.filter(s => s?.className === activeClassFilter);
  if (activeSearch) {
    filtered = filtered.filter(s => {
      const name = normalized(safeStudentName(s));
      const id = normalized(safeStudentId(s));
      return name.includes(activeSearch) || id.includes(activeSearch);
    });
  }
  renderList(filtered, false);
  appendPendingRows();
  updateStats();
  renderResume();
  renderView();
  const total = filtered.length;
  if (countEl) countEl.textContent = `${bnNum(total)} জন`;
  const sc = document.getElementById("sideCount"); if (sc) sc.textContent = `${bnNum(total)} জন`;
  if (searchClear) searchClear.style.display = activeSearch ? "flex" : "none";
}

// ---------------------------------------------------------------
// Pending applications: names come from the database (applicationStatus where
// status == pending). Shown blurred at the end of the list; tap = approval status.
// ---------------------------------------------------------------
const HOURGLASS = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M7 2v4a5 5 0 0 0 2 4l3 2-3 2a5 5 0 0 0-2 4v4M17 2v4a5 5 0 0 1-2 4l-3 2 3 2a5 5 0 0 1 2 4v4"/></svg>';
function appendPendingRows() {
  listEl.querySelectorAll(".pend-sep, .is-pending").forEach(el => el.remove());
  if (activeSearch) return;
  const apps = pendingApps
    .filter(a => activeClassFilter === "all" || a.className === activeClassFilter)
    .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
  if (!apps.length) return;
  const sep = document.createElement("div");
  sep.className = "pend-sep";
  sep.textContent = `অনুমোদনের অপেক্ষায় · ${bnNum(apps.length)} জন`;
  listEl.appendChild(sep);
  apps.forEach(a => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "student-card is-pending";
    b.innerHTML = `<span class="st-avatar">${esc((a.name || "?").trim().charAt(0))}</span>
      <div class="st-info"><div class="st-name">${esc(a.name || "—")}</div><div class="st-id">${esc(a.studentId || "STU-0000")}</div></div>
      <span class="st-wait">${HOURGLASS} অপেক্ষায়</span>`;
    b.addEventListener("click", () => openPendingSheet(a));
    listEl.appendChild(b);
  });
}

let pendingSheetOff = null;
function openPendingSheet(app) {
  pendingSheetOff?.();
  const ov = document.createElement("div");
  ov.className = "pnd-ov";
  ov.innerHTML = `<div class="pnd-sheet" role="dialog" aria-modal="true"></div>`;
  document.body.appendChild(ov);
  const sheet = ov.firstElementChild;
  requestAnimationFrame(() => ov.classList.add("show"));
  const close = () => { pendingSheetOff = null; off?.(); ov.classList.remove("show"); setTimeout(() => ov.remove(), 280); };
  pendingSheetOff = close;
  ov.addEventListener("click", (e) => { if (e.target === ov) close(); });

  const fmt = (ts) => { try { return new Date(ts.seconds * 1000).toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }); } catch { return ""; } };
  const check = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const cross = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const orb = (cls, inner) => `<div class="pnd-orb ${cls}"><i></i><i></i><i></i><div class="core">${inner}</div></div>`;

  // 1) loading while the live record is fetched from the database
  sheet.innerHTML = `${orb("", HOURGLASS.replace(/13/g, "28"))}
    <div class="pnd-h">অবস্থা দেখা হচ্ছে…</div>
    <div class="pnd-info"><div><span>নাম</span><span class="pnd-sk" style="width:110px"></span></div><div><span>ব্যাচ</span><span class="pnd-sk" style="width:70px"></span></div><div><span>অবস্থা</span><span class="pnd-sk" style="width:90px"></span></div></div>`;

  function paint(d) {
    const st = d?.status || "pending";
    const rows = [["নাম", esc(d?.name || app.name || "—")], ["ব্যাচ", esc(d?.className || app.className || "—")]];
    if (d?.term) rows.push(["টার্ম", esc(d.term)]);
    if (d?.createdAt) rows.push(["আবেদনের তারিখ", esc(fmt(d.createdAt))]);
    const info = `<div class="pnd-info">${rows.map(r => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>`;
    let head;
    if (st === "approved") head = `${orb("ok", check)}<div class="pnd-h">অনুমোদন হয়ে গেছে!</div><p class="pnd-p">তালিকায় নিজের নাম চেপে <b>নিজের PIN</b> দিয়ে ঢুকে পড়ো।</p>`;
    else if (st === "rejected") head = `${orb("bad", cross)}<div class="pnd-h">আবেদন বাতিল হয়েছে</div><p class="pnd-p">এই আইডি আর কাজ করবে না। চাইলে আবার আবেদন করতে পারো।</p>`;
    else head = `${orb("", HOURGLASS.replace(/13/g, "28"))}<div class="pnd-h">অনুমোদনের অপেক্ষায়</div><p class="pnd-p">অ্যাডমিন তোমার আবেদন দেখছেন। অনুমোদন হলে এখানেই সাথে সাথে জানতে পারবে।</p>`;
    sheet.innerHTML = `${head}${info}<button type="button" class="pnd-close">ঠিক আছে</button>`;
    sheet.querySelector(".pnd-close").onclick = close;
  }
  // 2) live from the database (no localStorage involved)
  let first = true;
  const off = watchApplication(app.id, (d) => {
    if (!d) { if (first) paint(app); first = false; return; }
    first = false; paint(d);
  });
}

function rowHtml(s, i, fromCache) {
  const name = esc(safeStudentName(s));
  const studentId = esc(safeStudentId(s));
  const batch = s?.className ? `<span class="st-batch">${esc(s.className)}</span>` : "";
  const sid = safeStudentId(s);
  const meTag = rememberedId && sid === rememberedId ? `<span class="st-me">তুমি</span>` : "";
  return `
    <button class="student-card${fromCache ? " from-cache" : ""}${sid === shownId ? " is-active" : ""}" data-idx="${i}" data-sid="${esc(sid)}" style="animation-delay:${fromCache ? 0 : Math.min(i, 14) * 25}ms;">
      ${avatarHtml(s)}
      <div class="st-info">
        <div class="st-name">${name}</div>
        <div class="st-id">${studentId}</div>
      </div>
      ${meTag}${batch}
      <span class="st-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </button>`;
}

function renderList(list, fromCache = false) {
  students = list;
  if (list.length === 0) {
    if (activeSearch) {
      listEl.innerHTML = `<div class="empty-search">
        <svg class="empty-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <strong>শিক্ষার্থী পাওয়া যায়নি</strong>
        <span style="font-size:0.85rem;">নাম বা আইডি একটু অন্যভাবে লিখে চেষ্টা করো।</span>
      </div>`;
    } else {
      renderState(listEl, "empty", "এখনো কোনো শিক্ষার্থী যোগ করা হয়নি। অ্যাডমিন প্যানেল থেকে শিক্ষার্থী তৈরি করুন।");
    }
    if (countEl) countEl.textContent = "0 জন";
    return;
  }
  
  const out = list.map((s, i) => rowHtml(s, i, fromCache)).join("");
  listEl.innerHTML = out;
  if (countEl) countEl.textContent = `${bnNum(list.length)} জন`;
  
  listEl.querySelectorAll("[data-idx]").forEach(btn => {
    btn.addEventListener("click", function() {
      const picked = students[Number(this.dataset.idx)];
      // This device knows someone -> show the picked name in the personal design first.
      if (rememberedId || isDesktop()) { heroStudent = picked; view = "hero"; renderView(true); if (!isDesktop()) window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      selectStudent(picked, this);
    });
  });
}

function askStudentPassword(student) {
  injectPwStyle();
  return new Promise((resolve) => {
    const ov = document.createElement("div");
    ov.className = "pw-ov";
    ov.innerHTML = `<div class="pw-card" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
      <div class="pw-grab"></div>
      <div class="pw-top">
        <button class="pw-x" type="button" aria-label="বন্ধ">${pwSvg("x", 18)}</button>
        <div class="pw-av"></div>
        <div class="pw-who"><div class="pw-nm" id="pwTitle"></div><div class="pw-cl"></div></div>
      </div>
      <div id="pwSteps"></div>
      <div class="pw-body" id="pwBody"></div>
      <div class="pw-foot">${pwSvg("lock", 13)} সুরক্ষিত প্রবেশ · তোমার পাসওয়ার্ড নিরাপদে থাকে</div></div>`;
    const av = ov.querySelector(".pw-av");
    const photo = typeof student.photoURL === "string" ? student.photoURL.trim() : "";
    if (photo) { const im = document.createElement("img"); im.alt = ""; im.src = photo; im.onerror = () => im.replaceWith(document.createTextNode((student.name || "S").charAt(0))); av.appendChild(im); }
    else av.textContent = (student.name || "S").charAt(0);
    av.insertAdjacentHTML("beforeend", `<span class="pw-badge">${pwSvg("lock", 13)}</span>`);
    ov.querySelector(".pw-nm").textContent = student.name || "";
    const cl = ov.querySelector(".pw-cl");
    if (student.className) { const pill = document.createElement("span"); pill.className = "pw-pill"; pill.textContent = student.className; cl.appendChild(pill); }
    const idSpan = document.createElement("span"); idSpan.className = "num"; idSpan.textContent = student.studentId;
    cl.appendChild(idSpan);
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.body.appendChild(ov);

    const body = ov.querySelector("#pwBody");
    const stepsEl = ov.querySelector("#pwSteps");
    const onKey = (e) => { if (e.key === "Escape") done(false); };
    const done = (v) => { dropPadKey(); document.removeEventListener("keydown", onKey); if (!v && migrating) studentLogout().catch(() => {}); document.body.style.overflow = prevOverflow; ov.remove(); try { prevFocus?.focus?.({ preventScroll: true }); } catch {} resolve(v); };
    document.addEventListener("keydown", onKey);
    ov.querySelector(".pw-x").addEventListener("click", () => done(false));
    ov.addEventListener("mousedown", (e) => { if (e.target === ov) done(false); });

    const field = (id, ph, ac, extra = "") => `<div class="pw-f ${extra}"><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"><button type="button" class="pw-eye" data-for="${id}" aria-label="দেখাও">${pwSvg("eye", 20)}</button></div>`;
    const steps = (n) => { stepsEl.innerHTML = `<div class="pw-steps">
        <div class="pw-step ${n === 1 ? "on" : "done"}">${n === 1 ? `<span class="pw-sn">১</span>` : pwSvg("check", 15)} যাচাই</div>
        <div class="pw-step ${n === 2 ? "on" : ""}"><span class="pw-sn">২</span> নতুন PIN</div></div>`; };
    const wireCommon = () => {
      body.querySelectorAll(".pw-eye").forEach(b => b.addEventListener("click", () => {
        const i = body.querySelector("#" + b.dataset.for);
        const show = i.type === "password";
        i.type = show ? "text" : "password";
        b.innerHTML = pwSvg(show ? "eyeOff" : "eye", 20);
        b.classList.toggle("on", show);
      }));
      body.querySelectorAll(".pw-f input").forEach(inp => {
        const caps = document.createElement("div");
        caps.className = "pw-caps"; caps.innerHTML = `${pwSvg("info", 14)}Caps Lock চালু আছে`;
        inp.closest(".pw-f").insertAdjacentElement("afterend", caps);
        const chk = (e) => caps.classList.toggle("show", !!e.getModifierState?.("CapsLock"));
        inp.addEventListener("keyup", chk); inp.addEventListener("keydown", chk);
        inp.addEventListener("input", () => { inp.closest(".pw-f").classList.remove("bad"); });
      });
      body.querySelector("input")?.focus();
    };
    const setErr = (m) => {
      const e = body.querySelector(".pw-err"); if (e) e.textContent = m || "";
      body.querySelectorAll(".pw-f").forEach(f => f.classList.toggle("bad", !!m));
      if (m) { const c = ov.querySelector(".pw-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
    };
    const busy = (b, t) => { b.disabled = true; b.dataset.t = b.innerHTML; b.innerHTML = `<span class="pw-spin"></span><span>${t}</span>`; };
    const idle = (b) => { b.disabled = false; b.innerHTML = b.dataset.t; };

    // ---- screens ----
    function viewChecking() { stepsEl.innerHTML = ""; body.innerHTML = `<p class="pw-p" style="text-align:center;margin:18px 0">একটু অপেক্ষা করো…</p>`; }

    // ---- on-screen number pad (no system keyboard is ever opened) ----
    let padKey = null;
    let lockTimer = null;
    const dropPadKey = () => { clearInterval(lockTimer); if (padKey) { document.removeEventListener("keydown", padKey); padKey = null; } };
    const mountPad = (len, mask, onFull) => {
      dropPadKey();
      const dots = body.querySelector(".pw-dots"), pad = body.querySelector(".pw-pad");
      let val = "", locked = false;
      const paint = () => { dots.querySelectorAll("i").forEach((el, i) => { el.classList.toggle("on", i < val.length); el.textContent = mask ? "" : (val[i] || ""); }); };
      const press = (k) => {
        if (locked) return;
        dots.classList.remove("bad"); setStatus("");
        if (k === "del") val = val.slice(0, -1);
        else if (val.length < len) { val += k; try { navigator.vibrate?.(6); } catch {} }
        paint();
        if (val.length === len && mask) onFull(val);
      };
      pad.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) press(b.dataset.k); });
      padKey = (e) => {
        if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("del");
        else if (e.key === "Enter" && !mask && val.length === len) onFull(val);
      };
      document.addEventListener("keydown", padKey);
      paint();
      return {
        get: () => val,
        lock: (v) => { locked = v; pad.classList.toggle("lock", v); },
        fail: (m) => { val = ""; paint(); dots.classList.add("bad"); setStatus(m, true); const c = ov.querySelector(".pw-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
      };
    };
    const setStatus = (m, isErr) => { const e = body.querySelector(".pw-status"); if (e) { e.textContent = m || ""; e.classList.toggle("err", !!isErr); } };
    const padHtml = (len, mask) => `<div class="pw-dots${mask ? "" : " boxes"}">${"<i></i>".repeat(len)}</div>
      <div class="pw-status"></div>
      <div class="pw-pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="pw-key" data-k="${n}">${n}</button>`).join("")}
        <button type="button" class="pw-key ghost" tabindex="-1" aria-hidden="true"></button>
        <button type="button" class="pw-key" data-k="0">0</button>
        <button type="button" class="pw-key fn" data-k="del" aria-label="মুছো">${pwSvg("backspace", 24)}</button></div>`;

    let migrating = false;
    let legacyMode = false;
    const backToLogin = () => (legacyMode ? viewLegacy() : viewLogin());

    // Normal login: 6-digit PIN
    function viewLogin(note) {
      stepsEl.innerHTML = "";
      body.innerHTML = `<h3 class="pw-h">তোমার PIN দাও</h3>
        <p class="pw-p">${PIN_LENGTH} সংখ্যার PIN লিখে ঢোকো।</p>
        ${note ? `<div class="pw-note">${pwSvg("info", 16)}<span>${note}</span></div>` : ""}
        ${padHtml(PIN_LENGTH, true)}
        <button class="pw-link" id="pwForgot" type="button">PIN ভুলে গেছো?</button>`;
      const LK = "pinLock:" + student.studentId;
      const getLk = () => { try { return JSON.parse(localStorage.getItem(LK) || "{}"); } catch { return {}; } };
      const setLk = (o) => { try { localStorage.setItem(LK, JSON.stringify(o)); } catch {} };
      const bn = (n) => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
      const fmt = (sec) => sec >= 60 ? `${bn(Math.ceil(sec / 60))} মিনিট` : `${bn(sec)} সেকেন্ড`;
      const startLock = () => {
        clearInterval(lockTimer);
        const tick = () => {
          const left = Math.ceil(((getLk().until || 0) - Date.now()) / 1000);
          if (left <= 0) { clearInterval(lockTimer); pad.lock(false); setStatus(""); body.querySelector(".pw-dots")?.classList.remove("bad"); return false; }
          pad.lock(true); body.querySelector(".pw-dots")?.classList.add("bad");
          setStatus(`অনেকবার ভুল হয়েছে। ${fmt(left)} পরে আবার চেষ্টা করো।`, true);
          return true;
        };
        if (tick()) lockTimer = setInterval(tick, 1000);
      };
      const pad = mountPad(PIN_LENGTH, true, async (v) => {
        pad.lock(true); setStatus("যাচাই হচ্ছে…");
        try { const r = await studentLogin(student.studentId, v); setLk({}); r.needsNewPassword ? viewNewPin() : done(true); }
        catch (e) {
          pad.lock(false);
          const c = e?.code || "", L = getLk();
          if (c === "auth/invalid-credential" || c === "auth/wrong-password") {
            L.fails = (L.fails || 0) + 1;
            if (L.fails % 5 === 0) { const secs = [30, 120, 600, 1800][Math.min(L.fails / 5 - 1, 3)]; L.until = Date.now() + secs * 1000; }
            setLk(L);
            if ((L.until || 0) > Date.now()) { pad.fail(""); startLock(); return; }
            const rem = 5 - (L.fails % 5);
            pad.fail("PIN ভুল" + (rem <= 2 ? ` (আর ${bn(rem)} বার চেষ্টা করা যাবে)` : ""));
          } else if (c === "auth/too-many-requests") {
            L.until = Date.now() + 300000; setLk(L); pad.fail(""); startLock();
          } else pad.fail(friendlyStudentAuthError(e));
        }
      });
      startLock();
      body.querySelector("#pwForgot").addEventListener("click", viewForgot);
    }

    // Old students: still on a letter password -> sign in once with the normal keyboard, then pick a PIN.
    function viewTextEntry(title, text, ph, errMsg) {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-ic">${pwSvg("key", 22)}</div>
        <h3 class="pw-h">${title}</h3>
        <p class="pw-p">${text}</p>
        ${field("pw1", ph, "current-password")}
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button"><span>পরের ধাপ</span>${pwSvg("right", 18)}</button>
        <button class="pw-link" id="pwForgot" type="button">পাসওয়ার্ড মনে নেই?</button>`;
      wireCommon();
      const go = async () => {
        const v = body.querySelector("#pw1").value; if (!v) return setErr("লেখো।");
        const b = body.querySelector("#pwGo"); busy(b, "যাচাই হচ্ছে…"); setErr("");
        try { const r = await studentLogin(student.studentId, v); r.needsNewPassword ? viewNewPin() : done(true); }
        catch (e) { setErr(errMsg || friendlyStudentAuthError(e)); idle(b); }
      };
      body.querySelector("#pwGo").addEventListener("click", go);
      body.querySelector("#pw1").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      body.querySelector("#pwForgot").addEventListener("click", viewForgot);
    }
    const viewLegacy = () => { legacyMode = true; viewTextEntry("নতুন নিয়ম: এবার থেকে PIN",
      "নিরাপত্তার জন্য এখন শুধু <b>৬ সংখ্যার PIN</b> দিয়ে ঢুকতে হবে। আজ একবার তোমার <b>পুরোনো পাসওয়ার্ড</b> লিখে ঢোকো, তারপর নতুন PIN বানাবে।",
      "পুরোনো পাসওয়ার্ড"); };

    // First time: numeric setup code from admin (8 digits)
    function viewCode() {
      steps(1);
      body.innerHTML = `<h3 class="pw-h">৮ সংখ্যার কোড লেখো</h3>
        <p class="pw-p">অ্যাডমিন যে <b>৮ সংখ্যার কোড</b> দিয়েছে সেটা লেখো। এই কোড দিয়ে ঢুকে তুমি নতুন PIN বানাবে।</p>
        ${padHtml(8, false)}
        <button class="pw-btn" id="pwGo" type="button"><span>পরের ধাপ</span>${pwSvg("right", 18)}</button>
        <button class="pw-link" id="pwOld" type="button">কোডে অক্ষর আছে?</button>`;
      const pad = mountPad(8, false, submit);
      async function submit(v) {
        v = v || pad.get();
        if (v.length !== 8) return pad.fail("৮ সংখ্যার কোড লেখো।");
        const b = body.querySelector("#pwGo"); pad.lock(true); busy(b, "যাচাই হচ্ছে…"); setStatus("");
        try { const r = await studentLogin(student.studentId, v); r.needsNewPassword ? viewNewPin() : done(true); }
        catch (e) { pad.lock(false); idle(b); pad.fail("কোডটা মেলেনি। অ্যাডমিনের দেওয়া কোড আবার দেখে লেখো।"); }
      }
      body.querySelector("#pwGo").addEventListener("click", () => submit());
      body.querySelector("#pwOld").addEventListener("click", () => viewTextEntry("সেটআপ কোড লেখো", "অ্যাডমিনের পাঠানো কোডটা এখানে লেখো।", "সেটআপ কোড", "কোডটা মেলেনি। অ্যাডমিনের পাঠানো কোড আবার দেখে লেখো।"));
    }

    // Choose a new 6-digit PIN (enter, then confirm)
    function viewNewPin() {
      migrating = true;
      steps(2);
      let first = "";
      const stage1 = () => {
        first = "";
        body.innerHTML = `<h3 class="pw-h">নিজের PIN বানাও</h3>
          <p class="pw-p">এখন থেকে এই <b>${PIN_LENGTH} সংখ্যার PIN</b> দিয়েই ঢুকবে। সহজ PIN (111111, 123456) চলবে না, আর নিজে মনে রাখো।</p>
          ${padHtml(PIN_LENGTH, true)}`;
        const pad = mountPad(PIN_LENGTH, true, (v) => {
          const bad = validatePin(v);
          if (bad) return pad.fail(bad);
          first = v; stage2();
        });
      };
      const stage2 = () => {
        body.innerHTML = `<h3 class="pw-h">আবার লেখো</h3>
          <p class="pw-p">নিশ্চিত হতে একই PIN আরেকবার লেখো।</p>
          ${padHtml(PIN_LENGTH, true)}
          <button class="pw-link" id="pwRedo" type="button">${pwSvg("left", 16)}<span>PIN বদলাবো</span></button>`;
        const pad = mountPad(PIN_LENGTH, true, async (v) => {
          if (v !== first) return pad.fail("দুটি PIN মেলেনি। আবার লেখো।");
          pad.lock(true); setStatus("সেভ হচ্ছে…");
          try { await setNewPassword(student.studentId, v); migrating = false; done(true); }
          catch (e) { pad.lock(false); pad.fail(friendlyStudentAuthError(e)); }
        });
        body.querySelector("#pwRedo").addEventListener("click", stage1);
      };
      stage1();
    }

    function viewApply() {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-ic">${pwSvg("user", 22)}</div>
        <h3 class="pw-h">PIN এখনো সেট নেই</h3>
        <p class="pw-p">তোমার প্রোফাইলে এখনো PIN বানানো হয়নি। PIN বানাতে অ্যাডমিনের কাছ থেকে একটা <b>৮ সংখ্যার কোড</b> লাগবে। নিচের বাটনে চাপলে অ্যাডমিন তোমার আবেদন দেখতে পাবে।</p>
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">কোডের জন্য আবেদন করো</button>
        <button class="pw-link" id="pwHave" type="button">আমার কাছে কোড আছে</button>`;
      body.querySelector("#pwGo").addEventListener("click", async (e) => {
        const b = e.currentTarget; busy(b, "পাঠানো হচ্ছে…");
        try { await requestSetupCode(student, "setup"); viewPending("setup"); }
        catch (err) { setErr("আবেদন পাঠানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।"); idle(b); }
      });
      body.querySelector("#pwHave").addEventListener("click", viewCode);
    }

    function viewPending(type) {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-ic ok">${pwSvg("check", 22)}</div>
        <h3 class="pw-h">আবেদন পাঠানো হয়েছে</h3>
        <p class="pw-p">অ্যাডমিন তোমার আবেদন দেখতে পাবে এবং তোমাকে ${type === "reset" ? "নতুন " : ""}৮ সংখ্যার কোড পাঠাবে। কোড পেলে আবার এখানে এসে <b>নিজের নাম চাপো</b>, তারপর কোডটা লিখবে।</p>
        <button class="pw-btn" id="pwOk" type="button">ঠিক আছে</button>`;
      body.querySelector("#pwOk").addEventListener("click", () => done(false));
    }

    function viewForgot() {
      stepsEl.innerHTML = "";
      body.innerHTML = `<div class="pw-ic">${pwSvg("help", 22)}</div>
        <h3 class="pw-h">PIN ভুলে গেছো?</h3>
        <p class="pw-p">সমস্যা নেই। আবেদন পাঠাও — অ্যাডমিন তোমার PIN রিসেট করে নতুন ৮ সংখ্যার কোড দেবে, তারপর তুমি নতুন PIN বানাবে।</p>
        <div class="pw-err"></div>
        <button class="pw-btn" id="pwGo" type="button">রিসেটের আবেদন পাঠাও</button>
        <button class="pw-link" id="pwBack" type="button">${pwSvg("left", 16)}<span>ফিরে যাও</span></button>`;
      body.querySelector("#pwBack").addEventListener("click", () => backToLogin());
      body.querySelector("#pwGo").addEventListener("click", async (e) => {
        const b = e.currentTarget; busy(b, "পাঠানো হচ্ছে…");
        try { await requestSetupCode(student, "reset"); viewPending("reset"); }
        catch (err) { setErr("আবেদন পাঠানো যায়নি। আবার চেষ্টা করো।"); idle(b); }
      });
    }

    // ---- decide which screen to open first ----
    viewChecking();
    getStudentAuthStatus(student.studentId).then(st => {
      if (st.hasAccount && st.passwordSet && !st.pinSet) viewLegacy();
      else if (st.hasAccount && st.passwordSet) viewLogin(st.pending ? "তোমার রিসেটের আবেদন অ্যাডমিনের কাছে পাঠানো আছে।" : "");
      else if (st.hasAccount) viewCode();
      else if (st.pending) viewPending(st.pending.type);
      else viewApply();
    }).catch(() => viewLogin());
  });
}

// After login, go back to where the student came from (e.g. a Battle QR link).
function safeNext() {
  const n = new URLSearchParams(location.search).get("next") || "";
  return /^student\/[A-Za-z0-9_-]+\.html(\?[A-Za-z0-9=&_%-]*)?$/.test(n) ? "./" + n : null;
}

// ---------------------------------------------------------------
// First entry after the admin approved the application -> approval animation once.
// The "pending welcome" flag lives in the database (studentAuthState).
// ---------------------------------------------------------------
function showApprovalWelcome(student) {
  return new Promise((resolve) => {
    const colors = ["#2f7d5e", "#b8863c", "#e0b25a", "#4aa883", "#d96b5f", "#6c8cd5", "#ffffff"];
    const cf = Array.from({ length: 40 }, (_, i) =>
      `<i style="--x:${Math.round(Math.random() * 100)}%;--c:${colors[i % colors.length]};--d:${(2.6 + Math.random() * 2).toFixed(2)}s;--dl:${(Math.random() * 1.2).toFixed(2)}s"></i>`).join("");
    const ov = document.createElement("div");
    ov.className = "wl-ov";
    ov.innerHTML = `<div class="wl-cf">${cf}</div>
      <div class="wl-box">
        <div class="wl-check"><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="wl-h">অনুমোদন হয়ে গেছে!</div>
        <div class="wl-n">স্বাগতম, ${esc(student.name || "")}</div>
        <div class="wl-id">${esc(student.studentId || "")}</div>
        <p class="wl-p">তোমার আবেদন অ্যাডমিন গ্রহণ করেছেন। এখন থেকে তুমি পরীক্ষা প্রস্তুতির অংশ — শুভ যাত্রা!</p>
        <button type="button" class="wl-go">শুরু করো</button>
      </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add("show"));
    try { navigator.vibrate?.([30, 40, 30]); } catch {}
    ov.querySelector(".wl-go").onclick = () => { ov.classList.remove("show"); setTimeout(() => { ov.remove(); resolve(); }, 350); };
  });
}

async function selectStudent(student, btnElement) {
  if (btnElement) { btnElement.classList.add("is-loading"); }

  // Already signed in as this exact student on this device? Skip the prompt.
  let sessionSid = await currentStudentSession();
  if (sessionSid === student.studentId) {
    // Old session on a letter password? Force the one-time PIN switch.
    const st = await getStudentAuthStatus(student.studentId).catch(() => null);
    if (st && st.hasAccount && st.passwordSet && !st.pinSet) { await studentLogout().catch(() => {}); sessionSid = null; }
  }
  if (sessionSid !== student.studentId) {
    const ok = await askStudentPassword(student);
    if (!ok) { btnElement?.classList.remove("is-loading"); return; }
  }

  if (await getWelcomePending(student.studentId)) {
    await showApprovalWelcome(student);
    await markWelcomeSeen(student.studentId);
  }

  setActiveStudent(student);
  try {
    localStorage.setItem(LAST_KEY, student.studentId);
    localStorage.setItem(PROFILE_KEY, JSON.stringify({ studentId: student.studentId, name: student.name || "", className: student.className || "", photoURL: typeof student.photoURL === "string" ? student.photoURL : "" }));
  } catch {}
  const nextUrl = safeNext();
  if (nextUrl) { window.location.href = nextUrl; return; }
  const active = await findActiveAttempt(student.studentId);
  if (active) {
    window.location.href = `./student/exam.html?examId=${active.examId}&resume=1`;
  } else {
    window.location.href = "./student/dashboard.html";
  }
}


// ---------------------------------------------------------------
// Personal welcome-back. If this device remembers a student (localStorage),
// ONLY that student's name is shown — big, in its own design — and nobody
// else's. "অন্য প্রোফাইল খুঁজুন" opens the normal list; a name picked there is
// shown in the same personal design before asking for the PIN. With nothing
// remembered the page is exactly the normal list.
// ---------------------------------------------------------------
const PROFILE_KEY = "lastStudentProfile";
let rememberedId = "";
let remembered = null;
try {
  rememberedId = localStorage.getItem(LAST_KEY) || "";
  const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
  if (p && p.studentId === rememberedId) remembered = p;
} catch {}
const desktopMq = window.matchMedia("(min-width: 960px)");   // PC: hero left + student list right
function isDesktop() { return desktopMq.matches; }
let shownId = "";                             // id of the student currently previewed in the hero (PC list highlight)
let view = rememberedId ? "hero" : "list";   // "hero" | "list"
let heroStudent = null;                       // student shown in the hero (null = the remembered one)
const appShell = document.getElementById("appShell");
const heroEl = document.getElementById("meHero");

function rememberedStudent() {
  if (!rememberedId) return null;
  if (allStudents.length) return allStudents.find(x => safeStudentId(x) === rememberedId) || null; // list loaded: must still exist
  return remembered;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "শুভ রাত্রি" : h < 12 ? "শুভ সকাল" : h < 15 ? "শুভ দুপুর" : h < 18 ? "শুভ বিকেল" : h < 20 ? "শুভ সন্ধ্যা" : "শুভ রাত্রি";
}

let shownKey = "";
function renderView(animate = false) {
  const me = rememberedStudent();
  appShell.classList.toggle("has-remembered", !!me);
  if (!me && !heroStudent) view = "list";
  if (isDesktop() && me && !heroStudent) view = "hero";   // PC always shows a profile on the left when it knows you
  const st = view === "hero" ? (heroStudent || me) : null;
  appShell.classList.toggle("hero-mode", !!st);
  appShell.classList.toggle("list-mode", !st);
  markActive(st ? safeStudentId(st) : "");
  if (!st) {
    const back = document.getElementById("meBack");
    if (me) back.innerHTML = `${avatarHtml(me)}<span class="t">${esc(safeStudentName(me))} হিসেবে ফিরে যাও</span>`;
    return;
  }
  const picked = !!heroStudent && safeStudentId(heroStudent) !== rememberedId;
  const key = safeStudentId(st) + "|" + safeStudentName(st) + "|" + (picked ? "p" : "m");
  if (key === shownKey && !animate) return;     // list refreshed in the background — nothing changed
  shownKey = key;
  document.getElementById("meHello").textContent = picked ? "এই প্রোফাইলটাই কি তোমার?" : greeting() + " 👋";
  document.getElementById("meAv").innerHTML = avatarHtml(st, "me-av-in");
  document.getElementById("meName").textContent = safeStudentName(st);
  const batch = document.getElementById("meBatch");
  batch.textContent = st.className || ""; batch.style.display = st.className ? "" : "none";
  document.getElementById("meId").textContent = safeStudentId(st);
  const other = document.getElementById("meOther");
  other.style.display = "";
  if (isDesktop()) {
    if (picked && me) { other.dataset.act = "back"; other.innerHTML = `${pwSvg("left", 16)} ${esc(safeStudentName(me))} হিসেবে ফিরে যাও`; }
    else if (picked) { other.dataset.act = ""; other.style.display = "none"; }
    else { other.dataset.act = "search"; other.innerHTML = `আমি নই — ডানদিকের তালিকা থেকে বেছে নাও ${pwSvg("right", 16)}`; }
  } else {
    other.dataset.act = "list";
    other.innerHTML = picked
      ? `${pwSvg("left", 16)} অন্য নাম দেখো`
      : `আমি নই — অন্য প্রোফাইল খুঁজুন ${pwSvg("right", 16)}`;
  }
  document.getElementById("meGo").dataset.sid = safeStudentId(st);
  heroEl.classList.remove("in"); void heroEl.offsetWidth; heroEl.classList.add("in");
}

document.getElementById("meGo").addEventListener("click", function () {
  const st = (view === "hero" && (heroStudent || rememberedStudent())) || null;
  if (st) selectStudent(st, this);
});
// Highlight (and on PC scroll to) the row whose profile is shown on the left.
let scrolledToActive = false;
function markActive(id) {
  shownId = id;
  let row = null;
  listEl.querySelectorAll(".student-card").forEach(el => {
    const on = !!id && el.dataset.sid === id;
    el.classList.toggle("is-active", on);
    if (on) row = el;
  });
  if (row && isDesktop() && !scrolledToActive) {
    scrolledToActive = true;
    listEl.scrollTop = Math.max(0, row.offsetTop - listEl.clientHeight / 2 + row.offsetHeight / 2);
  }
}
document.getElementById("meOther").addEventListener("click", function () {
  const act = this.dataset.act;
  if (act === "search") { searchInput?.focus(); return; }
  if (act === "back") { heroStudent = null; shownKey = ""; renderView(true); return; }
  view = "list"; heroStudent = null; shownKey = ""; renderView();
  window.scrollTo({ top: 0 });
});
// Crossing the PC/phone breakpoint (rotate, resize): redraw the right layout.
desktopMq.addEventListener?.("change", () => { shownKey = ""; scrolledToActive = false; renderView(true); });
document.getElementById("meBack").addEventListener("click", () => {
  view = "hero"; heroStudent = null; renderView(true);
  window.scrollTo({ top: 0 });
});
// First paint: from the saved profile, before any list has loaded.
if (rememberedId && remembered) renderView(true);

searchInput?.addEventListener("input", () => {
  activeSearch = normalized(searchInput.value);
  applySearchAndClassFilter();
});

searchClear?.addEventListener("click", () => {
  if (searchInput) searchInput.value = "";
  activeSearch = "";
  applySearchAndClassFilter();
  searchInput?.focus();
});

try {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
  if (cached && cached.length) {
    allStudents = sortStudents(cached);
    applySearchAndClassFilter();
  }
} catch {}

async function loadStudents() {
  try {
    const fresh = await getActiveStudents();
    allStudents = sortStudents(fresh);
    applySearchAndClassFilter();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch {}
  } catch (err) {
    console.error(err);
    if (students.length === 0) renderState(listEl, "error", "শিক্ষার্থীদের তালিকা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
  }
}

// Live pending applications (database). When one leaves "pending" (approved/rejected)
// the student list is refreshed so an approved name turns normal.
let pendingReady = false;
watchPendingApplications((apps, err) => {
  if (err || !apps) return;
  const before = new Set(pendingApps.map(a => a.id));
  const after = new Set(apps.map(a => a.id));
  const someLeft = [...before].some(id => !after.has(id));
  pendingApps = apps;
  if (allStudents.length) applySearchAndClassFilter();
  if (pendingReady && someLeft) loadStudents();
  pendingReady = true;
});

loadStudents();
</script>
</body>
</html>
